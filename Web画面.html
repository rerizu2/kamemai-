<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速画面共有 & 録画 (マイク対応)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00d1ff; }
        
        button { 
            width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-main { background: #007bff; color: white; }
        .btn-record { background: #dc3545; color: white; }
        .btn-sub { background: #444; color: white; }
        .btn-scan { background: #28a745; color: white; }
        button:disabled { background: #888; cursor: not-allowed; }
        button:active { transform: scale(0.98); }

        input { 
            width: calc(100% - 24px); padding: 12px; margin: 10px 0; border-radius: 8px; 
            border: 1px solid #444; background: #000; color: #fff; font-size: 24px; text-align: center;
            letter-spacing: 5px;
        }

        video { width: 100%; border-radius: 10px; display: none; margin-top: 10px; border: 1px solid #555; background: #000; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 15px 0; }
        #reader { width: 100%; margin-top: 10px; border-radius: 10px; overflow: hidden; }

        .status { font-size: 14px; color: #aaa; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>画面共有 & 録画</h2>

    <div id="mode-selection">
        <button class="btn-main" onclick="initAsScreenShare()">💻 画面を共有する (マイク込)</button>
        <button class="btn-sub" onclick="showMonitorSetup()">🖥️ 別の画面を見る</button>
    </div>

    <!-- 共有側UI -->
    <div id="screen-ui" class="hidden">
        <p class="status">視聴側にこの4桁の数字を伝えてください</p>
        <div style="font-size: 48px; font-weight: bold; color: #00d1ff; letter-spacing: 10px;" id="my-id-text">----</div>
        <div id="qrcode"></div>
        <p>プレビュー (マイク音はハウリング防止で消音中)</p>
        <video id="local-video" autoplay playsinline muted></video>
        <button class="btn-sub" onclick="location.reload()">共有を停止</button>
    </div>

    <!-- 視聴側セットアップUI -->
    <div id="monitor-setup" class="hidden">
        <p>接続方法を選んでください</p>
        <button class="btn-scan" onclick="startQRScanner()">📷 QRをスキャン</button>
        <div id="reader"></div>
        <input type="number" id="peer-id-input" placeholder="4桁のID" maxlength="4">
        <button class="btn-main" onclick="connectViaInput()">接続して画面を見る</button>
        <button class="btn-sub" onclick="location.reload()">戻る</button>
    </div>

    <!-- 視聴側メインUI -->
    <div id="monitor-display" class="hidden">
        <div class="status" id="conn-status">接続中...</div>
        <video id="remote-video" autoplay playsinline controls></video>
        
        <div id="record-controls" style="margin-top: 15px;">
            <button id="start-rec" class="btn-record" onclick="startRecording()">🔴 録画開始</button>
            <button id="stop-rec" class="btn-sub hidden" onclick="stopRecording()">⏹️ 録画停止・保存</button>
        </div>

        <button class="btn-sub" style="margin-top:20px;" onclick="location.reload()">切断して終了</button>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let mediaRecorder;
    let recordedChunks = [];

    // 4桁のランダムな数字を生成
    function generateShortId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // --- 共有側 (Sender) ---
    async function initAsScreenShare() {
        try {
            // 1. 画面共有ストリームを取得
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { frameRate: { ideal: 30 } },
                audio: true // システム音を含める
            });

            // 2. マイクストリームを取得
            let micStream;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                console.warn("マイクの使用が拒否されました。画面音のみ送信します。");
            }

            // 3. 画面音とマイク音をミックス
            const audioContext = new AudioContext();
            const destination = audioContext.createMediaStreamDestination();
            
            if (screenStream.getAudioTracks().length > 0) {
                audioContext.createMediaStreamSource(screenStream).connect(destination);
            }
            if (micStream) {
                audioContext.createMediaStreamSource(micStream).connect(destination);
            }

            // 4. 送信用ストリームの組み立て
            localStream = new MediaStream([
                screenStream.getVideoTracks()[0],
                ...destination.stream.getAudioTracks()
            ]);

            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('local-video').style.display = "block";
            showUI('screen-ui');

            startPeerServer();

            // 共有停止時の処理
            screenStream.getVideoTracks()[0].onended = () => location.reload();

        } catch (e) { 
            console.error(e);
            alert("開始できませんでした。権限を確認してください。"); 
        }
    }

    function startPeerServer() {
        const shortId = generateShortId();
        peer = new Peer(shortId);

        peer.on('open', (id) => {
            document.getElementById('my-id-text').innerText = id;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 180, height: 180 });
        });

        // 受信側から着信があったらストリームを返す
        peer.on('call', (call) => {
            call.answer(localStream);
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') startPeerServer();
        });
    }

    // --- 視聴側 (Receiver) ---
    function showMonitorSetup() {
        showUI('monitor-setup');
        peer = new Peer(); 
    }

    function connectViaInput() {
        const id = document.getElementById('peer-id-input').value;
        if (id) connectToPeer(id);
    }

    function startQRScanner() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
            html5QrCode.stop();
            connectToPeer(decodedText);
        });
    }

    function connectToPeer(targetId) {
        showUI('monitor-display');
        
        // 相手に発信する (MediaConnection)
        // 引数に空のストリームを渡すか、何も渡さない
        const call = peer.call(targetId, new MediaStream());

        call.on('stream', (remoteStream) => {
            document.getElementById('conn-status').innerText = "受信中 (音声あり)";
            const video = document.getElementById('remote-video');
            video.srcObject = remoteStream;
            video.style.display = "block";
            window.remoteStream = remoteStream; // 録画用に保存
        });

        call.on('close', () => {
            alert("接続が終了しました");
            location.reload();
        });
    }

    // --- 録画機能 ---
    function startRecording() {
        recordedChunks = [];
        const stream = window.remoteStream;
        if (!stream) return alert("ストリームが見つかりません");

        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `recording_${new Date().getTime()}.webm`;
            a.click();
        };

        mediaRecorder.start();
        document.getElementById('start-rec').classList.add('hidden');
        document.getElementById('stop-rec').classList.remove('hidden');
        document.getElementById('conn-status').innerText = "🔴 録画中...";
    }

    function stopRecording() {
        mediaRecorder.stop();
        document.getElementById('start-rec').classList.remove('hidden');
        document.getElementById('stop-rec').classList.add('hidden');
        document.getElementById('conn-status').innerText = "録画を保存しました";
    }

    function showUI(uiId) {
        ['mode-selection', 'screen-ui', 'monitor-setup', 'monitor-display'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
