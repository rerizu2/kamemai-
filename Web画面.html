<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面共有 (動作確認・軽量版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: auto; background: #2a2a2a; padding: 15px; border-radius: 12px; }
        .btn { padding: 12px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-main { background: #007bff; color: white; width: 100%; font-size: 16px; }
        .btn-add { background: #28a745; color: white; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; width: 100px; font-size: 18px; }
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-top: 15px; }
        .screen-box { background: #000; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        .status-tag { font-size: 11px; color: #0f0; margin-bottom: 4px; display: block; }
        img { width: 100%; border-radius: 4px; background: #111; min-height: 150px; }
        #log { font-size: 10px; color: #aaa; background: #000; padding: 8px; margin-top: 10px; text-align: left; height: 60px; overflow-y: auto; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3>高速画面共有</h3>
    <div id="log">システム待機中...</div>

    <div id="mode-selection">
        <button class="btn btn-main" onclick="startBroadcaster()">💻 画面を配信する</button>
        <button class="btn btn-main" style="background:#6610f2; margin-top:10px;" onclick="startViewer()">🖥️ 画面を視聴する</button>
    </div>

    <!-- 配信側 -->
    <div id="ui-broadcast" class="hidden">
        <p>視聴側でこの4桁を入力してください</p>
        <div style="font-size: 40px; font-weight: bold; color: #00d1ff;" id="my-id">----</div>
        <div id="qrcode" style="background:white; padding:10px; display:inline-block; margin:10px;"></div>
        <video id="preview" autoplay playsinline muted style="width:100%; max-width:400px; border:1px solid #555;"></video>
        <canvas id="cap-canvas" class="hidden"></canvas>
    </div>

    <!-- 視聴側 -->
    <div id="ui-view" class="hidden">
        <input type="number" id="input-id" placeholder="4桁ID">
        <button class="btn btn-add" onclick="addScreen()">+ 追加</button>
        <div id="monitor-grid"></div>
    </div>
</div>

<script>
    const PREFIX = "SCR10-";
    let peer;
    const log = (m) => { const e = document.getElementById('log'); e.innerHTML += `> ${m}<br>`; e.scrollTop = e.scrollHeight; };

    // 環境チェック
    if (location.protocol === 'file:') {
        alert("【エラー】このプログラムはファイルをダブルクリックでは動きません。GitHub Pagesなどのサーバーにアップロードするか、ローカルサーバー(VSCode Live Server等)で実行してください。");
    }

    // --- 配信側ロジック ---
    async function startBroadcaster() {
        log("配信準備中...");
        const video = document.getElementById('preview');
        const canvas = document.getElementById('cap-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { frameRate: 10, width: { max: 800 } } 
            });
            video.srcObject = stream;
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('ui-broadcast').classList.remove('hidden');
        } catch (e) { log("エラー: 共有が拒否されました"); return; }

        const id = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(PREFIX + id, { debug: 1 });

        peer.on('open', (fullId) => {
            const shortId = fullId.replace(PREFIX, "");
            document.getElementById('my-id').innerText = shortId;
            new QRCode(document.getElementById("qrcode"), { text: shortId, width: 120, height: 120 });
            log("配信待機中：ID " + shortId);
        });

        peer.on('connection', (conn) => {
            log("視聴者が接続しました");
            // 0.1秒おきに送信
            setInterval(() => {
                if (conn.open && video.readyState >= 2) {
                    const w = 640;
                    const h = w * (video.videoHeight / video.videoWidth);
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(video, 0, 0, w, h);
                    // 画質を0.2まで下げて転送速度を最優先
                    conn.send(canvas.toDataURL('image/jpeg', 0.2));
                }
            }, 100);
        });
    }

    // --- 視聴側ロジック ---
    function startViewer() {
        document.getElementById('mode-selection').classList.add('hidden');
        document.getElementById('ui-view').classList.remove('hidden');
        peer = new Peer({ debug: 1 });
        log("視聴モード準備完了");
    }

    function addScreen() {
        const id = document.getElementById('input-id').value;
        if (!id) return;
        
        log(id + " へ接続試行...");
        const conn = peer.connect(PREFIX + id);
        
        const grid = document.getElementById('monitor-grid');
        const box = document.createElement('div');
        box.className = 'screen-box';
        box.innerHTML = `<span class="status-tag" id="st-${id}">接続中...</span><img id="img-${id}">`;
        grid.appendChild(box);

        conn.on('open', () => {
            log(id + " 接続成功！");
            document.getElementById(`st-${id}`).innerText = "● LIVE (" + id + ")";
        });

        conn.on('data', (data) => {
            // 受信したデータを画像に流し込む
            document.getElementById(`img-${id}`).src = data;
        });

        conn.on('close', () => {
            log(id + " 切断されました");
            document.getElementById(`st-${id}`).innerText = "OFFLINE";
            document.getElementById(`st-${id}`).style.color = "red";
        });
    }
</script>
</body>
</html>
