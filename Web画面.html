<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速画面共有 (マイク・録画対応版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00d1ff; }
        
        button { 
            width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-main { background: #007bff; color: white; }
        .btn-sub { background: #444; color: white; }
        .btn-scan { background: #28a745; color: white; }
        .btn-record { background: #dc3545; color: white; }
        .btn-recording { background: #ffc107; color: black; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        button:active { transform: scale(0.98); }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }

        input { 
            width: calc(100% - 24px); padding: 12px; margin: 10px 0; border-radius: 8px; 
            border: 1px solid #444; background: #000; color: #fff; font-size: 24px; text-align: center;
            letter-spacing: 5px;
        }

        #display-img { width: 100%; border-radius: 10px; background: #000; display: none; margin-top: 15px; }
        video { width: 100%; border-radius: 10px; display: none; margin-top: 10px; border: 1px solid #555; }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 15px 0; }
        #reader { width: 100%; margin-top: 10px; border-radius: 10px; overflow: hidden; }

        .status { font-size: 14px; color: #aaa; margin: 10px 0; }
        .hidden { display: none; }
        #record-status { color: #ff4444; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>高速画面共有 + マイク</h2>
    
    <div id="mode-selection">
        <button class="btn-main" onclick="initAsScreenShare()">💻 画面とマイクを共有</button>
        <button class="btn-sub" onclick="showMonitorSetup()">🖥️ 別の画面を見る</button>
    </div>

    <!-- 共有側UI -->
    <div id="screen-ui" class="hidden">
        <div id="my-id-text" style="font-size: 48px; font-weight: bold; color: #00d1ff; letter-spacing: 10px;">----</div>
        <div id="qrcode"></div>
        <div id="record-status-sender" class="hidden">● 録画中 (音声込)...</div>
        <button id="btn-record-sender" class="btn-record" onclick="toggleRecording('sender')">🔴 録画開始</button>
        <video id="temp-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
        <button class="btn-sub" onclick="location.reload()">共有を停止</button>
    </div>

    <!-- 接続設定UI -->
    <div id="monitor-setup" class="hidden">
        <button class="btn-scan" onclick="startQRScanner()">📷 QRをスキャン</button>
        <div id="reader"></div>
        <input type="number" id="peer-id-input" placeholder="4桁のID" maxlength="4">
        <button class="btn-main" onclick="connectViaInput()">接続して画面を見る</button>
        <button class="btn-sub" onclick="location.reload()">戻る</button>
    </div>

    <!-- 受信側UI -->
    <div id="monitor-display" class="hidden">
        <div class="status" id="conn-status">接続中...</div>
        <div id="record-status-receiver" class="hidden">● 録画中 (音声込)...</div>
        <button id="btn-record-receiver" class="btn-record" onclick="toggleRecording('receiver')">🔴 画面と音声を録画</button>
        <img id="display-img" src="" alt="画面受信中">
        <!-- 音声再生用 -->
        <audio id="remote-audio" autoplay></audio>
        <!-- 受信録画用の隠しキャンバス -->
        <canvas id="record-canvas" class="hidden"></canvas>
        <button class="btn-sub" style="margin-top:20px;" onclick="location.reload()">切断して終了</button>
    </div>
</div>

<script>
    let peer;
    let conn;
    let worker;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let localStream; // マイク＋画面のストリーム
    let remoteStream; // 受信した音声ストリーム
    
    const INTERVAL = 100; 
    const IMG_WIDTH = 800; 
    const QUALITY = 0.4;

    const workerCode = `
        let timer;
        self.onmessage = function(e) {
            if (e.data === 'start') {
                timer = setInterval(() => self.postMessage('tick'), ${INTERVAL});
            } else if (e.data === 'stop') {
                clearInterval(timer);
            }
        };
    `;

    function generateShortId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // --- 録画ロジック ---
    function setupRecorder(stream) {
        recordedChunks = [];
        // 音声トラックがあるか確認
        const options = { mimeType: 'video/webm;codecs=vp9,opus' };
        mediaRecorder = new MediaRecorder(stream, options);
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sharing_record_${new Date().getTime()}.webm`;
            a.click();
            window.URL.revokeObjectURL(url);
        };
    }

    function toggleRecording(mode) {
        const btn = mode === 'sender' ? document.getElementById('btn-record-sender') : document.getElementById('btn-record-receiver');
        const status = mode === 'sender' ? document.getElementById('record-status-sender') : document.getElementById('record-status-receiver');

        if (!isRecording) {
            let combinedStream;
            if (mode === 'sender') {
                combinedStream = localStream; 
            } else {
                // 受信側の録画: キャンバス映像 + 受信音声
                const canvas = document.getElementById('record-canvas');
                const videoStream = canvas.captureStream(15);
                combinedStream = new MediaStream([...videoStream.getVideoTracks()]);
                if (remoteStream && remoteStream.getAudioTracks().length > 0) {
                    combinedStream.addTrack(remoteStream.getAudioTracks()[0]);
                }
            }
            
            if (!combinedStream) return alert("ストリームが準備できていません");
            
            setupRecorder(combinedStream);
            mediaRecorder.start();
            isRecording = true;
            btn.innerText = "⏹ 録画停止・保存";
            btn.classList.add('btn-recording');
            status.classList.remove('hidden');
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.innerText = mode === 'sender' ? "🔴 録画開始" : "🔴 画面と音声を録画";
            btn.classList.remove('btn-recording');
            status.classList.add('hidden');
        }
    }

    // --- 送信側処理 ---
    async function initAsScreenShare() {
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        try {
            // 画面共有とマイクを両方取得
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            let micStream;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch(e) {
                console.log("マイクなしで続行します");
            }

            // ストリームを合成 (録画・送信用)
            localStream = new MediaStream([...screenStream.getVideoTracks()]);
            if (micStream) micStream.getAudioTracks().forEach(track => localStream.addTrack(track));
            if (screenStream.getAudioTracks().length > 0) screenStream.getAudioTracks().forEach(track => localStream.addTrack(track));

            video.srcObject = screenStream;
            video.style.display = "block";
            showUI('screen-ui');
            screenStream.getVideoTracks()[0].onended = () => location.reload();
        } catch (e) { 
            alert("開始できませんでした: " + e); 
            return; 
        }

        const attemptPeerConnection = () => {
            const shortId = generateShortId();
            peer = new Peer(shortId);

            peer.on('open', (id) => {
                document.getElementById('my-id-text').innerText = id;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: id, width: 180, height: 180 });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') attemptPeerConnection();
            });

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            // データ接続と音声コールの両方を管理
            peer.on('connection', (connection) => {
                conn = connection;
                // 接続してきた相手にマイク音声を送る
                peer.call(conn.peer, localStream);

                worker.onmessage = () => {
                    if (conn && conn.open && video.readyState === video.HAVE_ENOUGH_DATA) {
                        const ratio = video.videoHeight / video.videoWidth;
                        canvas.width = IMG_WIDTH;
                        canvas.height = IMG_WIDTH * ratio;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send(canvas.toDataURL('image/jpeg', QUALITY)); 
                    }
                };
                worker.postMessage('start');
            });
        };
        attemptPeerConnection();
    }

    // --- 受信側処理 ---
    function showMonitorSetup() {
        showUI('monitor-setup');
        peer = new Peer();
        
        // 音声着信時の処理
        peer.on('call', (call) => {
            call.answer(); // 応答する
            call.on('stream', (stream) => {
                remoteStream = stream;
                document.getElementById('remote-audio').srcObject = stream;
            });
        });
    }

    function connectViaInput() {
        const id = document.getElementById('peer-id-input').value;
        if (id) connectToPeer(id);
    }

    function startQRScanner() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
            html5QrCode.stop();
            connectToPeer(decodedText);
        });
    }

    function connectToPeer(targetId) {
        showUI('monitor-display');
        const displayImg = document.getElementById('display-img');
        const recordCanvas = document.getElementById('record-canvas');
        const recordCtx = recordCanvas.getContext('2d');

        conn = peer.connect(targetId);
        conn.on('open', () => {
            document.getElementById('conn-status').innerText = "接続成功！画面と音声を受信中...";
            displayImg.style.display = "block";
        });

        conn.on('data', (data) => {
            displayImg.src = data;
            
            // 録画中ならキャンバスを更新
            if (isRecording) {
                const img = new Image();
                img.onload = () => {
                    recordCanvas.width = img.width;
                    recordCanvas.height = img.height;
                    recordCtx.drawImage(img, 0, 0);
                };
                img.src = data;
            }
        });

        conn.on('close', () => {
            alert("接続が終了しました");
            location.reload();
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'screen-ui', 'monitor-setup', 'monitor-display'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
