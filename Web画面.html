<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超高速画面共有 (バイナリ転送版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; background: #2a2a2a; padding: 15px; border-radius: 12px; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #007bff; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-top: 15px; }
        .screen-box { background: #000; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        img { width: 100%; border-radius: 4px; background: #111; min-height: 200px; object-fit: contain; }
        .fps-counter { font-size: 10px; color: #0f0; }
        .hidden { display: none; }
        #log { font-size: 11px; color: #aaa; background: #000; padding: 10px; margin: 10px 0; text-align: left; height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h3>高速画面共有 (バイナリ転送)</h3>
    <div id="log">起動待機中...</div>

    <div id="setup">
        <button onclick="startBroadcast()">💻 配信を開始する</button>
        <button onclick="startViewer()" style="background:#6610f2;">🖥️ 視聴を開始する</button>
    </div>

    <div id="broadcaster" class="hidden">
        <p>配信ID: <span id="my-id" style="font-size:24px; color:#00d1ff; font-weight:bold;">----</span></p>
        <div id="qrcode"></div>
        <video id="v-preview" autoplay playsinline muted style="width:200px; border:1px solid #444;"></video>
        <canvas id="c-canvas" class="hidden"></canvas>
    </div>

    <div id="viewer" class="hidden">
        <input type="number" id="join-id" placeholder="4桁ID" style="padding:10px; width:80px;">
        <button onclick="joinStream()">+ 画面追加</button>
        <div id="monitor-grid" class="grid"></div>
    </div>
</div>

<script>
    const APP_ID = "BIN-SCR-";
    let peer;
    const log = (m) => { const e = document.getElementById('log'); e.innerHTML += `> ${m}<br>`; e.scrollTop = e.scrollHeight; };

    // --- 配信側 ---
    async function startBroadcast() {
        const video = document.getElementById('v-preview');
        const canvas = document.getElementById('c-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { frameRate: 15, width: { ideal: 1280 } } 
            });
            video.srcObject = stream;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('broadcaster').classList.remove('hidden');
        } catch (e) { alert("画面共有に失敗しました"); return; }

        const id = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(APP_ID + id, {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (fullId) => {
            const shortId = fullId.replace(APP_ID, "");
            document.getElementById('my-id').innerText = shortId;
            new QRCode(document.getElementById("qrcode"), { text: shortId, width: 120, height: 120 });
            log("サーバー接続完了。ID: " + shortId);
        });

        peer.on('connection', (conn) => {
            log("視聴者が接続しました。転送を開始します。");
            
            // 0.1秒ごとの定期実行
            setInterval(() => {
                if (conn.open && video.readyState >= 2) {
                    const w = 800; // 転送サイズ
                    const h = w * (video.videoHeight / video.videoWidth);
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(video, 0, 0, w, h);
                    
                    // 【重要】toBlob を使ってバイナリで送る（toDataURLより高速で軽量）
                    canvas.toBlob((blob) => {
                        if (blob) conn.send(blob); 
                    }, 'image/jpeg', 0.4); // 画質0.4
                }
            }, 100); 
        });
    }

    // --- 視聴側 ---
    function startViewer() {
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('viewer').classList.remove('hidden');
        peer = new Peer({
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });
        log("視聴モード準備完了");
    }

    function joinStream() {
        const id = document.getElementById('join-id').value;
        const conn = peer.connect(APP_ID + id);
        
        const box = document.createElement('div');
        box.className = 'screen-box';
        box.innerHTML = `<div class="fps-counter">ID: ${id} | <span id="fps-${id}">0</span>fps</div><img id="img-${id}">`;
        document.getElementById('monitor-grid').appendChild(box);

        let lastTime = Date.now();
        let frameCount = 0;
        let objectUrl = null;

        conn.on('open', () => log(id + " に接続しました"));
        
        conn.on('data', (data) => {
            if (data instanceof Blob) {
                // 前のメモリを解放してメモリリークを防ぐ
                if (objectUrl) URL.revokeObjectURL(objectUrl);
                
                // 受信したバイナリデータを画像URLに変換
                objectUrl = URL.createObjectURL(data);
                document.getElementById(`img-${id}`).src = objectUrl;

                // FPS計測
                frameCount++;
                const now = Date.now();
                if (now - lastTime >= 1000) {
                    document.getElementById(`fps-${id}`).innerText = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }
            }
        });
    }
</script>
</body>
</html>
