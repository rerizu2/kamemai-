<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速画面共有 (4桁ID版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00d1ff; }
        
        button { 
            width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-main { background: #007bff; color: white; }
        .btn-sub { background: #444; color: white; }
        .btn-scan { background: #28a745; color: white; }
        button:active { transform: scale(0.98); }

        input { 
            width: calc(100% - 24px); padding: 12px; margin: 10px 0; border-radius: 8px; 
            border: 1px solid #444; background: #000; color: #fff; font-size: 24px; text-align: center;
            letter-spacing: 5px;
        }

        #display-img { width: 100%; border-radius: 10px; background: #000; display: none; margin-top: 15px; }
        video { width: 100%; border-radius: 10px; display: none; margin-top: 10px; border: 1px solid #555; }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 15px 0; }
        #reader { width: 100%; margin-top: 10px; border-radius: 10px; overflow: hidden; }

        .status { font-size: 14px; color: #aaa; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>高速画面共有</h2>
    <p style="font-size: 12px; color: #888;">更新速度: 0.1秒 (バックグラウンド維持)</p>

    <div id="mode-selection">
        <button class="btn-main" onclick="initAsScreenShare()">💻 画面を共有する</button>
        <button class="btn-sub" onclick="showMonitorSetup()">🖥️ 別の画面を見る</button>
    </div>

    <div id="screen-ui" class="hidden">
        <p class="status">視聴側にこの4桁の数字を伝えてください</p>
        <div style="font-size: 48px; font-weight: bold; color: #00d1ff; letter-spacing: 10px;" id="my-id-text">----</div>
        <div id="qrcode"></div>
        <video id="temp-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
        <button class="btn-sub" onclick="location.reload()">共有を停止</button>
    </div>

    <div id="monitor-setup" class="hidden">
        <p>接続方法を選んでください</p>
        <button class="btn-scan" onclick="startQRScanner()">📷 QRをスキャン</button>
        <div id="reader"></div>
        <input type="number" id="peer-id-input" placeholder="4桁のID" maxlength="4" oninput="if(value.length>4)value=value.slice(0,4)">
        <button class="btn-main" onclick="connectViaInput()">接続して画面を見る</button>
        <button class="btn-sub" onclick="location.reload()">戻る</button>
    </div>

    <div id="monitor-display" class="hidden">
        <div class="status" id="conn-status">接続中...</div>
        <img id="display-img" src="" alt="画面受信中">
        <button class="btn-sub" style="margin-top:20px;" onclick="location.reload()">切断して終了</button>
    </div>
</div>

<script>
    let peer;
    let conn;
    let worker;
    
    const INTERVAL = 100; 
    const IMG_WIDTH = 800; 
    const QUALITY = 0.4;

    // Web Worker (バックグラウンドでのタイマー維持用)
    const workerCode = `
        let timer;
        self.onmessage = function(e) {
            if (e.data === 'start') {
                timer = setInterval(() => self.postMessage('tick'), ${INTERVAL});
            } else if (e.data === 'stop') {
                clearInterval(timer);
            }
        };
    `;

    // 4桁のランダムな数字を生成
    function generateShortId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    async function initAsScreenShare() {
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { frameRate: { ideal: 15 } },
                audio: false 
            });
            video.srcObject = stream;
            video.style.display = "block";
            showUI('screen-ui');
            stream.getVideoTracks()[0].onended = () => location.reload();
        } catch (e) { 
            alert("画面共有の許可が得られませんでした"); 
            return; 
        }

        // 4桁IDでPeerを作成（重複していたらエラーが出るので再試行する）
        const attemptPeerConnection = () => {
            const shortId = generateShortId();
            peer = new Peer(shortId);

            peer.on('open', (id) => {
                document.getElementById('my-id-text').innerText = id;
                document.getElementById('qrcode').innerHTML = ""; // 前のQRを消去
                new QRCode(document.getElementById("qrcode"), { text: id, width: 180, height: 180 });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // IDが既に使われていたら再試行
                    attemptPeerConnection();
                } else {
                    console.error(err);
                }
            });

            // Web Worker設定
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            peer.on('connection', (connection) => {
                conn = connection;
                worker.onmessage = () => {
                    if (conn && conn.open && video.readyState === video.HAVE_ENOUGH_DATA) {
                        const ratio = video.videoHeight / video.videoWidth;
                        canvas.width = IMG_WIDTH;
                        canvas.height = IMG_WIDTH * ratio;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send(canvas.toDataURL('image/jpeg', QUALITY)); 
                    }
                };
                worker.postMessage('start');
            });
        };

        attemptPeerConnection();
    }

    function showMonitorSetup() {
        showUI('monitor-setup');
        peer = new Peer(); // 受信側はランダムなIDでOK
    }

    function connectViaInput() {
        const id = document.getElementById('peer-id-input').value;
        if (id) connectToPeer(id);
    }

    function startQRScanner() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
            html5QrCode.stop();
            connectToPeer(decodedText);
        });
    }

    function connectToPeer(targetId) {
        showUI('monitor-display');
        conn = peer.connect(targetId);
        conn.on('open', () => {
            document.getElementById('conn-status').innerText = "接続成功！画面受信中...";
            document.getElementById('display-img').style.display = "block";
        });
        conn.on('data', (data) => {
            document.getElementById('display-img').src = data;
        });
        conn.on('close', () => {
            alert("接続が終了しました");
            location.reload();
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'screen-ui', 'monitor-setup', 'monitor-display'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
