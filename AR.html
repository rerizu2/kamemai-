<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ARで壁を作る</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #ui {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px 20px;
        font-family: sans-serif;
        border-radius: 5px;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div id="ui">「HIRO」マーカーを写すと<br>そこに「壁」が出現します</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- HIROマーカー -->
      <a-marker preset="hiro">
        
        <!-- 
          「壁」の設定
          width: 横幅 (2m分)
          height: 高さ (1.5m分)
          depth: 厚み (0.1m = 10cm)
          position: "0 0.75 0" (高さ1.5mの半分をY座標に設定することで、地面に接して立ちます)
        -->
        <a-box 
          position="0 0.75 0" 
          width="2" 
          height="1.5" 
          depth="0.1"
          color="#808080" 
          material="roughness: 1; metalness: 0;"
          shadow="cast: true">
        </a-box>
        
        <!-- 壁の上のテキスト -->
        <!-- 画像を壁に貼る例 -->
<a-box 
  position="0 0.75 0" 
  width="2" 
  height="1.5" 
  depth="0.1"
  src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/bricks/brick_diffuse.jpg">
</a-box>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
