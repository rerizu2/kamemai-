<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR 床検知サンプル</title>
    <!-- A-Frameライブラリ -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 
        webxr: hit-test（床検知）を有効にする
        ar-hit-test: レティクル（照準）を床に表示させる設定
    -->
    <a-scene 
        webxr="optionalFeatures: hit-test;" 
        ar-hit-test="target: #reticle;"
        renderer="colorManagement: true;">

        <!-- 3Dモデルなどのアセット（今回は使いませんが必要な場合に） -->
        <a-assets></a-assets>

        <!-- カメラの視点 -->
        <a-entity camera></a-entity>

        <!-- 
            床が見つかった時に表示される「リング（照準）」
            カメラを動かして床を認識すると、このリングが床に張り付きます。
        -->
        <a-entity id="reticle" visible="false">
            <a-ring color="#00FF00" radius-inner="0.08" radius-outer="0.1" rotation="-90 0 0"></a-ring>
        </a-entity>

        <!-- 
            タップした時に生成される「箱」のテンプレート
            初期状態では非表示（visible="false"）
        -->
        <a-box id="placed-object" scale="0.2 0.2 0.2" material="color: #FF4B2B;" visible="false"></a-box>

    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const reticle = document.querySelector('#reticle');
        const template = document.querySelector('#placed-object');

        // 画面がタップされた時の処理
        sceneEl.addEventListener('click', function () {
            // レティクル（照準）が表示されている＝床が認識されている場合のみ実行
            if (reticle.getAttribute('visible')) {
                // 新しい箱を作成
                const newBox = document.createElement('a-box');
                
                // 現在のレティクルの位置を取得してコピー
                const pos = reticle.getAttribute('position');
                newBox.setAttribute('position', pos);
                
                // 見た目を設定
                newBox.setAttribute('scale', '0.2 0.2 0.2');
                newBox.setAttribute('material', 'color: #4CC3D9');
                
                // シーンに追加
                sceneEl.appendChild(newBox);
            }
        });
    </script>
</body>
</html>
