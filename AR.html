<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Motion Sync VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- 顔認識AIライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* カメラ映像（デバッグ用：左上に小さく表示） */
        #webcam-container {
            position: fixed; top: 10px; left: 10px; z-index: 2000;
            width: 160px; height: 120px; border: 2px solid #0ff; border-radius: 8px;
            overflow: hidden; opacity: 0.7;
        }
        video { transform: scaleX(-1); width: 100%; height: 100%; }
        
        .ui-panel {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            color: #0ff; font-family: sans-serif; text-align: right;
            pointer-events: none; text-shadow: 0 0 10px #0ff;
        }
        .loading-overlay {
            position: fixed; inset: 0; background: #000; z-index: 3000;
            display: flex; justify-content: center; align-items: center;
            color: #0ff; font-family: monospace; transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <h2>TSUKUYOMI SYSTEM INITIALIZING...<br>Face Tracking Loading...</h2>
    </div>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="ui-panel">
        <div>STATUS: SYNCED</div>
        <div id="pos-display">X: 0, Y: 0</div>
    </div>

    <a-scene>
        <!-- ツクヨミの背景：宇宙と深海の融合 -->
        <a-sky color="#020010"></a-sky>
        
        <!-- 中央の巨大な月 -->
        <a-entity id="tsukuyomi-moon" position="0 5 -20">
            <a-sphere radius="5" color="#fff" material="emissive: #fff; emissiveIntensity: 1"></a-sphere>
            <a-ring color="#0ff" radius-inner="6" radius-outer="6.1" rotation="90 0 0"></a-ring>
            <!-- 周囲を回る光の粒 -->
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
                <a-sphere position="8 0 0" radius="0.2" color="#ff00ff" material="emissive: #ff00ff; emissiveIntensity: 2"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- サイバー竹林（多めに配置） -->
        <a-entity id="bamboo-forest"></a-entity>

        <!-- 配信パネル（ホログラム） -->
        <a-plane position="0 2 -5" width="3" height="1.8" material="color: #000; opacity: 0.6; side: double">
            <a-text value="LIVE: KAGUYA" align="center" color="#0ff" position="0 0.5 0.1"></a-text>
            <a-text value="SYNCING USER MOTION..." align="center" color="#0ff" width="2" position="0 -0.2 0.1"></a-text>
        </a-plane>

        <!-- ★カメラリグ：ここが自分の動きと連動する -->
        <a-entity id="camera-rig" position="0 1.6 0">
            <a-camera id="main-camera" look-controls="enabled: true" wasd-controls="enabled: true">
                <a-cursor color="#0ff"></a-cursor>
            </a-camera>
        </a-entity>

        <!-- ライティング -->
        <a-light type="ambient" color="#333"></a-light>
        <a-light type="point" position="0 5 -5" intensity="1" color="#0ff"></a-light>
    </a-scene>

    <script>
        const video = document.getElementById('webcam');
        const cameraRig = document.getElementById('camera-rig');
        const posDisplay = document.getElementById('pos-display');
        const loading = document.getElementById('loading');
        
        // 1. 竹林を自動生成
        const forest = document.getElementById('bamboo-forest');
        for (let i = 0; i < 60; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40 - 15;
            if (Math.abs(x) < 3 && Math.abs(z) < 10) continue;
            const h = Math.random() * 10 + 5;
            const color = Math.random() > 0.5 ? '#00ffcc' : '#7000ff';
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.1');
            b.setAttribute('height', h);
            b.setAttribute('color', color);
            b.setAttribute('material', `emissive: ${color}; emissiveIntensity: 1`);
            forest.appendChild(b);
        }

        // 2. モーショントラッキング（顔認識）の設定
        async function setupTracking() {
            const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
            const detectorConfig = { runtime: 'tfjs', refineLandmarks: false };
            const detector = await faceLandmarksDetection.createDetector(model, detectorConfig);

            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            video.onloadeddata = () => {
                loading.style.opacity = '0';
                setTimeout(() => loading.remove(), 1000);
                detectFace(detector);
            };
        }

        async function detectFace(detector) {
            const faces = await detector.estimateFaces(video);

            if (faces.length > 0) {
                const face = faces[0].keypoints;
                // 鼻の頭（1番目のキーポイント）の位置を取得
                const nose = face[1];
                
                // 画面内の顔の位置を -1.0 ～ 1.0 の範囲に変換
                const rawX = (nose.x / video.videoWidth) - 0.5;
                const rawY = (nose.y / video.videoHeight) - 0.5;

                // 動きを滑らかにする（感度調整）
                const targetX = -rawX * 5; // 左右の動き
                const targetY = -rawY * 3 + 1.6; // 上下の動き + 身長分

                // カメラリグの位置を更新（VRでの6DoF擬似体験）
                const currentPos = cameraRig.getAttribute('position');
                cameraRig.setAttribute('position', {
                    x: targetX * 0.5 + currentPos.x * 0.5, // 簡易的なスムージング
                    y: targetY * 0.5 + currentPos.y * 0.5,
                    z: currentPos.z
                });

                posDisplay.innerText = `X: ${targetX.toFixed(2)}, Y: ${targetY.toFixed(2)}`;
            }

            requestAnimationFrame(() => detectFace(detector));
        }

        setupTracking().catch(err => {
            console.error(err);
            alert("カメラが必要です。カメラを許可して再読み込みしてください。");
        });
    </script>
</body>
</html>
