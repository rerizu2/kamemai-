<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - 6DoF Motion Sync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- A-FrameとWebXRの拡張ライブラリ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #overlay {
            position: fixed; top: 10px; left: 10px; z-index: 1000;
            color: #0ff; font-family: monospace; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid #0ff;
        }
        .start-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 2000; padding: 20px 40px; background: #000; color: #0ff;
            border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 0 15px #0ff;
        }
    </style>
</head>
<body>

    <div id="overlay">
        SYSTEM: TSUKUYOMI_LINK_v2<br>
        TRACKING: <span id="track-status">WAITING...</span><br>
        POS: <span id="pos-data">0, 0, 0</span>
    </div>

    <button class="start-btn" id="startBtn">SYNC START (AR/VR)</button>

    <!-- 
      webxr="optionalFeatures: hit-test, local-floor" により、
      背面カメラによる空間把握（移動検知）を有効にします。
    -->
    <a-scene webxr="optionalFeatures: hit-test, local-floor; overlayElement: #overlay" renderer="antialias: true; alpha: true">
        
        <!-- アセットの定義 -->
        <a-assets>
            <img id="grid" src="https://cdn.glitch.global/36394fd5-65ef-400d-965d-31952e9f6c0d/grid.png?1629821332014">
        </a-assets>

        <!-- ツクヨミ空間の構成要素 -->
        <a-entity id="world">
            <!-- 巨大な月 -->
            <a-entity position="0 20 -100">
                <a-sphere radius="15" color="#fff" material="emissive: #fff; emissiveIntensity: 1"></a-sphere>
                <a-ring color="#0ff" radius-inner="18" radius-outer="18.5" rotation="90 0 0"></a-ring>
            </a-entity>

            <!-- 地面のサイバーグリッド（自分が動いているか確認しやすくするため） -->
            <a-plane rotation="-90 0 0" width="1000" height="1000" src="#grid" repeat="1000 1000" material="transparent: true; opacity: 0.5"></a-plane>

            <!-- ネオン竹林を動的に生成（JSで実行） -->
            <a-entity id="bamboo-container"></a-entity>
        </a-entity>

        <!-- 
           メインカメラ: 
           WebXRが有効になると、スマホの物理移動が自動的にこのカメラに反映されます。
        -->
        <a-entity id="rig">
            <a-camera id="camera" wasd-controls-enabled="false" look-controls="enabled: true">
                <!-- 視界に浮かぶUI（スマコン風） -->
                <a-entity position="0 0 -1">
                    <a-ring radius-inner="0.02" radius-outer="0.03" color="#0ff" opacity="0.5"></a-ring>
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- ライティング -->
        <a-light type="ambient" color="#222"></a-light>
        <a-light type="point" position="0 10 0" intensity="1" color="#0ff"></a-light>
    </a-scene>

    <script>
        const startBtn = document.getElementById('startBtn');
        const trackStatus = document.getElementById('track-status');
        const posData = document.getElementById('pos-data');
        const camera = document.getElementById('camera');
        const bambooContainer = document.getElementById('bamboo-container');

        // 1. 竹林の生成
        for (let i = 0; i < 100; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;
            const h = 5 + Math.random() * 15;
            const color = Math.random() > 0.5 ? '#00ffcc' : '#ff00ff';
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.15');
            b.setAttribute('height', h);
            b.setAttribute('color', color);
            b.setAttribute('material', `emissive: ${color}; emissiveIntensity: 1.5`);
            bambooContainer.appendChild(b);
        }

        // 2. AR/VRモードの開始処理
        startBtn.addEventListener('click', () => {
            // WebXRのARモード（背面カメラ＋空間把握）を要求
            const scene = document.querySelector('a-scene');
            if (scene.enterAR) {
                scene.enterAR();
                startBtn.style.display = 'none';
                trackStatus.innerText = "ACTIVE (6DoF SYNC)";
                trackStatus.style.color = "#0f0";
            } else {
                alert("WebXR ARがサポートされていないブラウザです。最新のChrome(Android)等でお試しください。");
            }
        });

        // 3. 移動データの表示更新ループ
        setInterval(() => {
            const pos = camera.object3D.position;
            const rot = camera.object3D.rotation;
            posData.innerText = `X:${pos.x.toFixed(2)} Y:${pos.y.toFixed(2)} Z:${pos.z.toFixed(2)}`;
            
            // ログ: 向いている方向をコンソールに出力（入力値として利用可能）
            // console.log("Current Orientation:", rot.y); 
        }, 100);

    </script>
</body>
</html>
