<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面共有・監視システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .status { color: #00fbff; font-size: 11px; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; position: relative; overflow: hidden; }
        
        /* 教員用：生徒の画面を一気に表示するグリッド */
        .monitor-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 15px; width: 100%; height: 100%; padding: 20px; box-sizing: border-box;
            overflow-y: auto; align-content: start;
        }
        .student-card { background: #222; border: 2px solid #444; border-radius: 10px; padding: 8px; text-align: center; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 5px; }
        .student-label { font-size: 12px; color: #aaa; margin-bottom: 5px; }

        /* 生徒用：教員の画面を大きく表示 */
        #teacher-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 30px; border-radius: 20px; text-align: center; width: 340px; }
        button { padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; margin: 8px 0; width: 100%; font-size: 15px; }
        .btn-teacher { background: #f39c12; color: white; }
        .btn-student { background: #0097e6; color: white; }
        input { padding: 12px; font-size: 20px; width: 100%; border-radius: 10px; border: 1px solid #555; background: #000; color: white; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        #play-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,151,230,0.8); padding: 20px; border-radius: 10px; z-index: 2000; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div id="role-display">モードを選択</div>
    <div id="status-msg" class="status">準備中</div>
    <button onclick="location.reload()" style="background:#444; color:#fff; border:none; padding:5px 10px; border-radius:5px; font-size:10px;">終了</button>
</header>

<div class="main-layout">
    <div class="primary-view">
        <!-- 先生用：監視エリア -->
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <!-- 生徒用：先生の画面 -->
        <video id="teacher-video" class="hidden" autoplay playsinline></video>
    </div>
</div>

<!-- ブラウザの自動再生ブロック解除用（生徒側のみ表示） -->
<div id="play-hint" class="hidden" onclick="resumeVideo()">
    画面が表示されない場合はここをクリック
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin:0 0 15px 0; color:#00fbff;">画面監視・共有システム</h2>
        <input type="number" id="room-id" placeholder="ルーム番号を入力">
        <button class="btn-teacher" onclick="start('teacher')">🖥️ 先生：監視を開始</button>
        <button class="btn-student" onclick="start('student')">🎓 生徒：参加する</button>
    </div>
</div>

<script>
    let peer, localStream;
    const teacherPrefix = "ROOM-SECRET-";

    function log(m) { document.getElementById('status-msg').innerText = m; }

    // ビデオの再生を強制的に開始する関数
    function resumeVideo() {
        const v = document.getElementById('teacher-video');
        v.play();
        document.getElementById('play-hint').classList.add('hidden');
    }

    async function start(role) {
        const rid = document.getElementById('room-id').value;
        if (!rid) return alert("ルーム番号を入力してください");

        try {
            // 教員も生徒も自分の画面共有を開始
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');

            if (role === 'teacher') {
                // 教員側
                peer = new Peer(teacherPrefix + rid);
                document.getElementById('role-display').innerText = "🖥️ 先生（監視・配信中）";
                document.getElementById('monitor-area').classList.remove('hidden');

                peer.on('open', () => log("待機中...生徒が参加するとここに表示されます"));

                // 生徒からのCallに応答
                peer.on('call', call => {
                    log("生徒が参加しました");
                    // 自分の画面を送りつつ、相手の画面を受け取る
                    call.answer(localStream);
                    call.on('stream', remoteStream => {
                        addStudentVideo(call.peer, remoteStream);
                    });
                });

            } else {
                // 生徒側
                peer = new Peer(); // 生徒はランダムID
                document.getElementById('role-display').innerText = "🎓 生徒（教員の画面を表示）";
                document.getElementById('teacher-video').classList.remove('hidden');
                document.getElementById('play-hint').classList.remove('hidden');

                peer.on('open', (id) => {
                    log("先生に接続しています...");
                    // 先生を呼び出す
                    const call = peer.call(teacherPrefix + rid, localStream);
                    
                    call.on('stream', remoteStream => {
                        log("先生の映像を受信中！");
                        const v = document.getElementById('teacher-video');
                        v.srcObject = remoteStream;
                        v.play().catch(e => {
                            console.log("Auto-play blocked");
                            document.getElementById('play-hint').classList.remove('hidden');
                        });
                    });

                    call.on('error', err => {
                        log("エラー：先生が見つかりません。");
                        alert("先生がまだ開始していないか、番号が違います。");
                    });
                });
            }
        } catch (e) {
            alert("画面共有が許可されませんでした。再読み込みしてください。");
            location.reload();
        }
    }

    function addStudentVideo(peerId, stream) {
        if (document.getElementById(`card-${peerId}`)) return;
        const target = document.getElementById('monitor-area');
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${peerId}`;
        card.innerHTML = `<div class="student-label">生徒参加中</div><video id="v-${peerId}" autoplay playsinline muted></video>`;
        target.appendChild(card);
        document.getElementById(`v-${peerId}`).srcObject = stream;

        // 停止検知
        stream.getVideoTracks()[0].onended = () => card.remove();
    }
</script>
</body>
</html>
