<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援・履歴機能付き</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; height: 50px; box-sizing: border-box; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; display: block; }
        
        /* チャット履歴エリア */
        .chat-panel { width: 250px; background: #1a1a1a; border-left: 1px solid #444; display: flex; flex-direction: column; transition: 0.3s; }
        .chat-header { background: #333; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #444; display: flex; justify-content: space-between; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 11px; padding: 8px; border-radius: 6px; line-height: 1.4; background: #262626; border-left: 3px solid #555; }
        .chat-msg.to-all { border-left-color: #00fbff; }
        .chat-msg.to-me { border-left-color: #ff9f43; background: #3d2b1a; }
        .chat-msg .time { font-size: 9px; color: #888; display: block; margin-bottom: 2px; }

        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; position: relative; }
        .split-container { display: flex; width: 100%; height: 100%; background: #000; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #333; }
        
        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; flex: 1; position: relative; }
        .wb-active #wb-section { display: flex; }
        .wb-tools { background: #f0f0f0; padding: 8px; display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #ccc; color: black; align-items: center; width: 100%; box-sizing: border-box; }
        .palette { display: flex; gap: 5px; align-items: center; }
        .color-opt { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.5); }
        .color-opt.active { transform: scale(1.2); border-color: #555; }
        canvas { background: white; flex: 1; width: 100%; height: 100%; cursor: crosshair; touch-action: none; display: block; }

        /* リスト・監視グリッド */
        .roster-item { background: #333; padding: 10px; border-radius: 8px; font-size: 11px; margin-bottom: 8px; border: 1px solid #444; }
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; background: #0d0d0d; }
        .student-card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 4px; text-align: center; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        
        video.main-broadcast { width: 100%; height: 100%; object-fit: contain; }

        /* モーダル系 */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #444; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 12px; box-sizing: border-box; }
        button { padding: 8px 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 6px; }

        #comment-overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0, 151, 230, 0.95); color: white; padding: 20px 40px; border-radius: 20px; font-size: 24px; font-weight: bold; text-align: center; z-index: 9000; opacity: 0; transition: 0.5s; pointer-events: none; }
        #comment-overlay.show { opacity: 1; top: 25%; }
        
        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; gap: 10px; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-text">準備中...</div>
    <div class="status-bar">
        <div id="status-msg">待機中</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="comment-overlay"></div>

<div class="main-layout" id="root-layout">
    <!-- 左サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff;">生徒用ID</div>
            <div id="display-room-id" style="font-size: 32px; font-weight: bold; color: #fff;">----</div>
        </div>
        <div id="roster-list"></div>
    </div>

    <!-- メインビュー -->
    <div class="primary-view">
        <div class="split-container" id="main-split-view">
            <div class="view-section" id="video-section">
                <video id="main-broadcast-video" class="main-broadcast" autoplay playsinline muted></video>
            </div>
            <div class="view-section" id="wb-section">
                <div class="wb-tools">
                    <div class="palette" id="wb-teacher-only">
                        <div class="color-opt active" style="background:black;" onclick="setWbMode('pen','black',this)"></div>
                        <div class="color-opt" style="background:red;" onclick="setWbMode('pen','red',this)"></div>
                        <div class="color-opt" style="background:blue;" onclick="setWbMode('pen','blue',this)"></div>
                        <button onclick="setWbMode('eraser','white',this)" style="font-size:10px;">消しゴム</button>
                        <button onclick="clearWb()" style="font-size:10px; color:red;">全消去</button>
                    </div>
                    <button id="wb-close-btn" class="hidden" onclick="stopWhiteboard()" style="margin-left:auto; background:#444; color:white;">終了</button>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>

    <!-- チャット履歴パネル -->
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">
            <span>💬 メッセージ履歴</span>
            <button onclick="clearChatLog()" style="background:none; color:#888; font-size:10px; padding:0;">消去</button>
        </div>
        <div id="chat-history"></div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <input type="text" id="all-comment-input" style="flex:1; max-width: 400px; margin-bottom:0;" placeholder="全員にメッセージ...">
    <button onclick="commentToAll()" style="background:#0097e6; color:white;">全員送信</button>
    <button onclick="toggleMenu()" style="background:#555; color:white;">🛠️ メニュー</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="ID（生徒のみ）">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<div id="tools-menu" class="overlay hidden" onclick="toggleMenu()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3 style="color:#00fbff;">ツールメニュー</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button onclick="startWhiteboard()">ボード開始</button>
            <button onclick="changeSharingSource()">画面変更</button>
            <button onclick="kickAllStudents()" style="color:red;">全員退出</button>
        </div>
        <button onclick="toggleMenu()" style="margin-top:20px; width:100%;">閉じる</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "pen";

    function toggleMenu() { document.getElementById('tools-menu').classList.toggle('hidden'); }

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を入力してください");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;
        
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');
            initWhiteboard();
            const peerId = (role === 'teacher' ? "TEACHER-ROOM-" : "") + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生モード":"生徒モード");
                if (role === 'teacher') {
                    document.getElementById('root-layout').classList.add('teacher-mode');
                    document.getElementById('monitor-area').classList.remove('hidden');
                    document.getElementById('display-room-id').innerText = currentRid;
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('teacher-controls').classList.remove('hidden');
                    document.getElementById('main-broadcast-video').srcObject = localStream;
                } else {
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        if (role === 'teacher') { addRoster(call.peer); addVideo(call.peer, stream); }
                    }
                });
            });
        } catch (e) { alert("失敗しました"); location.reload(); }
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        conn.on('open', () => conn.send({ type: 'STUDENT_INFO', name: myName }));
        conn.on('data', data => handleData(tId, data));
        const call = peer.call(tId, localStream);
        call.on('stream', s => document.getElementById('main-broadcast-video').srcObject = s);
    }

    function handleData(id, data) {
        if (data.type === 'STUDENT_INFO') {
            studentInfo[id] = { name: data.name };
            updateStudentDisplay(id);
        } else if (data.type === 'COMMENT') {
            addChatLog(data.from, data.message, data.isPrivate);
            showCommentUI(data.message);
        } else if (data.type === 'WB_START') {
            document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300);
        } else if (data.type === 'WB_STOP') {
            document.getElementById('root-layout').classList.remove('wb-active');
        } else if (data.type === 'WB_DRAW') {
            drawRemote(data.x, data.y, data.color, data.size, data.mode, data.start);
        } else if (data.type === 'WB_CLEAR') {
            wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        } else if (data.type === 'KICK') location.reload();
    }

    // --- チャット・履歴機能 ---
    function addChatLog(sender, msg, isPrivate) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        div.className = `chat-msg ${isPrivate ? 'to-me' : 'to-all'}`;
        div.innerHTML = `<span class="time">${time} - ${sender}${isPrivate ? ' (個別)' : ''}</span>${msg}`;
        history.prepend(div);
    }

    function commentToAll() {
        const input = document.getElementById('all-comment-input');
        const msg = input.value;
        if(!msg) return;
        Object.values(dataConnections).forEach(c => c.send({ type: 'COMMENT', from: '先生', message: msg, isPrivate: false }));
        addChatLog('自分から全員へ', msg, false);
        input.value = "";
    }

    function commentToIndividual(id) {
        const name = studentInfo[id]?.name || "生徒";
        const msg = prompt(`${name} さんへの個別指示:`);
        if(!msg) return;
        dataConnections[id].send({ type: 'COMMENT', from: '先生', message: msg, isPrivate: true });
        addChatLog(`${name} さんへ`, msg, true);
    }

    function clearChatLog() { document.getElementById('chat-history').innerHTML = ""; }

    function showCommentUI(msg) {
        const o = document.getElementById('comment-overlay'); o.innerText = msg; o.classList.add('show');
        setTimeout(() => o.classList.remove('show'), 5000);
    }

    // --- ホワイトボード・管理 ---
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        wbCanvas.addEventListener('pointerdown', e => {
            if(myRole !== 'teacher') return; wbDrawing = true; wbCanvas.setPointerCapture(e.pointerId);
            const pos = getPos(e); startStroke(pos.x, pos.y, wbColor, 3, wbMode);
            broadcast({ type: 'WB_DRAW', x: pos.x, y: pos.y, color: wbColor, size: 3, mode: wbMode, start: true });
        });
        wbCanvas.addEventListener('pointermove', e => {
            if(!wbDrawing || myRole !== 'teacher') return;
            const pos = getPos(e); drawLocal(pos.x, pos.y);
            broadcast({ type: 'WB_DRAW', x: pos.x, y: pos.y, color: wbColor, size: 3, mode: wbMode, start: false });
        });
        wbCanvas.addEventListener('pointerup', () => { wbDrawing = false; wbCtx.beginPath(); });
    }
    function getPos(e) { const r = wbCanvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
    function startStroke(x, y, color, size, mode) {
        wbCtx.beginPath(); wbCtx.globalCompositeOperation = (mode === 'eraser') ? 'destination-out' : 'source-over';
        wbCtx.strokeStyle = color; wbCtx.lineWidth = size; wbCtx.lineCap = 'round';
        wbCtx.moveTo(x * wbCanvas.width, y * wbCanvas.height);
    }
    function drawLocal(x, y) { wbCtx.lineTo(x * wbCanvas.width, y * wbCanvas.height); wbCtx.stroke(); }
    function drawRemote(x, y, color, size, mode, isStart) {
        if(isStart) startStroke(x, y, color, size, mode);
        else drawLocal(x, y);
    }
    function startWhiteboard() { toggleMenu(); document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); broadcast({ type: 'WB_START' }); }
    function stopWhiteboard() { document.getElementById('root-layout').classList.remove('wb-active'); broadcast({ type: 'WB_STOP' }); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); broadcast({ type: 'WB_CLEAR' }); }
    function resizeCanvas() { const r = wbCanvas.getBoundingClientRect(); wbCanvas.width = r.width; wbCanvas.height = r.height; wbCtx.lineCap = 'round'; }
    function setWbMode(m, c, el) { wbMode = m; wbColor = c; document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }
    function broadcast(data) { Object.values(dataConnections).forEach(c => c.send(data)); }

    function addRoster(id) {
        const div = document.createElement('div'); div.className = 'roster-item'; div.id = `roster-${id}`;
        div.innerHTML = `<span id="name-${id}" style="font-weight:bold;">...</span><br>
            <button onclick="commentToIndividual('${id}')" style="background:#0097e6; color:white; font-size:10px; margin-top:5px;">指示を送る</button>
            <button onclick="startSpotlight('${id}')" style="background:#f39c12; color:white; font-size:10px;">全員共有</button>`;
        document.getElementById('roster-list').appendChild(div);
    }
    function addVideo(id, stream) {
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<div id="vname-${id}" style="font-size:10px;"></div><video id="vid-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card); document.getElementById(`vid-${id}`).srcObject = stream;
    }
    function updateStudentDisplay(id) {
        const n = studentInfo[id].name;
        if(document.getElementById(`name-${id}`)) document.getElementById(`name-${id}`).innerText = n;
        if(document.getElementById(`vname-${id}`)) document.getElementById(`vname-${id}`).innerText = n;
    }
    function removeStudent(id) {
        if(document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove();
        if(document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        delete dataConnections[id];
    }
    function startSpotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) call.peerConnection.getSenders().find(s=>s.track.kind==='video').replaceTrack(track); });
        document.getElementById('main-broadcast-video').srcObject = studentStreams[id];
    }
    function kickAllStudents() { broadcast({type:'KICK'}); }
    async function changeSharingSource() {
        const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        localStream = s; document.getElementById('main-broadcast-video').srcObject = s;
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) call.peerConnection.getSenders().find(s=>s.track.kind==='video').replaceTrack(s.getVideoTracks()[0]); });
        toggleMenu();
    }
</script>
</body>
</html>
