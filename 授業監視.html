<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業監視・マルチ表示システム 統合版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; height: 50px; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; display: block; }
        
        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; }
        
        /* 上部：映像とホワイトボードの分割 */
        .split-container { display: flex; height: 60%; width: 100%; transition: 0.5s; background: #000; border-bottom: 2px solid #333; }
        .view-section { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #222; overflow: hidden; }
        #wb-section { display: none; background: white; flex-direction: column; }
        .wb-active #wb-section { display: flex; }

        /* 下部：生徒の監視用グリッド（自動で並ぶ） */
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; background: #111; align-content: start; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 5px; text-align: center; position: relative; height: fit-content; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }
        .student-label { font-size: 10px; color: #aaa; margin-top: 5px; font-weight: bold; overflow: hidden; white-space: nowrap; }

        video.main-v { width: 100%; height: 100%; object-fit: contain; }

        /* ホワイトボード設定 */
        .wb-tools { background: #f0f0f0; padding: 5px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; color: black; font-size: 11px; align-items: center; width: 100%; }
        .color-opt { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid #ccc; }
        canvas { background: white; flex: 1; width: 100%; cursor: crosshair; touch-action: none; }

        /* モーダル・ボタン */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 8px 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; }
        .hidden { display: none !important; }
        
        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

<header>
    <div id="mode-text">準備中...</div>
    <div class="status-bar">
        <div id="status-msg">待機中</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div class="main-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff;">生徒に教える参加ID</div>
            <div id="display-room-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <div class="my-preview-area">
            <h3 style="font-size:11px; color:#aaa; margin:0 0 5px;">🔴 配信画面</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
            <button id="reset-btn" class="hidden" onclick="resetSpotlight()" style="width:100%; background:#f39c12; color:white; font-size:11px; margin-top:5px; padding:8px;">配信を自分に戻す</button>
        </div>
        <div id="student-roster" style="font-size: 11px; color: #888;">👥 参加生徒</div>
        <div id="roster-list"></div>
    </div>

    <div class="primary-view">
        <!-- 上部分割ビュー -->
        <div class="split-container" id="main-view">
            <div class="view-section" id="video-section">
                <video id="broadcast-video" class="main-v" autoplay playsinline muted></video>
            </div>
            <div class="view-section" id="wb-section">
                <div class="wb-tools">
                    <span>🖊️ 手書き</span>
                    <div id="wb-t-tools" class="hidden" style="display:flex; gap:8px;">
                        <div class="color-opt" style="background:black;" onclick="setWbColor('black',this)"></div>
                        <div class="color-opt" style="background:red;" onclick="setWbColor('red',this)"></div>
                        <button onclick="clearWb()" style="font-size:10px;">全消去</button>
                    </div>
                    <button id="wb-close-btn" class="hidden" onclick="stopWhiteboard()" style="margin-left:auto; background:#444; color:white; font-size:10px;">終了</button>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>

        <!-- 下部：監視エリア（教員用。生徒が入ると自動でここに表示される） -->
        <div id="monitor-area" class="monitor-grid hidden"></div>
        
        <!-- 【生徒用全画面】 -->
        <video id="student-main-video" class="hidden" style="position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; z-index:4000;" autoplay playsinline muted></video>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <input type="text" id="all-comment-input" style="flex:1; max-width: 400px; background:#111; color:white; border:1px solid #444; padding:10px; border-radius:8px;" placeholder="全員にメッセージ...">
    <button onclick="commentToAll()" style="background:#0097e6; color:white;">送信</button>
    <button onclick="toggleMenu()" style="background:#555; color:white;">🛠️ メニュー</button>
</div>

<!-- ツールメニュー -->
<div id="tools-menu" class="overlay hidden" onclick="toggleMenu()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3 style="margin-top:0; color:#00fbff;">ツールメニュー</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
            <button onclick="startWhiteboard()" style="background:#333; color:white; padding:15px 0;">🖊️ ホワイトボード</button>
            <button onclick="openPollCreator()" style="background:#333; color:white; padding:15px 0;">📊 アンケート</button>
            <button onclick="changeSharingSource()" style="background:#333; color:white; padding:15px 0;">🔄 共有変更</button>
            <button onclick="kickAllStudents()" style="background:#c23616; color:white; grid-column:span 2; margin-top:10px;">⚠️ 全員退出</button>
        </div>
        <button onclick="toggleMenu()" style="margin-top:20px; background:#444; color:white; width:100%;">閉じる</button>
    </div>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff; margin-bottom:20px;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="生徒：番号を入力" oninput="checkCode()">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px; font-size:16px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%; font-size:16px;" onclick="start('student')">生徒として参加</button>
        <button id="secret-btn" class="hidden" style="background:#8e44ad; color:white; width:100%; margin-top:10px;" onclick="start('remote')">🔍 監視のみモード</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let isBroadcasting = true, studentCount = 0;
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black";

    function log(m) { document.getElementById('status-msg').innerText = m; }
    function checkCode() { if (document.getElementById('room-id').value === "200977") reveal(); }
    window.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'i') reveal(); });
    function reveal() { document.getElementById('secret-btn').classList.remove('hidden'); }
    function toggleMenu() { document.getElementById('tools-menu').classList.toggle('hidden'); }

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (role === 'student' && !myName) return alert("氏名を入力してください");
        if (role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        else currentRid = document.getElementById('room-id').value;
        if (!currentRid) return alert("番号を入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');
            initWhiteboard();

            const peerId = (role === 'teacher' ? "TEACHER-ROOM-" : (role === 'remote' ? "MONITOR-ROOM-" : "")) + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生モード":"生徒モード");
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('display-room-id').innerText = currentRid;
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                        document.getElementById('my-local-preview').srcObject = localStream;
                        document.getElementById('broadcast-video').srcObject = localStream;
                    }
                } else {
                    document.getElementById('student-main-video').classList.remove('hidden');
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    studentStreams[call.peer] = stream;
                    if (!studentInfo[call.peer]) studentInfo[call.peer] = { name: "接続中..." };
                    studentCount = Object.keys(studentStreams).length;
                    document.getElementById('count-display').innerText = "接続数: " + studentCount;
                    
                    if (role === 'teacher' || role === 'remote') {
                        addRoster(call.peer);
                        addVideoToGrid(call.peer, stream); // 自動でグリッドに追加
                    }
                });
            });
        } catch (e) { alert("失敗: " + e.message); location.reload(); }
    }

    function connectToTeacher() {
        const teacherId = "TEACHER-ROOM-" + currentRid;
        const call = peer.call(teacherId, localStream);
        mediaCalls[teacherId] = call;
        call.on('stream', s => { document.getElementById('student-main-video').srcObject = s; });
        const conn = peer.connect(teacherId);
        dataConnections[teacherId] = conn;
        conn.on('open', () => { conn.send({ type: 'STUDENT_INFO', name: myName }); });
        conn.on('data', data => handleData(teacherId, data));
        peer.on('error', err => { if (err.type === 'peer-unavailable') setTimeout(connectToTeacher, 3000); });
    }

    function handleData(id, data) {
        if (data.type === 'STUDENT_INFO') {
            studentInfo[id] = { name: data.name };
            updateStudentDisplay(id);
        } else if (data.type === 'COMMENT') {
            alert("先生からの指示: " + data.message);
        } else if (data.type === 'WB_START') {
            document.getElementById('main-view').classList.add('wb-active'); resizeCanvas();
        } else if (data.type === 'WB_STOP') {
            document.getElementById('main-view').classList.remove('wb-active');
        } else if (data.type === 'WB_DRAW') {
            drawOnCanvas(data.x, data.y, data.color);
        } else if (data.type === 'WB_UP') {
            wbCtx.beginPath();
        } else if (data.type === 'WB_CLEAR') {
            wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
        } else if (data.type === 'KICK') location.reload();
    }

    function addVideoToGrid(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const grid = document.getElementById('monitor-area');
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        card.innerHTML = `<video id="vid-${id}" autoplay playsinline muted></video><div id="card-name-${id}" class="student-label">生徒</div>`;
        grid.appendChild(card);
        document.getElementById(`vid-${id}`).srcObject = stream;
        updateStudentDisplay(id);
    }

    function addRoster(id) {
        if (document.getElementById(`roster-${id}`)) return;
        const roster = document.getElementById('roster-list');
        const div = document.createElement('div');
        div.className = 'roster-item'; div.id = `roster-${id}`;
        div.innerHTML = `<span id="roster-name-${id}" style="color:#00fbff; font-weight:bold;">...</span>
            <div class="roster-btns">
                <button onclick="startSpotlight('${id}')" style="background:#f39c12; color:white; font-size:9px;">全員共有</button>
                <button onclick="kickStudent('${id}')" style="background:#e84118; color:white; font-size:9px;">退出</button>
            </div>`;
        roster.appendChild(div);
    }

    function updateStudentDisplay(id) {
        const name = studentInfo[id] ? studentInfo[id].name : "生徒";
        if (document.getElementById(`roster-name-${id}`)) document.getElementById(`roster-name-${id}`).innerText = name;
        if (document.getElementById(`card-name-${id}`)) document.getElementById(`card-name-${id}`).innerText = name;
    }

    function removeStudent(id) {
        if (document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        if (document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove();
        delete studentStreams[id]; delete studentInfo[id]; delete dataConnections[id]; delete mediaCalls[id];
        document.getElementById('count-display').innerText = "接続数: " + Object.keys(studentStreams).length;
    }

    function startSpotlight(id) {
        const studentTrack = studentStreams[id].getVideoTracks()[0];
        Object.values(mediaCalls).forEach(call => { if (call.peerConnection) call.peerConnection.getSenders().find(s => s.track && s.track.kind==='video').replaceTrack(studentTrack); });
        document.getElementById('broadcast-video').srcObject = studentStreams[id];
        document.getElementById('reset-btn').classList.remove('hidden');
    }

    function resetSpotlight() {
        const teacherTrack = localStream.getVideoTracks()[0];
        Object.values(mediaCalls).forEach(call => { if (call.peerConnection) call.peerConnection.getSenders().find(s => s.track && s.track.kind==='video').replaceTrack(teacherTrack); });
        document.getElementById('broadcast-video').srcObject = localStream;
        document.getElementById('reset-btn').classList.add('hidden');
    }

    // ホワイトボード基本ロジック
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        resizeCanvas();
        wbCanvas.addEventListener('mousedown', (e) => { if(myRole==='teacher'){wbDrawing=true; drawEvent(e);}});
        wbCanvas.addEventListener('mousemove', drawEvent);
        wbCanvas.addEventListener('mouseup', () => { wbDrawing=false; wbCtx.beginPath(); if(myRole==='teacher') Object.values(dataConnections).forEach(c=>c.send({type:'WB_UP'})); });
    }
    function drawEvent(e) {
        if(!wbDrawing || myRole !== 'teacher') return;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbCanvas.width;
        const y = (e.clientY - rect.top) / wbCanvas.height;
        drawOnCanvas(x, y, wbColor);
        Object.values(dataConnections).forEach(c => c.send({ type: 'WB_DRAW', x, y, color: wbColor }));
    }
    function drawOnCanvas(x, y, color) {
        wbCtx.lineWidth = 3; wbCtx.lineCap = 'round'; wbCtx.strokeStyle = color;
        wbCtx.lineTo(x * wbCanvas.width, y * wbCanvas.height); wbCtx.stroke();
        wbCtx.beginPath(); wbCtx.moveTo(x * wbCanvas.width, y * wbCanvas.height);
    }
    function startWhiteboard() {
        toggleMenu(); document.getElementById('main-view').classList.add('wb-active');
        document.getElementById('wb-t-tools').classList.remove('hidden');
        document.getElementById('wb-close-btn').classList.remove('hidden');
        resizeCanvas(); Object.values(dataConnections).forEach(c => c.send({ type: 'WB_START' }));
    }
    function stopWhiteboard() { document.getElementById('main-view').classList.remove('wb-active'); Object.values(dataConnections).forEach(c => c.send({ type: 'WB_STOP' })); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function setWbColor(c,el) { wbColor = c; }
    function resizeCanvas() { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; }

    function commentToAll() {
        const msg = document.getElementById('all-comment-input').value;
        if(msg) { Object.values(dataConnections).forEach(c => c.send({ type: 'COMMENT', message: msg })); document.getElementById('all-comment-input').value = ""; }
    }
    function kickStudent(id) { if(confirm("退出させますか？")) dataConnections[id].send({type:'KICK'}); }
    function kickAllStudents() { if(confirm("全員退出？")) { Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); toggleMenu(); } }
    async function changeSharingSource() {
        const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        localStream = s; document.getElementById('my-local-preview').srcObject = s; document.getElementById('broadcast-video').srcObject = s;
        Object.values(mediaCalls).forEach(call => { if (call.peerConnection) call.peerConnection.getSenders().find(s => s.track.kind==='video').replaceTrack(s.getVideoTracks()[0]); });
        toggleMenu();
    }

    window.onload = () => {
        const sn = localStorage.getItem('savedUserName');
        if(sn) { document.getElementById('user-name').value = sn; document.getElementById('user-name').readOnly = true; }
    };
</script>
</body>
</html>
