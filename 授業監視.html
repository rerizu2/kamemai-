<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMERA TRANSMITTER (Send Only)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .panel { background: var(--panel); padding: 20px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,251,255,0.1); }
        
        video { width: 100%; border-radius: 10px; background: #000; border: 2px solid var(--accent); aspect-ratio: 16/9; object-fit: cover; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; text-align: center; font-size: 18px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-start { background: var(--accent); color: #000; }
        .btn-switch { background: #444; color: white; }
        
        #id-display { font-size: 32px; font-weight: bold; color: var(--accent); margin: 15px 0; }
        .on-air { color: var(--danger); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        #log { font-size: 12px; color: #888; margin-top: 15px; text-align: left; background: #000; padding: 10px; border-radius: 5px; height: 60px; overflow-y: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--accent);">TRANSMITTER</h2>

    <!-- 設定画面 -->
    <div id="setup-area" class="panel">
        <input type="text" id="room-id" placeholder="部屋IDを入力 (例: 1234)">
        <button class="btn-start" onclick="initTransmitter('camera')">📷 カメラで開始</button>
        <button class="btn-start" style="background:#2ecc71;" onclick="initTransmitter('screen')">💻 画面共有で開始</button>
    </div>

    <!-- 配信中画面 -->
    <div id="broadcast-area" class="panel hidden">
        <div id="on-air-label" class="on-air">● LIVE</div>
        <div id="id-display">----</div>
        
        <video id="preview-video" autoplay playsinline muted></video>
        
        <div style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn-switch" onclick="switchMedia('camera')">📷 カメラへ</button>
            <button class="btn-switch" onclick="switchMedia('screen')">💻 画面へ</button>
        </div>
        
        <div id="qrcode" style="display:flex; justify-content:center; background:white; padding:10px; border-radius:10px; margin-top:15px;"></div>
        
        <div id="log">ログ: 接続待機中...</div>
        <button class="btn-switch" style="margin-top:10px; background:var(--danger);" onclick="location.reload()">配信終了</button>
    </div>
</div>

<script>
    let peer, localStream, myId;
    let currentMode = ""; // 'camera' or 'screen'

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `> ${msg}<br>${log.innerHTML}`;
    }

    // --- 送信機能のコア ---
    async function initTransmitter(mode) {
        const inputId = document.getElementById('room-id').value;
        if (!inputId) { alert("IDを入力してください"); return; }
        
        myId = "ROOM-" + inputId;
        currentMode = mode;

        try {
            // 1. メディアの取得 (ご提示のプログラムの開始能力)
            if (mode === 'camera') {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } else {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }
            
            document.getElementById('preview-video').srcObject = localStream;
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('broadcast-area').classList.remove('hidden');
            document.getElementById('id-display').innerText = inputId;

            // 2. PeerJSの初期化
            peer = new Peer(myId, {
                debug: 1,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', id => {
                addLog("送信サーバーに接続: ID " + inputId);
                new QRCode(document.getElementById("qrcode"), { text: inputId, width: 100, height: 100 });
            });

            // 3. 受信側（モニター）からの接続要求に応答する能力
            peer.on('call', call => {
                addLog("受信側が接続しました");
                call.answer(localStream); // 自分のストリームを渡す
            });

            peer.on('error', err => {
                if(err.type === 'id-taken') alert("そのIDは既に使用されています");
                else addLog("エラー: " + err.type);
            });

        } catch (e) {
            console.error(e);
            alert("メディアの取得に失敗しました");
        }
    }

    // --- ストリーム差し替え能力 (EDU-ULTIMATE v3.1 の核心機能) ---
    async function switchMedia(mode) {
        if (currentMode === mode) return;
        
        try {
            let newStream;
            if (mode === 'camera') {
                newStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } else {
                newStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }

            const newTrack = newStream.getVideoTracks()[0];
            
            // 接続中の全ての相手に対して、映像トラックを差し替える
            // これにより、受信側は再接続せずに映像が切り替わる
            Object.values(peer.connections).forEach(connList => {
                connList.forEach(c => {
                    if (c.peerConnection) {
                        const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newTrack);
                    }
                });
            });

            // ローカルプレビュー更新
            localStream.getTracks().forEach(t => t.stop());
            localStream = newStream;
            document.getElementById('preview-video').srcObject = localStream;
            currentMode = mode;
            addLog("配信ソースを " + mode + " に切り替えました");

        } catch (e) {
            addLog("切り替え失敗: " + e.message);
        }
    }
</script>

</body>
</html>
