<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業監視・インタラクティブシステム 統合版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; height: 50px; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; position: relative; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; display: block; }
        
        /* 生徒リスト */
        .roster-item { background: #333; padding: 10px; border-radius: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; border: 1px solid #444; }
        .roster-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

        .primary-view { flex: 1; position: relative; background: #111; overflow: hidden; display: flex; flex-direction: column; }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; align-content: start; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 8px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 5px; display: block; }

        #teacher-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* セットアップ（中央固定） */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 35px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { padding: 12px; font-size: 16px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; transition: 0.2s; }

        /* コメント表示（生徒側） */
        #comment-overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0, 151, 230, 0.95); color: white; padding: 25px 50px; border-radius: 20px; font-size: 28px; font-weight: bold; text-align: center; z-index: 4000; opacity: 0; transition: 0.5s; pointer-events: none; max-width: 85%; border: 2px solid #fff; }
        #comment-overlay.show { opacity: 1; top: 25%; }

        /* 教員操作パネル */
        .controls { background: #222; padding: 12px; border-top: 1px solid #444; display: flex; flex-direction: column; gap: 10px; }
        .controls-row { display: flex; gap: 10px; justify-content: center; }
        .text-input { background: #111; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; flex: 1; }
        .hidden { display: none !important; }
        
        .btn-comment { background: #0097e6; color: white; }
        .btn-kick { background: #e84118; color: white; }
    </style>
</head>
<body>

<header>
    <div id="mode-text">授業システム</div>
    <div class="status-bar">
        <div id="status-msg">待機中</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="comment-overlay"></div>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff;">参加ID</div>
            <div id="display-room-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <div class="my-preview-area">
            <h3 style="font-size:11px; color:#aaa; margin:0 0 5px;">🔴 配信プレビュー</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
            <button id="reset-btn" class="hidden" onclick="resetSpotlight()" style="width:100%; background:#f39c12; color:white; font-size:11px; margin-top:5px;">配信を自分に戻す</button>
        </div>
        <h3 style="font-size:12px; color:#aaa; margin:10px 0 5px;">👥 生徒リスト</h3>
        <div id="student-roster"></div>
    </div>

    <div class="primary-view">
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <video id="teacher-video" class="hidden" autoplay playsinline muted></video>
        
        <!-- アンケート用（生徒用） -->
        <div id="poll-modal-student" class="overlay hidden" style="background:rgba(0,0,0,0.8);">
            <div style="background:white; color:black; padding:30px; border-radius:20px; width:340px; text-align:center;">
                <h3 id="student-poll-q">質問</h3>
                <div id="student-poll-options"></div>
                <button onclick="this.parentElement.parentElement.classList.add('hidden')" style="margin-top:20px; background:#ddd; width:100%;">閉じる</button>
            </div>
        </div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <div class="controls-row">
        <input type="text" id="all-comment-input" class="text-input" placeholder="全員に指示を送信...">
        <button onclick="commentToAll()" class="btn-comment" style="width:120px;">全員送信</button>
    </div>
    <div class="controls-row">
        <button id="broadcast-btn" onclick="toggleBroadcast()" style="background:#e84118; color:white; flex:1;">📡 配信停止</button>
        <button onclick="document.getElementById('poll-creator-modal').classList.remove('hidden')" style="background:#f39c12; color:white; flex:1;">📊 アンケート</button>
        <button onclick="toggleRecording()" id="record-btn" style="background:#fff; color:#000; flex:1;">⏺️ 録画開始</button>
        <button onclick="kickAllStudents()" style="background:#c23616; color:white; flex:1;">⚠️ 全員退出</button>
    </div>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff; margin-bottom:20px;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力（生徒は必須）">
        <input type="number" id="room-id" placeholder="生徒：番号を入力" oninput="checkCode()">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="start('student')">生徒として参加</button>
        <button id="secret-btn" class="hidden" style="background:#8e44ad; color:white; width:100%; margin-top:10px;" onclick="start('remote')">🔍 生徒監視（隠しモード）</button>
    </div>
</div>

<!-- アンケート作成 -->
<div id="poll-creator-modal" class="overlay hidden">
    <div class="modal-box">
        <h3>アンケート作成</h3>
        <input type="text" id="poll-q-input" placeholder="質問内容" class="text-input">
        <input type="text" id="opt-1" placeholder="選択肢1" class="text-input">
        <input type="text" id="opt-2" placeholder="選択肢2" class="text-input">
        <button onclick="sendPoll()" style="background:#f39c12; color:white; width:100%; margin-top:10px;">配信開始</button>
        <button onclick="document.getElementById('poll-creator-modal').classList.add('hidden')" style="background:#444; color:white; width:100%; margin-top:5px;">閉じる</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let isBroadcasting = true, studentCount = 0;
    const studentStreams = {}, studentInfo = {}, dataConnections = {}; 
    let mediaRecorder, recordedChunks = [];

    function log(m) { document.getElementById('status-msg').innerText = m; }
    function checkCode() { if (document.getElementById('room-id').value === "200977") reveal(); }
    window.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'i') reveal(); });
    function reveal() { document.getElementById('secret-btn').classList.remove('hidden'); }

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (role === 'student' && !myName) return alert("氏名を入力してください");
        if (myName) localStorage.setItem('savedUserName', myName);
        
        if (role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        else currentRid = document.getElementById('room-id').value;
        if (!currentRid) return alert("番号を入力してください");

        try {
            log("画面共有を取得中...");
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');

            const peerId = (role === 'teacher' ? "TEACHER-ROOM-" : (role === 'remote' ? "MONITOR-ROOM-" : "")) + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生モード":"生徒モード");
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('display-room-id').innerText = currentRid;
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                        document.getElementById('my-local-preview').srcObject = localStream;
                    }
                } else {
                    document.getElementById('teacher-video').classList.remove('hidden');
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                call.answer(isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        studentCount++; document.getElementById('count-display').innerText = "接続数: " + studentCount;
                        if (role === 'teacher') addRoster(call.peer);
                        addVideo(call.peer, stream);
                    }
                });
            });
        } catch (e) { alert("エラー: " + e.message); location.reload(); }
    }

    function connectToTeacher() {
        const teacherId = "TEACHER-ROOM-" + currentRid;
        const call = peer.call(teacherId, localStream);
        call.on('stream', s => { document.getElementById('teacher-video').srcObject = s; });
        const conn = peer.connect(teacherId);
        dataConnections[teacherId] = conn;
        conn.on('open', () => { conn.send({ type: 'STUDENT_INFO', name: myName }); });
        conn.on('data', data => handleData(teacherId, data));
    }

    function handleData(id, data) {
        if (data.type === 'STUDENT_INFO') {
            studentInfo[id] = { name: data.name };
            updateStudentDisplay(id);
        } else if (data.type === 'COMMENT') {
            showCommentUI(data.message);
        } else if (data.type === 'POLL_START') {
            showPollUI(data.q, data.opts);
        } else if (data.type === 'KICK') location.reload();
    }

    // --- コメント機能 ---
    function commentToAll() {
        const msg = document.getElementById('all-comment-input').value;
        if(!msg) return;
        Object.values(dataConnections).forEach(c => c.send({ type: 'COMMENT', message: "📢 全員へ: " + msg }));
        document.getElementById('all-comment-input').value = "";
        log("全員に送信しました");
    }

    function commentToIndividual(id) {
        const name = studentInfo[id] ? studentInfo[id].name : "生徒";
        const msg = prompt(`${name} さんへの指示を入力してください:`);
        if (msg && dataConnections[id]) {
            dataConnections[id].send({ type: 'COMMENT', message: "💬 個人宛: " + msg });
            log(name + "さんに送信しました");
        }
    }

    function showCommentUI(msg) {
        const overlay = document.getElementById('comment-overlay');
        overlay.innerText = msg;
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 8000);
    }

    // --- その他管理 ---
    function addRoster(id) {
        if (document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div'); div.className = 'roster-item'; div.id = `roster-${id}`;
        div.innerHTML = `<span id="roster-name-${id}" style="font-weight:bold;color:#00fbff;">接続中...</span>
            <div class="roster-btns">
                <button onclick="addVideo('${id}')" style="background:#44bd32;color:white;">表示</button>
                <button onclick="commentToIndividual('${id}')" class="btn-comment">コメント</button>
                <button onclick="startSpotlight('${id}')" style="background:#f39c12;color:white;grid-column:span 2;">全員へ共有</button>
                <button onclick="kickStudent('${id}')" class="btn-kick" style="grid-column:span 2;">退出</button>
            </div>`;
        document.getElementById('student-roster').appendChild(div);
    }

    function addVideo(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        const name = studentInfo[id] ? studentInfo[id].name : "生徒";
        card.innerHTML = `<div id="card-name-${id}" style="font-size:11px;margin-bottom:5px;">${name}</div><video id="vid-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById(`vid-${id}`).srcObject = stream;
    }

    function updateStudentDisplay(id) {
        const info = studentInfo[id];
        if (document.getElementById(`roster-name-${id}`)) document.getElementById(`roster-name-${id}`).innerText = info.name;
        if (document.getElementById(`card-name-${id}`)) document.getElementById(`card-name-${id}`).innerText = info.name;
    }

    function startSpotlight(id) {
        const studentTrack = studentStreams[id].getVideoTracks()[0];
        Object.values(peer.connections).forEach(conns => conns.forEach(c => { if(c.peerConnection) c.peerConnection.getSenders().find(s => s.track.kind==='video').replaceTrack(studentTrack); }));
        document.getElementById('reset-btn').classList.remove('hidden');
    }
    function resetSpotlight() {
        const teacherTrack = localStream.getVideoTracks()[0];
        Object.values(peer.connections).forEach(conns => conns.forEach(c => { if(c.peerConnection) c.peerConnection.getSenders().find(s => s.track.kind==='video').replaceTrack(teacherTrack); }));
        document.getElementById('reset-btn').classList.add('hidden');
    }
    function kickStudent(id) { if(confirm("退出？")) dataConnections[id].send({type:'KICK'}); }
    function kickAllStudents() { if(confirm("全員退出？")) Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); }
    function toggleBroadcast() {
        isBroadcasting = !isBroadcasting; localStream.getVideoTracks().forEach(t => t.enabled = isBroadcasting);
        document.getElementById('broadcast-btn').innerText = isBroadcasting ? "📡 配信停止" : "📡 配信開始";
    }

    window.onload = () => {
        const sn = localStorage.getItem('savedUserName');
        if(sn) { document.getElementById('user-name').value = sn; document.getElementById('user-name').readOnly = true; }
    };
</script>
</body>
</html>
