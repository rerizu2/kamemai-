<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルームID式・生徒削除機能付き監視システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; font-size: 14px; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        .primary-view { flex: 3; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        
        /* 監視グリッド */
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; height: 100%; padding: 20px; overflow-y: auto; align-content: start; }
        .student-card { background: #1e1e1e; border: 2px solid #444; border-radius: 12px; padding: 8px; position: relative; }
        .student-card video { width: 100%; border-radius: 6px; background: #000; display: block; aspect-ratio: 16/9; }
        
        /* 生徒ラベルと削除ボタン */
        .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .student-label { font-size: 12px; color: #00d1ff; font-weight: bold; }
        .btn-remove { background: #ff4757; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
        .btn-remove:hover { background: #ff6b81; }

        .monitor-sidebar { width: 260px; background: #1a1a1a; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }

        button { padding: 12px 20px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; margin: 5px; transition: 0.2s; }
        .btn-teacher-share { background: #e84118; color: white; }
        .btn-teacher-monitor { background: #f39c12; color: white; }
        .btn-student { background: #0097e6; color: white; }
        .btn-sub { background: #444; color: white; }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 30px; border-radius: 20px; text-align: center; width: 340px; }
        input { padding: 15px; font-size: 20px; width: 100%; border-radius: 10px; border: 1px solid #555; background: #111; color: white; text-align: center; box-sizing: border-box; margin-bottom: 15px; }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 10px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="role-display">モード選択</div>
    <div id="status-msg" style="color:#00d1ff;">接続待機中</div>
    <button class="btn-sub" onclick="location.reload()" style="padding:5px 10px; font-size:11px;">終了</button>
</header>

<div class="main-layout">
    <div class="primary-view" id="main-area">
        <div id="info-panel" class="hidden" style="text-align:center;">
            <div id="qrcode"></div>
            <p>ルームID: <span id="id-val" style="color:#00d1ff; font-weight:bold; font-size:24px;">----</span></p>
        </div>
        <video id="main-video" class="hidden" autoplay playsinline></video>
        <div id="student-grid" class="monitor-grid hidden"></div>
    </div>
    <div id="teacher-sidebar" class="monitor-sidebar hidden">
        <p style="font-size:11px; color:#aaa;">生徒一覧</p>
        <div id="student-grid-mini"></div>
    </div>
</div>

<div id="local-preview-area" class="hidden" style="position:fixed; bottom:10px; left:10px; width:150px; border:1px solid #00d1ff; background:#000; padding:5px; border-radius:8px; font-size:10px; z-index:200;">
    <video id="local-video" autoplay playsinline muted style="width:100%; border-radius:4px;"></video>
    <div>自分の共有画面</div>
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box" id="mode-selector">
        <h2 style="margin-top:0;">開始モードを選択</h2>
        <button class="btn-teacher-share" style="width:100%;" onclick="showTeacherSub('share')">👨‍🏫 配信開始</button>
        <button class="btn-teacher-monitor" style="width:100%;" onclick="showTeacherSub('monitor')">🖥️ 監視開始</button>
        <button class="btn-student" style="width:100%;" onclick="showStudentInput()">🎓 生徒として参加</button>
    </div>
    <div class="setup-box hidden" id="id-input-box">
        <h2 id="input-title">ID設定</h2>
        <input type="number" id="room-id" placeholder="例: 1234">
        <button id="start-btn" class="btn-main" style="width:100%; background:#00d1ff; color:#000;">開始</button>
        <button class="btn-sub" style="width:100%;" onclick="location.reload()">キャンセル</button>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let activeCalls = {}; // 通信を管理するオブジェクト

    function showTeacherSub(mode) {
        document.getElementById('mode-selector').classList.add('hidden');
        document.getElementById('id-input-box').classList.remove('hidden');
        if (mode === 'share') {
            document.getElementById('start-btn').onclick = () => initTeacherShare();
        } else {
            document.getElementById('start-btn').onclick = () => initTeacherMonitor();
        }
    }

    function showStudentInput() {
        document.getElementById('mode-selector').classList.add('hidden');
        document.getElementById('id-input-box').classList.remove('hidden');
        document.getElementById('start-btn').onclick = () => initStudent();
    }

    // --- 【教員：配信モード】 ---
    async function initTeacherShare() {
        const rid = document.getElementById('room-id').value;
        if (!rid) return;
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            localVideo.srcObject = localStream;
            document.getElementById('local-preview-area').classList.remove('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('info-panel').classList.remove('hidden');
            document.getElementById('teacher-sidebar').classList.remove('hidden');
            
            peer = new Peer(rid);
            peer.on('open', id => {
                document.getElementById('id-val').innerText = id;
                new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('#')[0] + "#" + id, width: 140, height: 140 });
            });
            peer.on('call', call => {
                activeCalls[call.peer] = call;
                call.answer();
                call.on('stream', stream => addStudentVideo(call.peer, stream, 'teacher-sidebar'));
            });
            peer.on('connection', conn => peer.call(conn.peer, localStream));
        } catch (e) { console.error(e); }
    }

    // --- 【教員：監視モード】 ---
    async function initTeacherMonitor() {
        const rid = document.getElementById('room-id').value;
        if (!rid) return;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('student-grid').classList.remove('hidden');
        
        peer = new Peer("MONITOR-" + rid); 
        peer.on('call', call => {
            activeCalls[call.peer] = call;
            call.answer();
            call.on('stream', stream => addStudentVideo(call.peer, stream, 'student-grid'));
        });
    }

    // --- 【生徒：参加モード】 ---
    async function initStudent() {
        const rid = document.getElementById('room-id').value;
        if (!rid) return;
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 640 } });
            localVideo.srcObject = localStream;
            document.getElementById('local-preview-area').classList.remove('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            
            peer = new Peer();
            peer.on('open', myId => {
                peer.connect(rid);
                peer.call(rid, localStream);
                peer.call("MONITOR-" + rid, localStream);
                peer.on('call', call => {
                    call.answer();
                    call.on('stream', stream => {
                        mainVideo.srcObject = stream;
                        mainVideo.classList.remove('hidden');
                        document.getElementById('info-panel').classList.add('hidden');
                    });
                });
            });
        } catch (e) { console.error(e); }
    }

    // 生徒のビデオを追加（削除ボタン付き）
    function addStudentVideo(id, stream, targetId) {
        const target = document.getElementById(targetId === 'student-grid' ? 'student-grid' : 'student-grid-mini');
        if (document.getElementById(`card-${id}`)) return;

        const card = document.createElement('div');
        card.className = targetId === 'student-grid' ? 'student-card' : '';
        card.id = `card-${id}`;
        if(targetId === 'student-grid-mini') card.style.marginBottom = "15px";

        card.innerHTML = `
            <div class="student-header">
                <span class="student-label">生徒:${id.substring(0,5)}</span>
                <button class="btn-remove" onclick="removeStudent('${id}')">削除</button>
            </div>
            <video id="v-${id}" autoplay playsinline muted style="width:100%; border-radius:5px;"></video>
        `;
        target.appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
    }

    // 生徒を削除する関数
    function removeStudent(id) {
        if (confirm(`生徒 ${id.substring(0,5)} の画面を終了しますか？`)) {
            // 1. 通信を切断
            if (activeCalls[id]) {
                activeCalls[id].close();
                delete activeCalls[id];
            }
            // 2. 画面から消去
            const card = document.getElementById(`card-${id}`);
            if (card) card.remove();
        }
    }

    window.onload = () => { if(window.location.hash) document.getElementById('room-id').value = window.location.hash.substring(1); };
</script>
</body>
</html>
