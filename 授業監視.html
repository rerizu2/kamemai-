<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-OS Pro Infinity</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --card: #161616; --panel: #1e1e1e; 
            --danger: #ff4757; --success: #2ecc71; --warning: #f1c40f; --monitor-height: 40%; 
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* --- ヘッダー --- */
        header { background: #000; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 55px; border-bottom: 1px solid #333; z-index: 5000; }
        .logo { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: var(--accent); }
        .status-bar { display: flex; align-items: center; gap: 20px; font-size: 11px; color: #888; }
        .timer-badge { font-family: monospace; font-size: 18px; color: var(--warning); background: #111; padding: 2px 10px; border-radius: 5px; border: 1px solid #333; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* --- サイドバー --- */
        .sidebar { width: 260px; background: #0a0a0a; border-right: 1px solid #222; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .sidebar.hidden { display: none; }
        .side-panel { background: var(--card); padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .side-title { font-size: 10px; color: #666; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 4px; }

        /* --- メインコンテンツ --- */
        .stage { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        .viewport { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        
        #wb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; background: transparent; }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }
        .whiteboard-mode .viewport { background: #fff !important; }
        .whiteboard-mode #main-video { opacity: 0; }

        /* --- 監視エリア（教員専用） --- */
        .monitor-tray { height: var(--monitor-height); background: #080808; display: flex; flex-direction: column; border-top: 1px solid #333; flex-shrink: 0; }
        .tray-header { display: flex; background: #000; padding: 5px 15px; border-bottom: 1px solid #222; justify-content: space-between; }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 8px; overflow-y: auto; }
        .student-card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 5px; text-align: center; position: relative; }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }
        .student-card.raised { border-color: var(--warning); box-shadow: 0 0 10px var(--warning); }

        /* --- 操作ドック --- */
        .dock { height: 65px; background: #000; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 15px; gap: 10px; z-index: 4500; }
        .dock-btn { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .dock-btn.primary { background: var(--accent); color: #000; border: none; }
        input[type="text"] { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 10px 18px; border-radius: 20px; outline: none; }

        /* --- ツールハブ --- */
        #hub-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 8000; display: none; padding: 40px; overflow-y: auto; backdrop-filter: blur(10px); }
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .hub-item { background: #151515; border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .hub-item:hover { border-color: var(--accent); transform: translateY(-3px); }
        .hub-icon { font-size: 28px; display: block; margin-bottom: 10px; }

        /* --- ホワイトボードツール --- */
        #wb-toolbar { position: absolute; left: 10px; top: 10px; z-index: 1000; background: white; color: #333; padding: 8px; border-radius: 12px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .wb-active #wb-toolbar { display: flex; }
        .tool-btn { width: 34px; height: 34px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; font-size: 16px; }
        .tool-btn.active { background: var(--accent); color: black; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #ccc; }

        /* --- モーダル・通知 --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 9000; display: none; justify-content: center; align-items: center; }
        #setup-screen { display: flex; }
        .card { background: #111; padding: 40px; border-radius: 30px; text-align: center; width: 340px; border: 1px solid #222; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; z-index: 10000; display: none; }
        .hidden { display: none !important; }
        #focus-overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body id="root">

<div id="toast"></div>

<!-- セットアップ画面 -->
<div id="setup-screen" class="overlay">
    <div class="card">
        <h1 style="color:var(--accent); margin:0 0 10px; font-size:24px;">EDU-OS Infinity</h1>
        <p style="color:#555; font-size:11px; margin-bottom:30px;">Professional Digital Classroom</p>
        <input type="text" id="user-name" style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid #333; background:#000; color:#fff;" placeholder="名前を入力">
        <input type="number" id="room-id" style="width:100%; padding:14px; margin-bottom:30px; border-radius:10px; border:1px solid #333; background:#000; color:#fff;" placeholder="ルームID">
        <button class="dock-btn primary" style="width:100%; height:50px; font-size:14px;" onclick="startSystem('teacher')">先生として開始</button>
        <button class="dock-btn" style="width:100%; height:50px; margin-top:10px; font-size:14px;" onclick="startSystem('student')">生徒として参加</button>
    </div>
</div>

<div id="focus-overlay">
    <h1 style="font-size:50px; color:var(--accent);">ATTENTION</h1>
    <p>先生の説明に注目してください。操作はロックされています。</p>
</div>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <div class="logo">EDU Pro Infinity</div>
        <div id="timer-display" class="timer-badge">00:00</div>
    </div>
    <div class="status-bar">
        <span>ID: <b id="room-display" style="color:#fff">----</b></span>
        <span id="connect-display">0 Students</span>
        <button class="dock-btn" style="background:var(--danger); border:none; height:30px;" onclick="location.reload()">終了</button>
    </div>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="side-panel">
            <div class="side-title">LIVE FEED</div>
            <video id="my-local-video" style="width:100%; border-radius:6px; background:#000; aspect-ratio:16/9; object-fit:cover;" autoplay playsinline muted></video>
            <button class="dock-btn" style="width:100%; margin-top:10px; font-size:9px; height:25px; justify-content:center;" onclick="changeSource()">ソース変更</button>
        </div>
        <div class="side-panel">
            <div class="side-title">出席名簿</div>
            <div id="roster-list" style="font-size:11px; max-height: 200px; overflow-y:auto;"></div>
        </div>
        <div class="side-panel">
            <div class="side-title">教務リンク</div>
            <div id="resource-hub" style="font-size:10px; color:var(--accent);"></div>
        </div>
    </div>

    <div class="stage">
        <div class="viewport" id="viewport-container">
            <div id="laser" style="position:absolute; width:12px; height:12px; background:red; border-radius:50%; box-shadow:0 0 10px red; display:none; z-index:1000; pointer-events:none;"></div>
            <video id="main-video" autoplay playsinline muted></video>
            <canvas id="wb-canvas"></canvas>

            <div id="wb-toolbar">
                <div id="wb-teacher-ctrl" class="hidden">
                    <select id="wb-mode" onchange="setWbMode(this.value)" style="width:100%; font-size:10px; margin-bottom:5px;">
                        <option value="teacher">先生のみ</option>
                        <option value="individual">各自練習</option>
                        <option value="all">全員共有</option>
                    </select>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <div class="tool-btn active" id="tool-pen" onclick="setTool('pen', this)">🖊️</div>
                    <div class="tool-btn" id="tool-eraser" onclick="setTool('eraser', this)">🧽</div>
                    <button class="tool-btn" onclick="undoWb()">↩️</button>
                    <button class="tool-btn" onclick="clearWb()">🗑️</button>
                </div>
                <div style="display:flex; gap:8px; justify-content:center; padding:5px 0;">
                    <div class="color-dot" style="background:black" onclick="wbColor='black'"></div>
                    <div class="color-dot" style="background:red" onclick="wbColor='red'"></div>
                    <div class="color-dot" style="background:blue" onclick="wbColor='blue'"></div>
                </div>
                <button class="dock-btn primary" style="font-size:9px; width:100%; height:25px;" onclick="toggleWb()">閉じる</button>
            </div>
        </div>

        <div id="monitor-tray" class="monitor-tray hidden">
            <div class="tray-header">
                <div style="display:flex; gap:10px;">
                    <div class="tab active" onclick="switchTab('screen')">SCREEN</div>
                    <div class="tab" onclick="switchTab('board')">BOARD</div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="dock-btn" onclick="shootConfetti()" style="font-size:9px; padding:3px 10px; background:var(--purple); border:none;">🎉 PRAISE</button>
                    <input type="range" min="15" max="80" value="38" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')" style="width:60px;">
                </div>
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<div class="dock">
    <button class="dock-btn primary" onclick="toggleWb()">🖊️ BOARD</button>
    <button id="teacher-hub-btn" class="dock-btn hidden" onclick="toggleHub()">🛠️ TOOLBOX</button>
    <input type="text" id="dock-input" placeholder="メッセージまたはURLを送信...">
    <button class="dock-btn primary" onclick="handleDockSend()">SEND</button>
    
    <div id="student-tools" class="hidden" style="display:flex; gap:8px;">
        <button id="hand-btn" class="dock-btn" style="background:var(--warning); color:#000;" onclick="toggleHand()">✋ 挙手</button>
    </div>
    <button id="reset-spot-btn" class="dock-btn hidden" style="background:var(--success);" onclick="resetSpotlight()">🔄 配信を戻す</button>
</div>

<!-- 🛠️ ハブ -->
<div id="hub-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h1 style="margin:0;">Command Center</h1>
        <button onclick="toggleHub()" class="dock-btn">CLOSE</button>
    </div>
    <div class="hub-grid" id="hub-items"></div>
</div>

<!-- アンケート回答用 -->
<div id="poll-overlay" class="overlay">
    <div class="card" style="background:white; color:black; width:380px;">
        <h2 id="poll-q-text">Question</h2>
        <div id="poll-options-box" style="display:flex; flex-direction:column; gap:10px; margin-top:20px;"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "teacher", wbTool = "pen", wbHistory = [];
    let isFocus = false, isRaised = false, timerInterval;

    async function startSystem(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || (role==='teacher'?'Teacher':'Student');
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("ルームIDを入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
            document.getElementById('setup-screen').style.display = 'none';
            initWhiteboard();
            buildHub(); 

            if (role === 'teacher') {
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('monitor-tray').classList.remove('hidden');
                document.getElementById('teacher-hub-btn').classList.remove('hidden');
                document.getElementById('wb-teacher-ctrl').classList.remove('hidden');
                peer = new Peer("T-ROOM-" + currentRid);
                setupTeacher();
            } else {
                document.getElementById('student-tools').classList.remove('hidden');
                peer = new Peer();
                setupStudent();
            }
        } catch(e) { alert("アクセス拒否されました"); location.reload(); }
    }

    function setupTeacher() {
        peer.on('open', () => {
            document.getElementById('room-display').innerText = currentRid;
            document.getElementById('my-local-video').srcObject = localStream;
            document.getElementById('main-video').srcObject = localStream;
        });
        peer.on('connection', conn => {
            dataConnections[conn.peer] = conn;
            conn.on('data', data => handleIncomingData(conn.peer, data));
        });
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => { studentStreams[call.peer] = s; addStudent(call.peer, s); });
        });
        window.addEventListener('pointermove', e => {
            if(!wbDrawing && myRole === 'teacher') {
                const rect = document.getElementById('viewport-container').getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width, y = (e.clientY - rect.top) / rect.height;
                Object.values(dataConnections).forEach(c => c.send({type:'LASER', x, y}));
            }
        });
    }

    function setupStudent() {
        const tid = "T-ROOM-" + currentRid;
        peer.on('open', () => {
            const call = peer.call(tid, localStream);
            const conn = peer.connect(tid);
            dataConnections[tid] = conn;
            conn.on('open', () => conn.send({ type: 'INFO', name: myName }));
            conn.on('data', data => handleIncomingData(tid, data));
            call.on('stream', s => { document.getElementById('main-video').srcObject = s; });
        });
    }

    // --- ホワイトボード同期 ---
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        const resize = () => { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; };
        resize(); window.onresize = resize;
        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (wbCanvas.width / rect.width), y: (e.clientY - rect.top) * (wbCanvas.height / rect.height) };
        };
        wbCanvas.addEventListener('pointerdown', e => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true; const pos = getPos(e); drawStroke(pos.x, pos.y, true); sendStroke(pos.x, pos.y, true);
        });
        wbCanvas.addEventListener('pointermove', e => {
            if (!wbDrawing) return;
            const pos = getPos(e); drawStroke(pos.x, pos.y, false); sendStroke(pos.x, pos.y, false);
        });
        window.addEventListener('pointerup', () => { if(wbDrawing) saveWbHistory(); wbDrawing = false; });
    }

    function drawStroke(x, y, start) {
        wbCtx.lineCap = "round"; wbCtx.lineJoin = "round";
        wbCtx.globalCompositeOperation = (wbTool === 'eraser') ? 'destination-out' : 'source-over';
        wbCtx.lineWidth = (wbTool === 'eraser') ? 40 : 3;
        wbCtx.strokeStyle = wbColor;
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x, y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function sendStroke(x, y, start) {
        const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, tool: wbTool, start };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function handleIncomingData(id, data) {
        switch(data.type) {
            case 'INFO': studentInfo[id] = { ...data, points: 0 }; updateRoster(); updateConnectCount(); break;
            case 'WB_DRAW': 
                const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
                if(myRole === 'teacher' || id.startsWith('T-ROOM') || wbMode === 'all') {
                    const ct = wbTool, cc = wbColor; wbTool = data.tool; wbColor = data.color;
                    drawStroke(x, y, data.start); wbTool = ct; wbColor = cc;
                }
                const mini = document.getElementById(`wb-mini-${id}`);
                if(mini && data.start) { const mc = mini.getContext('2d'); mc.beginPath(); mc.moveTo(data.x*mini.width, data.y*mini.height); }
                else if(mini) { const mc = mini.getContext('2d'); mc.strokeStyle = data.color; mc.lineTo(data.x*mini.width, data.y*mini.height); mc.stroke(); }
                if(myRole === 'teacher' && wbMode === 'all') Object.entries(dataConnections).forEach(([tid, c]) => { if(tid !== id) c.send(data); });
                break;
            case 'WB_START': document.body.classList.add('wb-active'); resizeCanvas(); break;
            case 'WB_STOP': document.body.classList.remove('wb-active'); break;
            case 'WB_MODE': wbMode = data.mode; break;
            case 'WB_BG': setBgStyle(data.bg); break;
            case 'WB_CLEAR': wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); break;
            case 'FOCUS': document.getElementById('focus-overlay').style.display = data.active ? 'flex' : 'none'; break;
            case 'TIMER': document.getElementById('timer-display').innerText = data.time; break;
            case 'HAND': studentInfo[id].hand = data.active; document.getElementById(`card-${id}`)?.classList.toggle('raised', data.active); break;
            case 'POLL_START': showPollUI(data.q, data.opts); break;
            case 'KICK': location.reload(); break;
            case 'COMMENT': showToast(data.msg); break;
            case 'LASER': const l = document.getElementById('laser'); l.style.display='block'; l.style.left=(data.x*100)+'%'; l.style.top=(data.y*100)+'%'; break;
        }
    }

    // --- 100機能ハブ ---
    const HUB_TOOLS = [
        { icon: '🔒', name: '注目モード', fn: () => { isFocus = !isFocus; Object.values(dataConnections).forEach(c => c.send({type:'FOCUS', active:isFocus})); toggleHub(); } },
        { icon: '🎲', name: 'ランダム指名', fn: () => { const ids = Object.keys(studentInfo); if(ids.length) alert("指名: " + studentInfo[ids[Math.floor(Math.random()*ids.length)]].name); } },
        { icon: '⏱️', name: 'タイマー', fn: () => startTimer() },
        { icon: '📊', name: '投票開始', fn: () => { const q = prompt("質問?"); const opts = prompt("選択肢(カンマ区切り)","はい,いいえ").split(","); Object.values(dataConnections).forEach(c => c.send({type:'POLL_START', q, opts})); toggleHub(); } },
        { icon: '⬜', name: '白紙ボード', fn: () => setWbBg('white') },
        { icon: '🏁', name: '方眼紙', fn: () => setWbBg('grid') },
        { icon: '💎', name: '全員加点', fn: () => { Object.values(dataConnections).forEach(c => c.send({type:'STAR'})); showToast("加点しました"); } },
        { icon: '📋', name: '出席CSV', fn: () => exportAttendance() },
        { icon: '💣', name: '一斉退出', fn: () => { if(confirm("終了?")) Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); } }
    ];

    function buildHub() {
        const hub = document.getElementById('hub-items');
        HUB_TOOLS.forEach(t => {
            const div = document.createElement('div'); div.className = 'hub-item';
            div.innerHTML = `<span class="hub-icon">${t.icon}</span><b>${t.name}</b>`;
            div.onclick = t.fn; hub.appendChild(div);
        });
    }

    function toggleHub() { const h = document.getElementById('hub-overlay'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    function shootConfetti() { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); }
    function toggleWb() { const a = document.body.classList.toggle('wb-active'); if(myRole==='teacher') Object.values(dataConnections).forEach(c=>c.send({type:a?'WB_START':'WB_STOP'})); setTimeout(resizeCanvas, 50); }
    function setWbMode(m) { wbMode = m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function setWbBg(bg) { setBgStyle(bg); Object.values(dataConnections).forEach(c => c.send({type:'WB_BG', bg})); toggleHub(); }
    function setBgStyle(bg) { document.body.className = bg === 'grid' ? 'whiteboard-mode grid-lines' : (bg==='transparent'?'':bg+'-mode'); }
    function startTimer() { const s = prompt("秒数?","60"); if(!s) return; let t = parseInt(s); clearInterval(timerInterval); timerInterval = setInterval(()=>{ t--; let d = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0'); document.getElementById('timer-display').innerText = d; Object.values(dataConnections).forEach(c => c.send({type:'TIMER', time:d})); if(t<=0) clearInterval(timerInterval); },1000); toggleHub(); }
    function switchTab(t) { document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen'); document.getElementById('grid-board').classList.toggle('hidden', t !== 'board'); document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.innerText.includes(t.toUpperCase()))); }
    function updateConnectCount() { document.getElementById('connect-display').innerText = Object.keys(studentInfo).length + " Students"; }
    function updateRoster() { const r = document.getElementById('roster-list'); r.innerHTML = ""; Object.entries(studentInfo).forEach(([id, info]) => { r.innerHTML += `<div style="font-size:11px; margin-bottom:5px;">● ${info.name}</div>`; }); }
    function handleDockSend() { const v = document.getElementById('dock-input').value; if(!v) return; if(v.startsWith('http')) { Object.values(dataConnections).forEach(c=>c.send({type:'RESOURCE', url:v})); document.getElementById('shared-links').innerHTML += `<a href="${v}" target="_blank">🔗教材</a>`; } else { Object.values(dataConnections).forEach(c=>c.send({type:'COMMENT', msg:v})); } document.getElementById('dock-input').value = ""; }
    function showPollUI(q, opts) { document.getElementById('poll-overlay').style.display = 'flex'; document.getElementById('poll-q-text').innerText = q; const b = document.getElementById('poll-options-box'); b.innerHTML = ""; opts.forEach((o, i) => { const btn = document.createElement('button'); btn.className = "dock-btn primary"; btn.innerText = o; btn.onclick = () => { dataConnections["T-ROOM-"+currentRid]?.send({type:'VOTE', idx:i}); document.getElementById('poll-overlay').style.display = 'none'; }; b.appendChild(btn); }); }
    function toggleHand() { isRaised = !isRaised; document.getElementById('hand-btn').style.background = isRaised ? 'var(--success)' : 'var(--warning)'; dataConnections["T-ROOM-"+currentRid]?.send({type:'HAND', active:isRaised}); }
    function addStudent(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const name = studentInfo[id]?.name || 'Student';
        const card = document.createElement('div'); card.className = 'card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline muted></video><span class="card-name">${name}</span><button class="dock-btn primary" style="font-size:8px; width:100%; height:20px; justify-content:center; margin-top:5px;" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card); document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'card';
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white; border-radius:5px;"></canvas><span style="font-size:9px;">${name}</span>`;
        document.getElementById('grid-board').appendChild(wbCard);
    }
    async function startSpotlight(id) { const track = studentStreams[id].getVideoTracks()[0]; document.getElementById('main-video').srcObject = studentStreams[id]; document.getElementById('reset-spot-btn').classList.remove('hidden'); Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } }); }
    function resetSpotlight() { const track = localStream.getVideoTracks()[0]; document.getElementById('main-video').srcObject = localStream; document.getElementById('reset-spot-btn').classList.add('hidden'); Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } }); }
</script>
