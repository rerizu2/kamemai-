<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>統合授業システム - Ultimate Sync v3</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #000; --panel: #1a1a1a; --text: #eee; --warn: #ff4757; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; height: 50px; box-sizing: border-box; z-index: 100; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: var(--accent); }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー（先生用：名簿と集計） */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .room-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid var(--accent); margin-bottom: 10px; }
        .sidebar-title { font-size: 11px; font-weight: bold; color: var(--accent); margin-top: 10px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .roster-item { background: #333; padding: 10px; border-radius: 8px; font-size: 11px; border: 1px solid #444; margin-bottom: 5px; }

        /* チャット履歴パネル（右側） */
        .chat-panel { width: 260px; background: var(--panel); border-left: 1px solid #444; display: flex; flex-direction: column; z-index: 80; }
        .chat-header { background: #333; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #444; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 11px; padding: 8px; border-radius: 6px; background: #262626; border-left: 3px solid var(--accent); line-height: 1.4; word-break: break-all; }
        .chat-msg.private { border-left-color: #f39c12; background: #3d2b1a; }
        .chat-msg .name { font-weight: bold; display: block; font-size: 10px; margin-bottom: 2px; }

        /* メインビューエリア */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; position: relative; overflow: hidden; }
        .split-container { display: flex; width: 100%; height: 100%; transition: 0.5s; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #333; }
        
        .view-section { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #222; background: #000; overflow: hidden; }
        video.main-video { width: 100%; height: 100%; object-fit: contain; }

        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; }
        .wb-active #wb-section { display: flex; }
        .wb-hidden-local #wb-section { display: none !important; }
        .wb-tools { background: #f0f0f0; padding: 8px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; color: #000; align-items: center; z-index: 10; flex-wrap: wrap; }
        .color-opt { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px #000; }
        .color-opt.active { transform: scale(1.2); border-color: #000; }
        canvas { background: white; flex: 1; cursor: crosshair; touch-action: none; }

        /* 監視グリッド */
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 4px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        .is-sharing { border: 2px solid var(--accent); }

        /* 配信ステータスラベル */
        #sharing-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: var(--accent); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--accent); font-size: 11px; font-weight: bold; z-index: 500; pointer-events: none; }

        /* アンケートパネル（生徒用ポップアップ） */
        .poll-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; text-align: center; }
        .poll-btn { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-weight: bold; }
        .poll-bar-bg { background: #eee; border-radius: 5px; height: 14px; margin: 5px 0 10px; overflow: hidden; position: relative; }
        .poll-bar-fill { background: #0097e6; height: 100%; width: 0%; transition: 0.8s; }

        /* UIコントロール */
        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; gap: 10px; justify-content: center; }
        #student-view-controls { position: fixed; bottom: 20px; right: 280px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .btn-ui { background: rgba(40,40,40,0.9); color: white; border: 1px solid #666; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-recover { background: #0097e6; border-color: var(--accent); font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #444; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; margin-bottom: 12px; text-align: center; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        
        #comment-overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0, 151, 230, 0.95); color: white; padding: 20px 40px; border-radius: 20px; font-size: 24px; font-weight: bold; z-index: 9999; opacity: 0; transition: 0.5s; pointer-events: none; text-align: center; max-width: 80%; border: 2px solid white; }
        #comment-overlay.show { opacity: 1; top: 25%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-label">準備中...</div>
    <div class="status-bar">
        <div id="status-text">待機中</div>
        <div id="count-text">接続: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="comment-overlay"></div>

<div class="main-layout" id="root-layout">
    <!-- 先生用サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-card">
            <div style="font-size: 10px; color: var(--accent);">参加ID</div>
            <div id="display-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <button id="reset-teacher-view-btn" class="btn-ui hidden" onclick="resetToTeacher()" style="background:#f39c12; margin-bottom:10px;">先生の画面に戻す</button>
        
        <div class="sidebar-title">📊 アンケート集計</div>
        <div id="poll-summary" style="font-size:10px; background:#222; padding:8px; border-radius:5px;">未実施</div>
        <button id="share-poll-btn" class="hidden" onclick="sharePollResults()" style="width:100%; margin-top:5px; background:var(--accent); color:black; font-size:10px; padding:5px;">結果を全員に共有</button>

        <div class="sidebar-title">👤 生徒リスト</div>
        <div id="roster-list"></div>
    </div>

    <!-- メインコンテンツ -->
    <div class="primary-view">
        <div id="sharing-label">配信中: 準備中</div>

        <div class="split-container" id="main-view-split">
            <div class="view-section" id="video-section">
                <video id="main-video-player" class="main-video" autoplay playsinline muted></video>
                
                <!-- アンケート用パネル（生徒側） -->
                <div id="poll-panel-student" class="poll-overlay hidden">
                    <h3 id="poll-question" style="margin-top:0; font-size:18px;">アンケート</h3>
                    <div id="poll-options"></div>
                    <div id="poll-results-view" class="hidden"></div>
                    <button onclick="document.getElementById('poll-panel-student').classList.add('hidden')" style="width:100%; margin-top:15px; background:#ddd;">閉じる</button>
                </div>
            </div>
            
            <div class="view-section" id="wb-section">
                <div class="wb-tools">
                    <div id="wb-teacher-controls" class="hidden" style="display:flex; gap:8px; align-items:center;">
                        <div class="color-opt active" style="background:black;" onclick="setWbTool('pen','black',this)"></div>
                        <div class="color-opt" style="background:red;" onclick="setWbTool('pen','red',this)"></div>
                        <div class="color-opt" style="background:blue;" onclick="setWbTool('pen','blue',this)"></div>
                        <button onclick="setWbTool('eraser','white',this)" style="font-size:10px; padding:4px;">消しゴム</button>
                        <button onclick="clearWhiteboard()" style="font-size:10px; color:red; padding:4px;">全消去</button>
                    </div>
                    <button id="wb-close-btn-teacher" class="hidden" onclick="stopWhiteboard()" style="margin-left:auto; background:#444; color:white; font-size:10px;">終了</button>
                    <span id="wb-student-label" class="hidden" style="margin-left:auto; font-size:11px; color:#666;">（表示中）</span>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <div id="monitor-grid" class="monitor-grid hidden"></div>

        <!-- 生徒用切り替えボタン群 -->
        <div id="student-view-controls" class="hidden">
            <button class="btn-ui btn-recover" onclick="recoverQuality()">🚀 画質リカバリ</button>
            <button class="btn-ui" onclick="toggleWbLocal()">ボード ON/OFF</button>
            <button class="btn-ui" onclick="toggleChatLocal()">履歴 ON/OFF</button>
        </div>
    </div>

    <!-- チャット履歴パネル -->
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">💬 履歴ログ</div>
        <div id="chat-history"></div>
    </div>
</div>

<!-- 先生用固定コントロール -->
<div id="teacher-fixed-bar" class="controls hidden">
    <input type="text" id="global-msg-input" style="flex:1; max-width:400px; margin:0;" placeholder="全員に指示を出す...">
    <button onclick="sendGlobalComment()" style="background:#0097e6; color:white;">全員送信</button>
    <button onclick="toggleTeacherMenu()" style="background:#555; color:white;">🛠️ ツール</button>
</div>

<!-- 先生メニューモーダル -->
<div id="teacher-menu" class="overlay hidden" onclick="toggleTeacherMenu()">
    <div class="modal" onclick="event.stopPropagation()">
        <h3 style="color:var(--accent); margin-top:0;">授業管理</h3>
        <button onclick="startWhiteboard()" style="width:100%; margin-bottom:10px;">ボード配信開始</button>
        <button onclick="openPollCreator()" style="width:100%; margin-bottom:10px; background:#2ecc71; color:white;">アンケート作成</button>
        <button onclick="changeScreenSource()" style="width:100%; margin-bottom:10px;">共有画面の変更</button>
        <button onclick="kickAllStudents()" style="width:100%; background:#333; color:red;">全員を退出させる</button>
        <button onclick="toggleTeacherMenu()" style="width:100%; margin-top:20px; background:#444;">閉じる</button>
    </div>
</div>

<!-- アンケート作成モーダル -->
<div id="poll-creator" class="overlay hidden">
    <div class="modal">
        <h3>アンケート作成</h3>
        <input type="text" id="poll-q-input" placeholder="質問文を入力">
        <input type="text" id="poll-o1" placeholder="選択肢1" value="はい">
        <input type="text" id="poll-o2" placeholder="選択肢2" value="いいえ">
        <input type="text" id="poll-o3" placeholder="選択肢3（空欄可）">
        <button onclick="broadcastNewPoll()" style="background:var(--accent); color:black; width:100%;">アンケート配信</button>
        <button onclick="document.getElementById('poll-creator').classList.add('hidden')" style="width:100%; margin-top:10px; background:#444;">キャンセル</button>
    </div>
</div>

<!-- ログイン画面 -->
<div id="setup-screen" class="overlay">
    <div class="modal">
        <h2 style="color:var(--accent); margin-bottom:20px;">Remote Lesson Sync</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="参加ID（生徒のみ）">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="joinLesson('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="joinLesson('student')">生徒として参加</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "pen";
    let currentPoll = { q: "", opts: [], votes: [] };
    let currentSpotlightId = null; // 現在誰の画面を共有中か

    const HQ_CONFIG = { video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: 30 }, audio: true };

    async function joinLesson(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を入力してください");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;
        if (!currentRid) return alert("IDを入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia(HQ_CONFIG);
            if (localStream.getVideoTracks()[0]) localStream.getVideoTracks()[0].contentHint = 'detail';
            
            document.getElementById('setup-screen').classList.add('hidden');
            initWhiteboard();

            const pId = (role === 'teacher' ? "TEACHER-ROOM-" : "") + currentRid;
            peer = new Peer(role === 'student' ? undefined : pId);

            peer.on('open', () => {
                document.getElementById('mode-label').innerText = role === 'teacher' ? "先生モード" : "生徒モード";
                if (role === 'teacher') {
                    document.getElementById('root-layout').classList.add('teacher-mode');
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('monitor-grid').classList.remove('hidden');
                    document.getElementById('teacher-fixed-bar').classList.remove('hidden');
                    document.getElementById('wb-teacher-controls').classList.remove('hidden');
                    document.getElementById('wb-close-btn-teacher').classList.remove('hidden');
                    document.getElementById('display-id').innerText = currentRid;
                    document.getElementById('main-video-player').srcObject = localStream;
                    document.getElementById('sharing-label').innerText = "配信中: 先生の画面";
                } else {
                    document.getElementById('student-view-controls').classList.remove('hidden');
                    document.getElementById('wb-student-label').classList.remove('hidden');
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleIncomingData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                // 先生側：新しく繋がった生徒には、今「配信中」のストリームを送る
                let streamToSend = localStream;
                if (myRole === 'teacher' && currentSpotlightId && studentStreams[currentSpotlightId]) {
                    streamToSend = studentStreams[currentSpotlightId];
                }
                call.answer(streamToSend);
                call.on('stream', s => {
                    if (myRole === 'teacher') {
                        studentStreams[call.peer] = s;
                        updateRosterAndMonitor(call.peer, s);
                    }
                });
            });
        } catch (e) { location.reload(); }
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        conn.on('open', () => conn.send({ type: 'JOIN', name: myName }));
        conn.on('data', data => handleIncomingData(tId, data));
        
        const call = peer.call(tId, localStream);
        mediaCalls[tId] = call;
        call.on('stream', s => { document.getElementById('main-video-player').srcObject = s; });
    }

    // --- 画質リカバリ (SDP操作) ---
    function recoverQuality() {
        const tId = "TEACHER-ROOM-" + currentRid;
        if (mediaCalls[tId]) mediaCalls[tId].close();
        const call = peer.call(tId, localStream, {
            sdpTransform: (sdp) => sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:10000\r\n')
        });
        mediaCalls[tId] = call;
        call.on('stream', s => { document.getElementById('main-video-player').srcObject = s; showStatusComment("画質をリカバリしました"); });
    }

    // --- 映像共有 (スポットライト) ---
    function spotlightStudent(id) {
        const track = studentStreams[id]?.getVideoTracks()[0];
        if(!track) return;
        currentSpotlightId = id;
        broadcastTrack(track);
        document.getElementById('main-video-player').srcObject = new MediaStream([track]);
        document.getElementById('reset-teacher-view-btn').classList.remove('hidden');
        const name = studentInfo[id]?.name || "生徒";
        broadcastData({ type: 'STATUS_SYNC', sharingName: name, spotlightId: id });
        updateGlobalSharingUI(name, id);
    }

    function resetToTeacher() {
        const track = localStream.getVideoTracks()[0];
        currentSpotlightId = null;
        broadcastTrack(track);
        document.getElementById('main-video-player').srcObject = localStream;
        document.getElementById('reset-teacher-view-btn').classList.add('hidden');
        broadcastData({ type: 'STATUS_SYNC', sharingName: '先生', spotlightId: null });
        updateGlobalSharingUI('先生', null);
    }

    function broadcastTrack(track) {
        Object.values(mediaCalls).forEach(call => {
            if (call.peerConnection) {
                const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(track);
            }
        });
    }

    function updateGlobalSharingUI(name, id) {
        document.getElementById('sharing-label').innerText = `配信中: ${name} の画面`;
        document.querySelectorAll('.student-card').forEach(c => c.classList.remove('is-sharing'));
        if(id && document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).classList.add('is-sharing');
    }

    // --- アンケートロジック ---
    function openPollCreator() { toggleTeacherMenu(); document.getElementById('poll-creator').classList.remove('hidden'); }
    function broadcastNewPoll() {
        const q = document.getElementById('poll-q-input').value;
        const opts = [document.getElementById('poll-o1').value, document.getElementById('poll-o2').value, document.getElementById('poll-o3').value].filter(v => v);
        if(!q || opts.length < 2) return alert("質問と2つ以上の選択肢が必要です");
        currentPoll = { q, opts, votes: opts.map(() => 0) };
        broadcastData({ type: 'POLL_START', q, opts });
        document.getElementById('poll-creator').classList.add('hidden');
        updateTeacherPollSummary();
        document.getElementById('share-poll-btn').classList.remove('hidden');
    }

    function updateTeacherPollSummary() {
        const area = document.getElementById('poll-summary');
        const total = currentPoll.votes.reduce((a, b) => a + b, 0);
        area.innerHTML = `<strong>Q: ${currentPoll.q}</strong> (計 ${total}名)<br>`;
        currentPoll.opts.forEach((opt, i) => {
            const pct = total === 0 ? 0 : Math.round((currentPoll.votes[i]/total)*100);
            area.innerHTML += `<div style="margin-top:4px;">${opt}: ${pct}%</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
        });
    }

    function sharePollResults() { broadcastData({ type: 'POLL_FINAL', q: currentPoll.q, opts: currentPoll.opts, votes: currentPoll.votes }); showStatusComment("結果を共有しました"); }

    // --- データ受信処理 ---
    function handleIncomingData(id, data) {
        if (data.type === 'JOIN') { 
            studentInfo[id] = { name: data.name }; 
            updateStatusText();
            if(myRole === 'teacher') {
                // 進行中の状態を同期
                const currentSharing = currentSpotlightId ? studentInfo[currentSpotlightId].name : '先生';
                dataConnections[id].send({ type: 'STATUS_SYNC', sharingName: currentSharing, spotlightId: currentSpotlightId });
            }
        }
        else if (data.type === 'MSG') { addChatLog(data.from, data.msg, data.isPrivate); if(!data.isPrivate) showStatusComment(data.msg); }
        else if (data.type === 'STATUS_SYNC') { updateGlobalSharingUI(data.sharingName, data.spotlightId); }
        else if (data.type === 'POLL_START') { 
            const panel = document.getElementById('poll-panel-student'); panel.classList.remove('hidden');
            document.getElementById('poll-results-view').classList.add('hidden');
            const optArea = document.getElementById('poll-options'); optArea.innerHTML = "";
            document.getElementById('poll-question').innerText = data.q;
            data.opts.forEach((opt, idx) => {
                const b = document.createElement('button'); b.className = "poll-btn"; b.innerText = opt;
                b.onclick = () => { dataConnections["TEACHER-ROOM-"+currentRid].send({type:'POLL_VOTE', choice:idx}); optArea.innerHTML="<p>投票完了。結果をお待ちください。</p>"; };
                optArea.appendChild(b);
            });
        }
        else if (data.type === 'POLL_VOTE') { currentPoll.votes[data.choice]++; updateTeacherPollSummary(); }
        else if (data.type === 'POLL_FINAL') {
            const panel = document.getElementById('poll-panel-student'); panel.classList.remove('hidden');
            document.getElementById('poll-options').innerHTML = "";
            const resArea = document.getElementById('poll-results-view'); resArea.classList.remove('hidden');
            resArea.innerHTML = `<strong>集計結果: ${data.q}</strong><br>`;
            const total = data.votes.reduce((a, b) => a + b, 0);
            data.opts.forEach((opt, i) => {
                const pct = total === 0 ? 0 : Math.round((data.votes[i]/total)*100);
                resArea.innerHTML += `<div style="margin-top:8px; text-align:left; font-size:12px;">${opt} (${pct}%)</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
            });
        }
        else if (data.type === 'WB_START') { document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); }
        else if (data.type === 'WB_STOP') { document.getElementById('root-layout').classList.remove('wb-active'); }
        else if (data.type === 'WB_DRAW') { drawRemote(data); }
        else if (data.type === 'WB_CLEAR') { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); }
        else if (data.type === 'KICK') location.reload();
    }

    // --- ホワイトボード機能 ---
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        wbCanvas.onpointerdown = e => { if (myRole!=='teacher') return; wbDrawing=true; wbCanvas.setPointerCapture(e.pointerId); const p=getWbPos(e); startStroke(p.x, p.y, wbColor, 3, wbMode); broadcastData({type:'WB_DRAW', x:p.x, y:p.y, color:wbColor, start:true}); };
        wbCanvas.onpointermove = e => { if (!wbDrawing) return; const p=getWbPos(e); drawLine(p.x, p.y); broadcastData({type:'WB_DRAW', x:p.x, y:p.y, start:false}); };
        wbCanvas.onpointerup = () => { wbDrawing=false; wbCtx.beginPath(); };
    }
    function getWbPos(e) { const r=wbCanvas.getBoundingClientRect(); return { x: (e.clientX-r.left)/r.width, y: (e.clientY-r.top)/r.height }; }
    function startStroke(x, y, color, size, mode) { wbCtx.beginPath(); wbCtx.globalCompositeOperation=(mode==='eraser')?'destination-out':'source-over'; wbCtx.strokeStyle=color; wbCtx.lineWidth=size; wbCtx.lineCap='round'; wbCtx.moveTo(x*wbCanvas.width, y*wbCanvas.height); }
    function drawLine(x, y) { wbCtx.lineTo(x*wbCanvas.width, y*wbCanvas.height); wbCtx.stroke(); }
    function drawRemote(d) { if (d.start) startStroke(d.x, d.y, d.color, 3, d.mode); else drawLine(d.x, d.y); }
    function startWhiteboard() { toggleTeacherMenu(); document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); broadcastData({type:'WB_START'}); }
    function stopWhiteboard() { document.getElementById('root-layout').classList.remove('wb-active'); broadcastData({type:'WB_STOP'}); }
    function clearWhiteboard() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); broadcastData({type:'WB_CLEAR'}); }
    function resizeCanvas() { const r=wbCanvas.getBoundingClientRect(); wbCanvas.width=r.width; wbCanvas.height=r.height; wbCtx.lineCap='round'; }
    function setWbTool(m, c, el) { wbMode=m; wbColor=c; document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('active')); if(el.classList.contains('color-opt')) el.classList.add('active'); }

    // --- メッセージ・管理機能 ---
    function addChatLog(from, msg, isP) {
        const h = document.getElementById('chat-history'); const d = document.createElement('div');
        d.className = `chat-msg ${isP ? 'private' : ''}`;
        d.innerHTML = `<span class="name">${from}${isP ? ' (個別)' : ''}</span>${msg}`;
        h.prepend(d);
    }
    function sendGlobalComment() {
        const i = document.getElementById('global-msg-input'); if(!i.value) return;
        broadcastData({ type: 'MSG', from: '先生', msg: i.value, isPrivate: false });
        addChatLog('自分', i.value, false); i.value = "";
    }
    function sendPrivateComment(id) {
        const msg = prompt(`${studentInfo[id].name}さんへの個別指示:`); if(!msg) return;
        dataConnections[id].send({ type: 'MSG', from: '先生', msg: msg, isPrivate: true });
        addChatLog(`${studentInfo[id].name}さんへ`, msg, true);
    }
    function showStatusComment(m) { const o=document.getElementById('comment-overlay'); o.innerText=m; o.classList.add('show'); setTimeout(()=>o.classList.remove('show'), 5000); }
    function broadcastData(data) { Object.values(dataConnections).forEach(c => c.send(data)); }
    function updateStatusText() { document.getElementById('count-text').innerText = `接続: ${Object.keys(dataConnections).length}`; }
    function toggleTeacherMenu() { document.getElementById('teacher-menu').classList.toggle('hidden'); }
    function toggleWbLocal() { document.getElementById('root-layout').classList.toggle('wb-hidden-local'); }
    function toggleChatLocal() { document.getElementById('chat-panel').classList.toggle('hidden'); }
    function kickAllStudents() { if(confirm("全員を退出させますか？")) broadcastData({type:'KICK'}); }
    async function changeScreenSource() { const s=await navigator.mediaDevices.getDisplayMedia(HQ_CONFIG); localStream=s; resetToTeacher(); toggleTeacherMenu(); }

    function updateRosterAndMonitor(id, s) {
        if(!document.getElementById(`roster-${id}`)) {
            const d = document.createElement('div'); d.className = 'roster-item'; d.id = `roster-${id}`;
            d.innerHTML = `<span id="rname-${id}" style="font-weight:bold;">...</span><br><button onclick="sendPrivateComment('${id}')" style="background:#0097e6; color:white; font-size:10px; margin-top:5px; border-radius:4px;">指示</button> <button onclick="spotlightStudent('${id}')" style="background:#f39c12; color:white; font-size:10px; border-radius:4px;">共有</button>`;
            document.getElementById('roster-list').appendChild(d);
        }
        if(!document.getElementById(`card-${id}`)) {
            const c = document.createElement('div'); c.className = 'student-card'; c.id = `card-${id}`;
            c.innerHTML = `<div style="font-size:10px; margin-bottom:2px;" id="vname-${id}"></div><video id="vid-${id}" autoplay playsinline muted></video>`;
            document.getElementById('monitor-grid').appendChild(c);
        }
        document.getElementById(`vid-${id}`).srcObject = s;
        const n = studentInfo[id]?.name || "生徒";
        document.getElementById(`rname-${id}`).innerText = n; document.getElementById(`vname-${id}`).innerText = n;
    }
    function removeStudent(id) { 
        if(document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove();
        if(document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        delete dataConnections[id]; delete studentStreams[id]; delete studentInfo[id]; updateStatusText();
    }
</script>
</body>
