<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業支援システム【究極統合・表示修正版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --monitor-height: 40vh; 
        }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; z-index: 2000; flex-shrink: 0; }
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .status-info { font-size: 11px; color: var(--accent); display: flex; gap: 15px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .preview-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        .preview-box video { width: 100%; height: 100%; object-fit: cover; }

        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        
        /* 配信画面コンテナ */
        .broadcast-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; background: #000; }
        
        /* ホワイトボード：通常は透明で後ろ、有効時のみ前へ */
        #wb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .wb-active #wb-canvas { z-index: 10; pointer-events: auto; cursor: crosshair; }
        
        /* 黒板モード設定 */
        .blackboard-mode #main-broadcast-video { opacity: 0; }

        .on-air-badge { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; z-index: 100; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ボードツール */
        #wb-tools { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.95); padding: 12px; border-radius: 15px; display: none; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); color: #333; border: 1px solid #444; }
        .wb-active #wb-tools { display: flex; }
        .tool-btn { width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; font-size: 16px; color: #333; }
        .tool-btn.active { background: var(--accent); border-color: #008888; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }

        /* 監視セクション */
        .monitor-section { height: var(--monitor-height); background: #0a0a0a; display: flex; flex-direction: column; border-top: 2px solid #333; flex-shrink: 0; }
        .tab-bar { display: flex; background: #111; padding: 5px 10px; gap: 5px; border-bottom: 1px solid #333; }
        .tab-btn { padding: 6px 12px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 4px; font-size: 10px; }
        .tab-btn.active { background: #333; color: var(--accent); }

        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 8px; }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }
        .card-name { font-size: 10px; color: #aaa; margin-top: 5px; text-align: center; }

        .controls { background: #111; padding: 10px 20px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-primary { background: #0097e6; color: white; }
        .btn-danger { background: #c23616; color: white; }
        .btn-gray { background: #444; color: white; }
        input[type="text"] { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body id="root-body">

<header>
    <div id="mode-label" style="font-weight: bold; color: var(--accent);">STUDENT SUPPORT</div>
    <div class="header-controls">
        <input type="range" min="10" max="80" value="40" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')">
        <div class="status-info">
            <span id="room-display">ID: ----</span>
            <span id="connect-display">接続: 0</span>
        </div>
        <button class="btn-gray" onclick="location.reload()" style="padding:4px 10px;">終了</button>
    </div>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="panel">
            <div class="panel-title">自分の画面</div>
            <div class="preview-box"><video id="my-local-video" autoplay playsinline muted></video></div>
            <button class="btn-gray" style="width:100%; margin-top:8px; font-size:9px;" onclick="changeSource()">ソース変更</button>
        </div>
        <div class="panel">
            <div class="panel-title">監視モニターQR</div>
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px; display:flex; justify-content:center;"></div>
        </div>
        <div id="roster-list" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">出席生徒</div>
            <div id="roster-items" style="font-size:11px;"></div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container" id="broadcast-container">
            <div class="on-air-badge">
                <div class="live-dot"></div>
                <span id="air-text">配信中: 自分の画面</span>
            </div>
            <video id="main-broadcast-video" autoplay playsinline muted></video>
            <!-- キャンバス -->
            <canvas id="wb-canvas"></canvas>

            <!-- ボードツール -->
            <div id="wb-tools">
                <div id="wb-teacher-only" class="hidden" style="display:flex; flex-direction:column; gap:8px; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <select id="wb-mode-select" onchange="setWbMode(this.value)" style="font-size:10px;">
                        <option value="teacher">先生のみ描画</option>
                        <option value="individual">各自練習（一斉監視）</option>
                        <option value="all">全員一枚に描画</option>
                    </select>
                    <button class="btn-primary" onclick="toggleBlackboard()" style="font-size:10px;">🔳 黒板モード切替</button>
                    <button class="btn-danger" onclick="clearWb()" style="font-size:10px;">全消去</button>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <div class="tool-btn active" id="btn-pen" onclick="setWbTool('pen', this)">🖊️</div>
                    <div class="tool-btn" id="btn-eraser" onclick="setWbTool('eraser', this)">🧽</div>
                    <div class="tool-btn" id="btn-line" onclick="setWbTool('line', this)">📏</div>
                    <div class="tool-btn" id="btn-rect" onclick="setWbTool('rect', this)">⬜</div>
                    <div class="tool-btn" id="btn-circle" onclick="setWbTool('circle', this)">⭕</div>
                    <div class="tool-btn" onclick="undoWb()">↩️</div>
                </div>
                <div style="display:flex; gap:8px; justify-content:center;">
                    <div class="color-dot" style="background:red;" onclick="wbColor='red'"></div>
                    <div class="color-dot" style="background:blue;" onclick="wbColor='blue'"></div>
                    <div class="color-dot" style="background:white; border:1px solid #ccc;" onclick="wbColor='white'"></div>
                    <div class="color-dot" style="background:black;" onclick="wbColor='black'"></div>
                </div>
                <button onclick="toggleWb()" style="font-size:10px; width:100%;" class="btn-gray">閉じる</button>
            </div>
        </div>

        <div id="monitor-section" class="monitor-section hidden">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('screen')">画面一覧</button>
                <button class="tab-btn" onclick="switchTab('board')">ボード一覧</button>
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <button id="wb-toggle-btn" class="btn-primary" onclick="toggleWb()">🖊️ ボード表示</button>
    <button id="broadcast-btn" class="btn-danger" onclick="toggleBroadcast()">⏹️ 配信停止</button>
    <button id="reset-btn" class="btn-danger hidden" onclick="resetSpotlight()">🔄 自分に戻す</button>
    <input type="text" id="comment-input" placeholder="メッセージ..." style="flex:1;">
    <button class="btn-primary" onclick="sendComment()">送信</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-top:0;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="参加ID">
        <button class="btn-primary" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-gray" style="width:100%; height:45px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<div id="poll-student-view" class="overlay hidden">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="st-poll-q" style="margin-top:0;">質問</h3>
        <div id="st-poll-opts"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "red", wbMode = "teacher", wbTool = "pen";
    let wbHistory = [], startX, startY, snapshot;

    async function start(role) {
        myRole = role; currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');
            initWb();

            const pId = (role==='teacher'?"T-ROOM-"+currentRid : undefined);
            peer = new Peer(pId);

            peer.on('open', id => {
                if(role === 'teacher') setupTeacherUI();
                else connectToTeacher();
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', s => { studentStreams[call.peer] = s; addStudentGrid(call.peer, s); });
            });
        } catch(e) { alert("画面共有を開始してください"); location.reload(); }
    }

    function setupTeacherUI() {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('teacher-controls').classList.remove('hidden');
        document.getElementById('layout-ctrl').classList.remove('hidden');
        document.getElementById('wb-teacher-only').classList.remove('hidden');
        document.getElementById('room-display').innerText = "ID: " + currentRid;
        document.getElementById('my-local-video').srcObject = localStream;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        const monitorUrl = window.location.origin + window.location.pathname + `?room=${currentRid}`;
        new QRCode(document.getElementById("qrcode"), { text: monitorUrl, width: 100, height: 100 });
    }

    function connectToTeacher() {
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        mediaCalls[tid] = call;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({ type: 'INFO', name: document.getElementById('user-name').value || '生徒', group: 1 }));
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
            console.log("Teacher stream received");
        });
    }

    // --- ホワイトボード描画処理 ---
    function initWb() {
        wbCanvas = document.getElementById('wb-canvas');
        wbCtx = wbCanvas.getContext('2d');
        resizeCanvas();

        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        wbCanvas.onmousedown = (e) => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true;
            const pos = getPos(e);
            startX = pos.x; startY = pos.y;
            snapshot = wbCtx.getImageData(0, 0, wbCanvas.width, wbCanvas.height);
            wbCtx.beginPath();
            wbCtx.moveTo(startX, startY);
        };

        wbCanvas.onmousemove = (e) => {
            if (!wbDrawing) return;
            const pos = getPos(e);
            if (wbTool === 'pen' || wbTool === 'eraser') {
                applyStroke(wbTool, wbColor, pos.x, pos.y, false);
                sendDrawData('point', pos.x, pos.y);
            } else {
                wbCtx.putImageData(snapshot, 0, 0);
                drawShape(wbTool, wbColor, startX, startY, pos.x, pos.y);
            }
        };

        wbCanvas.onmouseup = (e) => {
            if (!wbDrawing) return;
            wbDrawing = false;
            const pos = getPos(e);
            if (wbTool !== 'pen' && wbTool !== 'eraser') {
                sendDrawData('shape', pos.x, pos.y, startX, startY);
            }
            saveHistory();
        };
        window.onresize = resizeCanvas;
    }

    function applyStroke(tool, color, x, y, isStart) {
        wbCtx.globalCompositeOperation = (tool === 'eraser') ? 'destination-out' : 'source-over';
        wbCtx.lineWidth = (tool === 'eraser') ? 30 : 4;
        wbCtx.strokeStyle = color;
        wbCtx.lineCap = "round";
        if(isStart) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function drawShape(tool, color, x1, y1, x2, y2) {
        wbCtx.globalCompositeOperation = 'source-over';
        wbCtx.strokeStyle = color;
        wbCtx.lineWidth = 4;
        wbCtx.beginPath();
        if (tool === 'line') { wbCtx.moveTo(x1, y1); wbCtx.lineTo(x2, y2); }
        else if (tool === 'rect') { wbCtx.strokeRect(x1, y1, x2 - x1, y2 - y1); }
        else if (tool === 'circle') { 
            let r = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            wbCtx.arc(x1, y1, r, 0, 2 * Math.PI); 
        }
        wbCtx.stroke();
    }

    function sendDrawData(type, x, y, x1, y1) {
        const d = { 
            type: 'WB_DRAW', drawType: type, tool: wbTool, color: wbColor, 
            x: x/wbCanvas.width, y: y/wbCanvas.height, 
            x1: x1 ? x1/wbCanvas.width : 0, y1: y1 ? y1/wbCanvas.height : 0 
        };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function renderRemoteWb(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        const x1 = data.x1 * wbCanvas.width, y1 = data.y1 * wbCanvas.height;
        if (myRole === 'teacher' || wbMode === 'all' || (wbMode === 'group' && studentInfo[id]?.group === studentInfo[peer.id]?.group)) {
            if (data.drawType === 'point') applyStroke(data.tool, data.color, x, y, false);
            else drawShape(data.tool, data.color, x1, y1, x, y);
        }
    }

    function toggleWb() {
        const active = document.body.classList.toggle('wb-active');
        if(myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type: active?'WB_START':'WB_STOP'}));
        setTimeout(resizeCanvas, 50);
    }
    function resizeCanvas() { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; }
    function saveHistory() { if (wbHistory.length > 20) wbHistory.shift(); wbHistory.push(wbCtx.getImageData(0, 0, wbCanvas.width, wbCanvas.height)); }
    function undoWb() { wbHistory.pop(); const last = wbHistory[wbHistory.length - 1]; if (last) wbCtx.putImageData(last, 0, 0); else wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height); }
    function setWbMode(m) { wbMode = m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function setWbTool(t, btn) { wbTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function toggleBlackboard() { const active = document.body.classList.toggle('blackboard-mode'); Object.values(dataConnections).forEach(c => c.send({type:'WB_BLACKBOARD', active: active})); }

    // --- その他通信 ---
    function handleData(id, data) {
        if (data.type === 'INFO') { studentInfo[id] = data; updateRoster(); }
        else if (data.type === 'WB_DRAW') renderRemoteWb(id, data);
        else if (data.type === 'WB_START') { document.body.classList.add('wb-active'); resizeCanvas(); }
        else if (data.type === 'WB_STOP') document.body.classList.remove('wb-active');
        else if (data.type === 'WB_MODE') wbMode = data.mode;
        else if (data.type === 'WB_CLEAR') wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        else if (data.type === 'WB_BLACKBOARD') document.body.classList.toggle('blackboard-mode', data.active);
    }

    function addStudentGrid(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline muted></video><div class="card-name">${studentInfo[id]?.name || '生徒'}</div>
            <button class="btn-primary" style="width:100%; margin-top:5px; font-size:9px;" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'student-card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white;"></canvas><div class="card-name">${studentInfo[id]?.name}</div>`;
        document.getElementById('grid-board').appendChild(wbCard);
        updateCount();
    }

    async function startSpotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = studentStreams[id];
        document.getElementById('reset-btn').classList.remove('hidden');
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }

    function resetSpotlight() {
        const track = localStream.getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-btn').classList.add('hidden');
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }

    function toggleBroadcast() {
        const stop = !document.getElementById('broadcast-btn').innerText.includes("再開");
        document.getElementById('pause-overlay').classList.toggle('hidden', !stop);
        document.getElementById('broadcast-btn').innerText = stop ? "▶️ 再開" : "⏹️ 停止";
    }

    function switchTab(t) {
        document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen');
        document.getElementById('grid-board').classList.toggle('hidden', t !== 'board');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(t==='screen'?'画面':'ボード')));
    }
    function updateRoster() {
        const r = document.getElementById('roster-items'); r.innerHTML = "";
        Object.entries(studentInfo).forEach(([id, info]) => { r.innerHTML += `<div>● ${info.name}</div>`; });
    }
    function updateCount() { document.getElementById('connect-display').innerText = "接続: " + Object.keys(studentStreams).length; }
    function sendComment() {
        const m = document.getElementById('comment-input').value;
        if(m) { Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', msg:m})); document.getElementById('comment-input').value=""; }
    }
    async function changeSource() {
        localStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
        document.getElementById('my-local-video').srcObject = localStream;
        resetSpotlight();
    }
</script>
</body>
</html>
