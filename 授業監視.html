<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視・配信システム（Safari対応版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        .status { color: #00fbff; font-size: 11px; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 180px; background: #1a1a1a; border-right: 1px solid #444; display: flex; flex-direction: column; padding: 10px; }
        #student-roster { flex: 1; overflow-y: auto; }
        .roster-item { background: #333; margin-bottom: 5px; padding: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow-y: auto; padding: 10px; }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 5px; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }
        
        #teacher-video { width: 100%; height: 100%; object-fit: contain; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; text-align: center; color: black; }

        .setup-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 300px; }
        button { padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; width: 100%; font-size: 14px; margin: 5px 0; }
        input { padding: 12px; font-size: 18px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        /* 遠隔監視用の特大開始ボタン */
        #remote-start-ui { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div id="role-display">モード選択</div>
    <div id="status-msg" class="status">準備中</div>
    <button onclick="location.reload()" style="background:#444; color:#fff; border:none; width:60px;">終了</button>
</header>

<!-- 遠隔監視（Safari）用：ユーザーの操作を強制する画面 -->
<div id="remote-start-ui" class="hidden">
    <h2 style="color: #00fbff;">遠隔監視モード</h2>
    <p>準備が整いました。下のボタンを押して監視を開始してください。</p>
    <button onclick="activateRemote()" style="background:#f39c12; color:white; font-size:20px; padding:20px;">監視を開始する</button>
</div>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div id="student-roster"></div>
    </div>
    <div class="primary-view">
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <video id="teacher-video" class="hidden" autoplay playsinline muted></video>
    </div>
</div>

<div id="teacher-controls" class="controls hidden" style="padding:10px; background:#222; display:flex; gap:10px; justify-content:center;">
    <button id="broadcast-toggle" onclick="toggleBroadcast()" style="background:#e84118; color:white;">配信を停止</button>
    <button onclick="showRemoteQR()" style="background:#f39c12; color:white;">スマホで監視</button>
</div>

<div id="qr-modal" class="modal hidden" onclick="this.classList.add('hidden')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>スマホでスキャン</h3>
        <div id="qrcode"></div>
        <button onclick="document.getElementById('qr-modal').classList.add('hidden')">閉じる</button>
    </div>
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="color:#00fbff;">画面監視システム</h2>
        <input type="number" id="room-id" placeholder="ルーム番号を入力">
        <button style="background:#f39c12; color:white;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    let isBroadcasting = true;
    const studentStreams = {};

    function log(m) { document.getElementById('status-msg').innerText = m; }

    async function start(role, ridFromUrl) {
        myRole = role;
        currentRid = ridFromUrl || document.getElementById('room-id').value;
        if (!currentRid) return alert("番号を入力してください");

        document.getElementById('setup-screen').classList.add('hidden');

        try {
            if (role === 'teacher' || role === 'student') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }

            // PeerのID設定
            const peerId = (role === 'teacher' ? "T-PC-" : (role === 'remote' ? "T-MB-" : "")) + currentRid;
            peer = role === 'student' ? new Peer() : new Peer(peerId);

            peer.on('open', (id) => {
                log("接続中...");
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                    }
                } else if (role === 'student') {
                    // 生徒はPCとスマホ両方を呼び出す
                    const c1 = peer.call("T-PC-" + currentRid, localStream);
                    handleTeacherCall(c1);
                    const c2 = peer.call("T-MB-" + currentRid, localStream.clone());
                    handleTeacherCall(c2);
                }
            });

            peer.on('call', call => {
                call.answer(role === 'teacher' && isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    studentStreams[call.peer] = stream;
                    if (role === 'teacher') updateRoster(call.peer);
                    else addVideoToGrid(call.peer, stream); 
                });
            });

        } catch (e) { alert("エラー: 画面共有が許可されませんでした。"); location.reload(); }
    }

    function handleTeacherCall(call) {
        call.on('stream', stream => {
            const v = document.getElementById('teacher-video');
            v.classList.remove('hidden');
            v.srcObject = stream;
            v.play().catch(()=>{}); // Safari対策
        });
    }

    function activateRemote() {
        document.getElementById('remote-start-ui').classList.add('hidden');
        const hash = window.location.hash.replace("#remote-", "");
        start('remote', hash);
    }

    function showRemoteQR() {
        const modal = document.getElementById('qr-modal');
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        const url = window.location.origin + window.location.pathname + "#remote-" + currentRid;
        new QRCode(qrContainer, { text: url, width: 180, height: 180 });
        modal.classList.remove('hidden');
    }

    function updateRoster(id) {
        if (document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div');
        div.className = 'roster-item';
        div.id = `roster-${id}`;
        div.innerHTML = `<span>生徒:${id.substring(id.length-4)}</span><button onclick="addVideoToGrid('${id}')" style="background:#44bd32; color:white; width:50px; font-size:10px; padding:5px;">表示</button>`;
        document.getElementById('student-roster').appendChild(div);
    }

    function addVideoToGrid(id, optionalStream) {
        if (document.getElementById(`card-${id}`)) return;
        const stream = optionalStream || studentStreams[id];
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        card.innerHTML = `<div style="font-size:10px;">生徒:${id.substring(id.length-4)}</div>
                          <video id="v-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        const v = document.getElementById(`v-${id}`);
        v.srcObject = stream;
        v.play().catch(()=>{}); // Safari対策
    }

    function toggleBroadcast() {
        isBroadcasting = !isBroadcasting;
        localStream.getVideoTracks().forEach(t => t.enabled = isBroadcasting);
        document.getElementById('broadcast-toggle').innerText = isBroadcasting ? "配信を停止" : "配信を開始";
    }

    window.onload = () => {
        if (window.location.hash.startsWith("#remote-")) {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('remote-start-ui').classList.remove('hidden');
        }
    };
</script>
</body>
</html>
