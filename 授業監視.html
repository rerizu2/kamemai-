<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速画面共有（0.1秒更新版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; z-index: 10; font-size: 14px; }
        .main-layout { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        /* メイン画面エリア */
        .primary-view { flex: 3; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        #main-screen { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: -webkit-optimize-contrast; }

        /* 監視サイドバー */
        .monitor-sidebar { width: 280px; background: #1e1e1e; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }
        .student-card { background: #333; margin-bottom: 12px; padding: 5px; border-radius: 8px; border: 1px solid #555; }
        .student-card p { margin: 2px 0; font-size: 11px; color: #00d1ff; }
        .student-card img { width: 100%; border-radius: 4px; background: #000; min-height: 100px; }

        /* 全画面ボタン */
        .fs-button {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 151, 230, 0.9); color: white;
            padding: 12px 20px; border-radius: 30px; cursor: pointer; border: none;
            z-index: 100; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 40px; border-radius: 20px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        button { padding: 12px 24px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; margin: 10px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-teacher { background: #e84118; color: white; width: 100%; font-size: 18px; }
        .btn-student { background: #0097e6; color: white; width: 100%; font-size: 18px; }
        input { padding: 12px; font-size: 20px; width: 100%; border-radius: 8px; border: 1px solid #555; background: #111; color: white; text-align: center; box-sizing: border-box; }
        
        #my-preview { position: fixed; bottom: 10px; left: 10px; width: 160px; border: 2px solid #00d1ff; border-radius: 8px; z-index: 50; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header id="ui-header">
    <span id="role-label">モードを選択</span> | ID: <span id="display-id" style="color:#00d1ff; font-weight:bold;">----</span>
</header>

<div class="main-layout">
    <div class="primary-view" id="fullscreen-target">
        <h3 id="view-title">画面未接続</h3>
        <img id="main-screen" class="hidden">
        <button id="fs-btn" class="fs-button hidden" onclick="toggleFullScreen()">📺 全画面表示</button>
    </div>

    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <h4 style="margin:0 0 10px 0; font-size: 14px;">🎓 生徒の画面 (0.1s更新)</h4>
        <div id="student-grid"></div>
    </div>
</div>

<video id="my-preview" autoplay playsinline muted class="hidden"></video>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin-top:0;">Screen Sync</h2>
        <button class="btn-teacher" onclick="initTeacher()">👨‍🏫 教員として配信</button>
        <div style="margin: 30px 0; border-top: 1px solid #555;"></div>
        <input type="number" id="input-teacher-id" placeholder="教員IDを入力">
        <button class="btn-student" onclick="initStudent()">🎓 生徒として参加</button>
        <p style="font-size:11px; color:#aaa; margin-top:15px;">※生徒は「画面全体」を共有してください</p>
    </div>
</div>

<canvas id="cap-canvas" class="hidden"></canvas>

<script>
    let peer;
    const canvas = document.getElementById('cap-canvas');
    const ctx = canvas.getContext('2d');
    
    // 設定
    const UPDATE_MS = 100; // 0.1秒間隔
    const TEACHER_QUALITY = 0.5; // 教員の画質 (0.1~1.0)
    const MONITOR_QUALITY = 0.3; // 監視用の画質 (低めにして負荷軽減)

    function toggleFullScreen() {
        const target = document.getElementById('fullscreen-target');
        if (!document.fullscreenElement) {
            target.requestFullscreen();
            document.getElementById('fs-btn').innerText = "❌ 全画面解除";
        } else {
            document.exitFullscreen();
            document.getElementById('fs-btn').innerText = "📺 全画面表示";
        }
    }

    // --- 教員：配信 ＆ 生徒を監視 ---
    async function initTeacher() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 } });
            const video = document.getElementById('my-preview');
            video.srcObject = stream;
            video.classList.remove('hidden');
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('view-title').innerText = "自分の画面を配信中...";
            
            const teacherId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(teacherId);
            peer.on('open', id => {
                document.getElementById('display-id').innerText = id;
                document.getElementById('role-label').innerText = "教員モード";
                document.getElementById('setup-screen').classList.add('hidden');
            });

            peer.on('connection', conn => {
                const grid = document.getElementById('student-grid');
                const card = document.createElement('div');
                card.className = 'student-card';
                card.id = `card-${conn.peer}`;
                card.innerHTML = `<p>ID: ${conn.peer}</p><img id="img-${conn.peer}">`;
                grid.appendChild(card);

                conn.on('data', data => {
                    if (data.type === 'student-screen') {
                        document.getElementById(`img-${conn.peer}`).src = data.img;
                    }
                });

                // 教員 -> 生徒への高速送信ループ (0.1秒)
                const sendLoop = setInterval(() => {
                    if (conn.open && video.readyState >= 2) {
                        canvas.width = 1100; // 高速化のため少し解像度を落とす
                        canvas.height = (video.videoHeight / video.videoWidth) * canvas.width;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send({ type: 'teacher-screen', img: canvas.toDataURL('image/jpeg', TEACHER_QUALITY) });
                    } else if (!conn.open) {
                        clearInterval(sendLoop);
                    }
                }, UPDATE_MS);

                conn.on('close', () => card.remove());
            });
        } catch (e) { alert("画面共有を許可してください"); }
    }

    // --- 生徒：視聴 ＆ 教員に画面送信 ---
    async function initStudent() {
        const teacherId = document.getElementById('input-teacher-id').value;
        if (!teacherId) return alert("教員IDを入力してください");

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { displaySurface: 'monitor', frameRate: 30 } 
            });

            if (stream.getVideoTracks()[0].getSettings().displaySurface !== 'monitor') {
                stream.getTracks().forEach(t => t.stop());
                return alert("エラー：「画面全体」を選択してください。");
            }

            const video = document.getElementById('my-preview');
            video.srcObject = stream;
            video.classList.remove('hidden');
            video.style.opacity = "0.7";
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('fs-btn').classList.remove('hidden');
            document.getElementById('view-title').classList.add('hidden');

            peer = new Peer();
            peer.on('open', (myId) => {
                document.getElementById('display-id').innerText = myId;
                document.getElementById('role-label').innerText = "生徒モード";
                const conn = peer.connect(teacherId);

                conn.on('open', () => {
                    document.getElementById('setup-screen').classList.add('hidden');
                    
                    // 生徒 -> 教員への高速送信ループ (0.1秒)
                    setInterval(() => {
                        if (conn.open && video.readyState >= 2) {
                            canvas.width = 480; // 監視用サイズ
                            canvas.height = (video.videoHeight / video.videoWidth) * canvas.width;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            conn.send({ type: 'student-screen', img: canvas.toDataURL('image/jpeg', MONITOR_QUALITY) });
                        }
                    }, UPDATE_MS);
                });

                conn.on('data', data => {
                    if (data.type === 'teacher-screen') {
                        document.getElementById('main-screen').src = data.img;
                    }
                });
                
                conn.on('close', () => { alert("教員が切断しました"); location.reload(); });
            });
        } catch (e) { alert("失敗しました。"); }
    }
</script>
</body>
</html>
