<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面共有デバッグ版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        .box { background: #2a2a2a; padding: 20px; margin: 10px; border-radius: 10px; }
        #log { background: #000; color: #0f0; text-align: left; padding: 10px; font-size: 12px; height: 100px; overflow-y: scroll; margin: 10px; border: 1px solid #444; }
        video, img { width: 90%; max-width: 600px; border: 2px solid #00d1ff; margin-top: 10px; }
        .hidden { display: none; }
        input { font-size: 20px; width: 100px; text-align: center; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>画面共有システム（デバッグ表示付）</h2>
    
    <!-- ログ出力エリア -->
    <div id="log">システム準備完了...</div>

    <div id="setup">
        <button onclick="startTeacher()" style="background:#e84118; color:white;">👨‍🏫 教員として配信開始</button>
        <hr>
        <input type="number" id="targetId" placeholder="ID">
        <button onclick="startStudent()" style="background:#0097e6; color:white;">🎓 生徒として接続</button>
    </div>

    <div id="teacher-zone" class="hidden">
        <h3>教員配信モード</h3>
        <p>生徒に伝えるID: <span id="my-id" style="font-size:24px; color:#00d1ff;">----</span></p>
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="student-zone" class="hidden">
        <h3>生徒受信モード</h3>
        <p id="status">接続待機中...</p>
        <img id="display" src="" alt="画面が届くとここに表示されます">
    </div>

    <canvas id="work-canvas" class="hidden"></canvas>

<script>
    const logEl = document.getElementById('log');
    function addLog(msg) {
        const time = new Date().toLocaleTimeString();
        logEl.innerHTML += `[${time}] ${msg}<br>`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    let peer;
    const canvas = document.getElementById('work-canvas');
    const ctx = canvas.getContext('2d');

    // --- 教員側 ---
    async function startTeacher() {
        addLog("教員モード開始...");
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            addLog("画面キャプチャ成功");
            document.getElementById('preview').srcObject = stream;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('teacher-zone').classList.remove('hidden');

            const id = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(id);

            peer.on('open', (id) => {
                addLog("Peerサーバー接続完了。ID: " + id);
                document.getElementById('my-id').innerText = id;
            });

            peer.on('connection', (conn) => {
                addLog("生徒が接続してきました！送信を開始します。");
                setInterval(() => {
                    if (conn.open) {
                        const video = document.getElementById('preview');
                        canvas.width = 640; 
                        canvas.height = 360;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send(canvas.toDataURL('image/jpeg', 0.5));
                    }
                }, 200);
            });

            peer.on('error', err => addLog("エラー発生: " + err.type));

        } catch (err) {
            addLog("エラー: 画面共有が許可されなかったか、HTTPS環境ではありません。");
        }
    }

    // --- 生徒側 ---
    function startStudent() {
        const id = document.getElementById('targetId').value;
        if (!id) return alert("IDを入力してください");

        addLog(`${id} への接続を試みます...`);
        peer = new Peer();

        peer.on('open', () => {
            addLog("自身の接続準備完了。教員を探しています...");
            const conn = peer.connect(id);

            conn.on('open', () => {
                addLog("教員と接続しました！画面データを受信します。");
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('student-zone').classList.remove('hidden');
                document.getElementById('status').innerText = "受信中...";
            });

            conn.on('data', (data) => {
                // ここでデータが届く
                document.getElementById('display').src = data;
            });

            conn.on('close', () => addLog("教員との接続が切れました。"));
        });

        peer.on('error', err => addLog("接続エラー: " + err.type + " (IDが間違っている可能性があります)"));
    }
</script>
</body>
</html>
