<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視特化版 - スクリーンモニター</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status { color: #00fbff; font-size: 11px; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* メイン表示エリア */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; position: relative; overflow: hidden; }
        video#main-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        /* 監視用グリッド（ここが重要） */
        .monitor-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 300px以上の幅で自動で並べる */
            gap: 15px; 
            width: 100%; 
            height: 100%; 
            padding: 20px; 
            box-sizing: border-box;
            overflow-y: auto; 
            align-content: start; 
        }

        .student-card { background: #222; border: 2px solid #444; border-radius: 12px; padding: 8px; text-align: center; transition: 0.3s; position: relative; }
        .student-card:hover { border-color: #00fbff; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; display: block; }
        .student-label { font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: bold; }

        /* サイドバー（授業配信＋監視モード時のみ使用） */
        .sidebar { width: 260px; background: #1a1a1a; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }
        .sidebar-grid { display: flex; flex-direction: column; gap: 10px; }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 30px; border-radius: 20px; text-align: center; width: 340px; }
        button { padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; margin: 8px 0; width: 100%; font-size: 15px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-teacher-all { background: #e84118; color: white; }
        .btn-teacher-mon { background: #f39c12; color: white; }
        .btn-student { background: #0097e6; color: white; }
        input { padding: 12px; font-size: 20px; width: 100%; border-radius: 10px; border: 1px solid #555; background: #000; color: white; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        .hidden { display: none !important; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div id="role-display">モード選択</div>
    <div id="status-msg" class="status">準備中...</div>
    <button onclick="location.reload()" style="background:#444; color:#fff; border:none; padding:5px 10px; border-radius:5px; font-size:10px;">終了</button>
</header>

<div class="main-layout">
    <div class="primary-view">
        <!-- 授業用：先生の画面が大きく映るビデオ -->
        <video id="main-video" class="hidden" autoplay playsinline></video>
        
        <!-- 監視用：生徒の画面が並ぶグリッド -->
        <div id="monitor-area" class="monitor-grid hidden"></div>

        <!-- 先生用：QRコード表示パネル -->
        <div id="info-panel" class="hidden" style="text-align:center; margin-top: 50px;">
            <div id="qrcode"></div>
            <p style="margin:10px 0 0;">参加ID: <span id="id-val-class" style="color:#e84118; font-weight:bold; font-size: 24px;">----</span></p>
        </div>
    </div>
    
    <!-- サイドバー（授業配信+監視時に生徒一覧を出す用） -->
    <div id="sidebar" class="sidebar hidden">
        <p style="font-size:11px; color:#aaa; border-bottom:1px solid #333; padding-bottom:5px;">🎓 生徒の画面</p>
        <div id="sidebar-grid" class="sidebar-grid"></div>
    </div>
</div>

<video id="local-video" autoplay playsinline muted class="hidden"></video>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin:0 0 15px 0; color:#00fbff;">画面共有システム</h2>
        <input type="number" id="room-id" placeholder="ルーム番号 (例: 1234)">
        <button class="btn-teacher-all" onclick="start('t-all')">👨‍🏫 授業配信 ＋ 監視</button>
        <button class="btn-teacher-mon" onclick="start('t-mon')">🖥️ 監視のみ (全画面表示)</button>
        <button class="btn-student" onclick="start('student')">🎓 生徒：画面を共有する</button>
    </div>
</div>

<script>
    let peerStream, peerMon, localStream, myRole = "";

    function log(m) { document.getElementById('status-msg').innerText = m; }

    async function start(role) {
        myRole = role;
        const rid = document.getElementById('room-id').value;
        if (!rid) return alert("ルーム番号を入力してください");

        try {
            // 生徒または配信モードなら画面キャプチャを開始
            if (role === 't-all' || role === 'student') {
                const screen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                let tracks = [...screen.getTracks()];
                if (role === 't-all') {
                    try {
                        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
                        tracks = [...tracks, ...mic.getAudioTracks()];
                    } catch(e) {}
                }
                localStream = new MediaStream(tracks);
                document.getElementById('local-video').srcObject = localStream;
            }

            if (role === 't-all') {
                peerStream = new Peer("CLASS-" + rid);
                peerMon = new Peer("MON-" + rid);
                setupTeacherHandlers(peerStream, peerMon);
                document.getElementById('role-display').innerText = "👨‍🏫 授業配信中";
            } else if (role === 't-mon') {
                peerMon = new Peer("MON-" + rid);
                setupMonitorOnlyHandlers(peerMon);
                document.getElementById('role-display').innerText = "🖥️ 監視モード";
            } else {
                peerStream = new Peer();
                setupStudentHandlers(peerStream, rid);
                document.getElementById('role-display').innerText = "🎓 生徒：画面共有中";
            }
            document.getElementById('setup-screen').classList.add('hidden');
            setupUI(rid);
        } catch (e) { 
            console.error(e);
            alert("エラー: " + e.message); 
            location.reload(); 
        }
    }

    function setupTeacherHandlers(pStream, pMon) {
        pStream.on('open', () => log("配信準備完了"));
        pMon.on('open', () => log("監視準備完了"));
        pStream.on('connection', conn => pStream.call(conn.peer, localStream));
        pMon.on('call', call => {
            call.answer();
            call.on('stream', stream => addStudentVideo(call.peer, stream, 'sidebar', call));
        });
    }

    function setupMonitorOnlyHandlers(pMon) {
        pMon.on('open', () => log("監視中（生徒が参加するとここに表示されます）"));
        pMon.on('call', call => {
            call.answer();
            call.on('stream', stream => {
                // 'monitor'を指定してメイングリッドに追加
                addStudentVideo(call.peer, stream, 'monitor', call);
            });
        });
    }

    function setupStudentHandlers(p, rid) {
        p.on('open', (id) => {
            log("先生に接続中...");
            p.connect("CLASS-" + rid);
            // 自分の画面を先生の監視用ID(MON-rid)に送る
            p.call("MON-" + rid, localStream);
        });
        p.on('call', call => {
            call.answer();
            call.on('stream', stream => {
                const mv = document.getElementById('main-video');
                mv.srcObject = stream;
                mv.classList.remove('hidden');
                document.getElementById('info-panel').classList.add('hidden');
            });
        });
        window.onbeforeunload = () => { if (p) p.destroy(); };
    }

    function setupUI(rid) {
        document.getElementById('id-val-class').innerText = rid;
        if (myRole === 't-all') {
            document.getElementById('info-panel').classList.remove('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('#')[0] + "#" + rid, width: 140, height: 140 });
        } else if (myRole === 't-mon') {
            // 監視のみモードではメインのグリッドを表示
            document.getElementById('monitor-area').classList.remove('hidden');
        }
    }

    function addStudentVideo(id, stream, type, call) {
        const target = (type === 'sidebar') ? document.getElementById('sidebar-grid') : document.getElementById('monitor-area');
        
        // すでに表示されている場合は何もしない
        if (document.getElementById(`card-${id}`)) return;

        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        
        // 生徒の名前表示（PeerIDが長いので、下5桁を表示）
        const labelName = "生徒:" + id.substring(id.length - 5);
        card.innerHTML = `<div class="student-label">${labelName}</div><video id="v-${id}" autoplay playsinline muted></video>`;
        
        target.appendChild(card);
        const vid = document.getElementById(`v-${id}`);
        vid.srcObject = stream;

        // 接続が切れたら画面を消去する処理
        const removeCard = () => {
            const el = document.getElementById(`card-${id}`);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }
        };

        call.on('close', removeCard);
        call.on('error', removeCard);
        stream.getVideoTracks()[0].onended = removeCard;
    }

    // URLハッシュでルームIDを自動入力
    window.onload = () => { if(window.location.hash) document.getElementById('room-id').value = window.location.hash.substring(1); };
</script>
</body>
</html>
