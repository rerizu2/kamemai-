<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援・超高品質同期システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --panel: rgba(26, 26, 26, 0.95); --text: #eee; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        video { image-rendering: -webkit-optimize-contrast; background: #000; width: 100%; height: 100%; object-fit: contain; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 50px; z-index: 1000; }
        
        /* サイドバー */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(10px); }
        .room-card { background: #222; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        .roster-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 11px; border: 1px solid #444; }

        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        .split-container { display: flex; width: 100%; height: 100%; transition: 0.5s; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #333; }
        .view-section { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #222; }

        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; }
        .wb-active #wb-section { display: flex; }
        canvas { background: white; flex: 1; cursor: crosshair; touch-action: none; }

        /* 監視グリッド（生徒の画面が表示される場所） */
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 15px; overflow-y: auto; background: #050505; align-content: start; }
        .student-card { background: #1a1a1a; border-radius: 10px; padding: 8px; text-align: center; border: 1px solid #333; position: relative; height: fit-content; }
        .student-card video { aspect-ratio: 16/9; border-radius: 5px; border: 1px solid #000; display: block; }
        .card-name { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        .surface-badge { position: absolute; top: 32px; right: 12px; font-size: 8px; background: rgba(0,0,0,0.7); color: var(--accent); padding: 2px 4px; border-radius: 3px; font-weight: bold; }

        /* チャット履歴 */
        .chat-panel { width: 280px; background: var(--panel); border-left: 1px solid #333; display: flex; flex-direction: column; }
        #chat-history { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 12px; padding: 8px; border-radius: 8px; background: #222; border-left: 3px solid var(--accent); }

        /* UI */
        #sharing-label { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0, 251, 255, 0.9); color: #000; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 500; }
        .controls { background: #111; padding: 10px; border-top: 1px solid #333; display: flex; gap: 10px; justify-content: center; }
        #student-view-controls { position: fixed; bottom: 20px; right: 300px; display: flex; flex-direction: column; gap: 8px; z-index: 1100; }
        .btn-ui { background: rgba(30,30,30,0.9); color: white; border: 1px solid #555; padding: 10px 15px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal { background: #1a1a1a; padding: 35px; border-radius: 20px; text-align: center; width: 330px; border: 1px solid #333; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 15px; text-align: center; }
        button.primary { padding: 12px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; width: 100%; background: var(--accent); color: #000; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-label" style="font-weight:bold; color:var(--accent);">Remote Lesson</div>
    <div id="count-text" style="font-size: 12px;">接続: 0</div>
</header>

<div class="main-layout" id="root-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-card">
            <div style="font-size: 10px; color: var(--accent);">参加ID</div>
            <div id="display-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <button id="reset-teacher-btn" class="hidden" onclick="resetToTeacher()" style="background:#f39c12; color:white; width:100%; padding:8px; border-radius:8px; border:none; cursor:pointer; font-size:11px;">先生の画面に戻す</button>
        <div id="roster-list" style="margin-top:10px;"></div>
    </div>

    <div class="primary-view">
        <div id="sharing-label">配信中: 先生</div>
        <div class="split-container" id="main-view-split">
            <div class="view-section">
                <video id="main-video-player" autoplay playsinline muted></video>
            </div>
            <div class="view-section" id="wb-section">
                <div style="position:absolute; top:0; background:#f0f0f0; width:100%; padding:5px; display:flex; gap:10px; color:#000;">
                   <button onclick="clearWb()" style="font-size:10px;">全消去</button>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <!-- 生徒の画面が並ぶ場所 -->
        <div id="monitor-grid" class="monitor-grid hidden"></div>
        
        <div id="student-view-controls" class="hidden">
            <button class="btn-ui" onclick="recoverQuality()">🚀 画質リカバリ</button>
        </div>
    </div>

    <div class="chat-panel" id="chat-panel">
        <div id="chat-history"></div>
    </div>
</div>

<div id="teacher-fixed-bar" class="controls hidden">
    <input type="text" id="msg-input" placeholder="全員にメッセージ..." style="flex:1; max-width:300px;">
    <button onclick="sendMsg()" style="background:#0097e6; color:white; border:none; padding:10px 20px; border-radius:8px;">送信</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal">
        <h2 style="color:var(--accent);">Remote Lesson</h2>
        <input type="text" id="user-name" placeholder="氏名">
        <input type="number" id="room-id" placeholder="ID">
        <button class="primary" onclick="init('teacher')">先生として開始</button>
        <button class="primary" style="background:#333; color:#fff;" onclick="init('student')">生徒として参加</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black";
    let currentSpotlightId = null;

    async function init(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を記入してください");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: true
            });
            localStream.getVideoTracks()[0].contentHint = 'detail';

            document.getElementById('setup-screen').classList.add('hidden');
            if (role === 'teacher') setupTeacherUI();
            else setupStudentUI();

            peer = new Peer(role === 'teacher' ? "TEACHER-ROOM-" + currentRid : undefined);

            peer.on('open', () => { if (role === 'student') connectToTeacher(); });
            
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                // 先生が現在配信している映像を生徒に返す
                let streamToSend = localStream;
                if (currentSpotlightId && studentStreams[currentSpotlightId]) streamToSend = studentStreams[currentSpotlightId];
                call.answer(streamToSend);
                
                call.on('stream', st => {
                    if (myRole === 'teacher') {
                        studentStreams[call.peer] = st;
                        updateMonitor(call.peer, st);
                    }
                });
            });

            initWb();
        } catch (e) { alert("画面共有を許可してください"); location.reload(); }
    }

    function setupTeacherUI() {
        document.getElementById('main-video-player').srcObject = localStream;
        document.getElementById('root-layout').classList.add('teacher-mode');
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('monitor-grid').classList.remove('hidden');
        document.getElementById('teacher-fixed-bar').classList.remove('hidden');
        document.getElementById('display-id').innerText = currentRid;
    }

    function setupStudentUI() {
        document.getElementById('student-view-controls').classList.remove('hidden');
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        const surf = localStream.getVideoTracks()[0].getSettings().displaySurface || "browser";
        conn.on('open', () => conn.send({ type: 'JOIN', name: myName, surface: surf }));
        conn.on('data', data => handleData(tId, data));

        const call = peer.call(tId, localStream);
        mediaCalls[tId] = call;
        call.on('stream', s => { 
            const v = document.getElementById('main-video-player');
            v.srcObject = s; v.play();
        });
    }

    function updateMonitor(id, stream) {
        if (!document.getElementById(`card-${id}`)) {
            const grid = document.getElementById('monitor-grid');
            const card = document.createElement('div');
            card.className = 'student-card';
            card.id = `card-${id}`;
            card.innerHTML = `
                <div class="card-name" id="name-${id}">読込中...</div>
                <div class="surface-badge" id="surf-${id}">-</div>
                <video id="vid-${id}" autoplay playsinline muted></video>
                <button onclick="spotlight('${id}')" style="width:100%; margin-top:5px; font-size:10px; background:var(--accent); border:none; border-radius:4px; cursor:pointer; padding:3px;">共有</button>
            `;
            grid.appendChild(card);
        }
        const v = document.getElementById(`vid-${id}`);
        v.srcObject = stream;
        v.play().catch(()=>{});
        if (studentInfo[id]) refreshCard(id);
    }

    function refreshCard(id) {
        const nameEl = document.getElementById(`name-${id}`);
        const surfEl = document.getElementById(`surf-${id}`);
        if (nameEl) nameEl.innerText = studentInfo[id].name;
        if (surfEl) surfEl.innerText = studentInfo[id].surface;
    }

    function handleData(id, data) {
        if (data.type === 'JOIN') {
            studentInfo[id] = { name: data.name, surface: data.surface };
            refreshCard(id);
            updateStatus();
        } else if (data.type === 'SYNC') {
            document.getElementById('sharing-label').innerText = `配信中: ${data.sharing}`;
        } else if (data.type === 'WB_DRAW') {
            drawRemote(data);
        } else if (data.type === 'MSG') {
            const h = document.getElementById('chat-history');
            const d = document.createElement('div'); d.className = 'chat-msg';
            d.innerText = `${data.from}: ${data.msg}`; h.prepend(d);
        }
    }

    function spotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        currentSpotlightId = id;
        Object.values(mediaCalls).forEach(c => {
            if(c.peerConnection) c.peerConnection.getSenders().find(s => s.track.kind === 'video').replaceTrack(track);
        });
        document.getElementById('main-video-player').srcObject = new MediaStream([track]);
        document.getElementById('reset-teacher-btn').classList.remove('hidden');
        document.getElementById('sharing-label').innerText = `配信中: ${studentInfo[id].name}`;
        broadcast({ type: 'SYNC', sharing: studentInfo[id].name });
    }

    function resetToTeacher() {
        const track = localStream.getVideoTracks()[0];
        currentSpotlightId = null;
        Object.values(mediaCalls).forEach(c => {
            if(c.peerConnection) c.peerConnection.getSenders().find(s => s.track.kind === 'video').replaceTrack(track);
        });
        document.getElementById('main-video-player').srcObject = localStream;
        document.getElementById('reset-teacher-btn').classList.add('hidden');
        document.getElementById('sharing-label').innerText = "配信中: 先生";
        broadcast({ type: 'SYNC', sharing: "先生" });
    }

    function initWb() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        wbCanvas.onpointerdown = e => { if (myRole!=='teacher') return; wbDrawing=true; const p=getPos(e); wbCtx.beginPath(); wbCtx.moveTo(p.x*wbCanvas.width, p.y*wbCanvas.height); broadcast({type:'WB_DRAW',x:p.x,y:p.y,start:true}); };
        wbCanvas.onpointermove = e => { if (!wbDrawing) return; const p=getPos(e); wbCtx.lineTo(p.x*wbCanvas.width, p.y*wbCanvas.height); wbCtx.stroke(); broadcast({type:'WB_DRAW',x:p.x,y:p.y,start:false}); };
        wbCanvas.onpointerup = () => wbDrawing=false;
    }
    function getPos(e) { const r = wbCanvas.getBoundingClientRect(); return { x: (e.clientX-r.left)/r.width, y: (e.clientY-r.top)/r.height }; }
    function drawRemote(d){ 
        if(d.start) { wbCtx.beginPath(); wbCtx.moveTo(d.x*wbCanvas.width, d.y*wbCanvas.height); }
        else { wbCtx.lineTo(d.x*wbCanvas.width, d.y*wbCanvas.height); wbCtx.stroke(); }
    }

    function broadcast(d) { Object.values(dataConnections).forEach(c => c.send(d)); }
    function updateStatus() { document.getElementById('count-text').innerText = `接続: ${Object.keys(dataConnections).length}`; }
    function sendMsg() { const i=document.getElementById('msg-input'); if(!i.value) return; broadcast({type:'MSG', from:myName, msg:i.value}); i.value=""; }
</script>
</body>
</html>
