<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援システム【究極版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #27ae60; --warning: #f39c12; --monitor-height: 40vh; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* --- ヘッダー --- */
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; z-index: 2000; flex-shrink: 0; }
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .status-info { font-size: 11px; color: var(--accent); display: flex; gap: 15px; }
        .timer-display { font-family: monospace; font-size: 18px; color: var(--warning); background: #000; padding: 2px 10px; border-radius: 5px; border: 1px solid #444; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* --- サイドバー --- */
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .preview-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        .preview-box video { width: 100%; height: 100%; object-fit: cover; }

        /* --- メインエリア --- */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; pointer-events: none; }
        
        /* ホワイトボード：ペン対応の重要なCSS */
        #wb-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; 
            pointer-events: none; background: transparent; 
            touch-action: none; /* タッチによるスクロールを禁止 */
        }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }
        .whiteboard-mode #main-broadcast-video { opacity: 0; }
        .grid-bg { background-image: radial-gradient(#444 1px, transparent 1px); background-size: 20px 20px; }

        /* ツールバー */
        #wb-tools { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.95); padding: 12px; border-radius: 15px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); color: #333; }
        .wb-active #wb-tools { display: flex; }
        .tool-group { display: flex; flex-direction: column; gap: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .tool-row { display: flex; gap: 5px; justify-content: center; }
        .tool-btn { width: 35px; height: 35px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; font-size: 18px; color: #333; }
        .tool-btn.active { background: var(--accent); color: white; border-color: #008888; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }

        /* 監視エリア */
        .monitor-section { height: var(--monitor-height); background: #0a0a0a; display: flex; flex-direction: column; border-top: 2px solid #333; flex-shrink: 0; }
        .tab-bar { display: flex; background: #111; padding: 5px 10px; border-bottom: 1px solid #333; align-items: center; justify-content: space-between; }
        .tab-btn { padding: 8px 16px; border: none; background: transparent; color: #888; cursor: pointer; font-size: 11px; font-weight: bold; }
        .tab-btn.active { background: #333; color: var(--accent); border-radius: 4px; }
        
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 8px; overflow-y: auto; }
        .student-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 5px; text-align: center; position: relative; }
        .student-card.hand-raised { border-color: var(--warning); box-shadow: 0 0 15px var(--warning); }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; margin: 0 auto; }
        .card-name { font-size: 10px; color: #eee; margin-top: 4px; }

        /* 操作バー */
        .controls { background: #111; padding: 10px 20px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 10; }
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-primary { background: #0097e6; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        input[type="text"] { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; flex: 1; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        #laser-pointer { position: absolute; width: 15px; height: 15px; background: red; border-radius: 50%; box-shadow: 0 0 10px red; pointer-events: none; z-index: 200; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body id="root-body">

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin:0 0 20px;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="参加ID（4桁）">
        <button class="btn-primary" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">先生として開始</button>
        <button style="width:100%; height:45px; background:#444; color:white; border-radius:8px; border:none; cursor:pointer;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <div id="mode-label" style="font-weight: bold; color: var(--accent);">STUDENT SUPPORT</div>
        <div id="timer-box" class="timer-display">00:00</div>
    </div>
    <div class="header-controls">
        <div id="teacher-tools-header" class="hidden" style="display:flex; gap:10px;">
            <button class="btn-warning" onclick="pickRandomStudent()">🎲 指名</button>
            <button class="btn-primary" onclick="manageTimer()">⏱️ タイマー</button>
        </div>
        <div class="status-info">
            <span id="room-display">ID: ----</span>
            <span id="connect-display">接続: 0</span>
        </div>
        <button onclick="location.reload()" style="background:#444; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">終了</button>
    </div>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="panel">
            <div class="panel-title">自分の画面プレビュー</div>
            <video id="my-local-video" autoplay playsinline muted style="width:100%; border-radius:4px; background:#000;"></video>
        </div>
        <div class="panel">
            <div class="panel-title">監視・参加用</div>
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px; display:flex; justify-content:center;"></div>
            <div id="qr-url-text" style="font-size:8px; word-break:break-all; margin-top:5px; color:#888;"></div>
        </div>
        <div id="roster-list" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">出席名簿</div>
            <div id="roster-items" style="font-size:11px;"></div>
        </div>
    </div>

    <div class="content-area">
        <div id="focus-overlay" class="overlay hidden" style="background:rgba(0,0,0,0.95); z-index:8000;">
            <div style="text-align:center;">
                <h1 style="font-size:40px; color:var(--accent);">先生に注目！</h1>
                <p>現在、一斉説明モードです。</p>
            </div>
        </div>

        <div class="broadcast-container" id="broadcast-container">
            <div id="laser-pointer"></div>
            <video id="main-broadcast-video" autoplay playsinline muted></video>
            <canvas id="wb-canvas"></canvas>

            <div id="wb-tools">
                <div id="wb-teacher-only" class="hidden" style="display:flex; flex-direction:column; gap:8px; border-bottom:1px solid #ccc; padding-bottom:8px;">
                    <select id="wb-mode-select" onchange="setWbMode(this.value)" style="font-size:10px; padding:4px;">
                        <option value="teacher">先生のみ描画</option>
                        <option value="individual">各自練習</option>
                        <option value="all">全員共有</option>
                    </select>
                    <div class="tool-row">
                        <button onclick="setWbBg('transparent')" style="font-size:8px;">透明</button>
                        <button onclick="setWbBg('white')" style="font-size:8px;">白紙</button>
                        <button onclick="setWbBg('grid')" style="font-size:8px;">方眼</button>
                    </div>
                </div>
                <div class="tool-row">
                    <div class="tool-btn active" id="btn-pen" onclick="setWbTool('pen', this)">🖊️</div>
                    <div class="tool-btn" id="btn-highlighter" onclick="setWbTool('highlighter', this)">🖍️</div>
                    <div class="tool-btn" id="btn-eraser" onclick="setWbTool('eraser', this)">🧽</div>
                    <button onclick="undoWb()" class="tool-btn">↩️</button>
                </div>
                <div style="display:flex; gap:8px; justify-content:center;">
                    <div class="color-dot" style="background:black;" onclick="wbColor='black'"></div>
                    <div class="color-dot" style="background:red;" onclick="wbColor='red'"></div>
                    <div class="color-dot" style="background:blue;" onclick="wbColor='blue'"></div>
                    <div class="color-dot" style="background:white; border:1px solid #ccc;" onclick="wbColor='white'"></div>
                </div>
                <div class="tool-row" style="padding-top:5px;">
                    <button onclick="clearWb()" class="btn-danger" style="font-size:9px; flex:1;">全消去</button>
                    <button onclick="saveWb()" class="btn-primary" style="font-size:9px; flex:1; background:#27ae60;">保存</button>
                </div>
                <button onclick="toggleWb()" style="font-size:10px; width:100%; margin-top:5px;" class="btn-gray">閉じる</button>
            </div>
        </div>

        <div id="monitor-section" class="monitor-section hidden">
            <div class="tab-bar">
                <div style="display:flex; gap:5px;">
                    <button class="tab-btn active" onclick="switchTab('screen')">画面</button>
                    <button class="tab-btn" onclick="switchTab('board')">ボード</button>
                </div>
                <input type="range" min="10" max="85" value="40" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')" style="width:80px;">
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <button class="btn-primary" onclick="toggleWb()">🖊️ ボード</button>
    <button class="btn-primary" onclick="openPollCreator()">📊 アンケート</button>
    <button id="focus-btn" class="btn-warning" onclick="toggleFocusMode()">🔒 注目</button>
    <button id="broadcast-btn" class="btn-danger" onclick="toggleBroadcast()">⏹️ 配信停止</button>
    <button id="reset-btn" style="background:#27ae60; color:white;" class="hidden" onclick="resetSpotlight()">🔄 自分に戻す</button>
    <input type="text" id="comment-input" placeholder="全体メッセージ...">
    <button class="btn-primary" onclick="sendComment()">送信</button>
</div>

<div id="student-controls" class="controls hidden">
    <button id="hand-btn" class="btn-warning" onclick="toggleHand()">✋ 挙手する</button>
    <div style="flex:1;"></div>
    <span style="font-size:10px; color:#666;">STUDENT MODE</span>
</div>

<div id="poll-student-view" class="overlay hidden" style="z-index:10000;">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="st-poll-q">質問</h3>
        <div id="st-poll-opts"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "teacher", wbTool = "pen";
    let wbHistory = [], isFocusMode = false, handRaised = false, timerInterval;

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value || (role==='teacher'?'教員':'生徒');
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
            document.getElementById('setup-screen').style.display = 'none';
            initWb();
            const pId = (role==='teacher'?"T-ROOM-"+currentRid : undefined);
            peer = new Peer(pId);
            peer.on('open', id => { if(role === 'teacher') setupTeacherUI(); else connectToTeacher(); });
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });
            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', s => { studentStreams[call.peer] = s; addStudentGrid(call.peer, s); });
            });
        } catch(e) { alert("画面共有を開始してください。"); location.reload(); }
    }

    function setupTeacherUI() {
        document.querySelectorAll('.sidebar, .monitor-section, #teacher-controls, #teacher-tools-header').forEach(el => el.classList.remove('hidden'));
        document.getElementById('room-display').innerText = "ID: " + currentRid;
        document.getElementById('my-local-video').srcObject = localStream;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        const url = window.location.origin + window.location.pathname + `?room=${currentRid}`;
        new QRCode(document.getElementById("qrcode"), { text: url, width: 100, height: 100 });
        document.getElementById('qr-url-text').innerText = url;
        document.getElementById('wb-teacher-only').classList.remove('hidden');
    }

    function connectToTeacher() {
        document.getElementById('student-controls').classList.remove('hidden');
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        mediaCalls[tid] = call;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({ type: 'INFO', name: myName, group: 1 }));
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => { document.getElementById('main-broadcast-video').srcObject = s; });
    }

    // --- ホワイトボード（タッチペン・指対応） ---
    function initWb() {
        wbCanvas = document.getElementById('wb-canvas');
        wbCtx = wbCanvas.getContext('2d');
        resizeCanvas();

        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            // PointerEvents (mouse, pen, touch) から座標を計算
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: (clientX - rect.left) * (wbCanvas.width / rect.width),
                y: (clientY - rect.top) * (wbCanvas.height / rect.height)
            };
        };

        // PointerEventsを使用することでペンやタッチを自動判別
        wbCanvas.addEventListener('pointerdown', (e) => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true;
            const pos = getPos(e);
            applyStroke(wbTool, wbColor, pos.x, pos.y, true);
            sendDrawData(pos.x, pos.y, true);
        });

        wbCanvas.addEventListener('pointermove', (e) => {
            if (!wbDrawing) return;
            const pos = getPos(e);
            applyStroke(wbTool, wbColor, pos.x, pos.y, false);
            sendDrawData(pos.x, pos.y, false);
        });

        wbCanvas.addEventListener('pointerup', (e) => {
            if (wbDrawing) saveHistory();
            wbDrawing = false;
        });

        wbCanvas.addEventListener('pointercancel', () => wbDrawing = false);

        window.onresize = resizeCanvas;
    }

    function applyStroke(tool, color, x, y, start) {
        if(tool === 'highlighter') {
            wbCtx.globalCompositeOperation = 'source-over';
            wbCtx.globalAlpha = 0.4; wbCtx.lineWidth = 20;
        } else if(tool === 'eraser') {
            wbCtx.globalCompositeOperation = 'destination-out';
            wbCtx.lineWidth = 30;
        } else {
            wbCtx.globalCompositeOperation = 'source-over';
            wbCtx.globalAlpha = 1.0; wbCtx.lineWidth = 3;
        }
        wbCtx.strokeStyle = color; wbCtx.lineCap = "round";
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function sendDrawData(x, y, start) {
        const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, tool: wbTool, start };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function renderRemoteWb(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        if (id.startsWith('T-ROOM') || myRole === 'teacher' || wbMode === 'all') applyStroke(data.tool, data.color, x, y, data.start);
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d'); mCtx.strokeStyle = data.color; mCtx.lineWidth = 2;
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); }
            mCtx.lineTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); mCtx.stroke();
        }
        if (myRole === 'teacher' && wbMode === 'all') Object.entries(dataConnections).forEach(([tid, c]) => { if(tid !== id) c.send(data); });
    }

    // --- その他同期処理 ---
    function handleData(id, data) {
        if (data.type === 'INFO') { studentInfo[id] = data; updateRoster(); }
        else if (data.type === 'WB_DRAW') renderRemoteWb(id, data);
        else if (data.type === 'WB_START') { document.body.classList.add('wb-active'); resizeCanvas(); }
        else if (data.type === 'WB_STOP') document.body.classList.remove('wb-active');
        else if (data.type === 'WB_MODE') wbMode = data.mode;
        else if (data.type === 'WB_CLEAR') wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        else if (data.type === 'WB_BG') setWbBg(data.bg, true);
        else if (data.type === 'FOCUS') document.getElementById('focus-overlay').classList.toggle('hidden', !data.active);
        else if (data.type === 'TIMER') document.getElementById('timer-box').innerText = data.time;
        else if (data.type === 'HAND') { studentInfo[id].hand = data.active; document.getElementById(`card-${id}`)?.classList.toggle('hand-raised', data.active); if(data.active) new Audio('https://actions.google.com/sounds/v1/notifications/beep.ogg').play(); }
        else if (data.type === 'POLL_START') showPollToStudent(data.q, data.opts);
        else if (data.type === 'VOTE') alert(studentInfo[id].name + "さんが回答: " + data.idx);
        else if (data.type === 'KICK') { alert("退出させられました。"); location.reload(); }
        else if (data.type === 'COMMENT') alert("先生より: " + data.msg);
    }

    function toggleWb() { const active = document.body.classList.toggle('wb-active'); if(myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type: active?'WB_START':'WB_STOP'})); setTimeout(resizeCanvas, 50); }
    function setWbMode(m) { wbMode = m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function setWbTool(t, btn) { wbTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); wbHistory = []; Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function resizeCanvas() { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; }
    function saveHistory() { if (wbHistory.length > 15) wbHistory.shift(); wbHistory.push(wbCtx.getImageData(0, 0, wbCanvas.width, wbCanvas.height)); }
    function undoWb() { wbHistory.pop(); const last = wbHistory[wbHistory.length - 1]; if (last) wbCtx.putImageData(last, 0, 0); else wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height); }
    function setWbBg(bg, remote = false) { document.getElementById('broadcast-container').className = 'broadcast-container ' + (bg==='grid'?'whiteboard-mode grid-bg':(bg==='white'?'whiteboard-mode':'')); if(!remote && myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type:'WB_BG', bg})); }
    function toggleFocusMode() { isFocusMode = !isFocusMode; Object.values(dataConnections).forEach(c => c.send({type:'FOCUS', active: isFocusMode})); }
    function toggleBroadcast() { const stop = !document.getElementById('broadcast-btn').innerText.includes("再開"); Object.values(dataConnections).forEach(c => c.send({type:'STOP_BROADCAST', stop})); document.getElementById('broadcast-btn').innerText = stop ? "▶️ 再開" : "⏹️ 停止"; }
    function toggleHand() { handRaised = !handRaised; document.getElementById('hand-btn').innerText = handRaised ? "✋ 下ろす" : "✋ 挙手する"; dataConnections["T-ROOM-"+currentRid]?.send({type:'HAND', active: handRaised}); }
    function pickRandomStudent() { const ids = Object.keys(studentInfo); if(ids.length === 0) return; alert("指名: " + studentInfo[ids[Math.floor(Math.random()*ids.length)]].name); }
    function manageTimer() { const sec = prompt("秒数?", "60"); if(!sec) return; let t = parseInt(sec); clearInterval(timerInterval); timerInterval = setInterval(() => { t--; const d = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0'); document.getElementById('timer-box').innerText = d; Object.values(dataConnections).forEach(c => c.send({type:'TIMER', time: d})); if(t<=0) clearInterval(timerInterval); }, 1000); }
    function saveWb() { const l = document.createElement('a'); l.download = 'board.png'; l.href = wbCanvas.toDataURL(); l.click(); }
    function sendComment() { const m = document.getElementById('comment-input').value; if(m) { Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', msg:m})); document.getElementById('comment-input').value=""; } }
    function addStudentGrid(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const name = studentInfo[id]?.name || '生徒';
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline muted></video><span class="card-name">${name}</span>
            <button class="btn-primary" style="width:100%;margin-top:5px;font-size:9px;" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'student-card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white;border-radius:4px;"></canvas><div class="card-name">${name}</div>`;
        document.getElementById('grid-board').appendChild(wbCard);
        document.getElementById('connect-display').innerText = Object.keys(studentStreams).length;
    }
    async function startSpotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = studentStreams[id];
        document.getElementById('reset-btn').classList.remove('hidden');
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }
    function resetSpotlight() {
        const track = localStream.getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-btn').classList.add('hidden');
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }
    function switchTab(t) { document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen'); document.getElementById('grid-board').classList.toggle('hidden', t !== 'board'); document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(t==='画面'?'画面':'ボード'))); }
    function updateRoster() { const r = document.getElementById('roster-items'); r.innerHTML = ""; Object.entries(studentInfo).forEach(([id, info]) => { r.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${info.name}</span><button onclick="dataConnections['${id}'].send({type:'KICK'})" style="background:red; color:#fff; font-size:8px; border-radius:4px; padding:2px 5px;">退出</button></div>`; }); }
    function openPollCreator() { const q = prompt("質問?"); const opts = prompt("選択肢(カンマ区切り)?", "A,B").split(","); Object.values(dataConnections).forEach(c => c.send({type:'POLL_START', q, opts})); }
    function showPollToStudent(q, opts) { document.getElementById('poll-student-view').classList.remove('hidden'); document.getElementById('st-poll-q').innerText = q; const cont = document.getElementById('st-poll-opts'); cont.innerHTML = ""; opts.forEach((o, i) => { const b = document.createElement('button'); b.innerText = o; b.style.cssText = "width:100%; margin-bottom:10px; background:#f0f0f0; color:black; padding:12px; border-radius:10px; font-weight:bold;"; b.onclick = () => { document.getElementById('poll-student-view').classList.add('hidden'); dataConnections["T-ROOM-"+currentRid]?.send({type:'VOTE', idx:i}); }; cont.appendChild(b); }); }
    function removeStudent(id) { document.getElementById(`card-${id}`)?.remove(); document.getElementById(`wb-card-${id}`)?.remove(); delete studentStreams[id]; delete studentInfo[id]; delete dataConnections[id]; }
</script>
