<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全画面限定 共有システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; overflow: hidden; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; }
        .main-layout { display: flex; height: calc(100vh - 50px); }
        
        /* メイン表示（生徒は教員の画面を見る） */
        .primary-view { flex: 3; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #main-screen { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* 監視サイドバー（教員用） */
        .monitor-sidebar { flex: 1; background: #1e1e1e; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }
        .student-card { background: #333; margin-bottom: 15px; padding: 8px; border-radius: 8px; }
        .student-card img { width: 100%; border-radius: 4px; background: #000; }
        .student-info { font-size: 12px; margin-bottom: 5px; color: #00d1ff; }

        /* セットアップ画面 */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; }
        
        button { padding: 15px 30px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; margin: 10px; font-size: 16px; }
        .btn-teacher { background: #e84118; color: white; }
        .btn-student { background: #0097e6; color: white; }
        
        .instruction { font-size: 14px; color: #ccc; margin-top: 10px; line-height: 1.6; }
        .warning { color: #ff4757; font-weight: bold; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <span id="status-text">役割を選択してください</span> | ID: <span id="display-id">----</span>
</header>

<div class="main-layout">
    <div class="primary-view">
        <video id="my-local-video" autoplay playsinline muted class="hidden" style="position:absolute; bottom:10px; right:10px; width:150px; border:2px solid #fff;"></video>
        <img id="main-screen" src="" alt="">
        <div id="placeholder-text">接続待ち</div>
    </div>

    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <h3 style="text-align:center; margin-top:0;">生徒の全画面監視</h3>
        <div id="student-grid"></div>
    </div>
</div>

<!-- 初期画面 -->
<div id="setup-screen" class="overlay">
    <div class="setup-box">
        <h2>画面共有システム</h2>
        
        <button class="btn-teacher" onclick="startTeacher()">👨‍🏫 教員として開始</button>
        
        <div style="margin: 30px 0; border-top: 1px solid #555;"></div>

        <input type="number" id="input-teacher-id" placeholder="教員IDを入力" style="padding:15px; width:200px; font-size:18px; border-radius:8px; border:none;">
        <button class="btn-student" onclick="startStudent()">🎓 生徒として参加</button>
        
        <div class="instruction">
            生徒側：接続後、共有メニューで<br>
            <span class="warning">「画面全体」を選んでください</span>
        </div>
    </div>
</div>

<canvas id="export-canvas" class="hidden"></canvas>

<script>
    let peer;
    const canvas = document.getElementById('export-canvas');
    const ctx = canvas.getContext('2d');

    // --- 教員側の処理 ---
    async function startTeacher() {
        try {
            // 教員の画面共有
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { displaySurface: "monitor" }, // 全画面を優先
                audio: true 
            });
            
            document.getElementById('my-local-video').srcObject = stream;
            document.getElementById('my-local-video').classList.remove('hidden');
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('placeholder-text').innerText = "（自分の配信画面）";

            const tid = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(tid);

            peer.on('open', id => {
                document.getElementById('display-id').innerText = id;
                document.getElementById('status-text').innerText = "👨‍🏫 教員モード";
                document.getElementById('setup-screen').classList.add('hidden');
            });

            peer.on('connection', conn => {
                const studentId = conn.peer;
                setupTeacherReceiver(conn, studentId);
            });

        } catch (e) { alert("共有がキャンセルされました"); }
    }

    function setupTeacherReceiver(conn, sid) {
        const grid = document.getElementById('student-grid');
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${sid}`;
        card.innerHTML = `<div class="student-info">生徒ID: ${sid}</div><img id="img-${sid}">`;
        grid.appendChild(card);

        conn.on('data', data => {
            if (data.type === 'student-screen') {
                document.getElementById(`img-${sid}`).src = data.img;
            }
        });

        // 教員の画面を生徒へ送るループ
        const sendLoop = setInterval(() => {
            if (conn.open) {
                canvas.width = 960;
                canvas.height = 540;
                ctx.drawImage(document.getElementById('my-local-video'), 0, 0, canvas.width, canvas.height);
                conn.send({ type: 'teacher-screen', img: canvas.toDataURL('image/jpeg', 0.6) });
            } else {
                clearInterval(sendLoop);
                card.remove();
            }
        }, 200);

        conn.on('close', () => card.remove());
    }

    // --- 生徒側の処理 ---
    async function startStudent() {
        const tid = document.getElementById('input-teacher-id').value;
        if (!tid) return alert("教員IDを入力してください");

        try {
            // ★重要：全画面共有を強制・優先する設定
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    displaySurface: "monitor", // 「全画面」を初期選択にする
                },
                // 他のタブやウィンドウへの切り替えボタンを非表示にする提案（ブラウザによる）
                monitorTypeSurfaces: "include",
            });

            // チェック：もし全画面以外を選んでいたら警告してやり直しさせる
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            if (settings.displaySurface && settings.displaySurface !== 'monitor') {
                track.stop();
                alert("エラー：【画面全体】を選択してください。ウィンドウやタブの共有は許可されていません。");
                return;
            }

            document.getElementById('my-local-video').srcObject = stream;
            document.getElementById('placeholder-text').innerText = "";
            
            peer = new Peer();
            peer.on('open', sid => {
                const conn = peer.connect(tid);
                conn.on('open', () => {
                    document.getElementById('display-id').innerText = sid;
                    document.getElementById('status-text').innerText = "🎓 生徒モード";
                    document.getElementById('setup-screen').classList.add('hidden');

                    // 生徒の画面（全画面）を教員へ送るループ
                    setInterval(() => {
                        if (conn.open) {
                            canvas.width = 480;
                            canvas.height = 270;
                            ctx.drawImage(document.getElementById('my-local-video'), 0, 0, canvas.width, canvas.height);
                            conn.send({ type: 'student-screen', img: canvas.toDataURL('image/jpeg', 0.4) });
                        }
                    }, 500);
                });

                conn.on('data', data => {
                    if (data.type === 'teacher-screen') {
                        document.getElementById('main-screen').src = data.img;
                    }
                });

                conn.on('close', () => {
                    alert("教員との接続が終了しました");
                    location.reload();
                });
            });

        } catch (e) { alert("全画面共有の許可が必要です。"); }
    }
</script>
</body>
</html>
