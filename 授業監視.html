<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高画質・画面共有システム（安定接続版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; z-index: 100; }
        .status-msg { font-size: 13px; color: #00fbff; margin-top: 5px; min-height: 1.5em; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        .primary-view { flex: 3; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { background: #000; width: 100%; height: 100%; object-fit: contain; }
        
        /* 監視グリッド */
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; width: 100%; height: 100%; padding: 10px; overflow-y: auto; align-content: start; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 5px; }
        .student-card video { width: 100%; height: auto; aspect-ratio: 16/9; }

        /* サイドバー（教員配信中に生徒を見る用） */
        .sidebar { width: 250px; background: #1a1a1a; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }

        /* オーバーレイ */
        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 30px; border-radius: 15px; text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        button { padding: 12px 20px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; margin: 8px 0; width: 100%; font-size: 15px; }
        .btn-share { background: #e84118; color: white; }
        .btn-monitor { background: #f39c12; color: white; }
        .btn-student { background: #0097e6; color: white; }
        input { padding: 12px; font-size: 20px; width: 100%; border-radius: 8px; border: 1px solid #555; background: #111; color: white; text-align: center; box-sizing: border-box; margin-bottom: 10px; }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="role-label">モード未選択</div>
    <div id="status" class="status-msg">準備完了</div>
</header>

<div class="main-layout">
    <div class="primary-view">
        <video id="main-video" class="hidden" autoplay playsinline></video>
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <div id="info-panel" class="hidden" style="text-align:center;">
            <div id="qrcode"></div>
            <p>ルームID: <span id="id-val" style="font-weight:bold; color:#00fbff;">----</span></p>
        </div>
    </div>
    <div id="sidebar" class="sidebar hidden">
        <p style="font-size:12px; color:#aaa; margin-bottom:10px;">生徒の画面</p>
        <div id="sidebar-grid"></div>
    </div>
</div>

<video id="local-preview" autoplay playsinline muted class="hidden"></video>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin-top:0;">画面共有システム</h2>
        <input type="number" id="room-id" placeholder="ルームIDを入力">
        <button class="btn-share" onclick="startMode('teacher-share')">👨‍🏫 自分の画面を配信</button>
        <button class="btn-monitor" onclick="startMode('teacher-monitor')">🖥️ 生徒の画面を監視</button>
        <button class="btn-student" onclick="startMode('student')">🎓 生徒として参加</button>
        <p style="font-size:11px; color:#aaa; margin-top:10px;">※教員・生徒で同じ数字を入力</p>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let role = ""; // teacher-share, teacher-monitor, student
    const statusEl = document.getElementById('status');
    const mainVideo = document.getElementById('main-video');

    function log(msg) { statusEl.innerText = msg; console.log(msg); }

    async function startMode(m) {
        role = m;
        const rid = document.getElementById('room-id').value;
        if (!rid) return alert("ルームIDを入力してください。");

        try {
            // 1. 映像が必要なモードの場合は先に取得
            if (role === 'teacher-share' || role === 'student') {
                log("画面共有を許可してください...");
                localStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { frameRate: 30 }, audio: true 
                });
                document.getElementById('local-preview').srcObject = localStream;
                log("画面キャプチャ成功");
            }

            // 2. PeerJSの接続開始
            let myPeerId = "";
            if (role === 'teacher-share') myPeerId = rid;
            if (role === 'teacher-monitor') myPeerId = "MONITOR-" + rid;
            // 生徒はランダムID

            peer = myPeerId ? new Peer(myPeerId) : new Peer();

            peer.on('open', id => {
                log("サーバー接続成功: ID " + rid);
                document.getElementById('setup-screen').classList.add('hidden');
                setupUI(rid);
                
                // 生徒の場合：教員(rid)と監視(MONITOR-rid)の両方に自分から発信する
                if (role === 'student') {
                    peer.call(rid, localStream);
                    peer.call("MONITOR-" + rid, localStream);
                    log("配信・監視サーバーに接続を試みています...");
                }
            });

            // 3. 着信（コール）の処理
            peer.on('call', call => {
                log("映像を受信しました");
                // 教員共有モード：生徒の画面が届いたらサイドバーへ
                // 教員監視モード：生徒の画面が届いたらグリッドへ
                // 生徒：教員の画面が届いたらメインビデオへ
                
                if (role === 'student') {
                    call.answer(); // 生徒は何も返さない
                    call.on('stream', stream => {
                        mainVideo.srcObject = stream;
                        mainVideo.classList.remove('hidden');
                        document.getElementById('info-panel').classList.add('hidden');
                    });
                } else {
                    call.answer(); // 教員も何も返さない（見るだけ）
                    call.on('stream', stream => {
                        addVideoToGrid(call.peer, stream);
                    });
                }
            });

            // 4. データ接続（教員側が生徒が入ってきたことを知るため）
            peer.on('connection', conn => {
                if (role === 'teacher-share') {
                    log("生徒が参加しました。映像を送ります。");
                    peer.call(conn.peer, localStream); // 教員の画面を送る
                }
            });

            peer.on('error', err => {
                if(err.type === 'unavailable-id') alert("そのIDは既に使用されています。");
                else log("エラー: " + err.type);
            });

        } catch (e) {
            log("エラー: " + e.message);
        }
    }

    function setupUI(rid) {
        document.getElementById('display-id').innerText = rid;
        if (role === 'teacher-share') {
            document.getElementById('role-label').innerText = "👨‍🏫 教員：配信中";
            document.getElementById('info-panel').classList.remove('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('#')[0] + "#" + rid, width: 150, height: 150 });
        } else if (role === 'teacher-monitor') {
            document.getElementById('role-label').innerText = "🖥️ 教員：監視中";
            document.getElementById('monitor-area').classList.remove('hidden');
        } else {
            document.getElementById('role-label').innerText = "🎓 生徒：視聴中";
        }
    }

    function addVideoToGrid(peerId, stream) {
        const targetGrid = (role === 'teacher-share') ? document.getElementById('sidebar-grid') : document.getElementById('monitor-area');
        if (document.getElementById(`v-${peerId}`)) return;

        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `<div style="font-size:10px">ID:${peerId.substring(0,5)}</div><video id="v-${peerId}" autoplay playsinline muted></video>`;
        targetGrid.appendChild(card);
        document.getElementById(`v-${peerId}`).srcObject = stream;
    }
</script>
</body>
</html>
