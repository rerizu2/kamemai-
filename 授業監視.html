<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援・画質リカバリ機能付</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; height: 50px; box-sizing: border-box; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 250px; background: #1a1a1a; border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }

        /* チャット履歴 */
        .chat-panel { width: 250px; background: #1a1a1a; border-left: 1px solid #444; display: flex; flex-direction: column; transition: 0.3s; z-index: 200; }
        .chat-header { background: #333; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #444; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 11px; padding: 8px; border-radius: 6px; background: #262626; border-left: 3px solid #00fbff; line-height: 1.4; }
        .chat-msg.to-me { border-left-color: #ff9f43; background: #3d2b1a; }

        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; position: relative; }
        .split-container { display: flex; width: 100%; height: 100%; background: #000; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #333; }
        
        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; flex: 1; position: relative; }
        .wb-active #wb-section { display: flex; }
        .wb-hidden-local #wb-section { display: none !important; }
        canvas { background: white; flex: 1; width: 100%; height: 100%; cursor: crosshair; touch-action: none; display: block; }

        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; background: #0d0d0d; }
        .student-card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 4px; text-align: center; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        
        video.main-broadcast { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* 生徒用コントロール（画質改善ボタン追加） */
        #student-view-options { position: fixed; bottom: 20px; right: 280px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .view-toggle-btn { background: rgba(50,50,50,0.9); color: white; border: 1px solid #666; font-size: 10px; padding: 10px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .improve-btn { background: #0097e6; border: 1px solid #00fbff; font-weight: bold; }
        .improve-btn:active { background: #00fbff; color: #000; }

        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; gap: 10px; justify-content: center; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; margin-bottom: 12px; text-align: center; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
        .hidden { display: none !important; }

        #comment-overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0, 151, 230, 0.95); color: white; padding: 20px 40px; border-radius: 20px; font-size: 24px; font-weight: bold; z-index: 9000; opacity: 0; transition: 0.5s; pointer-events: none; }
        #comment-overlay.show { opacity: 1; top: 25%; }
    </style>
</head>
<body>

<header>
    <div id="mode-text">準備中...</div>
    <div class="status-bar">
        <div id="status-msg">待機中</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff;">終了</button>
</header>

<div id="comment-overlay"></div>

<div class="main-layout" id="root-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff;">生徒用ID</div>
            <div id="display-room-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <div id="roster-list"></div>
    </div>

    <div class="primary-view">
        <div class="split-container" id="main-split-view">
            <div class="view-section" id="video-section">
                <video id="main-broadcast-video" class="main-broadcast" autoplay playsinline muted></video>
            </div>
            <div class="view-section" id="wb-section">
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
        
        <!-- 生徒用オプション -->
        <div id="student-view-options" class="hidden">
            <button class="view-toggle-btn improve-btn" onclick="improveQuality()">🚀 画質改善 (高負荷)</button>
            <button class="view-toggle-btn" onclick="toggleWbLocal()">ボード ON/OFF</button>
            <button class="view-toggle-btn" onclick="toggleChatLocal()">履歴 ON/OFF</button>
        </div>
    </div>

    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">💬 履歴</div>
        <div id="chat-history"></div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <input type="text" id="all-comment-input" placeholder="全員にメッセージ...">
    <button onclick="commentToAll()" style="background:#0097e6; color:white;">全員送信</button>
    <button onclick="toggleMenu()" style="background:#555; color:white;">🛠️ ツール</button>
</div>

<div id="tools-menu" class="overlay hidden" onclick="toggleMenu()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button onclick="startWhiteboard()" style="width:100%; margin-bottom:10px;">ボード開始</button>
        <button onclick="changeSharingSource()" style="width:100%; margin-bottom:10px;">画面変更</button>
        <button onclick="kickAllStudents()" style="width:100%; color:red;">全員退出</button>
        <button onclick="toggleMenu()" style="width:100%; margin-top:20px; background:#444;">閉じる</button>
    </div>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff;">授業支援システム</h2>
        <input type="text" id="user-name" placeholder="氏名">
        <input type="number" id="room-id" placeholder="参加ID">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false;

    // 先生側の高画質設定
    const VIDEO_CONSTRAINTS = {
        video: { width: 1920, height: 1080, frameRate: 30 },
        audio: true
    };

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を入力");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia(VIDEO_CONSTRAINTS);
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack && 'contentHint' in videoTrack) videoTrack.contentHint = 'detail';

            document.getElementById('setup-screen').classList.add('hidden');
            wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');

            peer = new Peer(role === 'teacher' ? "TEACHER-ROOM-" + currentRid : undefined);

            peer.on('open', () => {
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生":"生徒");
                if (role === 'teacher') {
                    document.getElementById('root-layout').classList.add('teacher-mode');
                    document.getElementById('monitor-area').classList.remove('hidden');
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('teacher-controls').classList.remove('hidden');
                    document.getElementById('display-room-id').innerText = currentRid;
                    document.getElementById('main-broadcast-video').srcObject = localStream;
                } else {
                    document.getElementById('student-view-options').classList.remove('hidden');
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => {
                    if(data.type === 'REQ_QUALITY') {
                        // 先生側：高画質要求を受け取ったらキーフレームを送る（RTCPeerConnectionを介して間接的にトリガーされる）
                        log("生徒から画質改善要求を受信");
                    }
                    handleData(conn.peer, data);
                });
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', s => {
                    if (role === 'teacher') addVideo(call.peer, s);
                });
            });
        } catch (e) { location.reload(); }
    }

    // --- 【重要】画質改善ロジック（生徒側） ---
    function improveQuality() {
        const teacherId = "TEACHER-ROOM-" + currentRid;
        if (!dataConnections[teacherId]) return;

        // 1. 先生に信号を送る（キーフレーム要求）
        dataConnections[teacherId].send({ type: 'REQ_QUALITY' });

        // 2. 現在の映像通信を一度切断して再接続
        if (mediaCalls[teacherId]) {
            mediaCalls[teacherId].close();
            delete mediaCalls[teacherId];
        }

        // 3. SDPを書き換えてビットレート上限を強制開放する設定で再接続
        const call = peer.call(teacherId, localStream, {
            sdpTransform: (sdp) => {
                // ビットレートを8000kbps(8Mbps)に強制設定
                return sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:8000\r\n');
            }
        });

        mediaCalls[teacherId] = call;
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
            log("画質を強制引き上げしました");
        });
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        conn.on('open', () => conn.send({ type: 'STUDENT_INFO', name: myName }));
        conn.on('data', data => handleData(tId, data));
        
        // 初回接続
        const call = peer.call(tId, localStream);
        mediaCalls[tId] = call;
        call.on('stream', s => document.getElementById('main-broadcast-video').srcObject = s);
    }

    function handleData(id, data) {
        if (data.type === 'STUDENT_INFO') {
            studentInfo[id] = { name: data.name };
            updateStudentDisplay(id);
        } else if (data.type === 'COMMENT') {
            addChatLog(data.from, data.message, data.isPrivate);
            showCommentUI(data.message);
        } else if (data.type === 'WB_START') {
            document.getElementById('root-layout').classList.add('wb-active');
            resizeCanvas();
        } else if (data.type === 'WB_DRAW') {
            drawRemote(data.x, data.y, data.color, data.start);
        } else if (data.type === 'KICK') location.reload();
    }

    // 基本UI操作
    function log(m) { document.getElementById('status-msg').innerText = m; }
    function toggleWbLocal() { document.getElementById('root-layout').classList.toggle('wb-hidden-local'); }
    function toggleChatLocal() { document.getElementById('chat-panel').classList.toggle('hidden'); }
    function toggleMenu() { document.getElementById('tools-menu').classList.toggle('hidden'); }
    
    function addChatLog(sender, msg, isP) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `chat-msg ${isP ? 'to-me' : ''}`;
        d.innerHTML = `<strong>${sender}</strong>: ${msg}`;
        h.prepend(d);
    }

    function commentToAll() {
        const val = document.getElementById('all-comment-input').value;
        if(!val) return;
        Object.values(dataConnections).forEach(c => c.send({ type: 'COMMENT', from: '先生', message: val }));
        addChatLog('自分', val, false);
        document.getElementById('all-comment-input').value = "";
    }

    function showCommentUI(msg) {
        const o = document.getElementById('comment-overlay'); o.innerText = msg; o.classList.add('show');
        setTimeout(() => o.classList.remove('show'), 5000);
    }

    function startWhiteboard() {
        document.getElementById('root-layout').classList.add('wb-active');
        Object.values(dataConnections).forEach(c => c.send({ type: 'WB_START' }));
        toggleMenu(); resizeCanvas();
    }

    function resizeCanvas() {
        const r = wbCanvas.getBoundingClientRect();
        wbCanvas.width = r.width; wbCanvas.height = r.height;
    }

    function drawRemote(x, y, color, start) {
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x * wbCanvas.width, y * wbCanvas.height); }
        else { wbCtx.lineTo(x * wbCanvas.width, y * wbCanvas.height); wbCtx.stroke(); }
    }

    function addVideo(id, s) {
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="vid-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById(`vid-${id}`).srcObject = s;
    }

    function updateStudentDisplay(id) {
        const roster = document.getElementById('roster-list');
        const d = document.createElement('div'); d.innerText = studentInfo[id].name;
        roster.appendChild(d);
    }

    function removeStudent(id) {
        if(document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        delete dataConnections[id];
    }
</script>
</body>
</html>
