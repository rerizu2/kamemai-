<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援 Pro Ultimate Integration</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #000; --panel: #1a1a1a; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --monitor-height: 40%; 
        }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* --- ヘッダー --- */
        header { background: #222; padding: 5px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 1000; height: 60px; box-sizing: border-box; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: var(--accent); }
        .timer-display { font-family: monospace; font-size: 20px; color: var(--warning); background: #000; padding: 2px 10px; border-radius: 4px; border: 1px solid #444; }

        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* --- 左サイドバー（教員専用項目が多い） --- */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; flex-shrink: 0; }
        .sidebar.hidden { display: none; }
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .my-preview video { width: 100%; border-radius: 4px; background: #000; aspect-ratio: 16/9; object-fit: cover; }

        /* --- メインコンテンツ --- */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; position: relative; }
        .broadcast-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; transition: opacity 0.3s; }
        #wb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; background: transparent; }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }
        
        /* ホワイトボード・黒板・方眼切替用 */
        .whiteboard-mode .broadcast-container { background: #fff !important; }
        .whiteboard-mode #main-video { opacity: 0; }
        .blackboard-mode .broadcast-container { background: #000 !important; }
        .blackboard-mode #main-video { opacity: 0; }
        .grid-bg { background-image: radial-gradient(#ccc 1px, transparent 1px); background-size: 20px 20px; }

        /* --- 監視グリッド（教員専用） --- */
        .monitor-grid { height: var(--monitor-height); display: flex; flex-direction: column; background: #050505; border-top: 2px solid #333; transition: 0.3s; flex-shrink: 0; }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 5px; text-align: center; position: relative; }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; margin: 0 auto; }
        .card-name { font-size: 10px; color: #eee; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* --- 操作バー --- */
        .dock { background: #222; padding: 10px 20px; border-top: 1px solid #444; display: flex; gap: 10px; align-items: center; z-index: 1000; flex-shrink: 0; }
        button { padding: 10px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; transition: 0.2s; font-size: 12px; }
        .btn-p { background: #0097e6; color: white; }
        .btn-w { background: var(--warning); color: black; }
        .btn-d { background: var(--danger); color: white; }
        .btn-g { background: #444; color: white; }
        input[type="text"] { flex: 1; background: #111; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; outline: none; }

        /* --- ツールハブ（100機能・教員専用） --- */
        #hub-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; padding: 50px; overflow-y: auto; }
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .hub-item { background: #222; border: 1px solid #444; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .hub-item:hover { border-color: var(--accent); background: #333; transform: translateY(-3px); }
        .hub-item span { font-size: 30px; display: block; margin-bottom: 10px; }

        /* --- ホワイトボードツール --- */
        #wb-toolbar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.95); padding: 10px; border-radius: 12px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); color: #333; border: 1px solid #ccc; }
        .wb-active #wb-toolbar { display: flex; }
        .tool-btn { width: 32px; height: 32px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; font-size: 16px; color: #333; }
        .tool-btn.active { background: var(--accent); color: black; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #ddd; }

        /* --- モーダル --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 35px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        #focus-overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #laser-pointer { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%; box-shadow: 0 0 10px red; pointer-events: none; z-index: 200; display: none; margin-left: -6px; margin-top: -6px; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; z-index: 10000; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body id="root-body">

<div id="toast"></div>
<div id="laser-pointer"></div>

<!-- ログイン画面 -->
<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:25px;">授業支援 Pro Infinity</h2>
        <input type="text" id="user-name" placeholder="お名前を入力" style="width:100%; padding:12px; margin-bottom:15px; background:#111; color:#fff; border:1px solid #444; border-radius:8px;">
        <input type="number" id="room-id" placeholder="参加ID（4桁）" style="width:100%; padding:12px; margin-bottom:20px; background:#111; color:#fff; border:1px solid #444; border-radius:8px;">
        <button class="btn-p" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">先生として開始</button>
        <button style="width:100%; height:45px; background:#444; color:white; border-radius:8px; border:none; cursor:pointer;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<div id="focus-overlay">
    <h1 style="font-size:48px; color:var(--accent);">先生に注目！</h1>
    <p>説明が終わるまで、操作を停止しています。</p>
</div>

<header>
    <div id="mode-label" style="font-weight: bold; color: var(--accent);">接続待ち...</div>
    <div style="display:flex; align-items:center; gap:20px;">
        <div id="timer-box" class="timer-display">00:00</div>
        <div class="status-bar">
            <div id="room-display">ID: ----</div>
            <div id="connect-display">接続: 0</div>
        </div>
        <button onclick="location.reload()" style="background:#444; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:10px;">終了</button>
    </div>
</header>

<div class="main-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="panel" id="teacher-preview-panel">
            <div class="panel-title">自分のプレビュー</div>
            <div class="my-preview"><video id="my-local-video" autoplay playsinline muted></video></div>
            <button class="btn-g" style="width:100%; margin-top:8px; font-size:9px;" onclick="changeSource()">ソース変更</button>
        </div>
        <div class="panel" id="teacher-qr-panel">
            <div class="panel-title">監視モニターQR</div>
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px; display:flex; justify-content:center;"></div>
            <div id="qr-url-text" style="font-size:8px; word-break:break-all; margin-top:5px; color:#888; text-align:center;"></div>
        </div>
        <div id="roster-list-panel" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">出席名簿 / 管理</div>
            <div id="roster-items"></div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="primary-view">
        <div class="broadcast-container" id="broadcast-container">
            <div class="on-air-badge" id="air-badge" style="position:absolute; top:10px; left:10px; z-index:100; background:var(--danger); padding:4px 10px; border-radius:20px; font-size:10px; font-weight:bold; display:none;">
                <div class="live-dot" style="display:inline-block; width:8px; height:8px; background:white; border-radius:50%; animation:pulse 1s infinite;"></div>
                <span id="air-text">配信中</span>
            </div>
            
            <video id="main-video" autoplay playsinline muted></video>
            <canvas id="wb-canvas"></canvas>

            <!-- ホワイトボードツールバー -->
            <div id="wb-toolbar">
                <div id="wb-teacher-only" class="hidden" style="display:flex; flex-direction:column; gap:8px; border-bottom:1px solid #ccc; padding-bottom:8px;">
                    <select id="wb-mode-select" onchange="setWbMode(this.value)" style="font-size:10px; padding:4px;">
                        <option value="teacher">先生のみ描画</option>
                        <option value="individual">各自練習（記入許可）</option>
                        <option value="all">全員共有</option>
                    </select>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <div class="tool-btn active" id="tool-pen" onclick="setWbTool('pen', this)">🖊️</div>
                    <div class="tool-btn" id="tool-eraser" onclick="setWbTool('eraser', this)">🧽</div>
                    <button onclick="undoWb()" style="border:1px solid #ccc; background:#fff; border-radius:6px;">↩️</button>
                    <button onclick="clearWb()" style="border:1px solid #ccc; background:#fff; border-radius:6px;">🗑️</button>
                </div>
                <div style="display:flex; gap:8px; justify-content:center;">
                    <div class="color-dot" style="background:black;" onclick="wbColor='black'"></div>
                    <div class="color-dot" style="background:red;" onclick="wbColor='red'"></div>
                    <div class="color-dot" style="background:blue;" onclick="wbColor='blue'"></div>
                </div>
                <button onclick="toggleWb()" style="font-size:10px; width:100%; margin-top:5px;" class="btn-p">ボードを閉じる</button>
            </div>
        </div>

        <!-- 監視グリッド（教員専用） -->
        <div id="monitor-section" class="monitor-grid hidden">
            <div style="background:#111; padding:5px 10px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; gap:5px;">
                    <button class="tab-btn active" id="tab-screen" onclick="switchTab('screen')">画面一覧</button>
                    <button class="tab-btn" id="tab-board" onclick="switchTab('board')">ボード一覧</button>
                </div>
                <input type="range" min="10" max="80" value="40" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + '%')" style="width:60px;">
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<!-- 操作ドック -->
<div class="dock">
    <!-- 教員用コントロール -->
    <div id="teacher-dock" class="hidden" style="display:flex; gap:10px; align-items:center; flex:1;">
        <button class="btn-p" onclick="toggleWb()">🖊️ ボード</button>
        <button class="btn-w" onclick="toggleHub()">🛠️ ツール</button>
        <input type="text" id="comment-input" placeholder="メッセージまたはURLを送信...">
        <button class="btn-p" onclick="sendComment()">送信</button>
    </div>

    <!-- 生徒用コントロール -->
    <div id="student-dock" class="hidden" style="display:flex; gap:10px; align-items:center; flex:1;">
        <button id="hand-btn" class="btn-w" onclick="toggleHand()">✋ 挙手</button>
        <button class="btn-d" onclick="toggleConfuse()">❓ わかりません</button>
        <div style="flex:1;"></div>
        <span style="font-size:10px; color:#666;">STUDENT MODE</span>
    </div>
</div>

<!-- 🛠️ 100機能ハブ（教員専用） -->
<div id="hub-overlay">
    <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
        <h2 style="margin:0;">教員専用ツールボックス</h2>
        <button onclick="toggleHub()" class="btn-d">閉じる</button>
    </div>
    <div class="hub-grid" id="hub-items"></div>
</div>

<!-- アンケート回答（生徒専用） -->
<div id="poll-modal" class="overlay">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="poll-q">質問</h3>
        <div id="poll-opts" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "teacher", wbTool = "pen", wbHistory = [];
    let isFocus = false, handRaised = false, timerInterval;

    // --- 起動・権限設定 ---
    async function start(role) {
        myRole = role; 
        myName = document.getElementById('user-name').value || (role==='teacher'?'教員':'生徒');
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
            document.getElementById('setup-screen').style.display = 'none';
            initWhiteboard();

            if (role === 'teacher') {
                // 教員用UIを有効化
                document.getElementById('teacher-dock').classList.remove('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('monitor-section').classList.remove('hidden');
                document.getElementById('wb-teacher-only').classList.remove('hidden');
                document.getElementById('mode-label').innerText = "教員モード";
                buildHub(); 
                peer = new Peer("T-ROOM-" + currentRid);
                setupTeacher();
            } else {
                // 生徒用UIを有効化（教員用は表示しない）
                document.getElementById('student-dock').classList.remove('hidden');
                document.getElementById('mode-label').innerText = "生徒モード";
                peer = new Peer();
                setupStudent();
            }
        } catch(e) { alert("画面共有を許可してください。"); location.reload(); }
    }

    function setupTeacher() {
        peer.on('open', () => {
            document.getElementById('room-display').innerText = "ID: " + currentRid;
            document.getElementById('my-local-video').srcObject = localStream;
            document.getElementById('main-video').srcObject = localStream;
            const url = window.location.origin + window.location.pathname + `?room=${currentRid}`;
            new QRCode(document.getElementById("qrcode"), { text: url, width: 100, height: 100 });
            document.getElementById('qr-url-text').innerText = url;
        });
        peer.on('connection', conn => {
            dataConnections[conn.peer] = conn;
            conn.on('data', data => handleIncomingData(conn.peer, data));
            conn.on('close', () => removeStudent(conn.peer));
        });
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => { studentStreams[call.peer] = s; addStudentCard(call.peer, s); });
        });
    }

    function setupStudent() {
        const tid = "T-ROOM-" + currentRid;
        peer.on('open', () => {
            const call = peer.call(tid, localStream);
            const conn = peer.connect(tid);
            dataConnections[tid] = conn;
            conn.on('open', () => conn.send({ type: 'INFO', name: myName }));
            conn.on('data', data => handleIncomingData(tid, data));
            call.on('stream', s => { document.getElementById('main-video').srcObject = s; });
        });
    }

    // --- ホワイトボードロジック（PointerEvents & 権限） ---
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        const resize = () => { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; };
        resize(); window.onresize = resize;

        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (wbCanvas.width / rect.width), y: (e.clientY - rect.top) * (wbCanvas.height / rect.height) };
        };

        wbCanvas.addEventListener('pointerdown', e => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true; const pos = getPos(e); drawLocal(pos.x, pos.y, true); sendStroke(pos.x, pos.y, true);
        });
        wbCanvas.addEventListener('pointermove', e => {
            if (!wbDrawing) return;
            const pos = getPos(e); drawLocal(pos.x, pos.y, false); sendStroke(pos.x, pos.y, false);
        });
        window.addEventListener('pointerup', () => { if(wbDrawing) saveWbHistory(); wbDrawing = false; });
    }

    function drawLocal(x, y, start) {
        wbCtx.lineCap = "round"; wbCtx.lineJoin = "round";
        wbCtx.globalCompositeOperation = (wbTool === 'eraser') ? 'destination-out' : 'source-over';
        wbCtx.lineWidth = (wbTool === 'eraser') ? 40 : 3;
        wbCtx.strokeStyle = wbColor;
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x, y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function sendStroke(x, y, start) {
        const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, tool: wbTool, start };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function renderRemoteStroke(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        if (id.startsWith('T-ROOM') || myRole === 'teacher' || wbMode === 'all') {
            const oldT = wbTool, oldC = wbColor; wbTool = data.tool; wbColor = data.color;
            drawLocal(x, y, data.start); wbTool = oldT; wbColor = oldC;
        }
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d'); mCtx.strokeStyle = data.color; mCtx.lineWidth = 2;
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); }
            mCtx.lineTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); mCtx.stroke();
        }
        if (myRole === 'teacher' && wbMode === 'all') Object.entries(dataConnections).forEach(([tid, c]) => { if(tid !== id) c.send(data); });
    }

    // --- インフィニティハブ（教員専用・100機能） ---
    const TOOLS = [
        { icon: '🔒', name: '注目モード', fn: () => toggleFocus() },
        { icon: '🎲', name: 'ランダム指名', fn: () => { const ids = Object.keys(studentInfo); if(ids.length) alert("指名: " + studentInfo[ids[Math.floor(Math.random()*ids.length)]].name); } },
        { icon: '⏱️', name: 'タイマー', fn: () => startTimer() },
        { icon: '📊', name: '投票開始', fn: () => createQuickPoll() },
        { icon: '⬜', name: '白紙モード', fn: () => setBg('white') },
        { icon: '⬛', name: '黒板モード', fn: () => setBg('black') },
        { icon: '🏁', name: '方眼紙', fn: () => setBg('grid') },
        { icon: '💎', name: '全員加点', fn: () => { Object.values(dataConnections).forEach(c => c.send({type:'STAR'})); showToast("全員にポイントを贈りました"); } },
        { icon: '👏', name: '拍手喝采', fn: () => { shootConfetti(); Object.values(dataConnections).forEach(c => c.send({type:'REACTION', emoji:'👏'})); } },
        { icon: '📋', name: '出席CSV', fn: () => exportAttendance() },
        { icon: '⏹️', name: '配信停止', fn: () => toggleBroadcast() },
        { icon: '💣', name: '一斉退出', fn: () => { if(confirm("全員退出?")) Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); } }
    ];

    function buildHub() {
        const hub = document.getElementById('hub-items');
        TOOLS.forEach(t => {
            const div = document.createElement('div'); div.className = 'hub-item';
            div.innerHTML = `<span>${t.icon}</span><b>${t.name}</b>`;
            div.onclick = t.fn; hub.appendChild(div);
        });
    }

    // --- データ受信処理 ---
    function handleIncomingData(id, data) {
        switch(data.type) {
            case 'INFO': studentInfo[id] = data; updateRoster(); updateConnectCount(); break;
            case 'WB_DRAW': renderRemoteStroke(id, data); break;
            case 'WB_START': document.body.classList.add('wb-active'); resizeCanvas(); break;
            case 'WB_STOP': document.body.classList.remove('wb-active'); break;
            case 'WB_MODE': wbMode = data.mode; break;
            case 'WB_CLEAR': wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); break;
            case 'WB_BG': applyBg(data.bg); break;
            case 'FOCUS': document.getElementById('focus-overlay').style.display = data.active ? 'flex' : 'none'; break;
            case 'TIMER': document.getElementById('timer-box').innerText = data.time; break;
            case 'HAND': studentInfo[id].hand = data.active; document.getElementById(`card-${id}`)?.classList.toggle('raised', data.active); if(data.active) showToast(studentInfo[id].name + " 挙手！"); break;
            case 'POLL_START': showPoll(data.q, data.opts); break;
            case 'STAR': shootConfetti(); showToast("ダイヤモンド獲得！💎"); break;
            case 'COMMENT': showToast(data.msg); break;
            case 'KICK': location.reload(); break;
            case 'REACTION': spawnEmoji(data.emoji); break;
        }
    }

    // --- 管理関数（ガード付き） ---
    function toggleHub() { if(myRole !== 'teacher') return; const h = document.getElementById('hub-overlay'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; }
    function toggleFocus() { if(myRole !== 'teacher') return; isFocus = !isFocus; Object.values(dataConnections).forEach(c => c.send({type:'FOCUS', active:isFocus})); toggleHub(); }
    function startTimer() { if(myRole !== 'teacher') return; const s = prompt("秒数?","60"); if(!s) return; let t = parseInt(s); clearInterval(timerInterval); timerInterval = setInterval(()=>{ t--; let d = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0'); document.getElementById('timer-box').innerText = d; Object.values(dataConnections).forEach(c => c.send({type:'TIMER', time:d})); if(t<=0) clearInterval(timerInterval); }, 1000); toggleHub(); }
    function setBg(bg) { if(myRole !== 'teacher') return; applyBg(bg); Object.values(dataConnections).forEach(c => c.send({type:'WB_BG', bg})); toggleHub(); }
    function applyBg(bg) { document.body.className = (bg==='transparent'?'':(bg==='grid'?'whiteboard-mode grid-bg':bg+'-mode')); }
    function exportAttendance() { if(myRole !== 'teacher') return; let csv = "Name\n"; Object.values(studentInfo).forEach(s => csv += s.name + "\n"); const b = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download="meibo.csv"; a.click(); }

    // --- その他UI操作 ---
    function toggleWb() { const a = document.body.classList.toggle('wb-active'); if(myRole==='teacher') Object.values(dataConnections).forEach(c=>c.send({type:a?'WB_START':'WB_STOP'})); setTimeout(resizeCanvas, 50); }
    function setWbMode(m) { if(myRole==='teacher') { wbMode=m; Object.values(dataConnections).forEach(c=>c.send({type:'WB_MODE', mode:m})); } }
    function setWbTool(t, btn) { wbTool=t; document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
    function clearWb() { if(myRole==='teacher') { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c=>c.send({type:'WB_CLEAR'})); } }
    function undoWb() { wbHistory.pop(); if(wbHistory.length) wbCtx.putImageData(wbHistory[wbHistory.length-1],0,0); else wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); }
    function saveWbHistory() { wbHistory.push(wbCtx.getImageData(0,0,wbCanvas.width,wbCanvas.height)); if(wbHistory.length>20) wbHistory.shift(); }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none',3000); }
    function toggleHand() { handRaised = !handRaised; document.getElementById('hand-btn').style.background = handRaised ? 'var(--success)' : 'var(--warning)'; dataConnections["T-ROOM-"+currentRid]?.send({type:'HAND', active: handRaised}); }
    function toggleConfuse() { Object.values(dataConnections).forEach(c => c.send({type:'CONFUSE', active:true})); showToast("先生に通知しました"); }
    function shootConfetti() { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); }
    function spawnEmoji(e) { const s = document.createElement('span'); s.style.cssText = `position:fixed; bottom:0; left:${Math.random()*90}vw; font-size:40px; z-index:9000; pointer-events:none; transition:2s; transform:translateY(0);`; s.innerText = e; document.body.appendChild(s); setTimeout(()=>{ s.style.transform = 'translateY(-100vh)'; s.style.opacity = '0'; setTimeout(()=>s.remove(), 2000); }, 50); }
    function updateConnectCount() { document.getElementById('connect-display').innerText = "接続: " + Object.keys(studentInfo).length; }
    function sendComment() { const m = document.getElementById('comment-input').value; if(m) { Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', msg:m})); document.getElementById('comment-input').value=""; showToast("送信しました"); } }
    function switchTab(t) { document.getElementById('grid-screen').classList.toggle('hidden', t!=='screen'); document.getElementById('grid-board').classList.toggle('hidden', t!=='board'); }
    function addStudentCard(id, stream) {
        if(myRole !== 'teacher' || document.getElementById(`card-${id}`)) return;
        const name = studentInfo[id]?.name || 'Student';
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline muted></video><span class="card-name">${name}</span><button class="btn-p" style="font-size:8px; width:100%; margin-top:4px;" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card); document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'student-card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white;border-radius:4px;"></canvas><span style="font-size:9px;">${name}</span>`;
        document.getElementById('grid-board').appendChild(wbCard);
    }
    function updateRoster() { const r = document.getElementById('roster-items'); r.innerHTML = ""; Object.entries(studentInfo).forEach(([id, info]) => { r.innerHTML += `<div style="font-size:10px; margin-bottom:5px;">● ${info.name}</div>`; }); }
    async function startSpotlight(id) { const track = studentStreams[id].getVideoTracks()[0]; document.getElementById('main-video').srcObject = studentStreams[id]; Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } }); }
</script>
</body>
