<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業支援システム【配信同期版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --pip-size: 280px; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 5px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 1000; height: 60px; box-sizing: border-box; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー（教員用） */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .room-info { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; text-align: center; }
        .my-preview video { width: 100%; border-radius: 4px; background: #222; }
        
        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; position: relative; }
        .video-container { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; position: relative; transition: 0.5s; border: 2px solid #333; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        .broadcast-label { position: absolute; top: 10px; left: 10px; background: rgba(231, 76, 60, 0.8); color: white; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none; z-index: 200; }

        /* 監視グリッド */
        .monitor-grid { height: 40%; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; align-content: start; background: #050505; border-top: 2px solid #333; z-index: 150; }
        .monitor-only-mode .monitor-grid { height: 100%; border-top: none; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 6px; text-align: center; position: relative; cursor: crosshair; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; pointer-events: none; }
        
        /* ホワイトボード、コントロール他は共通 */
        #wb-section { display: none; position: absolute; inset: 0; background: white; z-index: 50; flex-direction: column; }
        .wb-active #wb-section { display: flex; }
        canvas { background: white; flex: 1; width: 100%; cursor: crosshair; touch-action: none; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        button { padding: 10px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; margin: 2px; }
        .hidden { display: none !important; }
        #comment-overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0, 151, 230, 0.95); color: white; padding: 20px 40px; border-radius: 20px; font-size: 24px; z-index: 9000; opacity: 0; transition: 0.5s; pointer-events: none; }
        #comment-overlay.show { opacity: 1; }
    </style>
</head>
<body id="root-body">

<header>
    <div id="mode-label">接続中...</div>
    <div id="count-display" class="status-bar">接続: 0</div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="comment-overlay"></div>

<div class="main-layout" id="root-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info">
            <div id="display-room-id" style="font-size: 24px; font-weight: bold; color: #00fbff;">----</div>
            <div style="font-size: 9px; color: #aaa;">参加ID</div>
        </div>
        <div class="my-preview">
            <h3 style="font-size:10px; color:#aaa; margin:0 0 5px;">🔴 自分の画面</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
            <button id="reset-btn" class="hidden" onclick="resetSpotlight()" style="width:100%; background:#f39c12; color:white; font-size:10px; margin-top:5px;">自分の画面に戻す</button>
        </div>
        <div id="roster-list"></div>
    </div>

    <div class="primary-view">
        <div class="video-container" id="video-section">
            <div class="broadcast-label" id="broadcast-label">配信中：自分の画面</div>
            <video id="main-broadcast-video" autoplay playsinline muted></video>
        </div>

        <div id="wb-section">
            <div style="background:#eee; padding:5px; display:flex; gap:10px; color:black;">
                <span style="font-weight:bold;">🖊️ ホワイトボード</span>
                <button onclick="stopWhiteboard()" style="background:#444; color:white; font-size:10px; margin-left:auto;">閉じる</button>
            </div>
            <canvas id="wb-canvas"></canvas>
        </div>

        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden" style="background:#222; padding:10px; display:flex; justify-content:center; gap:10px;">
    <input type="text" id="all-msg-input" placeholder="メッセージ..." style="background:#111; color:white; border:1px solid #444; padding:10px; border-radius:8px; flex:1; max-width:400px;">
    <button onclick="commentToAll()" style="background:#0097e6; color:white;">送信</button>
    <button onclick="startWhiteboard()" style="background:#333; color:white;">🖊️ ボード</button>
    <button onclick="kickAllStudents()" style="background:#c23616; color:white;">⚠️ 全退出</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:white; border:1px solid #444; border-radius:8px;">
        <input type="number" id="room-id" placeholder="参加ID" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:white; border:1px solid #444; border-radius:8px;">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%; margin-bottom:10px;" onclick="start('student')">生徒として参加</button>
        <button style="background:#27ae60; color:white; width:100%;" onclick="start('remote')">監視用モニターとして接続</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let monitorIds = []; 
    let wbCanvas, wbCtx, wbDrawing = false;

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value || (role==='teacher'?"先生":"モニター");
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");

        try {
            if (role !== 'remote') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }
            document.getElementById('setup-screen').classList.add('hidden');
            initWhiteboard();

            let myPeerId = (role === 'teacher' ? "T-ROOM-" + currentRid : (role === 'remote' ? "M-ROOM-" + currentRid + "-" + Date.now() : undefined));
            peer = new Peer(myPeerId);

            peer.on('open', () => {
                document.getElementById('mode-label').innerText = role === 'teacher' ? "先生 モード" : (role === 'remote' ? "監視モニター" : "生徒モード");
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('display-room-id').innerText = currentRid;
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                        document.getElementById('my-local-preview').srcObject = localStream;
                        document.getElementById('main-broadcast-video').srcObject = localStream; // 初期は自分の画面を生徒に見せている
                    } else {
                        document.getElementById('root-body').classList.add('monitor-only-mode');
                        document.getElementById('video-section').classList.add('hidden');
                        const conn = peer.connect("T-ROOM-" + currentRid);
                        conn.on('open', () => conn.send({ type: 'REGISTER_MONITOR' }));
                    }
                } else {
                    autoConnect();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(role === 'teacher' ? localStream : null);
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        addVideo(call.peer, stream);
                    }
                });
            });
        } catch (e) { alert("失敗しました。"); location.reload(); }
    }

    function autoConnect() {
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({ type: 'INFO', name: myName }));
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => document.getElementById('main-broadcast-video').srcObject = s);
    }

    function handleData(id, data) {
        if (data.type === 'INFO') {
            studentInfo[id] = { name: data.name }; addRoster(id); updateDisplay(id);
        } else if (data.type === 'REGISTER_MONITOR') {
            monitorIds.push(id);
            Object.values(dataConnections).forEach(c => { if(c.peer.indexOf('ROOM')===-1) c.send({type:'MONITOR_LIST', ids:monitorIds}); });
        } else if (data.type === 'MONITOR_LIST') {
            data.ids.forEach(mId => { if(!mediaCalls[mId]) { peer.call(mId, localStream); peer.connect(mId); } });
        } else if (data.type === 'WB_START') {
            document.getElementById('root-layout').classList.add('wb-active');
        } else if (data.type === 'WB_STOP') {
            document.getElementById('root-layout').classList.remove('wb-active');
        } else if (data.type === 'COMMENT') {
            const o = document.getElementById('comment-overlay'); o.innerText = data.msg; o.classList.add('show'); setTimeout(()=>o.classList.remove('show'), 5000);
        } else if (data.type === 'KICK') location.reload();
    }

    function addVideo(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<div id="c-name-${id}" style="font-size:10px;margin-bottom:5px;">...</div><video id="v-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card); document.getElementById(`v-${id}`).srcObject = stream;
    }

    function addRoster(id) {
        if (myRole !== 'teacher' || document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div'); div.className = 'roster-item'; div.id = `roster-${id}`;
        div.innerHTML = `<span id="r-name-${id}">...</span><br>
            <button onclick="startSpotlight('${id}')" style="background:#f39c12; color:white; font-size:10px;">全員に共有</button>`;
        document.getElementById('roster-list').appendChild(div);
    }

    function updateDisplay(id) {
        const name = studentInfo[id]?.name || "???";
        if (document.getElementById(`r-name-${id}`)) document.getElementById(`r-name-${id}`).innerText = name;
        if (document.getElementById(`c-name-${id}`)) document.getElementById(`c-name-${id}`).innerText = name;
        document.getElementById('count-display').innerText = "接続: " + Object.keys(studentStreams).length;
    }

    // 【重要】スポットライト機能（配信映像を切り替え、先生の画面も同期する）
    function startSpotlight(id) {
        const studentStream = studentStreams[id];
        const track = studentStream.getVideoTracks()[0];
        
        // 全生徒・モニターに送っている映像トラックを、その生徒のものに差し替える
        Object.values(mediaCalls).forEach(c => {
            if(c.peerConnection) {
                const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(track);
            }
        });

        // 先生自身のメイン画面もその生徒の映像に切り替える（生徒に見せている画面を確認できるようにする）
        document.getElementById('main-broadcast-video').srcObject = studentStream;
        document.getElementById('broadcast-label').innerText = `配信中：${studentInfo[id].name} さんの画面`;
        document.getElementById('broadcast-label').style.background = "#f39c12";
        document.getElementById('reset-btn').classList.remove('hidden');
    }

    // 【重要】自分の画面配信に戻す
    function resetSpotlight() {
        const track = localStream.getVideoTracks()[0];
        Object.values(mediaCalls).forEach(c => {
            if(c.peerConnection) {
                const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(track);
            }
        });

        // 先生自身のメイン画面を自分の画面に戻す
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('broadcast-label').innerText = `配信中：自分の画面`;
        document.getElementById('broadcast-label').style.background = "#e74c30";
        document.getElementById('reset-btn').classList.add('hidden');
    }

    // その他共通機能
    function startWhiteboard() { document.getElementById('root-layout').classList.add('wb-active'); Object.values(dataConnections).forEach(c => c.send({ type: 'WB_START' })); }
    function stopWhiteboard() { document.getElementById('root-layout').classList.remove('wb-active'); Object.values(dataConnections).forEach(c => c.send({ type: 'WB_STOP' })); }
    function commentToAll() { const m = document.getElementById('all-msg-input').value; if(m){ Object.values(dataConnections).forEach(c=>c.send({type:'COMMENT', msg:m})); document.getElementById('all-msg-input').value=""; } }
    function kickAllStudents() { if(confirm("全員退出させますか？")) Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); }
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        wbCanvas.width = window.innerWidth; wbCanvas.height = window.innerHeight;
        wbCanvas.addEventListener('mousedown', () => wbDrawing = true);
        wbCanvas.addEventListener('mouseup', () => wbDrawing = false);
        wbCanvas.addEventListener('mousemove', e => {
            if (!wbDrawing) return;
            wbCtx.lineWidth = 3; wbCtx.lineTo(e.clientX, e.clientY); wbCtx.stroke();
            wbCtx.beginPath(); wbCtx.moveTo(e.clientX, e.clientY);
        });
    }
</script>
</body>
</html>
