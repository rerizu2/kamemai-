<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視・配信システム（強制退出機能付）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 240px; background: #1a1a1a; border-right: 1px solid #444; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; position: relative; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; display: block; }
        
        .roster-item { background: #333; padding: 8px; border-radius: 5px; font-size: 11px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
        .roster-btns { display: flex; gap: 5px; }

        .primary-view { flex: 1; position: relative; background: #111; overflow: hidden; }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; align-content: start; }
        
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 8px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 5px; display: block; }
        
        .student-surface-tag {
            position: absolute; bottom: 35px; right: 15px; background: rgba(255, 255, 255, 0.2);
            color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(2px);
        }

        #teacher-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* セットアップ */
        .setup-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #333; }
        input { padding: 12px; font-size: 18px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        input:read-only { background: #333; color: #aaa; cursor: not-allowed; }

        button { padding: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; font-size: 13px; }
        .btn-kick { background: #e84118; color: white; }
        .btn-kick:hover { background: #c23616; }
        .hidden { display: none !important; }
        
        #reconnect-btn { position: fixed; bottom: 20px; right: 20px; background: #f39c12; color: white; padding: 10px 20px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; z-index: 500; }
    </style>
</head>
<body>

<header>
    <div>モード: <span id="mode-text">選択中</span></div>
    <div class="status-bar">
        <div id="status-msg">待機中...</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; border:none; width:60px; font-size:10px;">終了</button>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff;">生徒に教える参加ID</div>
            <div id="display-room-id" style="font-size: 36px; font-weight: bold; letter-spacing: 3px;">----</div>
        </div>
        <div class="my-preview-area">
            <h3 style="font-size:11px; color:#aaa; margin:0 0 5px;">🔴 自分の画面プレビュー</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
        </div>
        <h3 style="font-size:12px; color:#aaa; margin:10px 0 5px;">👥 生徒リスト</h3>
        <div id="student-roster"></div>
    </div>

    <div class="primary-view">
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <video id="teacher-video" class="hidden" autoplay playsinline muted></video>
        <button id="reconnect-btn" class="hidden" onclick="retryConnection()">先生を探す(再接続)</button>
    </div>
</div>

<div id="teacher-controls" class="hidden" style="background:#222; padding:10px; display:flex; gap:10px; justify-content:center; border-top:1px solid #444;">
    <button id="broadcast-btn" onclick="toggleBroadcast()" style="background:#e84118; color:white; flex:1;">📡 配信を停止</button>
    <button onclick="openMonitorWindow()" style="background:#8e44ad; color:white; flex:1;">🔲 別窓監視</button>
    <button onclick="showRemoteQR()" style="background:#f39c12; color:white; flex:1;">📱 スマホ監視</button>
    <button onclick="kickAllStudents()" style="background:#c23616; color:white; flex:1;">⚠️ 全員強制退出</button>
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="color:#00fbff; margin-bottom:20px;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力（固定されます）">
        <input type="number" id="room-id" placeholder="生徒：番号を入力" oninput="checkCode()">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%; margin-bottom:10px;" onclick="start('student')">生徒として参加</button>
        <button id="secret-btn" class="hidden" style="background:#8e44ad; color:white; width:100%;" onclick="start('remote')">🔍 生徒監視（隠しモード）</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let isBroadcasting = true;
    let studentCount = 0;
    const studentStreams = {};
    const studentInfo = {};
    const dataConnections = {}; // 教員用：生徒とのデータ接続を保持

    function log(m) { document.getElementById('status-msg').innerText = m; }
    function updateCount() { document.getElementById('count-display').innerText = "接続数: " + studentCount; }

    function checkCode() { if (document.getElementById('room-id').value === "200977") reveal(); }
    window.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'i') reveal(); });
    function reveal() { document.getElementById('secret-btn').classList.remove('hidden'); }

    async function start(role) {
        const nameInput = document.getElementById('user-name');
        myRole = role;
        myName = nameInput.value;
        const inputRid = document.getElementById('room-id').value;

        if (role === 'student' && !myName) return alert("氏名を入力してください");

        if (myName) {
            localStorage.setItem('savedUserName', myName);
            nameInput.readOnly = true;
        }

        if (role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        else currentRid = inputRid;

        try {
            if (role === 'teacher' || role === 'student') {
                log("画面共有の許可を待っています...");
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }

            document.getElementById('setup-screen').classList.add('hidden');
            const peerId = (role === 'teacher' ? "T-PC-" : (role === 'remote' ? "T-MB-" : "")) + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                log("サーバー接続成功");
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生": (role==='remote'?"監視員":"生徒"));
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('display-room-id').innerText = currentRid;
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                        document.getElementById('my-local-preview').srcObject = localStream;
                    }
                } else {
                    document.getElementById('teacher-video').classList.remove('hidden');
                    document.getElementById('reconnect-btn').classList.remove('hidden');
                    retryConnection();
                }
            });

            // 教員側：データ接続のハンドリング
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => {
                    if (data.type === 'STUDENT_INFO') {
                        studentInfo[conn.peer] = { name: data.name, surface: data.surface };
                        updateStudentDisplay(conn.peer);
                    }
                });
                conn.on('close', () => delete dataConnections[conn.peer]);
            });

            peer.on('call', call => {
                call.answer(role === 'teacher' && isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        studentCount++;
                        updateCount();
                        if (role === 'teacher') addRoster(call.peer);
                        else addVideo(call.peer, stream);
                    }
                });
            });

        } catch (e) { alert("失敗: " + e.message); location.reload(); }
    }

    function retryConnection() {
        if (!currentRid || myRole !== 'student') return;
        const teacherId = "T-PC-" + currentRid;
        
        peer.call(teacherId, localStream).on('stream', stream => {
            document.getElementById('teacher-video').srcObject = stream;
        });

        const conn = peer.connect(teacherId);
        conn.on('open', () => {
            const surface = localStream.getVideoTracks()[0].getSettings().displaySurface;
            conn.send({ type: 'STUDENT_INFO', name: myName, surface: surface });
        });
        // 強制退出命令を待機
        conn.on('data', data => {
            if (data.type === 'KICK') {
                alert("教員によって退出させられました。");
                location.reload();
            }
        });

        peer.call("T-MB-" + currentRid, localStream);
    }

    // 教員：個別キック
    function kickStudent(id) {
        if (confirm("この生徒を強制退出させますか？")) {
            if (dataConnections[id]) {
                dataConnections[id].send({ type: 'KICK' });
                log("生徒をキックしました");
            }
        }
    }

    // 教員：全員キック
    function kickAllStudents() {
        if (confirm("接続中の全生徒を強制退出させますか？")) {
            Object.values(dataConnections).forEach(conn => {
                conn.send({ type: 'KICK' });
            });
            log("全員を強制退出させました");
        }
    }

    function addRoster(id) {
        if (document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div');
        div.className = 'roster-item';
        div.id = `roster-${id}`;
        const displayName = studentInfo[id] ? studentInfo[id].name : `ID:${id.slice(-4)}`;
        div.innerHTML = `
            <span id="roster-name-${id}" style="font-weight:bold;">${displayName}</span>
            <div class="roster-btns">
                <button onclick="addVideo('${id}')" style="background:#44bd32; color:white; flex:1;">監視</button>
                <button onclick="kickStudent('${id}')" class="btn-kick" style="flex:1;">退出</button>
            </div>
        `;
        document.getElementById('student-roster').appendChild(div);
    }

    function addVideo(id, manualStream) {
        if (document.getElementById(`card-${id}`)) return;
        const stream = manualStream || studentStreams[id];
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        const info = studentInfo[id] || { name: `ID:${id.slice(-4)}`, surface: '' };
        card.innerHTML = `
            <div id="badge-${id}" class="student-surface-tag">${getSurfaceName(info.surface)}</div>
            <div id="label-name-${id}" style="font-size:11px; color:#fff; font-weight:bold; margin-bottom:4px;">${info.name}</div>
            <video id="vid-${id}" autoplay playsinline muted></video>
        `;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById(`vid-${id}`).srcObject = stream;
        
        stream.getVideoTracks()[0].onended = () => {
            card.remove();
            if (document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove();
            studentCount = Math.max(0, studentCount - 1);
            updateCount();
            delete studentStreams[id];
            delete studentInfo[id];
        };
    }

    function updateStudentDisplay(id) {
        const info = studentInfo[id];
        if (!info) return;
        if (document.getElementById(`roster-name-${id}`)) document.getElementById(`roster-name-${id}`).innerText = info.name;
        if (document.getElementById(`label-name-${id}`)) document.getElementById(`label-name-${id}`).innerText = info.name;
        if (document.getElementById(`badge-${id}`)) document.getElementById(`badge-${id}`).innerText = getSurfaceName(info.surface);
    }

    function getSurfaceName(type) {
        const names = { 'monitor': '🖥️ 全画面', 'window': '🗔 ウィンドウ', 'browser': '🌐 タブ' };
        return names[type] || '';
    }

    function toggleBroadcast() {
        isBroadcasting = !isBroadcasting;
        localStream.getVideoTracks().forEach(t => t.enabled = isBroadcasting);
        document.getElementById('broadcast-btn').innerText = isBroadcasting ? "📡 配信を停止" : "📡 配信を開始";
        document.getElementById('broadcast-btn').style.background = isBroadcasting ? "#e84118" : "#44bd32";
    }

    function openMonitorWindow() {
        window.open(window.location.origin + window.location.pathname + "#remote-" + currentRid, '_blank', 'width=1000,height=700');
    }

    function showRemoteQR() {
        const url = window.location.origin + window.location.pathname + "#remote-" + currentRid;
        const container = document.getElementById('qrcode');
        container.innerHTML = "";
        new QRCode(container, { text: url, width: 180, height: 180 });
        document.getElementById('qr-modal').classList.remove('hidden');
    }

    window.onload = () => {
        const savedName = localStorage.getItem('savedUserName');
        if (savedName) {
            const nameInput = document.getElementById('user-name');
            nameInput.value = savedName;
            nameInput.readOnly = true;
        }
        if (window.location.hash.startsWith("#remote-")) {
            const rid = window.location.hash.replace("#remote-", "");
            setTimeout(() => { currentRid = rid; start('remote'); }, 500); 
        }
    };
</script>

<div id="qr-modal" class="modal hidden" onclick="this.classList.add('hidden')" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index:2000;">
    <div style="background:white; padding:20px; border-radius:15px; text-align:center; color:black;" onclick="event.stopPropagation()">
        <div id="qrcode" style="margin-bottom:10px;"></div>
        <button onclick="document.getElementById('qr-modal').classList.add('hidden')" style="width:100%; background:#ddd; border:none; padding:10px; border-radius:8px;">閉じる</button>
    </div>
</div>

</body>
</html>
