<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双方向・画面共有システム（全画面制限版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .primary-view { flex: 3; padding: 10px; display: flex; flex-direction: column; align-items: center; background: #000; }
        .primary-view img, .primary-view video { max-width: 100%; max-height: 80vh; border: 2px solid #00d1ff; }
        .monitor-sidebar { flex: 1; background: #1e1e1e; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }
        .student-card { background: #333; margin-bottom: 10px; padding: 5px; border-radius: 5px; font-size: 12px; }
        .student-card img { width: 100%; background: #000; }
        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .setup-box { background: #333; padding: 30px; border-radius: 15px; text-align: center; }
        button { padding: 12px 24px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; margin: 10px; }
        .btn-teacher { background: #e84118; color: white; }
        .btn-student { background: #0097e6; color: white; }
        #log { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); font-size: 11px; padding: 5px; max-height: 60px; overflow-y: auto; color: #0f0; pointer-events: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <span id="role-label">モードを選択してください</span> | 
    ID: <span id="display-id">----</span>
</header>

<div class="main-layout">
    <div class="primary-view">
        <h3 id="view-title">画面未接続</h3>
        <img id="main-screen" class="hidden">
        <video id="my-preview" autoplay playsinline muted class="hidden"></video>
    </div>
    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <h4 style="margin:0 0 10px 0;">生徒の画面一覧</h4>
        <div id="student-grid"></div>
    </div>
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2>役割を選択</h2>
        <div>
            <button class="btn-teacher" onclick="initTeacher()">👨‍🏫 教員として開始</button>
        </div>
        <hr>
        <div style="margin-top:20px;">
            <input type="number" id="input-teacher-id" placeholder="教員のIDを入力" style="padding:10px; font-size:16px; width:150px;">
            <button class="btn-student" onclick="initStudent()">🎓 生徒として参加</button>
            <p style="font-size: 12px; color: #aaa; margin-top: 10px;">※生徒は「画面全体」の共有が必須です</p>
        </div>
    </div>
</div>

<div id="log">ログ: 準備完了</div>
<canvas id="cap-canvas" class="hidden"></canvas>

<script>
    let peer;
    const logEl = document.getElementById('log');
    const canvas = document.getElementById('cap-canvas');
    const ctx = canvas.getContext('2d');

    function addLog(msg) {
        logEl.innerHTML += ` / ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    // --- 教員側（変更なし） ---
    async function initTeacher() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('my-preview').srcObject = stream;
            document.getElementById('my-preview').classList.remove('hidden');
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('view-title').innerText = "自分の配信画面";
            
            const teacherId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(teacherId);
            peer.on('open', id => {
                document.getElementById('display-id').innerText = id;
                document.getElementById('role-label').innerText = "教員モード";
                document.getElementById('setup-screen').classList.add('hidden');
            });
            peer.on('connection', conn => setupTeacherReceiver(conn));
        } catch (e) { alert("画面共有を許可してください"); }
    }

    function setupTeacherReceiver(conn) {
        const grid = document.getElementById('student-grid');
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${conn.peer}`;
        card.innerHTML = `生徒:${conn.peer}<br><img id="img-${conn.peer}">`;
        grid.appendChild(card);

        conn.on('data', data => {
            if (data.type === 'screen') document.getElementById(`img-${conn.peer}`).src = data.img;
        });

        setInterval(() => {
            if (conn.open) {
                ctx.drawImage(document.getElementById('my-preview'), 0, 0, 800, 450);
                conn.send({ type: 'teacher-screen', img: canvas.toDataURL('image/jpeg', 0.5) });
            }
        }, 300);
        conn.on('close', () => card.remove());
    }

    // --- 生徒側（全画面チェックを追加） ---
    async function initStudent() {
        const teacherId = document.getElementById('input-teacher-id').value;
        if (!teacherId) return alert("教員のIDを入力してください");

        try {
            // displaySurface: 'monitor' を優先するようにリクエスト（ブラウザへのヒント）
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { displaySurface: 'monitor' },
                selfBrowserSurface: 'exclude' // 自分自身のタブを選択肢から外す（無限ループ防止）
            });

            // 選択された画面の種類を確認
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();

            // 'monitor'（画面全体）以外が選ばれた場合は拒否
            if (settings.displaySurface !== 'monitor') {
                track.stop(); // 共有を停止
                alert("【エラー】「ウィンドウ」や「タブ」ではなく、「画面全体」を選択して共有してください。");
                return; 
            }

            document.getElementById('my-preview').srcObject = stream;
            document.getElementById('my-preview').style.width = "150px";
            document.getElementById('my-preview').classList.remove('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('view-title').innerText = "教員の画面";

            peer = new Peer();
            peer.on('open', (myId) => {
                document.getElementById('display-id').innerText = myId;
                document.getElementById('role-label').innerText = "生徒モード";
                const conn = peer.connect(teacherId);
                conn.on('open', () => {
                    document.getElementById('setup-screen').classList.add('hidden');
                    setInterval(() => {
                        if (conn.open) {
                            canvas.width = 400; canvas.height = 225;
                            ctx.drawImage(document.getElementById('my-preview'), 0, 0, canvas.width, canvas.height);
                            conn.send({ type: 'screen', img: canvas.toDataURL('image/jpeg', 0.4) });
                        }
                    }, 500);
                });
                conn.on('data', data => {
                    if (data.type === 'teacher-screen') document.getElementById('main-screen').src = data.img;
                });
            });
        } catch (e) { alert("画面共有がキャンセルされたか、エラーが発生しました。"); }
    }
</script>
</body>
</html>
