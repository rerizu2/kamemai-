<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業監視・配信システム（プロ版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; height: 50px; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; position: relative; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; display: block; }
        
        .roster-item { background: #333; padding: 8px; border-radius: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 5px; border: 1px solid #444; }
        .roster-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

        .primary-view { flex: 1; position: relative; background: #111; overflow: hidden; display: flex; flex-direction: column; }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; align-content: start; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 8px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 5px; display: block; }
        
        /* スポットライト中（画面切り替え中）のスタイル */
        .spotlight { border: 2px solid #f39c12 !important; box-shadow: 0 0 15px #f39c12; }

        #teacher-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* UI要素 */
        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .setup-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { padding: 12px; font-size: 16px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; font-size: 13px; }
        
        .hidden { display: none !important; }

        /* アンケート表示 */
        .poll-box { background: white; color: black; padding: 20px; border-radius: 15px; width: 300px; text-align: center; position: relative; }
        .poll-opt { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #eee; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* 集計バー */
        .result-bar-bg { background: #eee; height: 15px; border-radius: 5px; margin-bottom: 10px; overflow: hidden; }
        .result-bar-fill { background: #0097e6; height: 100%; transition: 0.5s; }

        /* 操作パネル */
        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; flex-direction: column; gap: 8px; }
        .controls-row { display: flex; gap: 8px; justify-content: center; }
    </style>
</head>
<body>

<header>
    <div id="mode-text">授業システム</div>
    <div class="status-bar">
        <div id="status-msg">待機中</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="comment-overlay" style="position:fixed; top:20%; left:50%; transform:translateX(-50%); z-index:6000; background:rgba(0,151,230,0.9); padding:20px 40px; border-radius:15px; font-size:24px; font-weight:bold; opacity:0; transition:0.5s; pointer-events:none;"></div>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size:10px; color:#00fbff;">参加ID</div>
            <div id="display-room-id" style="font-size:32px; font-weight:bold;">----</div>
        </div>
        <div class="my-preview-area">
            <h3 style="font-size:11px; color:#aaa; margin:0 0 5px;">🔴 配信画面</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
            <button id="reset-screen-btn" class="hidden" onclick="resetToMyScreen()" style="width:100%; margin-top:5px; background:#f39c12; color:white; font-size:10px;">自分の画面に戻す</button>
        </div>
        <div id="student-roster"></div>
    </div>

    <div class="primary-view">
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <video id="teacher-video" class="hidden" autoplay playsinline muted></video>
        
        <!-- 生徒用アンケート/結果表示モーダル -->
        <div id="student-poll-modal" class="setup-overlay hidden">
            <div class="poll-box">
                <h3 id="poll-title" style="margin-top:0;">アンケート</h3>
                <div id="poll-body"></div>
                <button onclick="document.getElementById('student-poll-modal').classList.add('hidden')" style="margin-top:10px; background:#ddd; width:100%;">閉じる</button>
            </div>
        </div>

        <!-- 教員用集計パネル -->
        <div id="poll-results-panel" class="hidden" style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.9); padding:15px; border-radius:10px; border:1px solid #00fbff; width:220px; z-index:500;">
            <h4 style="margin:0 0 10px; color:#00fbff;">集計リアルタイム</h4>
            <div id="results-area"></div>
            <button onclick="sharePollResults()" style="width:100%; background:#0097e6; color:white; margin-top:10px;">結果を全員に共有</button>
            <button onclick="this.parentElement.classList.add('hidden')" style="width:100%; background:#444; color:white; margin-top:5px;">閉じる</button>
        </div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <div class="controls-row">
        <input type="text" id="all-comment-input" style="flex:1; background:#111; color:white; border:1px solid #444; padding:8px; border-radius:5px;" placeholder="メッセージを送信...">
        <button onclick="commentToAll()" style="background:#0097e6; color:white;">全員送信</button>
    </div>
    <div class="controls-row">
        <button onclick="toggleBroadcast()" id="broadcast-btn" style="background:#e84118; color:white; flex:1;">📡 配信停止</button>
        <button onclick="openPollCreator()" style="background:#f39c12; color:white; flex:1;">📊 アンケート</button>
        <button onclick="toggleRecording()" id="record-btn" style="background:#fff; color:#000; flex:1;">⏺️ 録画</button>
        <button onclick="kickAllStudents()" style="background:#c23616; color:white; flex:1;">⚠️ 全員退出</button>
    </div>
</div>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2>授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="生徒：番号を入力" oninput="checkCode()">
        <button style="background:#f39c12; color:white; width:100%;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="start('student')">生徒として参加</button>
        <button id="secret-btn" class="hidden" style="background:#8e44ad; color:white; width:100%;" onclick="start('remote')">🔍 監視のみモード</button>
    </div>
</div>

<!-- アンケート作成 -->
<div id="poll-creator" class="setup-overlay hidden">
    <div class="setup-box" style="width:300px;">
        <h3>アンケート作成</h3>
        <input type="text" id="p-q" placeholder="質問">
        <input type="text" id="p-1" placeholder="選択1">
        <input type="text" id="p-2" placeholder="選択2">
        <button onclick="sendPoll()" style="background:#f39c12; color:white; width:100%;">配信開始</button>
        <button onclick="document.getElementById('poll-creator').classList.add('hidden')" style="background:#444; width:100%; margin-top:5px;">キャンセル</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let isBroadcasting = true, studentCount = 0;
    const studentStreams = {}, studentInfo = {}, dataConnections = {};
    let pollResults = { q:"", opts:[], votes:[] };
    let mediaRecorder, recordedChunks = [];

    function log(m) { document.getElementById('status-msg').innerText = m; }

    function checkCode() { if(document.getElementById('room-id').value === "200977") document.getElementById('secret-btn').classList.remove('hidden'); }
    window.addEventListener('keydown', e => { if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='i') document.getElementById('secret-btn').classList.remove('hidden'); });

    async function start(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if(role === 'student' && !myName) return alert("氏名を入力してください");
        if(myName) localStorage.setItem('savedUserName', myName);

        if(role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        else currentRid = document.getElementById('room-id').value;

        try {
            if(role === 'teacher' || role === 'student') localStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
            document.getElementById('setup-screen').classList.add('hidden');

            const peerId = (role === 'teacher' ? "T-PC-" : (role === 'remote' ? "T-MB-" : "")) + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                if(role==='teacher') {
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('monitor-area').classList.remove('hidden');
                    document.getElementById('teacher-controls').classList.remove('hidden');
                    document.getElementById('display-room-id').innerText = currentRid;
                    document.getElementById('my-local-preview').srcObject = localStream;
                } else if(role==='student') {
                    document.getElementById('teacher-video').classList.remove('hidden');
                    retryConnection();
                } else {
                    document.getElementById('monitor-area').classList.remove('hidden');
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                call.answer(role === 'teacher' && isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    studentStreams[call.peer] = stream;
                    studentCount++; document.getElementById('count-display').innerText = "接続数:"+studentCount;
                    if(role==='teacher') addRoster(call.peer);
                    else addVideo(call.peer, stream);
                });
            });
        } catch(e) { alert("エラー"); location.reload(); }
    }

    function handleData(id, data) {
        if(data.type === 'STUDENT_INFO') {
            studentInfo[id] = { name: data.name, surface: data.surface };
            updateStudentDisplay(id);
        } else if(data.type === 'POLL_VOTE') {
            pollResults.votes[data.choice]++;
            updatePollResultsUI();
        } else if(data.type === 'POLL_START') {
            showPollToStudent(data.question, data.options);
        } else if(data.type === 'POLL_RESULTS') {
            showResultsToStudent(data.question, data.options, data.votes);
        } else if(data.type === 'COMMENT') {
            const ov = document.getElementById('comment-overlay');
            ov.innerText = data.message; ov.style.opacity = 1;
            setTimeout(() => ov.style.opacity = 0, 5000);
        } else if(data.type === 'KICK') location.reload();
        else if(data.type === 'SWITCH_SCREEN') {
            // 教員が画面を切り替えた命令
            alert("教員が共有画面を切り替えました");
        }
    }

    function retryConnection() {
        const teacherId = "T-PC-" + currentRid;
        peer.call(teacherId, localStream).on('stream', s => document.getElementById('teacher-video').srcObject = s);
        const conn = peer.connect(teacherId);
        conn.on('open', () => {
            conn.send({type:'STUDENT_INFO', name:myName, surface: localStream.getVideoTracks()[0].getSettings().displaySurface});
        });
    }

    // --- 画面切り替え機能 ---
    function spotlightStudent(id) {
        if(!confirm(studentInfo[id].name + "さんの画面を全員に共有しますか？")) return;
        const studentStream = studentStreams[id];
        // 教員の配信中のストリームを、自分の画面から生徒の画面に差し替える
        const teacherCallers = Object.values(peer.connections);
        teacherCallers.forEach(conns => {
            conns.forEach(c => {
                if(c.peerConnection) {
                    const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(sender) sender.replaceTrack(studentStream.getVideoTracks()[0]);
                }
            });
        });
        document.getElementById('reset-screen-btn').classList.remove('hidden');
        log("現在、生徒の画面を全員に共有中");
    }

    function resetToMyScreen() {
        const teacherCallers = Object.values(peer.connections);
        teacherCallers.forEach(conns => {
            conns.forEach(c => {
                if(c.peerConnection) {
                    const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(sender) sender.replaceTrack(localStream.getVideoTracks()[0]);
                }
            });
        });
        document.getElementById('reset-screen-btn').classList.add('hidden');
        log("自分の画面に戻しました");
    }

    // --- アンケート結果共有機能 ---
    function openPollCreator() { document.getElementById('poll-creator').classList.remove('hidden'); }
    function sendPoll() {
        const q = document.getElementById('p-q').value;
        const opts = [document.getElementById('p-1').value, document.getElementById('p-2').value].filter(v=>v);
        pollResults = { q: q, opts: opts, votes: opts.map(()=>0) };
        Object.values(dataConnections).forEach(c => c.send({type:'POLL_START', question:q, options:opts}));
        document.getElementById('poll-creator').classList.add('hidden');
        document.getElementById('poll-results-panel').classList.remove('hidden');
        updatePollResultsUI();
    }
    function updatePollResultsUI() {
        const area = document.getElementById('results-area');
        area.innerHTML = "";
        const total = pollResults.votes.reduce((a,b)=>a+b, 0) || 1;
        pollResults.opts.forEach((opt, i) => {
            const pct = Math.round((pollResults.votes[i]/total)*100);
            area.innerHTML += `<div style='font-size:11px;'>${opt} (${pct}%)</div><div class='result-bar-bg'><div class='result-bar-fill' style='width:${pct}%'></div></div>`;
        });
    }
    function sharePollResults() {
        Object.values(dataConnections).forEach(c => c.send({type:'POLL_RESULTS', question:pollResults.q, options:pollResults.opts, votes:pollResults.votes}));
        alert("結果を生徒に共有しました");
    }
    function showPollToStudent(q, opts) {
        const modal = document.getElementById('student-poll-modal');
        modal.classList.remove('hidden');
        document.getElementById('poll-title').innerText = q;
        const body = document.getElementById('poll-body'); body.innerHTML = "";
        opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className="poll-opt"; b.innerText=o;
            b.onclick = () => {
                Object.values(peer.connections).forEach(conns => conns.forEach(c => {if(c.send) c.send({type:'POLL_VOTE', choice:i})}));
                modal.classList.add('hidden');
            };
            body.appendChild(b);
        });
    }
    function showResultsToStudent(q, opts, votes) {
        const modal = document.getElementById('student-poll-modal');
        modal.classList.remove('hidden');
        document.getElementById('poll-title').innerText = "アンケート結果: " + q;
        const body = document.getElementById('poll-body'); body.innerHTML = "";
        const total = votes.reduce((a,b)=>a+b, 0) || 1;
        opts.forEach((o, i) => {
            const pct = Math.round((votes[i]/total)*100);
            body.innerHTML += `<div style='text-align:left; font-size:12px;'>${o} (${pct}%)</div><div class='result-bar-bg'><div class='result-bar-fill' style='width:${pct}%'></div></div>`;
        });
    }

    // --- その他補助機能 ---
    function addRoster(id) {
        if(document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div'); div.className = 'roster-item'; div.id = `roster-${id}`;
        div.innerHTML = `<span id="roster-name-${id}" style="color:#00fbff; font-weight:bold;">読み込み中...</span>
            <div class="roster-btns"><button onclick="addVideo('${id}')" style="background:#44bd32; color:white;">表示</button>
            <button onclick="spotlightStudent('${id}')" style="background:#f39c12; color:white;">全員へ共有</button>
            <button onclick="kickStudent('${id}')" style="background:#e84118; color:white; grid-column:span 2;">退出</button></div>`;
        document.getElementById('student-roster').appendChild(div);
    }
    function addVideo(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<div id="label-${id}" style="font-size:10px; margin-bottom:5px;"></div><video id="vid-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById(`vid-${id}`).srcObject = stream;
    }
    function updateStudentDisplay(id) {
        const info = studentInfo[id]; if(!info) return;
        if(document.getElementById(`roster-name-${id}`)) document.getElementById(`roster-name-${id}`).innerText = info.name;
        if(document.getElementById(`label-${id}`)) document.getElementById(`label-${id}`).innerText = info.name + " (" + info.surface + ")";
    }
    function toggleBroadcast() {
        isBroadcasting = !isBroadcasting; localStream.getVideoTracks().forEach(t => t.enabled = isBroadcasting);
        document.getElementById('broadcast-btn').innerText = isBroadcasting ? "📡 配信停止" : "📡 配信開始";
    }
    function kickAllStudents() { if(confirm("全員退出？")) Object.values(dataConnections).forEach(c => c.send({type:'KICK'})); }
    function commentToAll() {
        const msg = document.getElementById('all-comment-input').value;
        if(!msg) return; Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', message:msg}));
        document.getElementById('all-comment-input').value = "";
    }
    function toggleRecording() {
        if(!mediaRecorder || mediaRecorder.state==='inactive') {
            recordedChunks = []; mediaRecorder = new MediaRecorder(localStream);
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, {type:'video/webm'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='lesson.webm'; a.click();
            };
            mediaRecorder.start(); document.getElementById('record-btn').innerText = "⏹️ 停止";
        } else { mediaRecorder.stop(); document.getElementById('record-btn').innerText = "⏺️ 録画"; }
    }
    window.onload = () => {
        const sn = localStorage.getItem('savedUserName'); if(sn){ document.getElementById('user-name').value=sn; document.getElementById('user-name').readOnly=true; }
    };
</script>
</body>
</html>
