<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援・統合型マルチ同期システム v8</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --panel: rgba(26, 26, 26, 0.95); --text: #eee; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* 映像最適化CSS */
        video { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; background: #000; width: 100%; height: 100%; object-fit: contain; opacity: 1; transition: opacity 0.5s; }
        video.recovering { opacity: 0; }

        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 50px; z-index: 1000; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: var(--accent); }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(10px); }
        .room-card { background: linear-gradient(135deg, #222, #333); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        .roster-item { background: var(--glass); padding: 10px; border-radius: 8px; font-size: 11px; border: 1px solid #444; margin-bottom: 5px; }

        /* メッセージログ */
        .chat-panel { width: 280px; background: var(--panel); border-left: 1px solid #333; display: flex; flex-direction: column; }
        .chat-header { background: #222; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 12px; padding: 8px; border-radius: 8px; background: #222; border-left: 3px solid var(--accent); line-height: 1.4; }

        /* ビューエリア */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        .split-container { display: flex; width: 100%; height: 100%; transition: 0.5s; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #222; }
        .view-section { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #222; overflow: hidden; }

        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; margin: 5px; border-radius: 8px; }
        .wb-active #wb-section { display: flex; }
        .wb-hidden-local #wb-section { display: none !important; }
        .wb-tools { background: #f0f0f0; padding: 8px; display: flex; gap: 10px; border-bottom: 1px solid #ddd; color: #000; align-items: center; border-radius: 8px 8px 0 0; }
        .color-opt { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.2); }
        .color-opt.active { transform: scale(1.3); border-color: #000; }
        canvas { background: white; flex: 1; cursor: crosshair; touch-action: none; }

        /* アンケート */
        .poll-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 2000; text-align: center; }
        .poll-btn { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-weight: bold; }
        .poll-bar-bg { background: #eee; border-radius: 5px; height: 14px; margin: 5px 0 10px; overflow: hidden; }
        .poll-bar-fill { background: #0097e6; height: 100%; transition: 0.8s; }

        /* 監視グリッド & バッジ */
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #1a1a1a; border-radius: 10px; padding: 6px; text-align: center; position: relative; border: 1px solid #333; }
        .student-card video { border-radius: 4px; }
        .student-card.is-sharing { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .surface-badge { position: absolute; top: 5px; right: 5px; font-size: 8px; background: rgba(0,0,0,0.7); color: var(--accent); padding: 2px 5px; border-radius: 3px; border: 1px solid var(--accent); z-index: 10; font-weight: bold; }

        /* 配信ステータス */
        #sharing-status-label { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0, 251, 255, 0.9); color: #000; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 500; }
        #recovery-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: var(--accent); }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(0,251,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        #recovery-progress { width: 200px; height: 4px; background: #333; margin-top: 15px; border-radius: 2px; overflow: hidden; }
        #recovery-progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.3s; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 操作UI */
        .controls { background: #111; padding: 10px; border-top: 1px solid #333; display: flex; gap: 10px; justify-content: center; }
        #student-options { position: fixed; bottom: 20px; right: 300px; display: flex; flex-direction: column; gap: 8px; z-index: 1100; }
        .btn-ui { background: rgba(30,30,30,0.95); color: white; border: 1px solid #555; padding: 10px 15px; border-radius: 10px; font-size: 11px; cursor: pointer; backdrop-filter: blur(5px); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal { background: #1a1a1a; padding: 35px; border-radius: 25px; text-align: center; width: 330px; border: 1px solid #333; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 12px; text-align: center; box-sizing: border-box; }
        button.primary { padding: 12px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-label" style="font-weight:bold; color:var(--accent);">Remote Sync v8</div>
    <div class="status-bar">
        <div id="count-text">接続: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#333; color:#ccc; border:none; padding:5px 12px; border-radius:5px; cursor:pointer; font-size:10px;">終了</button>
</header>

<div id="comment-overlay" style="position:fixed; top:20%; left:50%; transform:translateX(-50%); background:rgba(0,151,230,0.9); padding:20px 40px; border-radius:20px; font-size:24px; font-weight:bold; z-index:9999; opacity:0; transition:0.5s; pointer-events:none; text-align:center; max-width:80%; color:white; border:2px solid white;"></div>

<div class="main-layout" id="root-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-card">
            <div style="font-size: 10px; color: var(--accent);">参加ID</div>
            <div id="display-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <button id="reset-teacher-btn" class="btn-ui hidden" onclick="resetToTeacher()" style="background:#f39c12; color:white; border:none;">先生の画面に戻す</button>
        <div class="sidebar-title">📊 アンケート集計</div>
        <div id="poll-summary" style="font-size:10px; background:rgba(0,0,0,0.3); padding:8px; border-radius:5px;">未実施</div>
        <button id="share-poll-btn" class="hidden" onclick="sharePollResults()" style="width:100%; margin-top:5px; background:var(--accent); color:#000; font-size:10px;">結果を共有</button>
        <div class="sidebar-title">👤 生徒リスト</div>
        <div id="roster-list"></div>
    </div>

    <!-- メイン -->
    <div class="primary-view">
        <div id="sharing-status-label">配信中: 準備中</div>

        <div id="recovery-overlay" class="hidden">
            <div class="spinner"></div>
            <div id="recovery-status" style="font-weight:bold;">画質を最適化中...</div>
            <div id="recovery-progress"><div id="recovery-progress-bar"></div></div>
        </div>

        <div class="split-container" id="main-view-split">
            <div class="view-section" id="video-section">
                <video id="main-video-player" autoplay playsinline muted></video>
                
                <!-- 生徒用アンケート -->
                <div id="poll-student-panel" class="poll-overlay hidden">
                    <h3 id="poll-q-text">アンケート</h3>
                    <div id="poll-options"></div>
                    <div id="poll-results-view" class="hidden"></div>
                    <button onclick="document.getElementById('poll-student-panel').classList.add('hidden')" style="width:100%; margin-top:15px; background:#ddd;">閉じる</button>
                </div>
            </div>
            
            <div class="view-section" id="wb-section">
                <div class="wb-tools">
                    <div id="wb-teacher-controls" class="hidden" style="display:flex; gap:10px; align-items:center;">
                        <div class="color-opt active" style="background:black;" onclick="setWbTool('pen','black',this)"></div>
                        <div class="color-opt" style="background:red;" onclick="setWbTool('pen','red',this)"></div>
                        <div class="color-opt" style="background:blue;" onclick="setWbTool('pen','blue',this)"></div>
                        <button onclick="setWbTool('eraser','white',this)" style="font-size:10px;">消ゴム</button>
                        <button onclick="clearWhiteboard()" style="font-size:10px; color:red;">消去</button>
                    </div>
                    <button id="wb-close-teacher" class="hidden" onclick="stopWhiteboard()" style="margin-left:auto; background:#444; color:white; font-size:10px;">終了</button>
                    <span id="wb-student-label" class="hidden" style="margin-left:auto; font-size:11px; color:#666;">（先生がボード使用中）</span>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <div id="monitor-grid" class="monitor-grid hidden"></div>

        <!-- 生徒オプション -->
        <div id="student-options" class="hidden">
            <button class="btn-ui" style="background:#0097e6;" onclick="recoverQuality()">🚀 画質リカバリ</button>
            <button class="btn-ui" onclick="toggleWbLocal()">ボード</button>
            <button class="btn-ui" onclick="toggleChatLocal()">履歴</button>
        </div>
    </div>

    <!-- チャット -->
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">💬 履歴</div>
        <div id="chat-history"></div>
    </div>
</div>

<div id="teacher-fixed-bar" class="controls hidden">
    <input type="text" id="global-msg-input" placeholder="メッセージ..." style="flex:1; max-width:300px; margin:0;">
    <button onclick="sendGlobalComment()" style="background:#0097e6; color:white; border:none; padding:10px 20px; border-radius:8px;">送信</button>
    <button onclick="toggleTeacherMenu()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:8px;">🛠️ ツール</button>
</div>

<!-- 先生メニュー -->
<div id="teacher-menu" class="overlay hidden" onclick="toggleTeacherMenu()">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="primary" style="background:#444; color:white;" onclick="startWhiteboard()">🖊️ ボード配信開始</button>
        <button class="primary" style="background:#2ecc71; color:white;" onclick="openPollCreator()">📊 アンケート作成</button>
        <button class="primary" style="background:#444; color:white;" onclick="changeSource()">🔄 共有画面の変更</button>
        <button class="primary" style="background:#333; color:red;" onclick="kickAll()">⚠️ 全員を退出させる</button>
        <button onclick="toggleTeacherMenu()" style="margin-top:15px; border:none; background:none; color:#666;">閉じる</button>
    </div>
</div>

<!-- アンケート作成 -->
<div id="poll-creator" class="overlay hidden">
    <div class="modal">
        <h3>アンケート作成</h3>
        <input type="text" id="poll-q-input" placeholder="質問">
        <input type="text" id="poll-o1" placeholder="選択肢1" value="はい">
        <input type="text" id="poll-o2" placeholder="選択肢2" value="いいえ">
        <button class="primary" style="background:var(--accent); color:#000;" onclick="broadcastPoll()">アンケートを配信</button>
        <button onclick="document.getElementById('poll-creator').classList.add('hidden')" style="background:none; color:#666; border:none;">キャンセル</button>
    </div>
</div>

<!-- ログイン -->
<div id="setup-screen" class="overlay">
    <div class="modal">
        <h2 style="color:var(--accent); margin-bottom:30px;">Lesson Sync v8</h2>
        <input type="text" id="user-name" placeholder="氏名">
        <input type="number" id="room-id" placeholder="ID（生徒のみ）">
        <button class="primary" style="background:var(--accent); color:#000;" onclick="initSystem('teacher')">先生として開始</button>
        <button class="primary" style="background:#333; color:#fff;" onclick="initSystem('student')">生徒として参加</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "pen";
    let pollData = { q: "", opts: [], votes: [] };
    let currentSpotlightId = null;

    // 安定かつ高品質な1080p設定
    const QUALITY_CONFIG = { video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: true };

    async function initSystem(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を入力");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia(QUALITY_CONFIG);
            const track = localStream.getVideoTracks()[0];
            if (track) track.contentHint = 'detail'; // 文字をくっきりさせる

            document.getElementById('setup-screen').classList.add('hidden');
            wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
            
            const video = document.getElementById('main-video-player');
            if (role === 'teacher') {
                video.srcObject = localStream;
                video.play();
                document.getElementById('root-layout').classList.add('teacher-mode');
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('monitor-grid').classList.remove('hidden');
                document.getElementById('teacher-fixed-bar').classList.remove('hidden');
                document.getElementById('wb-teacher-controls').classList.remove('hidden');
                document.getElementById('display-id').innerText = currentRid;
                document.getElementById('sharing-status-label').innerText = "配信中: 先生の画面";
            } else {
                document.getElementById('student-options').classList.remove('hidden');
                document.getElementById('wb-student-label').classList.remove('hidden');
            }

            peer = new Peer(role === 'teacher' ? "TEACHER-ROOM-" + currentRid : undefined);

            peer.on('open', () => { if (role === 'student') connectToTeacher(); });
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleIncomingData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });
            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                let s = localStream;
                if (myRole === 'teacher' && currentSpotlightId && studentStreams[currentSpotlightId]) s = studentStreams[currentSpotlightId];
                call.answer(s, { sdpTransform: (sdp) => sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:15000\r\n') });
                call.on('stream', st => { if(myRole==='teacher'){ studentStreams[call.peer]=st; updateRosterAndMonitor(call.peer, st); } });
            });
            initWbLogic();
        } catch (e) { location.reload(); }
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        const surf = localStream.getVideoTracks()[0].getSettings().displaySurface || "browser";
        conn.on('open', () => conn.send({ type: 'JOIN', name: myName, surface: surf }));
        conn.on('data', data => handleIncomingData(tId, data));
        
        const call = peer.call(tId, localStream, { sdpTransform: (sdp) => sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:15000\r\n') });
        mediaCalls[tId] = call;
        call.on('stream', s => { const v = document.getElementById('main-video-player'); v.srcObject = s; v.play(); });
    }

    // --- 画質リカバリ (HD監視) ---
    async function recoverQuality() {
        const tId = "TEACHER-ROOM-" + currentRid;
        if (!mediaCalls[tId]) return;
        const v = document.getElementById('main-video-player');
        const ov = document.getElementById('recovery-overlay');
        const pb = document.getElementById('recovery-progress-bar');
        v.classList.add('recovering'); ov.classList.remove('hidden'); pb.style.width = "0%";

        mediaCalls[tId].close();
        const call = peer.call(tId, localStream, { sdpTransform: (sdp) => sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:15000\r\n') });
        mediaCalls[tId] = call;

        call.on('stream', async (s) => {
            v.srcObject = s; v.play();
            let lastB = 0, checks = 0;
            const pc = call.peerConnection;
            const itv = setInterval(async () => {
                const stats = await pc.getStats();
                stats.forEach(r => { if (r.type === 'inbound-rtp' && r.kind === 'video') {
                    const bps = (r.bytesReceived - lastB) * 8; lastB = r.bytesReceived;
                    const prog = Math.min((bps / 4000000) * 100, 95); pb.style.width = prog + "%";
                    if (bps > 3000000 || checks > 10) { 
                        clearInterval(itv); pb.style.width="100%";
                        setTimeout(() => { v.classList.remove('recovering'); ov.classList.add('hidden'); }, 600);
                    }
                }});
                checks++;
            }, 400);
        });
    }

    function spotlight(id) {
        const track = studentStreams[id]?.getVideoTracks()[0];
        if(!track) return;
        currentSpotlightId = id;
        Object.values(mediaCalls).forEach(c => { if(c.peerConnection) c.peerConnection.getSenders().find(s=>s.track.kind==='video').replaceTrack(track); });
        document.getElementById('main-video-player').srcObject = new MediaStream([track]);
        document.getElementById('reset-teacher-btn').classList.remove('hidden');
        const n = studentInfo[id].name;
        document.getElementById('sharing-status-label').innerText = `配信中: ${n} の画面`;
        broadcast({ type: 'STATUS', sharing: n });
    }

    function resetToTeacher() {
        const track = localStream.getVideoTracks()[0]; currentSpotlightId = null;
        Object.values(mediaCalls).forEach(c => { if(c.peerConnection) c.peerConnection.getSenders().find(s=>s.track.kind==='video').replaceTrack(track); });
        document.getElementById('main-video-player').srcObject = localStream;
        document.getElementById('reset-teacher-btn').classList.add('hidden');
        document.getElementById('sharing-status-label').innerText = "配信中: 先生の画面";
        broadcast({ type: 'STATUS', sharing: "先生" });
    }

    function handleIncomingData(id, data) {
        if (data.type === 'JOIN') { studentInfo[id] = { name: data.name, surface: data.surface }; updateStatus(); }
        else if (data.type === 'STATUS') { document.getElementById('sharing-status-label').innerText = `配信中: ${data.sharing} の画面`; }
        else if (data.type === 'MSG') { addLog(data.from, data.msg); }
        else if (data.type === 'POLL_START') { 
            document.getElementById('poll-student-panel').classList.remove('hidden');
            document.getElementById('poll-q-text').innerText = data.q;
            const area = document.getElementById('poll-options'); area.innerHTML = "";
            data.opts.forEach((opt, idx) => {
                const b = document.createElement('button'); b.className = "poll-btn"; b.innerText = opt;
                b.onclick = () => { dataConnections["TEACHER-ROOM-"+currentRid].send({type:'POLL_VOTE', choice:idx}); area.innerHTML="投票済み"; };
                area.appendChild(b);
            });
        }
        else if (data.type === 'POLL_VOTE') { pollData.votes[data.choice]++; updatePollUI(); }
        else if (data.type === 'WB_START') { document.getElementById('root-layout').classList.add('wb-active'); }
        else if (data.type === 'WB_DRAW') { drawRemote(data); }
        else if (data.type === 'WB_CLEAR') { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); }
        else if (data.type === 'KICK') location.reload();
    }

    // --- ホワイトボードロジック ---
    function initWbLogic() {
        wbCanvas.onpointerdown = e => { if (myRole!=='teacher') return; wbDrawing=true; wbCanvas.setPointerCapture(e.pointerId); const p=getPos(e); startStroke(p.x, p.y, wbColor, 3, wbMode); broadcast({type:'WB_DRAW', x:p.x, y:p.y, color:wbColor, start:true}); };
        wbCanvas.onpointermove = e => { if (!wbDrawing) return; const p=getPos(e); drawLine(p.x, p.y); broadcast({type:'WB_DRAW', x:p.x, y:p.y, start:false}); };
        wbCanvas.onpointerup = () => { wbDrawing=false; wbCtx.beginPath(); };
    }
    function getPos(e) { const r=wbCanvas.getBoundingClientRect(); return { x: (e.clientX-r.left)/r.width, y: (e.clientY-r.top)/r.height }; }
    function startStroke(x, y, color, size, mode) { wbCtx.beginPath(); wbCtx.globalCompositeOperation=(mode==='eraser')?'destination-out':'source-over'; wbCtx.strokeStyle=color; wbCtx.lineWidth=size; wbCtx.lineCap='round'; wbCtx.moveTo(x*wbCanvas.width, y*wbCanvas.height); }
    function drawLine(x, y) { wbCtx.lineTo(x*wbCanvas.width, y*wbCanvas.height); wbCtx.stroke(); }
    function drawRemote(d) { if (d.start) startStroke(d.x, d.y, d.color, 3, d.mode); else drawLine(d.x, d.y); }
    function resizeCanvas() { const r=wbCanvas.getBoundingClientRect(); wbCanvas.width=r.width; wbCanvas.height=r.height; wbCtx.lineCap='round'; }

    // --- アンケート ---
    function openPollCreator() { toggleTeacherMenu(); document.getElementById('poll-creator').classList.remove('hidden'); }
    function broadcastPoll() {
        const q = document.getElementById('poll-q-input').value;
        const opts = [document.getElementById('poll-o1').value, document.getElementById('poll-o2').value].filter(v => v);
        pollData = { q, opts, votes: opts.map(() => 0) };
        broadcast({ type: 'POLL_START', q, opts });
        document.getElementById('poll-creator').classList.add('hidden');
        updatePollUI(); document.getElementById('share-poll-btn').classList.remove('hidden');
    }
    function updatePollUI() {
        const area = document.getElementById('poll-summary'); const total = pollData.votes.reduce((a, b) => a + b, 0);
        area.innerHTML = `Q: ${pollData.q} (${total}名)`;
        pollData.opts.forEach((opt, i) => {
            const pct = total === 0 ? 0 : Math.round((pollData.votes[i] / total) * 100);
            area.innerHTML += `<div style="font-size:9px;">${opt}:${pct}%</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
        });
    }

    // --- UI/管理 ---
    function broadcast(d){ Object.values(dataConnections).forEach(c=>c.send(d)); }
    function addLog(f, m){ const h=document.getElementById('chat-history'); const d=document.createElement('div'); d.className='chat-msg'; d.innerHTML=`<strong>${f}</strong>: ${m}`; h.prepend(d); }
    function sendGlobalComment(){ const i=document.getElementById('global-msg-input'); if(!i.value) return; broadcast({type:'MSG', from:'先生', msg:i.value}); addLog('自分', i.value); i.value=""; }
    function toggleTeacherMenu(){ document.getElementById('teacher-menu').classList.toggle('hidden'); }
    function toggleWbLocal(){ document.getElementById('root-layout').classList.toggle('wb-hidden-local'); resizeCanvas(); }
    function toggleChatLocal(){ document.getElementById('chat-panel').classList.toggle('hidden'); }
    function startWhiteboard(){ toggleTeacherMenu(); document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); broadcast({type:'WB_START'}); }
    function clearWhiteboard(){ wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); broadcast({type:'WB_CLEAR'}); }
    function updateStatus(){ document.getElementById('count-text').innerText = `接続: ${Object.keys(dataConnections).length}`; }

    function updateRosterAndMonitor(id, s) {
        const n = studentInfo[id]?.name || "生徒"; const surf = studentInfo[id]?.surface || "browser";
        if(!document.getElementById(`roster-${id}`)) {
            const d = document.createElement('div'); d.className = 'roster-item'; d.id = `roster-${id}`;
            d.innerHTML = `${n}<br><button onclick="spotlight('${id}')" style="background:var(--accent); color:#000; font-size:10px; border:none; margin-top:5px; padding:2px 5px; cursor:pointer;">共有</button>`;
            document.getElementById('roster-list').appendChild(d);
        }
        if(!document.getElementById(`card-${id}`)) {
            const c = document.createElement('div'); c.className = 'student-card'; c.id = `card-${id}`;
            c.innerHTML = `<div class="surface-badge">${surf}</div><div style="font-size:10px;">${n}</div><video id="vid-${id}" autoplay playsinline muted></video>`;
            document.getElementById('monitor-grid').appendChild(c);
        }
        document.getElementById(`vid-${id}`).srcObject = s; updateStatus();
    }
    function removeStudent(id){ document.getElementById(`roster-${id}`)?.remove(); document.getElementById(`card-${id}`)?.remove(); delete dataConnections[id]; updateStatus(); }
    async function changeSource(){ const s=await navigator.mediaDevices.getDisplayMedia(QUALITY_CONFIG); localStream=s; resetToTeacher(); toggleTeacherMenu(); }
    function kickAll(){ if(confirm("全員退出？")) broadcast({type:'KICK'}); }
    function setWbTool(m, c, el) { wbMode=m; wbColor=c; document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('active')); if(el.classList.contains('color-opt')) el.classList.add('active'); }
</script>
</body>
</html>
