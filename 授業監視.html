<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業支援システム【究極統合版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --monitor-height: 40vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; z-index: 1000; flex-shrink: 0; }
        .status-info { font-size: 11px; color: var(--accent); display: flex; gap: 15px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; }

        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        
        /* 配信画面＋ホワイトボード統合コンテナ */
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        
        /* ホワイトボード：常に手前に配置。通常時はクリック不可 */
        #wb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }

        /* ボード用ツール：キャンバスよりさらに手前 */
        #wb-tools { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.85); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--accent); display: none; gap: 15px; align-items: center; }
        .wb-active #wb-tools { display: flex; }

        .on-air-badge { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; z-index: 100; }

        /* 監視セクション */
        .monitor-section { height: var(--monitor-height); background: #0a0a0a; display: flex; flex-direction: column; border-top: 2px solid #333; flex-shrink: 0; }
        .tab-bar { display: flex; background: #111; padding: 5px 10px; gap: 5px; border-bottom: 1px solid #333; }
        .tab-btn { padding: 6px 12px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 4px; font-size: 10px; }
        .tab-btn.active { background: #333; color: var(--accent); }

        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 8px; position: relative; }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }

        /* 操作バー */
        .controls { background: #111; padding: 10px 20px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-primary { background: #0097e6; color: white; }
        .btn-danger { background: #c23616; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-gray { background: #444; color: white; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        #poll-live-stats { position: absolute; bottom: 20px; left: 20px; width: 220px; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--accent); padding: 12px; border-radius: 12px; z-index: 150; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body id="root-body">

<header>
    <div id="mode-label" style="font-weight: bold; color: var(--accent);">STUDENT SUPPORT</div>
    <div class="header-controls">
        <div id="layout-ctrl" class="hidden" style="display:flex; align-items:center; gap:8px;">
            <input type="range" min="10" max="80" value="40" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')">
        </div>
        <div class="status-info">
            <span id="room-display">ID: ----</span>
            <span id="connect-display">接続: 0</span>
        </div>
        <button class="btn-gray" onclick="location.reload()">終了</button>
    </div>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="panel">
            <div class="panel-title">自分の画面</div>
            <video id="my-local-video" autoplay playsinline muted style="width:100%; border-radius:4px;"></video>
            <button class="btn-gray" style="width:100%; margin-top:8px; font-size:9px;" onclick="changeSource()">ソース変更</button>
        </div>
        <div class="panel">
            <div class="panel-title">監視モニターQR</div>
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px; display:flex; justify-content:center;"></div>
            <div id="qr-url-text" style="font-size:8px; word-break:break-all; margin-top:5px; color:#888;"></div>
        </div>
        <div id="roster-list" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">出席名簿</div>
            <div id="roster-items"></div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container" id="broadcast-container">
            <div class="on-air-badge" id="air-text">配信中: 自分の画面</div>
            <video id="main-broadcast-video" autoplay playsinline muted></video>
            
            <!-- ホワイトボード：配信画面の上に透明に重なる -->
            <canvas id="wb-canvas"></canvas>

            <!-- ボードツール（教員専用設定含む） -->
            <div id="wb-tools">
                <div id="wb-teacher-only" class="hidden" style="display:flex; align-items:center; gap:10px; border-right:1px solid #444; padding-right:10px;">
                    <select id="wb-mode-select" onchange="setWbMode(this.value)" style="font-size:10px;">
                        <option value="teacher">先生のみ</option>
                        <option value="individual">各自練習</option>
                        <option value="all">全員で共有</option>
                    </select>
                    <button class="btn-danger" onclick="clearWb()" style="padding:2px 8px; font-size:10px;">消去</button>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="background:red; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="wbColor='red'"></div>
                    <div style="background:blue; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="wbColor='blue'"></div>
                    <div style="background:white; width:20px; height:20px; border-radius:50%; border:1px solid #666; cursor:pointer;" onclick="wbColor='white'"></div>
                    <div style="background:black; width:20px; height:20px; border-radius:50%; border:1px solid #fff; cursor:pointer;" onclick="wbColor='black'"></div>
                </div>
            </div>

            <div id="poll-live-stats">
                <div id="live-stat-items"></div>
                <button class="btn-success" onclick="sharePollResultToAll()" style="width:100%; margin-top:10px; font-size:10px;">結果を共有</button>
            </div>
        </div>

        <div id="monitor-section" class="monitor-section hidden">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('screen')">生徒画面一覧</button>
                <button class="tab-btn" onclick="switchTab('board')">生徒ボード一覧</button>
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<div id="teacher-controls" class="controls hidden">
    <button id="wb-toggle-btn" class="btn-primary" onclick="toggleWb()">🖊️ ホワイトボード</button>
    <button class="btn-primary" onclick="openPollCreator()">📊 アンケート</button>
    <button id="broadcast-btn" class="btn-danger" onclick="toggleBroadcast()">⏹️ 停止</button>
    <button id="reset-btn" class="btn-danger hidden" onclick="resetSpotlight()">🔄 自分に戻す</button>
    <input type="text" id="comment-input" placeholder="メッセージ..." style="flex:1;">
    <button class="btn-primary" onclick="sendComment()">送信</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent);">授業システム</h2>
        <input type="text" id="user-name" placeholder="名前を入力">
        <input type="number" id="room-id" placeholder="参加ID">
        <button class="btn-primary" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-gray" style="width:100%; height:45px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<div id="poll-student-view" class="overlay hidden">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="st-poll-q" style="margin-top:0;">質問</h3>
        <div id="st-poll-opts"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "red", wbMode = "teacher";

    // --- 起動 ---
    async function start(role) {
        myRole = role; 
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('setup-screen').classList.add('hidden');
            initWb(); // キャンバス初期化
            
            const pId = (role==='teacher'?"T-ROOM-"+currentRid : undefined);
            peer = new Peer(pId);
            peer.on('open', id => {
                if(role === 'teacher') setupTeacherUI();
                else connectToTeacher();
            });
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });
            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', s => { studentStreams[call.peer] = s; addStudentGrid(call.peer, s); });
            });
        } catch(e) { alert("失敗。"); location.reload(); }
    }

    function setupTeacherUI() {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('teacher-controls').classList.remove('hidden');
        document.getElementById('layout-ctrl').classList.remove('hidden');
        document.getElementById('wb-teacher-only').classList.remove('hidden');
        document.getElementById('room-display').innerText = "ID: " + currentRid;
        document.getElementById('my-local-video').srcObject = localStream;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        const monitorUrl = window.location.origin + window.location.pathname + `?room=${currentRid}`;
        new QRCode(document.getElementById("qrcode"), { text: monitorUrl, width: 100, height: 100 });
        document.getElementById('qr-url-text').innerText = monitorUrl;
    }

    function connectToTeacher() {
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        mediaCalls[tid] = call;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({ type: 'INFO', name: document.getElementById('user-name').value || '生徒', group: 1 }));
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => document.getElementById('main-broadcast-video').srcObject = s);
    }

    // --- ホワイトボード描画ロジック ---
    function initWb() {
        wbCanvas = document.getElementById('wb-canvas');
        wbCtx = wbCanvas.getContext('2d');
        resizeCanvas();

        const draw = (e, s) => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            const rect = wbCanvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            
            wbCtx.lineWidth = 4;
            wbCtx.strokeStyle = wbColor;
            wbCtx.lineCap = "round";
            if(s) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
            wbCtx.lineTo(x, y); wbCtx.stroke();
            
            const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, start: s };
            if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
            else dataConnections["T-ROOM-"+currentRid]?.send(d);
        };

        wbCanvas.onmousedown = e => { wbDrawing=true; draw(e, true); };
        wbCanvas.onmousemove = e => { if(wbDrawing) draw(e, false); };
        window.onmouseup = () => wbDrawing=false;
        window.onresize = resizeCanvas;
    }

    function resizeCanvas() {
        wbCanvas.width = wbCanvas.offsetWidth;
        wbCanvas.height = wbCanvas.offsetHeight;
    }

    function toggleWb() {
        const active = document.body.classList.toggle('wb-active');
        document.getElementById('wb-toggle-btn').innerText = active ? "🖊️ ボードを隠す" : "🖊️ ホワイトボード";
        if(myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type: active?'WB_START':'WB_STOP'}));
        setTimeout(resizeCanvas, 50); // 表示切替後にサイズを再計算
    }

    function renderRemoteWb(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        if (myRole === 'teacher' || wbMode === 'all' || (wbMode === 'group' && studentInfo[id]?.group === studentInfo[peer.id]?.group)) {
            wbCtx.strokeStyle = data.color; wbCtx.lineWidth = 4; wbCtx.lineCap = "round";
            if(data.start) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
            wbCtx.lineTo(x, y); wbCtx.stroke();
        }
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d'); mCtx.strokeStyle = data.color; mCtx.lineCap = "round";
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(data.x*mini.width, data.y*mini.height); }
            mCtx.lineTo(data.x*mini.width, data.y*mini.height); mCtx.stroke();
        }
    }

    function handleData(id, data) {
        if (data.type === 'INFO') {
            studentInfo[id] = data; updateRoster();
        } else if (data.type === 'WB_DRAW') {
            renderRemoteWb(id, data);
        } else if (data.type === 'WB_START') {
            document.body.classList.add('wb-active'); resizeCanvas();
        } else if (data.type === 'WB_STOP') {
            document.body.classList.remove('wb-active');
        } else if (data.type === 'WB_MODE') {
            wbMode = data.mode;
        } else if (data.type === 'WB_CLEAR') {
            wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        } else if (data.type === 'POLL_START') {
            showPollToStudent(data.q, data.opts);
        } else if (data.type === 'VOTE') {
            pollData.votes[id] = data.idx; updateLivePollStats();
        }
    }

    function showPollToStudent(q, opts) {
        document.getElementById('poll-student-view').classList.remove('hidden');
        document.getElementById('st-poll-q').innerText = q;
        const cont = document.getElementById('st-poll-opts'); cont.innerHTML = "";
        opts.forEach((o, i) => {
            const b = document.createElement('button'); b.innerText = o; b.style.cssText = "width:100%; margin-bottom:10px; background:#f0f0f0; color:black; padding:12px; border-radius:10px; font-weight:bold;";
            b.onclick = () => { 
                document.getElementById('poll-student-view').classList.add('hidden');
                dataConnections["T-ROOM-"+currentRid]?.send({type:'VOTE', idx:i}); 
            };
            cont.appendChild(b);
        });
    }

    // --- 各種操作 ---
    function setWbMode(m) { wbMode = m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function addStudentGrid(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline muted></video>
            <div style="font-size:10px; margin-top:5px;">${studentInfo[id]?.name || '生徒'}</div>
            <button class="btn-primary" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'student-card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white;"></canvas><div>${studentInfo[id]?.name}</div>`;
        document.getElementById('grid-board').appendChild(wbCard);
        document.getElementById('connect-display').innerText = "接続: " + Object.keys(studentStreams).length;
    }
    async function startSpotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = studentStreams[id];
        document.getElementById('reset-btn').classList.remove('hidden');
        Object.values(mediaCalls).forEach(call => { if (call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if (s) s.replaceTrack(track); } });
    }
    function resetSpotlight() {
        const track = localStream.getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-btn').classList.add('hidden');
        Object.values(mediaCalls).forEach(call => { if (call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if (s) s.replaceTrack(track); } });
    }
    function toggleBroadcast() {
        const stop = !document.getElementById('broadcast-btn').innerText.includes("再開");
        Object.values(dataConnections).forEach(c => c.send({type:'STOP_BROADCAST', stop}));
        document.getElementById('broadcast-btn').innerText = stop ? "▶️ 再開" : "⏹️ 停止";
    }
    function switchTab(t) {
        document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen');
        document.getElementById('grid-board').classList.toggle('hidden', t !== 'board');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(t==='screen'?'画面':'ボード')));
    }
    function updateRoster() {
        const r = document.getElementById('roster-items'); r.innerHTML = "";
        Object.entries(studentInfo).forEach(([id, info]) => {
            r.innerHTML += `<div>● ${info.name}</div>`;
        });
    }
</script>
</body>
</html>
