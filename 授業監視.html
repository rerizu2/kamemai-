<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双方向共有（全画面表示対応版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* ヘッダー（生徒側では接続後に消去可能） */
        header { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; z-index: 10; }
        
        .main-layout { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        /* 教員の画面表示エリア（生徒用） */
        .primary-view { 
            flex: 3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            position: relative;
        }

        /* 教員の画面画像：アスペクト比を維持して最大化 */
        #main-screen { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        /* 右側：監視グリッド（教員用） */
        .monitor-sidebar { width: 300px; background: #1e1e1e; border-left: 2px solid #444; overflow-y: auto; padding: 10px; }
        .student-card { background: #333; margin-bottom: 10px; padding: 5px; border-radius: 5px; font-size: 11px; }
        .student-card img { width: 100%; }

        /* 全画面ボタン */
        .fs-button {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 151, 230, 0.8); color: white;
            padding: 10px 15px; border-radius: 5px; cursor: pointer; border: none;
            z-index: 100; font-size: 14px;
        }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; }
        
        button { padding: 12px 24px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; margin: 10px; }
        .btn-teacher { background: #e84118; color: white; }
        .btn-student { background: #0097e6; color: white; }
        
        #my-preview { position: fixed; bottom: 10px; left: 10px; width: 150px; border: 2px solid #555; z-index: 50; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header id="ui-header">
    <span id="role-label">モードを選択してください</span> | ID: <span id="display-id">----</span>
</header>

<div class="main-layout">
    <div class="primary-view" id="fullscreen-target">
        <h3 id="view-title">画面未接続</h3>
        <img id="main-screen" class="hidden">
        <!-- 生徒用フルスクリーン切り替えボタン -->
        <button id="fs-btn" class="fs-button hidden" onclick="toggleFullScreen()">📺 全画面表示に切り替え</button>
    </div>

    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <h4 style="margin:0 0 10px 0;">生徒の画面</h4>
        <div id="student-grid"></div>
    </div>
</div>

<video id="my-preview" autoplay playsinline muted class="hidden"></video>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2>役割を選択</h2>
        <button class="btn-teacher" onclick="initTeacher()">👨‍🏫 教員として開始</button>
        <hr style="border:0; border-top:1px solid #555; margin:20px 0;">
        <input type="number" id="input-teacher-id" placeholder="教員IDを入力" style="padding:10px; font-size:18px; width:80%;">
        <button class="btn-student" onclick="initStudent()">🎓 生徒として参加</button>
        <p style="font-size:11px; color:#aaa;">※生徒は「画面全体」を共有してください</p>
    </div>
</div>

<canvas id="cap-canvas" class="hidden"></canvas>

<script>
    let peer;
    const canvas = document.getElementById('cap-canvas');
    const ctx = canvas.getContext('2d');

    // --- フルスクリーン制御 ---
    function toggleFullScreen() {
        const target = document.getElementById('fullscreen-target');
        if (!document.fullscreenElement) {
            target.requestFullscreen().catch(err => {
                alert(`エラー: 全画面表示にできません (${err.message})`);
            });
            document.getElementById('fs-btn').innerText = "❌ 全画面を解除";
        } else {
            document.exitFullscreen();
            document.getElementById('fs-btn').innerText = "📺 全画面表示に切り替え";
        }
    }

    // --- 教員側の処理 ---
    async function initTeacher() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('my-preview').srcObject = stream;
            document.getElementById('my-preview').classList.remove('hidden');
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('view-title').innerText = "自分の配信画面（プレビュー）";
            
            const teacherId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(teacherId);
            peer.on('open', id => {
                document.getElementById('display-id').innerText = id;
                document.getElementById('role-label').innerText = "教員モード";
                document.getElementById('setup-screen').classList.add('hidden');
            });
            peer.on('connection', conn => {
                const grid = document.getElementById('student-grid');
                const card = document.createElement('div');
                card.className = 'student-card';
                card.id = `card-${conn.peer}`;
                card.innerHTML = `生徒:${conn.peer}<br><img id="img-${conn.peer}">`;
                grid.appendChild(card);

                conn.on('data', data => {
                    if (data.type === 'screen') document.getElementById(`img-${conn.peer}`).src = data.img;
                });

                setInterval(() => {
                    if (conn.open) {
                        canvas.width = 1280; canvas.height = 720;
                        ctx.drawImage(document.getElementById('my-preview'), 0, 0, canvas.width, canvas.height);
                        conn.send({ type: 'teacher-screen', img: canvas.toDataURL('image/jpeg', 0.6) });
                    }
                }, 200);
                conn.on('close', () => card.remove());
            });
        } catch (e) { alert("画面共有を許可してください"); }
    }

    // --- 生徒側の処理 ---
    async function initStudent() {
        const teacherId = document.getElementById('input-teacher-id').value;
        if (!teacherId) return alert("IDを入力してください");

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { displaySurface: 'monitor' } 
            });

            if (stream.getVideoTracks()[0].getSettings().displaySurface !== 'monitor') {
                stream.getTracks().forEach(t => t.stop());
                return alert("エラー：「画面全体」を選択してください。");
            }

            document.getElementById('my-preview').srcObject = stream;
            document.getElementById('my-preview').classList.remove('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('fs-btn').classList.remove('hidden');
            document.getElementById('view-title').classList.add('hidden');

            peer = new Peer();
            peer.on('open', (myId) => {
                document.getElementById('display-id').innerText = myId;
                document.getElementById('role-label').innerText = "生徒モード";
                const conn = peer.connect(teacherId);
                conn.on('open', () => {
                    document.getElementById('setup-screen').classList.add('hidden');
                    setInterval(() => {
                        if (conn.open) {
                            canvas.width = 400; canvas.height = 225;
                            ctx.drawImage(document.getElementById('my-preview'), 0, 0, canvas.width, canvas.height);
                            conn.send({ type: 'screen', img: canvas.toDataURL('image/jpeg', 0.4) });
                        }
                    }, 500);
                });
                conn.on('data', data => {
                    if (data.type === 'teacher-screen') document.getElementById('main-screen').src = data.img;
                });
            });
        } catch (e) { alert("失敗しました。"); }
    }
</script>
</body>
</html>
