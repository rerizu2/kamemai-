<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援・高画質同期システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #000; --panel: #1a1a1a; --text: #eee; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        header { background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; height: 50px; box-sizing: border-box; z-index: 100; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: var(--accent); }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #444; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .room-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid var(--accent); }
        .roster-item { background: #333; padding: 10px; border-radius: 8px; font-size: 11px; border: 1px solid #444; margin-bottom: 5px; }

        /* 共有ステータス表示 */
        #sharing-status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 12px; color: var(--accent); font-weight: bold; z-index: 500; pointer-events: none; }

        /* 履歴パネル */
        .chat-panel { width: 260px; background: var(--panel); border-left: 1px solid #444; display: flex; flex-direction: column; transition: 0.3s; z-index: 80; }
        .chat-header { background: #333; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #444; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 11px; padding: 8px; border-radius: 6px; background: #262626; border-left: 3px solid var(--accent); line-height: 1.4; word-break: break-all; }

        /* メインビュー */
        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; position: relative; overflow: hidden; }
        .split-container { display: flex; width: 100%; height: 100%; transition: 0.5s; }
        .teacher-mode .split-container { height: 55%; border-bottom: 2px solid #333; }
        
        .view-section { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #222; background: #000; overflow: hidden; }
        video.main-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* ホワイトボード */
        #wb-section { display: none; background: white; flex-direction: column; }
        .wb-active #wb-section { display: flex; }
        .wb-hidden-local #wb-section { display: none !important; }
        .wb-tools { background: #f0f0f0; padding: 8px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; color: #000; align-items: center; }
        .color-opt { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
        .color-opt.active { transform: scale(1.2); border-color: #000; }
        canvas { background: white; flex: 1; cursor: crosshair; touch-action: none; }

        /* アンケートパネル */
        .poll-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 20px; border-radius: 15px; width: 80%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; text-align: center; }
        .poll-btn { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; cursor: pointer; font-weight: bold; }

        /* 集計グラフ */
        .poll-bar-bg { background: #eee; border-radius: 5px; height: 15px; margin: 4px 0 10px; overflow: hidden; }
        .poll-bar-fill { background: #0097e6; height: 100%; transition: 0.5s; width: 0%; }

        /* 監視グリッド */
        .monitor-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 4px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        .sharing-badge { position: absolute; top: 5px; right: 5px; background: var(--accent); color: black; font-size: 8px; padding: 2px 5px; border-radius: 3px; display: none; }
        .is-sharing .sharing-badge { display: block; }

        /* UI */
        .controls { background: #222; padding: 10px; border-top: 1px solid #444; display: flex; gap: 10px; justify-content: center; }
        #student-options { position: fixed; bottom: 20px; right: 280px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .btn-ui { background: rgba(50,50,50,0.9); color: white; border: 1px solid #666; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .btn-improve { background: #0097e6; border-color: var(--accent); font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #444; }
        input { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; margin-bottom: 12px; text-align: center; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-label">準備中</div>
    <div class="status-bar">
        <div id="status-msg">待機中 | 接続: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; font-size:10px;">終了</button>
</header>

<div id="root-layout" class="main-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-card">
            <div style="font-size: 10px; color: var(--accent);">参加ID</div>
            <div id="display-id" style="font-size: 32px; font-weight: bold;">----</div>
        </div>
        <button id="global-reset-btn" class="btn-ui hidden" onclick="resetToTeacher()" style="background:#f39c12;">先生の画面に戻す</button>
        <div id="teacher-poll-area" class="roster-item" style="background:#222; margin-top:10px;">
            <div style="font-weight:bold; color:var(--accent);">📊 アンケート集計</div>
            <div id="poll-live-results" style="font-size:10px; margin-top:5px;">未実施</div>
        </div>
        <div id="roster-list" style="margin-top:10px;"></div>
    </div>

    <!-- メイン映像 -->
    <div class="primary-view">
        <!-- 共有中ラベル -->
        <div id="sharing-status">配信中: 先生の画面</div>

        <div class="split-container" id="main-view-split">
            <div class="view-section" id="video-section">
                <video id="main-video-display" class="main-video" autoplay playsinline muted></video>
                
                <!-- アンケートパネル -->
                <div id="poll-student-panel" class="poll-overlay hidden">
                    <h3 id="poll-q-text">アンケート</h3>
                    <div id="poll-options-area"></div>
                    <div id="poll-result-area" class="hidden"></div>
                    <button onclick="document.getElementById('poll-student-panel').classList.add('hidden')" style="width:100%; margin-top:15px;">閉じる</button>
                </div>
            </div>
            
            <div class="view-section" id="wb-section">
                <div class="wb-tools">
                    <div id="wb-teacher-tools" class="hidden" style="display:flex; gap:8px;">
                        <div class="color-opt active" style="background:black;" onclick="setWbMode('pen','black',this)"></div>
                        <div class="color-opt" style="background:red;" onclick="setWbMode('pen','red',this)"></div>
                        <button onclick="setWbMode('eraser','white',this)" style="font-size:10px;">消しゴム</button>
                        <button onclick="clearWb()" style="font-size:10px; color:red;">全消去</button>
                    </div>
                    <button id="wb-close-teacher" class="hidden" onclick="stopWhiteboard()" style="margin-left:auto; background:#444; color:white; font-size:10px;">終了</button>
                </div>
                <canvas id="wb-canvas"></canvas>
            </div>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>

        <!-- 生徒オプション -->
        <div id="student-options" class="hidden">
            <button class="btn-ui btn-improve" onclick="improveQuality()">🚀 画質改善</button>
            <button class="btn-ui" onclick="toggleWbLocal()">ボード ON/OFF</button>
            <button class="btn-ui" onclick="toggleChatLocal()">履歴 ON/OFF</button>
        </div>
    </div>

    <!-- チャット履歴 -->
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">💬 履歴</div>
        <div id="chat-history"></div>
    </div>
</div>

<!-- 先生コントロール -->
<div id="teacher-controls" class="controls hidden">
    <input type="text" id="msg-input" placeholder="全員に指示...">
    <button onclick="sendToAll()" style="background:#0097e6; color:white;">送信</button>
    <button onclick="toggleMenu()" style="background:#555; color:white;">🛠️ ツール</button>
</div>

<!-- セットアップ -->
<div id="setup-screen" class="overlay">
    <div class="modal">
        <h2 style="color:var(--accent);">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名">
        <input type="number" id="room-id" placeholder="ID（生徒のみ）">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="initSystem('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%;" onclick="initSystem('student')">生徒として参加</button>
    </div>
</div>

<!-- メニュー -->
<div id="teacher-menu" class="overlay hidden" onclick="toggleMenu()">
    <div class="modal" onclick="event.stopPropagation()">
        <button onclick="startWhiteboard()" style="width:100%; margin-bottom:10px;">ボード開始</button>
        <button onclick="openPollCreator()" style="width:100%; margin-bottom:10px; background:#2ecc71; color:white;">アンケート作成</button>
        <button onclick="changeSource()" style="width:100%; margin-bottom:10px;">共有画面の変更</button>
        <button onclick="kickAll()" style="width:100%; color:red;">全員退出</button>
        <button onclick="toggleMenu()" style="width:100%; margin-top:20px; background:#444;">閉じる</button>
    </div>
</div>

<!-- アンケート作成モーダル -->
<div id="poll-creator-modal" class="overlay hidden">
    <div class="modal">
        <h3>アンケート作成</h3>
        <input type="text" id="poll-q-input" placeholder="質問文">
        <input type="text" id="poll-opt-1" placeholder="選択肢1" value="はい">
        <input type="text" id="poll-opt-2" placeholder="選択肢2" value="いいえ">
        <button onclick="broadcastPoll()" style="background:var(--accent); color:black; width:100%;">配信開始</button>
        <button onclick="document.getElementById('poll-creator-modal').classList.add('hidden')" style="width:100%; margin-top:10px; background:#444;">キャンセル</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {};
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "pen";
    let pollData = { q: "", opts: [], votes: [] };

    // 【重要】共有状態の追跡
    let currentSpotlightId = null; // null = 先生, id = 特定の生徒

    const QUALITY_CONFIG = { video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: 30 }, audio: true };

    async function initSystem(role) {
        myRole = role; myName = document.getElementById('user-name').value;
        if (!myName) return alert("氏名を入力");
        currentRid = (role === 'teacher') ? Math.floor(1000 + Math.random() * 9000).toString() : document.getElementById('room-id').value;

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia(QUALITY_CONFIG);
            if (localStream.getVideoTracks()[0]) localStream.getVideoTracks()[0].contentHint = 'detail';
            document.getElementById('setup-screen').classList.add('hidden');
            wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
            
            peer = new Peer(role === 'teacher' ? "TEACHER-ROOM-" + currentRid : undefined);

            peer.on('open', () => {
                document.getElementById('mode-label').innerText = role === 'teacher' ? "先生モード" : "生徒モード";
                if (role === 'teacher') {
                    document.getElementById('root-layout').classList.add('teacher-mode');
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('monitor-area').classList.remove('hidden');
                    document.getElementById('teacher-controls').classList.remove('hidden');
                    document.getElementById('wb-teacher-tools').classList.remove('hidden');
                    document.getElementById('display-id').innerText = currentRid;
                    document.getElementById('main-video-display').srcObject = localStream;
                } else {
                    document.getElementById('student-options').classList.remove('hidden');
                    connectToTeacher();
                }
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
                updateStatus();
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                
                // 【重要】先生側：電話に出るとき、現在のスポットライト映像を送る
                let streamToSend = localStream;
                if (myRole === 'teacher' && currentSpotlightId && studentStreams[currentSpotlightId]) {
                    streamToSend = studentStreams[currentSpotlightId];
                }
                call.answer(streamToSend);

                call.on('stream', s => { 
                    if(myRole === 'teacher') { 
                        studentStreams[call.peer] = s;
                        addRoster(call.peer); addMonitorVideo(call.peer, s); 
                    } 
                });
            });

            initWbLogic();
        } catch (e) { location.reload(); }
    }

    function connectToTeacher() {
        const tId = "TEACHER-ROOM-" + currentRid;
        const conn = peer.connect(tId);
        dataConnections[tId] = conn;
        conn.on('open', () => conn.send({ type: 'JOIN', name: myName }));
        conn.on('data', data => handleData(tId, data));
        
        const call = peer.call(tId, localStream);
        mediaCalls[tId] = call;
        call.on('stream', s => document.getElementById('main-video-display').srcObject = s);
    }

    // --- 画質リカバリ ---
    function improveQuality() {
        const tId = "TEACHER-ROOM-" + currentRid;
        if(mediaCalls[tId]) mediaCalls[tId].close();
        const call = peer.call(tId, localStream, {
            sdpTransform: (sdp) => sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:10000\r\n')
        });
        mediaCalls[tId] = call;
        call.on('stream', s => document.getElementById('main-video-display').srcObject = s);
    }

    // --- 映像共有 (スポットライト) ---
    function spotlight(id) {
        const track = studentStreams[id]?.getVideoTracks()[0];
        if(!track) return;
        currentSpotlightId = id;
        
        // 全員にトラックを配信
        updateBroadcast(track);
        
        // 先生の画面を更新
        document.getElementById('main-video-display').srcObject = new MediaStream([track]);
        document.getElementById('global-reset-btn').classList.remove('hidden');
        
        // 全員に共有者の名前を通知
        const name = studentInfo[id]?.name || "生徒";
        broadcast({ type: 'STATUS_UPDATE', sharing: name, spotlightId: id });
        updateSharingUI(name, id);
    }

    function resetToTeacher() {
        const track = localStream.getVideoTracks()[0];
        currentSpotlightId = null;
        updateBroadcast(track);
        document.getElementById('main-video-display').srcObject = localStream;
        document.getElementById('global-reset-btn').classList.add('hidden');
        broadcast({ type: 'STATUS_UPDATE', sharing: '先生', spotlightId: null });
        updateSharingUI('先生', null);
    }

    function updateBroadcast(track) {
        Object.values(mediaCalls).forEach(call => {
            if (call.peerConnection) {
                const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(track);
            }
        });
    }

    function updateSharingUI(name, id) {
        document.getElementById('sharing-status').innerText = `配信中: ${name} の画面`;
        document.querySelectorAll('.student-card').forEach(c => c.classList.remove('is-sharing'));
        if(id && document.getElementById(`card-${id}`)) {
            document.getElementById(`card-${id}`).classList.add('is-sharing');
        }
    }

    // --- ホワイトボード ---
    function initWbLogic() {
        wbCanvas.onpointerdown = e => { if (myRole!=='teacher') return; wbDrawing=true; wbCanvas.setPointerCapture(e.pointerId); const p=getWbPos(e); startStroke(p.x, p.y, wbColor, 3, wbMode); broadcast({type:'WB_DRAW', x:p.x, y:p.y, color:wbColor, start:true}); };
        wbCanvas.onpointermove = e => { if (!wbDrawing) return; const p=getWbPos(e); drawLine(p.x, p.y); broadcast({type:'WB_DRAW', x:p.x, y:p.y, start:false}); };
        wbCanvas.onpointerup = () => { wbDrawing=false; wbCtx.beginPath(); };
    }
    function getWbPos(e) { const r=wbCanvas.getBoundingClientRect(); return { x: (e.clientX-r.left)/r.width, y: (e.clientY-r.top)/r.height }; }
    function startStroke(x, y, color, size, mode) { wbCtx.beginPath(); wbCtx.globalCompositeOperation=(mode==='eraser')?'destination-out':'source-over'; wbCtx.strokeStyle=color; wbCtx.lineWidth=size; wbCtx.lineCap='round'; wbCtx.moveTo(x*wbCanvas.width, y*wbCanvas.height); }
    function drawLine(x, y) { wbCtx.lineTo(x*wbCanvas.width, y*wbCanvas.height); wbCtx.stroke(); }
    function drawRemote(d) { if (d.start) startStroke(d.x, d.y, d.color, 3, d.mode); else drawLine(d.x, d.y); }
    function resizeCanvas() { const r=wbCanvas.getBoundingClientRect(); wbCanvas.width=r.width; wbCanvas.height=r.height; wbCtx.lineCap='round'; }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); broadcast({type:'WB_CLEAR'}); }

    // --- データ受信 ---
    function handleData(id, data) {
        if (data.type === 'JOIN') { 
            studentInfo[id] = { name: data.name }; 
            updateStudentUI(id);
            // 新規加入者に現在の状態を教えてあげる（先生のみ）
            if(myRole === 'teacher') {
                const sharingName = currentSpotlightId ? studentInfo[currentSpotlightId].name : '先生';
                dataConnections[id].send({ type: 'STATUS_UPDATE', sharing: sharingName, spotlightId: currentSpotlightId });
            }
        }
        else if (data.type === 'MSG') { addLog(data.from, data.msg); }
        else if (data.type === 'STATUS_UPDATE') { updateSharingUI(data.sharing, data.spotlightId); }
        else if (data.type === 'POLL_START') { 
            document.getElementById('poll-student-panel').classList.remove('hidden');
            document.getElementById('poll-result-area').classList.add('hidden');
            document.getElementById('poll-options-area').innerHTML = "";
            document.getElementById('poll-q-text').innerText = data.q;
            data.opts.forEach((opt, idx) => {
                const b = document.createElement('button'); b.className = "poll-btn"; b.innerText = opt;
                b.onclick = () => { dataConnections["TEACHER-ROOM-"+currentRid].send({type:'POLL_VOTE', choice:idx}); document.getElementById('poll-options-area').innerHTML="投票済み"; };
                document.getElementById('poll-options-area').appendChild(b);
            });
        }
        else if (data.type === 'POLL_VOTE') { pollData.votes[data.choice]++; updatePollLiveResults(); }
        else if (data.type === 'POLL_RESULT') {
            document.getElementById('poll-student-panel').classList.remove('hidden');
            const res = document.getElementById('poll-result-area'); res.classList.remove('hidden');
            res.innerHTML = `<h4>結果: ${data.q}</h4>`;
            const total = data.votes.reduce((a, b) => a + b, 0);
            data.opts.forEach((opt, i) => {
                const pct = total === 0 ? 0 : Math.round((data.votes[i] / total) * 100);
                res.innerHTML += `<div style="font-size:10px;">${opt}:${pct}%</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
            });
        }
        else if (data.type === 'WB_START') { document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); }
        else if (data.type === 'WB_STOP') { document.getElementById('root-layout').classList.remove('wb-active'); }
        else if (data.type === 'WB_DRAW') { drawRemote(data); }
        else if (data.type === 'WB_CLEAR') { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); }
        else if (data.type === 'KICK') location.reload();
    }

    // --- その他 ---
    function broadcast(data) { Object.values(dataConnections).forEach(c=>c.send(data)); }
    function updateStatus() { document.getElementById('status-msg').innerText = `稼働中 | 接続: ${Object.keys(dataConnections).length}`; }
    function toggleMenu() { document.getElementById('teacher-menu').classList.toggle('hidden'); }
    function startWhiteboard() { toggleMenu(); document.getElementById('root-layout').classList.add('wb-active'); setTimeout(resizeCanvas, 300); broadcast({type:'WB_START'}); }
    function stopWhiteboard() { document.getElementById('root-layout').classList.remove('wb-active'); broadcast({type:'WB_STOP'}); }
    function addLog(from, msg) { const h=document.getElementById('chat-history'); const d=document.createElement('div'); d.className='chat-msg'; d.innerHTML=`<strong>${from}</strong>: ${msg}`; h.prepend(d); }
    function sendToAll() { const i=document.getElementById('msg-input'); if(!i.value) return; broadcast({type:'MSG', from:'先生', msg:i.value}); addLog('自分', i.value); i.value=""; }
    function addRoster(id) { if(document.getElementById(`roster-${id}`)) return; const d=document.createElement('div'); d.className='roster-item'; d.id=`roster-${id}`; d.innerHTML=`<span id="name-${id}">...</span><br><button onclick="spotlight('${id}')" style="background:#f39c12; color:white; font-size:10px; margin-top:5px;">この生徒を全員に共有</button>`; document.getElementById('roster-list').appendChild(d); }
    function addMonitorVideo(id, s) { if(document.getElementById(`card-${id}`)) return; const c=document.createElement('div'); c.className='student-card'; c.id=`card-${id}`; c.innerHTML=`<div class="sharing-badge">共有中</div><div id="vname-${id}" style="font-size:10px;"></div><video id="vid-${id}" autoplay playsinline muted></video>`; document.getElementById('monitor-area').appendChild(c); document.getElementById(`vid-${id}`).srcObject=s; updateStudentUI(id); }
    function updateStudentUI(id) { const n=studentInfo[id]?.name || "生徒"; if(document.getElementById(`name-${id}`)) document.getElementById(`name-${id}`).innerText=n; if(document.getElementById(`vname-${id}`)) document.getElementById(`vname-${id}`).innerText=n; }
    function removeStudent(id) { if(document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove(); if(document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove(); delete dataConnections[id]; updateStatus(); }
    function toggleWbLocal() { document.getElementById('root-layout').classList.toggle('wb-hidden-local'); }
    function toggleChatLocal() { document.getElementById('chat-panel').classList.toggle('hidden'); }
    function openPollCreator() { toggleMenu(); document.getElementById('poll-creator-modal').classList.remove('hidden'); }
    function broadcastPoll() {
        const q = document.getElementById('poll-q-input').value;
        const opts = [document.getElementById('poll-opt-1').value, document.getElementById('poll-opt-2').value].filter(v => v);
        pollData = { q, opts, votes: opts.map(() => 0) };
        broadcast({ type: 'POLL_START', q, opts });
        document.getElementById('poll-creator-modal').classList.add('hidden');
        updatePollLiveResults();
    }
    function updatePollLiveResults() {
        const area = document.getElementById('poll-live-results');
        const total = pollData.votes.reduce((a, b) => a + b, 0);
        area.innerHTML = `Q: ${pollData.q} (計:${total})`;
        pollData.opts.forEach((opt, i) => {
            const pct = total === 0 ? 0 : Math.round((pollData.votes[i] / total) * 100);
            area.innerHTML += `<div style="font-size:9px;">${opt}:${pct}%</div><div class="poll-bar-bg"><div class="poll-bar-fill" style="width:${pct}%"></div></div>`;
        });
    }
    function sharePollResults() { broadcast({ type: 'POLL_RESULT', q: pollData.q, opts: pollData.opts, votes: pollData.votes }); }
    function kickAll() { if(confirm("全員退出？")) broadcast({type:'KICK'}); }
    async function changeSource() { const s=await navigator.mediaDevices.getDisplayMedia(QUALITY_CONFIG); localStream=s; resetToTeacher(); toggleMenu(); }
    function setWbMode(m, c, el) { wbMode=m; wbColor=c; document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active')); if(el.classList.contains('color-opt')) el.classList.add('active'); }
</script>
</body>
</html>
