<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業支援システム【究極統合版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ヘッダー */
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; z-index: 1000; }
        .status-info { font-size: 12px; color: var(--accent); display: flex; gap: 20px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー */
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .panel { background: #222; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .preview-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; border: 1px solid #444; position: relative; }
        .preview-box video { width: 100%; height: 100%; object-fit: cover; }

        /* メインビュー */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .broadcast-monitor { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #050505; border-bottom: 1px solid #333; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        /* 通知系 */
        .on-air-badge { position: absolute; top: 15px; left: 15px; background: var(--danger); color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 100; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #pause-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #555; }

        /* アンケート左下統計 */
        #poll-live-stats { position: absolute; bottom: 20px; left: 20px; width: 230px; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--accent); padding: 12px; border-radius: 12px; z-index: 150; display: none; }
        .stat-bar-bg { background: #333; height: 8px; border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .stat-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.3s; }

        /* 監視セクション */
        .monitor-section { height: 42%; background: #0a0a0a; display: flex; flex-direction: column; }
        .tab-bar { display: flex; background: #111; padding: 5px 10px; gap: 5px; border-bottom: 1px solid #333; }
        .tab-btn { padding: 6px 15px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .tab-btn.active { background: #333; color: var(--accent); }

        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 15px; overflow-y: auto; }
        .student-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px; position: relative; transition: 0.2s; }
        .student-card:hover { border-color: var(--accent); }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; display: block; }
        .share-badge { position: absolute; top: 15px; right: 15px; background: var(--accent); color: #000; font-size: 8px; padding: 2px 5px; border-radius: 3px; font-weight: bold; }

        /* ホワイトボード */
        #wb-overlay { position: absolute; inset: 0; background: white; z-index: 500; display: none; flex-direction: column; }
        .wb-active #wb-overlay { display: flex; }
        .wb-toolbar { background: #f0f0f0; padding: 10px; display: flex; gap: 15px; align-items: center; color: #333; border-bottom: 1px solid #ccc; }
        #wb-canvas { flex: 1; width: 100%; touch-action: none; cursor: crosshair; }

        /* 操作パネル */
        .controls { background: #111; padding: 10px 20px; border-top: 1px solid #333; display: flex; gap: 12px; align-items: center; }
        button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .btn-primary { background: #0097e6; color: white; }
        .btn-danger { background: #c23616; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-gray { background: #444; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }

        /* モーダル */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        #poll-result-popup { position: fixed; top: 20px; right: 20px; width: 260px; background: white; color: black; padding: 20px; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); z-index: 10000; display: none; }
        #remote-pointer { position: fixed; width: 50px; height: 50px; border: 4px solid red; border-radius: 50%; pointer-events: none; z-index: 10000; display: none; transform: translate(-50%, -50%); animation: ripple 1.2s infinite; }
        @keyframes ripple { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body id="root-body">

<div id="remote-pointer"></div>

<header>
    <div id="mode-label" style="font-weight: bold; letter-spacing: 1px; color: var(--accent);">STUDENT SUPPORT SYSTEM</div>
    <div class="status-info">
        <span id="room-display">ROOM: ----</span>
        <span id="connect-display">CONNECT: 0</span>
    </div>
    <button class="btn-gray" onclick="location.reload()">EXIT</button>
</header>

<div class="main-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar hidden">
        <div class="panel">
            <div class="panel-title">Your Feed (自分の共有画面)</div>
            <div class="preview-box">
                <video id="my-local-video" autoplay playsinline muted></video>
            </div>
            <button class="btn-gray" style="width:100%; margin-top:10px; font-size:10px;" onclick="changeSource()">共有ソースを変更</button>
        </div>
        <div class="panel">
            <div id="qrcode" style="background:white; padding:8px; border-radius:8px; display:flex; justify-content:center;"></div>
            <div style="text-align:center; font-size:9px; color:#888; margin-top:8px;">監視モニター用QRコード</div>
        </div>
        <div id="roster-list" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">Students & Groups</div>
        </div>
    </div>

    <!-- メインコンテンツエリア -->
    <div class="content-area">
        <div class="broadcast-monitor">
            <div id="air-badge" class="on-air-badge">
                <div class="live-dot"></div>
                <span id="air-text">配信中: 自分の画面</span>
            </div>
            <div id="pause-overlay" class="hidden">配信を一時停止しています</div>
            <video id="main-broadcast-video" autoplay playsinline muted></video>

            <!-- アンケート：教員用リアルタイム統計 -->
            <div id="poll-live-stats">
                <div style="font-size:11px; font-weight:bold; color:var(--accent); margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">📊 投票状況</div>
                <div id="live-stat-items"></div>
                <button class="btn-success" onclick="sharePollResultToAll()" style="width:100%; margin-top:12px; font-size:10px;">結果を全員に共有</button>
            </div>
        </div>

        <!-- ホワイトボード・全画面表示 -->
        <div id="wb-overlay">
            <div class="wb-toolbar">
                <span style="font-weight:bold; color:#000;">🖊️ ホワイトボード</span>
                <select id="wb-mode-select" onchange="setWbMode(this.value)">
                    <option value="teacher">教員のみ</option>
                    <option value="individual">各自練習（一斉監視）</option>
                    <option value="group">班ごとに作業</option>
                    <option value="all">クラス全員で一枚</option>
                </select>
                <div style="display:flex; gap:8px;">
                    <div style="background:black; width:22px; height:22px; border-radius:50%; cursor:pointer; border:1px solid #ccc;" onclick="wbColor='black'"></div>
                    <div style="background:red; width:22px; height:22px; border-radius:50%; cursor:pointer; border:1px solid #ccc;" onclick="wbColor='red'"></div>
                    <div style="background:blue; width:22px; height:22px; border-radius:50%; cursor:pointer; border:1px solid #ccc;" onclick="wbColor='blue'"></div>
                </div>
                <button class="btn-danger" onclick="clearWb()" style="padding:4px 10px;">全消去</button>
                <button class="btn-gray" onclick="toggleWb(false)" style="margin-left:auto;">閉じる</button>
            </div>
            <canvas id="wb-canvas"></canvas>
        </div>

        <!-- 監視グリッドセクション -->
        <div id="monitor-section" class="monitor-section hidden">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('screen')">生徒画面一覧</button>
                <button class="tab-btn" onclick="switchTab('board')">生徒ボード一覧</button>
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<!-- 教員用コントロールバー -->
<div id="teacher-controls" class="controls hidden">
    <button class="btn-primary" onclick="toggleWb(true)">🖊️ ボード共有</button>
    <button class="btn-primary" onclick="openPollCreator()">📊 アンケート</button>
    <button id="broadcast-btn" class="btn-danger" onclick="toggleBroadcast()">⏹️ 配信停止</button>
    <button id="reset-spotlight-btn" class="btn-success hidden" onclick="resetSpotlight()">🔄 自分に戻す</button>
    <input type="text" id="comment-input" placeholder="メッセージを全員に送信..." style="flex:1; background:#333; border:1px solid #444; color:white; padding:8px; border-radius:6px;">
    <button class="btn-primary" onclick="sendComment()">送信</button>
</div>

<!-- 各種モーダル -->
<div id="poll-creator" class="overlay hidden" onclick="this.classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()" style="background:white; color:black;">
        <h3 style="margin-top:0;">アンケート作成</h3>
        <input type="text" id="poll-q" placeholder="質問文を入力" style="background:#f0f0f0; color:black; border:1px solid #ccc;">
        <div id="poll-opts-container">
            <input type="text" class="p-opt-in" placeholder="選択肢1" style="background:#f0f0f0; color:black; border:1px solid #ccc;">
            <input type="text" class="p-opt-in" placeholder="選択肢2" style="background:#f0f0f0; color:black; border:1px solid #ccc;">
        </div>
        <button class="btn-gray" onclick="addPollOpt()" style="font-size:10px;">+ 選択肢を追加</button>
        <button class="btn-primary" onclick="startPoll()" style="width:100%; margin-top:15px; height:40px;">アンケートを開始</button>
    </div>
</div>

<div id="poll-student-view" class="overlay hidden">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="st-poll-q" style="font-size:18px;">質問</h3>
        <div id="st-poll-opts"></div>
    </div>
</div>

<div id="poll-result-popup">
    <div style="font-weight:bold; border-bottom:1px solid #eee; margin-bottom:10px; padding-bottom:8px; font-size:14px;">📊 アンケート結果</div>
    <div id="final-result-content"></div>
    <button class="btn-gray" style="width:100%; margin-top:15px; font-size:11px;" onclick="document.getElementById('poll-result-popup').style.display='none'">閉じる</button>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-top:0;">授業支援システム</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="参加ID (4桁)">
        <button class="btn-primary" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-gray" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('student')">生徒として参加</button>
        <button class="btn-gray" style="width:100%; height:45px;" onclick="start('remote')">監視用モニターとして接続</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "teacher";
    let pollData = { q: "", opts: [], votes: {} };

    // --- 初期化ロジック ---
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('room')) {
            document.getElementById('room-id').value = params.get('room');
            if(params.get('role')) start(params.get('role'));
        }
    };

    async function start(role) {
        myRole = role; 
        myName = document.getElementById('user-name').value || (role==='teacher'?'教員':'モニター');
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("IDを入力してください");

        try {
            if (role !== 'remote') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
            }
            document.getElementById('setup-screen').classList.add('hidden');
            initWb();

            const pId = (role==='teacher'?"T-ROOM-"+currentRid : (role==='remote'?"M-ROOM-"+currentRid+"-"+Date.now():undefined));
            peer = new Peer(pId, { debug: 1 });

            peer.on('open', id => {
                if(role === 'teacher') setupTeacherUI();
                else if(role === 'remote') setupMonitorUI();
                else connectToTeacher();
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => {
                    document.getElementById(`card-${conn.peer}`)?.remove();
                    delete studentStreams[conn.peer];
                    updateConnectCount();
                });
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(role === 'teacher' ? localStream : null);
                call.on('stream', s => {
                    studentStreams[call.peer] = s;
                    addStudentGrid(call.peer, s);
                });
            });
        } catch(e) { alert("画面共有を許可してください。"); location.reload(); }
    }

    function setupTeacherUI() {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('teacher-controls').classList.remove('hidden');
        document.getElementById('room-display').innerText = "ID: " + currentRid;
        document.getElementById('my-local-video').srcObject = localStream;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        const monitorUrl = window.location.origin + window.location.pathname + `?room=${currentRid}&role=remote`;
        new QRCode(document.getElementById("qrcode"), { text: monitorUrl, width: 100, height: 100 });
    }

    function setupMonitorUI() {
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('monitor-section').style.height = "100%";
        document.getElementById('air-badge').classList.add('hidden');
        const conn = peer.connect("T-ROOM-" + currentRid);
        conn.on('open', () => conn.send({ type: 'REGISTER_MONITOR' }));
    }

    function connectToTeacher() {
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        const conn = peer.connect(tid);
        conn.on('open', () => {
            const surface = localStream.getVideoTracks()[0].getSettings().displaySurface || "window";
            conn.send({ type: 'INFO', name: myName, surface: surface, group: 1 });
        });
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => document.getElementById('main-broadcast-video').srcObject = s);
    }

    // --- メイン：スポットライト（生徒画面共有）の修正ロジック ---
    async function startSpotlight(id) {
        const targetStream = studentStreams[id];
        if (!targetStream) return alert("映像を受信できていません。");
        
        const targetVideoTrack = targetStream.getVideoTracks()[0];

        // 1. 先生自身の画面表示を差し替える
        document.getElementById('main-broadcast-video').srcObject = targetStream;
        document.getElementById('air-text').innerText = `配信中: ${studentInfo[id]?.name || '生徒'}の画面`;
        document.getElementById('reset-spotlight-btn').classList.remove('hidden');

        // 2. 全生徒・モニターに送っているストリームのビデオトラックを差し替える (replaceTrack)
        Object.values(mediaCalls).forEach(call => {
            if (call.peerConnection) {
                const senders = call.peerConnection.getSenders();
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                    videoSender.replaceTrack(targetVideoTrack)
                        .catch(err => console.error("Track Replace Error:", err));
                }
            }
        });
    }

    function resetSpotlight() {
        const originalTrack = localStream.getVideoTracks()[0];
        
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('air-text').innerText = "配信中: 自分の画面";
        document.getElementById('reset-spotlight-btn').classList.add('hidden');

        Object.values(mediaCalls).forEach(call => {
            if (call.peerConnection) {
                const senders = call.peerConnection.getSenders();
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                    videoSender.replaceTrack(originalTrack);
                }
            }
        });
    }

    // --- データ処理 ---
    function handleData(id, data) {
        if (data.type === 'INFO') {
            studentInfo[id] = data; updateRoster();
        } else if (data.type === 'WB_DRAW') {
            renderRemoteWb(id, data);
        } else if (data.type === 'WB_START') {
            toggleWb(true, true);
        } else if (data.type === 'WB_STOP') {
            toggleWb(false, true);
        } else if (data.type === 'WB_MODE') {
            wbMode = data.mode;
        } else if (data.type === 'WB_CLEAR') {
            wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        } else if (data.type === 'STOP_BROADCAST') {
            document.getElementById('pause-overlay').classList.toggle('hidden', !data.stop);
        } else if (data.type === 'POLL_START') {
            showPollToStudent(data.q, data.opts);
        } else if (data.type === 'VOTE') {
            pollData.votes[id] = data.idx; updateLivePollStats();
        } else if (data.type === 'POLL_RESULT') {
            showFinalResults(data.q, data.opts, data.results);
        } else if (data.type === 'COMMENT') {
            alert("メッセージ: " + data.msg);
        } else if (data.type === 'REGISTER_MONITOR') {
            Object.values(dataConnections).forEach(c => { if(c.peer.indexOf('ROOM')===-1) c.send({type:'MONITOR_LIST', ids:[id]}); });
        } else if (data.type === 'MONITOR_LIST') {
            data.ids.forEach(mId => { peer.call(mId, localStream); peer.connect(mId); });
        } else if (data.type === 'POINTER') {
            showPointer(data.x, data.y);
        }
    }

    // --- ホワイトボードロジック ---
    function initWb() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        wbCanvas.width = window.innerWidth; wbCanvas.height = window.innerHeight;
        const fn = (e, s) => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            const rect = wbCanvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX), y = (e.clientY || e.touches[0].clientY) - rect.top;
            wbCtx.lineWidth = 3; wbCtx.lineCap = 'round'; wbCtx.strokeStyle = wbColor;
            if(s) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
            wbCtx.lineTo(x, y); wbCtx.stroke();
            const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, start: s };
            if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
            else dataConnections["T-ROOM-"+currentRid]?.send(d);
        };
        wbCanvas.onmousedown = e => { wbDrawing=true; fn(e, true); };
        wbCanvas.onmousemove = e => { if(wbDrawing) fn(e, false); };
        window.onmouseup = () => wbDrawing=false;
    }

    function renderRemoteWb(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        const isMyGroup = studentInfo[id]?.group === studentInfo[peer.id]?.group;
        if (myRole === 'teacher' || wbMode === 'all' || (wbMode === 'group' && isMyGroup)) {
            wbCtx.strokeStyle = data.color;
            if(data.start) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
            wbCtx.lineTo(x, y); wbCtx.stroke();
        }
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d'); mCtx.strokeStyle = data.color;
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(data.x*mini.width, data.y*mini.height); }
            mCtx.lineTo(data.x*mini.width, data.y*mini.height); mCtx.stroke();
        }
        if (myRole === 'teacher') {
            Object.entries(dataConnections).forEach(([tid, c]) => {
                if(tid !== id && (wbMode === 'all' || (wbMode === 'group' && studentInfo[id].group === studentInfo[tid].group))) c.send(data);
            });
        }
    }

    // --- アンケートロジック ---
    function openPollCreator() { document.getElementById('poll-creator').classList.remove('hidden'); }
    function addPollOpt() {
        const i = document.createElement('input'); i.className="p-opt-in"; i.placeholder=`選択肢${document.querySelectorAll('.p-opt-in').length+1}`;
        i.style.color="black"; i.style.background="#f0f0f0";
        document.getElementById('poll-opts-container').appendChild(i);
    }
    function startPoll() {
        const q = document.getElementById('poll-q').value;
        const opts = Array.from(document.querySelectorAll('.p-opt-in')).map(i => i.value).filter(v => v);
        if(!q || opts.length < 2) return alert("質問と2つ以上の選択肢が必要です");
        pollData = { q, opts, votes: {} };
        Object.values(dataConnections).forEach(c => c.send({type:'POLL_START', q, opts}));
        document.getElementById('poll-creator').classList.add('hidden');
        document.getElementById('poll-live-stats').style.display = 'block';
        updateLivePollStats();
    }
    function updateLivePollStats() {
        const container = document.getElementById('live-stat-items');
        container.innerHTML = `<div style="font-size:11px; margin-bottom:5px; opacity:0.8;">Q: ${pollData.q}</div>`;
        const total = Object.keys(pollData.votes).length;
        pollData.opts.forEach((opt, idx) => {
            const count = Object.values(pollData.votes).filter(v => v === idx).length;
            const percent = total === 0 ? 0 : (count / total) * 100;
            container.innerHTML += `
                <div style="font-size:10px; display:flex; justify-content:space-between; margin-top:5px;">
                    <span>${opt}</span><span>${count}票</span>
                </div>
                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${percent}%"></div></div>
            `;
        });
    }
    function sharePollResultToAll() {
        const results = pollData.opts.map((_, i) => Object.values(pollData.votes).filter(v => v === i).length);
        Object.values(dataConnections).forEach(c => c.send({type:'POLL_RESULT', q: pollData.q, opts: pollData.opts, results}));
        showFinalResults(pollData.q, pollData.opts, results);
        document.getElementById('poll-live-stats').style.display = 'none';
    }
    function showFinalResults(q, opts, results) {
        const popup = document.getElementById('poll-result-popup');
        const content = document.getElementById('final-result-content');
        popup.style.display = 'block';
        content.innerHTML = `<div style="font-size:13px; font-weight:bold; margin-bottom:8px;">${q}</div>`;
        const total = results.reduce((a, b) => a + b, 0) || 1;
        opts.forEach((opt, i) => {
            const percent = (results[i] / total) * 100;
            content.innerHTML += `
                <div style="font-size:11px; margin-top:5px; display:flex; justify-content:space-between;">
                    <span>${opt}</span><span>${results[i]}票 (${Math.round(percent)}%)</span>
                </div>
                <div style="background:#eee; height:8px; border-radius:4px; margin-top:2px; overflow:hidden;">
                    <div style="background:#27ae60; height:100%; width:${percent}%"></div>
                </div>
            `;
        });
    }
    function showPollToStudent(q, opts) {
        document.getElementById('poll-student-view').classList.remove('hidden');
        document.getElementById('st-poll-q').innerText = q;
        const cont = document.getElementById('st-poll-opts'); cont.innerHTML = "";
        opts.forEach((o, i) => {
            const b = document.createElement('button'); b.innerText = o; b.className = "btn-gray"; b.style.width="100%"; b.style.marginBottom="5px"; b.style.color="black"; b.style.background="#f0f0f0";
            b.onclick = () => { dataConnections["T-ROOM-"+currentRid].send({type:'VOTE', idx:i}); document.getElementById('poll-student-view').classList.add('hidden'); };
            cont.appendChild(b);
        });
    }

    // --- 各種操作 ---
    function addStudentGrid(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.onclick = (e) => {
            if(myRole !== 'teacher' || e.target.tagName === 'BUTTON') return;
            const rect = e.target.getBoundingClientRect();
            const nx = (e.clientX - rect.left) / rect.width, ny = (e.clientY - rect.top) / rect.height;
            dataConnections[id]?.send({ type: 'POINTER', x: nx, y: ny });
        };
        card.innerHTML = `<div class="share-badge" id="surface-${id}">${studentInfo[id]?.surface || '...'}</div><video id="v-${id}" autoplay playsinline muted></video>
            <div style="font-size:10px; margin-top:5px;" id="name-${id}">${studentInfo[id]?.name || '生徒'}</div>
            <button class="btn-primary" style="width:100%; font-size:9px; margin-top:5px;" onclick="startSpotlight('${id}')">全員に共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;

        const wbCard = document.createElement('div'); wbCard.className = 'student-card';
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="200" height="112" style="background:white;"></canvas><div style="font-size:10px; margin-top:5px;">${studentInfo[id]?.name} のボード</div>`;
        document.getElementById('grid-board').appendChild(wbCard);
        updateConnectCount();
    }

    function toggleBroadcast() {
        const stop = !document.getElementById('broadcast-btn').innerText.includes("再開");
        Object.values(dataConnections).forEach(c => c.send({type:'STOP_BROADCAST', stop: stop}));
        document.getElementById('pause-overlay').classList.toggle('hidden', !stop);
        document.getElementById('broadcast-btn').innerText = stop ? "▶️ 再開" : "⏹️ 停止";
        document.getElementById('broadcast-btn').className = stop ? "btn-success" : "btn-danger";
    }

    async function changeSource() {
        const s = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
        localStream = s;
        document.getElementById('my-local-video').srcObject = s;
        resetSpotlight();
    }

    function showPointer(x, y) {
        const p = document.getElementById('remote-pointer');
        p.style.left = (x * window.innerWidth) + "px"; p.style.top = (y * window.innerHeight) + "px";
        p.style.display = "block"; setTimeout(() => p.style.display = "none", 1500);
    }

    function toggleWb(show, remote = false) {
        document.body.classList.toggle('wb-active', show);
        if(myRole === 'teacher' && !remote) Object.values(dataConnections).forEach(c => c.send({type: show?'WB_START':'WB_STOP'}));
    }
    function setWbMode(m) { wbMode=m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function switchTab(t) {
        document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen');
        document.getElementById('grid-board').classList.toggle('hidden', t !== 'board');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(t==='screen'?'画面':'ボード')));
    }
    function updateRoster() {
        const r = document.getElementById('roster-list'); r.innerHTML = '<div class="panel-title">Students & Groups</div>';
        Object.entries(studentInfo).forEach(([id, info]) => {
            const d = document.createElement('div'); d.style.fontSize="11px"; d.style.marginBottom="5px";
            d.innerHTML = `${info.name} (班:<input type="number" value="${info.group}" style="width:30px; background:#000; color:#fff; border:1px solid #444;" onchange="studentInfo['${id}'].group=parseInt(this.value)">)`;
            r.appendChild(d);
            if(document.getElementById(`name-${id}`)) document.getElementById(`name-${id}`).innerText = info.name;
            if(document.getElementById(`surface-${id}`)) document.getElementById(`surface-${id}`).innerText = info.surface;
        });
    }
    function updateConnectCount() {
        document.getElementById('connect-display').innerText = "CONNECT: " + Object.keys(studentStreams).length;
    }
    function sendComment() {
        const m = document.getElementById('comment-input').value;
        if(m) { Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', msg:m})); document.getElementById('comment-input').value=""; }
    }
</script>
</body>
</html>
