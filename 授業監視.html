<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>授業支援システム Pro Ultimate</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #27ae60; --warning: #f39c12; --info: #3498db; --monitor-height: 40vh; 
        }
        body { font-family: 'Segoe UI', Meiryo, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* --- ヘッダー --- */
        header { background: #111; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; z-index: 2000; flex-shrink: 0; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .status-info { font-size: 11px; color: var(--accent); display: flex; gap: 10px; }
        .timer-display { font-family: 'Courier New', Courier, monospace; font-size: 20px; color: var(--warning); background: #000; padding: 2px 10px; border-radius: 5px; border: 1px solid #444; min-width: 60px; text-align: center; }

        /* --- メインレイアウト --- */
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; transition: width 0.3s; }
        .sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border: none; }
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; display: flex; justify-content: space-between; }

        /* --- メインコンテンツ --- */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; min-height: 0; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; pointer-events: none; }
        #wb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; background: transparent; touch-action: none; }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }

        /* --- ホワイトボードツール --- */
        #wb-tools { 
            position: absolute; left: 10px; top: 10px; z-index: 1000; 
            background: rgba(255,255,255,0.95); padding: 8px; border-radius: 12px; 
            display: none; flex-direction: column; gap: 8px; color: #333; box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
        .wb-active #wb-tools { display: flex; }
        .tool-row { display: flex; gap: 5px; justify-content: flex-start; flex-wrap: wrap; }
        .tool-btn { width: 30px; height: 30px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; font-size: 14px; }
        .tool-btn.active { background: var(--info); color: white; border-color: #2980b9; }
        .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }

        /* --- 監視エリア --- */
        .monitor-section { height: var(--monitor-height); background: #0a0a0a; display: flex; flex-direction: column; border-top: 2px solid #333; flex-shrink: 0; }
        .tab-bar { display: flex; background: #111; padding: 5px 10px; border-bottom: 1px solid #333; align-items: center; gap: 10px; }
        .tab-btn { padding: 6px 12px; border: none; background: transparent; color: #888; cursor: pointer; font-size: 10px; font-weight: bold; border-radius: 4px; }
        .tab-btn.active { background: #333; color: var(--accent); }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; padding: 8px; overflow-y: auto; }
        .student-card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 5px; text-align: center; position: relative; transition: 0.2s; }
        .student-card video, .student-card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        .card-name { font-size: 9px; color: #fff; margin-top: 3px; display: block; overflow: hidden; }
        .hand-badge { position: absolute; top: -5px; right: -5px; background: var(--warning); color: black; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: none; line-height: 20px; }
        .student-card.raised .hand-badge { display: block; animation: bounce 0.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- 操作バー --- */
        .bottom-dock { background: #111; padding: 10px 15px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; z-index: 1500; }
        .dock-group { display: flex; gap: 5px; border-right: 1px solid #333; padding-right: 10px; }
        button { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.1s; display: flex; align-items: center; gap: 5px; }
        button:active { transform: scale(0.95); }
        .btn-p { background: #0097e6; color: white; }
        .btn-d { background: var(--danger); color: white; }
        .btn-s { background: var(--success); color: white; }
        .btn-w { background: var(--warning); color: white; }
        .btn-g { background: #444; color: white; }

        /* --- 特殊モード --- */
        #focus-overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .confusion-meter { height: 10px; width: 100px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .confusion-fill { height: 100%; width: 0%; background: var(--danger); transition: 0.5s; }

        /* --- セットアップ --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; box-shadow: 0 0 40px var(--accent); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        #laser-pointer { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%; box-shadow: 0 0 10px red; pointer-events: none; z-index: 200; display: none; margin-left: -6px; margin-top: -6px; }
        #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 10000; display: none; }
        
        .whiteboard-mode #main-broadcast-video { opacity: 0; }
        .whiteboard-mode .broadcast-container { background: #fff !important; }
        .blackboard-mode .broadcast-container { background: #000 !important; }
        .grid-bg { background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body id="root-body">

<div id="toast">通知メッセージ</div>
<div id="laser-pointer"></div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:20px;">SYSTEM Pro Ultimate</h2>
        <input type="text" id="user-name" placeholder="氏名（表示用）">
        <input type="number" id="room-id" placeholder="ルームID (4桁)">
        <input type="password" id="room-pass" placeholder="パスワード（任意）">
        <button class="btn-p" style="width:100%; margin-bottom:10px; height:45px;" onclick="start('teacher')">教員として授業を開始</button>
        <button class="btn-g" style="width:100%; height:45px;" onclick="start('student')">生徒として授業に参加</button>
    </div>
</div>

<div id="focus-overlay">
    <h1 style="font-size:48px; color:var(--accent);">先生を見てください</h1>
    <p style="font-size:20px;">現在、一斉説明モードです。操作は不要です。</p>
    <div style="font-size:60px; margin-top:20px;">👁️‍🗨️</div>
</div>

<header>
    <div class="header-controls">
        <button class="btn-g" onclick="toggleSidebar()" title="サイドバー切替">☰</button>
        <div id="mode-label" style="font-weight: bold; font-size: 14px;">EDU Pro</div>
        <div id="timer-box" class="timer-display">00:00</div>
    </div>
    <div class="header-controls">
        <div class="status-info">
            <span id="room-display">ID: ----</span>
            <span id="connect-display">0 接続</span>
        </div>
        <button class="btn-d" onclick="location.reload()">終了</button>
    </div>
</header>

<div class="main-layout">
    <div id="sidebar" class="sidebar hidden">
        <div class="panel">
            <div class="panel-title">LIVE FEED <span>🔴</span></div>
            <div class="preview-box"><video id="my-local-video" autoplay playsinline muted></video></div>
            <div style="display:flex; gap:5px; margin-top:8px;">
                <button class="btn-g" style="flex:1; font-size:9px;" onclick="changeSource()">ソース変更</button>
                <button class="btn-g" style="flex:1; font-size:9px;" onclick="togglePiP()">PiP</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">CLASS INFO 📱</div>
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px; display:flex; justify-content:center;"></div>
            <div id="qr-url-text" style="font-size:8px; word-break:break-all; margin-top:5px; color:#888; text-align:center;"></div>
        </div>
        <div id="roster-list" class="panel" style="flex:1; overflow-y:auto;">
            <div class="panel-title">出席名簿 <span onclick="exportAttendance()" style="cursor:pointer; color:var(--accent);">Export</span></div>
            <div id="roster-items"></div>
        </div>
        <div class="panel" id="confusion-panel" style="display:none;">
            <div class="panel-title">理解度メーター</div>
            <div class="confusion-meter" style="width:100%;"><div id="confusion-bar" class="confusion-fill"></div></div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container" id="broadcast-container">
            <video id="main-broadcast-video" autoplay playsinline muted></video>
            <canvas id="wb-canvas"></canvas>

            <!-- ホワイトボードツール -->
            <div id="wb-tools">
                <div class="tool-group" id="teacher-wb-ctrl" class="hidden">
                    <select id="wb-mode-select" onchange="setWbMode(this.value)" style="font-size:10px;">
                        <option value="teacher">先生のみ描画</option>
                        <option value="individual">各自で練習</option>
                        <option value="all">全員で一枚</option>
                    </select>
                    <div class="tool-row">
                        <button onclick="setWbBg('transparent')">透</button>
                        <button onclick="setWbBg('white')">白</button>
                        <button onclick="setWbBg('grid')">方</button>
                        <button onclick="setWbBg('black')">黒</button>
                    </div>
                </div>
                <div class="tool-group">
                    <div class="tool-row">
                        <div class="tool-btn active" id="tool-pen" onclick="setWbTool('pen')">🖊️</div>
                        <div class="tool-btn" id="tool-high" onclick="setWbTool('highlighter')">🖍️</div>
                        <div class="tool-btn" id="tool-eraser" onclick="setWbTool('eraser')">🧽</div>
                    </div>
                    <div class="tool-row">
                        <div class="tool-btn" onclick="setWbTool('rect')">⬜</div>
                        <div class="tool-btn" onclick="setWbTool('circle')">⭕</div>
                        <div class="tool-btn" onclick="setWbTool('text')">Ｔ</div>
                    </div>
                </div>
                <div class="tool-group">
                    <div class="tool-row">
                        <div class="color-dot" style="background:black;" onclick="wbColor='black'"></div>
                        <div class="color-dot" style="background:red;" onclick="wbColor='red'"></div>
                        <div class="color-dot" style="background:blue;" onclick="wbColor='blue'"></div>
                        <div class="color-dot" style="background:green;" onclick="wbColor='green'"></div>
                    </div>
                </div>
                <div class="tool-group">
                    <div class="tool-row">
                        <button onclick="undoWb()">↩️</button>
                        <button onclick="clearWb()" style="color:var(--danger)">🗑️</button>
                        <button onclick="saveWb()">💾</button>
                    </div>
                </div>
                <button onclick="toggleWb()" class="btn-g" style="font-size:9px;">ツールを閉じる</button>
            </div>
        </div>

        <!-- 監視セクション -->
        <div id="monitor-section" class="monitor-section hidden">
            <div class="tab-bar">
                <div style="display:flex; gap:5px;">
                    <button class="tab-btn active" onclick="switchTab('screen')">画面一覧</button>
                    <button class="tab-btn" onclick="switchTab('board')">ボード一覧</button>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:9px;">サイズ</span>
                    <input type="range" min="10" max="85" value="40" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')" style="width:60px;">
                </div>
            </div>
            <div id="grid-screen" class="grid-container"></div>
            <div id="grid-board" class="grid-container hidden"></div>
        </div>
    </div>
</div>

<div id="teacher-controls" class="bottom-dock hidden">
    <div class="dock-group">
        <button class="btn-p" onclick="toggleWb()">🖊️ ボード</button>
        <button class="btn-p" onclick="openQuickPoll()">📊 投票</button>
    </div>
    <div class="dock-group">
        <button id="focus-btn" class="btn-w" onclick="toggleFocusMode()">🔒 注目</button>
        <button class="btn-w" onclick="pickRandom()">🎲 指名</button>
        <button class="btn-w" onclick="manageTimer()">⏱️ ﾀｲﾏｰ</button>
    </div>
    <div class="dock-group" style="border:none;">
        <button id="broadcast-btn" class="btn-d" onclick="toggleBroadcast()">⏹️ 停止</button>
        <button id="reset-btn" class="btn-s hidden" onclick="resetSpotlight()">🔄 配信復帰</button>
    </div>
    <input type="text" id="comment-input" placeholder="メッセージ（Enterで全体、Shift+Enterでログ）">
    <button class="btn-p" onclick="sendComment()">送信</button>
</div>

<div id="student-controls" class="bottom-dock hidden">
    <button id="hand-btn" class="btn-w" onclick="toggleHand()">✋ 挙手</button>
    <button class="btn-d" onclick="toggleConfusion()" id="confuse-btn">❓ わかりません</button>
    <div style="flex:1;"></div>
    <button class="btn-g" onclick="openNotepad()">📝 ﾒﾓ</button>
    <div id="ping-display" style="font-size:9px; color:#666;">Ping: --ms</div>
</div>

<!-- ポップアップ類 -->
<div id="poll-popup" class="overlay hidden">
    <div class="modal-box" style="background:white; color:black;">
        <h3 id="poll-q">質問</h3>
        <div id="poll-opts" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<div id="notepad-modal" class="overlay hidden" onclick="this.classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()" style="width:80%; max-width:600px;">
        <h3 style="margin-top:0;">個人ノート</h3>
        <textarea id="notepad-area" style="width:100%; height:300px; background:#111; color:white; border:1px solid #444; border-radius:10px; padding:10px;"></textarea>
        <button class="btn-s" style="margin-top:10px; width:100%;" onclick="saveNotepad()">保存して閉じる</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "black", wbMode = "teacher", wbTool = "pen";
    let wbHistory = [], isFocusMode = false, handRaised = false, timerInterval, isConfused = false;

    // --- システム起動 ---
    async function start(role) {
        myRole = role; 
        myName = document.getElementById('user-name').value || (role==='teacher'?'先生':'生徒');
        currentRid = document.getElementById('room-id').value;
        if (!currentRid && role === 'teacher') currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("ルームIDを入力してください");

        try {
            // 画面キャプチャの取得（PointerEvents Cursorオプション付）
            localStream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { cursor: "always" }, 
                audio: true 
            });
            document.getElementById('setup-screen').style.display = 'none';
            initWb();

            const pId = (role==='teacher' ? "T-ROOM-" + currentRid : undefined);
            peer = new Peer(pId);

            peer.on('open', id => {
                if(role === 'teacher') setupTeacherUI();
                else connectToTeacher();
            });

            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(localStream);
                call.on('stream', s => { 
                    studentStreams[call.peer] = s; 
                    addStudentGrid(call.peer, s); 
                });
            });

            // 離脱検知
            document.addEventListener('visibilitychange', () => {
                if (myRole === 'student') {
                    const status = document.visibilityState === 'visible' ? 'Active' : 'Away';
                    dataConnections["T-ROOM-" + currentRid]?.send({ type: 'STATUS', status });
                }
            });

        } catch(e) { 
            alert("画面共有が許可されませんでした。リロードして再試行してください。"); 
            location.reload(); 
        }
    }

    // --- 教員用UI初期化 ---
    function setupTeacherUI() {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('teacher-controls').classList.remove('hidden');
        document.getElementById('teacher-wb-ctrl').classList.remove('hidden');
        document.getElementById('confusion-panel').style.display = 'block';
        document.getElementById('room-display').innerText = "ID: " + currentRid;
        document.getElementById('my-local-video').srcObject = localStream;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        
        const url = window.location.origin + window.location.pathname + `?room=${currentRid}`;
        new QRCode(document.getElementById("qrcode"), { text: url, width: 100, height: 100 });
        document.getElementById('qr-url-text').innerText = url;

        // ポインター同期送信
        window.addEventListener('pointermove', e => {
            if(!wbDrawing && myRole === 'teacher') {
                const rect = document.getElementById('broadcast-container').getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width, y = (e.clientY - rect.top) / rect.height;
                Object.values(dataConnections).forEach(c => c.send({type:'LASER', x, y}));
            }
        });
    }

    // --- 生徒用接続 ---
    function connectToTeacher() {
        document.getElementById('student-controls').classList.remove('hidden');
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        mediaCalls[tid] = call;
        const conn = peer.connect(tid);
        conn.on('open', () => {
            conn.send({ type: 'INFO', name: myName, group: 1 });
            showToast("接続しました");
        });
        conn.on('data', data => handleData(tid, data));
        call.on('stream', s => { document.getElementById('main-broadcast-video').srcObject = s; });
    }

    // --- データ受信処理（全機能の脳） ---
    function handleData(id, data) {
        switch(data.type) {
            case 'INFO': 
                studentInfo[id] = { ...data, confused: false, status: 'Active' }; 
                updateRoster(); 
                break;
            case 'WB_DRAW': renderRemoteWb(id, data); break;
            case 'WB_START': document.body.classList.add('wb-active'); resizeCanvas(); break;
            case 'WB_STOP': document.body.classList.remove('wb-active'); break;
            case 'WB_MODE': wbMode = data.mode; break;
            case 'WB_CLEAR': wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); break;
            case 'WB_BG': setWbBg(data.bg, true); break;
            case 'FOCUS': document.getElementById('focus-overlay').style.display = data.active ? 'flex' : 'none'; break;
            case 'TIMER': document.getElementById('timer-box').innerText = data.time; break;
            case 'LASER': 
                const lp = document.getElementById('laser-pointer');
                lp.style.display = 'block'; lp.style.left = (data.x * 100)+'%'; lp.style.top = (data.y * 100)+'%';
                break;
            case 'HAND': 
                studentInfo[id].hand = data.active; 
                document.getElementById(`card-${id}`)?.classList.toggle('raised', data.active);
                if(data.active) { showToast(studentInfo[id].name + "さんが挙手しました"); new Audio('https://actions.google.com/sounds/v1/notifications/beep.ogg').play(); }
                break;
            case 'CONFUSE': 
                studentInfo[id].confused = data.active; 
                updateConfusionMeter(); 
                break;
            case 'STATUS':
                studentInfo[id].status = data.status;
                updateRoster();
                break;
            case 'POLL_START': showPoll(data.q, data.opts); break;
            case 'COMMENT': alert("【先生より】\n" + data.msg); break;
            case 'KICK': alert("セッションが終了しました。"); location.reload(); break;
            case 'REACTION': showEmoji(data.emoji); break;
        }
    }

    // --- ホワイトボード（本格・タッチペン完全対応） ---
    function initWb() {
        wbCanvas = document.getElementById('wb-canvas');
        wbCtx = wbCanvas.getContext('2d');
        resizeCanvas();

        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (wbCanvas.width / rect.width),
                y: (e.clientY - rect.top) * (wbCanvas.height / rect.height)
            };
        };

        // PointerEventsによりペン圧やタッチをサポート
        wbCanvas.addEventListener('pointerdown', e => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true;
            const pos = getPos(e);
            applyStroke(wbTool, wbColor, pos.x, pos.y, true);
            sendDrawData(pos.x, pos.y, true);
        });

        wbCanvas.addEventListener('pointermove', e => {
            if (!wbDrawing) return;
            const pos = getPos(e);
            applyStroke(wbTool, wbColor, pos.x, pos.y, false);
            sendDrawData(pos.x, pos.y, false);
        });

        window.addEventListener('pointerup', () => {
            if(wbDrawing) saveHistory();
            wbDrawing = false;
        });

        window.onresize = resizeCanvas;
    }

    function applyStroke(tool, color, x, y, start) {
        wbCtx.lineCap = "round";
        wbCtx.lineJoin = "round";
        if(tool === 'highlighter') {
            wbCtx.globalCompositeOperation = 'source-over';
            wbCtx.globalAlpha = 0.4; wbCtx.lineWidth = 25;
        } else if(tool === 'eraser') {
            wbCtx.globalCompositeOperation = 'destination-out';
            wbCtx.lineWidth = 40;
        } else {
            wbCtx.globalCompositeOperation = 'source-over';
            wbCtx.globalAlpha = 1.0; wbCtx.lineWidth = 3;
        }
        wbCtx.strokeStyle = color;
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x,y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function sendDrawData(x, y, start) {
        const d = { type:'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color:wbColor, tool:wbTool, start };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function renderRemoteWb(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        if (id.startsWith('T-ROOM') || myRole === 'teacher' || wbMode === 'all') applyStroke(data.tool, data.color, x, y, data.start);
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d');
            mCtx.strokeStyle = data.color; mCtx.lineWidth = 2;
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); }
            mCtx.lineTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); mCtx.stroke();
        }
        if (myRole === 'teacher' && wbMode === 'all') Object.entries(dataConnections).forEach(([tid, c]) => { if(tid !== id) c.send(data); });
    }

    // --- 便利ツール ---
    function pickRandom() {
        const ids = Object.keys(studentInfo);
        if(!ids.length) return;
        const winner = studentInfo[ids[Math.floor(Math.random()*ids.length)]].name;
        showToast("指名: " + winner + " さん");
        alert("指名： " + winner);
    }

    function manageTimer() {
        const sec = prompt("タイマー秒数?", "60");
        if(!sec) return;
        let t = parseInt(sec);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            t--;
            const d = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0');
            document.getElementById('timer-box').innerText = d;
            Object.values(dataConnections).forEach(c => c.send({type:'TIMER', time: d}));
            if(t <= 0) { clearInterval(timerInterval); showToast("時間終了！"); }
        }, 1000);
    }

    function toggleFocusMode() {
        isFocusMode = !isFocusMode;
        document.getElementById('focus-btn').innerText = isFocusMode ? "🔓 解除" : "🔒 注目";
        Object.values(dataConnections).forEach(c => c.send({type:'FOCUS', active: isFocusMode}));
    }

    function toggleHand() {
        handRaised = !handRaised;
        document.getElementById('hand-btn').innerText = handRaised ? "✋ 下ろす" : "✋ 挙手";
        dataConnections["T-ROOM-"+currentRid]?.send({type:'HAND', active: handRaised});
    }

    function toggleConfusion() {
        isConfused = !isConfused;
        document.getElementById('confuse-btn').classList.toggle('btn-warning');
        dataConnections["T-ROOM-"+currentRid]?.send({type:'CONFUSE', active: isConfused});
    }

    function updateConfusionMeter() {
        const students = Object.values(studentInfo);
        const count = students.filter(s => s.confused).length;
        const p = students.length ? (count / students.length) * 100 : 0;
        document.getElementById('confusion-bar').style.width = p + '%';
    }

    function openQuickPoll() {
        const q = prompt("設問を入力してください");
        if(!q) return;
        const opts = ["はい", "いいえ", "わからない"];
        Object.values(dataConnections).forEach(c => c.send({type:'POLL_START', q, opts}));
    }

    function showPoll(q, opts) {
        document.getElementById('poll-popup').classList.remove('hidden');
        document.getElementById('poll-q').innerText = q;
        const container = document.getElementById('poll-opts');
        container.innerHTML = "";
        opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.innerText = o; b.className = "btn-p"; b.style.height="40px";
            b.onclick = () => {
                dataConnections["T-ROOM-"+currentRid].send({type:'VOTE', idx:i});
                document.getElementById('poll-popup').classList.add('hidden');
            };
            container.appendChild(b);
        });
    }

    // --- UI制御 ---
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function toggleWb() {
        const active = document.body.classList.toggle('wb-active');
        if(myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type: active?'WB_START':'WB_STOP'}));
        setTimeout(resizeCanvas, 50);
    }
    function setWbMode(m) { wbMode = m; Object.values(dataConnections).forEach(c => c.send({type:'WB_MODE', mode:m})); }
    function setWbTool(t) { wbTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); document.getElementById('tool-'+t.substring(0,4))?.classList.add('active'); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c => c.send({type:'WB_CLEAR'})); }
    function setWbBg(bg, remote = false) { 
        const c = document.getElementById('broadcast-container');
        c.classList.remove('whiteboard-mode', 'blackboard-mode', 'grid-bg');
        if(bg !== 'transparent') c.classList.add(bg + '-mode');
        if(bg === 'grid') c.classList.add('whiteboard-mode', 'grid-bg');
        if(!remote && myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send({type:'WB_BG', bg}));
    }
    function resizeCanvas() { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; }
    function saveHistory() { if (wbHistory.length > 20) wbHistory.shift(); wbHistory.push(wbCtx.getImageData(0, 0, wbCanvas.width, wbCanvas.height)); }
    function undoWb() { wbHistory.pop(); const last = wbHistory[wbHistory.length - 1]; if (last) wbCtx.putImageData(last, 0, 0); else wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height); }
    
    function addStudentGrid(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const name = studentInfo[id]?.name || '生徒';
        const card = document.createElement('div'); card.className = 'student-card'; card.id = `card-${id}`;
        card.innerHTML = `<div class="hand-badge">✋</div><video id="v-${id}" autoplay playsinline muted></video><span class="card-name">${name}</span>
            <button class="btn-p" style="width:100%;margin-top:4px;font-size:9px;" onclick="startSpotlight('${id}')">共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        
        const wbCard = document.createElement('div'); wbCard.className = 'student-card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:white;border-radius:4px;"></canvas><span class="card-name">${name}</span>`;
        document.getElementById('grid-board').appendChild(wbCard);
        updateConnectCount();
    }

    async function startSpotlight(id) {
        const track = studentStreams[id].getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = studentStreams[id];
        document.getElementById('reset-btn').classList.remove('hidden');
        document.getElementById('air-text').innerText = `配信中: ${studentInfo[id].name} の画面`;
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }

    function resetSpotlight() {
        const track = localStream.getVideoTracks()[0];
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-btn').classList.add('hidden');
        document.getElementById('air-text').innerText = "配信中: 自分の画面";
        Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } });
    }

    function toggleBroadcast() {
        const stop = !document.getElementById('broadcast-btn').innerText.includes("再開");
        Object.values(dataConnections).forEach(c => c.send({type:'STOP_BROADCAST', stop}));
        document.getElementById('broadcast-btn').innerText = stop ? "▶️ 再開" : "⏹️ 停止";
    }

    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    function switchTab(t) { document.getElementById('grid-screen').classList.toggle('hidden', t !== 'screen'); document.getElementById('grid-board').classList.toggle('hidden', t !== 'board'); document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(t==='画面'?'画面':'ボード'))); }
    function updateRoster() {
        const r = document.getElementById('roster-items'); r.innerHTML = "";
        Object.entries(studentInfo).forEach(([id, info]) => {
            const color = info.status === 'Active' ? 'var(--success)' : 'var(--danger)';
            r.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:11px;">
                <span><span style="color:${color}">●</span> ${info.name}</span>
                <button onclick="dataConnections['${id}'].send({type:'KICK'})" style="background:none; color:var(--danger); padding:0;">×</button>
            </div>`;
        });
    }
    function updateConnectCount() { document.getElementById('connect-display').innerText = Object.keys(studentStreams).length + " 接続"; }
    function sendComment() { const m = document.getElementById('comment-input').value; if(m) { Object.values(dataConnections).forEach(c => c.send({type:'COMMENT', msg:m})); document.getElementById('comment-input').value=""; showToast("送信しました"); } }
    async function changeSource() { localStream = await navigator.mediaDevices.getDisplayMedia({video:true}); document.getElementById('my-local-video').srcObject = localStream; resetSpotlight(); }
    function saveWb() { const link = document.createElement('a'); link.download = 'whiteboard.png'; link.href = wbCanvas.toDataURL(); link.click(); }
    function openNotepad() { document.getElementById('notepad-modal').classList.remove('hidden'); }
    function saveNotepad() { const text = document.getElementById('notepad-area').value; localStorage.setItem('student_note', text); document.getElementById('notepad-modal').classList.add('hidden'); showToast("保存しました"); }
    async function togglePiP() { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await document.getElementById('my-local-video').requestPictureInPicture(); }

</script>
</body>
