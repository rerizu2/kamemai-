<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-OS Pro Infinity</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: rgba(25, 25, 25, 0.85); 
            --danger: #ff4757; --success: #2ecc71; --warning: #f1c40f; 
            --purple: #a55eea; --monitor-height: 35vh; 
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); color: #fff; margin: 0; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
            touch-action: none;
        }

        /* --- ヘッダー --- */
        header { 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 0 25px; display: flex; justify-content: space-between; 
            align-items: center; height: 60px; border-bottom: 1px solid #333; z-index: 5000;
        }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-stats { display: flex; align-items: center; gap: 20px; font-size: 12px; color: #aaa; }
        .timer-badge { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--warning); background: #1a1a1a; padding: 4px 15px; border-radius: 8px; border: 1px solid #333; }

        /* --- メイン構成 --- */
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* サイドバー */
        .sidebar { 
            width: 300px; background: #0d0d0d; border-right: 1px solid #222; 
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0;
        }
        .sidebar.collapsed { width: 0; padding: 0; border: none; opacity: 0; pointer-events: none; }

        /* コンテンツエリア */
        .stage { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        /* 配信モニターコンテナ */
        .viewport { 
            flex: 1; position: relative; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; background: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; transition: 0.5s; }
        #wb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; background: transparent; }
        .wb-active #wb-canvas { pointer-events: auto; cursor: crosshair; }

        /* ホワイトボード・フローティングツール */
        #wb-palette { 
            position: absolute; left: 20px; top: 20px; z-index: 1000; 
            background: var(--panel); backdrop-filter: blur(15px); padding: 12px; 
            border-radius: 18px; display: none; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .wb-active #wb-palette { display: flex; }
        .tool-group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .tool-icon { 
            width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; border: 1px solid transparent; font-size: 20px;
        }
        .tool-icon:hover { background: rgba(255,255,255,0.15); }
        .tool-icon.active { background: var(--accent); color: #000; border-color: #fff; }
        .color-circle { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); }

        /* --- 下部監視トレイ --- */
        .tray { 
            height: var(--monitor-height); background: #080808; display: flex; 
            flex-direction: column; border-top: 1px solid #333; flex-shrink: 0;
            transition: 0.3s;
        }
        .tray-header { 
            display: flex; background: #000; padding: 10px 20px; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #222;
        }
        .tray-tabs { display: flex; gap: 10px; }
        .tab { 
            padding: 8px 18px; border-radius: 8px; font-size: 11px; font-weight: 700;
            color: #666; cursor: pointer; transition: 0.3s;
        }
        .tab.active { background: rgba(0,251,255,0.1); color: var(--accent); }

        .student-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; }
        .card { 
            background: #151515; border: 1px solid #333; border-radius: 14px; 
            padding: 10px; text-align: center; position: relative; transition: 0.3s;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .card video, .card canvas { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
        .card-label { font-size: 10px; font-weight: 700; margin-top: 8px; color: #fff; opacity: 0.8; }
        .hand-status { position: absolute; top: 5px; right: 5px; font-size: 16px; display: none; }
        .card.raised { border: 2px solid var(--warning); animation: card-pulse 1s infinite; }
        .card.raised .hand-status { display: block; }
        @keyframes card-pulse { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }

        /* --- ツールハブ（100機能） --- */
        #hub-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 8000; display: none; padding: 60px; overflow-y: auto; backdrop-filter: blur(20px);
        }
        .hub-container { max-width: 1200px; margin: 0 auto; }
        .hub-title { font-size: 32px; font-weight: 900; margin-bottom: 40px; text-align: center; }
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .hub-item { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .hub-item:hover { background: rgba(0,251,255,0.1); border-color: var(--accent); transform: scale(1.05); }
        .hub-item span { font-size: 35px; display: block; margin-bottom: 15px; }
        .hub-item b { font-size: 15px; display: block; margin-bottom: 5px; }
        .hub-item p { font-size: 10px; color: #888; margin: 0; }

        /* --- 操作パネル --- */
        .dock { 
            height: 75px; background: #000; border-top: 1px solid #222; 
            display: flex; align-items: center; padding: 0 25px; gap: 15px; z-index: 4500;
        }
        .dock-btn { 
            background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 20px; 
            border-radius: 14px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .dock-btn:hover { background: #222; border-color: #555; }
        .dock-btn.primary { background: var(--accent); color: #000; border: none; }
        #dock-msg { flex: 1; background: #111; border: 1px solid #333; color: white; padding: 12px 25px; border-radius: 30px; }

        /* --- ログイン画面 --- */
        .setup-overlay { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; justify-content: center; align-items: center; 
            background-image: radial-gradient(var(--accent) 0.5px, transparent 0.5px); background-size: 30px 30px; background-alpha: 0.1;
        }
        .setup-card { 
            background: #111; padding: 50px; border-radius: 35px; text-align: center; 
            width: 380px; border: 1px solid #222; box-shadow: 0 25px 100px rgba(0,0,0,1);
        }
        .setup-card h1 { font-size: 28px; margin-bottom: 10px; }
        .setup-card input { margin-bottom: 15px; width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; }
        
        /* ユーティリティ */
        #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 12px 30px; border-radius: 40px; font-weight: 900; z-index: 10000; display: none; }
        .hidden { display: none !important; }
        .whiteboard-mode .viewport { background: #fff !important; }
        .whiteboard-mode #main-video { opacity: 0; }
        .grid-lines { background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body id="root">

<div id="toast"></div>

<!-- 1. セットアップ（ログイン） -->
<div id="setup-screen" class="setup-overlay">
    <div class="setup-card">
        <div style="font-size: 40px; margin-bottom: 10px;">♾️</div>
        <h1>EDU-OS Infinity</h1>
        <p style="color: #666; margin-bottom: 30px;">次世代型授業支援プラットフォーム</p>
        <input type="text" id="user-name" placeholder="お名前">
        <input type="number" id="room-id" placeholder="ルームID (4桁)">
        <button class="dock-btn primary" style="width:100%; height:55px; margin-top:20px; justify-content:center;" onclick="initSystem('teacher')">先生として授業を開始</button>
        <button class="dock-btn" style="width:100%; height:55px; margin-top:10px; justify-content:center;" onclick="initSystem('student')">生徒として参加する</button>
    </div>
</div>

<!-- 2. 注目モード -->
<div id="focus-overlay" class="setup-overlay hidden" style="z-index: 10000;">
    <div style="text-align:center;">
        <div style="font-size: 80px; margin-bottom: 20px;">👁️‍🗨️</div>
        <h1 style="font-size: 45px; color: var(--accent);">ATTENTION</h1>
        <p style="font-size: 20px; opacity: 0.7;">先生の説明に注目してください。操作はロックされています。</p>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <button class="dock-btn" onclick="toggleSidebar()" style="padding: 10px;">☰</button>
        <div class="logo">EDU Pro Infinity</div>
        <div id="timer-display" class="timer-badge">00:00</div>
    </div>
    <div class="header-stats">
        <div id="room-info">ROOM ID: ----</div>
        <div id="connect-info">0 STUDENTS</div>
        <button class="dock-btn" style="background:var(--danger); border:none; padding: 8px 15px;" onclick="location.reload()">終了</button>
    </div>
</header>

<div class="main-layout">
    <!-- サイドバー -->
    <div id="sidebar" class="sidebar">
        <div class="panel">
            <div class="panel-title">LIVE PREVIEW</div>
            <div style="width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; border:1px solid #333;">
                <video id="my-local-video" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
            <button class="dock-btn" style="width:100%; margin-top:10px; font-size:10px; height:30px; justify-content:center;" onclick="changeSource()">共有ソースを変更</button>
        </div>

        <div class="panel">
            <div class="panel-title">出席名簿 / POINTS</div>
            <div id="roster-list" style="max-height: 250px; overflow-y: auto;"></div>
        </div>

        <div class="panel">
            <div class="panel-title">理解度ヒートマップ</div>
            <div style="height:14px; background:#222; border-radius:7px; overflow:hidden; margin-top:8px;">
                <div id="confusion-bar" style="width:0%; height:100%; background:var(--danger); transition:0.6s cubic-bezier(0.23, 1, 0.32, 1);"></div>
            </div>
            <p style="font-size:9px; color:#555; margin-top:5px; text-align:center;">「わからない」ボタンの合計値</p>
        </div>

        <div class="panel">
            <div class="panel-title">RESOURCE LINK</div>
            <div id="resource-hub" style="font-size:11px; color:var(--accent); display:flex; flex-direction:column; gap:8px; margin-top:8px;"></div>
        </div>
    </div>

    <!-- ステージ -->
    <div class="stage">
        <div class="viewport" id="viewport-container">
            <div id="laser" style="position:absolute; width:12px; height:12px; background:red; border-radius:50%; box-shadow:0 0 15px red; display:none; z-index:1000; pointer-events:none;"></div>
            <video id="main-video" autoplay playsinline muted></video>
            <canvas id="wb-canvas"></canvas>

            <!-- ホワイトボードツール -->
            <div id="wb-palette">
                <div class="tool-group" id="teacher-wb-settings" class="hidden">
                    <select id="wb-mode" onchange="setWbMode(this.value)" style="background:#000; color:#fff; border:1px solid #444; border-radius:5px; font-size:10px; width:100%;">
                        <option value="teacher">先生主導 (生徒閲覧)</option>
                        <option value="individual">各自練習 (記入許可)</option>
                        <option value="all">全員共有 (1枚を共同)</option>
                    </select>
                    <div style="display:flex; gap:5px; width:100%;">
                        <button onclick="setBg('transparent')" style="flex:1; font-size:9px;">透</button>
                        <button onclick="setBg('white')" style="flex:1; font-size:9px;">白</button>
                        <button onclick="setBg('grid')" style="flex:1; font-size:9px;">方</button>
                    </div>
                </div>
                <div class="tool-group" style="flex-direction:row; flex-wrap:wrap; width:90px; gap:8px;">
                    <div class="tool-icon active" id="tool-pen" onclick="setWbTool('pen')">🖋️</div>
                    <div class="tool-icon" id="tool-high" onclick="setWbTool('highlighter')">🖍️</div>
                    <div class="tool-icon" id="tool-eraser" onclick="setWbTool('eraser')">🧼</div>
                    <div class="tool-icon" onclick="undoWb()">↩️</div>
                </div>
                <div class="tool-group" style="flex-direction:row; gap:6px;">
                    <div class="color-circle" style="background:#000" onclick="wbColor='#000'"></div>
                    <div class="color-circle" style="background:#ff4757" onclick="wbColor='#ff4757'"></div>
                    <div class="color-circle" style="background:#2ecc71" onclick="wbColor='#2ecc71'"></div>
                    <div class="color-circle" style="background:#3498db" onclick="wbColor='#3498db'"></div>
                </div>
                <div class="tool-group">
                    <button class="dock-btn" onclick="clearWb()" style="background:var(--danger); font-size:9px; height:28px; width:100%; justify-content:center;">CLEAR</button>
                    <button class="dock-btn" onclick="toggleWb()" style="font-size:9px; height:28px; width:100%; justify-content:center; margin-top:5px;">CLOSE</button>
                </div>
            </div>
        </div>

        <!-- 監視トレイ -->
        <div id="monitor-tray" class="tray">
            <div class="tray-header">
                <div class="tray-tabs">
                    <div class="tab active" onclick="switchTab('screen')">SCREEN MONITOR</div>
                    <div class="tab" onclick="switchTab('board')">BOARD MONITOR</div>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="dock-btn" style="padding:4px 12px; background:var(--purple); font-size:10px; border:none;" onclick="shootConfetti()">🎉 CELEBRATE</button>
                    <input type="range" min="10" max="80" value="35" oninput="document.documentElement.style.setProperty('--monitor-height', this.value + 'vh')" style="width:80px; accent-color:var(--accent);">
                </div>
            </div>
            <div id="grid-screen" class="student-grid"></div>
            <div id="grid-board" class="student-grid hidden"></div>
        </div>
    </div>
</div>

<!-- 操作ドック -->
<div class="dock">
    <button class="dock-btn primary" onclick="toggleWb()">🖊️ BOARD</button>
    <button class="dock-btn" onclick="toggleHub()">🛠️ TOOL HUB</button>
    <input type="text" id="dock-msg" placeholder="全体メッセージ、または教材URLを送信...">
    <button class="dock-btn primary" onclick="handleDockSend()">SEND</button>
    
    <div id="student-actions" class="hidden" style="display:flex; gap:10px;">
        <button id="hand-btn" class="dock-btn" onclick="toggleHand()" style="background:var(--warning); color:#000;">✋ Raise Hand</button>
        <button class="dock-btn" id="confuse-btn" onclick="toggleConfuse()" style="background:var(--danger);">❓ Confused</button>
    </div>
</div>

<!-- 🛠️ インフィニティ・ハブ -->
<div id="hub-overlay">
    <div class="hub-container">
        <h1 class="hub-title">Infinity Toolkit</h1>
        <div class="hub-grid" id="hub-items">
            <!-- JSで動的に生成 -->
        </div>
    </div>
</div>

<!-- アンケート -->
<div id="poll-overlay" class="overlay">
    <div class="modal-box white-modal">
        <h2 id="poll-q-title">Question</h2>
        <div id="poll-opts-box" style="display:flex; flex-direction:column; gap:12px; margin-top:25px;"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let wbCanvas, wbCtx, wbDrawing = false, wbColor = "#000", wbMode = "teacher", wbTool = "pen", wbHistory = [];
    let isFocus = false, isRaised = false, isConfused = false, timerInterval;

    // --- 100機能ハブの定義 ---
    const TOOLS = [
        { icon: '🔒', name: '注目モード', desc: '画面をロックして集中させる', fn: () => toggleFocus() },
        { icon: '⏱️', name: 'タイマー', desc: '演習時間を同期表示する', fn: () => startTimer() },
        { icon: '🎲', name: 'ランダム指名', desc: '生徒から一人を選び出す', fn: () => pickRandom() },
        { icon: '📊', name: 'アンケート', desc: 'リアルタイムで集計を行う', fn: () => createPoll() },
        { icon: '⬜', name: '白紙モード', desc: '背景を真っ白に変更する', fn: () => setBg('white') },
        { icon: '⬛', name: '黒板モード', desc: '背景を黒に変更する', fn: () => setBg('black') },
        { icon: '🏁', name: '方眼紙', desc: '数学・グラフ用の背景', fn: () => setBg('grid') },
        { icon: '💎', name: '全員加点', desc: '全員にポイントを贈る', fn: () => rewardAll() },
        { icon: '👏', name: '拍手喝采', desc: '音とリアクションを飛ばす', fn: () => sendEmoji('👏') },
        { icon: '📋', name: '出席CSV', desc: '現在の名簿を保存する', fn: () => exportAttendance() },
        { icon: '🖼️', name: '無限ループ防止', desc: '鏡像表示を隠す', fn: () => toggleMirror() },
        { icon: '⏹️', name: '配信停止', desc: '映像配信を一時中断する', fn: () => toggleBroadcast() },
        { icon: '🔄', name: '共有リセット', fn: () => resetSpotlight(), desc: '教員の画面に戻す' },
        { icon: '💣', name: '強制終了', fn: () => kickAll(), desc: '全員を一斉に退室させる' }
    ];

    // --- システムコア ---
    async function initSystem(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || (role === 'teacher' ? 'Teacher' : 'Student');
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("ルームIDを入力してください");

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
            document.getElementById('setup-screen').style.display = 'none';
            initWhiteboard();
            buildHub();

            if(role === 'teacher') {
                document.getElementById('teacher-wb-settings').classList.remove('hidden');
                peer = new Peer("T-ROOM-" + currentRid);
                setupTeacher();
            } else {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('student-actions').classList.remove('hidden');
                peer = new Peer();
                setupStudent();
            }
        } catch(e) { alert("Access Denied"); location.reload(); }
    }

    function setupTeacher() {
        peer.on('open', () => {
            document.getElementById('room-info').innerText = "ID: " + currentRid;
            document.getElementById('my-local-video').srcObject = localStream;
            document.getElementById('main-video').srcObject = localStream;
        });
        peer.on('connection', conn => {
            dataConnections[conn.peer] = conn;
            conn.on('data', data => handleIncomingData(conn.peer, data));
        });
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => { studentStreams[call.peer] = s; addStudent(call.peer, s); });
        });

        // 先生のレーザーポインター同期
        window.addEventListener('pointermove', e => {
            if(!wbDrawing && myRole === 'teacher') {
                const rect = document.getElementById('viewport-container').getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width, y = (e.clientY - rect.top) / rect.height;
                Object.values(dataConnections).forEach(c => c.send({type:'LASER', x, y}));
            }
        });
    }

    function setupStudent() {
        const tid = "T-ROOM-" + currentRid;
        peer.on('open', () => {
            const call = peer.call(tid, localStream);
            const conn = peer.connect(tid);
            dataConnections[tid] = conn;
            conn.on('open', () => conn.send({ type: 'INFO', name: myName }));
            conn.on('data', data => handleIncomingData(tid, data));
            call.on('stream', s => { document.getElementById('main-video').srcObject = s; });
        });
    }

    // --- データエンジン ---
    function handleIncomingData(id, data) {
        switch(data.type) {
            case 'INFO': studentInfo[id] = { ...data, points: 0, confused: false }; updateRoster(); updateConnectCount(); break;
            case 'WB_DRAW': renderRemoteStroke(id, data); break;
            case 'WB_START': document.body.classList.add('wb-active'); resizeCanvas(); break;
            case 'WB_STOP': document.body.classList.remove('wb-active'); break;
            case 'WB_MODE': wbMode = data.mode; break;
            case 'WB_BG': applyBg(data.bg); break;
            case 'WB_CLEAR': wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); break;
            case 'FOCUS': document.getElementById('focus-overlay').classList.toggle('hidden', !data.active); break;
            case 'TIMER': document.getElementById('timer-display').innerText = data.time; break;
            case 'HAND': studentInfo[id].hand = data.active; document.getElementById(`card-${id}`)?.classList.toggle('raised', data.active); break;
            case 'CONFUSE': studentInfo[id].confused = data.active; updateConfusionMeter(); break;
            case 'POLL_START': showPollUI(data.q, data.opts); break;
            case 'REACTION': spawnEmoji(data.emoji); break;
            case 'KICK': location.reload(); break;
            case 'COMMENT': showToast(data.msg); break;
            case 'LASER': moveLaser(data.x, data.y); break;
        }
    }

    // --- ホワイトボード（PointerEvents） ---
    function initWhiteboard() {
        wbCanvas = document.getElementById('wb-canvas'); wbCtx = wbCanvas.getContext('2d');
        const resize = () => { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; };
        resize(); window.onresize = resize;
        const getPos = (e) => {
            const rect = wbCanvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (wbCanvas.width / rect.width), y: (e.clientY - rect.top) * (wbCanvas.height / rect.height) };
        };
        wbCanvas.addEventListener('pointerdown', e => {
            if (myRole !== 'teacher' && wbMode === 'teacher') return;
            wbDrawing = true; const pos = getPos(e); drawStroke(pos.x, pos.y, true); sendStroke(pos.x, pos.y, true);
        });
        wbCanvas.addEventListener('pointermove', e => {
            if (!wbDrawing) return;
            const pos = getPos(e); drawStroke(pos.x, pos.y, false); sendStroke(pos.x, pos.y, false);
        });
        window.addEventListener('pointerup', () => { if(wbDrawing) saveWbHistory(); wbDrawing = false; });
    }

    function drawStroke(x, y, start) {
        wbCtx.lineCap = "round"; wbCtx.lineJoin = "round";
        wbCtx.globalCompositeOperation = (wbTool === 'eraser') ? 'destination-out' : 'source-over';
        wbCtx.globalAlpha = (wbTool === 'highlighter') ? 0.35 : 1.0;
        wbCtx.lineWidth = (wbTool === 'eraser') ? 40 : (wbTool === 'highlighter' ? 25 : 3);
        wbCtx.strokeStyle = wbColor;
        if(start) { wbCtx.beginPath(); wbCtx.moveTo(x, y); }
        wbCtx.lineTo(x, y); wbCtx.stroke();
    }

    function sendStroke(x, y, start) {
        const d = { type: 'WB_DRAW', x: x/wbCanvas.width, y: y/wbCanvas.height, color: wbColor, tool: wbTool, start };
        if (myRole === 'teacher') Object.values(dataConnections).forEach(c => c.send(d));
        else dataConnections["T-ROOM-"+currentRid]?.send(d);
    }

    function renderRemoteStroke(id, data) {
        const x = data.x * wbCanvas.width, y = data.y * wbCanvas.height;
        if (id.startsWith('T-ROOM') || myRole === 'teacher' || wbMode === 'all') {
            const ct = wbTool, cc = wbColor; wbTool = data.tool; wbColor = data.color;
            drawStroke(x, y, data.start); wbTool = ct; wbColor = cc;
        }
        const mini = document.getElementById(`wb-mini-${id}`);
        if(mini) {
            const mCtx = mini.getContext('2d'); mCtx.strokeStyle = data.color; mCtx.lineWidth = 2;
            if(data.start) { mCtx.beginPath(); mCtx.moveTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); }
            mCtx.lineTo(x*mini.width/wbCanvas.width, y*mini.height/wbCanvas.height); mCtx.stroke();
        }
        if (myRole === 'teacher' && wbMode === 'all') {
            Object.entries(dataConnections).forEach(([tid, c]) => { if(tid !== id) c.send(data); });
        }
    }

    // --- 各種機能ロジック ---
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function toggleHub() { const h = document.getElementById('hub-overlay'); h.style.display = (h.style.display === 'block' ? 'none' : 'block'); }
    function buildHub() {
        const grid = document.getElementById('hub-items'); grid.innerHTML = "";
        TOOLS.forEach(t => {
            const div = document.createElement('div'); div.className = 'hub-item';
            div.innerHTML = `<span>${t.icon}</span><b>${t.name}</b><p>${t.desc}</p>`;
            div.onclick = t.fn; grid.appendChild(div);
        });
    }

    function startTimer() {
        const s = prompt("秒数入力:","60"); if(!s) return; let t = parseInt(s);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            t--; let d = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = d;
            Object.values(dataConnections).forEach(c => c.send({type:'TIMER', time:d}));
            if(t<=0) { clearInterval(timerInterval); showToast("終了！"); }
        }, 1000); toggleHub();
    }

    function toggleHand() { isRaised = !isRaised; document.getElementById('hand-btn').innerText = isRaised ? "✋ 下ろす" : "✋ 挙手"; dataConnections["T-ROOM-"+currentRid]?.send({type:'HAND', active:isRaised}); }
    function toggleConfuse() { isConfused = !isConfused; document.getElementById('confuse-btn').classList.toggle('primary'); dataConnections["T-ROOM-"+currentRid]?.send({type:'CONFUSE', active:isConfused}); }
    function updateConfusionMeter() { const count = Object.values(studentInfo).filter(s=>s.confused).length; const p = Object.keys(studentInfo).length ? (count / Object.keys(studentInfo).length)*100 : 0; document.getElementById('confusion-bar').style.width = p+'%'; }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none',3000); }
    function shootConfetti() { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); Object.values(dataConnections).forEach(c => c.send({type:'CONFETTI'})); }
    function toggleFocus() { isFocus = !isFocus; Object.values(dataConnections).forEach(c => c.send({type:'FOCUS', active:isFocus})); toggleHub(); }
    function spawnEmoji(e) { const s = document.createElement('span'); s.className='flying-emoji'; s.innerText=e; s.style.left=Math.random()*90+'vw'; document.body.appendChild(s); setTimeout(()=>s.remove(),2000); }
    function sendEmoji(e) { spawnEmoji(e); Object.values(dataConnections).forEach(c=>c.send({type:'REACTION', emoji:e})); }
    function setBg(bg) { applyBg(bg); Object.values(dataConnections).forEach(c=>c.send({type:'WB_BG', bg})); toggleHub(); }
    function applyBg(bg) { document.body.className = (bg==='transparent'?'':(bg==='grid'?'whiteboard-mode grid-bg':bg+'-mode')); }
    function moveLaser(x,y) { const l = document.getElementById('laser'); l.style.display='block'; l.style.left=(x*100)+'%'; l.style.top=(y*100)+'%'; }

    // --- UI更新 ---
    function addStudent(id, stream) {
        if(document.getElementById(`card-${id}`)) return;
        const name = studentInfo[id]?.name || 'Student';
        const card = document.createElement('div'); card.className = 'card'; card.id = `card-${id}`;
        card.innerHTML = `<div class="hand-status">✋</div><video id="v-${id}" autoplay playsinline muted></video><div class="card-label">${name}</div><button onclick="startSpotlight('${id}')" style="font-size:8px; width:100%; margin-top:5px; background:var(--accent); color:#000; border:none; border-radius:4px;">共有</button>`;
        document.getElementById('grid-screen').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        const wbCard = document.createElement('div'); wbCard.className = 'card'; wbCard.id = `wb-card-${id}`;
        wbCard.innerHTML = `<canvas id="wb-mini-${id}" width="160" height="90" style="background:#fff; border-radius:5px;"></canvas><div class="card-label">${name}</div>`;
        document.getElementById('grid-board').appendChild(wbCard);
        updateConnectCount();
    }
    function updateRoster() { const r = document.getElementById('roster-list'); r.innerHTML = ""; Object.entries(studentInfo).forEach(([id, info]) => { r.innerHTML += `<div style="font-size:11px; margin-bottom:8px; display:flex; justify-content:space-between;"><span>● ${info.name}</span> <span style="color:#666;">${info.points}pt</span></div>`; }); }
    function updateConnectCount() { document.getElementById('connect-info').innerText = Object.keys(studentInfo).length + " STUDENTS"; }
    function toggleWb() { const a = document.body.classList.toggle('wb-active'); if(myRole==='teacher') Object.values(dataConnections).forEach(c=>c.send({type:a?'WB_START':'WB_STOP'})); setTimeout(()=> { wbCanvas.width = wbCanvas.offsetWidth; wbCanvas.height = wbCanvas.offsetHeight; }, 50); }
    function setWbMode(m) { wbMode=m; Object.values(dataConnections).forEach(c=>c.send({type:'WB_MODE', mode:m})); }
    function setWbTool(t) { wbTool=t; document.querySelectorAll('.tool-icon').forEach(b=>b.classList.remove('active')); document.getElementById('tool-'+t.substring(0,3))?.classList.add('active'); }
    function clearWb() { wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); Object.values(dataConnections).forEach(c=>c.send({type:'WB_CLEAR'})); }
    function saveWbHistory() { wbHistory.push(wbCtx.getImageData(0,0,wbCanvas.width,wbCanvas.height)); if(wbHistory.length>30) wbHistory.shift(); }
    function undoWb() { wbHistory.pop(); if(wbHistory.length) wbCtx.putImageData(wbHistory[wbHistory.length-1],0,0); else wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); }
    function switchTab(t) { document.getElementById('grid-screen').classList.toggle('hidden', t!=='screen'); document.getElementById('grid-board').classList.toggle('hidden', t!=='board'); document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.innerText.includes(t.toUpperCase()))); }
    function handleDockSend() { const m = document.getElementById('dock-msg').value; if(!m) return; Object.values(dataConnections).forEach(c=>c.send({type:'COMMENT', msg:m})); document.getElementById('dock-msg').value=""; showToast("Sent"); }
    async function startSpotlight(id) { const track = studentStreams[id].getVideoTracks()[0]; document.getElementById('main-video').srcObject = studentStreams[id]; Object.values(mediaCalls).forEach(call => { if(call.peerConnection) { const s = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video'); if(s) s.replaceTrack(track); } }); }
</script>
