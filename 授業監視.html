<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視・配信システム（教員ID自動発行版）</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 100; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* サイドバー：教員用 */
        .sidebar { width: 220px; background: #1a1a1a; border-right: 1px solid #444; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .room-info-card { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; box-shadow: 0 0 10px rgba(0,251,255,0.2); }
        .my-preview-area { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; }
        .my-preview-area video { width: 100%; border-radius: 4px; background: #222; }
        .roster-item { background: #333; padding: 8px; border-radius: 5px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }

        .primary-view { flex: 1; position: relative; background: #111; overflow: hidden; }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; align-content: start; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 8px; text-align: center; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 5px; display: block; }
        #teacher-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* セットアップ */
        .setup-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #333; }
        input { padding: 12px; font-size: 18px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        button { padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; width: 100%; font-size: 14px; margin: 5px 0; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div>モード: <span id="mode-text">選択中</span></div>
    <div class="status-bar">
        <div id="status-msg">待機中...</div>
        <div id="count-display">接続数: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff; border:none; width:60px; font-size:10px; cursor:pointer;">終了</button>
</header>

<div class="main-layout">
    <!-- サイドバー（先生用） -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info-card">
            <div style="font-size: 10px; color: #00fbff; margin-bottom: 4px;">生徒に教える参加ID</div>
            <div id="display-room-id" style="font-size: 36px; font-weight: bold; letter-spacing: 3px; color: #fff;">----</div>
        </div>
        <div id="my-preview-section">
            <h3 style="font-size:12px; color:#aaa; margin:0 0 5px;">🔴 自分の配信画面</h3>
            <div class="my-preview-area">
                <video id="my-local-preview" autoplay playsinline muted></video>
            </div>
        </div>
        <h3 style="font-size:12px; color:#aaa; margin:5px 0 5px;">👥 生徒リスト</h3>
        <div id="student-roster"></div>
    </div>

    <!-- メイン表示エリア -->
    <div class="primary-view">
        <div id="monitor-area" class="monitor-grid hidden"></div>
        <video id="teacher-video" class="hidden" autoplay playsinline muted></video>
    </div>
</div>

<!-- 先生用コントロールパネル -->
<div id="teacher-controls" class="hidden" style="background:#222; padding:10px; display:flex; gap:10px; justify-content:center; border-top:1px solid #444;">
    <button id="broadcast-btn" onclick="toggleBroadcast()" style="background:#e84118; color:white; width:150px;">📡 配信を停止</button>
    <button onclick="showRemoteQR()" style="background:#f39c12; color:white; width:150px;">📱 スマホで監視</button>
</div>

<!-- セットアップ画面 -->
<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="color:#00fbff; margin-bottom:20px;">授業システム</h2>
        <input type="number" id="room-id" placeholder="生徒：番号を入力" oninput="checkCode()">
        <button style="background:#f39c12; color:white;" onclick="start('teacher')">先生として開始（IDを自動発行）</button>
        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
        <button style="background:#0097e6; color:white;" onclick="start('student')">生徒として参加</button>
        <button id="secret-btn" class="hidden" style="background:#8e44ad; color:white;" onclick="start('remote')">🔍 生徒監視（隠しモード）</button>
    </div>
</div>

<!-- QRコード表示 -->
<div id="qr-modal" class="modal hidden" onclick="this.classList.add('hidden')">
    <div style="background:white; padding:20px; border-radius:15px; text-align:center; color:black;">
        <h3>スマホ監視用QR</h3>
        <div id="qrcode"></div>
        <button onclick="document.getElementById('qr-modal').classList.add('hidden')" style="margin-top:10px; background:#ddd;">閉じる</button>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    let isBroadcasting = true;
    let studentCount = 0;
    const studentStreams = {};

    function log(m) { document.getElementById('status-msg').innerText = m; }
    function updateCount() { document.getElementById('count-display').innerText = "接続数: " + studentCount; }

    // 隠しコマンド検知
    function checkCode() {
        if (document.getElementById('room-id').value === "200977") reveal();
    }
    window.addEventListener('keydown', e => {
        if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'i') reveal();
    });
    function reveal() { document.getElementById('secret-btn').classList.remove('hidden'); log("隠しボタン有効"); }

    async function start(role) {
        myRole = role;
        const inputRid = document.getElementById('room-id').value;

        // 【修正】先生の場合は入力を無視してIDを自動生成
        if (role === 'teacher') {
            currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        } else {
            // 生徒や監視員は入力されたIDを使用
            currentRid = inputRid;
            if (!currentRid) return alert("番号を入力してください");
            
            log("接続確認中...");
            const exists = await checkRoomExists(currentRid);
            if (!exists) {
                alert("エラー: ID「" + currentRid + "」のルームは見つかりません。先生が開始しているか確認してください。");
                return;
            }
        }

        document.getElementById('setup-screen').classList.add('hidden');

        try {
            if (role === 'teacher' || role === 'student') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                if (role === 'teacher') {
                    document.getElementById('my-local-preview').srcObject = localStream;
                    document.getElementById('display-room-id').innerText = currentRid;
                }
            }

            const peerId = (role === 'teacher' ? "T-PC-" : (role === 'remote' ? "T-MB-" : "")) + currentRid;
            peer = (role === 'student') ? new Peer() : new Peer(peerId);

            peer.on('open', () => {
                log("サーバー接続成功");
                document.getElementById('mode-text').innerText = (role==='teacher'?"先生": (role==='remote'?"監視員":"生徒"));

                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('teacher-controls').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('teacher-video').classList.remove('hidden');
                    callTeacher("T-PC-" + currentRid);
                    callTeacher("T-MB-" + currentRid);
                }
            });

            peer.on('error', err => {
                if (err.type === 'peer-unavailable') {
                    alert("接続先が見つかりませんでした。");
                    location.reload();
                } else if (err.type === 'unavailable-id') {
                    // 自動生成されたIDが万が一重複していた場合
                    if (myRole === 'teacher') {
                        alert("ID生成エラー。もう一度やり直してください。");
                        location.reload();
                    }
                }
            });

            peer.on('call', call => {
                call.answer(role === 'teacher' && isBroadcasting ? localStream : null);
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        studentCount++;
                        updateCount();
                        if (role === 'teacher') addRoster(call.peer);
                        else addVideo(call.peer, stream);
                    }
                });
            });

        } catch (e) { alert("失敗: " + e.message); location.reload(); }
    }

    // 先生が存在するか確認
    function checkRoomExists(rid) {
        return new Promise((resolve) => {
            const checkPeer = new Peer();
            const teacherId = "T-PC-" + rid;
            checkPeer.on('open', () => {
                const conn = checkPeer.connect(teacherId);
                const timeout = setTimeout(() => { checkPeer.destroy(); resolve(false); }, 3000);
                conn.on('open', () => { clearTimeout(timeout); checkPeer.destroy(); resolve(true); });
                checkPeer.on('error', () => { clearTimeout(timeout); checkPeer.destroy(); resolve(false); });
            });
        });
    }

    function callTeacher(targetId) {
        const call = peer.call(targetId, localStream);
        call.on('stream', stream => {
            const v = document.getElementById('teacher-video');
            v.srcObject = stream;
            v.onloadedmetadata = () => v.play().catch(()=>{});
        });
    }

    function addRoster(id) {
        const div = document.createElement('div');
        div.className = 'roster-item';
        div.id = `roster-${id}`;
        div.innerHTML = `<span>ID:${id.slice(-4)}</span><button onclick="addVideo('${id}')" style="background:#44bd32; color:white; padding:4px 8px; border-radius:4px; border:none; cursor:pointer; font-size:10px;">監視</button>`;
        document.getElementById('student-roster').appendChild(div);
    }

    function addVideo(id, manualStream) {
        if (document.getElementById(`card-${id}`)) return;
        const stream = manualStream || studentStreams[id];
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        card.innerHTML = `<div class="student-label">生徒:${id.slice(-4)}</div><video id="vid-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        const v = document.getElementById(`vid-${id}`);
        v.srcObject = stream;
        v.onloadedmetadata = () => v.play().catch(()=>{});
        stream.getVideoTracks()[0].onended = () => {
            card.remove();
            if (document.getElementById(`roster-${id}`)) document.getElementById(`roster-${id}`).remove();
            studentCount = Math.max(0, studentCount - 1);
            updateCount();
            delete studentStreams[id];
        };
    }

    function toggleBroadcast() {
        isBroadcasting = !isBroadcasting;
        localStream.getVideoTracks().forEach(t => t.enabled = isBroadcasting);
        document.getElementById('broadcast-btn').innerText = isBroadcasting ? "📡 配信を停止" : "📡 配信を開始";
        document.getElementById('broadcast-btn').style.background = isBroadcasting ? "#e84118" : "#44bd32";
    }

    function showRemoteQR() {
        const modal = document.getElementById('qr-modal');
        const container = document.getElementById('qrcode');
        container.innerHTML = "";
        const url = window.location.origin + window.location.pathname + "#remote-" + currentRid;
        new QRCode(container, { text: url, width: 150, height: 150 });
        modal.classList.remove('hidden');
    }

    window.onload = () => {
        if (window.location.hash.startsWith("#remote-")) {
            const rid = window.location.hash.replace("#remote-", "");
            if (confirm("遠隔監視モードを起動しますか？")) start('remote', rid);
        }
    };
</script>
</body>
</html>
