<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Sync (Background Master)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 10px; text-align: center; border-bottom: 2px solid #333; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .primary-view { flex: 3; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        #main-screen { max-width: 100%; max-height: 100%; object-fit: contain; }

        .monitor-sidebar { width: 320px; background: #151515; border-left: 2px solid #333; overflow-y: auto; padding: 10px; }
        .student-card { background: #252525; margin-bottom: 15px; padding: 10px; border-radius: 10px; border: 1px solid #444; }
        .student-card img { width: 100%; background: #000; border-radius: 5px; min-height: 120px; display: block; }
        .student-info { font-size: 11px; color: #00fbff; margin-bottom: 5px; display: flex; justify-content: space-between; }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #333; padding: 40px; border-radius: 20px; text-align: center; width: 320px; }
        button { padding: 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; margin: 10px 0; width: 100%; font-size: 16px; }
        .btn-teacher { background: #e84118; color: white; }
        .btn-student { background: #0097e6; color: white; }
        input { padding: 15px; font-size: 24px; width: 100%; border-radius: 10px; border: 1px solid #555; background: #111; color: white; text-align: center; box-sizing: border-box; }
        
        /* 状態表示ランプ */
        #sync-lamp { display: inline-block; width: 10px; height: 10px; background: #555; border-radius: 50%; margin-right: 5px; }
        .lamp-on { background: #00ff00 !important; box-shadow: 0 0 8px #00ff00; }

        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 10px; }
        .hidden { display: none !important; }
        
        /* 動作維持用（消すと止まるブラウザがあるため） */
        #v-work { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0.1; }
    </style>
</head>
<body>

<header>
    <div>ID: <span id="display-id" style="font-weight:bold; color:#00fbff; font-size:22px;">----</span></div>
    <div id="status-line" style="font-size:12px; color:#aaa; margin-top:5px;">
        <span id="sync-lamp"></span> <span id="status-text">待機中</span>
    </div>
</header>

<div class="main-layout">
    <div class="primary-view">
        <div id="teacher-id-panel" class="hidden" style="text-align:center;">
            <div id="qrcode"></div>
            <p style="color:#aaa; font-size:12px;">生徒にQRコードを見せてください</p>
        </div>
        <img id="main-screen" class="hidden">
    </div>
    
    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <p style="font-size:12px; font-weight:bold; color:#888; margin-bottom:10px;">🎓 生徒監視 (0.1秒更新中)</p>
        <div id="student-grid"></div>
    </div>
</div>

<!-- 映像キャプチャ用（不可視） -->
<video id="v-work" autoplay playsinline muted></video>
<canvas id="c-work" class="hidden"></canvas>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin-top:0; color:#00fbff;">High-Speed Sync</h2>
        <button class="btn-teacher" onclick="initTeacher()">👨‍🏫 教員として開始</button>
        <hr style="border-color:#444; margin: 25px 0;">
        <input type="number" id="input-id" placeholder="IDを入力">
        <button class="btn-student" onclick="initStudent()">🎓 生徒として参加</button>
    </div>
</div>

<script>
    let peer;
    const canvas = document.getElementById('c-work');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('v-work');
    let connections = {};
    let myRole = "";

    // 【最強のタイマー】別ウィンドウでも0.1秒を維持するWorker
    const workerBlob = new Blob([`setInterval(()=>{self.postMessage('t')}, 100)`], {type:'text/javascript'});
    const timerWorker = new Worker(URL.createObjectURL(workerBlob));

    function setUI(role, id) {
        myRole = role;
        document.getElementById('display-id').innerText = id;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('sync-lamp').classList.add('lamp-on');
    }

    // --- 【教員】 ---
    async function initTeacher() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 } });
            video.srcObject = stream;
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('teacher-id-panel').classList.remove('hidden');

            peer = new Peer(Math.floor(1000 + Math.random() * 9000).toString());
            peer.on('open', id => {
                setUI("教員", id);
                new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('#')[0] + "#" + id, width: 140, height: 140 });
                startBroadcasting();
            });

            peer.on('connection', conn => {
                conn.on('open', () => {
                    const grid = document.getElementById('student-grid');
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.id = `card-${conn.peer}`;
                    card.innerHTML = `<div class="student-info"><span>生徒: ${conn.peer}</span><span id="pkt-${conn.peer}">0</span></div><img id="img-${conn.peer}">`;
                    grid.appendChild(card);
                    connections[conn.peer] = conn;
                });
                conn.on('data', data => {
                    if (data.type === 's-img') {
                        document.getElementById(`img-${conn.peer}`).src = data.img;
                        const pkt = document.getElementById(`pkt-${conn.peer}`);
                        pkt.innerText = parseInt(pkt.innerText) + 1;
                    }
                });
                conn.on('close', () => { document.getElementById(`card-${conn.peer}`)?.remove(); delete connections[conn.peer]; });
            });
        } catch (e) { alert("画面共有を許可してください"); }
    }

    // --- 【生徒】 ---
    async function initStudent() {
        const tid = document.getElementById('input-id').value || window.location.hash.substring(1);
        if(!tid) return alert("教員IDが必要です");

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            video.srcObject = stream;

            peer = new Peer();
            peer.on('open', myId => {
                const conn = peer.connect(tid);
                conn.on('open', () => {
                    setUI("生徒", "送信中 > " + tid);
                    document.getElementById('main-screen').classList.remove('hidden');
                    connections[tid] = conn;
                    startBroadcasting();
                });
                conn.on('data', data => { if(data.type === 't-img') document.getElementById('main-screen').src = data.img; });
                conn.on('close', () => location.reload());
            });
        } catch (e) { alert("画面共有を許可してください"); }
    }

    // --- 【共通】0.1秒ごとの送信ループ（Worker制御） ---
    function startBroadcasting() {
        timerWorker.onmessage = () => {
            if (video.readyState >= 2) {
                // 解像度設定（教員は高め、生徒は低めで安定させる）
                const w = (myRole === "教員") ? 800 : 300;
                canvas.width = w;
                canvas.height = (video.videoHeight / video.videoWidth) * w;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imgData = canvas.toDataURL('image/jpeg', 0.4);
                const type = (myRole === "教員") ? 't-img' : 's-img';

                // 全接続先に送信（裏ウィンドウでも動作）
                Object.values(connections).forEach(conn => {
                    if (conn.open && conn.bufferedAmount === 0) {
                        conn.send({ type: type, img: imgData });
                    }
                });
            }
        };
    }

    window.onload = () => { if(window.location.hash) document.getElementById('input-id').value = window.location.hash.substring(1); };
</script>
</body>
</html>
