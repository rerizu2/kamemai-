<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業支援システム【マルチモニター対応版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --pip-size: 280px; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 5px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; z-index: 1000; height: 60px; box-sizing: border-box; }
        .status-bar { display: flex; gap: 15px; font-size: 11px; color: #00fbff; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { width: 260px; background: #1a1a1a; border-right: 1px solid #444; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .room-info { background: #333; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #00fbff; }
        .my-preview { background: #000; border: 1px solid #444; border-radius: 8px; padding: 5px; text-align: center; }
        .my-preview video { width: 100%; border-radius: 4px; background: #222; }
        
        .roster-item { background: #333; padding: 10px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; border: 1px solid #444; }
        .group-input { width: 40px; background: #000; color: #00fbff; border: 1px solid #555; text-align: center; border-radius: 4px; }
        .roster-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }

        .primary-view { flex: 1; display: flex; flex-direction: column; background: #111; overflow: hidden; position: relative; }
        .video-container { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }

        .monitor-grid { height: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; padding: 15px; overflow-y: auto; align-content: start; background: #050505; }
        .student-card { background: #222; border: 1px solid #444; border-radius: 10px; padding: 6px; text-align: center; position: relative; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
        .surface-badge { position: absolute; top: 10px; right: 10px; background: rgba(0, 251, 255, 0.85); color: #000; padding: 1px 5px; border-radius: 3px; font-size: 8px; font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: #222; padding: 35px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; }
        input[type="text"], input[type="number"] { padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #111; color: white; text-align: center; margin-bottom: 12px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; transition: 0.2s; font-size: 13px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div id="mode-label">接続待機中...</div>
    <div class="status-bar">
        <div id="count-display">接続: 0</div>
    </div>
    <button onclick="location.reload()" style="background:#444; color:#fff;">終了</button>
</header>

<div class="main-layout">
    <!-- サイドバー（先生用のみ） -->
    <div id="sidebar" class="sidebar hidden">
        <div class="room-info">
            <div id="display-room-id" style="font-size: 24px; font-weight: bold; color: #00fbff;">----</div>
            <div style="font-size: 9px; color: #aaa;">生徒に教える参加ID</div>
        </div>
        <div class="my-preview">
            <h3 style="font-size:10px; color:#aaa; margin:0 0 5px;">🔴 配信プレビュー</h3>
            <video id="my-local-preview" autoplay playsinline muted></video>
        </div>
        <div id="roster-list"></div>
    </div>

    <!-- メインビュー -->
    <div class="primary-view">
        <!-- 先生・生徒用のメイン映像 -->
        <div id="video-section" class="video-container">
            <video id="main-broadcast-video" autoplay playsinline muted></video>
        </div>
        <!-- 監視用グリッド（先生とモニター端末で表示） -->
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<div id="setup-screen" class="overlay">
    <div class="modal-box">
        <h2 style="color:#00fbff;">授業システム</h2>
        <input type="text" id="user-name" placeholder="氏名（生徒のみ必須）">
        <input type="number" id="room-id" placeholder="参加ID（4桁）">
        <button style="background:#f39c12; color:white; width:100%; margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button style="background:#0097e6; color:white; width:100%; margin-bottom:10px;" onclick="start('student')">生徒として参加</button>
        <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
        <button style="background:#27ae60; color:white; width:100%;" onclick="start('remote')">監視用モニターとして接続</button>
        <p style="font-size:10px; color:#888; margin-top:10px;">監視用は別の端末からIDを入れて参加してください</p>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    const studentStreams = {}, studentInfo = {}, dataConnections = {}, mediaCalls = {}; 
    let monitorIds = []; // 監視している端末のIDリスト（先生が管理）

    async function start(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || (role === 'teacher' ? "先生" : "モニター");
        currentRid = document.getElementById('room-id').value;

        if (role === 'teacher' && !currentRid) currentRid = Math.floor(1000 + Math.random() * 9000).toString();
        if (!currentRid) return alert("参加IDを入力してください");

        try {
            // 生徒のみ画面共有を取得。先生・モニターは受信メイン
            if (role === 'student') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            } else if (role === 'teacher') {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            }

            document.getElementById('setup-screen').classList.add('hidden');

            // PeerIDの構築
            let myPeerId = undefined;
            if (role === 'teacher') myPeerId = "T-ROOM-" + currentRid;
            if (role === 'remote') myPeerId = "M-ROOM-" + currentRid + "-" + Date.now();

            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                document.getElementById('mode-label').innerText = 
                    (role==='teacher'?"先生モード": (role==='remote'?"監視モード":"生徒モード")) + " ID:" + currentRid;
                
                if (role === 'teacher' || role === 'remote') {
                    document.getElementById('monitor-area').classList.remove('hidden');
                    if (role === 'teacher') {
                        document.getElementById('display-room-id').innerText = currentRid;
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('video-section').style.height = "30%"; // 先生は自分の配信も見る
                        document.getElementById('my-local-preview').srcObject = localStream;
                        document.getElementById('main-broadcast-video').srcObject = localStream;
                    } else {
                        // モニター端末はメイン映像エリアを消してグリッドを広げる
                        document.getElementById('video-section').classList.add('hidden');
                        autoConnectMonitor(); // 先生に自分(モニター)を登録
                    }
                } else {
                    autoConnectStudent();
                }
            });

            // 映像・データ受信設定
            peer.on('connection', conn => {
                dataConnections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

            peer.on('call', call => {
                mediaCalls[call.peer] = call;
                call.answer(role === 'teacher' ? localStream : null); // 先生なら自分の画面を返す
                call.on('stream', stream => {
                    if (!studentStreams[call.peer]) {
                        studentStreams[call.peer] = stream;
                        addRoster(call.peer);
                        addVideoGrid(call.peer, stream);
                    }
                });
            });

        } catch (e) { console.error(e); alert("起動に失敗しました。再読み込みしてください。"); }
    }

    // 生徒が先生と監視端末に接続
    function autoConnectStudent() {
        const teacherId = "T-ROOM-" + currentRid;
        const call = peer.call(teacherId, localStream);
        const conn = peer.connect(teacherId);
        
        conn.on('open', () => {
            conn.send({ type: 'INFO', name: myName });
        });

        conn.on('data', data => {
            if (data.type === 'MONITOR_LIST') {
                // 先生から「監視端末が増えた」と通知が来たら、そこにも映像を送る
                data.ids.forEach(mId => {
                    if (!mediaCalls[mId]) {
                        peer.call(mId, localStream);
                        peer.connect(mId);
                    }
                });
            }
        });
    }

    // モニター端末が先生に接続
    function autoConnectMonitor() {
        const teacherId = "T-ROOM-" + currentRid;
        const conn = peer.connect(teacherId);
        conn.on('open', () => {
            conn.send({ type: 'REGISTER_MONITOR' });
        });
    }

    function handleData(id, data) {
        if (data.type === 'INFO') {
            studentInfo[id] = { name: data.name };
            updateDisplayName(id);
        } else if (data.type === 'REGISTER_MONITOR') {
            // 先生が新しい監視端末を認識
            if (!monitorIds.includes(id)) {
                monitorIds.push(id);
                // 全生徒に「この新しいモニターにも映像を送れ」と指示
                Object.values(dataConnections).forEach(conn => {
                    if (conn.peer.indexOf('T-ROOM') === -1 && conn.peer.indexOf('M-ROOM') === -1) {
                        conn.send({ type: 'MONITOR_LIST', ids: monitorIds });
                    }
                });
            }
        }
    }

    function addVideoGrid(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `card-${id}`;
        card.innerHTML = `<div id="c-name-${id}" style="font-size:12px;margin-bottom:5px;color:#00fbff;">...</div><video id="v-${id}" autoplay playsinline muted></video>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById(`v-${id}`).srcObject = stream;
        
        studentCount = Object.keys(studentStreams).length;
        document.getElementById('count-display').innerText = "接続: " + studentCount;
    }

    function addRoster(id) {
        if (myRole !== 'teacher' || document.getElementById(`roster-${id}`)) return;
        const div = document.createElement('div');
        div.className = 'roster-item';
        div.id = `roster-${id}`;
        div.innerHTML = `<span id="r-name-${id}">...</span>`;
        document.getElementById('roster-list').appendChild(div);
    }

    function updateDisplayName(id) {
        const name = studentInfo[id] ? studentInfo[id].name : "不明";
        if (document.getElementById(`r-name-${id}`)) document.getElementById(`r-name-${id}`).innerText = name;
        if (document.getElementById(`c-name-${id}`)) document.getElementById(`c-name-${id}`).innerText = name;
    }
</script>
</body>
</html>
