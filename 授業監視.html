<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Sync (0.1s Worker版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 10px; text-align: center; border-bottom: 2px solid #333; font-size: 14px; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .primary-view { flex: 3; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        #main-screen { max-width: 100%; max-height: 100%; object-fit: contain; }

        .monitor-sidebar { width: 300px; background: #151515; border-left: 1px solid #333; overflow-y: auto; padding: 10px; }
        .student-card { background: #222; margin-bottom: 15px; padding: 8px; border-radius: 10px; border: 1px solid #444; }
        .student-card img { width: 100%; background: #000; border-radius: 5px; min-height: 100px; display: block; }
        .student-info { font-size: 11px; color: #00d1ff; margin-bottom: 5px; display: flex; justify-content: space-between; }

        .setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #252525; padding: 30px; border-radius: 20px; text-align: center; width: 340px; box-shadow: 0 0 30px rgba(0,0,0,1); }
        button { padding: 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; margin: 10px 0; width: 100%; font-size: 16px; }
        .btn-teacher { background: #ff4757; color: white; }
        .btn-student { background: #2f3542; color: white; border: 1px solid #57606f; }
        input { padding: 15px; font-size: 24px; width: 100%; border-radius: 10px; border: 1px solid #444; background: #000; color: #00d1ff; text-align: center; box-sizing: border-box; }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 10px; }
        #my-status { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: #555; z-index: 100; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div style="margin-bottom:5px;">教員ID: <span id="display-id" style="font-weight:bold; color:#00fbff; font-size:20px;">----</span></div>
    <div id="status-log" style="font-size:11px; color:#888;">システム待機中</div>
</header>

<div class="main-layout">
    <div class="primary-view">
        <div id="teacher-qr-panel" class="hidden" style="text-align:center;">
            <div id="qrcode"></div>
            <p style="color:#888; font-size:12px; margin-top:10px;">生徒はQRを読み取って接続</p>
        </div>
        <img id="main-screen" class="hidden">
    </div>
    
    <div id="teacher-monitor" class="monitor-sidebar hidden">
        <p style="font-size:11px; color:#555; margin:0 0 10px 0;">STUDENT MONITOR (0.1s)</p>
        <div id="student-grid"></div>
    </div>
</div>

<div id="my-status">READY</div>

<!-- 裏側で動作させるためのビデオとキャンバス -->
<video id="v-hidden" autoplay playsinline muted class="hidden"></video>
<canvas id="c-hidden" class="hidden"></canvas>

<div id="setup-screen" class="setup-overlay">
    <div class="setup-box">
        <h2 style="margin-top:0; color:#00fbff;">High-Speed Monitor</h2>
        <button class="btn-teacher" onclick="initTeacher()">👨‍🏫 教員として配信・監視</button>
        <div style="margin: 20px 0; border-top: 1px solid #333;"></div>
        <input type="number" id="input-id" placeholder="教員IDを入力">
        <button class="btn-student" onclick="initStudent()">🎓 生徒として参加</button>
    </div>
</div>

<script>
    let peer;
    let connections = {};
    const canvas = document.getElementById('c-hidden');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('v-hidden');
    const statusLog = document.getElementById('status-log');

    // 【重要】別ウィンドウでも動作を止めないタイマー用Worker
    const workerCode = `
        let timer;
        self.onmessage = function(e) {
            if (e.data === 'start') {
                timer = setInterval(() => self.postMessage('tick'), 100);
            } else if (e.data === 'stop') {
                clearInterval(timer);
            }
        };
    `;
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const timerWorker = new Worker(URL.createObjectURL(workerBlob));

    function log(msg) { statusLog.innerText = msg; }

    // --- 教員モード ---
    async function initTeacher() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 } });
            video.srcObject = stream;
            document.getElementById('teacher-monitor').classList.remove('hidden');
            document.getElementById('teacher-qr-panel').classList.remove('hidden');
            document.getElementById('setup-screen').classList.add('hidden');

            peer = new Peer(Math.floor(1000 + Math.random() * 9000).toString());
            peer.on('open', id => {
                document.getElementById('display-id').innerText = id;
                new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('#')[0] + "#" + id, width: 140, height: 140 });
                log("ID: " + id + " で生徒の接続を待っています...");
                timerWorker.postMessage('start');
            });

            peer.on('connection', conn => {
                conn.on('open', () => {
                    log("生徒 " + conn.peer + " が接続しました");
                    const grid = document.getElementById('student-grid');
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.id = `card-${conn.peer}`;
                    card.innerHTML = `<div class="student-info"><span>生徒: ${conn.peer}</span><span id="pkt-${conn.peer}">0</span></div><img id="img-${conn.peer}">`;
                    grid.appendChild(card);
                    connections[conn.peer] = conn;
                });

                conn.on('data', data => {
                    if (data.type === 's-img') {
                        const img = document.getElementById(`img-${conn.peer}`);
                        const pkt = document.getElementById(`pkt-${conn.peer}`);
                        if (img) img.src = data.img;
                        if (pkt) pkt.innerText = parseInt(pkt.innerText) + 1;
                    }
                });

                conn.on('close', () => {
                    document.getElementById(`card-${conn.peer}`)?.remove();
                    delete connections[conn.peer];
                });
            });

            // 教員側送信ループ
            timerWorker.onmessage = () => {
                if (video.readyState >= 2) {
                    canvas.width = 900; canvas.height = (video.videoHeight/video.videoWidth)*900;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const img = canvas.toDataURL('image/jpeg', 0.4);
                    Object.values(connections).forEach(c => {
                        if(c.open && c.bufferedAmount === 0) c.send({type:'t-img', img});
                    });
                    document.getElementById('my-status').innerText = "SENDING (0.1s)";
                }
            };
        } catch (e) { alert("画面共有を許可してください"); }
    }

    // --- 生徒モード ---
    async function initStudent() {
        const tid = document.getElementById('input-id').value || window.location.hash.substring(1);
        if(!tid) return alert("IDを入力してください");

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' } });
            video.srcObject = stream;
            document.getElementById('setup-screen').classList.add('hidden');

            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(tid);
                conn.on('open', () => {
                    log("教員 ID:" + tid + " に接続中...");
                    document.getElementById('main-screen').classList.remove('hidden');
                    timerWorker.postMessage('start');
                    
                    timerWorker.onmessage = () => {
                        if (conn.open && video.readyState >= 2 && conn.bufferedAmount === 0) {
                            canvas.width = 320;
                            canvas.height = (video.videoHeight/video.videoWidth)*320;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            conn.send({ type: 's-img', img: canvas.toDataURL('image/jpeg', 0.3) });
                            document.getElementById('my-status').innerText = "UPLOADING (0.1s)";
                        }
                    };
                });
                conn.on('data', data => {
                    if (data.type === 't-img') document.getElementById('main-screen').src = data.img;
                });
                conn.on('close', () => location.reload());
            });
        } catch (e) { alert("画面共有を許可してください"); }
    }

    window.onload = () => { if(window.location.hash) document.getElementById('input-id').value = window.location.hash.substring(1); };
</script>
</body>
</html>
