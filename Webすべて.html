<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone画面共有 診断機能付</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #111; color: white; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #222; padding: 20px; border-radius: 20px; }
        button { width: 100%; padding: 16px; margin: 10px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #007bff; color: white; }
        .btn-sub { background: #444; color: white; }
        #error-log { color: #ff5555; background: #331111; padding: 10px; border-radius: 8px; font-size: 12px; margin: 10px 0; text-align: left; display: none; overflow-wrap: break-word; }
        video { width: 100%; border-radius: 10px; display: none; margin-top: 10px; }
        .id-display { font-size: 42px; font-weight: bold; color: #00d1ff; letter-spacing: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>高速画面共有</h2>
    
    <!-- エラー表示エリア -->
    <div id="error-log"></div>

    <div id="mode-selection">
        <button class="btn-main" onclick="initSender('screen')">💻 画面を共有する</button>
        <p style="font-size:12px; color:#aaa;">iPhoneの場合、Safari以外では動作しません</p>
        <button class="btn-sub" onclick="showMonitor()">🖥️ 別の画面を見る</button>
    </div>

    <div id="screen-ui" class="hidden">
        <p>4桁ID: <span class="id-display" id="my-id-text">----</span></p>
        <div id="qrcode"></div>
        <video id="temp-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
        <button class="btn-sub" onclick="location.reload()">終了</button>
    </div>

    <div id="monitor-ui" class="hidden">
        <input type="number" id="peer-id-input" pattern="\d*" placeholder="0000" inputmode="numeric" style="padding:15px; width:120px; font-size:24px; text-align:center; border-radius:10px;">
        <button class="btn-main" onclick="connectToNewPeer()">接続</button>
        <div id="monitor-grid" style="margin-top:15px;"></div>
    </div>
</div>

<script>
    function logError(msg) {
        const log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerText += msg + "\n";
    }

    async function initSender(type) {
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        // 診断チェック
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            logError("❌ このブラウザは画面共有(getDisplayMedia)に対応していません。Safariで開いていますか？");
            return;
        }
        if (location.protocol !== 'https:') {
            logError("❌ HTTPS接続ではありません。セキュリティ制限により画面共有は実行できません。");
        }

        try {
            logError("⏳ 画面共有を要求中...");
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: 15 }
            });
            video.srcObject = stream;
            video.style.display = "block";
            showUI('screen-ui');

            const peer = new Peer(Math.floor(1000 + Math.random() * 9000).toString());
            peer.on('open', (id) => {
                document.getElementById('my-id-text').innerText = id;
                new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150 });
            });
            peer.on('connection', (conn) => {
                setInterval(() => {
                    if (conn.open && video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = 480;
                        canvas.height = 480 * (video.videoHeight / video.videoWidth);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send(canvas.toDataURL('image/jpeg', 0.3));
                    }
                }, 100);
            });
            peer.on('error', e => logError("PeerJS Error: " + e.type));

        } catch (e) {
            logError("❌ エラー詳細: " + e.name + " - " + e.message);
        }
    }

    function showMonitor() { showUI('monitor-ui'); window.peer = new Peer(); }
    function connectToNewPeer() {
        const targetId = document.getElementById('peer-id-input').value;
        const conn = window.peer.connect(targetId, { reliable: false });
        const img = document.createElement('img');
        img.style.width = "100%";
        document.getElementById('monitor-grid').appendChild(img);
        conn.on('data', data => img.src = data);
    }
    function showUI(id) {
        document.getElementById('mode-selection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
