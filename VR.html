<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Crimson Festival VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: serif; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; background: radial-gradient(circle, #100, #000); color: #fff; }
        .start-btn { padding: 20px 60px; background: #ff0000; color: #fff; border: 2px solid #fff; font-size: 1.5rem; cursor: pointer; font-weight: bold; border-radius: 5px; box-shadow: 0 0 30px #ff0000; letter-spacing: 0.2em; }
        #hud { position: fixed; top: 20px; left: 20px; color: #ff3333; z-index: 1000; pointer-events: none; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 3rem; color: #ff3333; text-shadow: 0 0 20px #ff0000;">祝祭・月詠</h1>
        <p>紅く染まる神域の夜へ</p>
        <button class="start-btn" onclick="startVR()">LINK START</button>
    </div>

    <div id="hud">SYSTEM: RED_FESTIVAL_SYNC<br>USERS: <span id="user-count">1</span></div>

    <!-- マルチプレイ設定 -->
    <a-scene networked-scene="room: tsukuyomi-red-festival; adapter: socketio; serverURL: https://naf-naver-signaling.glitch.me/;" webxr="requiredFeatures: local-floor;">
        
        <a-assets>
            <template id="avatar-template"><a-entity class="avatar"><a-sphere radius="0.3" color="#ff0000" material="emissive:#ff0000; emissiveIntensity:3"></a-sphere></a-entity></template>
        </a-assets>

        <!-- 夜空と青い星雲 -->
        <a-sky color="#00020a"></a-sky>
        <a-entity id="nebula-clouds"></a-entity> 

        <!-- 鏡面反射の水面 -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="1000" height="1000" reflector="color: #111; opacity: 1; resolution: 256;"></a-plane>

        <!-- 参道の橋 -->
        <a-entity id="bridge" position="0 0 0">
            <a-box width="5" height="0.4" depth="200" position="0 -0.2 -50" color="#111"></a-box>
            <a-entity id="railings"></a-entity>
        </a-entity>

        <!-- 赤く光り輝く鳥居と光柱 -->
        <a-entity id="glowing-torii" position="0 0 -45" scale="1.3 1.3 1.3">
            <!-- 鳥居本体（高輝度赤色発光） -->
            <!-- 柱 -->
            <a-cylinder radius="1.4" height="30" position="-12 15 0" material="color:#ff0000; emissive:#ff0000; emissiveIntensity:5"></a-cylinder>
            <a-cylinder radius="1.4" height="30" position="12 15 0" material="color:#ff0000; emissive:#ff0000; emissiveIntensity:5"></a-cylinder>
            <!-- 梁 -->
            <a-box width="36" height="2.5" depth="3" position="0 30 0" material="color:#ff0000; emissive:#ff0000; emissiveIntensity:5"></a-box>
            <a-box width="28" height="2" depth="2.5" position="0 22 0" material="color:#ff0000; emissive:#ff0000; emissiveIntensity:5"></a-box>
            
            <!-- 天を貫く光の柱 -->
            <a-cylinder radius="0.4" height="800" position="0 400 0" material="shader:flat; color:#fff; transparent:true; opacity:0.7"></a-cylinder>
            
            <!-- 周囲を照らす赤い光 -->
            <a-light type="point" intensity="4" distance="60" color="#ff0000" position="0 15 0"></a-light>
        </a-entity>

        <!-- 浮遊するネオン船 -->
        <a-entity id="flying-ships"></a-entity>

        <!-- 祝祭のパーティクル -->
        <a-entity id="particles"></a-entity>

        <!-- プレイヤー（アバター同期） -->
        <a-entity id="rig" position="0 0 0" networked="template:#avatar-template;attachTemplateToLocal:false;">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#ff3333" radius-inner="0.01" radius-outer="0.015" position="0 0 -1" opacity="0.7"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#001" intensity="0.3"></a-light>
    </a-scene>

    <script>
        const nebula = document.getElementById('nebula-clouds');
        const railings = document.getElementById('railings');
        const ships = document.getElementById('flying-ships');
        const particles = document.getElementById('particles');

        // 青い雲の生成
        for(let i=0; i<40; i++){
            let s = document.createElement('a-sphere');
            let x = (Math.random()-0.5)*180;
            let y = 15 + Math.random()*50;
            let z = -40 - Math.random()*120;
            s.setAttribute('position', `${x} ${y} ${z}`);
            s.setAttribute('radius', 12 + Math.random()*25);
            s.setAttribute('material', `color:#0044ff; opacity:0.1; transparent:true; shader:flat`);
            nebula.appendChild(s);
        }

        // 橋の欄干
        for(let i=0; i<50; i++){
            let z = -i * 4;
            [ -2.8, 2.8 ].forEach(x => {
                let p = document.createElement('a-cylinder');
                p.setAttribute('position', `${x} 0.6 ${z}`);
                p.setAttribute('radius', 0.15); p.setAttribute('height', 1.4); p.setAttribute('color', '#222');
                railings.appendChild(p);
            });
        }

        // ネオン船の巡回
        for(let i=0; i<5; i++){
            let ship = document.createElement('a-entity');
            let x = (i % 2 == 0 ? -50 : 50);
            ship.setAttribute('position', `${x} ${25 + i*8} ${-70 - i*15}`);
            ship.innerHTML = `
                <a-box width="12" height="2" depth="4" color="#111">
                    <a-box width="13" height="0.1" depth="0.1" position="0 1 2.1" material="color:#0ff; emissive:#0ff; emissiveIntensity:4"></a-box>
                    <a-box width="13" height="0.1" depth="0.1" position="0 -1 2.1" material="color:#f0f; emissive:#f0f; emissiveIntensity:4"></a-box>
                </a-box>
            `;
            ships.appendChild(ship);
        }

        // 祝祭の光の粒
        for(let i=0; i<250; i++){
            let p = document.createElement('a-sphere');
            p.setAttribute('radius', 0.04);
            let colors = ['#ff0000', '#00ffff', '#fff'];
            let c = colors[i % 3];
            p.setAttribute('material', `color:${c}; emissive:${c}; emissiveIntensity:3; shader:flat`);
            let x = (Math.random()-0.5)*80;
            let y = Math.random()*40;
            let z = (Math.random()-0.5)*120 - 50;
            p.setAttribute('position', `${x} ${y} ${z}`);
            p.setAttribute('animation', `property:position; to:${x} ${y+4} ${z}; dur:${2500+Math.random()*3000}; dir:alternate; loop:true; easing:easeInOutSine`);
            particles.appendChild(p);
        }

        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 5.0; // 移動増幅
        let lastPos = new THREE.Vector3();

        function startVR() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);
            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', { x: rigPos.x + (delta.x * (AMPLIFIER - 1)), y: 0, z: rigPos.z + (delta.z * (AMPLIFIER - 1)) });
            }
            lastPos.copy(currentPos);
            
            const nUsers = document.querySelectorAll('[networked]').length;
            document.getElementById('user-count').innerText = nUsers;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
