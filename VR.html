<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Physical Walk Sync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0, 10, 20, 0.9); color: #0ff; z-index: 2000;
            text-align: center; padding: 20px;
        }
        .btn {
            background: transparent; color: #0ff; border: 2px solid #0ff;
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 15px #0ff; margin-top: 20px;
        }
        #status-hud {
            position: fixed; top: 10px; left: 10px; color: #0ff; font-family: monospace;
            z-index: 1000; pointer-events: none; text-shadow: 0 0 5px #0ff;
        }
    </style>
</head>
<body>

    <div id="status-hud">
        TSUKUYOMI_SYSTEM: ACTIVE<br>
        WALK_SYNC: <span id="walk-data">READY</span><br>
        STEPS: <span id="step-count">0</span>
    </div>

    <div id="overlay">
        <h1>TSUKUYOMI LINK</h1>
        <p>スマホを持って「その場足踏み」するか、<br>実際に一歩踏み出すとVR空間を進みます。</p>
        <button class="btn" onclick="startSystem()">SYNC START</button>
    </div>

    <a-scene background="color: #000" fog="type: linear; color: #000; near: 10; far: 50">
        
        <!-- ツクヨミの月 -->
        <a-entity position="0 20 -80">
            <a-sphere radius="10" color="#fff" material="shader: flat"></a-sphere>
            <a-ring color="#0ff" radius-inner="12" radius-outer="12.2" rotation="90 0 0"></a-ring>
        </a-entity>

        <!-- 地面のグリッド（進んでいる感が出る） -->
        <a-grid position="0 0 0" cell-size="2" section-size="10" color="#111" section-color="#0ff" opacity="0.5"></a-grid>

        <!-- サイバー竹林 -->
        <a-entity id="bamboo-forest"></a-entity>

        <!-- プレイヤーリグ -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls wasd-controls-enabled="false">
                <a-cursor color="#0ff"></a-cursor>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#444"></a-light>
        <a-light type="point" position="0 5 0" color="#0ff" intensity="1.5"></a-light>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        const stepDisplay = document.getElementById('step-count');
        
        let stepCount = 0;
        let isMoving = false;
        const moveSpeed = 0.8; // 一歩で進む距離（メートル）

        // 1. 竹林の生成
        const forest = document.getElementById('bamboo-forest');
        for (let i = 0; i < 100; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 100;
            const z = (Math.random() - 0.5) * 100;
            const h = 5 + Math.random() * 10;
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.1');
            b.setAttribute('height', h);
            b.setAttribute('color', Math.random() > 0.5 ? '#00ffcc' : '#ff00ff');
            b.setAttribute('material', 'emissive: #0ff; emissiveIntensity: 0.5');
            forest.appendChild(b);
        }

        // 2. システム開始（センサー許可）
        async function startSystem() {
            // iOSのセンサー許可リクエスト
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                const permission = await DeviceMotionEvent.requestPermission();
                if (permission !== 'granted') {
                    alert('センサーの許可が必要です');
                    return;
                }
            }

            document.getElementById('overlay').style.display = 'none';
            initStepDetection();
        }

        // 3. 歩行検知ロジック
        function initStepDetection() {
            let lastAccel = 0;
            const threshold = 12; // 振動の強さ（歩いたとみなす感度）

            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (!acc) return;

                // 3軸の加速度から衝撃の強さを計算
                const totalAccel = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
                const delta = Math.abs(totalAccel - lastAccel);

                // 衝撃がしきい値を超えたら「一歩」とみなす
                if (delta > threshold && !isMoving) {
                    executeStep();
                }
                lastAccel = totalAccel;
            });
        }

        // 4. VR空間内での移動実行
        function executeStep() {
            isMoving = true;
            stepCount++;
            stepDisplay.innerText = stepCount;

            // カメラが向いている方向を取得
            const rotation = camera.getAttribute('rotation');
            const angle = (rotation.y) * (Math.PI / 180);

            // 向いている方向に座標を計算
            const currentPos = rig.getAttribute('position');
            const dx = -Math.sin(angle) * moveSpeed;
            const dz = -Math.cos(angle) * moveSpeed;

            // アニメーションで滑らかに移動
            const newPos = {
                x: currentPos.x + dx,
                y: currentPos.y,
                z: currentPos.z + dz
            };
            
            rig.setAttribute('animation', `property: position; to: ${newPos.x} ${newPos.y} ${newPos.z}; dur: 300; easing: easeOutQuad`);

            // 連続検知を防ぐためのクールタイム
            setTimeout(() => { isMoving = false; }, 400);
        }
    </script>
</body>
</html>
