<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Sunset Torii VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- A-Frame 本体 -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            background: #2b2c5c; color: #fff; font-family: "serif"; text-align: center;
        }
        .start-btn {
            margin-top: 20px; padding: 20px 50px; background: #b40000;
            border: 2px solid #fff; color: #fff; font-size: 1.5rem;
            cursor: pointer; border-radius: 10px; font-weight: bold;
        }
        #hud {
            position: fixed; top: 20px; left: 20px; color: #fff; z-index: 1000;
            pointer-events: none; text-shadow: 2px 2px 4px #000; font-family: serif;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 2.5rem; margin: 0;">ツクヨミ - 境界の海</h1>
        <p>※現実で動くとVR内でも移動します</p>
        <button class="start-btn" onclick="startVR()">世界へ入る</button>
    </div>

    <div id="hud">
        SYSTEM: TSUKUYOMI_LINK<br>
        6DoF Tracking: <span id="status">Active</span>
    </div>

    <!-- 
      webxr="requiredFeatures: local-floor" により、VRモードでも
      インサイドアウト・トラッキング（現実の歩行との同期）を有効にします。
    -->
    <a-scene webxr="requiredFeatures: local-floor; referenceSpaceType: local-floor">
        
        <a-assets>
            <!-- 雲の質感を出すためのテクスチャ（簡易） -->
            <canvas id="cloudTexture" width="256" height="256"></canvas>
        </a-assets>

        <!-- 1. 夕暮れの空：大きな球体で作成（確実に見えるように） -->
        <a-sky color="#f2a6a1" animation="property: material.color; from: #2b2c5c; to: #f2a6a1; dur: 5000; dir: alternate; loop: true"></a-sky>
        
        <!-- 遠くの巨大な雲（画像の雰囲気を再現） -->
        <a-entity position="0 0 -100">
            <a-sphere position="40 20 -20" radius="30" color="#f2a6a1" opacity="0.8"></a-sphere>
            <a-sphere position="-50 15 -10" radius="25" color="#fff" opacity="0.6"></a-sphere>
            <a-sphere position="10 30 -40" radius="20" color="#ffccaa" opacity="0.7"></a-sphere>
        </a-entity>

        <!-- 2. 水面：完全に不透明な鏡面に近い床 -->
        <a-plane id="water" position="0 0 0" rotation="-90 0 0" width="2000" height="2000" 
                 material="color: #1a1a3a; metalness: 0.8; roughness: 0.2; shader: standard;">
        </a-plane>

        <!-- 3. 画像のような巨大な赤い鳥居 -->
        <a-entity id="torii" position="0 0 -40">
            <!-- 柱（左・右） -->
            <a-cylinder color="#b40000" radius="1.5" height="40" position="-15 20 0"></a-cylinder>
            <a-cylinder color="#b40000" radius="1.5" height="40" position="15 20 0"></a-cylinder>
            <!-- 笠木（一番上の横棒） -->
            <a-box color="#b40000" width="45" height="3" depth="3.5" position="0 40 0"></a-box>
            <a-box color="#222" width="46" height="1.5" depth="4" position="0 42 0"></a-box>
            <!-- 貫（下の横棒） -->
            <a-box color="#b40000" width="35" height="2.5" depth="3" position="0 30 0"></a-box>
            <!-- 額束（真ん中の板） -->
            <a-box color="#b40000" width="4" height="7" depth="2" position="0 35 0"></a-box>
        </a-entity>

        <!-- 4. 灯籠流し（画像のように水面に無数に配置） -->
        <a-entity id="lanterns"></a-entity>

        <!-- プレイヤー（カメラ） -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls wasd-controls-enabled="false">
                <!-- スマコン風の視点カーソル -->
                <a-entity cursor="fuse: false" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                          material="color: #fff; shader: flat; opacity: 0.5">
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- ライティング -->
        <a-light type="ambient" color="#ffaa99" intensity="0.6"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="0.8" color="#ffccaa"></a-light>

    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const cam = document.getElementById('camera');
        const AMPLIFIER = 5.0; // 移動倍率（5倍速）
        let lastPos = new THREE.Vector3();

        // 5. 灯籠を大量生成
        const lanternContainer = document.getElementById('lanterns');
        for (let i = 0; i < 150; i++) {
            const l = document.createElement('a-entity');
            const x = (Math.random() - 0.5) * 300;
            const z = (Math.random() - 0.5) * 300;
            // 鳥居の近くを通りやすく配置
            l.setAttribute('position', `${x} 0.1 ${z}`);
            l.innerHTML = `
                <a-box width="0.8" height="1" depth="0.8" color="#fff" material="emissive: #ff8800; emissiveIntensity: 1;">
                    <a-light type="point" color="#ff8800" intensity="0.5" distance="4"></a-light>
                </a-box>
                <a-box width="1" height="0.1" depth="1" color="#331100" position="0 -0.5 0"></a-box>
            `;
            // ゆらゆら揺れるアニメーション
            l.setAttribute('animation', `property: position; to: ${x} 0.4 ${z}; dur: ${2000 + Math.random()*2000}; dir: alternate; loop: true; easing: easeInOutSine`);
            lanternContainer.appendChild(l);
        }

        function startVR() {
            const scene = document.querySelector('a-scene');
            // ARではなくVRモードで入ることで「空」と「水面」を表示させる
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                animate();
            }
        }

        function animate() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);

            // インサイドアウト・トラッキングの移動量を増幅
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);
            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', {
                    x: rigPos.x + (delta.x * (AMPLIFIER - 1)),
                    y: rigPos.y, // 高さは固定して水面を歩く
                    z: rigPos.z + (delta.z * (AMPLIFIER - 1))
                });
            }

            lastPos.copy(currentPos);
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
