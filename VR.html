<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Bridge Only VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: "Hiragino Mincho ProN", serif; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; background: radial-gradient(circle, #001, #000); color: #fff; text-align: center; }
        .start-btn { padding: 20px 60px; background: #5D4037; color: #fff; border: 2px solid #fff9c4; font-size: 1.5rem; cursor: pointer; border-radius: 5px; box-shadow: 0 0 30px #fff9c4; }
        #hud { position: fixed; top: 20px; left: 20px; color: #fff9c4; z-index: 1000; pointer-events: none; text-shadow: 2px 2px 4px #000; font-size: 14px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 2.5rem; color: #fff9c4;">月詠 - TSUKUYOMI</h1>
        <p>【橋上移動制限システム稼働中】<br>茶色の橋の上のみを歩けます</p>
        <button class="start-btn" onclick="startVR()">LINK START</button>
    </div>

    <div id="hud">
        STATUS: BRIDGE_RESTRICTED<br>
        USERS: <span id="user-count">1</span>
    </div>

    <a-scene networked-scene="room: tsukuyomi-final-bridge; adapter: socketio; serverURL: https://naf-naver-signaling.glitch.me/;" webxr="requiredFeatures: local-floor;">
        
        <a-assets>
            <template id="avatar-template">
                <a-entity class="avatar">
                    <a-sphere radius="0.3" color="#fff9c4" material="emissive:#fff9c4; emissiveIntensity:3"></a-sphere>
                </a-entity>
            </template>
        </a-assets>

        <!-- 夜空と星雲 -->
        <a-sky color="#00020a"></a-sky>
        <a-entity id="nebula-clouds"></a-entity> 

        <!-- 反射する海 (Y=0) -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="2000" height="2000" 
                 reflector="color: #111; opacity: 1; resolution: 256;"></a-plane>

        <!-- 茶色の木の橋 (水面上 Y=0.2) -->
        <a-entity id="bridge-container" position="0 0.2 0">
            <!-- 橋の床板 -->
            <a-box width="5.0" height="0.4" depth="400" position="0 -0.2 -150" color="#5D4037" material="roughness: 1;"></a-box>
            <!-- 欄干 -->
            <a-entity id="railings"></a-entity>
        </a-entity>

        <!-- 明るく光り輝く鳥居 -->
        <a-entity id="glowing-torii" position="0 0 -50" scale="1.4 1.4 1.4">
            <a-cylinder radius="1.4" height="30" position="-12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-cylinder>
            <a-cylinder radius="1.4" height="30" position="12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-cylinder>
            <a-box width="38" height="2.5" depth="3" position="0 30 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-box>
            <!-- 光柱 -->
            <a-cylinder radius="0.6" height="1500" position="0 750 0" material="shader:flat; color:#fff; transparent:true; opacity:0.6"></a-cylinder>
            <a-light type="point" intensity="6" distance="80" color="#fff9c4" position="0 15 0"></a-light>
        </a-entity>

        <!-- エフェクト -->
        <a-entity id="fx"></a-entity>

        <!-- プレイヤーリグ -->
        <a-entity id="rig" position="0 0.5 0" networked="template:#avatar-template;attachTemplateToLocal:false;">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#fff9c4" radius-inner="0.01" radius-outer="0.015" position="0 0 -1" opacity="0.8"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#112" intensity="0.5"></a-light>
    </a-scene>

    <script>
        const nebula = document.getElementById('nebula-clouds');
        const railings = document.getElementById('railings');
        const fx = document.getElementById('fx');

        // 星雲・欄干・パーティクルの生成
        for(let i=0; i<40; i++){
            let s = document.createElement('a-sphere');
            s.setAttribute('position', `${(Math.random()-0.5)*200} ${30+Math.random()*50} ${-50-Math.random()*150}`);
            s.setAttribute('radius', 15+Math.random()*30);
            s.setAttribute('material', `color:#0033ff; opacity:0.08; transparent:true; shader:flat`);
            nebula.appendChild(s);
        }
        for(let i=0; i<100; i++){
            let z = -i * 4;
            [ -2.5, 2.5 ].forEach(x => {
                let p = document.createElement('a-cylinder');
                p.setAttribute('position', `${x} 0.6 ${z}`);
                p.setAttribute('radius', 0.15); p.setAttribute('height', 1.4); p.setAttribute('color', '#3E2723');
                railings.appendChild(p);
            });
        }
        for(let i=0; i<200; i++){
            let p = document.createElement('a-sphere');
            let color = ['#fff9c4', '#00ffff', '#ff66ff'][i%3];
            p.setAttribute('radius', 0.05);
            p.setAttribute('material', `color:${color}; emissive:${color}; emissiveIntensity:4; shader:flat`);
            p.setAttribute('position', `${(Math.random()-0.5)*100} ${Math.random()*40} ${-100+Math.random()*200}`);
            fx.appendChild(p);
        }

        // --- 移動制限ロジック ---
        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 5.0; 
        const BRIDGE_WIDTH_LIMIT = 2.2; // 橋から出られない限界値 (左右2.2m)
        let lastPos = new THREE.Vector3();

        function startVR() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentCamPos = new THREE.Vector3();
            currentCamPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentCamPos, lastPos);

            if (delta.length() > 0.001) {
                const currentRigPos = rig.getAttribute('position');
                
                // 次の移動先を計算
                let nextX = currentRigPos.x + (delta.x * (AMPLIFIER - 1));
                let nextZ = currentRigPos.z + (delta.z * (AMPLIFIER - 1));

                // ★橋の幅（左右）の制限チェック
                // 橋の幅を超えようとしたら、X軸の移動をキャンセルする
                if (Math.abs(nextX) > BRIDGE_WIDTH_LIMIT) {
                    nextX = currentRigPos.x; 
                }

                // 位置を更新 (高さは橋の上の0.5mに固定)
                rig.setAttribute('position', { x: nextX, y: 0.5, z: nextZ });
            }

            lastPos.copy(currentCamPos);
            const nUsers = document.querySelectorAll('[networked]').length;
            document.getElementById('user-count').innerText = nUsers;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
