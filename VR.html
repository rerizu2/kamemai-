<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Glowing Torii Bridge VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: serif; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; background: radial-gradient(circle, #001a33, #000); color: #fff; }
        .start-btn { padding: 20px 60px; background: #fff9c4; color: #5d4037; border: none; font-size: 1.5rem; cursor: pointer; font-weight: bold; border-radius: 5px; box-shadow: 0 0 30px #fff9c4; letter-spacing: 0.2em; }
        #hud { position: fixed; top: 20px; left: 20px; color: #fff9c4; z-index: 1000; pointer-events: none; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 3rem; color: #fff9c4; text-shadow: 0 0 20px #fff9c4;">祝祭・月詠</h1>
        <p>光り輝く鳥居と茶色の橋の境界へ</p>
        <button class="start-btn" onclick="startVR()">LINK START</button>
    </div>

    <div id="hud">SYSTEM: TSUKUYOMI_LINK<br>FIELD: GLOWING_SEA_BRIDGE</div>

    <a-scene networked-scene="room: tsukuyomi-final-v1; adapter: socketio; serverURL: https://naf-naver-signaling.glitch.me/;" webxr="requiredFeatures: local-floor;">
        
        <a-assets>
            <template id="avatar-template"><a-entity class="avatar"><a-sphere radius="0.3" color="#fff9c4" material="emissive:#fff9c4; emissiveIntensity:3"></a-sphere></a-entity></template>
        </a-assets>

        <!-- 夜空と星雲 -->
        <a-sky color="#000510"></a-sky>
        <a-entity id="nebula-clouds"></a-entity> 

        <!-- 鏡面反射する海 -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="1500" height="1500" reflector="color: #111; opacity: 1; resolution: 256;"></a-plane>

        <!-- スタート位置から続く茶色の橋 -->
        <a-entity id="wooden-bridge" position="0 0 0">
            <!-- 橋の床板（茶色） -->
            <a-box width="5" height="0.4" depth="250" position="0 -0.2 -70" color="#5D4037" material="roughness: 0.8;"></a-box>
            <!-- 橋の欄干 -->
            <a-entity id="railings"></a-entity>
        </a-entity>

        <!-- 明るく光り輝く鳥居 -->
        <a-entity id="glowing-torii" position="0 0 -45" scale="1.4 1.4 1.4">
            <!-- 鳥居本体（高輝度イエローホワイト発光） -->
            <a-cylinder radius="1.4" height="30" position="-12 15 0" material="color:#fff9c4; emissive:#fff9c4; emissiveIntensity:5"></a-cylinder>
            <a-cylinder radius="1.4" height="30" position="12 15 0" material="color:#fff9c4; emissive:#fff9c4; emissiveIntensity:5"></a-cylinder>
            <a-box width="36" height="2.5" depth="3" position="0 30 0" material="color:#fff9c4; emissive:#fff9c4; emissiveIntensity:5"></a-box>
            <a-box width="28" height="2" depth="2.5" position="0 22 0" material="color:#fff9c4; emissive:#fff9c4; emissiveIntensity:5"></a-box>
            
            <!-- 天を貫く光の柱 -->
            <a-cylinder radius="0.5" height="1000" position="0 500 0" material="shader:flat; color:#fff; transparent:true; opacity:0.8"></a-cylinder>
            
            <!-- 周囲を照らす黄金の光 -->
            <a-light type="point" intensity="5" distance="70" color="#fff9c4" position="0 15 0"></a-light>
        </a-entity>

        <!-- 宙を浮くネオン船とパーティクル -->
        <a-entity id="flying-ships"></a-entity>
        <a-entity id="festive-particles"></a-entity>

        <!-- プレイヤーリグ -->
        <a-entity id="rig" position="0 0 0" networked="template:#avatar-template;attachTemplateToLocal:false;">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#fff9c4" radius-inner="0.01" radius-outer="0.015" position="0 0 -1" opacity="0.8"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#112" intensity="0.3"></a-light>
    </a-scene>

    <script>
        const nebula = document.getElementById('nebula-clouds');
        const railings = document.getElementById('railings');
        const ships = document.getElementById('flying-ships');
        const particles = document.getElementById('festive-particles');

        // 青い星雲の生成
        for(let i=0; i<40; i++){
            let s = document.createElement('a-sphere');
            let x = (Math.random()-0.5)*200;
            let y = 20 + Math.random()*50;
            let z = -40 - Math.random()*150;
            s.setAttribute('position', `${x} ${y} ${z}`);
            s.setAttribute('radius', 15 + Math.random()*30);
            s.setAttribute('material', `color:#0044ff; opacity:0.1; transparent:true; shader:flat`);
            nebula.appendChild(s);
        }

        // 橋の欄干（茶色の支柱）
        for(let i=0; i<60; i++){
            let z = -i * 4;
            [ -2.7, 2.7 ].forEach(x => {
                let p = document.createElement('a-cylinder');
                p.setAttribute('position', `${x} 0.6 ${z}`);
                p.setAttribute('radius', 0.12); p.setAttribute('height', 1.4); p.setAttribute('color', '#3E2723');
                railings.appendChild(p);
            });
        }

        // ネオン船
        for(let i=0; i<6; i++){
            let ship = document.createElement('a-entity');
            let x = (i % 2 == 0 ? -60 : 60);
            ship.setAttribute('position', `${x} ${30 + i*10} ${-80 - i*20}`);
            ship.innerHTML = `
                <a-box width="15" height="2" depth="5" color="#111">
                    <a-box width="16" height="0.1" depth="0.1" position="0 1 2.6" material="color:#0ff; emissive:#0ff; emissiveIntensity:4"></a-box>
                    <a-box width="16" height="0.1" depth="0.1" position="0 -1 2.6" material="color:#f0f; emissive:#f0f; emissiveIntensity:4"></a-box>
                </a-box>
            `;
            ships.appendChild(ship);
        }

        // 祝祭の光
        for(let i=0; i<300; i++){
            let p = document.createElement('a-sphere');
            p.setAttribute('radius', 0.05);
            let colors = ['#fff9c4', '#00ffff', '#ff66ff'];
            let c = colors[i % 3];
            p.setAttribute('material', `color:${c}; emissive:${c}; emissiveIntensity:3; shader:flat`);
            let x = (Math.random()-0.5)*100;
            let y = Math.random()*50;
            let z = (Math.random()-0.5)*150 - 50;
            p.setAttribute('position', `${x} ${y} ${z}`);
            p.setAttribute('animation', `property:position; to:${x} ${y+5} ${z}; dur:${3000+Math.random()*3000}; dir:alternate; loop:true; easing:easeInOutSine`);
            particles.appendChild(p);
        }

        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 5.0; // 5倍速移動
        let lastPos = new THREE.Vector3();

        function startVR() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);
            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', { x: rigPos.x + (delta.x * (AMPLIFIER - 1)), y: 0, z: rigPos.z + (delta.z * (AMPLIFIER - 1)) });
            }
            lastPos.copy(currentPos);
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
