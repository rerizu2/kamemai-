<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Minimalist Torii Sea</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            background: linear-gradient(to bottom, #302b63, #f2a6a1); color: #fff;
            font-family: "serif"; text-align: center;
        }
        .start-btn {
            margin-top: 20px; padding: 18px 45px; background: #880000;
            border: 1px solid #fff; color: #fff; font-size: 1.2rem;
            cursor: pointer; border-radius: 4px; letter-spacing: 0.2em;
        }
        #hud {
            position: fixed; top: 20px; left: 20px; color: #fff; z-index: 1000;
            pointer-events: none; font-family: serif; opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-weight: normal;">ツクヨミ</h1>
        <p>静寂の境界へ</p>
        <button class="start-btn" onclick="startVR()">LINK START</button>
    </div>

    <div id="hud">
        LOCATION: THE BOUNDARY SEA<br>
        SYNC: <span id="sync-val">1.0</span>
    </div>

    <a-scene webxr="requiredFeatures: local-floor; referenceSpaceType: local-floor" renderer="antialias: true">
        
        <!-- 1. 夕暮れの空：球体オブジェクトではなく、シーン全体の背景色として設定 -->
        <a-sky color="#f2a6a1" material="shader: flat"
               animation="property: material.color; from: #302b63; to: #f2a6a1; dur: 8000; dir: alternate; loop: true">
        </a-sky>

        <!-- 2. 反射する水面：大きな球体などの邪魔なものを排除した平らな海 -->
        <a-plane id="water" position="0 0 0" rotation="-90 0 0" width="3000" height="3000" 
                 material="color: #1a1a3a; metalness: 0.7; roughness: 0.2; opacity: 0.95;">
        </a-plane>

        <!-- 3. 画像を模した巨大な赤い鳥居 -->
        <a-entity id="torii" position="0 0 -60" scale="1.2 1.2 1.2">
            <!-- 柱 -->
            <a-cylinder color="#b40000" radius="1.8" height="45" position="-18 22.5 0"></a-cylinder>
            <a-cylinder color="#b40000" radius="1.8" height="45" position="18 22.5 0"></a-cylinder>
            <!-- 横棒（上・下） -->
            <a-box color="#b40000" width="55" height="3.5" depth="4" position="0 45 0"></a-box>
            <a-box color="#111" width="56" height="1.5" depth="4.5" position="0 47 0"></a-box>
            <a-box color="#b40000" width="40" height="2.5" depth="3.5" position="0 34 0"></a-box>
            <!-- 中央の板 -->
            <a-box color="#b40000" width="5" height="8" depth="2.2" position="0 39 0"></a-box>
        </a-entity>

        <!-- 4. 水面の灯籠（小さな光の点として配置） -->
        <a-entity id="lantern-field"></a-entity>

        <!-- プレイヤーリグ（インサイドアウト・トラッキング＋移動倍率） -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <!-- 視点ガイド -->
                <a-ring color="#fff" radius-inner="0.005" radius-outer="0.008" position="0 0 -1" opacity="0.3"></a-ring>
            </a-camera>
        </a-entity>

        <!-- 光源設定 -->
        <a-light type="ambient" color="#ff99aa" intensity="0.5"></a-light>
        <a-light type="directional" position="-2 4 2" intensity="0.7" color="#ffccaa"></a-light>

    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 6.0; // 移動倍率：6倍（さらに早く移動可能）
        let lastPos = new THREE.Vector3();

        // 灯籠をランダムに配置
        const field = document.getElementById('lantern-field');
        for (let i = 0; i < 250; i++) {
            const l = document.createElement('a-entity');
            const x = (Math.random() - 0.5) * 500;
            const z = (Math.random() - 0.5) * 500;
            l.setAttribute('position', `${x} 0.2 ${z}`);
            l.innerHTML = `
                <a-box width="0.7" height="0.9" depth="0.7" color="#fff" material="emissive: #ffaa00; emissiveIntensity: 1.2;">
                    <a-light type="point" color="#ffaa00" intensity="0.4" distance="3"></a-light>
                </a-box>
                <a-box width="0.9" height="0.1" depth="0.9" color="#221100" position="0 -0.45 0"></a-box>
            `;
            // 水面のゆらぎ
            l.setAttribute('animation', `property: position; to: ${x} 0.5 ${z}; dur: ${2500 + Math.random()*2000}; dir: alternate; loop: true; easing: easeInOutSine`);
            field.appendChild(l);
        }

        function startVR() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);

            // 現実の移動量(delta)を取得して増幅
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);
            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', {
                    x: rigPos.x + (delta.x * (AMPLIFIER - 1)),
                    y: rigPos.y, // 水面を歩くため高さは一定
                    z: rigPos.z + (delta.z * (AMPLIFIER - 1))
                });
            }
            lastPos.copy(currentPos);
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
