<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Multi-User Mirror Sea</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    
    <!-- A-Frame & Networking Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    
    <!-- Reflection & Environment -->
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: serif; }
        #ui {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            background: linear-gradient(to bottom, #1e1e3f, #ff9a9e); color: #fff;
        }
        .start-btn {
            padding: 20px 60px; background: #b40000; color: #fff; border: 2px solid #fff;
            font-size: 1.5rem; cursor: pointer; font-weight: bold; border-radius: 5px;
        }
        #hud {
            position: fixed; top: 20px; left: 20px; color: #ffcc00; z-index: 1000;
            pointer-events: none; text-shadow: 2px 2px 4px #000;
        }
        #alert {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff0000; font-size: 2rem; font-weight: bold; display: none; z-index: 3000;
            text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>

    <div id="alert">DISTANCE ALERT: TOO CLOSE</div>

    <div id="ui">
        <h1>月詠 - TSUKUYOMI MULTI</h1>
        <p>同じURLの仲間と境界の海を歩く</p>
        <button class="start-btn" onclick="startSystem()">SYNC START</button>
    </div>

    <div id="hud">
        TSUKUYOMI_NETWORK: ONLINE<br>
        USERS: <span id="user-count">1</span>
    </div>

    <!-- マルチプレイ設定: networked-scene -->
    <a-scene 
        networked-scene="
            room: tsukuyomi-kaguya;
            debug: true;
            adapter: socketio;
            serverURL: https://naf-naver-signaling.glitch.me/;
        "
        webxr="requiredFeatures: local-floor; referenceSpaceType: local-floor">
        
        <a-assets>
            <!-- 他プレイヤーのアバター定義（黄色く光る魂） -->
            <template id="avatar-template">
                <a-entity class="avatar">
                    <a-sphere radius="0.4" color="#ffcc00" material="emissive: #ffcc00; emissiveIntensity: 2">
                        <a-light type="point" intensity="0.5" color="#ffcc00" distance="2"></a-light>
                    </a-sphere>
                    <a-text value="PLAYER" align="center" position="0 0.8 0" scale="0.5 0.5 0.5" color="#fff"></a-text>
                </a-entity>
            </template>
        </a-assets>

        <!-- 空 -->
        <a-sky material="shader: gradient; topColor: #1e1e3f; bottomColor: #ff9a9e"></a-sky>

        <!-- 鏡面反射する水面 -->
        <a-plane id="water" position="0 0.02 0" rotation="-90 0 0" width="1000" height="1000"
                 reflector="color: #222; opacity: 1; resolution: 256;"></a-plane>

        <!-- 巨大鳥居 -->
        <a-entity id="torii" position="0 0 -60">
            <a-cylinder color="#b40000" radius="2" height="45" position="-20 22.5 0"></a-cylinder>
            <a-cylinder color="#b40000" radius="2" height="45" position="20 22.5 0"></a-cylinder>
            <a-box color="#b40000" width="60" height="4" depth="4" position="0 45 0"></a-box>
            <a-box color="#b40000" width="45" height="3" depth="3" position="0 34 0"></a-box>
        </a-entity>

        <!-- 黄色い灯籠 -->
        <a-entity id="lantern-field"></a-entity>

        <!-- 自分（プレイヤー）: networked 属性を追加 -->
        <a-entity id="rig" position="0 0 0" networked="template:#avatar-template;attachTemplateToLocal:false;">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#ffcc00" radius-inner="0.01" radius-outer="0.015" position="0 0 -1"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#444"></a-light>
    </a-scene>

    <script>
        // カスタムシェーダー（空）
        AFRAME.registerShader('gradient', {
          schema: { topColor: {type: 'color', default: 'black'}, bottomColor: {type: 'color', default: 'white'} },
          vertexShader: `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0); }`
        });

        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const alertUI = document.getElementById('alert');
        const AMPLIFIER = 5.0; // 5倍速
        let lastPos = new THREE.Vector3();

        // 灯籠生成
        const field = document.getElementById('lantern-field');
        for (let i = 0; i < 80; i++) {
            const l = document.createElement('a-entity');
            const x = (Math.random() - 0.5) * 300;
            const z = (Math.random() - 0.5) * 300;
            l.setAttribute('position', `${x} 0.2 ${z}`);
            l.innerHTML = `<a-box width="0.8" height="1" depth="0.8" color="#ffcc00" material="emissive:#ffcc00; emissiveIntensity:1.5"></a-box>`;
            field.appendChild(l);
        }

        function startSystem() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);

            if (delta.length() > 0.001) {
                // 衝突回避ロジック
                let canMove = true;
                const otherAvatars = document.querySelectorAll('.avatar');
                const myPos = rig.getAttribute('position');

                otherAvatars.forEach(av => {
                    const avPos = av.getAttribute('position');
                    // 自分と他人の距離が1.5m以下なら停止
                    if (avPos && myPos.distanceTo(avPos) < 1.5) {
                        canMove = false;
                    }
                });

                if (canMove) {
                    alertUI.style.display = 'none';
                    const newX = myPos.x + (delta.x * (AMPLIFIER - 1));
                    const newZ = myPos.z + (delta.z * (AMPLIFIER - 1));
                    rig.setAttribute('position', { x: newX, y: 0, z: newZ });
                } else {
                    alertUI.style.display = 'block'; // 警告表示
                }
            }
            lastPos.copy(currentPos);
            
            // ユーザー数表示更新
            const nUsers = document.querySelectorAll('[networked]').length;
            document.getElementById('user-count').innerText = nUsers;

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
