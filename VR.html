<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Multiplayer 6DoF</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- マルチプレイ用ライブラリ -->
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    <!-- 通信サーバー（公開デモ用サーバーを使用） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.slim.js"></script>
    <script src="https://unpkg.com/easyrtc@^1.1.0/api/easyrtc.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #2b2c5c; }
        #ui {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            background: rgba(0,0,0,0.8); color: #0ff; font-family: serif;
        }
        .start-btn {
            padding: 15px 40px; background: #b40000; border: 2px solid #fff;
            color: #fff; font-size: 1.2rem; cursor: pointer; border-radius: 5px;
        }
        #hud {
            position: fixed; top: 10px; left: 10px; color: #fff; z-index: 1000;
            font-family: monospace; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>月詠 - TSUKUYOMI MULTI</h1>
        <p>同じURLの人と一緒に探索できます</p>
        <button class="start-btn" onclick="startSystem()">同期開始</button>
    </div>

    <div id="hud">
        ROOM: PUBLIC_TSUKUYOMI<br>
        USERS: <span id="user-count">1</span>
    </div>

    <!-- 
        networked-scene: マルチプレイの設定
        app: アプリ名, room: ルーム名, adapter: 通信方式
    -->
    <a-scene 
        networked-scene="
            app: tsukuyomi-app;
            room: mirror-sea-room;
            debug: true;
            adapter: wseasyrtc;
            serverURL: https://nafs.glitch.me/;
        "
        webxr="requiredFeatures: local-floor"
        renderer="antialias: true">

        <a-assets>
            <!-- 他のプレイヤーの見た目（アバター）の定義 -->
            <template id="avatar-template">
                <a-entity class="avatar">
                    <!-- 顔代わりの光る面 -->
                    <a-sphere radius="0.4" color="#ffcc00" material="emissive: #ffcc00; emissiveIntensity: 2; opacity: 0.8"></a-sphere>
                    <!-- プレイヤー名を表示するタグ（簡易） -->
                    <a-text value="USER" position="0 0.8 0" align="center" width="3" color="#fff"></a-text>
                </a-entity>
            </template>

            <!-- 同期する項目の設定 -->
            <script>
                NAF.schemas.add({
                    template: '#avatar-template',
                    components: [
                        'position',
                        'rotation'
                    ]
                });
            </script>
        </a-assets>

        <!-- 背景と海（反射するように見せる紺色の平面） -->
        <a-sky color="#f2a6a1"></a-sky>
        <a-plane position="0 -0.1 0" rotation="-90 0 0" width="1000" height="1000" color="#1a1a3a"></a-plane>

        <!-- 巨大な鳥居 -->
        <a-entity id="torii" position="0 0 -50">
            <a-cylinder color="#b40000" radius="1.2" height="40" position="-12 20 0"></a-cylinder>
            <a-cylinder color="#b40000" radius="1.2" height="40" position="12 20 0"></a-cylinder>
            <a-box color="#b40000" width="38" height="2" depth="2.5" position="0 40 0"></a-box>
            <a-box color="#222" width="40" height="1" depth="3" position="0 41 0"></a-box>
        </a-entity>

        <!-- 灯籠 -->
        <a-entity id="lantern-field"></a-entity>

        <!-- プレイヤーリグ（自分自身） -->
        <!-- networked="template:#avatar-template;attachTemplateToLocal:false" により自分を他人に同期 -->
        <a-entity id="rig" position="0 0 0" networked="template:#avatar-template;attachTemplateToLocal:false">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <!-- 衝突回避用センサー（簡易） -->
                <a-entity id="proximity-sensor" geometry="primitive: sphere; radius: 1.5" material="visible: false"></a-entity>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#fff" intensity="0.5"></a-light>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 5.0; // 5倍速移動
        let lastPos = new THREE.Vector3();

        // 灯籠生成
        const field = document.getElementById('lantern-field');
        for (let i = 0; i < 60; i++) {
            const x = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;
            const l = document.createElement('a-box');
            l.setAttribute('position', `${x} 0.2 ${z}`);
            l.setAttribute('width', '0.6'); l.setAttribute('height', '0.8'); l.setAttribute('depth', '0.6');
            l.setAttribute('material', 'color: #fff; emissive: #ffcc00; emissiveIntensity: 1.5;');
            field.appendChild(l);
        }

        function startSystem() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                animate();
            }
        }

        function animate() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);

            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                const nextX = rigPos.x + (delta.x * (AMPLIFIER - 1));
                const nextZ = rigPos.z + (delta.z * (AMPLIFIER - 1));

                // ★衝突回避システム★
                let canMove = true;
                const avatars = document.querySelectorAll('.avatar');
                avatars.forEach(av => {
                    // 自分自身でない他のアバターとの距離をチェック
                    if (av.parentNode.components && av.parentNode.components.networked.data.owner !== NAF.clientId) {
                        const dist = new THREE.Vector2(nextX - av.object3D.position.x, nextZ - av.object3D.position.z).length();
                        if (dist < 2.0) { // 2メートル以内に他人がいたら停止
                            canMove = false;
                        }
                    }
                });

                if (canMove) {
                    rig.setAttribute('position', { x: nextX, y: rigPos.y, z: nextZ });
                } else {
                    // 近づきすぎ警告（視界を少し赤くする等も可能）
                    console.log("Collision Avoidance: Too close to another user");
                }
            }

            // 人数表示の更新
            const connectedUsers = document.querySelectorAll('[networked]').length;
            document.getElementById('user-count').innerText = connectedUsers;

            lastPos.copy(currentPos);
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
