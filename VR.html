<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Inside-Out Tracking v3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui-layer {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            background: radial-gradient(circle, #001a1a 0%, #000 100%);
            color: #0ff; font-family: 'Courier New', monospace; text-align: center;
        }
        .start-btn {
            padding: 20px 40px; border: 2px solid #0ff; background: transparent;
            color: #0ff; font-size: 1.5rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 0 20px #0ff; transition: 0.3s;
        }
        .start-btn:hover { background: #0ff; color: #000; }
        #debug-log {
            position: fixed; top: 10px; left: 10px; color: #0ff; font-size: 12px;
            pointer-events: none; z-index: 2000; background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="debug-log">SYSTEM: STANDBY...</div>

    <div id="ui-layer">
        <h1 style="letter-spacing: 0.5em;">TSUKUYOMI</h1>
        <p>【インサイドアウト・トラッキング有効】<br>現実で歩くとVR空間も動きます。広い場所で開始してください。</p>
        <button class="start-btn" onclick="activateSync()">SYNC START</button>
    </div>

    <!-- 
        webxr="requiredFeatures: local-floor" 
        これがインサイドアウト・トラッキング（床認識と位置同期）の鍵です
    -->
    <a-scene 
        webxr="requiredFeatures: local-floor; referenceSpaceType: local-floor"
        renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true;">
        
        <a-assets>
            <!-- グリッドテクスチャ -->
            <img id="grid-img" src="https://cdn.glitch.global/36394fd5-65ef-400d-965d-31952e9f6c0d/grid.png?1629821332014">
        </a-assets>

        <!-- ツクヨミ空間の背景 -->
        <a-entity id="scene-root">
            <a-sky color="#020010"></a-sky>
            
            <!-- 月 -->
            <a-entity position="0 40 -120">
                <a-sphere radius="20" color="#fff" material="shader: flat; emissive: #fff; emissiveIntensity: 1"></a-sphere>
                <a-ring color="#0ff" radius-inner="24" radius-outer="24.5" rotation="90 0 0"></a-ring>
            </a-entity>

            <!-- 地面：自分が動いているか視覚的に分かるようにする -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" 
                     src="#grid-img" repeat="100 100" material="roughness: 1; metalness: 0;"></a-plane>

            <!-- ネオン竹林を動的に生成 -->
            <a-entity id="bamboo-field"></a-entity>
        </a-entity>

        <!-- 
            プレイヤーのカメラリグ
            WebXR(ARモード)に入ると、このカメラの位置が
            バックカメラの画像解析によって自動的に書き換えられます。
        -->
        <a-entity id="rig">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-entity cursor="fuse: false" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: #0ff; shader: flat">
                </a-entity>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#222"></a-light>
        <a-light type="directional" position="1 1 1" intensity="0.5" color="#0ff"></a-light>
    </a-scene>

    <script>
        const log = document.getElementById('debug-log');
        const field = document.getElementById('bamboo-field');

        // 竹林を生成
        for (let i = 0; i < 120; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
            const h = 4 + Math.random() * 12;
            const color = Math.random() > 0.5 ? '#00ffcc' : '#ff00ff';
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.12');
            b.setAttribute('height', h);
            b.setAttribute('color', color);
            b.setAttribute('material', `emissive: ${color}; emissiveIntensity: 1`);
            field.appendChild(b);
        }

        function activateSync() {
            const scene = document.querySelector('a-scene');
            
            // 重要：ARモードで起動することでインサイドアウト・トラッキングを有効にする
            // 背景は3Dモデルで埋めているのでVRのように見える
            if (scene.enterAR) {
                scene.enterAR().then(() => {
                    document.getElementById('ui-layer').style.display = 'none';
                    log.innerText = "TRACKING: ACTIVE (6DoF)";
                }).catch(err => {
                    log.innerText = "ERROR: " + err.message;
                    alert("お使いのデバイスはインサイドアウト・トラッキングに対応していないか、設定が無効です。");
                });
            }
        }

        // 位置情報をデバッグ表示
        const cam = document.getElementById('main-cam');
        setInterval(() => {
            const p = cam.object3D.position;
            log.innerText = `SYNC: ON | X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;
        }, 100);
    </script>
</body>
</html>
