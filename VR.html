<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Optical Flow Sync</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* 解析用の隠し要素 */
        #v-container { position: fixed; top: 0; left: 0; width: 160px; height: 120px; z-index: 1000; border: 1px solid #0ff; opacity: 0.8; }
        video, canvas { width: 100%; height: 100%; }
        
        #hud {
            position: fixed; bottom: 20px; left: 20px; color: #0ff;
            font-family: monospace; z-index: 1001; pointer-events: none;
            text-shadow: 0 0 5px #0ff;
        }
        .start-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; padding: 20px; background: #000; color: #0ff;
            border: 2px solid #0ff; cursor: pointer; font-family: monospace;
        }
    </style>
</head>
<body>

    <button id="startBtn" class="start-btn">TSUKUYOMI VISUAL SYNC START</button>

    <!-- 映像解析用コンテナ（画面左上に表示） -->
    <div id="v-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="hud">
        SCANNING_REALITY...<br>
        FLOW_X: <span id="flow-x">0</span><br>
        SENSITIVITY: 2.0
    </div>

    <a-scene background="color: #010005">
        <!-- ツクヨミの月 -->
        <a-entity position="0 15 -60">
            <a-sphere radius="8" color="#fff" material="shader: flat; emissive: #fff"></a-sphere>
            <a-ring color="#0ff" radius-inner="9" radius-outer="9.2" rotation="90 0 0"></a-ring>
        </a-entity>

        <!-- ネオン竹林 -->
        <a-entity id="bamboo-forest"></a-entity>

        <!-- 地面のグリッド -->
        <a-grid position="0 0 0" cell-size="2" section-size="10" color="#2b0054" opacity="0.4"></a-grid>

        <!-- カメラリグ -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera id="main-camera" wasd-controls-enabled="false" look-controls="enabled: false">
                <a-cursor color="#0ff"></a-cursor>
            </a-camera>
        </a-entity>
        
        <a-light type="ambient" color="#444"></a-light>
    </a-scene>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const flowDisplay = document.getElementById('flow-x');
        const cameraRig = document.getElementById('rig');
        const mainCamera = document.getElementById('main-camera');

        let prevFrameData = null;
        let currentRotationY = 0;

        // 竹林の生成
        const forest = document.getElementById('bamboo-forest');
        for (let i = 0; i < 80; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            const h = 4 + Math.random() * 8;
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.1');
            b.setAttribute('height', h);
            b.setAttribute('color', Math.random() > 0.5 ? '#00ffcc' : '#ff00ff');
            b.setAttribute('material', 'emissive: #0ff; emissiveIntensity: 0.5');
            forest.appendChild(b);
        }

        // カメラ起動
        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 160, height: 120 }
                });
                video.srcObject = stream;
                document.getElementById('startBtn').style.display = 'none';
                processFrame();
            } catch (err) {
                alert("カメラの起動に失敗しました。");
            }
        });

        // 映像解析ループ
        function processFrame() {
            if (video.paused || video.ended) return;

            // キャンバスに現在の映像を縮小して描画（高速化のため）
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            if (prevFrameData) {
                const movementX = calculateMovementX(prevFrameData, currentFrameData, canvas.width, canvas.height);
                
                // 動いた量に応じてVRの視界を回転させる
                // 現実のものが左に動く = カメラが右に動いている = VRのカメラを右に向ける
                const sensitivity = 0.5; // 感度調整
                currentRotationY += movementX * sensitivity;
                
                cameraRig.setAttribute('rotation', `0 ${currentRotationY} 0`);
                flowDisplay.innerText = movementX.toFixed(2);
            }

            prevFrameData = currentFrameData;
            requestAnimationFrame(processFrame);
        }

        // 簡易オプティカルフロー解析（中心付近のピクセルのズレを計算）
        function calculateMovementX(prev, curr, w, h) {
            let totalDiffX = 0;
            const step = 4; // サンプリング間隔
            let samples = 0;

            // 中央付近のピクセルを比較
            for (let y = h/4; y < (h*3)/4; y += step) {
                for (let x = w/4; x < (w*3)/4; x += step) {
                    const idx = (y * w + x) * 4;
                    const brightnessCurr = (curr[idx] + curr[idx+1] + curr[idx+2]) / 3;
                    
                    // 周辺ピクセルとの一致度を探る（簡易的なパターンマッチング）
                    let minDiff = 999;
                    let moveX = 0;
                    const searchRange = 5;

                    for (let ox = -searchRange; ox <= searchRange; ox++) {
                        const pIdx = (y * w + (x + ox)) * 4;
                        const brightnessPrev = (prev[pIdx] + prev[pIdx+1] + prev[pIdx+2]) / 3;
                        const diff = Math.abs(brightnessCurr - brightnessPrev);
                        if (diff < minDiff) {
                            minDiff = diff;
                            moveX = ox;
                        }
                    }
                    totalDiffX += moveX;
                    samples++;
                }
            }
            return samples > 0 ? totalDiffX / samples : 0;
        }
    </script>
</body>
</html>
