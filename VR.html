<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - High Speed Sync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            background: rgba(0, 5, 10, 0.8); color: #0ff; font-family: monospace;
        }
        .start-btn {
            padding: 20px 50px; border: 2px solid #0ff; background: transparent;
            color: #0ff; font-size: 1.5rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 0 20px #0ff; border-radius: 50px;
        }
        #speed-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 500;
            background: radial-gradient(circle, transparent 50%, rgba(0,255,255,0.2) 100%);
            opacity: 0; transition: opacity 0.2s;
        }
    </style>
</head>
<body>

    <div id="speed-vignette"></div>

    <div id="ui-overlay">
        <h1 style="text-shadow: 0 0 10px #0ff;">TSUKUYOMI SYNC: TURBO</h1>
        <p>【高速移動モード有効】<br>現実の1歩がVRでは3歩分になります。</p>
        <button class="start-btn" onclick="startTurbo()">LINK START</button>
    </div>

    <a-scene webxr="requiredFeatures: local-floor">
        <a-sky color="#010210"></a-sky>
        
        <!-- 背景の巨大な月 -->
        <a-entity position="0 50 -150">
            <a-sphere radius="25" color="#fff" material="shader:flat; emissive:#fff"></a-sphere>
            <a-ring color="#0ff" radius-inner="30" radius-outer="31" rotation="90 0 0"></a-ring>
        </a-entity>

        <!-- 無限に続くグリッド地面 -->
        <a-grid position="0 0 0" cell-size="2" section-size="10" color="#2b0054" opacity="0.4"></a-grid>

        <!-- ネオン竹林（広範囲に配置） -->
        <a-entity id="bamboo-field"></a-entity>

        <!-- プレイヤーリグ -->
        <a-entity id="player-rig" position="0 0 0">
            <!-- 実際のカメラ（この座標の変化を監視する） -->
            <a-camera id="tracked-camera" look-controls wasd-controls-enabled="false">
                <a-entity position="0 0 -0.5" 
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                          material="color: #0ff; shader: flat"></a-entity>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#333"></a-light>
        <a-light type="point" position="0 5 0" color="#0ff" intensity="1"></a-light>
    </a-scene>

    <script>
        const rig = document.getElementById('player-rig');
        const cam = document.getElementById('tracked-camera');
        const vignette = document.getElementById('speed-vignette');
        
        let lastCameraPos = new THREE.Vector3();
        const MOVE_MULTIPLIER = 3.5; // ★ここを変えると速度が変わります（3.5倍速）

        function startTurbo() {
            const scene = document.querySelector('a-scene');
            if (scene.enterAR) {
                scene.enterAR().then(() => {
                    document.getElementById('ui-overlay').style.display = 'none';
                    // 初期位置の記録
                    lastCameraPos.copy(cam.object3D.position);
                    animate();
                });
            }
        }

        function animate() {
            // 現在のカメラの（リグ内での）ローカル位置を取得
            const currentCamPos = new THREE.Vector3();
            currentCamPos.copy(cam.object3D.position);

            // 前フレームからの移動量（デルタ）を計算
            const delta = new THREE.Vector3().subVectors(currentCamPos, lastCameraPos);
            
            // Y軸（高さ）の移動はそのまま、X・Z軸（水平移動）だけを増幅
            if (delta.length() > 0.001) { // 微小なノイズを無視
                const boostX = delta.x * (MOVE_MULTIPLIER - 1);
                const boostZ = delta.z * (MOVE_MULTIPLIER - 1);

                // 親であるリグ（プレイヤーの全体位置）をずらすことで加速させる
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', {
                    x: rigPos.x + boostX,
                    y: rigPos.y,
                    z: rigPos.z + boostZ
                });

                // 視覚的エフェクト（速いほど青い枠が強く出る）
                const speed = delta.length() * 50;
                vignette.style.opacity = Math.min(speed, 0.8);
            } else {
                vignette.style.opacity = 0;
            }

            // 現在の位置を保存
            lastCameraPos.copy(currentCamPos);
            requestAnimationFrame(animate);
        }

        // 竹林の生成（広大に）
        const field = document.getElementById('bamboo-field');
        for (let i = 0; i < 300; i++) {
            const b = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 300;
            const z = (Math.random() - 0.5) * 300;
            if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
            const h = 5 + Math.random() * 20;
            const color = Math.random() > 0.5 ? '#00ffcc' : '#ff00ff';
            b.setAttribute('position', `${x} ${h/2} ${z}`);
            b.setAttribute('radius', '0.15');
            b.setAttribute('height', h);
            b.setAttribute('color', color);
            b.setAttribute('material', `emissive: ${color}; emissiveIntensity: 1.5`);
            field.appendChild(b);
        }
    </script>
</body>
</html>
