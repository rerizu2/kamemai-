<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - Torii Sea VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            background: linear-gradient(to bottom, #2b2c5c 0%, #f2a6a1 100%);
            color: #fff; font-family: "serif"; text-align: center;
        }
        .start-btn {
            margin-top: 20px; padding: 15px 40px; background: rgba(180, 0, 0, 0.8);
            border: 2px solid #fff; color: #fff; font-size: 1.2rem;
            cursor: pointer; border-radius: 5px; box-shadow: 0 0 15px #f2a6a1;
        }
        #hud {
            position: fixed; top: 20px; left: 20px; color: #fff; z-index: 1000;
            pointer-events: none; text-shadow: 0 0 5px #b40000; font-family: serif;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 3rem; margin: 0;">月詠 - TSUKUYOMI</h1>
        <p>静寂の海と巨大な鳥居の世界へ</p>
        <button class="start-btn" onclick="bootSystem()">世界へ入る</button>
    </div>

    <div id="hud">
        境界：ツクヨミ<br>
        位置：<span id="pos-display">0.0, 0.0, 0.0</span>
    </div>

    <a-scene webxr="requiredFeatures: local-floor; referenceSpaceType: local-floor">
        
        <!-- 空：夕暮れのグラデーション -->
        <a-sky material="shader: gradient; topColor: #2b2c5c; bottomColor: #f2a6a1"></a-sky>

        <!-- 水面：反射をイメージした半透明の床 -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1000" height="1000" 
                 material="color: #1a1a3a; opacity: 0.8; metalness: 0.9; roughness: 0.1">
        </a-plane>

        <!-- 巨大な鳥居 (パーツ組み上げ) -->
        <a-entity id="big-torii" position="0 0 -50" scale="2 2 2">
            <!-- 柱 -->
            <a-cylinder color="#b40000" radius="1.2" height="30" position="-12 15 0"></a-cylinder>
            <a-cylinder color="#b40000" radius="1.2" height="30" position="12 15 0"></a-cylinder>
            <!-- 笠木 (上の横棒) -->
            <a-box color="#b40000" width="40" height="2.5" depth="3" position="0 30 0" rotation="0 0 2"></a-box>
            <a-box color="#111" width="41" height="1" depth="3.5" position="0 31.5 0"></a-box>
            <!-- 貫 (下の横棒) -->
            <a-box color="#b40000" width="32" height="2" depth="2.5" position="0 23 0"></a-box>
            <!-- 額束 -->
            <a-box color="#b40000" width="4" height="6" depth="1.5" position="0 26.5 0"></a-box>
        </a-entity>

        <!-- 遠くの雲 (球体を組み合わせて入道雲を表現) -->
        <a-entity position="0 -10 -150">
            <a-sphere color="#fff" radius="40" position="80 20 0" opacity="0.6"></a-sphere>
            <a-sphere color="#f2a6a1" radius="50" position="-100 30 -20" opacity="0.5"></a-sphere>
            <a-sphere color="#fff" radius="30" position="0 10 -50" opacity="0.4"></a-sphere>
        </a-entity>

        <!-- 灯籠コンテナ (JSで生成) -->
        <a-entity id="lantern-field"></a-entity>

        <!-- プレイヤーリグ（インサイドアウト・トラッキング＋移動増幅） -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-light type="point" intensity="0.5" distance="5" color="#fff"></a-light>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#f2a6a1" intensity="0.4"></a-light>
        <a-light type="directional" position="-1 1 -1" intensity="0.6" color="#ffccaa"></a-light>

    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const posDisplay = document.getElementById('pos-display');
        const AMPLIFIER = 4.0; // 移動倍率（4倍速）
        let lastPos = new THREE.Vector3();

        // 灯籠を水面にばら撒く
        const field = document.getElementById('lantern-field');
        for (let i = 0; i < 200; i++) {
            const l = document.createElement('a-entity');
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400;
            const delay = Math.random() * 5000;
            
            l.setAttribute('position', `${x} 0.2 ${z}`);
            l.innerHTML = `
                <a-box width="0.6" height="0.8" depth="0.6" color="#fff" material="emissive: #ffaa00; emissiveIntensity: 1; opacity: 0.9">
                    <a-light type="point" color="#ffaa00" intensity="0.3" distance="3"></a-light>
                    <a-animation attribute="position" from="${x} 0.2 ${z}" to="${x} 0.4 ${z}" dur="3000" direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
                </a-box>
                <a-box width="0.7" height="0.1" depth="0.7" color="#442200" position="0 -0.4 0"></a-box>
            `;
            field.appendChild(l);
        }

        function bootSystem() {
            const scene = document.querySelector('a-scene');
            if (scene.enterAR) {
                scene.enterAR().then(() => {
                    document.getElementById('ui').style.display = 'none';
                    lastPos.copy(cam.object3D.position);
                    loop();
                });
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);

            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                rig.setAttribute('position', {
                    x: rigPos.x + (delta.x * (AMPLIFIER - 1)),
                    y: rigPos.y, 
                    z: rigPos.z + (delta.z * (AMPLIFIER - 1))
                });
                posDisplay.innerText = `${rigPos.x.toFixed(1)}, 0.0, ${rigPos.z.toFixed(1)}`;
            }
            lastPos.copy(currentPos);
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
