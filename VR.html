<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - The Sacred Bridge VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- A-Frame & Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.11.0/dist/networked-aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: "Hiragino Mincho ProN", serif; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; background: radial-gradient(circle, #001, #000); color: #fff; text-align: center; }
        .start-btn { padding: 20px 60px; background: #5D4037; color: #fff; border: 2px solid #fff9c4; font-size: 1.5rem; cursor: pointer; border-radius: 5px; box-shadow: 0 0 30px rgba(255, 249, 196, 0.4); }
        #hud { position: fixed; top: 20px; left: 20px; color: #fff9c4; z-index: 1000; pointer-events: none; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 3rem; color: #fff9c4; text-shadow: 0 0 20px #fff9c4;">月詠 - TSUKUYOMI</h1>
        <p>水面に架かる茶色の橋と光の神域へ</p>
        <button class="start-btn" onclick="startVR()">LINK START</button>
    </div>

    <div id="hud">SYSTEM: TSUKUYOMI_LINK_v5<br>USERS: <span id="user-count">1</span></div>

    <a-scene networked-scene="room: tsukuyomi-bridge-v1; adapter: socketio; serverURL: https://naf-naver-signaling.glitch.me/;" webxr="requiredFeatures: local-floor;">
        
        <a-assets>
            <template id="avatar-template">
                <a-entity class="avatar">
                    <a-sphere radius="0.3" color="#fff9c4" material="emissive:#fff9c4; emissiveIntensity:3"></a-sphere>
                </a-entity>
            </template>
        </a-assets>

        <!-- 1. 夜空と幻想的な星雲 -->
        <a-sky color="#00020a"></a-sky>
        <a-entity id="nebula-clouds"></a-entity> 

        <!-- 2. 反射する水面 (Y=0) -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="2000" height="2000" 
                 reflector="color: #111; opacity: 1; resolution: 512;"></a-plane>

        <!-- 3. 茶色の木製の橋 (水面上 Y=0.2) -->
        <a-entity id="wooden-bridge" position="0 0.2 0">
            <!-- 橋の床板 -->
            <a-box width="5.5" height="0.4" depth="300" position="0 -0.2 -100" color="#5D4037" material="roughness: 1;"></a-box>
            <!-- 欄干（茶色の杭と手すり） -->
            <a-entity id="railings"></a-entity>
        </a-entity>

        <!-- 4. 明るく光り輝く鳥居 (画像再現) -->
        <a-entity id="glowing-torii" position="0 0 -50" scale="1.5 1.5 1.5">
            <a-cylinder radius="1.4" height="30" position="-12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:8"></a-cylinder>
            <a-cylinder radius="1.4" height="30" position="12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:8"></a-cylinder>
            <a-box width="38" height="3" depth="3.5" position="0 30 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:8"></a-box>
            <!-- 天を貫く光の柱 -->
            <a-cylinder radius="0.6" height="1500" position="0 750 0" material="shader:flat; color:#fff; transparent:true; opacity:0.6"></a-cylinder>
            <!-- 周囲を黄金に照らす光 -->
            <a-light type="point" intensity="6" distance="80" color="#fff9c4" position="0 15 0"></a-light>
        </a-entity>

        <!-- 5. 祝祭のパーティクルと浮遊艦 -->
        <a-entity id="fx-container"></a-entity>

        <!-- プレイヤー（アバター同期） -->
        <a-entity id="rig" position="0 0.5 0" networked="template:#avatar-template;attachTemplateToLocal:false;">
            <a-camera id="main-cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#fff9c4" radius-inner="0.01" radius-outer="0.015" position="0 0 -1" opacity="0.8"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#223" intensity="0.4"></a-light>
    </a-scene>

    <script>
        const nebula = document.getElementById('nebula-clouds');
        const railings = document.getElementById('railings');
        const fx = document.getElementById('fx-container');

        // 星雲の生成
        for(let i=0; i<40; i++){
            let s = document.createElement('a-sphere');
            let x = (Math.random()-0.5)*200;
            let y = 30 + Math.random()*60;
            let z = -50 - Math.random()*150;
            s.setAttribute('position', `${x} ${y} ${z}`);
            s.setAttribute('radius', 15 + Math.random()*30);
            s.setAttribute('material', `color:#0033ff; opacity:0.08; transparent:true; shader:flat`);
            nebula.appendChild(s);
        }

        // 茶色の欄干の生成
        for(let i=0; i<80; i++){
            let z = -i * 3.5;
            [ -2.7, 2.7 ].forEach(x => {
                let p = document.createElement('a-cylinder');
                p.setAttribute('position', `${x} 0.6 ${z}`);
                p.setAttribute('radius', 0.15); p.setAttribute('height', 1.6); p.setAttribute('color', '#3E2723');
                railings.appendChild(p);
                // 手すりの横棒
                if(i < 79) {
                   let r = document.createElement('a-box');
                   r.setAttribute('position', `${x} 1.2 ${z - 1.75}`);
                   r.setAttribute('width', 0.1); r.setAttribute('height', 0.1); r.setAttribute('depth', 3.6);
                   r.setAttribute('color', '#3E2723');
                   railings.appendChild(r);
                }
            });
        }

        // 光の粒子
        for(let i=0; i<300; i++){
            let p = document.createElement('a-sphere');
            p.setAttribute('radius', 0.06);
            let colors = ['#fff9c4', '#00ffff', '#ff66ff'];
            let c = colors[i % 3];
            p.setAttribute('material', `color:${c}; emissive:${c}; emissiveIntensity:4; shader:flat`);
            let x = (Math.random()-0.5)*120;
            let y = Math.random()*50;
            let z = (Math.random()-0.5)*200 - 50;
            p.setAttribute('position', `${x} ${y} ${z}`);
            p.setAttribute('animation', `property:position; to:${x} ${y+5} ${z}; dur:${3000+Math.random()*3000}; dir:alternate; loop:true; easing:easeInOutSine`);
            fx.appendChild(p);
        }

        const rig = document.getElementById('rig');
        const cam = document.getElementById('main-cam');
        const AMPLIFIER = 5.0; // 移動倍率：5倍
        let lastPos = new THREE.Vector3();

        function startVR() {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) {
                scene.enterVR();
                document.getElementById('ui').style.display = 'none';
                lastPos.copy(cam.object3D.position);
                loop();
            }
        }

        function loop() {
            const currentPos = new THREE.Vector3();
            currentPos.copy(cam.object3D.position);
            const delta = new THREE.Vector3().subVectors(currentPos, lastPos);
            
            if (delta.length() > 0.001) {
                const rigPos = rig.getAttribute('position');
                // 物理移動を5倍にして橋の上を高速移動
                rig.setAttribute('position', { 
                    x: rigPos.x + (delta.x * (AMPLIFIER - 1)), 
                    y: 0.5, // 橋の高さに合わせて固定
                    z: rigPos.z + (delta.z * (AMPLIFIER - 1)) 
                });
            }
            lastPos.copy(currentPos);
            
            const nUsers = document.querySelectorAll('[networked]').length;
            document.getElementById('user-count').innerText = nUsers;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
