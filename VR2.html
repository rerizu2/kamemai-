<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TSUKUYOMI - BT Inverted Motion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-reflector-component/dist/aframe-reflector-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: serif; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; background: #000; color: #fff; text-align: center; }
        .start-btn { padding: 20px 60px; background: #5D4037; color: #fff; border: 2px solid #fff9c4; font-size: 1.5rem; cursor: pointer; border-radius: 5px; }
        #hud { position: fixed; top: 15px; left: 15px; color: #fff9c4; z-index: 1000; pointer-events: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="color: #fff9c4;">月詠 - TSUKUYOMI</h1>
        <p>【Bluetooth操作：前後リバース設定】<br>スティックを前に倒すと後退、後ろに倒すと前進します</p>
        <button class="start-btn" onclick="startVR()">SYNC START</button>
    </div>

    <div id="hud">
        BT_CONTROLLER: <span id="bt-status">WAITING...</span><br>
        INVERTED_Y: ENABLED
    </div>

    <a-scene webxr="requiredFeatures: local-floor;">
        <a-sky color="#00020a"></a-sky>

        <!-- 鏡面反射の水面 -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="1000" height="1000" reflector="color: #111; opacity: 1; resolution: 256;"></a-plane>

        <!-- 茶色の木製の橋 (Y=0.2) -->
        <a-entity id="bridge" position="0 0.2 0">
            <a-box width="5.0" height="0.4" depth="600" position="0 -0.2 -250" color="#5D4037"></a-box>
            <a-entity id="railings"></a-entity>
        </a-entity>

        <!-- 光り輝く鳥居 -->
        <a-entity id="torii" position="0 0 -50" scale="1.4 1.4 1.4">
            <a-cylinder radius="1.4" height="30" position="-12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-cylinder>
            <a-cylinder radius="1.4" height="30" position="12 15 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-cylinder>
            <a-box width="36" height="2.5" depth="3" position="0 30 0" material="color:#fff; emissive:#fff9c4; emissiveIntensity:10"></a-box>
            <a-cylinder radius="0.4" height="1500" position="0 750 0" material="shader:flat; color:#fff; transparent:true; opacity:0.7"></a-cylinder>
            <a-light type="point" intensity="5" distance="70" color="#fff9c4" position="0 15 0"></a-light>
        </a-entity>

        <!-- プレイヤーリグ -->
        <a-entity id="rig" position="0 0.5 0">
            <a-camera id="cam" look-controls wasd-controls-enabled="false">
                <a-ring color="#fff9c4" radius-inner="0.01" radius-outer="0.015" position="0 0 -1"></a-ring>
            </a-camera>
        </a-entity>

        <a-light type="ambient" color="#223" intensity="0.5"></a-light>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const cam = document.getElementById('cam');
        const btStatus = document.getElementById('bt-status');

        const SPEED = 0.4;
        const BRIDGE_LIMIT = 2.2;

        function startVR() {
            document.querySelector('a-scene').enterVR();
            document.getElementById('ui').style.display = 'none';
            loop();
        }

        function loop() {
            const gps = navigator.getGamepads();
            const gp = gps[0] || gps[1];

            if (gp) {
                btStatus.innerText = "CONNECTED";
                btStatus.style.color = "#0f0";

                // スティック値取得
                const stickX = Math.abs(gp.axes[0]) > 0.1 ? gp.axes[0] : 0;
                const stickY = Math.abs(gp.axes[1]) > 0.1 ? gp.axes[1] : 0;

                // --- 前後逆転ロジック ---
                // 通常は -stickY で前進だが、そのまま +stickY を使うことで
                // スティック前倒し（負）でマイナス（後退）、後ろ倒し（正）でプラス（前進）にする
                const moveDirectionY = stickY; // ★ここが逆（反転）の設定です
                const moveDirectionX = stickX;

                const rigPos = rig.getAttribute('position');
                const camRot = cam.getAttribute('rotation');
                const angle = (camRot.y) * (Math.PI / 180);

                // カメラの向きに合わせて座標を計算
                let nextX = rigPos.x + (Math.sin(angle) * moveDirectionY * SPEED) + (Math.cos(angle) * moveDirectionX * SPEED);
                let nextZ = rigPos.z + (Math.cos(angle) * moveDirectionY * SPEED) - (Math.sin(angle) * moveDirectionX * SPEED);

                // 橋の幅制限
                if (Math.abs(nextX) > BRIDGE_LIMIT) nextX = rigPos.x;

                rig.setAttribute('position', { x: nextX, y: 0.5, z: nextZ });
            } else {
                btStatus.innerText = "DISCONNECTED";
                btStatus.style.color = "#f00";
            }
            requestAnimationFrame(loop);
        }

        // 欄干生成
        const rai = document.getElementById('railings');
        for(let i=0; i<100; i++){
            let z = -i * 4;
            [-2.7, 2.7].forEach(x => {
                let p = document.createElement('a-cylinder');
                p.setAttribute('position', `${x} 0.6 ${z}`);
                p.setAttribute('radius', 0.15); p.setAttribute('height', 1.4); p.setAttribute('color', '#3E2723');
                rai.appendChild(p);
            });
        }
    </script>
</body>
</html>
