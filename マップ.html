<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSHI GPS案内システム - 超かぐや姫！</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --bg-dark: #000510;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
            filter: hue-rotate(150deg) brightness(0.6) contrast(1.2) saturate(1.5);
        }

        /* FUSHI ガイド体 */
        #fushi {
            position: fixed;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff 0%, var(--neon-blue) 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2000;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        #fushi::after {
            content: 'FUSHI_LINKED';
            position: absolute;
            top: 45px;
            font-size: 9px;
            color: var(--neon-blue);
            white-space: nowrap;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
        }

        /* UIオーバーレイ */
        .overlay-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }

        .status-panel {
            background: rgba(0, 5, 16, 0.85);
            border-left: 4px solid var(--neon-pink);
            padding: 15px;
            color: white;
            backdrop-filter: blur(10px);
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .gps-status {
            font-size: 0.7rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .location-info {
            font-size: 0.9rem;
            margin-top: 10px;
            font-family: monospace;
        }

        /* スキャンライン */
        .scan-line {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.05) 50%);
            background-size: 100% 4px;
            z-index: 1500;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 再取得ボタン */
        .recenter-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: auto;
        }
        .recenter-btn:hover {
            background: var(--neon-blue);
            color: black;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="fushi"></div>
    <div class="scan-line"></div>

    <div class="overlay-ui">
        <div class="status-panel">
            <div class="gps-status" id="gps-label">Connecting to Satellites...</div>
            <div id="fushi-msg" style="font-size: 1.1rem;">FUSHI: 空間同期中...</div>
            <div class="location-info" id="coords-display">LAT: --- / LNG: ---</div>
        </div>
    </div>

    <button class="recenter-btn" onclick="moveToCurrentLocation()">Recenter View</button>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

    <script>
        let map, userMarker;
        const fushi = document.getElementById('fushi');
        const fushiMsg = document.getElementById('fushi-msg');
        const coordsDisplay = document.getElementById('coords-display');
        const gpsLabel = document.getElementById('gps-label');
        
        let userPos = { lat: 35.0157, lng: 135.6720 }; // デフォルト（嵐山）
        let mouseX = 0, mouseY = 0;
        let fushiX = 0, fushiY = 0;

        function initMap() {
            const mapStyle = [
                { "elementType": "geometry", "stylers": [{ "color": "#000a1a" }] },
                { "featureType": "water", "stylers": [{ "color": "#001a33" }] },
                { "featureType": "road", "stylers": [{ "color": "#002a4a" }] },
                { "elementType": "labels.text.fill", "stylers": [{ "color": "#00f2ff" }] }
            ];

            map = new google.maps.Map(document.getElementById("map"), {
                center: userPos,
                zoom: 17,
                styles: mapStyle,
                disableDefaultUI: true
            });

            // ユーザーマーカー（青い光の輪）
            userMarker = new google.maps.Marker({
                position: userPos,
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 12,
                    fillColor: "#00f2ff",
                    fillOpacity: 1,
                    strokeWeight: 4,
                    strokeColor: "#ffffff",
                }
            });

            startGpsTracking();
        }

        function startGpsTracking() {
            if (navigator.geolocation) {
                // リアルタイム追跡
                navigator.geolocation.watchPosition(
                    (position) => {
                        userPos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };

                        // UI更新
                        gpsLabel.innerText = "GPS: Signal Stable";
                        fushiMsg.innerText = "FUSHI: あなたの現在地を補足しました。";
                        coordsDisplay.innerText = `LAT: ${userPos.lat.toFixed(5)} / LNG: ${userPos.lng.toFixed(5)}`;

                        // マーカー移動
                        userMarker.setPosition(userPos);
                    },
                    (error) => {
                        gpsLabel.innerText = "GPS: Signal Lost";
                        fushiMsg.innerText = "FUSHI: 座標が取得できません。";
                        console.error(error);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                fushiMsg.innerText = "FUSHI: この端末はGPS非対応です。";
            }
        }

        function moveToCurrentLocation() {
            map.panTo(userPos);
            map.setZoom(17);
            fushiMsg.innerText = "FUSHI: 視界を同期しました。";
        }

        // FUSHIの浮遊アニメーション（マウスまたは画面中央を追従）
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateFushi() {
            // 慣性追従
            fushiX += (mouseX - fushiX) * 0.08;
            fushiY += (mouseY - fushiY) * 0.08;
            
            const hover = Math.sin(Date.now() * 0.003) * 10;
            fushi.style.left = (fushiX - 20) + 'px';
            fushi.style.top = (fushiY - 20 + hover) + 'px';
            
            requestAnimationFrame(animateFushi);
        }

        animateFushi();
    </script>
</body>
</html>
