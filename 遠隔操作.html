<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>P2P Remote Debug</title>
    <!-- ライブラリの読み込み先を変更(安定版) -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; }
        #log { background: #000; padding: 10px; border: 1px solid #444; color: #0f0; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 12px; margin-bottom: 20px; }
        .box { border: 1px solid #555; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
        #host-area, #guest-area { display: none; }
    </style>
</head>
<body>

    <h2>P2P Debug Console</h2>
    <div id="log">--- システムログ ---<br></div>

    <div id="menu">
        <button onclick="setupPeer('host')">1. 操作される側（IDを発行）</button>
        <button onclick="setupPeer('guest')">2. 操作する側（IDを入力）</button>
    </div>

    <!-- ホスト画面 -->
    <div id="host-area" class="box">
        <h3>あなたのID: <span id="my-id" style="color: yellow; font-size: 20px;">接続中...</span></h3>
        <p>このIDを相手に伝えてください。</p>
        <div id="cursor" style="position:fixed; width:20px; height:20px; background:red; border-radius:50%; display:none; pointer-events:none; z-index:1000;"></div>
    </div>

    <!-- ゲスト画面 -->
    <div id="guest-area" class="box">
        <input type="text" id="target-id" placeholder="相手のIDを入力">
        <button onclick="connectToHost()">接続開始</button>
        <video id="remote-video" autoplay style="width: 100%; margin-top: 10px; border: 1px solid #fff;"></video>
    </div>

<script>
    let peer = null;
    let conn = null;

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML += "> " + msg + "<br>";
        log.scrollTop = log.scrollHeight;
    }

    function setupPeer(mode) {
        addLog("PeerJSを初期化中...");
        // PeerJSサーバーに接続
        peer = new Peer();

        peer.on('open', (id) => {
            addLog("ID取得成功: " + id);
            if (mode === 'host') {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('host-area').style.display = 'block';
                document.getElementById('my-id').innerText = id;
                startScreenShare();
            } else {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('guest-area').style.display = 'block';
            }
        });

        peer.on('error', (err) => {
            addLog("エラーが発生しました: " + err.type);
            console.error(err);
        });

        // ホスト側のデータ受信設定
        peer.on('connection', (c) => {
            addLog("相手がデータ接続しました");
            c.on('data', (data) => {
                const cursor = document.getElementById('cursor');
                cursor.style.display = 'block';
                cursor.style.left = (data.x * window.innerWidth) + "px";
                cursor.style.top = (data.y * window.innerHeight) + "px";
            });
        });
    }

    async function startScreenShare() {
        try {
            addLog("画面共有の許可を求めています...");
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            addLog("画面キャプチャ成功。着信を待機します。");
            peer.on('call', (call) => {
                addLog("着信あり。映像を送信します。");
                call.answer(stream);
            });
        } catch (e) {
            addLog("画面共有エラー: " + e.message);
        }
    }

    function connectToHost() {
        const id = document.getElementById('target-id').value;
        if (!id) return;

        addLog(id + " へ接続を試みています...");
        
        // 1. データ接続
        conn = peer.connect(id);
        conn.on('open', () => addLog("データ通信確立！"));

        // 2. 映像接続
        const call = peer.call(id, new MediaStream());
        call.on('stream', (remoteStream) => {
            addLog("映像を受信しました。");
            const video = document.getElementById('remote-video');
            video.srcObject = remoteStream;
            
            // ビデオ上でのクリックイベント
            video.onclick = (e) => {
                const rect = video.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                conn.send({ x: x, y: y });
            };
        });
    }
</script>
</body>
</html>
