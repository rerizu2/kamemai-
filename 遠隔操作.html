<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web Remote Desktop - Stable</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 10px; background: #333; border-bottom: 1px solid #444; }
        #log { font-family: monospace; font-size: 11px; color: #0f0; background: #000; height: 80px; overflow-y: auto; padding: 5px; }
        #main { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
        #setup-menu { position: absolute; z-index: 10; background: rgba(34,34,34,0.9); padding: 20px; border-radius: 10px; text-align: center; }
        .box { border: 1px solid #555; padding: 15px; margin: 10px; border-radius: 8px; }
        button { padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; margin-bottom: 10px; }
        #remote-cursor {
            position: absolute; width: 20px; height: 20px; background: rgba(255, 0, 0, 0.7);
            border-radius: 50%; border: 2px solid white; pointer-events: none;
            display: none; z-index: 1000; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div id="header">
    <strong>Remote Control Demo</strong>
    <div id="log">ログ: システム待機中...</div>
</div>

<div id="main">
    <div id="setup-menu">
        <div class="box">
            <h3>1. 操作される側</h3>
            <button onclick="startHost()">画面共有を開始</button>
            <p id="display-id" style="color: yellow; margin-top: 10px;"></p>
        </div>
        <div class="box">
            <h3>2. 操作する側</h3>
            <input type="text" id="target-id" placeholder="相手のIDを入力"><br>
            <button onclick="startGuest()" style="background: #28a745;">接続して操作</button>
        </div>
    </div>

    <div id="remote-cursor"></div>
    <video id="remote-video" autoplay muted playsinline></video>
</div>

<script>
    let peer = null;
    let conn = null;
    let localStream = null;

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `> ${msg}<br>`;
        log.scrollTop = log.scrollHeight;
    }

    // ダミーのストリームを作成（PeerJSの通信を安定させるため）
    function createDummyStream() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const stream = canvas.captureStream();
        return stream;
    }

    async function initPeer() {
        return new Promise(resolve => {
            if (peer) return resolve(peer.id);
            peer = new Peer();
            peer.on('open', id => {
                addLog("自分のIDを取得: " + id);
                resolve(id);
            });
            peer.on('error', err => addLog("エラー: " + err.type));
        });
    }

    // --- 操作される側 (Host) ---
    async function startHost() {
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            addLog("画面キャプチャ成功");
            
            const id = await initPeer();
            document.getElementById('display-id').innerText = "ID: " + id;
            document.getElementById('setup-menu').style.visibility = 'hidden';

            peer.on('connection', c => {
                conn = c;
                addLog("データ接続成功");
                conn.on('data', data => {
                    const cursor = document.getElementById('remote-cursor');
                    cursor.style.display = 'block';
                    cursor.style.left = (data.x * window.innerWidth) + "px";
                    cursor.style.top = (data.y * window.innerHeight) + "px";
                });
            });

            peer.on('call', call => {
                addLog("映像リクエストを受信。応答します。");
                call.answer(localStream);
            });
        } catch (e) {
            addLog("開始失敗: " + e.message);
        }
    }

    // --- 操作する側 (Guest) ---
    async function startGuest() {
        const targetId = document.getElementById('target-id').value;
        if (!targetId) return alert("IDを入力してください");

        await initPeer();
        document.getElementById('setup-menu').style.visibility = 'hidden';
        addLog(targetId + " に接続試行中...");

        // 1. データ接続
        conn = peer.connect(targetId);
        
        // 2. 映像接続 (ダミーストリームを添えて呼び出す)
        const call = peer.call(targetId, createDummyStream());
        
        call.on('stream', stream => {
            addLog("映像ストリーム受信成功！");
            const video = document.getElementById('remote-video');
            video.srcObject = stream;
            video.play();
        });

        const video = document.getElementById('remote-video');
        video.addEventListener('mousedown', e => {
            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            if (conn && conn.open) conn.send({ x, y });
        });
    }
</script>
</body>
</html>
