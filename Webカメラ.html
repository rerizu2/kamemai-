<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Screen Monitor</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; 
            --danger: #ff4757; --success: #2ecc71; 
        }
        body { font-family: sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: auto; }
        
        /* パネルデザイン */
        .panel { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,251,255,0.1); }
        
        /* ボタン */
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--accent); color: #000; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-toggle { border: 2px solid #444; background: transparent; color: #888; }
        .btn-toggle.active { border-color: var(--accent); color: var(--accent); background: rgba(0,251,255,0.1); }

        /* 入力 */
        input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: var(--accent); text-align: center; font-size: 16px; margin: 5px; outline: none; }
        input:focus { border-color: var(--accent); }

        /* 公開リスト */
        #public-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .pub-item { background: var(--accent); color: #000; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: bold; }

        /* モニターグリッド */
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 1px solid #333; position: relative; }
        .video-card video { width: 100%; border-radius: 5px; background: #111; aspect-ratio: 16/9; object-fit: contain; }
        .video-info { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: #aaa; }

        /* 配信側UI */
        #local-preview { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid var(--accent); margin-top: 15px; }
        #id-display { font-size: 32px; font-weight: bold; color: var(--accent); margin: 10px 0; }
        
        #log { font-size: 11px; color: #666; height: 60px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #222; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--accent); letter-spacing: 2px;">ULTIMATE SCREEN SYSTEM</h2>

    <!-- モード選択 -->
    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsSharer()">🖥️ 自分の画面を配信する</button>
        <button class="btn-sub" onclick="showMonitorView()">📱 他の画面を監視する</button>
    </div>

    <!-- 【配信側UI】 -->
    <div id="sharer-ui" class="panel hidden">
        <div style="margin-bottom:15px;">
            <button id="priv-btn" class="btn-toggle active" onclick="setPrivacy(false)">🔒 非公開</button>
            <button id="pub-btn" class="btn-toggle" onclick="setPrivacy(true)">🌐 公開ロビーに載せる</button>
        </div>

        <div id="name-setting" class="hidden">
            <input type="text" id="display-name" placeholder="配信名 (例:生徒Aの画面)" maxlength="15">
        </div>

        <div id="connection-info">
            <div id="id-display">----</div>
            <div id="qrcode" style="background:white; padding:10px; display:inline-block; border-radius:10px;"></div>
        </div>

        <video id="local-preview" autoplay playsinline muted></video>
        <div id="log">ログ: 準備中...</div>
    </div>

    <!-- 【モニター側UI】 -->
    <div id="monitor-ui" class="panel hidden">
        <p style="font-size:12px; color:#aaa;">🌐 公開中の画面 (タップして接続)</p>
        <div id="public-list">待機中...</div>

        <div style="border-top: 1px solid #333; margin-top:20px; padding-top:15px;">
            <input type="text" id="target-peer-id" placeholder="IDを入力" maxlength="4" style="width:100px;">
            <button class="btn-main" onclick="connectToPeer()">直接接続</button>
        </div>

        <div id="monitor-grid"></div>
        <div id="monitor-log" id="log" style="font-size:10px; color:#555; text-align:left; background:#000; padding:10px; margin-top:20px;">ログ: 待機中...</div>
    </div>
</div>

<script>
    let peer, mqttClient, localStream;
    let myPeerId = null;
    let isPublic = false;
    let publicStreams = {};
    const TOPIC = "ultimate/screen/v1";

    const peerConfig = {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    };

    function addLog(msg, isMonitor = false) {
        const logId = isMonitor ? 'monitor-log' : 'log';
        const logEl = document.getElementById(logId);
        if (logEl) logEl.innerHTML = `> ${msg}<br>${logEl.innerHTML}`.slice(0, 1000);
    }

    function setPrivacy(pub) {
        isPublic = pub;
        document.getElementById('pub-btn').classList.toggle('active', pub);
        document.getElementById('priv-btn').classList.toggle('active', !pub);
        document.getElementById('name-setting').classList.toggle('hidden', !pub);
        document.getElementById('connection-info').classList.toggle('hidden', pub);
    }

    // --- MQTT ロビー管理 ---
    function setupMQTT(role) {
        mqttClient = mqtt.connect('wss://test.mosquitto.org:8081');
        mqttClient.on('connect', () => {
            if (role === 'monitor') mqttClient.subscribe(TOPIC);
            addLog("ロビーサーバーに接続完了");
        });
        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                publicStreams[data.id] = { name: data.name, time: Date.now() };
                updatePublicListUI();
            } catch(e){}
        });
    }

    function updatePublicListUI() {
        const listDiv = document.getElementById('public-list');
        listDiv.innerHTML = "";
        let count = 0;
        for (const id in publicStreams) {
            if (Date.now() - publicStreams[id].time > 15000) { delete publicStreams[id]; continue; }
            if (id === myPeerId) continue;
            count++;
            const item = document.createElement('div');
            item.className = 'pub-item';
            item.innerHTML = `${publicStreams[id].name} <span style="font-size:9px; opacity:0.6;">(${id})</span>`;
            item.onclick = () => connectToPeer(id);
            listDiv.appendChild(item);
        }
        if (count === 0) listDiv.innerHTML = "<span style='color:#444'>公開中の画面はありません</span>";
    }

    // --- 配信側 (Sharer) ---
    async function initAsSharer() {
        showUI('sharer-ui');
        setupMQTT('sharer');

        try {
            // 画面共有を開始 (getDisplayMedia)
            localStream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { cursor: "always" }, 
                audio: true 
            });
            document.getElementById('local-preview').srcObject = localStream;
            addLog("画面共有を開始しました");

            // 共有が停止されたらリロード
            localStream.getVideoTracks()[0].onended = () => location.reload();

        } catch (e) {
            addLog("エラー: 画面共有がキャンセルされました");
            return;
        }

        myPeerId = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(myPeerId, peerConfig);

        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
            addLog("接続ID取得完了: " + id);
        });

        // モニターからの接続に応答
        peer.on('call', call => {
            addLog("モニターが接続しました。画面を転送します。");
            call.answer(localStream);
        });

        // 5秒おきにハートビート送信
        setInterval(() => {
            if (isPublic && mqttClient?.connected) {
                const name = document.getElementById('display-name').value || "無名の画面";
                mqttClient.publish(TOPIC, JSON.stringify({ id: myPeerId, name: name }));
            }
        }, 5000);
    }

    // --- モニター側 (Monitor) ---
    function showMonitorView() {
        showUI('monitor-ui');
        setupMQTT('monitor');
        peer = new Peer(peerConfig);
        setInterval(updatePublicListUI, 5000);
    }

    function connectToPeer(targetId) {
        const id = targetId || document.getElementById('target-peer-id').value;
        if (!id || id.length !== 4) return;
        if (document.getElementById(`card-${id}`)) return;

        addLog(`ID:${id} に接続を試みています...`, true);
        const call = peer.call(id, new MediaStream());

        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        const name = publicStreams[id] ? publicStreams[id].name : `ID:${id}`;

        card.innerHTML = `
            <video id="video-${id}" autoplay playsinline muted></video>
            <div class="video-info">
                <span><b>${name}</b></span>
                <button class="btn-danger" style="padding:4px 10px; font-size:10px;" onclick="removeCard('${id}')">閉じる</button>
            </div>
        `;
        grid.appendChild(card);

        call.on('stream', remoteStream => {
            addLog(`ID:${id} の画面受信に成功しました`, true);
            const v = document.getElementById(`video-${id}`);
            if (v) v.srcObject = remoteStream;
        });

        call.on('error', err => {
            addLog(`エラー: ${err.type}`, true);
            removeCard(id);
        });
    }

    function removeCard(id) {
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
    }

    function showUI(uiId) {
        ['mode-selection', 'sharer-ui', 'monitor-ui'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
