<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI骨格検知モニター (通信強化版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 950px; margin: auto; }
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        button { padding: 15px 25px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-main { background: #00e1ff; color: #000; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: #ff4444; color: white; padding: 5px 10px; font-size: 12px; }
        
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; position: relative; }
        .detecting { border: 2px solid #00e1ff !important; box-shadow: 0 0 15px #00e1ff; }
        
        canvas { width: 100%; border-radius: 5px; display: block; background: #111; }
        .alert-msg { position: absolute; top: 20px; left: 20px; background: red; padding: 5px 10px; border-radius: 5px; font-weight: bold; }

        .log-list { display: flex; overflow-x: auto; gap: 10px; padding: 10px; background: #1a1a1a; border-radius: 10px; min-height: 150px; }
        .log-item { min-width: 150px; font-size: 11px; }
        .log-item canvas { width: 150px; height: auto; }

        #id-display { font-size: 60px; font-weight: bold; color: #00e1ff; margin: 10px 0; letter-spacing: 5px; }
        #qrcode { background: white; padding: 15px; border-radius: 10px; display: inline-block; }
        #camera-ui video { width: 100%; max-width: 400px; border-radius: 10px; transform: scaleX(-1); }
        .hidden { display: none; }
        #status-log { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI骨格検知 (遠隔モニタリング)</h2>

    <div id="mode-selection" class="panel">
        <p>この端末をどちらにしますか？</p>
        <button class="btn-main" onclick="initAsCamera()">📸 カメラ（撮影側）</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ モニター（監視側）</button>
        <div id="status-log">システム準備中...</div>
    </div>

    <!-- カメラ側UI -->
    <div id="camera-ui" class="panel hidden">
        <p>モニター側に入力するID</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        <p style="color: #aaa;">この画面を開いたまま、別の端末で接続してください</p>
        <div style="margin-top:15px;"><video id="temp-video" autoplay playsinline muted></video></div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-setup" class="panel hidden">
        <div style="margin-bottom: 20px;">
            <input type="text" id="peer-id-input" maxlength="4" placeholder="4桁ID" style="font-size:24px; width:100px; text-align:center; padding:10px; border-radius:8px;">
            <button class="btn-main" onclick="connectToNewCamera()">カメラを追加</button>
            <button class="btn-sub" onclick="startQRScanner()">📷 QR読取</button>
        </div>
        <div id="reader"></div>
        <div id="monitor-grid"></div>

        <div style="text-align:left; margin-top:30px;">
            <h4>👤 人検知履歴</h4>
            <div id="detection-log" class="log-list">
                <p style="color:#555; padding: 20px;">履歴はここに保存されます</p>
            </div>
        </div>
    </div>
</div>

<script>
    let peer;
    let detector = null;
    let myConnections = {};
    const INTERVAL = 250; 
    const IMG_WIDTH = 400;

    function log(msg) {
        document.getElementById('status-log').innerText = msg;
        console.log(msg);
    }

    // AIモデルのロード
    async function loadPoseModel() {
        log("AIモデル読み込み中...");
        try {
            detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet,
                { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
            );
            log("✅ 準備完了：モードを選択してください");
        } catch (e) {
            log("❌ モデル読込失敗。インターネット接続を確認してください");
        }
    }
    loadPoseModel();

    // --- カメラ側 ---
    async function initAsCamera() {
        showUI('camera-ui');
        log("カメラを起動中...");
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            video.srcObject = stream;
        } catch (e) {
            alert("カメラへのアクセスを許可してください");
            return;
        }

        // PeerJS サーバーに接続
        const rid = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(rid, { debug: 2 });
        
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150 });
            log("ID: " + id + " で待機中...");
        });

        peer.on('connection', c => {
            log("モニターが接続されました！");
            conns.push(c);
            c.on('close', () => conns.splice(conns.indexOf(c), 1));
        });

        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = IMG_WIDTH;
                canvas.height = IMG_WIDTH * (video.videoHeight / video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, INTERVAL);
    }

    // --- モニター側 ---
    function showMonitorView() {
        showUI('monitor-setup');
        peer = new Peer({ debug: 2 });
        log("モニターモード起動。カメラのIDを入力してください。");
    }

    function connectToNewCamera(tid) {
        const id = tid || document.getElementById('peer-id-input').value;
        if (!id || myConnections[id]) return;
        
        log("ID: " + id + " に接続を試みています...");
        const conn = peer.connect(id);
        
        conn.on('open', () => {
            log("カメラ " + id + " に接続成功！");
            setupCameraCard(id, conn);
        });

        conn.on('error', (err) => {
            alert("接続エラー: IDが間違っているか、カメラ側が準備できていません。");
        });
    }

    function setupCameraCard(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `
            <div id="alert-${id}" class="alert-msg hidden">人検知！</div>
            <canvas id="cvs-${id}"></canvas>
            <div style="margin-top:5px; font-size:12px;">カメラID: ${id}</div>
        `;
        grid.appendChild(card);

        const canvas = document.getElementById(`cvs-${id}`);
        const ctx = canvas.getContext('2d');
        const img = new Image();

        conn.on('data', async (data) => {
            img.src = data;
            img.onload = async () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (detector) {
                    const poses = await detector.estimatePoses(canvas);
                    if (poses && poses.length > 0 && poses[0].score > 0.4) {
                        drawSkeleton(ctx, poses[0].keypoints);
                        triggerDetection(id, canvas);
                    } else {
                        document.getElementById(`alert-${id}`).classList.add('hidden');
                        card.classList.remove('detecting');
                    }
                }
            };
        });
        myConnections[id] = conn;
    }

    function drawSkeleton(ctx, keypoints) {
        ctx.fillStyle = "#00e1ff";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        keypoints.forEach(kp => {
            if (kp.score > 0.5) {
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 4, 0, 2 * Math.PI); ctx.fill();
            }
        });
        const pairs = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
        pairs.forEach(([i, j]) => {
            const kp1 = keypoints[i]; const kp2 = keypoints[j];
            if (kp1.score > 0.5 && kp2.score > 0.5) {
                ctx.beginPath(); ctx.moveTo(kp1.x, kp1.y); ctx.lineTo(kp2.x, kp2.y); ctx.stroke();
            }
        });
    }

    let lastLogTime = {};
    function triggerDetection(id, canvas) {
        document.getElementById(`alert-${id}`).classList.remove('hidden');
        document.getElementById(`card-${id}`).classList.add('detecting');
        const now = Date.now();
        if (!lastLogTime[id] || now - lastLogTime[id] > 5000) {
            saveDetection(id, canvas);
            lastLogTime[id] = now;
        }
    }

    function saveDetection(id, source) {
        const logList = document.getElementById('detection-log');
        if (logList.innerText.includes("履歴はここ")) logList.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'log-item';
        const copy = document.createElement('canvas');
        copy.width = source.width; copy.height = source.height;
        copy.getContext('2d').drawImage(source, 0, 0);
        item.appendChild(copy);
        item.innerHTML += `<br>${new Date().toLocaleTimeString()} (ID:${id})`;
        logList.prepend(item);
    }

    function startQRScanner() {
        const reader = new Html5Qrcode("reader");
        reader.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (id) => {
            reader.stop(); document.getElementById('reader').innerHTML = ""; connectToNewCamera(id);
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
