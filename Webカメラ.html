<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI監視システム【Googleドライブ連動】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00e1ff; color: #000; font-size: 16px; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: #ff4444; color: white; }
        #status-bar { font-size: 12px; padding: 10px; margin-bottom: 10px; background: #333; border-radius: 5px; color: #888; }
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 2px solid #444; position: relative; }
        .detecting { border-color: #00e1ff; box-shadow: 0 0 15px #00e1ff; }
        canvas { width: 100%; border-radius: 8px; }
        .log-section { text-align: left; margin-top: 30px; border-top: 1px solid #444; padding-top: 20px; }
        .log-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .log-item { background: #2a2a2a; padding: 5px; border-radius: 8px; text-align: center; position: relative; font-size: 10px; color: #aaa; }
        .log-item img { width: 100%; border-radius: 5px; }
        .cloud-status { color: #00e1ff; font-weight: bold; }
        .hidden { display: none; }
        .alert-badge { position: absolute; top: 15px; left: 15px; background: red; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; z-index: 10; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI監視システム (Googleドライブ保存版)</h2>

    <!-- 設定パネル -->
    <div class="panel" style="background: #1a1a1a;">
        <p style="font-size: 12px; margin-bottom: 5px;">GASウェブアプリURLを入力してください：</p>
        <input type="password" id="gas-url" placeholder="https://script.google.com/macros/s/..." style="width: 85%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #333; color: white;">
    </div>

    <div id="status-bar">AI: <span id="st-ai">読込中</span> | クラウド: <span id="st-cloud">待機中</span></div>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラ（送信側）にする</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ モニター（受信・保存側）にする</button>
    </div>

    <!-- カメラ側UI -->
    <div id="camera-ui" class="panel hidden">
        <p>モニター側で下のIDを入力してください</p>
        <div id="id-display" style="font-size: 50px; color: #00e1ff; font-weight: bold; margin: 10px;">----</div>
        <div id="qrcode" style="display: flex; justify-content: center;"></div>
        <video id="temp-video" autoplay playsinline muted style="width:100%; max-width:300px; margin-top:20px; border-radius:10px; opacity: 0.5;"></video>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-setup" class="panel hidden">
        <input type="text" id="peer-id-input" placeholder="カメラのID" style="font-size:18px; width:120px; padding:10px; border-radius:8px; border:none;">
        <button class="btn-main" onclick="connectToNewCamera()">接続</button>

        <div id="monitor-grid"></div>

        <div class="log-section">
            <h4>📁 Googleドライブ保存履歴</h4>
            <div id="detection-log" class="log-list"></div>
        </div>
    </div>
</div>

<script>
    let peer;
    let detector = null;
    let lastSave = {};

    // AIのロード
    async function loadAI() {
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
        document.getElementById('st-ai').innerText = "✅ 準備完了";
    }
    loadAI();

    // --- カメラ側 ---
    async function initAsCamera() {
        const video = document.getElementById('temp-video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        showUI('camera-ui');
        
        peer = new Peer(Math.floor(1000 + Math.random() * 9000).toString());
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
        });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];
        peer.on('connection', c => { conns.push(c); });

        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 400; canvas.height = 400 * (video.videoHeight/video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, 400);
    }

    // --- モニター側 ---
    function showMonitorView() {
        showUI('monitor-setup');
        peer = new Peer();
    }

    function connectToNewCamera() {
        const id = document.getElementById('peer-id-input').value;
        const conn = peer.connect(id);
        conn.on('open', () => {
            const grid = document.getElementById('monitor-grid');
            const card = document.createElement('div');
            card.className = 'video-card';
            card.id = `card-${id}`;
            card.innerHTML = `<div id="alert-${id}" class="alert-badge hidden">検知</div><canvas id="cvs-${id}"></canvas>ID: ${id}`;
            grid.appendChild(card);
            
            const canvas = document.getElementById(`cvs-${id}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            conn.on('data', async (data) => {
                img.src = data;
                img.onload = async () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    if (detector) {
                        const poses = await detector.estimatePoses(canvas);
                        if (poses.length > 0 && poses[0].score > 0.4) {
                            drawPose(ctx, poses[0].keypoints);
                            handleDetection(id, canvas);
                        } else {
                            document.getElementById(`alert-${id}`).classList.add('hidden');
                            card.classList.remove('detecting');
                        }
                    }
                };
            });
        });
    }

    function drawPose(ctx, points) {
        ctx.fillStyle = "#00e1ff";
        points.forEach(p => { if(p.score > 0.5) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 2*Math.PI); ctx.fill(); } });
    }

    async function handleDetection(id, canvas) {
        document.getElementById(`alert-${id}`).classList.remove('hidden');
        document.getElementById(`card-${id}`).classList.add('detecting');

        const now = Date.now();
        // 10秒に1回だけ保存（連続保存を防止）
        if (!lastSave[id] || now - lastSave[id] > 10000) {
            lastSave[id] = now;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            const time = new Date().toLocaleString();
            
            // 履歴リストに追加（プレビュー）
            addImgToList(dataUrl, time);

            // クラウド保存実行
            const gasUrl = document.getElementById('gas-url').value;
            if(gasUrl) {
                saveToGoogleDrive(gasUrl, dataUrl, time);
            }
        }
    }

    async function saveToGoogleDrive(url, dataUrl, time) {
        document.getElementById('st-cloud').innerText = "☁️ 送信中...";
        try {
            await fetch(url, {
                method: "POST",
                mode: "no-cors", // CORS回避
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image: dataUrl, time: time })
            });
            document.getElementById('st-cloud').innerText = "✅ 保存成功";
        } catch (e) {
            document.getElementById('st-cloud').innerText = "❌ 保存失敗";
            console.error(e);
        }
    }

    function addImgToList(url, time) {
        const log = document.getElementById('detection-log');
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `<img src="${url}"><br>${time}<br><span class="cloud-status">Drive Sync</span>`;
        log.prepend(div);
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
