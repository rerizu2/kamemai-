<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI骨格検知モニター (安定版)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- AI関連 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .panel { background: #222; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; }
        .btn-main { background: #00e1ff; color: #000; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-sub { background: #444; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; position: relative; }
        .canvas-container { position: relative; width: 100%; }
        canvas { width: 100%; border-radius: 5px; }
        .log-list { display: flex; overflow-x: auto; gap: 10px; padding: 10px; background: #1a1a1a; min-height: 120px; border-radius: 10px; }
        .log-item canvas { width: 120px; }
        #debug-log { font-size: 10px; color: #ff4444; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="debug-log"></div> <!-- エラー表示用 -->

<div class="container">
    <h2>骨格検知モニター</h2>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラにする</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ モニターにする</button>
        <p id="model-status" style="font-size: 12px;">モデル読込中...</p>
    </div>

    <!-- 配信側 -->
    <div id="camera-ui" class="panel hidden">
        <p>カメラID: <b id="id-display" style="font-size: 24px; color:#00e1ff;">----</b></p>
        <div id="qrcode"></div>
        <video id="temp-video" autoplay playsinline muted style="width:100%; max-width:300px; margin-top:10px;"></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側 -->
    <div id="monitor-setup" class="panel hidden">
        <input type="text" id="peer-id-input" placeholder="IDを入力" style="padding:10px; width:120px;">
        <button class="btn-main" onclick="connectToNewCamera()">接続</button>
        <div id="monitor-grid" style="margin-top:20px;"></div>
        <div style="text-align:left; margin-top:20px;">
            <h4>検知履歴</h4>
            <div id="detection-log" class="log-list"></div>
        </div>
    </div>
</div>

<script>
    let peer;
    let detector = null;
    let myConnections = {};

    function logError(msg) {
        const div = document.getElementById('debug-log');
        div.innerText += msg + "\n";
        console.error(msg);
    }

    // AIモデルのロード
    async function loadPoseModel() {
        try {
            detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet,
                { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
            );
            document.getElementById('model-status').innerText = "✅ AI準備完了";
        } catch (e) {
            logError("モデルロード失敗: " + e);
        }
    }
    loadPoseModel();

    // --- カメラ側 ---
    async function initAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch (e) {
            logError("カメラ起動失敗: " + e);
            alert("カメラが起動できません。HTTPS接続か確認してください。");
        }

        // IDを5桁にして衝突を回避
        const rid = Math.floor(10000 + Math.random() * 90000).toString();
        peer = new Peer(rid);
        
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
        });

        peer.on('error', err => logError("Peerエラー: " + err.type));

        peer.on('connection', c => {
            conns.push(c);
            c.on('close', () => conns.splice(conns.indexOf(c), 1));
        });

        // 配信ループ (画質と頻度を少し下げて安定させる)
        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                const w = 320; // サイズを小さくして転送を軽くする
                const h = w * (video.videoHeight / video.videoWidth);
                canvas.width = w; canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.3); // 圧縮率を上げる
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, 300); // 0.3秒間隔
    }

    // --- モニター側 ---
    function showMonitorView() { 
        showUI('monitor-setup'); 
        peer = new Peer(); 
        peer.on('error', err => logError("Monitor Peer Error: " + err.type));
    }

    function connectToNewCamera() {
        const id = document.getElementById('peer-id-input').value;
        if (!id || myConnections[id]) return;
        const conn = peer.connect(id);
        setupCameraCard(id, conn);
    }

    function setupCameraCard(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `<canvas id="cvs-${id}"></canvas><p>ID: ${id}</p>`;
        grid.appendChild(card);

        const canvas = document.getElementById(`cvs-${id}`);
        const ctx = canvas.getContext('2d');
        const img = new Image();

        conn.on('open', () => { myConnections[id] = conn; });
        conn.on('data', (data) => {
            img.src = data;
            img.onload = async () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (detector) {
                    const poses = await detector.estimatePoses(canvas);
                    if (poses.length > 0 && poses[0].score > 0.4) {
                        drawSkeleton(ctx, poses[0].keypoints);
                        handleDetection(id, canvas);
                    }
                }
            };
        });
        conn.on('close', () => card.remove());
    }

    function drawSkeleton(ctx, keypoints) {
        keypoints.forEach(kp => {
            if (kp.score > 0.5) {
                ctx.fillStyle = "#00e1ff";
                ctx.beginPath(); ctx.arc(kp.x, kp.y, 4, 0, 2*Math.PI); ctx.fill();
            }
        });
    }

    let lastSave = 0;
    function handleDetection(id, canvas) {
        const now = Date.now();
        if (now - lastSave > 5000) { // 5秒おきに保存
            const log = document.getElementById('detection-log');
            const saveCanvas = document.createElement('canvas');
            saveCanvas.width = canvas.width; saveCanvas.height = canvas.height;
            saveCanvas.getContext('2d').drawImage(canvas, 0, 0);
            const div = document.createElement('div');
            div.className = 'log-item';
            div.appendChild(saveCanvas);
            log.prepend(div);
            lastSave = now;
        }
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
