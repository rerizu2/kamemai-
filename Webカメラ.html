<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グループ・マルチカメラ共有</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        h1 { color: #00d1ff; font-size: 1.5rem; }
        
        .setup-box { background: #222; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { 
            width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444;
            background: #000; color: #fff; font-size: 18px; text-align: center;
        }
        
        .btn { 
            width: 85%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-camera { background: #e91e63; color: white; }
        .btn-monitor { background: #007bff; color: white; }

        /* グリッドレイアウト（カメラ映像が並ぶ場所） */
        #camera-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; margin-top: 20px; 
        }
        
        .cam-container { 
            background: #000; border: 2px solid #333; border-radius: 10px; overflow: hidden; position: relative;
        }
        .cam-container img { width: 100%; display: block; background: #222; min-height: 150px; }
        .cam-label { 
            position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); 
            padding: 2px 8px; font-size: 12px; border-radius: 4px;
        }

        video { width: 100%; border-radius: 10px; margin-top: 10px; border: 2px solid #e91e63; }
        .hidden { display: none; }
        .status { color: #aaa; font-size: 0.9em; margin: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>マルチカメラ・グループ共有</h1>

    <!-- 初期設定画面 -->
    <div id="setup-ui" class="setup-box">
        <p>グループ名（合言葉）を決めてください</p>
        <input type="text" id="group-name" placeholder="例: family-home-123">
        <div class="status">※同じ名前を入力した端末同士が繋がります</div>
        <button class="btn btn-camera" onclick="startCamera()">📸 この端末をカメラにする</button>
        <button class="btn btn-monitor" onclick="startMonitor()">🖥️ 全カメラ映像を見る</button>
    </div>

    <!-- カメラ配信中画面 -->
    <div id="camera-ui" class="hidden">
        <div class="status">配信中... グループ: <b id="cam-group-label"></b></div>
        <video id="preview-video" autoplay playsinline muted></video>
        <canvas id="cap-canvas" class="hidden"></canvas>
        <button class="btn" style="background:#444;" onclick="location.reload()">配信停止</button>
    </div>

    <!-- モニター画面 -->
    <div id="monitor-ui" class="hidden">
        <div class="status">グループ「<b id="mon-group-label"></b>」の映像を受信中...</div>
        <div id="camera-grid">
            <!-- ここに複数のカメラ映像が動的に追加される -->
        </div>
        <button class="btn" style="background:#444; margin-top:20px;" onclick="location.reload()">終了</button>
    </div>
</div>

<script>
    let peer;
    const INTERVAL = 150; // 0.15秒 (複数台だと負荷がかかるため少し緩めています)
    const IMG_WIDTH = 320; 
    const QUALITY = 0.3;

    // --- カメラ側の処理 ---
    async function startCamera() {
        const groupName = document.getElementById('group-name').value;
        if (!groupName) return alert("グループ名を入力してください");

        showUI('camera-ui');
        document.getElementById('cam-group-label').innerText = groupName;

        const video = document.getElementById('preview-video');
        const canvas = document.getElementById('cap-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch (e) { return alert("カメラを許可してください"); }

        // カメラ側はランダムIDで開始し、モニター(groupName)に接続しに行く
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(groupName);
            conn.on('open', () => {
                setInterval(() => {
                    if (conn.open) {
                        const ratio = video.videoHeight / video.videoWidth;
                        canvas.width = IMG_WIDTH;
                        canvas.height = IMG_WIDTH * ratio;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        conn.send(canvas.toDataURL('image/jpeg', QUALITY));
                    }
                }, INTERVAL);
            });
        });
    }

    // --- モニター側の処理 ---
    function startMonitor() {
        const groupName = document.getElementById('group-name').value;
        if (!groupName) return alert("グループ名を入力してください");

        showUI('monitor-ui');
        document.getElementById('mon-group-label').innerText = groupName;

        // モニター側はグループ名をIDにして待機する
        peer = new Peer(groupName);

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert("既に同じグループ名でモニターが起動しています。");
                location.reload();
            }
        });

        peer.on('connection', (conn) => {
            // 新しいカメラが接続されたら映像枠を作成
            const camId = conn.peer;
            addCameraFrame(camId);

            conn.on('data', (data) => {
                const imgTag = document.getElementById(`img-${camId}`);
                if (imgTag) imgTag.src = data;
            });

            conn.on('close', () => {
                const frame = document.getElementById(`frame-${camId}`);
                if (frame) frame.remove();
            });
        });
    }

    // 映像枠を動的に追加する
    function addCameraFrame(id) {
        if (document.getElementById(`frame-${id}`)) return;

        const grid = document.getElementById('camera-grid');
        const div = document.createElement('div');
        div.id = `frame-${id}`;
        div.className = 'cam-container';
        div.innerHTML = `
            <div class="cam-label">Camera: ${id.substring(0,5)}</div>
            <img id="img-${id}" src="">
        `;
        grid.appendChild(div);
    }

    function showUI(id) {
        document.getElementById('setup-ui').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }
</script>

</body>
</html>
