<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI監視システム【通信強化版】</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        
        /* 状態表示ランプ */
        #status-bar { font-size: 12px; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #333; }
        .status-ok { color: #00ff88; }
        .status-err { color: #ff4444; }

        button { padding: 15px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00e1ff; color: #000; width: 100%; max-width: 300px; font-size: 18px; }
        
        #id-display { font-size: 60px; font-weight: bold; color: #00e1ff; margin: 10px 0; }
        #qrcode { background: white; padding: 15px; border-radius: 10px; display: inline-block; }
        
        canvas { width: 100%; border-radius: 8px; background: #000; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; position: relative; margin-top: 10px; }
        .alert-msg { position: absolute; top: 20px; left: 20px; background: red; padding: 5px 10px; border-radius: 5px; font-weight: bold; }

        /* 履歴リスト */
        .log-list { display: flex; overflow-x: auto; gap: 10px; padding: 10px; background: #1a1a1a; border-radius: 10px; margin-top: 10px; }
        .log-item { min-width: 120px; cursor: pointer; font-size: 10px; }
        .log-item img { width: 120px; border-radius: 5px; }

        /* モーダル */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; flex-direction:column; align-items:center; justify-content:center; }
        #modal img { max-width: 90%; max-height: 70%; border: 1px solid #00e1ff; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI遠隔監視・骨格検知</h2>

    <!-- 通信状態表示 -->
    <div id="status-bar">
        AI: <span id="st-ai">読込中...</span> | 
        通信: <span id="st-peer">準備中...</span> | 
        環境: <span id="st-https">判定中...</span>
    </div>

    <!-- モード選択 -->
    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラ（撮影側）にする</button>
        <div style="margin: 15px 0; color: #888;">または</div>
        <button class="btn-main" style="background:#aaa;" onclick="showMonitorView()">🖥️ モニター（見る側）にする</button>
    </div>

    <!-- カメラ側 -->
    <div id="camera-ui" class="panel hidden">
        <p>モニターに入力するID</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        <div style="margin-top:20px;">
            <video id="temp-video" autoplay playsinline muted style="width:100%; max-width:300px; border-radius:10px;"></video>
        </div>
        <p style="font-size:12px; color: #888;">この画面は閉じないでください</p>
    </div>

    <!-- モニター側 -->
    <div id="monitor-setup" class="panel hidden">
        <input type="text" id="peer-id-input" placeholder="4桁ID" style="font-size:20px; width:100px; padding:10px; text-align:center; border-radius:8px;">
        <button class="btn-main" style="width:auto;" onclick="connectToNewCamera()">カメラ接続</button>
        
        <div id="monitor-grid"></div>

        <div style="text-align:left; margin-top:30px;">
            <h4>👤 人検知履歴 (タップで拡大)</h4>
            <div id="detection-log" class="log-list"></div>
        </div>
    </div>
</div>

<div id="modal" onclick="this.style.display='none'">
    <img id="modal-img">
    <p id="modal-info"></p>
    <button class="btn-main" id="dl-btn">保存する</button>
</div>

<script>
    let peer;
    let detector = null;
    let myConnections = {};

    // 1. 環境チェック (HTTPSが必要)
    const stHttps = document.getElementById('st-https');
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        stHttps.innerText = "❌ 非推奨(HTTP)";
        stHttps.className = "status-err";
        alert("【重要】カメラ機能はHTTPS環境でしか動作しません。GitHub Pagesなどをご利用ください。");
    } else {
        stHttps.innerText = "✅ OK";
        stHttps.className = "status-ok";
    }

    // 2. AIモデル読み込み
    async function loadModel() {
        try {
            detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
            document.getElementById('st-ai').innerText = "✅ 完了";
            document.getElementById('st-ai').className = "status-ok";
        } catch (e) {
            document.getElementById('st-ai').innerText = "❌ 失敗";
        }
    }
    loadModel();

    // --- カメラ側 ---
    async function initAsCamera() {
        const video = document.getElementById('temp-video');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            video.srcObject = stream;
        } catch (e) {
            alert("カメラを起動できません。許可設定を確認してください。");
            return;
        }

        showUI('camera-ui');
        setupPeer((id) => {
            document.getElementById('id-display').innerText = id;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 140, height: 140 });
        });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        peer.on('connection', c => {
            conns.push(c);
            document.getElementById('st-peer').innerText = "✅ 接続中";
        });

        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 400; canvas.height = 400 * (video.videoHeight/video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, 300);
    }

    // --- モニター側 ---
    function showMonitorView() {
        showUI('monitor-setup');
        setupPeer();
    }

    function setupPeer(onOpenCallback) {
        const rid = Math.floor(1000 + Math.random() * 9000).toString();
        // PeerJSサーバー設定（安定性を高めるため、デフォルト設定）
        peer = new Peer(onOpenCallback ? rid : undefined, { debug: 1 });
        
        peer.on('open', (id) => {
            document.getElementById('st-peer').innerText = "✅ オンライン";
            document.getElementById('st-peer').className = "status-ok";
            if(onOpenCallback) onOpenCallback(id);
        });

        peer.on('error', (err) => {
            console.error(err);
            document.getElementById('st-peer').innerText = "❌ エラー";
            document.getElementById('st-peer').className = "status-err";
            if(err.type === 'unavailable-id') setupPeer(onOpenCallback);
        });
    }

    function connectToNewCamera() {
        const id = document.getElementById('peer-id-input').value;
        if (!id) return;
        const conn = peer.connect(id);
        conn.on('open', () => setupMonitor(id, conn));
        conn.on('error', () => alert("接続できません。IDを確認してください。"));
    }

    function setupMonitor(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `<div id="alert-${id}" class="alert-msg hidden">人検知</div><canvas id="cvs-${id}"></canvas>ID: ${id}`;
        grid.appendChild(card);

        const canvas = document.getElementById(`cvs-${id}`);
        const ctx = canvas.getContext('2d');
        const img = new Image();

        conn.on('data', async (data) => {
            img.src = data;
            img.onload = async () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (detector) {
                    const poses = await detector.estimatePoses(canvas);
                    if (poses.length > 0 && poses[0].score > 0.4) {
                        drawPose(ctx, poses[0].keypoints);
                        triggerRecord(id, canvas);
                    } else {
                        document.getElementById(`alert-${id}`).classList.add('hidden');
                    }
                }
            };
        });
    }

    function drawPose(ctx, points) {
        ctx.fillStyle = "#00e1ff"; ctx.strokeStyle = "white";
        points.forEach(p => { if(p.score > 0.5) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 2*Math.PI); ctx.fill(); } });
    }

    let lastSave = 0;
    function triggerRecord(id, canvas) {
        document.getElementById(`alert-${id}`).classList.remove('hidden');
        if (Date.now() - lastSave > 5000) {
            const logList = document.getElementById('detection-log');
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            const item = document.createElement('div');
            item.className = 'log-item';
            const time = new Date().toLocaleTimeString();
            item.innerHTML = `<img src="${dataUrl}"><br>${time}`;
            item.onclick = () => {
                document.getElementById('modal-img').src = dataUrl;
                document.getElementById('modal-info').innerText = `${time} 検知画像`;
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('dl-btn').onclick = () => {
                    const a = document.createElement('a'); a.href = dataUrl; a.download = `log_${Date.now()}.jpg`; a.click();
                };
            };
            logList.prepend(item);
            lastSave = Date.now();
        }
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
