<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Precision AI Monitor</title>
    
    <!-- MediaPipe & PeerJS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; overflow-x: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* ヘッダーエリア */
        header { background: #222; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00ff88; color: #000; }
        .btn-sub { background: #444; color: white; }

        /* メインコンテンツ */
        #main-view { display: flex; flex: 1; overflow: hidden; }
        
        /* 左：カメラモニター（AI解析） */
        #monitor-section { flex: 2; padding: 15px; position: relative; display: flex; flex-direction: column; gap: 10px; }
        #canvas-wrapper { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
        #output-canvas { width: 100%; height: auto; display: block; }
        .alert-overlay { position: absolute; top: 20px; left: 20px; background: rgba(255,0,0,0.8); color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; display: none; animation: blink 0.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }

        /* 右：検知ログ（画像保存） */
        #log-section { flex: 1; background: #1a1a1a; border-left: 2px solid #333; padding: 15px; overflow-y: auto; }
        .log-card { background: #333; margin-bottom: 10px; border-radius: 8px; overflow: hidden; font-size: 12px; border: 1px solid #444; }
        .log-card img { width: 100%; display: block; }
        .log-info { padding: 8px; display: flex; justify-content: space-between; }

        /* カメラ配信モード用 */
        #camera-setup { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #id-display { font-size: 60px; color: #00ff88; font-weight: bold; margin: 20px; }
        #qr-code { background: white; padding: 10px; border-radius: 10px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app" class="container">
    <!-- モード選択 -->
    <div id="mode-select" class="container" style="justify-content: center; align-items: center; background: #1a1a1a;">
        <h1 style="color:#00ff88;">AI骨格検知モニタリング</h1>
        <div style="display:flex; gap:20px;">
            <button class="btn btn-main" onclick="startAsCamera()" style="font-size:20px; padding:20px 40px;">📸 カメラにする</button>
            <button class="btn btn-sub" onclick="startAsMonitor()" style="font-size:20px; padding:20px 40px;">🖥️ モニターにする</button>
        </div>
        <p style="color:#888; margin-top:20px;">※高精度解析のためPC推奨</p>
    </div>

    <!-- 【モニター画面】 -->
    <div id="monitor-ui" class="hidden" style="height: 100%;">
        <header>
            <div id="status">AI検知停止中</div>
            <div>
                <input type="text" id="target-id" placeholder="IDを入力" style="padding:10px; border-radius:5px; border:none; width:100px;">
                <button class="btn btn-main" onclick="connectToCamera()">追加</button>
            </div>
        </header>
        <div id="main-view">
            <div id="monitor-section">
                <div id="canvas-wrapper">
                    <div id="alert-ui" class="alert-overlay">⚠️ 人を検知！自動保存中...</div>
                    <canvas id="output-canvas"></canvas>
                </div>
                <p id="loading-msg">AIモデル読み込み中...</p>
            </div>
            <div id="log-section">
                <h3>👤 検知履歴 (高精度骨格)</h3>
                <div id="log-list"></div>
            </div>
        </div>
    </div>

    <!-- 【カメラ配信画面】 -->
    <div id="camera-setup" class="hidden">
        <h2>カメラ配信中</h2>
        <div id="id-display">----</div>
        <div id="qr-code"></div>
        <button class="btn btn-sub" style="margin-top:30px;" onclick="location.reload()">終了</button>
        <video id="local-video" autoplay playsinline muted style="width:200px; margin-top:20px; border-radius:10px; border:2px solid #00ff88;"></video>
        <canvas id="send-canvas" class="hidden"></canvas>
    </div>
</div>

<script>
    let peer;
    let holistic;
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let myConnections = {};
    let lastLogTime = 0;

    // --- AI セットアップ (MediaPipe Holistic) ---
    async function initAI() {
        holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        holistic.onResults(onAIResults);
        document.getElementById('loading-msg').innerText = "AI準備完了。接続待機中...";
    }

    // --- AI解析結果の処理 ---
    function onAIResults(results) {
        // キャンバスサイズ調整
        canvasElement.width = results.image.width;
        canvasElement.height = results.image.height;

        // 背景描画
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        // 骨格描画 (Pose, Hands)
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1});
            
            // 人の検知判定
            if (results.poseLandmarks[11].visibility > 0.5) { // 肩が見えているか
                triggerDetection();
            } else {
                document.getElementById('alert-ui').style.display = 'none';
            }
        }

        if (results.leftHandLandmarks) {
            drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, {color: '#CC0000', lineWidth: 2});
        }
        if (results.rightHandLandmarks) {
            drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, {color: '#00CC00', lineWidth: 2});
        }
        
        canvasCtx.restore();
    }

    // 検知時の処理
    function triggerDetection() {
        const now = Date.now();
        document.getElementById('alert-ui').style.display = 'block';

        // 5秒に1回保存
        if (now - lastLogTime > 5000) {
            saveDetectionLog();
            playAlertSound();
            lastLogTime = now;
        }
    }

    function saveDetectionLog() {
        const logList = document.getElementById('log-list');
        const dataUrl = canvasElement.toDataURL('image/jpeg', 0.6);
        const time = new Date().toLocaleTimeString();

        const card = document.createElement('div');
        card.className = 'log-card';
        card.innerHTML = `
            <img src="${dataUrl}">
            <div class="log-info">
                <span>👤 人を検知</span>
                <span>${time}</span>
            </div>
        `;
        logList.prepend(card);
    }

    function playAlertSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // --- モニター側：カメラ接続 ---
    function startAsMonitor() {
        document.getElementById('mode-select').classList.add('hidden');
        document.getElementById('monitor-ui').classList.remove('hidden');
        peer = new Peer();
        initAI();
    }

    function connectToCamera() {
        const id = document.getElementById('target-id').value;
        if (!id || myConnections[id]) return;
        
        const conn = peer.connect(id);
        const offscreenImg = new Image();

        conn.on('data', async (data) => {
            offscreenImg.src = data;
            offscreenImg.onload = () => {
                holistic.send({image: offscreenImg});
            };
        });
        myConnections[id] = conn;
        document.getElementById('status').innerText = `ID:${id} に接続中...`;
    }

    // --- カメラ側：配信処理 ---
    async function startAsCamera() {
        document.getElementById('mode-select').classList.add('hidden');
        document.getElementById('camera-setup').classList.remove('hidden');

        const video = document.getElementById('local-video');
        const canvas = document.getElementById('send-canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;

        const rid = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(rid);
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            new QRCode(document.getElementById("qr-code"), { text: id, width: 150, height: 150 });
        });

        peer.on('connection', c => {
            conns.push(c);
            c.on('close', () => conns.splice(conns.indexOf(c), 1));
        });

        // 配信ループ
        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 480;
                canvas.height = 480 * (video.videoHeight / video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, 200);
    }
</script>
</body>
</html>
