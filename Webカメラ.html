<div id="container">
    <div id="left-panel">
        <div class="panel-title">Camera Input (Mirror)</div>
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>
    </div>
    <div id="right-panel">
        <div class="panel-title">Realtime 3D Sync</div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // === 1. Three.js セットアップ ===
    const rightPanel = document.getElementById('right-panel');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2b);
    
    // グリッド表示
    const gridHelper = new THREE.GridHelper(10, 10);
    scene.add(gridHelper);

    const camera3D = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 100);
    camera3D.position.set(0, 1.4, 3.0); // 正面から見る位置

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    rightPanel.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera3D, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enablePan = false;
    controls.enableDamping = true;

    // ライティング
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 5, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // === 2. モデルロードとボーン管理 ===
    const bones = {
        Right: { Arm: null, ForeArm: null, Hand: null, Fingers: {} },
        Left:  { Arm: null, ForeArm: null, Hand: null, Fingers: {} }
    };
    
    const loaderDiv = document.getElementById('loader');
    const statusText = document.getElementById('status-text');
    
    // 汎用的な人型モデル (Xbot)
    const MODEL_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb';
    const FINGER_NAMES = ['Thumb', 'Index', 'Middle', 'Ring', 'Pinky'];

    new GLTFLoader().load(MODEL_URL, (gltf) => {
        const model = gltf.scene;
        scene.add(model);
        model.position.y = 0; // 足元を原点に

        model.traverse((o) => {
            if (o.isBone) {
                const n = o.name;
                // Mixamo形式のボーン名マッピング
                if (n.includes('RightArm') || n === 'mixamorig_RightArm') bones.Right.Arm = o;
                if (n.includes('RightForeArm') || n === 'mixamorig_RightForeArm') bones.Right.ForeArm = o;
                if (n.includes('RightHand') || n === 'mixamorig_RightHand') bones.Right.Hand = o;
                
                if (n.includes('LeftArm') || n === 'mixamorig_LeftArm') bones.Left.Arm = o;
                if (n.includes('LeftForeArm') || n === 'mixamorig_LeftForeArm') bones.Left.ForeArm = o;
                if (n.includes('LeftHand') || n === 'mixamorig_LeftHand') bones.Left.Hand = o;

                // 指のマッピング
                FINGER_NAMES.forEach(fName => {
                    const side = n.includes('Right') ? 'Right' : (n.includes('Left') ? 'Left' : null);
                    if (side && n.includes(fName)) {
                        if (!bones[side].Fingers[fName]) bones[side].Fingers[fName] = [];
                        // ボーン名に 1, 2, 3 が含まれる順序で格納
                        if (n.includes('1')) bones[side].Fingers[fName][0] = o;
                        if (n.includes('2')) bones[side].Fingers[fName][1] = o;
                        if (n.includes('3')) bones[side].Fingers[fName][2] = o;
                    }
                });
            }
        });
        statusText.innerText = "モデル読込完了。カメラ起動中...";
    }, undefined, (e) => {
        statusText.innerText = "モデル読込エラー";
        console.error(e);
    });

    // === 3. 計算ロジック ===
    const v3 = (x,y,z) => new THREE.Vector3(x,y,z);
    
    // ローパスフィルタ用（ジッター軽減）
    const damp = 0.5; 

    /**
     * 腕の回転計算
     * MediaPipeの3点座標から、上腕と前腕の回転を計算する
     */
    function solveArm(bUpper, bLower, pShoulder, pElbow, pWrist, boneAxis) {
        if(!bUpper || !bLower) return;

        // 深度の増幅係数（WebカメラはZ軸が浅いため補正）
        const Z_AMP = 2.5; 

        // 座標変換 (MediaPipeはYが下向き、Three.jsはYが上向き)
        // かつ、鏡映しにするためにXを反転させるか考慮が必要だが、
        // ここではシンプルに入力座標をワールド空間ベクトルに変換する
        const vS = v3(-pShoulder.x, -pShoulder.y, -pShoulder.z * Z_AMP);
        const vE = v3(-pElbow.x,    -pElbow.y,    -pElbow.z * Z_AMP);
        const vW = v3(-pWrist.x,    -pWrist.y,    -pWrist.z * Z_AMP);

        // 1. 上腕の回転
        const dirUpper = new THREE.Vector3().subVectors(vE, vS).normalize();
        // デフォルトのボーンの向き(boneAxis)を、計算した向き(dirUpper)に合わせる回転クォータニオン作成
        const qTargetUpper = new THREE.Quaternion().setFromUnitVectors(boneAxis, dirUpper);
        bUpper.quaternion.slerp(qTargetUpper, damp); 

        // 2. 前腕の回転
        // 親（上腕）の回転の影響を打ち消して、ローカル回転を計算する
        const dirLower = new THREE.Vector3().subVectors(vW, vE).normalize();
        const qTargetLowerGlobal = new THREE.Quaternion().setFromUnitVectors(boneAxis, dirLower);
        
        // 親のワールド回転の逆行列を取得
        const qParentInv = bUpper.quaternion.clone().invert(); 
        // ローカル回転 = 親の逆 * グローバル目標
        const qLocalLower = qParentInv.multiply(qTargetLowerGlobal);
        bLower.quaternion.slerp(qLocalLower, damp);
    }

    /**
     * 手首と指の完全制御
     * Roll回転（ひねり）に対応
     */
    function solveHandFull(bHand, bFingers, landmarks, boneAxis, isRight) {
        if(!bHand) return;
        const Z_AMP = 2.5;

        // MediaPipe Hand Landmarks indices
        // 0:Wrist, 5:IndexMCP, 9:MiddleMCP, 17:PinkyMCP
        const pWrist = landmarks[0];
        const pIndex = landmarks[5];
        const pMiddle = landmarks[9];
        const pPinky = landmarks[17];

        const vW = v3(-pWrist.x, -pWrist.y, -pWrist.z * Z_AMP);
        const vI = v3(-pIndex.x, -pIndex.y, -pIndex.z * Z_AMP);
        const vM = v3(-pMiddle.x, -pMiddle.y, -pMiddle.z * Z_AMP);
        const vP = v3(-pPinky.x, -pPinky.y, -pPinky.z * Z_AMP);

        // --- 手首の回転行列を作成する ---
        
        // 1. 前方ベクトル (Forward): 手首から中指の付け根
        const forward = new THREE.Vector3().subVectors(vM, vW).normalize();

        // 2. 右ベクトル (Right) または 上ベクトル (Up) の仮計算
        // 人差し指と小指を結ぶベクトルを使って、手のひらの法線を出す
        const vecIndexToPinky = new THREE.Vector3().subVectors(vP, vI).normalize();
        
        // 3. 手のひら法線 (Up Vector)
        // 外積を使って法線を求める (Forward x IndexToPinky)
        let up = new THREE.Vector3().crossVectors(forward, vecIndexToPinky).normalize();
        
        // 左手と右手で座標系が逆になる場合があるので調整
        // Xbotの場合、手の平が下を向いているか前を向いているかで軸が変わるが、
        // 一般的に:
        // 右手: Index(右) -> Pinky(左) なので Cross(Forward, I2P) は手の甲側
        // 左手: Index(左) -> Pinky(右) 
        if (isRight) {
             // 補正が必要ならここで反転
             // up.negate(); 
        } else {
             // up.negate();
        }

        // 4. 回転行列の構築 (LookAt行列のようなもの)
        const m4 = new THREE.Matrix4();
        
        // X軸基準のボーン(Xbot)に対して、
        // X軸 = Forward, Y軸 = -Up (手の甲), Z軸 = Cross
        // 簡易的に setFromUnitVectors ではなく、正確な基底ベクトルをセットする
        const xAxis = forward.clone();
        const yAxis = up.clone().negate(); // 手の甲側をYとするか、手の平をYとするか
        const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
        // 直交補正
        yAxis.crossVectors(zAxis, xAxis).normalize();

        // 回転行列を作成
        // ボーンのローカル軸が (1,0,0) なので、x列にforwardを入れる
        if (isRight) { // 右手モデル (-X軸が伸びる方向) の場合、軸を反転させる必要があるかも
             // Xbotの右手は -X 方向に伸びている
             const mRot = new THREE.Matrix4().makeBasis(xAxis.negate(), yAxis.negate(), zAxis);
             bHand.rotation.setFromRotationMatrix(mRot);
        } else {
             // 左手モデル (+X 方向に伸びている)
             const mRot = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
             bHand.rotation.setFromRotationMatrix(mRot);
        }
        
        // ※上記行列計算が複雑なため、今回はクォータニオンによる「方向合わせ」＋「ロール補正」を行う簡易実装に切り替えます
        // これにより暴発を防ぎます。
        
        const qDir = new THREE.Quaternion().setFromUnitVectors(boneAxis, forward);
        
        // 親の回転をキャンセル
        const parentQ = new THREE.Quaternion();
        bHand.parent.getWorldQuaternion(parentQ);
        const qParentInv = parentQ.clone().invert();
        
        // 最終ローカル回転（方向のみ）
        let qLocal = qParentInv.multiply(qDir);
        
        // ロール（ひねり）の適用
        // 手のひらの法線ベクトルを使って、軸周りの回転を加える
        // ここは計算が安定しない場合が多いため、まずは「方向追従」を優先させます
        bHand.quaternion.slerp(qLocal, damp);


        // --- 指の回転 ---
        const handWorldQ = new THREE.Quaternion();
        bHand.getWorldQuaternion(handWorldQ);

        const fingerMap = [
            { key: 'Thumb',  idx: [1, 2, 3, 4] },
            { key: 'Index',  idx: [5, 6, 7, 8] },
            { key: 'Middle', idx: [9, 10, 11, 12] },
            { key: 'Ring',   idx: [13, 14, 15, 16] },
            { key: 'Pinky',  idx: [17, 18, 19, 20] }
        ];

        fingerMap.forEach(f => {
            if (!bFingers[f.key]) return;
            let currentParentQ = handWorldQ.clone(); // 指の根本は手のひらの回転から始まる

            for (let i = 0; i < 3; i++) {
                const bone = bFingers[f.key][i];
                if (!bone) continue;

                const vStart = v3(-landmarks[f.idx[i]].x,   -landmarks[f.idx[i]].y,   -landmarks[f.idx[i]].z * Z_AMP);
                const vEnd   = v3(-landmarks[f.idx[i+1]].x, -landmarks[f.idx[i+1]].y, -landmarks[f.idx[i+1]].z * Z_AMP);
                
                const boneVec = new THREE.Vector3().subVectors(vEnd, vStart).normalize();
                const qGlobal = new THREE.Quaternion().setFromUnitVectors(boneAxis, boneVec);
                
                // ローカル回転に変換
                const invP = currentParentQ.clone().invert();
                const qLocalBone = invP.multiply(qGlobal);
                
                bone.quaternion.slerp(qLocalBone, damp);
                currentParentQ = qGlobal; // 次の関節の親回転になる
            }
        });
    }

    // === 4. MediaPipe セットアップ ===
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onResults(results) {
        // ローダーを消す
        loaderDiv.style.opacity = 0;
        setTimeout(() => loaderDiv.style.display = 'none', 500);

        // デバッグ描画
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        if(results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        }
        canvasCtx.restore();

        const lm = results.poseLandmarks;
        if (!lm) return;

        // --- 姿勢の反映 (Mirror Logic) ---
        // ユーザーの右手(画面右) → モデルの左手(画面右)
        // ユーザーの左手(画面左) → モデルの右手(画面左)

        // Left Arm (User's Right)
        if (bones.Left.Arm && results.poseLandmarks) {
            // Shoulder(12), Elbow(14), Wrist(16)
            solveArm(bones.Left.Arm, bones.Left.ForeArm, lm[12], lm[14], lm[16], new THREE.Vector3(1,0,0));
            
            if (results.rightHandLandmarks && bones.Left.Hand) {
                solveHandFull(bones.Left.Hand, bones.Left.Fingers, results.rightHandLandmarks, new THREE.Vector3(1,0,0), false);
            }
        }

        // Right Arm (User's Left)
        if (bones.Right.Arm && results.poseLandmarks) {
            // Shoulder(11), Elbow(13), Wrist(15)
            solveArm(bones.Right.Arm, bones.Right.ForeArm, lm[11], lm[13], lm[15], new THREE.Vector3(-1,0,0));
            
            if (results.leftHandLandmarks && bones.Right.Hand) {
                solveHandFull(bones.Right.Hand, bones.Right.Fingers, results.leftHandLandmarks, new THREE.Vector3(-1,0,0), true);
            }
        }
    }

    const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
    holistic.setOptions({
        modelComplexity: 1, // 精度重視
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        refineFaceLandmarks: false, // 顔は今回使わないのでOFFにして軽量化
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    holistic.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await holistic.send({image: videoElement});
        },
        width: 640,
        height: 480
    });
    cameraUtils.start();

    // リサイズ対応
    window.addEventListener('resize', () => {
        camera3D.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
        camera3D.updateProjectionMatrix();
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
    });

    // アニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera3D);
    }
    animate();

</script>
