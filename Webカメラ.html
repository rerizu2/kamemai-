<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE STOP-MOTION CAMERA</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; 
            --danger: #ff4757; --success: #2ecc71; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: auto; }
        .panel { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,251,255,0.1); }
        
        button, select { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-main { background: var(--accent); color: #000; }
        .btn-sub { background: #333; color: white; border: 1px solid #555; }
        select.device-selector { background: #000; color: var(--accent); border: 1px solid var(--accent); width: 100%; max-width: 400px; outline: none; }

        .video-container { position: relative; display: inline-block; width: 100%; max-width: 500px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; }
        
        .status-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .on-air { color: var(--danger); animation: blink 1s infinite; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }

        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .video-card { background: #1e1e1e; padding: 10px; border-radius: 12px; border: 1px solid #444; }

        .hidden { display: none !important; }
        #log { font-size: 11px; color: #888; text-align: left; background: #000; padding: 10px; border-radius: 8px; margin-top: 15px; height: 80px; overflow-y: auto; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--accent); text-shadow: 0 0 10px var(--accent);">ULTIMATE STOP-MOTION</h2>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initNode('camera')">📸 カメラとして配信する</button>
        <button class="btn-sub" onclick="initNode('monitor')">🖥️ モニターで監視する</button>
    </div>

    <!-- 配信側UI -->
    <div id="camera-ui" class="panel hidden">
        <div class="video-container">
            <video id="local-preview" autoplay playsinline muted></video>
            <!-- コマ撮り処理用隠しキャンバス -->
            <canvas id="proc-canvas" class="hidden"></canvas>
            <div class="status-badge"><span class="on-air">● TRANSMITTING</span> <span id="peer-id-display">ID: ----</span></div>
        </div>

        <div style="margin-top:15px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="width: 100%; max-width: 400px; text-align: left;">
                <label style="font-size:12px; color:#aaa;">📷 カメラ選択:</label>
                <select id="camera-select" class="device-selector" onchange="changeCamera(this.value)"></select>
            </div>
            
            <div style="width: 100%; max-width: 400px; text-align: left;">
                <label style="font-size:12px; color:#aaa;">⏱️ コマ撮り間隔 (送信頻度):</label>
                <select id="interval-select" class="device-selector" onchange="updateInterval(this.value)">
                    <option value="0">リアルタイム (30fps)</option>
                    <option value="500">0.5秒に1回</option>
                    <option value="1000" selected>1秒に1回</option>
                    <option value="3000">3秒に1回</option>
                    <option value="5000">5秒に1回</option>
                    <option value="10000">10秒に1回</option>
                </select>
            </div>
        </div>

        <div id="log">ログ: システム起動中...</div>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-ui" class="panel hidden">
        <div id="public-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:20px;"></div>
        <input type="text" id="target-id" placeholder="IDを入力" style="padding:10px; border-radius:5px; background:#000; color:var(--accent); border:1px solid #444; width:100px; text-align:center;">
        <button class="btn-main" onclick="connectToCamera()">直接接続</button>
        <div id="monitor-grid"></div>
        <div id="monitor-log" id="log" style="font-size:11px; color:#888; text-align:left; background:#000; padding:10px; margin-top:20px;">モニターログ: 待機中...</div>
    </div>
</div>

<script>
    let peer, localStream, processedStream, mqttClient;
    let myPeerId = null;
    let stopMotionTimer = null;
    let currentInterval = 1000; // 初期値1秒

    const canvas = document.getElementById('proc-canvas');
    const ctx = canvas.getContext('2d');

    function addLog(msg, isMonitor = false) {
        const id = isMonitor ? 'monitor-log' : 'log';
        const el = document.getElementById(id);
        if (el) el.innerHTML = `> ${msg}<br>${el.innerHTML}`;
    }

    // --- コマ撮りエンジンのコア ---
    function startStopMotionLoop() {
        if (stopMotionTimer) clearInterval(stopMotionTimer);
        
        const videoEl = document.getElementById('local-preview');
        
        const updateFrame = () => {
            if (videoEl.paused || videoEl.ended) return;
            
            // キャンバスサイズをビデオに合わせる
            if (canvas.width !== videoEl.videoWidth) {
                canvas.width = videoEl.videoWidth;
                canvas.height = videoEl.videoHeight;
            }
            
            // 現在のビデオフレームをキャンバスに描画
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            
            // リアルタイム(0)設定でない場合は、次のインターバルまでこの画像が保持される
        };

        if (currentInterval === "0") {
            // リアルタイムの場合は高速で描画
            stopMotionTimer = setInterval(updateFrame, 1000/30);
        } else {
            // 指定ミリ秒ごとに描画（これがコマ撮り効果）
            stopMotionTimer = setInterval(updateFrame, parseInt(currentInterval));
        }
    }

    async function changeCamera(deviceId) {
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: deviceId }, width: 1280, height: 720 },
                audio: false
            });
            document.getElementById('local-preview').srcObject = newStream;
            localStream = newStream;
            addLog("カメラソースを切り替えました");
        } catch (e) { addLog("カメラ切り替え失敗"); }
    }

    function updateInterval(val) {
        currentInterval = val;
        startStopMotionLoop();
        addLog(`送信間隔を ${val === "0" ? 'リアルタイム' : val + 'ms'} に変更しました`);
    }

    async function initNode(mode) {
        document.getElementById('mode-selection').classList.add('hidden');
        
        if (mode === 'camera') {
            document.getElementById('camera-ui').classList.remove('hidden');
            
            // 1. カメラ取得
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            document.getElementById('local-preview').srcObject = localStream;
            
            // 2. コマ撮りストリームの作成 (Canvasからストリームを生成)
            startStopMotionLoop();
            processedStream = canvas.captureStream(30); // 30fpsの枠組みだが、中身の更新はintervalに従う
            
            // 3. デバイスリスト更新
            const devices = await navigator.mediaDevices.enumerateDevices();
            const select = document.getElementById('camera-select');
            devices.filter(d => d.kind === 'videoinput').forEach(d => {
                select.add(new Option(d.label || `Camera ${select.length+1}`, d.deviceId));
            });

            // 4. PeerJS開始
            myPeerId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(myPeerId);
            peer.on('open', id => {
                document.getElementById('peer-id-display').innerText = "ID: " + id;
                addLog("配信準備完了 ID: " + id);
            });

            peer.on('call', call => {
                addLog("モニターが接続しました。コマ撮り映像を送信します。");
                // 加工した（コマ撮りされた）ストリームを渡す
                call.answer(processedStream);
            });

        } else {
            document.getElementById('monitor-ui').classList.remove('hidden');
            peer = new Peer();
        }
    }

    function connectToCamera(targetId) {
        const id = targetId || document.getElementById('target-id').value;
        if (!id) return;
        addLog(`ID:${id} に接続中...`, true);
        
        const call = peer.call(id, new MediaStream());
        call.on('stream', stream => {
            addLog(`ID:${id} 受信開始`, true);
            if (document.getElementById(`v-${id}`)) return;
            
            const card = document.createElement('div');
            card.className = 'video-card';
            card.id = `card-${id}`;
            card.innerHTML = `<video id="v-${id}" autoplay playsinline></video><div>ID: ${id}</div>`;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`v-${id}`).srcObject = stream;
        });
    }
</script>
</body>
</html>
