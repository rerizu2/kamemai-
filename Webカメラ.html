<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチカメラ・ライブモニター</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --danger: #f43f5e; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: auto; text-align: center; }
        h1 { font-size: 1.2rem; color: var(--accent); margin-bottom: 20px; }
        
        .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; }
        input { 
            width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155;
            background: #000; color: #fff; font-size: 18px; text-align: center;
        }
        
        button { 
            width: 90%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-mon { background: #0284c7; color: white; }
        .btn-cam { background: var(--danger); color: white; }
        .btn-scan { background: #10b981; color: white; }
        .btn-back { background: #475569; color: white; margin-top: 20px; }
        button:active { transform: scale(0.96); opacity: 0.8; }

        /* モニター画面：グリッドレイアウト */
        #camera-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 15px; margin-top: 10px; 
        }
        .cam-box { background: #000; border: 2px solid #334155; border-radius: 12px; overflow: hidden; position: relative; }
        .cam-box img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: contain; background: #000; }
        .cam-info { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); padding: 5px; font-size: 11px; display: flex; justify-content: space-between; }

        /* カメラ配信画面 */
        #preview-video { width: 100%; border-radius: 12px; border: 2px solid var(--danger); background: #000; }
        #qr-display { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 10px 0; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 10px; }
        
        .hidden { display: none; }
        .status { font-size: 0.8rem; color: #94a3b8; margin: 10px; }
        .loading-dot { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h1>Camera Share System</h1>

    <!-- 1. メインメニュー -->
    <div id="ui-main" class="card">
        <p>グループ名を入力</p>
        <input type="text" id="group-id" placeholder="例: my-room-777">
        <button class="btn-mon" onclick="initMonitor()">🖥️ モニターを開始 (映像を見る)</button>
        <button class="btn-cam" onclick="showCamOptions()">📸 カメラとして参加 (映像を送る)</button>
    </div>

    <!-- 2. カメラ参加方法選択 -->
    <div id="ui-cam-setup" class="card hidden">
        <button class="btn-scan" onclick="launchScanner()">📷 QRをスキャンして接続</button>
        <div id="reader"></div>
        <p style="margin:15px 0;">または</p>
        <button class="btn-cam" onclick="initCamera(document.getElementById('group-id').value)">直接接続する</button>
        <button class="btn-back" onclick="location.reload()">戻る</button>
    </div>

    <!-- 3. モニター画面 (複数の映像が並ぶ) -->
    <div id="ui-monitor" class="hidden">
        <div class="card">
            <div class="status">グループ: <b id="display-mon-id" style="color:var(--accent)"></b></div>
            <div id="qr-display"></div>
            <div class="status">このQRをカメラで読み取ってください</div>
        </div>
        <div id="camera-grid"></div>
        <button class="btn-back" onclick="location.reload()">モニターを終了</button>
    </div>

    <!-- 4. カメラ配信画面 -->
    <div id="ui-camera" class="hidden">
        <div class="card">
            <div class="status" id="cam-status">接続準備中...</div>
            <video id="preview-video" autoplay playsinline muted></video>
            <canvas id="send-canvas" class="hidden"></canvas>
        </div>
        <button class="btn-back" onclick="location.reload()">配信を停止</button>
    </div>
</div>

<script>
    let peer;
    let conn;
    let html5QrCode;
    const FPS_INTERVAL = 100; // 0.1秒
    const RES_WIDTH = 400;    // 画質（横幅）
    const JPG_QUALITY = 0.4;  // 圧縮率

    // --- 【モニター側】のロジック ---
    function initMonitor() {
        const gid = document.getElementById('group-id').value;
        if(!gid) return alert("グループ名を入力してください");
        
        showUI('ui-monitor');
        document.getElementById('display-mon-id').innerText = gid;

        // モニター用QR生成
        new QRCode(document.getElementById("qr-display"), { text: gid, width: 140, height: 140 });

        // グループ名をIDにして待機
        peer = new Peer(gid);
        
        peer.on('open', () => console.log("Monitor started: " + gid));
        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') alert("このグループ名はすでに使われています");
        });

        // カメラからの接続を受けたとき
        peer.on('connection', (c) => {
            console.log("Camera connected: " + c.peer);
            createCamBox(c.peer); // 表示枠を作成

            c.on('data', (data) => {
                const targetImg = document.getElementById(`img-${c.peer}`);
                if(targetImg) {
                    targetImg.src = data; // 届いた画像を表示
                }
            });

            c.on('close', () => {
                document.getElementById(`box-${c.peer}`)?.remove();
            });
        });
    }

    // 映像枠を動的に追加
    function createCamBox(peerId) {
        if(document.getElementById(`box-${peerId}`)) return;
        const grid = document.getElementById('camera-grid');
        const box = document.createElement('div');
        box.id = `box-${peerId}`;
        box.className = 'cam-box';
        box.innerHTML = `
            <div class="cam-info">
                <span>ID: ${peerId.substring(0,6)}</span>
                <span class="loading-dot">● LIVE</span>
            </div>
            <img id="img-${peerId}" src="">
        `;
        grid.appendChild(box);
    }

    // --- 【カメラ側】のロジック ---
    function showCamOptions() { showUI('ui-cam-setup'); }

    function launchScanner() {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
            (text) => {
                html5QrCode.stop();
                initCamera(text);
            }
        );
    }

    async function initCamera(targetGid) {
        if(!targetGid) return alert("グループIDがありません");
        showUI('ui-camera');
        
        const video = document.getElementById('preview-video');
        const canvas = document.getElementById('send-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 640 }, audio: false 
            });
            video.srcObject = stream;
        } catch (e) { alert("カメラが使えません"); return; }

        peer = new Peer(); // カメラ側はランダムID
        peer.on('open', (myId) => {
            const c = peer.connect(targetGid);
            c.on('open', () => {
                document.getElementById('cam-status').innerText = "配信中: " + targetGid;
                // 0.1秒おきに画像を送信
                setInterval(() => {
                    if(c.open) {
                        const h = video.videoHeight * (RES_WIDTH / video.videoWidth);
                        canvas.width = RES_WIDTH;
                        canvas.height = h;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        c.send(canvas.toDataURL('image/jpeg', JPG_QUALITY));
                    }
                }, FPS_INTERVAL);
            });
            c.on('error', () => alert("モニターが見つかりません"));
        });
    }

    // UI切り替え
    function showUI(id) {
        ['ui-main', 'ui-cam-setup', 'ui-monitor', 'ui-camera'].forEach(el => {
            document.getElementById(el).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }
</script>

</body>
</html>
