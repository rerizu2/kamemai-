<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI骨格検知・高度監視システム</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- AIライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        :root { --main-color: #00f2ff; --bg-color: #0f172a; --card-bg: #1e293b; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); color: white; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: auto; }
        
        .panel { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 20px; border: 1px solid #334155; }
        button { padding: 12px 24px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--main-color); color: #000; }
        .btn-main:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn-sub { background: #475569; color: white; }

        /* モニターグリッド */
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .video-card { background: #000; padding: 12px; border-radius: 16px; border: 2px solid transparent; position: relative; }
        .detecting { border-color: #ff4444; box-shadow: 0 0 20px rgba(255, 68, 68, 0.4); }
        canvas { width: 100%; border-radius: 8px; display: block; background: #000; }

        /* 検知通知アニメーション */
        .alert-badge { position: absolute; top: 20px; left: 20px; background: #ff4444; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; animation: pulse 1s infinite; z-index: 5; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 履歴ギャラリー */
        .history-section { margin-top: 30px; text-align: left; }
        .log-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
        .log-item { background: var(--card-bg); padding: 8px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #334155; }
        .log-item:hover { transform: scale(1.05); background: #334155; }
        .log-item img { width: 100%; border-radius: 8px; display: block; }
        .log-info { font-size: 10px; margin-top: 5px; color: #94a3b8; text-align: center; }

        /* 拡大表示（モーダル） */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 10px; border: 2px solid var(--main-color); }
        #modal .modal-info { margin-top: 15px; font-size: 18px; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; }

        #id-display { font-size: 50px; font-weight: bold; color: var(--main-color); margin: 15px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: var(--main-color)">Pose Guard System</h2>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラ（送信機）にする</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ モニター（受信機）にする</button>
        <div id="status-log" style="font-size: 12px; color: #64748b; margin-top: 10px;">システム起動準備中...</div>
    </div>

    <!-- カメラ配信UI -->
    <div id="camera-ui" class="panel hidden">
        <p>モニター側で入力するID:</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        <div style="margin-top:20px;"><video id="temp-video" autoplay playsinline muted style="width:100%; max-width:320px; border-radius:10px;"></video></div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-ui" class="panel hidden">
        <div style="margin-bottom: 20px; display: flex; justify-content: center; gap: 10px;">
            <input type="text" id="peer-id-input" maxlength="4" placeholder="ID" style="width:80px; font-size:20px; padding:10px; border-radius:10px; border:none; text-align:center;">
            <button class="btn-main" onclick="connectToNewCamera()">接続</button>
        </div>
        
        <div id="monitor-grid"></div>

        <div class="history-section">
            <h4>📁 検知履歴（クリックで拡大）</h4>
            <div id="detection-log" class="log-container">
                <p style="color:#475569">まだ履歴はありません</p>
            </div>
        </div>
    </div>
</div>

<!-- 拡大表示用モーダル -->
<div id="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img id="modal-img" src="">
    <div id="modal-text" class="modal-info"></div>
    <div style="margin-top: 20px;">
        <button class="btn-main" id="download-btn">この画像を保存する</button>
        <button class="btn-sub" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
    let peer, detector;
    let myConnections = {};
    const INTERVAL = 300; 
    const IMG_WIDTH = 450;

    function log(msg) { document.getElementById('status-log').innerText = msg; }

    // AIモデルのロード
    async function loadModel() {
        log("骨格検知AIをロード中...");
        detector = await poseDetection.createDetector(
            poseDetection.SupportedModels.MoveNet,
            { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );
        log("✅ 準備完了：モードを選択してください");
    }
    loadModel();

    // --- カメラ側 ---
    async function initAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;

        const rid = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(rid);
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            new QRCode(document.getElementById("qrcode"), { text: id, width: 140, height: 140 });
        });
        peer.on('connection', c => { conns.push(c); });

        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = IMG_WIDTH;
                canvas.height = IMG_WIDTH * (video.videoHeight / video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.5);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, INTERVAL);
    }

    // --- モニター側 ---
    function showMonitorView() {
        showUI('monitor-ui');
        peer = new Peer();
    }

    function connectToNewCamera() {
        const id = document.getElementById('peer-id-input').value;
        if (!id || myConnections[id]) return;
        const conn = peer.connect(id);
        conn.on('open', () => setupCameraCard(id, conn));
    }

    function setupCameraCard(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `<div id="alert-${id}" class="alert-badge hidden">DETECTED</div><canvas id="cvs-${id}"></canvas><div style="margin-top:8px">Camera ID: ${id}</div>`;
        grid.appendChild(card);

        const canvas = document.getElementById(`cvs-${id}`);
        const ctx = canvas.getContext('2d');
        const img = new Image();

        conn.on('data', (data) => {
            img.src = data;
            img.onload = async () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (detector) {
                    const poses = await detector.estimatePoses(canvas);
                    if (poses.length > 0 && poses[0].score > 0.4) {
                        drawSkeleton(ctx, poses[0].keypoints);
                        onDetected(id, canvas);
                    } else {
                        document.getElementById(`alert-${id}`).classList.add('hidden');
                        card.classList.remove('detecting');
                    }
                }
            };
        });
        myConnections[id] = conn;
    }

    function drawSkeleton(ctx, kps) {
        ctx.fillStyle = "#00f2ff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        kps.forEach(kp => { if (kp.score > 0.5) { ctx.beginPath(); ctx.arc(kp.x, kp.y, 5, 0, 2*Math.PI); ctx.fill(); } });
        poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet).forEach(([i, j]) => {
            if (kps[i].score > 0.5 && kps[j].score > 0.5) {
                ctx.beginPath(); ctx.moveTo(kps[i].x, kps[i].y); ctx.lineTo(kps[j].x, kps[j].y); ctx.stroke();
            }
        });
    }

    let lastLogTime = {};
    function onDetected(id, canvas) {
        document.getElementById(`alert-${id}`).classList.remove('hidden');
        document.getElementById(`card-${id}`).classList.add('detecting');
        const now = Date.now();
        if (!lastLogTime[id] || now - lastLogTime[id] > 5000) {
            saveToHistory(id, canvas);
            lastLogTime[id] = now;
            new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play().catch(()=>{});
        }
    }

    // 履歴に保存
    function saveToHistory(id, source) {
        const logContainer = document.getElementById('detection-log');
        if (logContainer.innerText.includes("履歴はありません")) logContainer.innerHTML = "";

        const dataUrl = source.toDataURL('image/png');
        const time = new Date().toLocaleTimeString();
        
        const item = document.createElement('div');
        item.className = 'log-item';
        item.onclick = () => openModal(dataUrl, `検知時刻: ${time} (ID: ${id})`);
        item.innerHTML = `<img src="${dataUrl}"><div class="log-info">${time} (ID:${id})</div>`;
        logContainer.prepend(item);
    }

    // モーダル表示
    function openModal(src, text) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalText = document.getElementById('modal-text');
        const dlBtn = document.getElementById('download-btn');

        modalImg.src = src;
        modalText.innerText = text;
        modal.style.display = 'flex';

        dlBtn.onclick = (e) => {
            e.stopPropagation();
            const link = document.createElement('a');
            link.href = src;
            link.download = `pose-detection-${Date.now()}.png`;
            link.click();
        };
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-ui'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
