<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム・マルチカメラ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        h2 { color: #00ff88; }
        
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00ff88; color: #000; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: #ff4444; color: white; padding: 5px 10px; font-size: 12px; }
        input, select { padding: 12px; border-radius: 8px; border: 2px solid #00ff88; background: #000; color: #00ff88; font-size: 16px; text-align: center; }
        input { width: 120px; font-size: 20px; }
        select { width: 80%; max-width: 300px; margin-top: 10px; cursor: pointer; }

        #monitor-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 15px; 
            margin-top: 20px; 
        }
        .video-card { 
            background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; 
            position: relative; overflow: hidden;
        }
        /* videoタグのスタイル設定 */
        .video-card video { width: 100%; border-radius: 5px; background: #111; aspect-ratio: 4/3; object-fit: cover; }
        
        .video-card .info { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 8px; font-size: 14px; color: #aaa;
        }

        #camera-ui video { width: 100%; max-width: 400px; border-radius: 10px; border: 1px solid #00ff88; }
        #id-display { font-size: 48px; font-weight: bold; color: #00ff88; margin: 10px 0; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>リアルタイム・マルチカメラ</h2>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 この端末をカメラにする</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ 複数のカメラを見る</button>
    </div>

    <!-- 【配信側】 -->
    <div id="camera-ui" class="panel hidden">
        <p>配信中... カメラID</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        
        <div style="margin-top:15px;">
            <video id="local-video" autoplay playsinline muted></video>
        </div>

        <div>
            <select id="camera-select" onchange="onCameraChange(this.value)">
                <option value="">カメラ読み込み中...</option>
            </select>
        </div>
    </div>

    <!-- 【モニター側】 -->
    <div id="monitor-setup" class="panel hidden">
        <div style="margin-bottom: 15px;">
            <input type="text" id="peer-id-input" maxlength="4" placeholder="ID" inputmode="numeric">
            <button class="btn-main" onclick="connectToNewCamera()">追加する</button>
            <button class="btn-sub" onclick="startQRScanner()">📷 QR読取</button>
        </div>
        <div id="reader"></div>
        <div id="monitor-grid"></div>
    </div>
</div>

<script>
    let peer;
    let currentStream = null;
    let activeCalls = {}; // 接続中のコールを管理

    // --- カメラ配信側の処理 ---

    async function updateCameraList() {
        const select = document.getElementById('camera-select');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            select.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `カメラ ${index + 1}`;
                select.appendChild(option);
            });
        } catch (e) {
            console.error("デバイスリストの取得失敗", e);
        }
    }

    async function startCameraStream(deviceId) {
        const video = document.getElementById('local-video');
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" },
            audio: false // 必要なら true に変更
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            video.srcObject = stream;
            
            // すでに接続中のモニターがいれば、新しいストリームに差し替える
            Object.values(activeCalls).forEach(call => {
                const videoTrack = stream.getVideoTracks()[0];
                const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            });

            if (!deviceId) await updateCameraList(); 
        } catch (e) {
            alert("カメラの起動に失敗しました。");
        }
    }

    async function onCameraChange(deviceId) {
        await startCameraStream(deviceId);
    }

    async function initAsCamera() {
        showUI('camera-ui');
        await startCameraStream();
        await updateCameraList();

        function tryConnect() {
            const randomID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(randomID);
            
            peer.on('open', id => {
                document.getElementById('id-display').innerText = id;
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
            });

            // モニターからの着信（call）に応答する
            peer.on('call', call => {
                call.answer(currentStream);
                activeCalls[call.peer] = call;
                call.on('close', () => delete activeCalls[call.peer]);
            });

            peer.on('error', err => { 
                if(err.type === 'unavailable-id') tryConnect(); 
                else console.error(err);
            });
        }
        tryConnect();
    }

    // --- モニター側の処理 ---

    function showMonitorView() {
        showUI('monitor-setup');
        peer = new Peer(); 
    }

    function connectToNewCamera(targetId) {
        const id = targetId || document.getElementById('peer-id-input').value;
        if (!id || id.length !== 4) return alert("4桁のIDを入力してください");
        if (activeCalls[id]) return alert("そのカメラは既に追加されています");

        // カメラ側に発信（空のストリームを渡すか、何も渡さない）
        const call = peer.call(id, new MediaStream());
        setupCameraCard(id, call);
    }

    function setupCameraCard(id, call) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `
            <video id="video-${id}" autoplay playsinline></video>
            <div class="info">
                <span>ID: <b>${id}</b> <span id="stat-${id}">接続中...</span></span>
                <button class="btn-danger" onclick="removeCamera('${id}')">閉じる</button>
            </div>
        `;
        grid.appendChild(card);

        // 相手からの映像ストリームを受信したとき
        call.on('stream', remoteStream => {
            const video = document.getElementById(`video-${id}`);
            const stat = document.getElementById(`stat-${id}`);
            if (video) {
                video.srcObject = remoteStream;
                if(stat) { stat.innerText = "● LIVE"; stat.style.color = "#00ff88"; }
            }
        });

        call.on('close', () => removeCamera(id));
        call.on('error', () => removeCamera(id));
        activeCalls[id] = call;
    }

    function removeCamera(id) {
        if (activeCalls[id]) { 
            activeCalls[id].close(); 
            delete activeCalls[id]; 
        }
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
    }

    function startQRScanner() {
        const reader = new Html5Qrcode("reader");
        reader.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (id) => {
            reader.stop();
            document.getElementById('reader').innerHTML = "";
            connectToNewCamera(id);
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
