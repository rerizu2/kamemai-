<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチ対応・4桁IDカメラ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: #222; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        h2 { color: #00ff88; margin-bottom: 20px; font-size: 1.5em; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00ff88; color: #000; }
        .btn-sub { background: #333; color: white; }
        input { width: 80%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 2px solid #00ff88; background: #000; color: #00ff88; font-size: 32px; text-align: center; letter-spacing: 5px; }
        #id-display { font-size: 60px; font-weight: bold; color: #00ff88; margin: 10px 0; }
        #viewer-count { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
        #display-img { width: 100%; border-radius: 10px; margin-top: 15px; background: #000; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 10px 0; }
        .hidden { display: none; }
        video { width: 100%; border-radius: 10px; display: none; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>マルチ・カメラ共有</h2>

    <!-- メインメニュー -->
    <div id="mode-selection">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラを配信する</button>
        <button class="btn-sub" onclick="showMonitorSetup()">🖥️ 映像を見る</button>
    </div>

    <!-- カメラ側UI -->
    <div id="camera-ui" class="hidden">
        <p>配信中... 4桁ID</p>
        <div id="id-display">----</div>
        <div id="viewer-count">接続中の視聴者: 0人</div>
        <div id="qrcode"></div>
        <video id="temp-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- 見る側：設定 -->
    <div id="monitor-setup" class="hidden">
        <p>カメラの4桁IDを入力</p>
        <input type="text" id="peer-id-input" maxlength="4" placeholder="0000" inputmode="numeric">
        <button class="btn-main" onclick="connectViaInput()">接続する</button>
        <button class="btn-sub" onclick="startQRScanner()">📷 QR読み取り</button>
        <div id="reader"></div>
    </div>

    <!-- 見る側：表示 -->
    <div id="monitor-display" class="hidden">
        <div id="conn-status">接続待機中...</div>
        <img id="display-img" src="">
        <button class="btn-sub" onclick="location.reload()" style="margin-top:20px;">終了</button>
    </div>
</div>

<script>
    let peer;
    let connections = []; // 複数の視聴者を保持する配列
    const INTERVAL = 100; // 0.1秒
    const IMG_WIDTH = 350; // 複数人送信のため少しサイズを小さくして負荷軽減
    const QUALITY = 0.2;   // 画質を少し下げて帯域を確保

    // --- カメラ配信側の処理 ---
    async function initAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        video.style.display = "block";
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 640 } }, 
                audio: false 
            });
            video.srcObject = stream;
        } catch (e) { alert("カメラ許可が必要です"); return; }

        tryToConnectWithRandomId();

        function tryToConnectWithRandomId() {
            const random4Digit = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(random4Digit);

            peer.on('open', (id) => {
                document.getElementById('id-display').innerText = id;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: id, width: 140, height: 140 });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') tryToConnectWithRandomId();
                else console.error(err);
            });

            // 新しい視聴者が接続してきたとき
            peer.on('connection', (conn) => {
                console.log("新規視聴者が接続しました:", conn.peer);
                
                // 接続を管理リストに追加
                connections.push(conn);
                updateViewerCount();

                // 切断時の処理
                conn.on('close', () => {
                    connections = connections.filter(c => c.peer !== conn.peer);
                    updateViewerCount();
                });
                conn.on('error', () => {
                    connections = connections.filter(c => c.peer !== conn.peer);
                    updateViewerCount();
                });
            });

            // 画像送信ループ
            setInterval(() => {
                if (connections.length > 0) {
                    const ratio = video.videoHeight / video.videoWidth;
                    canvas.width = IMG_WIDTH;
                    canvas.height = IMG_WIDTH * ratio;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = canvas.toDataURL('image/jpeg', QUALITY);
                    
                    // 全員に一斉送信
                    connections.forEach(conn => {
                        if (conn.open) {
                            conn.send(imageData);
                        }
                    });
                }
            }, INTERVAL);
        }
    }

    function updateViewerCount() {
        document.getElementById('viewer-count').innerText = `接続中の視聴者: ${connections.length}人`;
    }

    // --- 見る側の処理 ---
    function showMonitorSetup() {
        showUI('monitor-setup');
        peer = new Peer(); 
    }

    function connectViaInput() {
        const id = document.getElementById('peer-id-input').value;
        if (id.length !== 4) return alert("4桁の数字を入力してください");
        connectToPeer(id);
    }

    function startQRScanner() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (id) => {
            html5QrCode.stop();
            document.getElementById('reader').innerHTML = "";
            connectToPeer(id);
        });
    }

    function connectToPeer(targetId) {
        showUI('monitor-display');
        const conn = peer.connect(targetId);
        conn.on('open', () => {
            document.getElementById('conn-status').innerText = "視聴中 (ID: " + targetId + ")";
        });
        conn.on('data', (data) => {
            document.getElementById('display-img').src = data;
        });
        conn.on('close', () => {
            alert("カメラとの接続が終了しました");
            location.reload();
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup', 'monitor-display'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
