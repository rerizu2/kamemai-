<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチカメラ・モニター</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        h2 { color: #00ff88; }
        
        /* メニュー・設定エリア */
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #00ff88; color: #000; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: #ff4444; color: white; padding: 5px 10px; font-size: 12px; }
        input { padding: 12px; border-radius: 8px; border: 2px solid #00ff88; background: #000; color: #00ff88; font-size: 20px; text-align: center; width: 120px; }

        /* マルチビュー・グリッドレイアウト */
        #monitor-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; 
            margin-top: 20px; 
        }
        .video-card { 
            background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; 
            position: relative; overflow: hidden;
        }
        .video-card img { width: 100%; border-radius: 5px; min-height: 150px; background: #111; }
        .video-card .info { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 8px; font-size: 14px; color: #aaa;
        }

        /* 配信側UI */
        #camera-ui video { width: 100%; max-width: 400px; border-radius: 10px; border: 1px solid #00ff88; }
        #id-display { font-size: 48px; font-weight: bold; color: #00ff88; margin: 10px 0; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; display: inline-block; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>マルチカメラ・システム</h2>

    <!-- モード選択 -->
    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 この端末をカメラにする</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ 複数のカメラを見る</button>
    </div>

    <!-- 【配信側】 -->
    <div id="camera-ui" class="panel hidden">
        <p>配信中... カメラID</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        <div style="margin-top:15px;">
            <video id="temp-video" autoplay playsinline muted></video>
        </div>
        <div>
            <button class="btn-sub" onclick="switchCamera()">🔄 カメラ切替</button>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- 【モニター側】接続コントロール -->
    <div id="monitor-setup" class="panel hidden">
        <div style="margin-bottom: 15px;">
            <input type="text" id="peer-id-input" maxlength="4" placeholder="ID" inputmode="numeric">
            <button class="btn-main" onclick="connectToNewCamera()">追加する</button>
            <button class="btn-sub" onclick="startQRScanner()">📷 QR読取</button>
        </div>
        <div id="reader"></div>
        
        <!-- 映像並列表示エリア -->
        <div id="monitor-grid">
            <!-- ここにカメラ映像が動的に追加される -->
        </div>
    </div>
</div>

<script>
    let peer;
    const INTERVAL = 100; // 0.1秒
    const IMG_WIDTH = 350; 
    const QUALITY = 0.3;
    let myConnections = {}; // 接続中のカメラを管理

    // カメラ切り替え用
    let currentStream = null;
    let currentFacingMode = "environment"; // 初期値は背面

    // --- カメラ配信側の処理 ---
    async function startCameraStream() {
        const video = document.getElementById('temp-video');
        
        // 既存のストリームがあれば停止
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacingMode }, 
                audio: false 
            });
            currentStream = stream;
            video.srcObject = stream;
        } catch (e) {
            console.error(e);
            alert("カメラの起動に失敗しました。許可設定を確認してください。");
        }
    }

    async function switchCamera() {
        // モードを反転
        currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
        await startCameraStream();
    }

    async function initAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        const connections = [];

        await startCameraStream();

        function tryConnect() {
            const randomID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(randomID);
            peer.on('open', id => {
                document.getElementById('id-display').innerText = id;
                document.getElementById("qrcode").innerHTML = ""; // 初期化
                new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
            });
            peer.on('error', err => { if(err.type==='unavailable-id') tryConnect(); });
            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('close', () => {
                    const index = connections.indexOf(conn);
                    if (index > -1) connections.splice(index, 1);
                });
            });

            setInterval(() => {
                // connections が空でなく、かつビデオが準備できている場合
                if (connections.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = IMG_WIDTH;
                    canvas.height = IMG_WIDTH * (video.videoHeight / video.videoWidth);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const data = canvas.toDataURL('image/jpeg', QUALITY);
                    connections.forEach(c => { if(c.open) c.send(data); });
                }
            }, INTERVAL);
        }
        tryConnect();
    }

    // --- モニター側の処理 ---
    function showMonitorView() {
        showUI('monitor-setup');
        peer = new Peer(); 
    }

    function connectToNewCamera(targetId) {
        const id = targetId || document.getElementById('peer-id-input').value;
        if (!id || id.length !== 4) return alert("4桁のIDを入力してください");
        if (myConnections[id]) return alert("そのカメラは既に追加されています");

        const conn = peer.connect(id);
        setupCameraCard(id, conn);
    }

    function setupCameraCard(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `
            <img id="img-${id}" src="">
            <div class="info">
                <span>ID: <b>${id}</b> <span id="stat-${id}">接続中...</span></span>
                <button class="btn-danger" onclick="removeCamera('${id}')">閉じる</button>
            </div>
        `;
        grid.appendChild(card);

        conn.on('open', () => {
            const stat = document.getElementById(`stat-${id}`);
            if(stat) {
                stat.innerText = "● LIVE";
                stat.style.color = "#00ff88";
            }
            myConnections[id] = conn;
        });

        conn.on('data', (data) => {
            const img = document.getElementById(`img-${id}`);
            if (img) img.src = data;
        });

        conn.on('close', () => removeCamera(id));
        conn.on('error', () => removeCamera(id));
    }

    function removeCamera(id) {
        if (myConnections[id]) {
            myConnections[id].close();
            delete myConnections[id];
        }
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
    }

    function startQRScanner() {
        const reader = new Html5Qrcode("reader");
        reader.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (id) => {
            reader.stop();
            document.getElementById('reader').innerHTML = "";
            connectToNewCamera(id);
        });
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>

</body>
</html>
