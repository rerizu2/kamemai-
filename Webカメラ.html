<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速コマ撮り共有 (10 FPS)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #000; color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        #display-img { width: 100%; height: auto; border-radius: 8px; background: #222; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; display: none; } /* 送信側プレビュー */
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 8px; background: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        #qrcode { background: #fff; padding: 10px; border-radius: 8px; margin: 15px auto; display: inline-block; }
        .status-bar { font-size: 0.8em; color: #aaa; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3>高速コマ撮り配信 (0.1s)</h3>

    <div id="mode-selection" class="controls">
        <button onclick="startAsCamera()">📸 カメラとして送信開始</button>
        <button style="background:#444;" onclick="startAsMonitor()">🖥️ 受信機として表示</button>
    </div>

    <!-- カメラ側UI -->
    <div id="camera-ui" class="hidden">
        <div class="status-bar">ID: <span id="my-id-text">発行中...</span></div>
        <div id="qrcode"></div>
        <p>相手にQRを読み取らせてください</p>
        <video id="temp-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-ui" class="hidden">
        <div id="conn-status" class="status-bar">接続を待機中...</div>
        <img id="display-img" src="" alt="映像待機中">
        <p style="font-size:0.7em;">※ネットワークが遅いとラグが発生します</p>
    </div>
</div>

<script>
    let peer;
    let conn;
    const INTERVAL = 100; // 0.1秒 (100ms)
    const IMG_WIDTH = 400; // 送信画像の横幅（小さいほど高速・低遅延）
    const QUALITY = 0.3;   // JPEG品質 (0.1〜1.0)

    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        if (targetId) {
            startAsMonitor();
            setTimeout(() => connectToPeer(targetId), 1000);
        }
    };

    async function startAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        video.style.display = "block"; // 送信側もプレビュー表示
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 640 }, 
                audio: false 
            });
            video.srcObject = stream;
        } catch (e) { alert("カメラが起動できません。HTTPS環境か確認してください。"); }

        peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('my-id-text').innerText = id;
            generateQR(id);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            console.log("接続完了");
            
            // 0.1秒ごとのループ
            setInterval(() => {
                if (conn && conn.open) {
                    // アスペクト比を維持してリサイズ
                    const ratio = video.videoHeight / video.videoWidth;
                    canvas.width = IMG_WIDTH;
                    canvas.height = IMG_WIDTH * ratio;
                    
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // 圧縮して送信
                    const imageData = canvas.toDataURL('image/jpeg', QUALITY);
                    conn.send(imageData); 
                }
            }, INTERVAL);
        });
    }

    function startAsMonitor() {
        showUI('monitor-ui');
        peer = new Peer();
        peer.on('connection', (connection) => setupReceiver(connection));
    }

    function connectToPeer(targetId) {
        conn = peer.connect(targetId);
        setupReceiver(conn);
    }

    function setupReceiver(connection) {
        connection.on('open', () => {
            document.getElementById('conn-status').innerText = "通信確立：映像受信中...";
        });
        connection.on('data', (data) => {
            document.getElementById('display-img').src = data;
        });
        connection.on('close', () => {
            document.getElementById('conn-status').innerText = "切断されました。";
        });
    }

    function generateQR(id) {
        const joinUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
        new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 160, height: 160 });
    }

    function showUI(id) {
        document.getElementById('mode-selection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }
</script>

</body>
</html>
