<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コマ撮りカメラ共有 (P2P Data)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #display-img, video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border: none; border-radius: 8px; background: #28a745; color: white; font-weight: bold; cursor: pointer; }
        button.secondary { background: #6c757d; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; }
        .hidden { display: none; }
        .status { font-size: 0.8em; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>コマ撮りカメラ共有</h2>

    <!-- モード選択 -->
    <div id="mode-selection" class="controls">
        <button onclick="startAsCamera()">📸 カメラとして画像を送信</button>
        <button class="secondary" onclick="startAsMonitor()">🖥️ 受信機として画像を表示</button>
    </div>

    <!-- カメラ側UI -->
    <div id="camera-ui" class="hidden">
        <p class="status">ID: <span id="my-id-text">発行中...</span></p>
        <div id="qrcode"></div>
        <p class="status">このQRを相手のスマホで読み取ってください</p>
        <!-- プレビュー用（非表示でも可） -->
        <video id="temp-video" autoplay playsinline muted style="height:100px; width:auto;"></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側UI -->
    <div id="monitor-ui" class="hidden">
        <p id="conn-status">接続待ち...</p>
        <img id="display-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="映像がここに表示されます">
    </div>
</div>

<script>
    let peer;
    let conn;
    const FPS = 2; // 1秒間に何枚送るか（通信が不安定なら1〜2に下げる）

    // URLパラメータで自動接続
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        if (targetId) {
            startAsMonitor();
            setTimeout(() => connectToPeer(targetId), 1000);
        }
    };

    // --- カメラ側の処理 ---
    async function startAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');

        // カメラ起動
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;

        peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('my-id-text').innerText = id;
            generateQR(id);
        });

        // 相手が接続してきたら
        peer.on('connection', (connection) => {
            conn = connection;
            console.log("接続されました");
            
            // 画像送信ループ開始
            setInterval(() => {
                if (conn && conn.open) {
                    // Canvasに現在のビデオ枠を描画
                    canvas.width = video.videoWidth / 2; // サイズを半分にして軽量化
                    canvas.height = video.videoHeight / 2;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // JPEG圧縮してBase64文字列に変換 (品質0.5)
                    const imageData = canvas.toDataURL('image/jpeg', 0.5);
                    conn.send(imageData); 
                }
            }, 1000 / FPS);
        });
    }

    // --- モニター側の処理 ---
    function startAsMonitor() {
        showUI('monitor-ui');
        peer = new Peer();
        
        peer.on('connection', (connection) => {
            setupReceiver(connection);
        });
    }

    function connectToPeer(targetId) {
        conn = peer.connect(targetId);
        setupReceiver(conn);
    }

    function setupReceiver(connection) {
        connection.on('open', () => {
            document.getElementById('conn-status').innerText = "接続中...";
        });
        connection.on('data', (data) => {
            // 届いたBase64画像をimgタグにセット
            document.getElementById('display-img').src = data;
        });
    }

    // 共通ツール
    function generateQR(id) {
        const joinUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
        new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 160, height: 160 });
    }

    function showUI(id) {
        document.getElementById('mode-selection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }
</script>

</body>
</html>
