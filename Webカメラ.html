<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI骨格検知・画像履歴ビューア</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 950px; margin: auto; }
        .panel { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        button { padding: 15px 25px; margin: 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-main { background: #00e1ff; color: #000; }
        .btn-sub { background: #444; color: white; }
        .btn-danger { background: #ff4444; color: white; padding: 5px 10px; font-size: 12px; }
        
        #monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .video-card { background: #000; padding: 10px; border-radius: 12px; border: 1px solid #444; position: relative; }
        .detecting { border: 2px solid #00e1ff !important; box-shadow: 0 0 15px #00e1ff; }
        
        canvas { width: 100%; border-radius: 5px; display: block; background: #111; }
        .alert-msg { position: absolute; top: 20px; left: 20px; background: red; padding: 5px 10px; border-radius: 5px; font-weight: bold; z-index: 5; }

        /* 検知履歴エリアのスタイル */
        #log-container { text-align: left; margin-top: 30px; }
        .log-list { display: flex; overflow-x: auto; gap: 15px; padding: 10px; background: #1a1a1a; border-radius: 10px; min-height: 180px; align-items: flex-start; }
        .log-item { min-width: 160px; background: #333; padding: 5px; border-radius: 8px; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .log-item:hover { transform: scale(1.05); background: #444; }
        .log-item img { width: 100%; border-radius: 5px; display: block; margin-bottom: 5px; }
        .log-item span { font-size: 11px; color: #ccc; display: block; margin-bottom: 5px; }

        /* 拡大表示用モーダル */
        #modal-overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center;
        }
        #modal-overlay img { max-width: 90%; max-height: 70%; border: 2px solid #00e1ff; border-radius: 10px; }
        #modal-close { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; }

        #id-display { font-size: 60px; font-weight: bold; color: #00e1ff; margin: 10px 0; }
        #qrcode { background: white; padding: 15px; border-radius: 10px; display: inline-block; }
        #camera-ui video { width: 100%; max-width: 400px; border-radius: 10px; }
        .hidden { display: none; }
        #status-log { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI骨格検知・遠隔モニター</h2>

    <div id="mode-selection" class="panel">
        <button class="btn-main" onclick="initAsCamera()">📸 カメラを配置する</button>
        <button class="btn-sub" onclick="showMonitorView()">🖥️ 履歴を確認・監視する</button>
        <div id="status-log">システム準備中...</div>
    </div>

    <!-- カメラ側 -->
    <div id="camera-ui" class="panel hidden">
        <p>カメラID (モニター側に入力)</p>
        <div id="id-display">----</div>
        <div id="qrcode"></div>
        <div style="margin-top:15px;"><video id="temp-video" autoplay playsinline muted></video></div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- モニター側 -->
    <div id="monitor-setup" class="panel hidden">
        <div style="margin-bottom: 20px;">
            <input type="text" id="peer-id-input" maxlength="4" placeholder="4桁ID" style="font-size:20px; width:100px; padding:10px; text-align:center;">
            <button class="btn-main" onclick="connectToNewCamera()">カメラ追加</button>
        </div>
        <div id="monitor-grid"></div>

        <div id="log-container">
            <h4>👤 人検知・画像履歴 (クリックで拡大/保存)</h4>
            <div id="detection-log" class="log-list">
                <p style="color:#555; padding: 20px;">履歴はありません</p>
            </div>
        </div>
    </div>
</div>

<!-- 画像拡大表示用モーダル -->
<div id="modal-overlay" onclick="closeModal()">
    <span id="modal-close">&times;</span>
    <img id="modal-img" src="">
    <p id="modal-info" style="margin-top:15px;"></p>
    <button class="btn-main" id="download-btn">画像を保存する</button>
    <p style="font-size:12px; color:#888; margin-top:10px;">画面のどこかをタップで閉じます</p>
</div>

<script>
    let peer;
    let detector = null;
    let myConnections = {};
    const INTERVAL = 250; 
    const IMG_WIDTH = 450;

    function log(msg) { document.getElementById('status-log').innerText = msg; }

    // AIモデル読み込み
    async function loadPoseModel() {
        try {
            detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet,
                { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
            );
            log("✅ 準備完了");
        } catch (e) { log("❌ モデル読み込み失敗"); }
    }
    loadPoseModel();

    // --- カメラ側機能 ---
    async function initAsCamera() {
        showUI('camera-ui');
        const video = document.getElementById('temp-video');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        let conns = [];

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;

        const rid = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(rid);
        peer.on('open', id => {
            document.getElementById('id-display').innerText = id;
            new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150 });
            log("カメラ待機中... ID:" + id);
        });
        peer.on('connection', c => { conns.push(c); log("モニターが接続しました"); });

        setInterval(() => {
            if (conns.length > 0 && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = IMG_WIDTH;
                canvas.height = IMG_WIDTH * (video.videoHeight / video.videoWidth);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.5);
                conns.forEach(c => { if(c.open) c.send(data); });
            }
        }, INTERVAL);
    }

    // --- モニター側機能 ---
    function showMonitorView() { showUI('monitor-setup'); peer = new Peer(); }

    function connectToNewCamera() {
        const id = document.getElementById('peer-id-input').value;
        if (!id || myConnections[id]) return;
        const conn = peer.connect(id);
        conn.on('open', () => setupCameraCard(id, conn));
    }

    function setupCameraCard(id, conn) {
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `<div id="alert-${id}" class="alert-msg hidden">人検知！</div><canvas id="cvs-${id}"></canvas><div>ID: ${id}</div>`;
        grid.appendChild(card);

        const canvas = document.getElementById(`cvs-${id}`);
        const ctx = canvas.getContext('2d');
        const img = new Image();

        conn.on('data', async (data) => {
            img.src = data;
            img.onload = async () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (detector) {
                    const poses = await detector.estimatePoses(canvas);
                    if (poses && poses.length > 0 && poses[0].score > 0.4) {
                        drawSkeleton(ctx, poses[0].keypoints);
                        triggerDetection(id, canvas);
                    } else {
                        document.getElementById(`alert-${id}`).classList.add('hidden');
                        card.classList.remove('detecting');
                    }
                }
            };
        });
        myConnections[id] = conn;
    }

    function drawSkeleton(ctx, keypoints) {
        ctx.fillStyle = "#00e1ff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        keypoints.forEach(kp => { if (kp.score > 0.5) { ctx.beginPath(); ctx.arc(kp.x, kp.y, 4, 0, 2 * Math.PI); ctx.fill(); } });
        poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet).forEach(([i, j]) => {
            const kp1 = keypoints[i]; const kp2 = keypoints[j];
            if (kp1.score > 0.5 && kp2.score > 0.5) { ctx.beginPath(); ctx.moveTo(kp1.x, kp1.y); ctx.lineTo(kp2.x, kp2.y); ctx.stroke(); }
        });
    }

    let lastLogTime = {};
    function triggerDetection(id, canvas) {
        document.getElementById(`alert-${id}`).classList.remove('hidden');
        document.getElementById(`card-${id}`).classList.add('detecting');
        const now = Date.now();
        if (!lastLogTime[id] || now - lastLogTime[id] > 5000) {
            saveDetection(id, canvas);
            lastLogTime[id] = now;
            playBeep();
        }
    }

    // 履歴保存とクリックイベントの追加
    function saveDetection(id, sourceCanvas) {
        const logList = document.getElementById('detection-log');
        if (logList.innerText.includes("履歴はありません")) logList.innerHTML = "";

        const time = new Date().toLocaleTimeString();
        const dataUrl = sourceCanvas.toDataURL('image/jpeg', 0.8);

        const item = document.createElement('div');
        item.className = 'log-item';
        item.onclick = () => openModal(dataUrl, `検知時刻: ${time} (カメラID: ${id})`);
        item.innerHTML = `
            <img src="${dataUrl}">
            <span>${time} (ID:${id})</span>
        `;
        logList.prepend(item);
    }

    // モーダル表示機能
    function openModal(url, info) {
        document.getElementById('modal-img').src = url;
        document.getElementById('modal-info').innerText = info;
        document.getElementById('modal-overlay').style.display = 'flex';
        
        // ダウンロードボタンの設定
        const btn = document.getElementById('download-btn');
        btn.onclick = (e) => {
            e.stopPropagation(); // モーダルを閉じないようにする
            const a = document.createElement('a');
            a.href = url;
            a.download = `detection_${Date.now()}.jpg`;
            a.click();
        };
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function playBeep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    function showUI(uiId) {
        ['mode-selection', 'camera-ui', 'monitor-setup'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(uiId).classList.remove('hidden');
    }
</script>
</body>
</html>
