<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v28.0 (Interactive Edition)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #050505; --panel: #151515; --danger: #ff4757; 
            --success: #2ecc71; --warning: #f1c40f; --text: #f0f0f0;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* ログイン画面 */
        #setup-screen { 
            position: fixed; inset: 0; background: radial-gradient(circle, #222 0%, #000 100%); 
            display: flex; justify-content: center; align-items: center; z-index: 100000; 
        }
        .modal-box { 
            background: var(--panel); padding: 40px; border-radius: 30px; text-align: center; 
            width: 380px; border: 1px solid #333; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        input, select { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; 
            background: #000; color: white; box-sizing: border-box; font-size: 16px;
        }

        /* メインUI */
        #main-ui { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        #main-ui.active { display: flex; }

        header { 
            height: 60px; background: #111; border-bottom: 1px solid #222; 
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0;
        }
        .badge { font-size: 11px; padding: 4px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* 配信エリア */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .broadcast-container { 
            flex: 2; position: relative; display: flex; justify-content: center; align-items: center; 
            border-bottom: 2px solid #222; overflow: hidden;
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; background: #000; transition: transform 0.3s; }
        #view-label { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 6px 15px; border-radius: 8px; border: 1px solid var(--accent); font-size: 12px; z-index: 10; backdrop-filter: blur(5px); }
        #drawing-canvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

        /* 監視グリッド（先生のみ） */
        .monitor-grid { 
            height: 180px; display: flex; gap: 15px; padding: 10px 15px; overflow-x: auto; 
            background: #080808; border-top: 1px solid #222; flex-shrink: 0; align-items: center;
        }
        .card { 
            width: 180px; flex-shrink: 0; background: var(--panel); border-radius: 18px; 
            overflow: hidden; position: relative; border: 1px solid #333; transition: 0.2s;
        }
        .card video { width: 100%; height: 100px; object-fit: cover; background: #000; }

        /* サイドバー */
        .sidebar { 
            width: 320px; background: #111; border-left: 1px solid #222; 
            display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto; flex-shrink: 0;
        }
        .side-panel { background: var(--panel); border-radius: 20px; padding: 15px; border: 1px solid #222; }
        .panel-title { font-size: 11px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }

        /* ボタン */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 12px; padding: 12px; transition: 0.2s; font-size: 13px; }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; width: 100%; }
        .btn-warning { background: var(--warning); color: black; width: 100%; }
        .btn-mini { padding: 4px 8px; font-size: 10px; width: 100%; border-radius: 0; }

        .user-row { 
            background: #1a1a1a; padding: 10px 15px; border-radius: 12px; margin-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: pointer;
        }
        .user-row:hover { background: #222; border-color: var(--accent); }

        #chat-msgs { flex: 1; background: #000; border-radius: 15px; padding: 12px; font-size: 13px; overflow-y: auto; min-height: 120px; border: 1px solid #222; }
        .vol-bar { height: 4px; background: var(--success); width: 0%; transition: 0.1s; border-radius: 2px; margin-top: 4px; }
        .reaction-layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
        
        /* アンケート表示 */
        .poll-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 30px; border-radius: 25px; border: 3px solid var(--accent); z-index: 200000; display: none; width: 320px; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.9); }
        .poll-overlay h3 { margin-top: 0; color: var(--accent); }

        .hidden { display: none !important; }
        .hand-pulse { animation: hand-blink 1s infinite; border: 2px solid var(--warning) !important; }
        @keyframes hand-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid #222; }
        }
    </style>
</head>
<body>

<!-- 1. ログイン -->
<div id="setup-screen">
    <div class="modal-box">
        <h2 style="margin-bottom:5px;">EDU-ULTIMATE v28</h2>
        <p style="font-size:11px; color:#888; margin-bottom:20px;">参加者の操作機能を強化しました</p>
        <input type="text" id="user-name" placeholder="あなたのお名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-mode">
            <option value="camera">📷 カメラモードで開始</option>
            <option value="screen">💻 画面共有モードで開始</option>
        </select>
        <button class="btn-blue" style="margin-bottom:10px;" onclick="startSession('teacher')">先生（ホスト）として開始</button>
        <button class="btn-green" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<!-- 2. アンケート(回答用) -->
<div id="poll-box" class="poll-overlay">
    <h3 id="poll-q">質問があります</h3>
    <div id="poll-opts" style="display:flex; flex-direction:column; gap:10px;"></div>
</div>

<!-- 3. メインUI -->
<div id="main-ui">
    <header>
        <div style="display:flex; gap:12px; align-items:center;">
            <span id="role-tag" class="badge" style="background:var(--accent); color:black;">ROLE</span>
            <span id="timer" style="font-family:monospace; opacity:0.6;">00:00:00</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div id="room-display" style="font-size:14px; font-weight:bold; color:var(--accent);">ID: ----</div>
            <button class="btn-red" style="padding:5px 15px; font-size:11px;" onclick="location.reload()">退室</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="content-area">
            <div class="broadcast-container" onclick="forcePlay()">
                <div id="view-label">映像待機中...</div>
                <div id="reaction-layer" class="reaction-layer"></div>
                <canvas id="drawing-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>
            </div>
            <div id="monitor-grid" class="monitor-grid"></div>
        </div>

        <div class="sidebar">
            <!-- 教員用管理 -->
            <div id="teacher-panel" class="side-panel hidden" style="border-color:#552222;">
                <div class="panel-title"><span>DIRECTOR TOOLS</span></div>
                <button class="btn-warning" style="margin-bottom:10px; font-size:11px;" onclick="setGlobalView('teacher')">🔄 全員を教員の画面に戻す</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                    <button class="btn-blue" style="font-size:10px;" onclick="toggleWB()">🎨 板書</button>
                    <button class="btn-blue" style="font-size:10px;" onclick="createPoll()">📊 投票作成</button>
                </div>
                <button class="btn-blue" style="width:100%; margin-bottom:10px;" onclick="handleRecord()" id="rec-btn">🔴 録画</button>
                <div id="qrcode" style="background:white; padding:10px; border-radius:10px; display:flex; justify-content:center;"></div>
            </div>

            <!-- 生徒用挙手 -->
            <div id="student-panel" class="side-panel hidden">
                <button id="hand-btn" class="btn-warning" onclick="toggleHand()">✋ 先生に挙手・質問する</button>
            </div>

            <!-- マイク・カメラの切り替え（全ユーザー共通） -->
            <div class="side-panel">
                <div class="panel-title"><span>MY MEDIA CONTROL</span></div>
                <div style="display:flex; gap:12px; align-items:flex-start;">
                    <div style="width:90px; position:relative;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:65px; object-fit:cover; border-radius:10px; background:#000;"></video>
                        <div class="vol-bar" id="my-vol-bar"></div>
                    </div>
                    <div style="flex:1;">
                        <div id="my-name-label" style="font-size:13px; font-weight:bold; margin-bottom:5px;">User</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                            <button id="mic-btn" class="btn-green" onclick="toggleMic()" style="padding:6px; font-size:11px;">🎤 ON</button>
                            <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="padding:6px; font-size:11px;">📷 ON</button>
                        </div>
                    </div>
                </div>
                <select id="mode-select" style="margin-top:10px; font-size:11px;" onchange="updateMedia()">
                    <option value="camera">📷 カメラモード</option>
                    <option value="screen">💻 画面共有モード</option>
                </select>
            </div>

            <!-- 1対1会話リスト -->
            <div class="side-panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-title"><span>CLASSMATES (会話)</span></div>
                <div id="user-list-items" style="flex:1; overflow-y:auto;"></div>
            </div>

            <!-- チャット・リアクション -->
            <div class="side-panel" style="flex:1.2; display:flex; flex-direction:column; overflow:hidden;">
                <div id="chat-msgs"></div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="chat-input" placeholder="送信..." style="margin-bottom:0; padding:10px; font-size:12px;">
                    <button class="btn-blue" onclick="sendChat()" style="padding:0 15px;">Go</button>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:22px;">
                    <span style="cursor:pointer;" onclick="sendReact('👍')">👍</span>
                    <span style="cursor:pointer;" onclick="sendReact('👏')">👏</span>
                    <span style="cursor:pointer;" onclick="sendReact('😮')">😮</span>
                    <span style="cursor:pointer;" onclick="sendReact('❤️')">❤️</span>
                    <span style="cursor:pointer;" onclick="sendReact('😂')">😂</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let recorder, recordedChunks = [];
    let currentGlobalViewId = "", isHandRaised = false;
    let wbActive = false, wbCtx, drawing = false;

    // --- 1. メディア管理 ---
    async function getStream(mode) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        try {
            const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
            let video;
            if (mode === 'camera') {
                video = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            } else {
                video = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.getVideoTracks()[0].onended = () => { document.getElementById('mode-select').value = 'camera'; updateMedia(); };
            }
            localStream = new MediaStream([...video.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
            document.getElementById('my-preview').srcObject = localStream;
            setupVol(localStream, 'my-vol-bar');
            return localStream;
        } catch (e) { alert("メディアエラー"); return null; }
    }

    // --- 2. 接続開始 ---
    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || "ゲスト";
        roomID = document.getElementById('room-id').value;
        if (!roomID) return alert("部屋IDを入力してください");

        const stream = await getStream(document.getElementById('start-mode').value);
        if (!stream) return;

        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(peerID);

        peer.on('open', () => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-ui').classList.add('active');
            document.getElementById('role-tag').innerText = role;
            document.getElementById('room-display').innerText = "ID: " + roomID;
            document.getElementById('my-name-label').innerText = myName;
            
            if (role === 'teacher') {
                document.getElementById('teacher-panel').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 80, height: 80 });
                setGlobalView('teacher');
                initWB();
                startTimer();
            } else {
                document.getElementById('student-panel').classList.remove('hidden');
                document.body.classList.add('student-mode');
                joinRoom();
            }
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => {
                remoteStreams[call.peer] = s;
                addRemoteVideo(call.peer, s);
                if (currentGlobalViewId === call.peer) applyView(call.peer, true);
            });
        });

        peer.on('connection', conn => setupDataConn(conn));
    }

    function joinRoom() {
        const tID = `T-ROOM-${roomID}`;
        const conn = peer.connect(tID);
        setupDataConn(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(tID, localStream);
        });
    }

    function setupDataConn(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            if (data.type === 'join') {
                students[conn.peer] = { name: data.name, hand: false };
                if (myRole === 'teacher') {
                    broadcastList();
                    conn.send({ type: 'sync', targetId: currentGlobalViewId });
                }
                addChat("System", data.name + "さんが参加");
            }
            if (data.type === 'list') {
                data.list.forEach(u => {
                    if (u.id !== peer.id && !connections[u.id]) {
                        students[u.id] = { name: u.name, hand: u.hand };
                        const c = peer.connect(u.id);
                        setupDataConn(c);
                        c.on('open', () => {
                            c.send({ type: 'hello', name: myName, hand: isHandRaised });
                            peer.call(u.id, localStream);
                        });
                    }
                });
                updateListUI();
            }
            if (data.type === 'hello') { students[conn.peer] = { name: data.name, hand: data.hand }; updateListUI(); }
            if (data.type === 'chat') addChat(data.name, data.msg);
            if (data.type === 'react') showReact(data.emoji, data.name);
            if (data.type === 'sync') applyView(data.targetId, true);
            if (data.type === 'hand') { if(students[conn.peer]) students[conn.peer].hand = data.raised; updateListUI(); }
            if (data.type === 'poll') showPoll(data);
            if (data.type === 'poll_answer') {
                if (myRole === 'teacher') addChat("Poll回答", `${data.name}さん: 「${data.answer}」`);
            }
            if (data.type === 'EXIT_NOW') removePeer(conn.peer);
        });
        conn.on('close', () => removePeer(conn.peer));
    }

    // --- 3. ビデオ表示・指名 ---
    function applyView(id, forceReset = false) {
        if (!id) return;
        currentGlobalViewId = id;
        const mv = document.getElementById('main-video');
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        if (stream) {
            if (forceReset) mv.srcObject = null;
            setTimeout(() => {
                mv.srcObject = stream;
                const name = (id.startsWith("T-ROOM-")) ? "先生" : (students[id]?.name || "自分");
                document.getElementById('view-label').innerText = name + " の画面を配信中";
                mv.play().catch(()=>{});
            }, forceReset ? 300 : 0);
        }
    }

    function setGlobalView(targetId) {
        const id = (targetId === 'teacher') ? peer.id : targetId;
        currentGlobalViewId = id;
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'sync', targetId: id }); });
        applyView(id, true);
    }

    function addRemoteVideo(id, stream) {
        remoteStreams[id] = stream;
        const isT = id.startsWith("T-ROOM-");
        if (myRole === 'teacher' && !isT) {
            if (document.getElementById(`card-${id}`)) return;
            const card = document.createElement('div');
            card.className = 'card'; card.id = `card-${id}`;
            card.innerHTML = `
                <video id="vid-${id}" autoplay playsinline></video>
                <div style="font-size:10px; padding:3px; text-align:center;">${students[id]?.name || '生徒'}</div>
                <div class="vol-bar" id="vol-${id}"></div>
                <button class="btn-mini btn-blue" onclick="setGlobalView('${id}')">指名</button>
            `;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            setupVol(stream, `vol-${id}`);
        }
        if (isT && (currentGlobalViewId === "" || currentGlobalViewId === id)) applyView(id);
    }

    async function updateMedia() {
        const mode = document.getElementById('mode-select').value;
        const s = await getStream(mode);
        if(!s) return;
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(c => {
                if (c.peerConnection) {
                    const senders = c.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind === 'video');
                    const as = senders.find(s => s.track && s.track.kind === 'audio');
                    if (vs) vs.replaceTrack(localStream.getVideoTracks()[0]);
                    if (as) as.replaceTrack(localStream.getAudioTracks()[0]);
                }
            });
        });
        if (myRole === 'teacher' && currentGlobalViewId === peer.id) setGlobalView('teacher');
    }

    // --- 4. 参加者の操作・UI ---
    function updateListUI() {
        const container = document.getElementById('user-list-items');
        container.innerHTML = "";
        Object.keys(students).forEach(id => {
            const row = document.createElement('div');
            row.className = 'user-row';
            if (students[id].hand) row.classList.add('hand-pulse');
            row.innerHTML = `<span>${students[id].hand?'✋ ':''} ${students[id].name}</span>`;
            row.onclick = () => applyView(id, true);
            container.appendChild(row);
            const card = document.getElementById(`card-${id}`);
            if (card) card.classList.toggle('hand-pulse', students[id].hand);
        });
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if (t) { 
            t.enabled = !t.enabled; 
            const btn = document.getElementById('mic-btn');
            btn.innerText = t.enabled ? "🎤 ON" : "🔇 OFF";
            btn.className = t.enabled ? "btn-green" : "btn-red";
        }
    }

    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) { 
            t.enabled = !t.enabled; 
            const btn = document.getElementById('cam-btn');
            btn.innerText = t.enabled ? "📷 ON" : "📷 OFF";
            btn.className = t.enabled ? "btn-green" : "btn-red";
        }
    }

    function toggleHand() {
        isHandRaised = !isHandRaised;
        document.getElementById('hand-btn').classList.toggle('btn-red', isHandRaised);
        Object.values(connections).forEach(c => c.send({ type: 'hand', raised: isHandRaised }));
    }

    // --- アンケート機能 ---
    function createPoll() {
        const q = prompt("質問を入力:"); if(!q) return;
        const opts = prompt("選択肢をカンマ区切りで入力（例：賛成,反対,保留）:"); if(!opts) return;
        const data = { type: 'poll', q, options: opts.split(',') };
        Object.values(connections).forEach(c => c.send(data));
        showPoll(data);
    }

    function showPoll(data) {
        const box = document.getElementById('poll-box');
        document.getElementById('poll-q').innerText = data.q;
        const div = document.getElementById('poll-opts');
        div.innerHTML = "";
        data.options.forEach(opt => {
            const b = document.createElement('button');
            b.className = "btn-blue"; b.innerText = opt;
            b.onclick = () => { 
                box.style.display = 'none'; 
                // 回答を先生（と他のみんな）に送信
                Object.values(connections).forEach(c => c.send({ type: 'poll_answer', name: myName, answer: opt }));
                addChat("Poll", `「${opt}」と回答しました`);
                forcePlay(); // 操作ついでに音声制限を解除
            };
            div.appendChild(b);
        });
        box.style.display = 'block';
    }

    // --- その他ツール ---
    function toggleWB() {
        wbActive = !wbActive;
        document.getElementById('drawing-canvas').style.pointerEvents = wbActive ? 'auto' : 'none';
        addChat("System", "ホワイトボード: " + (wbActive?"ON":"OFF"));
    }

    function initWB() {
        const canvas = document.getElementById('drawing-canvas');
        wbCtx = canvas.getContext('2d');
        const box = document.querySelector('.broadcast-container');
        canvas.width = box.clientWidth; canvas.height = box.clientHeight;
        box.onmousedown = () => { if(wbActive) drawing = true; };
        box.onmousemove = (e) => {
            if(!drawing || !wbActive) return;
            wbCtx.fillStyle = "red";
            wbCtx.fillRect(e.offsetX, e.offsetY, 6, 6);
        };
        box.onmouseup = () => drawing = false;
    }

    function setupVol(stream, barId) {
        const at = stream.getAudioTracks()[0]; if (!at) return;
        const ctx = new AudioContext(); const src = ctx.createMediaStreamSource(new MediaStream([at]));
        const ans = ctx.createAnalyser(); src.connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const update = () => {
            if (!document.getElementById(barId)) return ctx.close();
            ans.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById(barId).style.width = Math.min(100, avg * 3) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        if (!input.value) return;
        addChat("自分", input.value);
        Object.values(connections).forEach(c => c.send({ type: 'chat', name: myName, msg: input.value }));
        input.value = "";
    }

    function addChat(name, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<b style="color:var(--accent)">${name}:</b> ${msg}`;
        const box = document.getElementById('chat-msgs');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function sendReact(emoji) {
        showReact(emoji, "自分");
        Object.values(connections).forEach(c => c.send({ type: 'react', name: myName, emoji }));
    }

    function showReact(emoji, name) {
        const layer = document.getElementById('reaction-layer');
        const div = document.createElement('div');
        div.style.position = 'absolute'; div.style.left = Math.random() * 80 + 10 + "%";
        div.style.bottom = "0px"; div.style.fontSize = "30px"; div.style.transition = "2.5s";
        div.innerHTML = `<div>${emoji}</div><div style="font-size:10px;">${name}</div>`;
        layer.appendChild(div);
        setTimeout(() => { div.style.transform = "translateY(-300px)"; div.style.opacity = "0"; }, 100);
        setTimeout(() => div.remove(), 2500);
    }

    function broadcastList() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name, hand: students[id].hand }));
        list.push({ id: peer.id, name: myName, hand: false });
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'list', list }); });
    }

    function removePeer(id) {
        if (document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        delete connections[id]; delete students[id]; delete remoteStreams[id];
        updateListUI();
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            const s = document.getElementById('main-video').srcObject; if (!s) return;
            recordedChunks = []; recorder = new MediaRecorder(s);
            recorder.ondataavailable = e => recordedChunks.push(e.data);
            recorder.onstop = () => {
                const b = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'lesson.webm'; a.click();
            };
            recorder.start(); document.getElementById('rec-btn').innerText = "⏹ 停止";
        } else { recorder.stop(); document.getElementById('rec-btn').innerText = "🔴 録画"; }
    }

    function startTimer() {
        let sec = 0;
        setInterval(() => {
            sec++;
            const h = Math.floor(sec/3600).toString().padStart(2,'0');
            const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
            const s = (sec%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    function forcePlay() { document.querySelectorAll('video').forEach(v => v.play().catch(()=>{})); }
    window.addEventListener('beforeunload', () => {
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'EXIT_NOW' }); });
        if(peer) peer.destroy();
    });
</script>
</body></html>
