<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v6.0 - Full Audio Mixer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --header-h: 50px; 
            --sidebar-w: 260px; --monitor-w: 220px;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; overflow: hidden; touch-action: manipulation; }
        
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 100%; max-width: 360px; border: 1px solid #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; font-size: 16px; box-sizing: border-box; }
        
        header { background: #111; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; height: var(--header-h); border-bottom: 1px solid #333; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .content-area { flex: 1; display: flex; flex-direction: row; background: #000; overflow: hidden; }
        .broadcast-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-broadcast-video { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.3s ease; }

        .monitor-grid { width: var(--monitor-w); background: #111; border-left: 2px solid #333; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow-y: auto; flex-shrink: 0; }
        .student-card { background: #222; padding: 5px; border-radius: 8px; border: 1px solid #444; text-align: center; flex-shrink: 0; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; object-fit: cover; }
        .name-badge { font-size: 12px; font-weight: bold; color: var(--accent); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sidebar { width: var(--sidebar-w); background: #111; border-left: 1px solid #333; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; transition: 0.2s; font-size: 13px; padding: 10px; }
        .btn-primary { background: #0097e6; color: white; width: 100%; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: black; }
        .btn-mini { padding: 5px; font-size: 11px; border-radius: 4px; }
        
        #chat-messages { flex: 1; min-height: 100px; overflow-y: auto; font-size: 12px; background: #000; padding: 8px; border-radius: 5px; border: 1px solid #333; }
        .chat-name { color: var(--accent); font-weight: bold; }
        .hidden { display: none !important; }

        @media (max-width: 1000px) {
            .main-layout { flex-direction: column; }
            .content-area { flex-direction: column; flex: 2; }
            .monitor-grid { width: 100%; height: 130px; flex-direction: row; border-left: none; border-top: 2px solid #333; }
            .student-card { width: 140px; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #333; flex: 1; }
        }
    </style>
</head>
<body onclick="initAudioContext()"> <!-- どこかをタップすれば音が出るようになる -->

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:15px;">EDU-ULTIMATE v6.0</h2>
        <input type="text" id="user-name" placeholder="氏名を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-media-type">
            <option value="camera">📷 カメラで開始</option>
            <option value="screen">💻 画面共有で開始</option>
        </select>
        <button class="btn-primary" onclick="start('teacher')">管理者(先生)として開始</button>
        <button class="btn-success" style="margin-top:10px; width:100%;" onclick="start('student')">参加者(生徒)として参加</button>
        <p style="font-size:10px; color:#888; margin-top:10px;">※スマホは「カメラで開始」を推奨</p>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:8px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">READY</span>
        <button onclick="rotateVideo()" style="background:#555; color:white; padding:5px 12px; font-size:12px; border-radius:4px;">🔄 回転</button>
    </div>
    <div style="text-align:right;">
        <span id="broadcast-status" style="font-size:10px; background:#333; padding:2px 6px; border-radius:4px;">待機中</span>
        <div id="room-display" style="font-size:11px; opacity:0.7;">ID: ----</div>
    </div>
</header>

<div class="main-layout">
    <div class="content-area">
        <div class="broadcast-container" id="video-container">
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <video id="my-video" autoplay playsinline muted style="width:90px; height:68px; background:#000; border-radius:5px; float:right; margin-left:8px; object-fit: cover;"></video>
            <div id="self-name-label" style="font-size:14px; font-weight:bold; color:var(--accent); margin-bottom:5px;">氏名</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                <button id="mic-btn" class="btn-success" onclick="toggleMic()">🎤 ON</button>
                <button id="cam-btn" class="btn-success" onclick="toggleCam()">📷 ON</button>
            </div>
            <select id="switch-media" onchange="changeMyMedia()" style="width:100%; margin-top:8px; background:#000; color:white; border:1px solid #444; font-size:11px; padding:8px;">
                <option value="camera">📷 カメラ切替</option>
                <option value="screen">💻 画面共有切替</option>
            </select>
            <button id="reset-broadcast-btn" class="btn-warning hidden" style="margin-top:8px; width:100%;" onclick="resetToTeacherStream()">🔄 自分の配信に戻す</button>
        </div>

        <div id="teacher-tools" class="hidden">
            <button class="btn-danger" style="width:100%; font-size:11px;" onclick="forceExitAll()">全員を退出させる</button>
            <div id="qrcode" style="margin-top:10px; display:flex; justify-content:center;"></div>
        </div>

        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="チャット..." style="width:100%; box-sizing:border-box; background:#000; color:white; border:1px solid #444; padding:12px; border-radius:5px;">
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let connections = {};
    let students = {};
    let isSpotlighting = false;
    let audioCtx, mixerDest, currentRotation = 0;
    let retryInterval = null;

    // ★オーディオミキサーの初期化（先生側のみで使用）
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (myRole === 'teacher') {
                mixerDest = audioCtx.createMediaStreamDestination();
                // 先生自身の声をミキサーに追加
                const source = audioCtx.createMediaStreamSource(localStream);
                source.connect(mixerDest);
            }
        } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function rotateVideo() {
        currentRotation = (currentRotation + 90) % 360;
        const v = document.getElementById('main-broadcast-video');
        const container = document.getElementById('video-container');
        v.style.transform = `rotate(${currentRotation}deg)`;
        if (currentRotation === 90 || currentRotation === 270) {
            v.style.width = container.clientHeight + "px";
            v.style.height = container.clientWidth + "px";
            v.style.position = "absolute";
        } else {
            v.style.width = "100%"; v.style.height = "100%"; v.style.position = "relative";
        }
    }

    async function start(role) {
        myName = document.getElementById('user-name').value;
        currentRid = document.getElementById('room-id').value;
        if(!myName || !currentRid) return alert("氏名と部屋IDを入力してください");
        myRole = role;

        try {
            await getMedia(document.getElementById('start-media-type').value);
            initAudioContext(); // メディア取得後に初期化
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('self-name-label').innerText = myName;

            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                // 先生側：全員に配信するためのミキシング済み音声ストリームを返す
                const outStream = (myRole === 'teacher' && mixerDest) ? 
                    new MediaStream([localStream.getVideoTracks()[0], mixerDest.stream.getAudioTracks()[0]]) : localStream;
                
                call.answer(outStream);
                call.on('stream', s => {
                    if (myRole === 'teacher') {
                        // ★重要：届いた生徒の音声をミキサーに結合
                        const studentAudioSource = audioCtx.createMediaStreamSource(s);
                        studentAudioSource.connect(mixerDest);
                        // 先生自身のスピーカーからも聞こえるようにする
                        studentAudioSource.connect(audioCtx.destination);
                    }
                    addStudentToGrid(call.peer, s);
                });
            });

            peer.on('connection', conn => {
                connections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });

            peer.on('error', err => console.log(err));

        } catch(e) { console.error(e); alert("メディア取得失敗。"); }
    }

    async function getMedia(type) {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
        let videoStream, finalStream;

        if(type === 'camera') {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
            document.getElementById('my-video').style.transform = "scaleX(-1)";
            finalStream = new MediaStream([...videoStream.getVideoTracks(), ...(micStream ? micStream.getAudioTracks() : [])]);
        } else {
            videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            document.getElementById('my-video').style.transform = "none";
            finalStream = new MediaStream([videoStream.getVideoTracks()[0], ...(micStream ? micStream.getAudioTracks() : [])]);
        }
        localStream = finalStream;
        document.getElementById('my-video').srcObject = localStream;
        if(myRole === 'teacher' && !isSpotlighting) document.getElementById('main-broadcast-video').srcObject = localStream;
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-area').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('broadcast-status').innerText = "配信中";
        new QRCode(document.getElementById("qrcode"), { text: location.href, width: 80, height: 80 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const tryConnect = () => {
            if (connections[tid] && connections[tid].open) return;
            document.getElementById('broadcast-status').innerText = "先生待機中...";
            const conn = peer.connect(tid);
            conn.on('open', () => {
                clearInterval(retryInterval);
                document.getElementById('broadcast-status').innerText = "接続済み";
                connections[tid] = conn;
                conn.send({type:'JOIN', name:myName});
                peer.call(tid, localStream).on('stream', s => { 
                    document.getElementById('main-broadcast-video').srcObject = s; 
                });
            });
            conn.on('close', () => { delete connections[tid]; startRetryLoop(); });
        };
        const startRetryLoop = () => { if (retryInterval) clearInterval(retryInterval); tryConnect(); retryInterval = setInterval(tryConnect, 3000); };
        startRetryLoop();
    }

    function spotlightStudent(id) {
        const studentVideo = document.getElementById('v-'+id);
        if(!studentVideo) return;
        isSpotlighting = true;
        
        // メイン画面の映像だけ生徒に切り替え
        document.getElementById('main-broadcast-video').srcObject = studentVideo.srcObject;
        document.getElementById('reset-broadcast-btn').classList.remove('hidden');
        document.getElementById('broadcast-status').innerText = (students[id]?.name || "生徒") + "さんの画面";

        // 全員へ送るストリームを更新（映像＝生徒、音声＝ミキサー[全員分]）
        const mixedStream = new MediaStream([
            studentVideo.srcObject.getVideoTracks()[0],
            mixerDest.stream.getAudioTracks()[0]
        ]);
        replaceAllTracks(mixedStream);
    }

    function resetToTeacherStream() {
        isSpotlighting = false;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-broadcast-btn').classList.add('hidden');
        document.getElementById('broadcast-status').innerText = "配信中";
        
        // 先生の映像 ＋ ミキサーの音声に戻す
        const teacherMixedStream = new MediaStream([
            localStream.getVideoTracks()[0],
            mixerDest.stream.getAudioTracks()[0]
        ]);
        replaceAllTracks(teacherMixedStream);
    }

    function replaceAllTracks(stream) {
        const vt = stream.getVideoTracks()[0];
        const at = stream.getAudioTracks()[0];
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(call => {
                if(call.peerConnection) {
                    const senders = call.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind==='video');
                    const as = senders.find(s => s.track && s.track.kind==='audio');
                    if(vs && vt) vs.replaceTrack(vt).catch(console.error);
                    if(as && at) as.replaceTrack(at).catch(console.error);
                }
            });
        });
    }

    function handleData(id, data) {
        if(data.type === 'JOIN') {
            students[id] = {name: data.name};
            const label = document.getElementById('name-' + id);
            if(label) label.innerText = data.name;
        }
        if(data.type === 'CHAT') addChat(data.name, data.msg);
        if(data.type === 'EXIT') location.reload();
    }

    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline muted></video>
            <div id="name-${id}" class="name-badge">接続中...</div>
            <div style="display:flex; gap:2px; margin-top:5px;">
                <button class="btn-mini btn-warning" style="flex:1" onclick="spotlightStudent('${id}')">共有</button>
                <button class="btn-mini btn-danger" onclick="kickStudent('${id}')">✕</button>
            </div>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
    }

    function removeStudent(id) { document.getElementById('card-'+id)?.remove(); delete students[id]; delete connections[id]; }

    async function changeMyMedia() {
        await getMedia(document.getElementById('switch-media').value);
        if(!isSpotlighting) {
            // 先生の場合、映像トラックのみ差し替え（音声はミキサーが生きているため）
            if (myRole === 'teacher') {
                const teacherMixedStream = new MediaStream([localStream.getVideoTracks()[0], mixerDest.stream.getAudioTracks()[0]]);
                replaceAllTracks(teacherMixedStream);
            } else {
                replaceAllTracks(localStream);
            }
        }
    }

    function forceExitAll() { if(confirm("全員退出？")) Object.values(connections).forEach(c => c.send({type:'EXIT'})); }
    function kickStudent(id) { if(confirm("退出？")) connections[id]?.send({type:'EXIT'}); }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0]; if(t) t.enabled = !t.enabled;
        document.getElementById('mic-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
        document.getElementById('mic-btn').innerText = t.enabled ? '🎤 ON' : '🔇 OFF';
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0]; if(t) t.enabled = !t.enabled;
        document.getElementById('cam-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
        document.getElementById('cam-btn').innerText = t.enabled ? '📷 ON' : '📷 OFF';
    }

    function addChat(name, msg) {
        const div = document.createElement('div'); div.innerHTML = `<span class="chat-name">${name}:</span> ${msg}`;
        const box = document.getElementById('chat-messages'); box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if(e.key === 'Enter' && e.target.value) {
            initAudioContext();
            addChat("自分", e.target.value);
            Object.values(connections).forEach(c => c.send({type:'CHAT', name:myName, msg:e.target.value}));
            e.target.value = "";
        }
    }
</script>
</body>
</html>
