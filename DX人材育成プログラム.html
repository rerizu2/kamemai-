<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v29.0 NEBULA EDITION</title>
    
    <!-- 外部ライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. グローバルスタイル --- */
        :root {
            --accent: #00fbff;
            --accent-glow: rgba(0, 251, 255, 0.4);
            --bg: #05070a;
            --panel: rgba(20, 25, 35, 0.85);
            --panel-dark: rgba(10, 12, 18, 0.95);
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --text: #e0e6ed;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --font-main: 'Inter', system-ui, sans-serif;
            --sidebar-width: 350px;
            --header-height: 75px;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: var(--font-main); overflow: hidden;
        }

        /* --- 2. ログイン & セットアップ --- */
        #setup-screen {
            position: fixed; inset: 0; z-index: 999999;
            background: radial-gradient(circle at center, #1a2a3a 0%, #05070a 100%);
            display: flex; justify-content: center; align-items: center;
        }

        .setup-card {
            background: var(--panel-dark); padding: 50px; border-radius: 40px;
            width: 480px; border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center; backdrop-filter: var(--glass);
        }

        .setup-card h1 { font-size: 36px; margin: 0; color: var(--accent); letter-spacing: -1.5px; font-weight: 900; }
        .setup-card p { color: var(--text-dim); margin-bottom: 35px; font-size: 14px; font-weight: 500; }

        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 18px; border-radius: 18px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: white; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); background: rgba(0,0,0,0.7); }

        .btn-start {
            width: 100%; padding: 20px; border-radius: 18px; border: none; font-size: 17px;
            font-weight: 800; cursor: pointer; transition: 0.4s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .btn-teacher { background: var(--accent); color: #000; }
        .btn-student { background: transparent; color: var(--accent); border: 2px solid var(--accent); margin-top: 15px; }
        .btn-start:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); filter: brightness(1.1); }

        /* --- 3. メインレイアウト --- */
        #main-app { display: none; width: 100%; height: 100%; flex-direction: column; opacity: 0; transition: 1s ease-in-out; }
        #main-app.active { display: flex; opacity: 1; }

        header {
            height: var(--header-height); background: rgba(10, 12, 18, 0.8); backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center; padding: 0 35px; z-index: 1000;
        }

        .logo-area { display: flex; align-items: center; gap: 20px; }
        .room-badge { 
            background: rgba(0, 251, 255, 0.1); border: 1px solid var(--accent);
            padding: 6px 18px; border-radius: 30px; font-size: 13px; font-weight: 900; color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* --- 4. 配信ステージ --- */
        .stage-wrapper { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        .stage {
            flex: 1; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a0e14 0%, #000 100%);
        }

        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 10; transition: 0.5s; }
        
        .stage-overlay-top {
            position: absolute; top: 25px; left: 25px; z-index: 200;
            display: flex; flex-direction: column; gap: 12px;
        }

        .view-indicator {
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            padding: 12px 24px; border-radius: 15px; border: 1px solid var(--accent);
            font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 12px;
            color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .live-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; animation: pulse 1.2s infinite; }

        #wb-canvas { position: absolute; inset: 0; z-index: 150; pointer-events: none; }
        #wb-canvas.active { pointer-events: auto; cursor: crosshair; }

        .reaction-container { position: absolute; inset: 0; z-index: 210; pointer-events: none; }

        /* --- 5. モニターグリッド --- */
        .monitor-shelf {
            height: 200px; background: #080a0e; border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 25px; gap: 18px; overflow-x: auto;
            scroll-behavior: smooth;
        }
        .monitor-shelf::-webkit-scrollbar { height: 6px; }
        .monitor-shelf::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .user-card {
            width: 200px; height: 160px; background: var(--panel); border-radius: 24px;
            flex-shrink: 0; position: relative; border: 1px solid var(--border);
            overflow: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
        }
        .user-card:hover { border-color: var(--accent); transform: translateY(-8px) scale(1.02); z-index: 10; }
        .user-card video { width: 100%; height: 115px; object-fit: cover; background: #000; border-bottom: 1px solid var(--border); }
        .user-card .info { padding: 8px 12px; font-size: 12px; text-align: center; font-weight: 800; color: var(--text); }
        
        .user-card.talking { border: 2px solid var(--success) !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
        .user-card.raised-hand { border: 2px solid var(--warning) !important; animation: borderPulse 0.8s infinite; }
        @keyframes borderPulse { 0%, 100% { border-color: var(--warning); } 50% { border-color: transparent; } }

        /* --- 6. サイドバー --- */
        .sidebar {
            width: var(--sidebar-width); background: var(--panel-dark); backdrop-filter: var(--glass);
            border-left: 1px solid var(--border); display: flex; flex-direction: column;
            padding: 25px; gap: 25px; overflow-y: auto; z-index: 500;
        }

        .panel { background: rgba(255,255,255,0.04); border-radius: 30px; padding: 22px; border: 1px solid var(--border); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .panel-header h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: 900; }

        /* ボタン */
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .icon-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: white; padding: 15px; border-radius: 20px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; transition: 0.3s;
            font-weight: 700;
        }
        .icon-btn i { font-size: 20px; }
        .icon-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); transform: translateY(-2px); }
        .icon-btn.active { background: var(--accent); color: black; border-color: white; }
        .icon-btn.danger { color: var(--danger); }
        .icon-btn.danger.active { background: var(--danger); color: white; }

        /* チャット */
        .chat-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 300px; }
        #chat-window {
            flex: 1; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 20px;
            overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid var(--border);
        }
        .msg { word-break: break-all; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg b { color: var(--accent); margin-right: 5px; }

        .chat-input-wrapper { display: flex; gap: 10px; }
        .chat-input-wrapper input { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: #000; color: white; }

        /* --- 7. 特殊UI --- */
        #toast-container { position: fixed; top: 30px; right: 30px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: var(--panel-dark); border-right: 5px solid var(--accent);
            padding: 18px 30px; border-radius: 15px; color: white; min-width: 300px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); transform: translateX(120%); transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: var(--glass); border: 1px solid var(--border);
        }
        .toast.show { transform: translateX(0); }

        #wb-toolbar {
            position: absolute; top: 25px; right: 25px;
            background: var(--panel-dark); padding: 12px 20px; border-radius: 20px;
            display: none; flex-direction: column; gap: 18px; border: 1px solid var(--accent); z-index: 500;
            backdrop-filter: var(--glass);
        }
        .wb-tool { cursor: pointer; font-size: 20px; color: var(--text-dim); transition: 0.2s; text-align: center; }
        .wb-tool:hover, .wb-tool.active { color: var(--accent); transform: scale(1.2); }
        .wb-color { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .wb-color.active { border-color: white; transform: scale(1.3); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

        #rec-indicator {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid var(--danger); padding: 8px 18px; border-radius: 30px;
            font-size: 12px; font-weight: 900; color: var(--danger); display: none; align-items: center; gap: 10px;
        }

        .vol-meter-wrap { height: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; margin-top: 6px; overflow: hidden; width: 100%; }
        .vol-meter-bar { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); width: 0%; transition: 0.1s; }

        #talk-notice {
            background: linear-gradient(45deg, var(--danger), #b33939);
            color: white; padding: 12px; border-radius: 15px; font-size: 12px;
            text-align: center; font-weight: 800; margin-top: 15px; display: none;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 画面共有用ボタンの特別なスタイル */
        .icon-btn.screen-active {
            background: var(--warning); color: #000; border-color: white;
        }

        @media (max-width: 1100px) {
            .sidebar { position: fixed; right: -100%; top: var(--header-height); bottom: 0; transition: 0.4s; }
            .sidebar.open { right: 0; }
        }
    </style>
</head>
<body>

<!-- 1. ログイン画面 -->
<div id="setup-screen">
    <div class="setup-card">
        <h1>EDU-ULTIMATE</h1>
        <p>NEBULA EDITION v29.0</p>
        
        <div class="input-group">
            <label><i class="fas fa-user-astronaut"></i> お名前</label>
            <input type="text" id="join-name" placeholder="例: 織田 信長">
        </div>

        <div class="input-group">
            <label><i class="fas fa-fingerprint"></i> 部屋ID (4桁の数字)</label>
            <input type="number" id="join-room" placeholder="例: 5566">
        </div>

        <div class="input-group">
            <label><i class="fas fa-rocket"></i> 開始時の映像</label>
            <select id="join-mode">
                <option value="camera">📷 カメラをオンにする</option>
                <option value="screen">💻 画面共有を開始する</option>
            </select>
        </div>

        <button class="btn-start btn-teacher" onclick="initSession('teacher')">
            <i class="fas fa-crown"></i> 先生として授業を開始
        </button>
        <button class="btn-start btn-student" onclick="initSession('student')">
            <i class="fas fa-user-graduate"></i> 生徒として参加
        </button>
    </div>
</div>

<!-- 2. 設定モーダル -->
<div id="settings-modal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100000; justify-content:center; align-items:center; backdrop-filter:blur(10px);">
    <div class="setup-card" style="width:400px; padding:30px;">
        <h3 style="color:var(--accent); margin-top:0;">デバイス設定</h3>
        <div class="input-group">
            <label>カメラ</label><select id="cam-select"></select>
        </div>
        <div class="input-group">
            <label>マイク</label><select id="mic-select"></select>
        </div>
        <button class="btn-start btn-teacher" onclick="applySettings()">適用して閉じる</button>
    </div>
</div>

<!-- 3. メインUI -->
<div id="main-app">
    <header>
        <div class="logo-area">
            <div style="width:45px; height:45px; background:var(--accent); border-radius:12px; display:flex; justify-content:center; align-items:center; color:#000;">
                <i class="fas fa-atom fa-lg"></i>
            </div>
            <div class="room-badge" id="display-room-id">ID: ----</div>
            <div id="timer-display" style="font-family:monospace; font-weight:800; font-size:18px; color:var(--accent); letter-spacing:1px;">00:00:00</div>
        </div>

        <div style="display:flex; gap:20px; align-items:center;">
            <div id="rec-indicator"><i class="fas fa-circle"></i> REC <span id="rec-time">00:00</span></div>
            <button class="btn-red" style="padding:10px 25px; font-size:13px; border-radius:15px; font-weight:900;" onclick="if(confirm('退室しますか？')) location.reload();">
                <i class="fas fa-sign-out-alt"></i> 退室
            </button>
        </div>
    </header>

    <div class="main-container">
        <!-- ステージ -->
        <div class="stage-wrapper">
            <div class="stage" id="stage" onclick="forcePlay()">
                <div class="stage-overlay-top">
                    <div class="view-indicator">
                        <div class="live-dot"></div>
                        <span id="view-name">接続待機中...</span>
                    </div>
                </div>
                
                <div id="reaction-canvas" class="reaction-container"></div>
                <canvas id="wb-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>

                <!-- ホワイトボードツール -->
                <div id="wb-toolbar">
                    <div class="wb-tool active" onclick="setWBTool('pen', this)" title="ペン"><i class="fas fa-pencil-alt"></i></div>
                    <div class="wb-tool" onclick="setWBTool('eraser', this)" title="消しゴム"><i class="fas fa-eraser"></i></div>
                    <div style="height:1px; width:100%; background:var(--border);"></div>
                    <div class="wb-color active" style="background:#ff4757;" onclick="setWBColor('#ff4757', this)"></div>
                    <div class="wb-color" style="background:#00fbff;" onclick="setWBColor('#00fbff', this)"></div>
                    <div class="wb-color" style="background:#ffffff;" onclick="setWBColor('#ffffff', this)"></div>
                    <div style="height:1px; width:100%; background:var(--border);"></div>
                    <div class="wb-tool" onclick="clearWB()" title="全消去"><i class="fas fa-trash-alt"></i></div>
                </div>
            </div>

            <div class="monitor-shelf" id="monitor-grid"></div>
        </div>

        <!-- サイドバー -->
        <div class="sidebar">
            <!-- 先生管理 -->
            <div id="teacher-controls" class="panel hidden">
                <div class="panel-header"><h3>指揮官ツール</h3></div>
                <div class="control-grid">
                    <button class="icon-btn" onclick="cmdAllMic(false)" id="btn-global-mute"><i class="fas fa-volume-mute"></i><span>全員静止</span></button>
                    <button class="icon-btn" onclick="cmdAllMic(true)" id="btn-global-talk"><i class="fas fa-comments"></i><span>全員討論</span></button>
                    <button class="icon-btn" onclick="toggleWBMode()" id="btn-wb"><i class="fas fa-palette"></i><span>板書同期</span></button>
                    <button class="icon-btn" onclick="startPoll()"><i class="fas fa-chart-pie"></i><span>投票作成</span></button>
                    <button class="icon-btn danger" onclick="toggleRecording()" id="btn-record"><i class="fas fa-record-vinyl"></i><span>授業録画</span></button>
                    <button class="icon-btn" onclick="resetGlobalView()"><i class="fas fa-users-viewfinder"></i><span>画面同期</span></button>
                </div>
                <div id="teacher-qr" style="margin-top:20px; display:flex; justify-content:center; background:white; padding:10px; border-radius:15px;"></div>
            </div>

            <!-- 生徒管理 -->
            <div id="student-controls" class="panel hidden">
                <button class="btn-start btn-teacher" id="btn-hand" onclick="handleHandAction()">
                    <i class="fas fa-hand-sparkles"></i> 先生に挙手する
                </button>
            </div>

            <!-- デバイス設定 -->
            <div class="panel">
                <div class="panel-header"><h3>デバイス</h3></div>
                <div style="display:flex; gap:18px; align-items:center;">
                    <div style="width:100px; height:75px; position:relative; flex-shrink:0;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:15px; background:#000; border:2px solid var(--border);"></video>
                        <div class="vol-meter-wrap"><div class="vol-meter-bar" id="my-vol-bar"></div></div>
                    </div>
                    <div style="flex:1;">
                        <div id="display-my-name" style="font-weight:900; font-size:15px; margin-bottom:8px; color:var(--accent);">User</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                            <button class="icon-btn" style="padding:10px;" onclick="toggleMic()" id="btn-mic"><i class="fas fa-microphone"></i></button>
                            <button class="icon-btn" style="padding:10px;" onclick="toggleCam()" id="btn-cam"><i class="fas fa-video"></i></button>
                            <button class="icon-btn" style="padding:10px; grid-column: span 2; flex-direction:row;" onclick="toggleScreenShare()" id="btn-screen">
                                <i class="fas fa-desktop"></i><span>画面共有を切り替え</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="talk-notice"><i class="fas fa-headset"></i> 個別対話中。他の音は消えています</div>
            </div>

            <!-- リスト -->
            <div class="panel" style="flex:1; display:flex; flex-direction:column;">
                <div class="panel-header"><h3>参加者</h3></div>
                <div id="peer-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <!-- チャット -->
            <div class="panel" style="flex:1.5; display:flex; flex-direction:column;">
                <div id="chat-window"></div>
                <div class="chat-input-wrapper" style="margin-top:12px;">
                    <input type="text" id="chat-input" placeholder="メッセージ...">
                    <button class="icon-btn" style="background:var(--accent); color:#000; padding:10px 18px;" onclick="sendChatMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:24px;">
                    <span style="cursor:pointer;" onclick="sendReaction('👍')">👍</span>
                    <span style="cursor:pointer;" onclick="sendReaction('👏')">👏</span>
                    <span style="cursor:pointer;" onclick="sendReaction('🔥')">🔥</span>
                    <span style="cursor:pointer;" onclick="sendReaction('❤️')">❤️</span>
                    <span style="cursor:pointer;" onclick="sendReaction('😂')">😂</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    /**
     * EDU-ULTIMATE NEBULA v29.0 - Core Engine
     */

    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let isMicOn = false, isCamOn = true, isScreenSharing = false;
    let currentGlobalViewId = "";
    let privateTalkPartnerId = null;
    let isHandRaised = false;

    // ホワイトボード
    let wbActive = false, wbCtx, drawing = false;
    let wbColor = "#ff4757", wbTool = 'pen';

    // 録画
    let mediaRecorder, recordedChunks = [], recStartTime, recInterval;

    // --- 1. 初期化 ---

    async function initSession(role) {
        myRole = role;
        myName = document.getElementById('join-name').value || (role === 'teacher' ? "先生" : "生徒");
        roomID = document.getElementById('join-room').value;
        const initialMode = document.getElementById('join-mode').value;

        if (!roomID || roomID.length < 4) return showToast("エラー", "部屋IDは4桁以上必要です", "danger");

        // 初期ストリーム取得
        localStream = await getMediaStream(initialMode);
        if (!localStream) return;

        const myID = (role === 'teacher') ? `EDU-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(myID, { debug: 1 });

        peer.on('open', id => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-app').classList.add('active');
            document.getElementById('display-room-id').innerText = `ROOM: ${roomID}`;
            document.getElementById('display-my-name').innerText = myName;
            
            if (role === 'teacher') {
                document.getElementById('teacher-controls').classList.remove('hidden');
                new QRCode(document.getElementById("teacher-qr"), { text: location.href, width: 100, height: 100 });
                initWB();
                startTimer();
                updateMainStage(peer.id);
            } else {
                document.getElementById('student-controls').classList.remove('hidden');
                connectToTeacher(`EDU-ROOM-${roomID}`);
            }
            showToast("NEBULAシステム始動", `${myName}として接続しました`);
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', stream => {
                remoteStreams[call.peer] = stream;
                updateGrid(call.peer, stream);
                if (call.peer === currentGlobalViewId || call.peer.startsWith('EDU-ROOM')) updateMainStage(call.peer);
            });
        });

        peer.on('connection', conn => handleData(conn));
    }

    async function getMediaStream(mode) {
        try {
            let stream;
            if (mode === 'screen') {
                stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                isScreenSharing = true;
                stream.getVideoTracks()[0].onended = () => toggleScreenShare(); // 停止時復帰
            } else {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                isScreenSharing = false;
            }
            
            // UI更新
            const btn = document.getElementById('btn-screen');
            if (isScreenSharing) btn.classList.add('screen-active');
            else btn.classList.remove('screen-active');

            // マイク初期OFF
            stream.getAudioTracks().forEach(t => t.enabled = false);
            isMicOn = false;
            updateMicUI();

            document.getElementById('my-preview').srcObject = stream;
            setupVol(stream, 'my-vol-bar');
            return stream;
        } catch (e) {
            showToast("メディアエラー", "デバイスへのアクセスが拒否されました", "danger");
            return null;
        }
    }

    // --- 2. 【最重要】画面共有の切り替えロジック ---

    async function toggleScreenShare() {
        const oldTrack = localStream.getVideoTracks()[0];
        let newStream;

        try {
            if (!isScreenSharing) {
                // カメラ -> 画面共有
                newStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                isScreenSharing = true;
                // ユーザーがブラウザのボタンで共有を止めた時のハンドラ
                newStream.getVideoTracks()[0].onended = () => { if(isScreenSharing) toggleScreenShare(); };
            } else {
                // 画面共有 -> カメラ
                newStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                isScreenSharing = false;
            }

            const newTrack = newStream.getVideoTracks()[0];

            // 1. ローカルストリームのトラックを差し替え
            localStream.removeTrack(oldTrack);
            localStream.addTrack(newTrack);
            oldTrack.stop(); // 旧トラックの停止

            // 2. PeerJSのすべての既存コネクション（送信機）のトラックを更新
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => {
                    const pc = c.peerConnection;
                    if (pc) {
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newTrack);
                    }
                });
            });

            // 3. UIの更新
            document.getElementById('my-preview').srcObject = localStream;
            const btn = document.getElementById('btn-screen');
            if (isScreenSharing) {
                btn.classList.add('screen-active');
                btn.innerHTML = '<i class="fas fa-stop-circle"></i><span>共有を停止</span>';
                showToast("画面共有", "現在あなたの画面を配信しています", "warning");
            } else {
                btn.classList.remove('screen-active');
                btn.innerHTML = '<i class="fas fa-desktop"></i><span>画面共有を開始</span>';
                showToast("カメラ復帰", "カメラの配信に戻りました");
            }

            // 4. もし自分がメイン画面なら更新
            if (currentGlobalViewId === peer.id) updateMainStage(peer.id);

        } catch (e) {
            console.error("切り替え失敗:", e);
            showToast("エラー", "画面共有を開始できませんでした", "danger");
        }
    }

    // --- 3. コミュニケーション & 指令 ---

    function handleData(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            switch(data.type) {
                case 'join':
                    students[conn.peer] = { name: data.name, hand: false };
                    if (myRole === 'teacher') {
                        syncAll();
                        conn.send({ type: 'sync-view', targetId: currentGlobalViewId || peer.id });
                        peer.call(conn.peer, localStream);
                    }
                    showToast("入室", `${data.name}さんが入室しました`);
                    updateList();
                    break;
                case 'list-sync':
                    data.list.forEach(u => {
                        if (u.id !== peer.id && !connections[u.id]) {
                            students[u.id] = { name: u.name, hand: u.hand };
                            const c = peer.connect(u.id);
                            handleData(c);
                            c.on('open', () => { c.send({ type: 'hello', name: myName }); peer.call(u.id, localStream); });
                        }
                    });
                    updateList();
                    break;
                case 'hello': students[conn.peer] = { name: data.name, hand: false }; updateList(); break;
                case 'sync-view': updateMainStage(data.targetId); break;
                case 'chat': addChat(data.name, data.msg); break;
                case 'react': spawnEmoji(data.emoji); break;
                case 'hand': if(students[conn.peer]) { students[conn.peer].hand = data.raised; updateList(); } break;
                case 'wb-draw': drawWB(data, false); break;
                case 'wb-clear': wbCtx.clearRect(0,0,document.getElementById('wb-canvas').width, document.getElementById('wb-canvas').height); break;
                case 'mic-cmd': setMic(data.value); break;
                case 'poll': addPoll(data); break;
            }
        });
        conn.on('close', () => {
            delete connections[conn.peer]; delete students[conn.peer];
            if (document.getElementById(`card-${conn.peer}`)) document.getElementById(`card-${conn.peer}`).remove();
            updateList();
        });
    }

    // --- 4. 映像・音量管理（個別対話 修正版） ---

    function updateMainStage(id) {
        currentGlobalViewId = id;
        const mv = document.getElementById('main-video');
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        if (stream) {
            mv.srcObject = stream;
            mv.muted = (id === peer.id);
            const name = id.startsWith('EDU-ROOM') ? "先生" : (students[id]?.name || "参加者");
            document.getElementById('view-name').innerText = `${name} の映像を配信中`;
            mv.play().catch(()=>{});
        }
        if (myRole === 'teacher') broadcast({ type: 'sync-view', targetId: id });
    }

    function togglePrivateTalk(id) {
        const notice = document.getElementById('talk-notice');
        if (privateTalkPartnerId === id) {
            privateTalkPartnerId = null;
            notice.style.display = 'none';
            resetVol();
            showToast("対話終了", "全員の声が聞こえる状態に戻りました");
        } else {
            privateTalkPartnerId = id;
            notice.style.display = 'block';
            setMic(true);
            applyFilter(id);
            showToast("個別対話", `${students[id]?.name}さんと繋がっています`, "success");
        }
        updateList();
    }

    function applyFilter(partnerId) {
        const mv = document.getElementById('main-video');
        if (mv) mv.volume = (currentGlobalViewId === partnerId || currentGlobalViewId === peer.id) ? 1.0 : 0.1;
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if (v) v.volume = (id === partnerId) ? 1.0 : 0.1;
        });
    }

    function resetVol() {
        const mv = document.getElementById('main-video');
        if (mv) mv.volume = 1.0;
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if (v) v.volume = 1.0;
        });
    }

    // --- 5. ホワイトボードロジック ---

    function initWB() {
        const canvas = document.getElementById('wb-canvas');
        wbCtx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const resize = () => { canvas.width = stage.clientWidth; canvas.height = stage.clientHeight; };
        resize(); window.addEventListener('resize', resize);

        stage.onmousedown = (e) => { if(!wbActive) return; drawing = true; handleWB(e.offsetX, e.offsetY, true); };
        stage.onmousemove = (e) => { if(!drawing || !wbActive) return; handleWB(e.offsetX, e.offsetY, false); };
        stage.onmouseup = () => drawing = false;
    }

    function handleWB(x, y, isNew) {
        const data = { type: 'wb-draw', x, y, isNew, color: wbTool==='eraser'?'transparent':wbColor, size: wbTool==='eraser'?40:5 };
        drawWB(data, true);
        broadcast(data);
    }

    function drawWB(d, isLocal) {
        wbCtx.globalCompositeOperation = d.color === 'transparent' ? 'destination-out' : 'source-over';
        wbCtx.strokeStyle = d.color;
        wbCtx.lineWidth = d.size;
        wbCtx.lineCap = 'round';
        if (d.isNew) { wbCtx.beginPath(); wbCtx.moveTo(d.x, d.y); }
        else { wbCtx.lineTo(d.x, d.y); wbCtx.stroke(); }
    }

    function toggleWBMode() {
        wbActive = !wbActive;
        document.getElementById('btn-wb').classList.toggle('active', wbActive);
        document.getElementById('wb-toolbar').style.display = wbActive ? 'flex' : 'none';
        document.getElementById('wb-canvas').classList.toggle('active', wbActive);
    }

    function setWBColor(c, el) { 
        wbColor = c; wbTool = 'pen'; 
        document.querySelectorAll('.wb-color').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
    }
    function setWBTool(t, el) { 
        wbTool = t; 
        document.querySelectorAll('.wb-tool').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
    }
    function clearWB() { wbCtx.clearRect(0,0,wbCtx.canvas.width, wbCtx.canvas.height); broadcast({type:'wb-clear'}); }

    // --- 6. 補助UI機能 ---

    function setMic(val) {
        const t = localStream.getAudioTracks()[0];
        if (t) { t.enabled = val; isMicOn = val; updateMicUI(); }
    }
    function toggleMic() { setMic(!isMicOn); }
    function updateMicUI() {
        const btn = document.getElementById('btn-mic');
        btn.innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        btn.classList.toggle('active', isMicOn); btn.classList.toggle('danger', !isMicOn);
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) { isCamOn = !isCamOn; t.enabled = isCamOn; document.getElementById('btn-cam').classList.toggle('danger', !isCamOn); }
    }

    function cmdAllMic(val) { broadcast({ type: 'mic-cmd', value: val }); setMic(val); }

    function handleHandAction() {
        isHandRaised = !isHandRaised;
        const btn = document.getElementById('btn-hand');
        btn.innerHTML = isHandRaised ? '<i class="fas fa-hand-holding-heart"></i> 挙手を下げる' : '<i class="fas fa-hand-sparkles"></i> 先生に挙手する';
        btn.classList.toggle('btn-red', isHandRaised);
        broadcast({ type: 'hand', raised: isHandRaised });
    }

    function updateList() {
        const list = document.getElementById('peer-list');
        list.innerHTML = "";
        Object.keys(students).forEach(id => {
            const isTalking = (privateTalkPartnerId === id);
            const item = document.createElement('div');
            item.className = `list-item ${students[id].hand ? 'hand-pulse' : ''}`;
            item.innerHTML = `
                <span style="font-weight:900; color:${students[id].hand ? 'var(--warning)' : 'white'}">${students[id].hand ? '✋ ' : ''}${students[id].name}</span>
                <div class="actions">
                    <button class="btn-mini btn-teacher" onclick="updateMainStage('${id}')">注目</button>
                    <button class="btn-mini ${isTalking ? 'btn-red' : 'btn-teacher'}" onclick="togglePrivateTalk('${id}')">${isTalking ? '中断' : '対話'}</button>
                </div>
            `;
            list.appendChild(item);
            const card = document.getElementById(`card-${id}`);
            if (card) { card.classList.toggle('raised-hand', students[id].hand); card.classList.toggle('talking', isTalking); }
        });
    }

    function updateGrid(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'user-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline></video><div class="info">${students[id]?.name || '参加者'}</div><div class="vol-meter-wrap" style="margin:0 12px 12px;"><div class="vol-meter-bar" id="vol-${id}"></div></div>`;
        card.onclick = () => { if(myRole==='teacher') updateMainStage(id); };
        grid.appendChild(card);
        const vid = document.getElementById(`v-${id}`); vid.srcObject = stream;
        setupVol(stream, `vol-${id}`);
    }

    function setupVol(stream, barId) {
        const t = stream.getAudioTracks()[0]; if(!t) return;
        try {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(new MediaStream([t]));
            const ans = ctx.createAnalyser(); src.connect(ans);
            const data = new Uint8Array(ans.frequencyBinCount);
            const update = () => {
                if(!document.getElementById(barId)) return;
                ans.getByteFrequencyData(data);
                const avg = data.reduce((a,b)=>a+b)/data.length;
                document.getElementById(barId).style.width = Math.min(100, avg*3.5) + "%";
                requestAnimationFrame(update);
            };
            update();
        } catch(e){}
    }

    function showToast(title, msg, type="accent") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast'; toast.style.borderRightColor = `var(--${type})`;
        toast.innerHTML = `<strong>${title}</strong><div style="font-size:12px;opacity:0.8;margin-top:5px;">${msg}</div>`;
        container.appendChild(toast);
        setTimeout(()=>toast.classList.add('show'), 100);
        setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 600); }, 4000);
    }

    function addChat(name, msg) {
        const win = document.getElementById('chat-window');
        const d = document.createElement('div'); d.className='msg'; d.innerHTML=`<b>${name}:</b> ${msg}`;
        win.appendChild(d); win.scrollTop = win.scrollHeight;
    }
    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        if(!input.value) return;
        addChat("自分", input.value); broadcast({ type: 'chat', name: myName, msg: input.value });
        input.value = "";
    }
    function sendReaction(emoji) { spawnEmoji(emoji); broadcast({ type: 'react', emoji }); }
    function spawnEmoji(emoji) {
        const area = document.getElementById('reaction-canvas');
        const el = document.createElement('div');
        el.style.position = 'absolute'; el.style.bottom = '0'; el.style.left = Math.random()*90+'%';
        el.style.fontSize = '45px'; el.style.transition = '3.5s cubic-bezier(0.1, 0.7, 1.0, 0.1)';
        el.innerText = emoji; area.appendChild(el);
        setTimeout(()=>{ el.style.transform = `translateY(-${window.innerHeight}px) rotate(${Math.random()*720}deg)`; el.style.opacity = '0'; }, 50);
        setTimeout(()=>el.remove(), 4000);
    }

    function toggleRecording() {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            const stream = document.getElementById('main-video').srcObject;
            if(!stream) return;
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `EDU-${Date.now()}.webm`; a.click();
            };
            mediaRecorder.start();
            document.getElementById('btn-record').classList.add('active');
            document.getElementById('rec-indicator').style.display='flex';
            recStartTime = Date.now();
            recInterval = setInterval(()=>{
                const diff = Date.now() - recStartTime;
                const m = Math.floor(diff/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('rec-time').innerText = `${m}:${s}`;
            },1000);
        } else {
            mediaRecorder.stop();
            document.getElementById('btn-record').classList.remove('active');
            document.getElementById('rec-indicator').style.display='none';
            clearInterval(recInterval);
        }
    }

    function broadcast(data) { Object.values(connections).forEach(c => { if(c.open) c.send(data); }); }
    function syncAll() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name, hand: students[id].hand }));
        list.push({ id: peer.id, name: myName, hand: false });
        broadcast({ type: 'list-sync', list });
    }
    function startTimer() {
        let sec = 0;
        setInterval(() => {
            sec++;
            const h = Math.floor(sec/3600).toString().padStart(2,'0');
            const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
            const s = (sec%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }
    function forcePlay() { document.querySelectorAll('video').forEach(v => v.play().catch(()=>{})); }
</script>
