<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v3.8 (Private Talk)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --private: #9b59b6; --monitor-height: 30vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- セットアップ画面 --- */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 360px; border: 1px solid #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 100; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        .panel { background: #222; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        .btn-primary { background: #0097e6; color: white; padding: 10px; width: 100%; }
        .btn-success { background: var(--success); color: white; padding: 10px; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 10px; width: 100%; }
        .btn-private { background: var(--private); color: white; padding: 10px; width: 100%; }
        .btn-mini { padding: 4px 8px; font-size: 10px; width: auto; }

        .monitor-grid { height: var(--monitor-height); background: #111; border-top: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; padding: 8px; border-radius: 8px; border: 2px solid transparent; }
        .student-card.in-private { border-color: var(--private); box-shadow: 0 0 10px var(--private); }
        .student-card video { width: 100%; background: #000; border-radius: 4px; }
        
        #private-status-tag { display: none; background: var(--private); color: white; padding: 2px 10px; border-radius: 20px; font-size: 11px; margin-left: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:15px;">EDU-ULTIMATE</h2>
        <input type="text" id="user-name" placeholder="名前">
        <input type="number" id="room-id" placeholder="部屋ID">
        <select id="start-media-type"><option value="camera">📷 カメラ</option><option value="screen">💻 画面共有</option></select>
        <button class="btn-primary" style="margin-top:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <span id="private-status-tag">㊙ 個別指導中</span>
    </div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">自分</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            <button id="mic-btn" class="btn-success" onclick="toggleMic()" style="margin-top:8px; font-size:11px;">🎤 ON</button>
            <button id="end-private-btn" class="btn-danger hidden" onclick="endPrivateTalk()" style="margin-top:5px; font-size:11px;">📴 個別通話を終了</button>
        </div>

        <div id="teacher-tools" class="hidden">
            <div class="panel">
                <div class="panel-title">クラス管理</div>
                <button class="btn-primary" onclick="pickRandom()" style="font-size:11px;">🎲 ランダム指名</button>
            </div>
        </div>
        
        <div class="panel" style="flex:1;">
            <div class="panel-title">チャット</div>
            <div id="chat-messages" style="height:150px; overflow-y:auto; font-size:12px; background:#111; padding:5px; margin-bottom:5px;"></div>
            <input type="text" id="chat-input" placeholder="Enterで送信" style="width:100%; background:#000; color:white; border:1px solid #444; font-size:11px; padding:5px;">
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container">
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myId = "";
    let connections = {};
    let students = {};
    let currentPrivateTarget = null;

    async function start(role) {
        myRole = role;
        currentRid = document.getElementById('room-id').value;
        const type = document.getElementById('start-media-type').value;

        try {
            const vStream = type === 'camera' ? await navigator.mediaDevices.getUserMedia({video:true}) : await navigator.mediaDevices.getDisplayMedia({video:true});
            const mic = await navigator.mediaDevices.getUserMedia({audio:true});
            localStream = new MediaStream([...vStream.getVideoTracks(), ...mic.getAudioTracks()]);
            document.getElementById('my-video').srcObject = localStream;
            document.getElementById('setup-screen').classList.add('hidden');

            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            peer.on('open', id => {
                myId = id;
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') {
                    document.getElementById('teacher-tools').classList.remove('hidden');
                    document.getElementById('monitor-area').classList.remove('hidden');
                    document.getElementById('main-broadcast-video').srcObject = localStream;
                } else {
                    initStudent();
                }
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });

            peer.on('connection', conn => {
                connections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
            });

        } catch(e) { alert("メディアエラー"); }
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => {
            connections[tid] = conn;
            conn.send({ type: 'JOIN', name: document.getElementById('user-name').value });
        });
        const call = peer.call(tid, localStream);
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
        });
    }

    function handleData(id, data) {
        const mainVid = document.getElementById('main-broadcast-video');
        switch(data.type) {
            case 'JOIN': students[id] = { name: data.name }; break;
            case 'CHAT': addChat(data.name, data.msg); break;
            case 'PRIVATE_START':
                // 個別通話命令を受信
                if (data.targetId === myId) {
                    // あなたが指名された生徒の場合：音声を維持
                    mainVid.muted = false;
                    mainVid.volume = 1.0;
                    document.getElementById('private-status-tag').style.display = "inline";
                    document.getElementById('private-status-tag').innerText = "㊙ 先生と個別通話中";
                } else {
                    // 他の生徒の場合：先生の音声を消す
                    mainVid.volume = 0;
                    mainVid.muted = true;
                }
                break;
            case 'PRIVATE_END':
                // 個別通話終了：全員音声をもとに戻す
                mainVid.muted = false;
                mainVid.volume = 1.0;
                document.getElementById('private-status-tag').style.display = "none";
                break;
        }
    }

    // --- 先生専用機能 ---

    function startPrivateTalk(studentId) {
        if(currentPrivateTarget) endPrivateTalk();

        currentPrivateTarget = studentId;
        document.getElementById('card-'+studentId).classList.add('in-private');
        document.getElementById('end-private-btn').classList.remove('hidden');
        document.getElementById('private-status-tag').style.display = "inline";
        document.getElementById('private-status-tag').innerText = "㊙ " + (students[studentId]?.name || "生徒") + " と通話中";

        // 全員に「これから個別通話を始める」と通知
        broadcast({ type: 'PRIVATE_START', targetId: studentId });
        addChat("システム", (students[studentId]?.name || "生徒") + "さんと個別通話を開始しました。");
    }

    function endPrivateTalk() {
        if(!currentPrivateTarget) return;

        document.getElementById('card-'+currentPrivateTarget).classList.remove('in-private');
        document.getElementById('end-private-btn').classList.add('hidden');
        document.getElementById('private-status-tag').style.display = "none";
        
        currentPrivateTarget = null;
        broadcast({ type: 'PRIVATE_END' });
        addChat("システム", "個別通話を終了しました。");
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => { if(c.open) c.send(data); });
    }

    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline></video>
            <div style="display:flex; justify-content:space-between; margin-top:5px;">
                <span style="font-size:11px;">生徒</span>
                <button class="btn-private btn-mini" onclick="startPrivateTalk('${id}')">個別話す</button>
            </div>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
    }

    // --- その他共通 ---
    function addChat(name, msg) {
        const div = document.createElement('div'); div.innerHTML = `<b>${name}:</b> ${msg}`;
        document.getElementById('chat-messages').appendChild(div);
    }
    document.getElementById('chat-input').onkeydown = e => {
        if(e.key === 'Enter') {
            const msg = e.target.value;
            addChat("自分", msg);
            broadcast({ type: 'CHAT', name: myRole === 'teacher' ? '先生' : document.getElementById('user-name').value, msg: msg });
            e.target.value = "";
        }
    };
    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        t.enabled = !t.enabled;
        document.getElementById('mic-btn').innerText = t.enabled ? "🎤 ON" : "🔇 OFF";
        document.getElementById('mic-btn').className = t.enabled ? "btn-success" : "btn-danger";
    }
    function pickRandom() {
        const keys = Object.keys(students);
        if(!keys.length) return;
        const sid = keys[Math.floor(Math.random()*keys.length)];
        alert("指名: " + students[sid].name);
    }
</script>
</body>
</html>
