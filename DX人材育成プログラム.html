<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v3.4 (Media Switch)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --monitor-height: 35vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- セットアップ画面 --- */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #444; box-shadow: 0 0 30px rgba(0,251,255,0.2); }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 100; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        body.is-student.reaction-disabled header, 
        body.is-student.reaction-disabled .sidebar { display: none; }

        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        .btn-primary { background: #0097e6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-success { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-switch { background: #8e44ad; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        
        .hidden { display: none !important; }
        .on-air { color: red; animation: blink 1s infinite; font-size: 10px; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin:0 0 10px;">EDU-ULTIMATE</h2>
        <input type="text" id="user-name" placeholder="名前を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <p id="setup-msg" style="font-size:11px; color:#aaa; margin-bottom:15px;">カメラとマイクを許可してください。</p>
        <button class="btn-primary" style="margin-bottom:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header id="app-header">
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <span id="timer-display" style="font-size:22px; font-weight:bold; color:var(--accent);">00:00</span>
    </div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">自分</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            <div style="display:flex; flex-direction:column; gap:5px; margin-top:10px;">
                <button id="mic-btn" class="btn-success" style="padding:8px; font-size:12px;" onclick="toggleMic()">🎤 マイク: ON</button>
                <button class="btn-switch" onclick="switchVideoSource()">📷 ↔ 💻 映像切替</button>
            </div>
        </div>
        <div id="teacher-tools" class="hidden">
             <div class="panel">
                <div class="panel-title">招待用QR</div>
                <div id="qrcode" style="background:white; padding:5px; border-radius:5px; text-align:center;"></div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container">
            <div id="on-air-status" class="hidden" style="position:absolute; top:10px; left:10px;"><span class="on-air">● ON AIR</span></div>
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-section" class="hidden" style="height:30vh; background:#111; border-top:1px solid #333; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:10px;"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    let isCameraMode = true; // 現在カメラかどうか

    async function start(role) {
        const nameInput = document.getElementById('user-name');
        const roomInput = document.getElementById('room-id');
        if (!nameInput.value || !roomInput.value) return alert("入力してください");

        myRole = role;
        currentRid = roomInput.value;
        isCameraMode = (role === 'teacher'); // 先生はカメラ、生徒は画面共有から開始

        try {
            await getStream(isCameraMode);
            
            document.getElementById('setup-screen').classList.add('hidden');
            if(role === 'student') document.body.classList.add('is-student', 'reaction-disabled');

            const peerId = (role === 'teacher') ? "T-ROOM-" + currentRid : undefined;
            peer = new Peer(peerId);

            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addGrid(call.peer, s));
            });

        } catch (err) {
            alert("メディアエラー: " + err.message);
        }
    }

    // ストリームを取得する関数
    async function getStream(camera) {
        let newStream;
        try {
            if (camera) {
                newStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } else {
                newStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                // 画面共有には音声が含まれない場合があるためマイクを追加
                const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
                newStream = new MediaStream([...newStream.getVideoTracks(), ...mic.getAudioTracks()]);
            }

            if (localStream) {
                // 既存の通信がある場合、映像トラックだけを入れ替える（replaceTrack）
                const newVideoTrack = newStream.getVideoTracks()[0];
                replaceVideoTrack(newVideoTrack);
                
                // 古いストリームを停止
                localStream.getTracks().forEach(t => t.stop());
            }

            localStream = newStream;
            document.getElementById('my-video').srcObject = localStream;
            // 先生の場合、自分の放送画面も更新
            if(myRole === 'teacher') document.getElementById('main-broadcast-video').srcObject = localStream;
            
        } catch (e) {
            console.error(e);
            throw e;
        }
    }

    // 通話中の全相手に新しい映像トラックを送信する
    function replaceVideoTrack(newTrack) {
        if (!peer) return;
        
        // PeerJSの内部的な接続リストからRTCPeerConnectionにアクセス
        Object.values(peer.connections).forEach(connList => {
            connList.forEach(conn => {
                if (conn.peerConnection) {
                    const senders = conn.peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    if (videoSender) {
                        videoSender.replaceTrack(newTrack);
                    }
                }
            });
        });
    }

    // 切り替えボタン
    async function switchVideoSource() {
        isCameraMode = !isCameraMode;
        try {
            await getStream(isCameraMode);
        } catch (e) {
            isCameraMode = !isCameraMode; // 失敗したらモードを戻す
            alert("切り替えに失敗しました。デバイスが対応していない可能性があります。");
        }
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-section').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('on-air-status').classList.remove('hidden');
        new QRCode(document.getElementById("qrcode"), { text: location.href.split('?')[0] + "?id=" + currentRid, width: 120, height: 120 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const call = peer.call(tid, localStream);
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
            document.getElementById('on-air-status').classList.remove('hidden');
        });
    }

    function addGrid(id, stream) {
        if(document.getElementById('v-'+id)) return;
        const v = document.createElement('video');
        v.id = 'v-'+id;
        v.srcObject = stream;
        v.autoplay = true;
        v.playsinline = true;
        v.style.width = "100%";
        v.style.borderRadius = "5px";
        v.style.background = "#000";
        document.getElementById('monitor-section').appendChild(v);
    }

    function toggleMic() {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('mic-btn').innerText = audioTrack.enabled ? "🎤 マイク: ON" : "🔇 マイク: OFF";
            document.getElementById('mic-btn').className = audioTrack.enabled ? "btn-success" : "btn-danger";
        }
    }
</script>
</body>
</html>
