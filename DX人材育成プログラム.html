<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v5.1 Broadcaster</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --private: #9b59b6; 
            --header-h: 50px; --sidebar-w: 280px;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; 
            overflow: hidden; user-select: none;
        }
        
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .modal-box { background: #222; padding: 25px; border-radius: 24px; text-align: center; width: 100%; max-width: 360px; border: 1px solid #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-size: 16px; }
        
        header { background: #111; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; height: var(--header-h); border-bottom: 1px solid #333; flex-shrink: 0; }
        .room-id-badge { font-size: 12px; opacity: 0.8; }

        .main-layout { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        .sidebar { width: var(--sidebar-w); background: #111; border-right: 1px solid #333; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden; }
        
        .broadcast-container { flex: 1.5; position: relative; background: #000; display: flex; justify-content: center; align-items: center; min-height: 200px; border-bottom: 2px solid #333; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        .monitor-grid { flex: 1; background: #111; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .student-card { background: #222; padding: 8px; border-radius: 12px; border: 1px solid #444; text-align: center; position: relative; transition: 0.1s; }
        .student-card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; object-fit: cover; cursor: pointer; }

        .vol-container { width: 100%; height: 4px; background: #444; border-radius: 2px; margin: 5px 0; overflow: hidden; }
        .vol-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.1s; }

        button { cursor: pointer; border: none; font-weight: bold; border-radius: 12px; transition: 0.2s; font-size: 14px; padding: 12px; touch-action: manipulation; }
        button:active { filter: brightness(0.7); }
        .btn-primary { background: #0097e6; color: white; width: 100%; }
        .btn-success { background: var(--success); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; width: 100%; }
        .btn-warning { background: var(--warning); color: black; width: 100%; }
        .btn-mini { padding: 6px; font-size: 11px; width: 100%; margin-top: 4px; }
        
        .recording-active { background: var(--danger) !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .hidden { display: none !important; }
        #chat-messages { flex: 1; min-height: 100px; overflow-y: auto; font-size: 13px; background: #000; padding: 8px; border-radius: 10px; border: 1px solid #333; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-top: 1px solid #333; order: 2; max-height: 40%; }
            .content-area { order: 1; }
            .monitor-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:10px; font-size:20px;">EDU-ULTIMATE v5.1</h2>
        <input type="text" id="user-name" placeholder="名前を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)" pattern="\d*">
        <select id="start-media-type">
            <option value="camera">📷 カメラで開始</option>
            <option value="screen">💻 画面共有で開始（ホストのみ）</option>
        </select>
        <button class="btn-primary" style="margin-top:5px;" onclick="start('teacher')">先生（ホスト）として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:8px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">READY</span>
        <span id="broadcast-status" style="font-size:10px; background:#444; padding:2px 6px; border-radius:4px;">待機中</span>
    </div>
    <div class="room-id-badge" id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="content-area">
        <div class="broadcast-container">
            <div id="live-indicator" style="position:absolute; top:8px; left:8px; z-index:10;"><span style="background:red; color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">● LIVE</span></div>
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid"></div>
    </div>

    <div class="sidebar">
        <div class="panel" style="background:#222; padding:10px; border-radius:15px;">
            <div style="position:relative; width:90px; height:68px; float:right; margin-left:10px;">
                <video id="my-video" autoplay playsinline muted style="width:100%; height:100%; background:#000; border-radius:8px; object-fit: cover;"></video>
                <div class="vol-container" style="position:absolute; bottom:-6px; left:0;"><div id="my-vol-bar" class="vol-bar"></div></div>
            </div>
            <div style="overflow:hidden;">
                <div id="self-name-label" style="font-size:12px; font-weight:bold; margin-bottom:5px;">自分</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                    <button id="mic-btn" class="btn-success" onclick="toggleMic()" style="font-size:11px; padding:8px 2px;">🎤 ON</button>
                    <button id="cam-btn" class="btn-success" onclick="toggleCam()" style="font-size:11px; padding:8px 2px;">📷 ON</button>
                </div>
            </div>
            <select id="switch-media" onchange="changeMyMedia()" style="width:100%; margin-top:10px; background:#111; color:white; border:1px solid #444; font-size:12px; padding:8px;">
                <option value="camera">📷 カメラ切替</option>
                <option value="screen">💻 画面共有切替</option>
            </select>
            <button id="reset-broadcast-btn" class="btn-warning hidden" style="margin-top:8px; font-size:12px;" onclick="resetToTeacherStream()">🔄 全員に自分の配信を戻す</button>
        </div>

        <div id="teacher-tools" class="hidden">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px;">
                <button id="record-btn" class="btn-primary" style="font-size:11px;" onclick="toggleRecording()">🔴 録画開始</button>
                <button class="btn-danger" style="font-size:11px;" onclick="forceExitAll()">全生徒退出</button>
            </div>
            <div id="qrcode" style="display:flex; justify-content:center; background:white; padding:5px; border-radius:10px;"></div>
        </div>

        <div style="flex:1; display:flex; flex-direction:column; gap:5px; overflow:hidden;">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="チャット..." style="background:#111; color:white; border:1px solid #444; font-size:14px; padding:10px; border-radius:10px;">
        </div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let connections = {};
    let students = {};
    let audioCtx;
    let mediaRecorder, recordedChunks = [];
    let isReStreaming = false;

    function initAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        else if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    async function start(role) {
        initAudioContext();
        myName = document.getElementById('user-name').value || "ゲスト";
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("部屋IDを入力してください");
        myRole = role;

        let mediaType = document.getElementById('start-media-type').value;
        if(role === 'student') {
            mediaType = 'camera'; 
            document.getElementById('switch-media').classList.add('hidden');
        }

        try {
            await getMedia(mediaType);
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('self-name-label').innerText = myName;

            const myPeerId = role === 'teacher' ? "T-ROOM-" + currentRid : "S-" + Math.random().toString(36).substr(2, 9);
            peer = new Peer(myPeerId);
            
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
                setupVolumeMeter(localStream, 'my-vol-bar');
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });

            peer.on('connection', conn => {
                connections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });
        } catch(e) { alert("メディア取得失敗"); }
    }

    async function getMedia(type) {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(myRole === 'student') type = 'camera';

        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
        let videoStream;
        if(type === 'camera') {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('my-video').style.transform = "scaleX(-1)";
        } else {
            videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('my-video').style.transform = "none";
        }
        localStream = new MediaStream([...videoStream.getVideoTracks(), ...(micStream ? micStream.getAudioTracks() : [])]);
        document.getElementById('my-video').srcObject = localStream;
        if(myRole === 'teacher' && !isReStreaming) document.getElementById('main-broadcast-video').srcObject = localStream;
    }

    function setupVolumeMeter(stream, barId) {
        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) return;
        const meterContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = meterContext.createMediaStreamSource(new MediaStream([audioTracks[0]]));
        const analyser = meterContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const bar = document.getElementById(barId);
        function update() {
            if (!document.getElementById(barId)) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;
            let volume = Math.min(100, average * 2.5);
            if (bar) bar.style.width = volume + "%";
            requestAnimationFrame(update);
        }
        update();
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('broadcast-status').innerText = "配信中";
        new QRCode(document.getElementById("qrcode"), { text: location.href.split('?')[0] + "?id=" + currentRid, width: 80, height: 80 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({type:'JOIN', name:myName}));
        conn.on('data', data => handleData(tid, data));
        const call = peer.call(tid, localStream);
        call.on('stream', s => { document.getElementById('main-broadcast-video').srcObject = s; });
    }

    function handleData(id, data) {
        if(data.type === 'JOIN') {
            students[id] = {name: data.name};
            if(myRole === 'teacher') broadcastUserList();
            addChat("システム", data.name + "さんが参加");
        }
        if(data.type === 'USER_LIST') {
            data.users.forEach(u => {
                if(u.id !== peer.id && !connections[u.id]) {
                    const conn = peer.connect(u.id);
                    conn.on('open', () => {
                        connections[u.id] = conn;
                        conn.send({type:'HELLO', name:myName});
                        peer.call(u.id, localStream);
                    });
                }
                students[u.id] = {name: u.name};
            });
        }
        if(data.type === 'HELLO') students[id] = {name: data.name};
        if(data.type === 'CHAT') addChat(data.name, data.msg);
        if(data.type === 'EXIT') location.reload();
    }

    function broadcastUserList() {
        const userList = Object.keys(students).map(id => ({id: id, name: students[id].name}));
        userList.push({id: peer.id, name: myName});
        Object.values(connections).forEach(conn => conn.send({type:'USER_LIST', users: userList}));
    }

    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        const name = students[id] ? students[id].name : "参加者";
        const volBarId = "vol-" + id;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline onclick="spotlightStudent('${id}')"></video>
            <div style="font-size:10px; margin-top:2px;">${name}</div>
            <div class="vol-container"><div id="${volBarId}" class="vol-bar"></div></div>
            <div style="display:flex; gap:2px;">
                <button class="btn-mini btn-warning" onclick="spotlightStudent('${id}')">全体共有</button>
                ${myRole==='teacher' ? `<button class="btn-mini btn-danger" onclick="kickStudent('${id}')">✕</button>` : ''}
            </div>
        `;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
        setupVolumeMeter(stream, volBarId);
    }

    // ★今回の主要機能：生徒の映像を全体にブロードキャストする
    function spotlightStudent(id) {
        const v = document.getElementById('v-'+id);
        if(!v) return;
        const studentStream = v.srcObject;
        document.getElementById('main-broadcast-video').srcObject = studentStream;
        
        if(myRole === 'teacher') {
            isReStreaming = true;
            replaceOutgoingTracks(studentStream);
            document.getElementById('reset-broadcast-btn').classList.remove('hidden');
            document.getElementById('broadcast-status').innerText = "生徒画面を全体共有中";
            document.getElementById('broadcast-status').style.background = "var(--warning)";
            document.getElementById('broadcast-status').style.color = "black";
        } else {
            // 生徒の場合は自分のローカル画面が切り替わるだけ
            document.getElementById('reset-broadcast-btn').classList.remove('hidden');
        }
    }

    function resetToTeacherStream() {
        isReStreaming = false;
        if(myRole === 'teacher') {
            document.getElementById('main-broadcast-video').srcObject = localStream;
            replaceOutgoingTracks(localStream);
            document.getElementById('broadcast-status').innerText = "配信中";
            document.getElementById('broadcast-status').style.background = "#444";
            document.getElementById('broadcast-status').style.color = "white";
        }
        document.getElementById('reset-broadcast-btn').classList.add('hidden');
    }

    // ★全通信のトラックを差し替える関数
    function replaceOutgoingTracks(stream) {
        const vt = stream.getVideoTracks()[0];
        const at = stream.getAudioTracks()[0];
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(call => {
                if(call.peerConnection) {
                    const senders = call.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind==='video');
                    const as = senders.find(s => s.track && s.track.kind==='audio');
                    if(vs && vt) vs.replaceTrack(vt);
                    if(as && at) as.replaceTrack(at);
                }
            });
        });
    }

    function removeStudent(id) {
        const card = document.getElementById('card-'+id);
        if(card) card.remove();
        delete students[id];
        delete connections[id];
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('mic-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
            document.getElementById('mic-btn').innerText = t.enabled ? '🎤 ON' : '🔇 OFF';
        }
    }

    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('cam-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
            document.getElementById('cam-btn').innerText = t.enabled ? '📷 ON' : '📷 OFF';
        }
    }

    function addChat(name, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<span style="color:var(--accent)">${name}:</span> ${msg}`;
        const box = document.getElementById('chat-messages');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if(e.key === 'Enter' && e.target.value) {
            initAudioContext();
            const msg = e.target.value;
            addChat("自分", msg);
            Object.values(connections).forEach(c => c.send({type:'CHAT', name:myName, msg:msg}));
            e.target.value = "";
        }
    }

    function forceExitAll() { if(confirm("全員を退出させますか？")) Object.values(connections).forEach(c => c.send({type:'EXIT'})); }
    function kickStudent(id) { if(confirm("退出させますか？")) connections[id].send({type:'EXIT'}); }

    function toggleRecording() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = document.getElementById('main-broadcast-video').srcObject;
            if (!stream) return;
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `rec_${Date.now()}.webm`; a.click();
            };
            mediaRecorder.start();
            document.getElementById('record-btn').innerText = "⏹ 停止";
            document.getElementById('record-btn').classList.add('recording-active');
        } else {
            mediaRecorder.stop();
            document.getElementById('record-btn').innerText = "🔴 録画";
            document.getElementById('record-btn').classList.remove('recording-active');
        }
    }

    async function changeMyMedia() {
        await getMedia(document.getElementById('switch-media').value);
        if(!isReStreaming) replaceOutgoingTracks(localStream);
    }
</script>
</body>
</html>
