<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v37.0 - プライバシー重視・日本語版</title>
    
    <!-- 外部ライブラリの読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.15);
            --danger: #ff2d55;
            --success: #00ff88;
            --bg-base: #02050a;
            --bg-panel: rgba(15, 20, 30, 0.98);
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-w: 400px;
            --header-h: 80px;
            --font-ui: 'Noto Sans JP', sans-serif;
        }

        /* 全体のリセットと基本スタイル */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-base); color: #f0f4f8; 
            font-family: var(--font-ui); overflow: hidden; 
        }

        /* --- 起動画面（セットアップ） --- */
        #launcher {
            position: fixed; inset: 0; z-index: 100000;
            background: radial-gradient(circle at center, #1a2a44 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .launcher-card {
            background: var(--bg-panel); backdrop-filter: blur(25px);
            padding: 60px; border-radius: 40px; border: 1px solid var(--border);
            width: 520px; text-align: center; box-shadow: 0 50px 120px rgba(0,0,0,0.9);
        }
        .launcher-card h1 { font-size: 42px; font-weight: 900; color: var(--accent); margin: 0 0 10px; letter-spacing: -1.5px; }
        .launcher-card p { color: #8899aa; margin-bottom: 45px; font-size: 16px; }
        .input-group { margin-bottom: 30px; text-align: left; }
        .input-group label { font-size: 13px; font-weight: 800; color: var(--accent); display: block; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input {
            width: 100%; padding: 20px; border-radius: 15px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 18px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 25px var(--accent-dim); }
        .btn-start {
            width: 100%; padding: 22px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer;
            transition: 0.3s; font-size: 18px; margin-top: 15px; letter-spacing: 1px;
        }
        .btn-t { background: var(--accent); color: #000; }
        .btn-s { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-start:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        /* --- メインUI構造 --- */
        #app-root { display: none; width: 100%; height: 100%; flex-direction: column; }
        #app-root.active { display: flex; }

        header {
            height: var(--header-h); background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 0 40px; z-index: 5000;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; font-weight: 900; font-size: 24px; color: var(--accent); }
        .room-badge { background: var(--accent-dim); padding: 7px 20px; border-radius: 50px; border: 1px solid var(--accent); font-size: 14px; font-weight: 800; }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* ステージ（メイン映像エリア） */
        .stage-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .viewport { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        #board-canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        #board-canvas.active { pointer-events: auto; cursor: crosshair; }

        /* HUD（状況表示） */
        .hud { position: absolute; z-index: 150; pointer-events: none; }
        .hud-tl { top: 30px; left: 30px; }
        .hud-tr { top: 30px; right: 30px; }
        .badge { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 12px 25px; border-radius: 18px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: #fff; pointer-events: auto; }
        .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* ビデオシェルフ（下部のカード一覧） */
        .video-shelf {
            height: 190px; background: rgba(0,0,0,0.6); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 30px; gap: 20px; overflow-x: auto;
            scrollbar-width: none;
        }
        .video-shelf::-webkit-scrollbar { display: none; }
        .card-node {
            width: 220px; height: 160px; background: #0d111a; border-radius: 25px; flex-shrink: 0;
            overflow: hidden; border: 1px solid var(--border); position: relative; transition: 0.4s;
            cursor: pointer;
        }
        .card-node.active-focus { border: 3px solid var(--accent); box-shadow: 0 0 30px var(--accent-dim); transform: scale(1.03); }
        .card-node video { width: 100%; height: 125px; object-fit: cover; background: #000; }
        .card-node .label { font-size: 11px; font-weight: 800; text-align: center; padding: 7px; background: rgba(0,0,0,0.7); text-transform: uppercase; }
        .vol-meter-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.05); }
        .vol-meter-fill { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }

        /* サイドバー（コントロールパネル） */
        .sidebar { width: var(--sidebar-w); background: var(--bg-panel); backdrop-filter: blur(30px); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 25px; background: none; border: none; color: #607080; cursor: pointer; font-size: 24px; transition: 0.3s; }
        .tab-btn.active { color: var(--accent); border-bottom: 4px solid var(--accent); background: rgba(0,242,255,0.05); }

        .pane { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 30px; }
        .pane-label { font-size: 13px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }

        /* アクショングリッド */
        .cmd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .cmd-btn {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: #fff;
            padding: 20px 5px; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 12px; font-size: 11px; font-weight: 700; transition: 0.2s;
        }
        .cmd-btn:hover { border-color: var(--accent); color: var(--accent); }
        .cmd-btn.active { background: var(--accent); color: #000; font-weight: 900; }
        .cmd-btn.danger.active { background: var(--danger); color: #fff; }

        /* ユーザーリスト行 */
        .user-row {
            background: rgba(255,255,255,0.03); border-radius: 18px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .user-name { font-size: 15px; font-weight: 700; }
        .user-btns { display: flex; gap: 10px; }
        .mini-btn { padding: 8px 14px; border-radius: 10px; border: none; font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-focus { background: var(--accent); color: #000; }
        .btn-screen { background: var(--success); color: #000; }

        /* チャットUI */
        #chat-flow { flex: 1; background: rgba(0,0,0,0.3); border-radius: 25px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .bubble { font-size: 15px; line-height: 1.6; border-radius: 15px; padding: 12px 18px; background: rgba(255,255,255,0.06); width: fit-content; max-width: 85%; }
        .bubble.me { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); }
        .bubble b { display: block; font-size: 10px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }

        .chat-input { display: flex; gap: 15px; }
        .chat-input input { flex: 1; padding: 18px; border-radius: 15px; font-size: 16px; }

        /* ホワイトボードツールバー */
        #wb-toolbar {
            position: absolute; right: 30px; top: 120px; background: var(--bg-panel);
            border: 2px solid var(--accent); border-radius: 20px; padding: 18px;
            display: none; flex-direction: column; gap: 20px; z-index: 6000; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .tool-icon { width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
        .tool-icon.selected { background: var(--accent); color: #000; }
        .col-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .col-dot.selected { border-color: #fff; transform: scale(1.1); }

        /* 通知・トースト */
        #toast-zone { position: fixed; top: 110px; left: 40px; z-index: 10000; display: flex; flex-direction: column; gap: 15px; }
        .toast { background: var(--bg-panel); border-left: 8px solid var(--accent); padding: 20px 35px; border-radius: 15px; font-size: 16px; font-weight: 700; animation: slideIn 0.4s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        /* エフェクト */
        .fx-container { position: fixed; inset: 0; pointer-events: none; z-index: 99999; overflow: hidden; }
        .fx-item { position: absolute; font-size: 60px; bottom: -120px; animation: flyUp 4s linear forwards; }
        @keyframes flyUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-130vh) rotate(720deg); opacity: 0; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 初期画面 -->
<div id="launcher">
    <div class="launcher-card">
        <h1>EDU-ULTIMATE</h1>
        <p>プライバシー保護・次世代教育システム v37.0</p>
        
        <div class="input-group">
            <label>お名前</label>
            <input type="text" id="join-name" placeholder="例：佐藤 先生 / 田中 太郎">
        </div>
        <div class="input-group">
            <label>ルームID (4桁)</label>
            <input type="number" id="join-room" placeholder="0000">
        </div>

        <button class="btn-start btn-t" onclick="startSystem('teacher')">先生として開始</button>
        <button class="btn-start btn-s" onclick="startSystem('student')">生徒として参加</button>
    </div>
</div>

<!-- アプリメイン画面 -->
<div id="app-root">
    <header>
        <div class="logo-area">
            <i class="fas fa-shield-halved"></i>
            <span>NEXUS 日本語版</span>
            <div class="room-badge" id="room-display">ルームID: ----</div>
        </div>
        <div style="display:flex; align-items:center; gap:30px;">
            <div id="rec-status" class="hidden" style="color:var(--danger); font-weight:900; font-size:16px;"><i class="fas fa-circle"></i> 録画中</div>
            <div id="clock" style="font-family:'JetBrains Mono'; font-size:26px; font-weight:700;">00:00:00</div>
            <button class="cmd-btn danger" style="padding:10px 25px; width:auto; border-radius:12px; font-size:14px;" onclick="location.reload()">終了</button>
        </div>
    </header>

    <div class="container">
        <!-- 映像ステージ -->
        <div class="stage-area">
            <div class="viewport" id="viewport-root" onclick="unmuteAudio()">
                <div class="hud hud-tl">
                    <div class="badge"><div class="pulse"></div> <span id="display-viewer-name">配信待機中</span></div>
                </div>
                
                <canvas id="board-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>

                <div id="wb-toolbar">
                    <div class="tool-icon selected" onclick="updateTool('pen', this)"><i class="fas fa-pen"></i></div>
                    <div class="tool-icon" onclick="updateTool('eraser', this)"><i class="fas fa-eraser"></i></div>
                    <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
                    <div class="col-dot selected" onclick="updateColor('#00f2ff', this)" style="background:#00f2ff"></div>
                    <div class="col-dot" onclick="updateColor('#ff2d55', this)" style="background:#ff2d55"></div>
                    <div class="col-dot" onclick="updateColor('#00ff88', this)" style="background:#00ff88"></div>
                    <div class="tool-icon" onclick="clearBoard()" style="color:var(--danger); margin-top:10px;"><i class="fas fa-trash-can"></i></div>
                </div>
            </div>

            <!-- 下部ビデオ一覧 -->
            <div class="video-shelf" id="monitor-shelf">
                <div class="card-node" id="card-local">
                    <video id="video-local" autoplay playsinline muted></video>
                    <div class="label">自分のカメラ</div>
                    <div class="vol-meter-bg"><div class="vol-meter-fill" id="vol-local"></div></div>
                </div>
            </div>
        </div>

        <!-- サイドバー -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchPane('ctrl', this)"><i class="fas fa-terminal"></i></button>
                <button class="tab-btn" onclick="switchPane('chat', this)"><i class="fas fa-message"></i></button>
                <button class="tab-btn" onclick="switchPane('users', this)"><i class="fas fa-users-viewfinder"></i></button>
            </div>

            <div class="pane" id="pane-ctrl">
                <div id="teacher-panel" class="hidden">
                    <div class="pane-label">クラス統制コマンド</div>
                    <div class="cmd-grid">
                        <button class="cmd-btn" onclick="masterAudio(false)"><i class="fas fa-microphone-slash"></i><span>全員消音</span></button>
                        <button class="cmd-btn" onclick="masterAudio(true)"><i class="fas fa-microphone"></i><span>全員解除</span></button>
                        <button class="cmd-btn" id="btn-wb" onclick="toggleWB()"><i class="fas fa-chalkboard"></i><span>黒板モード</span></button>
                        <button class="cmd-btn" id="btn-rec" onclick="toggleRec()"><i class="fas fa-video"></i><span>授業録画</span></button>
                        <button class="cmd-btn" onclick="dispatchSpotlight(peer.id)"><i class="fas fa-bullhorn"></i><span>先生を固定</span></button>
                        <button class="cmd-btn" onclick="sendReaction('⭐')"><i class="fas fa-award"></i><span>褒める</span></button>
                    </div>
                </div>

                <div class="pane-label">デバイス設定</div>
                <div class="cmd-grid">
                    <button class="cmd-btn" id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i><span>マイク</span></button>
                    <button class="cmd-btn" id="cam-btn" onclick="toggleCam()"><i class="fas fa-video"></i><span>カメラ</span></button>
                    <button class="cmd-btn" id="screen-btn" onclick="toggleScreen()"><i class="fas fa-desktop"></i><span>画面共有</span></button>
                </div>

                <div style="margin-top:20px; padding:25px; background:rgba(0,0,0,0.3); border-radius:30px; border:1px solid var(--border);">
                    <div class="pane-label" style="margin-bottom:10px;">クイック・リアクション</div>
                    <div style="display:flex; justify-content:space-between; font-size:35px;">
                        <span style="cursor:pointer;" onclick="sendReaction('👏')">👏</span>
                        <span style="cursor:pointer;" onclick="sendReaction('🔥')">🔥</span>
                        <span style="cursor:pointer;" onclick="sendReaction('👍')">👍</span>
                        <span style="cursor:pointer;" onclick="sendReaction('💡')">💡</span>
                    </div>
                </div>
            </div>

            <div class="pane hidden" id="pane-chat">
                <div id="chat-flow"></div>
                <div class="chat-input">
                    <input type="text" id="chat-in" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter')dispatchChat()">
                    <button class="cmd-btn" style="width:70px; background:var(--accent); color:#000;" onclick="dispatchChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="pane hidden" id="pane-users">
                <div class="pane-label">参加者ディレクトリ</div>
                <div id="user-roster"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-zone"></div>
<div class="fx-container" id="fx-root"></div>

<script>
/**
 * EDU-ULTIMATE v37.0 日本語版・ロジックエンジン
 * プライバシーメッシュ & 指名共有プロトコル
 */
let peer, localStream, mode, myName, roomID;
let conns = {}, streams = {}, meta = {};
let micActive = false, camActive = true, boardActive = false, screenActive = false, currentSpotlight = null;
let canvas, ctx, isPainting = false, activeTool = 'pen', activeCol = '#00f2ff', lastPos = {x:0, y:0};
let audioCtx, recorder, chunks = [];

async function startSystem(m) {
    mode = m;
    myName = document.getElementById('join-name').value || (mode==='teacher'?'先生':'生徒');
    roomID = document.getElementById('join-room').value;
    if(!roomID || roomID.length < 4) return alert("4桁のルームIDを入力してください。");

    // 初期メディア取得
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    localStream.getAudioTracks().forEach(t => t.enabled = false); // 初期は消音
    
    const pid = (mode === 'teacher') ? `JP-HOST-${roomID}` : `JP-NODE-${roomID}-${Math.random().toString(36).substr(2,7)}`;
    peer = new Peer(pid);

    peer.on('open', id => {
        document.getElementById('launcher').classList.add('hidden');
        document.getElementById('app-root').classList.add('active');
        document.getElementById('room-display').innerText = `ルームID: ${roomID}`;
        document.getElementById('video-local').srcObject = localStream;

        initAudioVisualizer(localStream, 'vol-local');
        startClock();

        if(mode === 'teacher'){
            document.getElementById('teacher-panel').classList.remove('hidden');
            initCanvas();
            dispatchSpotlight(peer.id);
        } else {
            connectToTeacher();
        }
        pushToast("システム稼働中", `${myName}として入室しました`);
    });

    peer.on('call', call => {
        // 【プライバシー制御】生徒は先生または指名された生徒からの着信のみ許可
        if(mode === 'student'){
            const isHost = call.peer.includes('HOST');
            const isSpotlight = (call.peer === currentSpotlight);
            if(!isHost && !isSpotlight) return; 
        }

        call.answer(localStream);
        call.on('stream', stream => {
            streams[call.peer] = stream;
            addVideoNode(call.peer, stream);
            if(call.peer.includes('HOST')) applyMainView(call.peer);
        });
    });

    peer.on('connection', c => setupDataSync(c));
}

function connectToTeacher() {
    const hostID = `JP-HOST-${roomID}`;
    const c = peer.connect(hostID);
    setupDataSync(c);
    c.on('open', () => {
        c.send({type:'jp-join', name:myName});
        peer.call(hostID, localStream);
    });
}

function setupDataSync(c) {
    conns[c.peer] = c;
    c.on('data', data => {
        switch(data.type) {
            case 'jp-join':
                meta[c.peer] = {name:data.name};
                if(mode === 'teacher') {
                    broadcastDirectory();
                    peer.call(c.peer, localStream);
                }
                refreshUserList();
                break;
            case 'jp-dir':
                data.list.forEach(u => {
                    if(u.id !== peer.id && !conns[u.id]){
                        meta[u.id] = {name:u.name};
                        const nc = peer.connect(u.id);
                        setupDataSync(nc);
                        nc.on('open', () => nc.send({type:'jp-hello', name:myName}) );
                    }
                });
                refreshUserList();
                break;
            case 'jp-hello':
                meta[c.peer] = {name:data.name};
                refreshUserList();
                break;
            case 'jp-chat': renderChat(data.name, data.msg, false); break;
            case 'jp-draw': renderDraw(data); break;
            case 'jp-clear': ctx.clearRect(0,0,canvas.width, canvas.height); break;
            case 'jp-mic-cmd': forceMic(data.val); break;
            case 'jp-spotlight': executeSpotlight(data.id); break;
            case 'jp-fx': spawnEmoji(data.emoji); break;
            case 'jp-force-screen': handleScreenCommand(); break;
        }
    });
    c.on('close', () => {
        delete conns[c.peer];
        const node = document.getElementById(`node-${c.peer}`);
        if(node) node.remove();
        refreshUserList();
    });
}

/**
 * 指名共有プロトコル
 * 先生が特定の生徒の映像をクラス全員に強制表示
 */
function dispatchSpotlight(pid) {
    if(mode !== 'teacher') return;
    executeSpotlight(pid);
    transmit({type:'jp-spotlight', id:pid});
    pushToast("指名共有", "対象の映像を全員に同期しました");
}

function executeSpotlight(id) {
    currentSpotlight = id;
    applyMainView(id);

    // 【重要】自分が指名された生徒の場合、先生以外の全員に発信する
    if(id === peer.id && mode === 'student'){
        Object.keys(conns).forEach(cid => {
            if(!cid.includes('HOST')) peer.call(cid, localStream);
        });
    }
}

function applyMainView(id) {
    const main = document.getElementById('main-video');
    const stream = (id === peer.id) ? localStream : streams[id];
    if(stream) {
        main.srcObject = stream;
        main.muted = (id === peer.id);
        const nameLabel = id.includes('HOST') ? "先生" : (meta[id]?.name || "指名中のユーザー");
        document.getElementById('display-viewer-name').innerText = `表示中: ${nameLabel}`;
        main.play().catch(()=>{});
    }
}

/** 
 * 強制画面共有
 */
function forceScreenShare(target) {
    if(mode !== 'teacher') return;
    const c = conns[target];
    if(c) c.send({type:'jp-force-screen'});
}

async function handleScreenCommand() {
    try {
        const ss = await navigator.mediaDevices.getDisplayMedia({video:true});
        const st = ss.getVideoTracks()[0];
        const ct = localStream.getVideoTracks()[0];
        localStream.removeTrack(ct); localStream.addTrack(st);
        
        Object.values(peer.connections).forEach(pcs => {
            pcs.forEach(pc => {
                if(pc.type === 'media') {
                    const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(snd) snd.replaceTrack(st);
                }
            });
        });
        document.getElementById('video-local').srcObject = localStream;
        screenActive = true;
        document.getElementById('screen-btn').classList.add('active');
        st.onended = () => stopScreen();
        pushToast("共有中", "画面の配信を開始しました");
    } catch(e){}
}

async function stopScreen() {
    const st = localStream.getVideoTracks()[0];
    const ncam = await navigator.mediaDevices.getUserMedia({video:true});
    const nt = ncam.getVideoTracks()[0];
    localStream.removeTrack(st); localStream.addTrack(nt); st.stop();
    Object.values(peer.connections).forEach(pcs => {
        pcs.forEach(pc => {
            if(pc.type === 'media') {
                const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if(snd) snd.replaceTrack(nt);
            }
        });
    });
    document.getElementById('video-local').srcObject = localStream;
    screenActive = false;
    document.getElementById('screen-btn').classList.remove('active');
}

/** 黒板システム **/
function initCanvas() {
    canvas = document.getElementById('board-canvas');
    ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.onresize = resize;
    const getPos = e => ({ x: e.offsetX / canvas.width, y: e.offsetY / canvas.height });
    canvas.onmousedown = e => { if(!boardActive) return; isPainting = true; lastPos = getPos(e); };
    canvas.onmousemove = e => {
        if(!isPainting) return;
        const cur = getPos(e);
        const d = { type:'jp-draw', t:activeTool, f:lastPos, to:cur, c:activeCol };
        renderDraw(d); transmit(d); lastPos = cur;
    };
    canvas.onmouseup = () => isPainting = false;
}

function renderDraw(d) {
    ctx.strokeStyle = d.c; ctx.lineWidth = d.t==='eraser'? 50 : 5; ctx.lineCap = 'round';
    ctx.globalCompositeOperation = d.t==='eraser' ? 'destination-out' : 'source-over';
    const w = canvas.width, h = canvas.height;
    ctx.beginPath(); ctx.moveTo(d.f.x * w, d.f.y * h); ctx.lineTo(d.to.x * w, d.to.y * h); ctx.stroke();
}

function toggleWB() {
    boardActive = !boardActive;
    document.getElementById('board-canvas').classList.toggle('active', boardActive);
    document.getElementById('wb-toolbar').style.display = boardActive ? 'flex' : 'none';
    document.getElementById('btn-wb').classList.toggle('active', boardActive);
}

function clearBoard() { ctx.clearRect(0,0,canvas.width, canvas.height); transmit({type:'jp-clear'}); }

/** UI・モニタリング **/
function addVideoNode(id, stream) {
    // 【プライバシー】生徒は先生以外の映像カードを表示しない
    if(mode === 'student' && !id.includes('HOST')) return;

    if(document.getElementById(`node-${id}`)) return;
    const shelf = document.getElementById('monitor-shelf');
    const card = document.createElement('div');
    card.className = 'card-node'; card.id = `node-${id}`;
    card.onclick = () => { if(mode === 'teacher') dispatchSpotlight(id); };
    card.innerHTML = `<video id="vid-${id}" autoplay playsinline></video>
                     <div class="label">${id.includes('HOST')?'先生':(meta[id]?.name || '参加者')}</div>
                     <div class="vol-meter-bg"><div class="vol-meter-fill" id="met-${id}"></div></div>`;
    shelf.appendChild(card);
    document.getElementById(`vid-${id}`).srcObject = stream;
    initAudioVisualizer(stream, `met-${id}`);
}

function refreshUserList() {
    const list = document.getElementById('user-roster');
    list.innerHTML = "";
    Object.keys(conns).forEach(id => {
        // 【プライバシー】生徒はリストに他の生徒の名前を表示しない
        if(mode === 'student' && !id.includes('HOST')) return;

        const row = document.createElement('div');
        row.className = 'user-row';
        const btns = (mode === 'teacher') ? 
            `<div class="user-btns">
                <button class="mini-btn btn-focus" onclick="dispatchSpotlight('${id}')">指名表示</button>
                <button class="mini-btn btn-screen" onclick="forceScreenShare('${id}')">画面取得</button>
            </div>` : "";
        row.innerHTML = `<div class="user-name">${meta[id]?.name || 'ユーザー'}</div>${btns}`;
        list.appendChild(row);
    });
}

function initAudioVisualizer(s, bid) {
    try {
        if(!audioCtx) audioCtx = new AudioContext();
        const src = audioCtx.createMediaStreamSource(s);
        const alz = audioCtx.createAnalyser(); alz.fftSize = 256;
        src.connect(alz);
        const buf = new Uint8Array(alz.frequencyBinCount);
        const loop = () => {
            const el = document.getElementById(bid);
            if(!el) return;
            alz.getByteFrequencyData(buf);
            const a = buf.reduce((p,c)=>p+c)/buf.length;
            el.style.width = Math.min(100, a*3) + "%";
            requestAnimationFrame(loop);
        };
        loop();
    } catch(e){}
}

function pushToast(t, m) {
    const box = document.getElementById('toast-zone');
    const el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = `<span style="color:var(--accent); font-weight:900;">[ ${t} ]</span><br>${m}`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 4500);
}

function transmit(data) {
    Object.values(conns).forEach(c => { if(c.open) c.send(data); });
}

function broadcastDirectory() {
    const list = Object.keys(meta).map(id => ({id, name:meta[id].name}));
    list.push({id:peer.id, name:myName});
    transmit({type:'jp-dir', list});
}

function dispatchChat() {
    const i = document.getElementById('chat-in'); if(!i.value) return;
    renderChat(myName, i.value, true);
    transmit({type:'jp-chat', name:myName, msg:i.value});
    i.value = "";
}

function renderChat(name, msg, own) {
    const f = document.getElementById('chat-flow');
    const b = document.createElement('div');
    b.className = `bubble ${own?'me':''}`;
    b.innerHTML = `<b>${name}</b>${msg}`;
    f.appendChild(b); f.scrollTop = f.scrollHeight;
}

function toggleMic() {
    micActive = !micActive; forceMic(micActive);
    document.getElementById('mic-btn').classList.toggle('active', micActive);
}
function forceMic(v) {
    localStream.getAudioTracks().forEach(t => t.enabled = v);
    micActive = v;
}
function toggleCam() {
    camActive = !camActive; localStream.getVideoTracks().forEach(t => t.enabled = camActive);
    document.getElementById('cam-btn').classList.toggle('active', camActive);
}

function startClock() {
    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = d.toTimeString().split(' ')[0];
    }, 1000);
}

function switchPane(p, b) {
    document.querySelectorAll('.pane').forEach(el => el.classList.add('hidden'));
    document.getElementById(`pane-${p}`).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    b.classList.add('active');
}

function unmuteAudio() { if(audioCtx) audioCtx.resume(); document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{})); }
function updateTool(t, el) { activeTool = t; document.querySelectorAll('.tool-icon').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }
function updateColor(c, el) { activeCol = c; document.querySelectorAll('.col-dot').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }

function sendReaction(emoji) { spawnEmoji(emoji); transmit({type:'jp-fx', emoji}); }
function spawnEmoji(e) {
    const r = document.getElementById('fx-root');
    const el = document.createElement('div');
    el.innerText = e; el.className = 'fx-item';
    el.style.left = Math.random()*85+5+'vw';
    r.appendChild(el);
    setTimeout(() => el.remove(), 4100);
}

function masterAudio(v) { transmit({type:'jp-mic-cmd', val:v}); forceMic(v); }

function toggleRec() {
    if(!recorder || recorder.state === 'inactive') {
        const s = document.getElementById('main-video').srcObject; if(!s) return;
        recorder = new MediaRecorder(s);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const b = new Blob(chunks, {type:'video/webm'});
            const u = URL.createObjectURL(b);
            const a = document.createElement('a'); a.href = u; a.download = `授業録画-${Date.now()}.webm`; a.click();
        };
        recorder.start();
        document.getElementById('rec-status').classList.remove('hidden');
        document.getElementById('btn-rec').classList.add('active');
    } else { recorder.stop(); document.getElementById('rec-status').classList.add('hidden'); document.getElementById('btn-rec').classList.remove('active'); }
}

async function toggleScreen() {
    if(!screenActive) await handleScreenCommand();
    else await stopScreen();
}
</script>
