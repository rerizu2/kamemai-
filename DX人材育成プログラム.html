<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v36.0 PRIVACY-CORE</title>
    
    <!-- External Libs -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.15);
            --danger: #ff1744;
            --success: #00e676;
            --bg-base: #01040a;
            --bg-panel: rgba(13, 20, 30, 0.98);
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-w: 380px;
            --header-h: 75px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-base); color: #eceff4; 
            font-family: 'Outfit', sans-serif; overflow: hidden; 
        }

        /* --- Launcher Overlay --- */
        #launcher {
            position: fixed; inset: 0; z-index: 100000;
            background: radial-gradient(circle at center, #1a2a40 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .launcher-card {
            background: var(--bg-panel); backdrop-filter: blur(20px);
            padding: 50px; border-radius: 40px; border: 1px solid var(--border);
            width: 500px; text-align: center; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }
        .launcher-card h1 { font-size: 40px; font-weight: 900; color: var(--accent); margin: 0 0 10px; letter-spacing: -1.5px; }
        .launcher-card p { color: #708090; margin-bottom: 40px; font-size: 15px; }
        .form-input { margin-bottom: 25px; text-align: left; }
        .form-input label { font-size: 12px; font-weight: 800; color: var(--accent); display: block; margin-bottom: 10px; text-transform: uppercase; }
        input {
            width: 100%; padding: 18px; border-radius: 15px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 20px var(--accent-dim); }
        .btn-launch {
            width: 100%; padding: 20px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer;
            transition: 0.3s; font-size: 17px; margin-top: 15px; text-transform: uppercase;
        }
        .btn-teacher { background: var(--accent); color: #000; }
        .btn-student { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-launch:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

        /* --- Main UI Structure --- */
        #app-shell { display: none; width: 100%; height: 100%; flex-direction: column; }
        #app-shell.active { display: flex; }

        header {
            height: var(--header-h); background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 0 30px; z-index: 1000;
        }
        .brand-logo { display: flex; align-items: center; gap: 15px; font-weight: 900; font-size: 22px; color: var(--accent); }
        .room-badge { background: var(--accent-dim); padding: 5px 15px; border-radius: 50px; border: 1px solid var(--accent); font-size: 12px; color: var(--accent); font-weight: 800; }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* Stage */
        .stage-wrapper { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .viewport { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #main-display { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        #whiteboard { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        #whiteboard.active { pointer-events: auto; cursor: crosshair; }

        /* Stage Overlay */
        .stage-hud { position: absolute; z-index: 100; pointer-events: none; }
        .hud-tl { top: 20px; left: 20px; }
        .hud-tr { top: 20px; right: 20px; }
        .badge { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #fff; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Bottom Shelf */
        .video-shelf {
            height: 170px; background: rgba(0,0,0,0.5); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 15px; overflow-x: auto;
            scrollbar-width: none;
        }
        .card-node {
            width: 190px; height: 140px; background: #0b111a; border-radius: 20px; flex-shrink: 0;
            overflow: hidden; border: 1px solid var(--border); position: relative; transition: 0.3s;
        }
        .card-node.highlight { border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent-dim); }
        .card-node video { width: 100%; height: 105px; object-fit: cover; }
        .card-node .tag { font-size: 10px; font-weight: 800; text-align: center; padding: 5px; background: rgba(0,0,0,0.6); }
        .vol-indicator { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--success); width: 0%; transition: 0.1s; }

        /* Sidebar Control */
        .sidebar { width: var(--sidebar-w); background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-trigger { flex: 1; padding: 20px; background: none; border: none; color: #506070; cursor: pointer; font-size: 20px; transition: 0.3s; }
        .tab-trigger.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(0,229,255,0.05); }

        .pane { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .pane-label { font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

        /* Control Grid */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-ctrl {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            padding: 15px 5px; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 8px; font-size: 10px; font-weight: 600; transition: 0.2s;
        }
        .btn-ctrl:hover { border-color: var(--accent); color: var(--accent); }
        .btn-ctrl.active { background: var(--accent); color: #000; font-weight: 800; }
        .btn-ctrl.danger.active { background: var(--danger); color: #fff; }

        /* Participant Row */
        .p-row {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .p-name { font-size: 13px; font-weight: 700; }
        .p-actions { display: flex; gap: 8px; }
        .btn-action { padding: 6px 12px; border-radius: 8px; border: none; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-focus { background: var(--accent); color: #000; }
        .btn-req { background: var(--success); color: #000; }

        /* Chat System */
        #chat-window { flex: 1; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
        .chat-bubble { font-size: 14px; line-height: 1.5; border-radius: 12px; padding: 10px 15px; background: rgba(255,255,255,0.06); width: fit-content; max-width: 85%; }
        .chat-bubble.own { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); }
        .chat-bubble b { display: block; font-size: 9px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }

        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; }

        /* Whiteboard Toolbar */
        #wb-toolbar {
            position: absolute; right: 20px; top: 100px; background: var(--bg-panel);
            border: 1px solid var(--accent); border-radius: 15px; padding: 12px;
            display: none; flex-direction: column; gap: 15px; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tool-icon { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
        .tool-icon.selected { background: var(--accent); color: #000; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.selected { border-color: #fff; transform: scale(1.1); }

        /* Notifications */
        #toast-box { position: fixed; top: 100px; left: 30px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--bg-panel); border-left: 6px solid var(--accent); padding: 15px 25px; border-radius: 12px; font-size: 14px; font-weight: 700; animation: slideIn 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        /* Privacy Layer */
        .privacy-shield { position: absolute; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; color: var(--accent); font-size: 10px; font-weight: 900; z-index: 5; text-transform: uppercase; letter-spacing: 1px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="launcher">
    <div class="launcher-card">
        <h1>EDU-ULTIMATE</h1>
        <p>Student Privacy & High-Performance Command v36.0</p>
        
        <div class="form-input">
            <label>Name</label>
            <input type="text" id="join-name" placeholder="Enter your name">
        </div>
        <div class="form-input">
            <label>Classroom ID</label>
            <input type="number" id="join-room" placeholder="Enter 4-digit ID">
        </div>

        <button class="btn-launch btn-teacher" onclick="initNexus('teacher')">Activate as Teacher</button>
        <button class="btn-launch btn-student" onclick="initNexus('student')">Enter as Student</button>
    </div>
</div>

<div id="app-shell">
    <header>
        <div class="brand-logo">
            <i class="fas fa-shield-halved"></i>
            <span>NEXUS-CORE</span>
            <div class="room-badge" id="room-display">ID: ----</div>
        </div>
        <div style="display:flex; align-items:center; gap:25px;">
            <div id="rec-status" class="hidden" style="color:var(--danger); font-weight:900; font-size:13px;"><i class="fas fa-circle"></i> RECORDING</div>
            <div id="clock" style="font-family:'JetBrains Mono'; font-size:22px; font-weight:700;">00:00:00</div>
            <button class="btn-ctrl danger" style="padding:10px 20px; width:auto; border-radius:10px;" onclick="location.reload()">EXIT</button>
        </div>
    </header>

    <div class="container">
        <div class="stage-wrapper">
            <div class="viewport" id="viewport-root" onclick="audioUnlock()">
                <div class="stage-hud hud-tl">
                    <div class="badge"><div class="dot"></div> <span id="display-view-name">OBSERVING: STANDBY</span></div>
                </div>
                
                <canvas id="whiteboard"></canvas>
                <video id="main-display" autoplay playsinline></video>

                <div id="wb-toolbar">
                    <div class="tool-icon selected" onclick="setTool('pen', this)"><i class="fas fa-pen-nib"></i></div>
                    <div class="tool-icon" onclick="setTool('eraser', this)"><i class="fas fa-eraser"></i></div>
                    <hr style="border:none; border-top:1px solid var(--border); margin:5px 0;">
                    <div class="color-dot selected" onclick="setCol('#00e5ff', this)" style="background:#00e5ff"></div>
                    <div class="color-dot" onclick="setCol('#ff1744', this)" style="background:#ff1744"></div>
                    <div class="color-dot" onclick="setCol('#00e676', this)" style="background:#00e676"></div>
                    <div class="tool-icon" onclick="clearClassBoard()" style="color:var(--danger); margin-top:5px;"><i class="fas fa-trash"></i></div>
                </div>
            </div>

            <div class="video-shelf" id="monitor-shelf">
                <!-- Self Card -->
                <div class="card-node" id="card-local">
                    <video id="video-local" autoplay playsinline muted></video>
                    <div class="tag">MY CAMERA</div>
                    <div class="vol-indicator" id="vol-local"></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="tabs">
                <button class="tab-trigger active" onclick="setPane('ctrl', this)"><i class="fas fa-terminal"></i></button>
                <button class="tab-trigger" onclick="setPane('chat', this)"><i class="fas fa-comments"></i></button>
                <button class="tab-trigger" onclick="setPane('users', this)"><i class="fas fa-users"></i></button>
            </div>

            <div class="pane" id="pane-ctrl">
                <div id="teacher-only" class="hidden">
                    <div class="pane-label">Master Commands</div>
                    <div class="grid-3">
                        <button class="btn-ctrl" onclick="masterMic(false)"><i class="fas fa-microphone-slash"></i><span>Mute All</span></button>
                        <button class="btn-ctrl" onclick="masterMic(true)"><i class="fas fa-microphone"></i><span>Open All</span></button>
                        <button class="btn-ctrl" id="btn-wb" onclick="toggleWB()"><i class="fas fa-chalkboard"></i><span>Board</span></button>
                        <button class="btn-ctrl" id="btn-rec" onclick="toggleRec()"><i class="fas fa-video"></i><span>Record</span></button>
                        <button class="btn-ctrl" onclick="broadcastSpotlight(peer.id)"><i class="fas fa-star"></i><span>Focus Me</span></button>
                        <button class="btn-ctrl" onclick="sendEmoji('👏')"><i class="fas fa-clapping-hands"></i><span>Reward</span></button>
                    </div>
                </div>

                <div class="pane-label">Device Control</div>
                <div class="grid-3">
                    <button class="btn-ctrl" id="mic-toggle" onclick="toggleMic()"><i class="fas fa-microphone"></i><span>Mic</span></button>
                    <button class="btn-ctrl" id="cam-toggle" onclick="toggleCam()"><i class="fas fa-video"></i><span>Cam</span></button>
                    <button class="btn-ctrl" id="screen-toggle" onclick="toggleScreenShare()"><i class="fas fa-desktop"></i><span>Share</span></button>
                </div>

                <div style="margin-top:20px; padding:20px; background:rgba(0,0,0,0.3); border-radius:20px; border:1px solid var(--border);">
                    <div class="pane-label" style="margin-bottom:10px;">Reactions</div>
                    <div style="display:flex; justify-content:space-between; font-size:30px;">
                        <span style="cursor:pointer;" onclick="sendEmoji('👏')">👏</span>
                        <span style="cursor:pointer;" onclick="sendEmoji('🔥')">🔥</span>
                        <span style="cursor:pointer;" onclick="sendEmoji('👍')">👍</span>
                        <span style="cursor:pointer;" onclick="sendEmoji('💡')">💡</span>
                    </div>
                </div>
            </div>

            <div class="pane hidden" id="pane-chat">
                <div id="chat-window"></div>
                <div class="chat-input">
                    <input type="text" id="chat-in" placeholder="Secure chat..." onkeypress="if(event.key==='Enter')dispatchChat()">
                    <button class="btn-ctrl" style="width:60px; background:var(--accent); color:#000;" onclick="dispatchChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="pane hidden" id="pane-users">
                <div class="pane-label">Live Directory</div>
                <div id="roster-view"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-box"></div>
<div id="fx-layer" style="position:fixed; inset:0; pointer-events:none; z-index:99999;"></div>

<script>
/**
 * EDU-ULTIMATE v36.0 Logic Engine
 * Privacy Focus & Dynamic Spotlighting
 */
let peer, localStream, role, myName, roomID;
let conns = {}, streams = {}, pData = {};
let micOn = false, camOn = true, wbOn = false, screenActive = false, currentSpotlight = null;
let canvas, ctx, painting = false, tool = 'pen', color = '#00e5ff', lastPos = {x:0, y:0};
let audioCtx, recorder, chunks = [];

async function initNexus(m) {
    role = m;
    myName = document.getElementById('join-name').value || (role==='teacher'?'Teacher':'Student');
    roomID = document.getElementById('join-room').value;
    if(!roomID || roomID.length < 4) return alert("System requires a 4-digit ID.");

    // Initial Media
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    localStream.getAudioTracks().forEach(t => t.enabled = false); // Initial Silent
    
    const id = (role === 'teacher') ? `PRV-HOST-${roomID}` : `PRV-NODE-${roomID}-${Math.random().toString(36).substr(2,7)}`;
    peer = new Peer(id);

    peer.on('open', id => {
        document.getElementById('launcher').classList.add('hidden');
        document.getElementById('app-shell').classList.add('active');
        document.getElementById('room-display').innerText = `ID: ${roomID}`;
        document.getElementById('video-local').srcObject = localStream;

        initVolume(localStream, 'vol-local');
        tickClock();

        if(role === 'teacher'){
            document.getElementById('teacher-only').classList.remove('hidden');
            initCanvas();
            broadcastSpotlight(peer.id);
        } else {
            connectToHost();
        }
        pushToast("CONNECTED", `Welcome, ${myName}`);
    });

    peer.on('call', call => {
        // SECURITY FILTER: Students only accept calls from Host or designated Spotlight
        if(role === 'student'){
            const isHost = call.peer.includes('HOST');
            const isSpotlight = (call.peer === currentSpotlight);
            if(!isHost && !isSpotlight) return; // Silent Drop
        }

        call.answer(localStream);
        call.on('stream', stream => {
            streams[call.peer] = stream;
            upsertNode(call.peer, stream);
            if(call.peer.includes('HOST')) applyView(call.peer);
        });
    });

    peer.on('connection', c => setupChannel(c));
}

function connectToHost() {
    const hostID = `PRV-HOST-${roomID}`;
    const c = peer.connect(hostID);
    setupChannel(c);
    c.on('open', () => {
        c.send({type:'prv-join', name:myName});
        peer.call(hostID, localStream);
    });
}

function setupChannel(c) {
    conns[c.peer] = c;
    c.on('data', data => {
        switch(data.type) {
            case 'prv-join':
                pData[c.peer] = {name:data.name};
                if(role === 'teacher') {
                    broadcastDirectory();
                    peer.call(c.peer, localStream);
                }
                updateRoster();
                break;
            case 'prv-dir':
                data.list.forEach(u => {
                    if(u.id !== peer.id && !conns[u.id]){
                        pData[u.id] = {name:u.name};
                        const nc = peer.connect(u.id);
                        setupChannel(nc);
                        nc.on('open', () => {
                            nc.send({type:'prv-hello', name:myName});
                            // NOTE: Students DON'T call each other here. (Privacy)
                        });
                    }
                });
                updateRoster();
                break;
            case 'prv-hello':
                pData[c.peer] = {name:data.name};
                updateRoster();
                break;
            case 'prv-chat': renderChat(data.name, data.msg, false); break;
            case 'prv-draw': renderDraw(data); break;
            case 'prv-clear': ctx.clearRect(0,0,canvas.width, canvas.height); break;
            case 'prv-mic-cmd': forceMic(data.val); break;
            case 'prv-spotlight': executeSpotlight(data.id); break;
            case 'prv-emoji': spawnEmoji(data.emoji); break;
            case 'prv-force-screen': handleScreenCommand(); break;
        }
    });
    c.on('close', () => {
        delete conns[c.peer];
        const node = document.getElementById(`node-${c.peer}`);
        if(node) node.remove();
        updateRoster();
    });
}

/**
 * Spotlight Broadcasting Logic
 * TEACHER ONLY: Commands someone to broadcast to all
 */
function broadcastSpotlight(pid) {
    if(role !== 'teacher') return;
    executeSpotlight(pid);
    dispatch({type:'prv-spotlight', id:pid});
    pushToast("SPOTLIGHT", "Syncing all screens to focal node.");
}

function executeSpotlight(id) {
    currentSpotlight = id;
    applyView(id);

    // If I am the spotlighted student, I must call everyone else
    if(id === peer.id && role === 'student'){
        Object.keys(conns).forEach(cid => {
            if(!cid.includes('HOST')) peer.call(cid, localStream);
        });
    }
}

function applyView(id) {
    const mainVid = document.getElementById('main-display');
    const stream = (id === peer.id) ? localStream : streams[id];
    if(stream) {
        mainVid.srcObject = stream;
        mainVid.muted = (id === peer.id);
        const name = id.includes('HOST') ? "TEACHER" : (pData[id]?.name || "FOCUSED NODE");
        document.getElementById('display-view-name').innerText = `OBSERVING: ${name}`;
        mainVid.play().catch(()=>{});
    }
}

/** 
 * Teacher Control: Force Student Screen Share
 */
function forceStudentScreen(target) {
    if(role !== 'teacher') return;
    const c = conns[target];
    if(c) c.send({type:'prv-force-screen'});
}

async function handleScreenCommand() {
    try {
        const ss = await navigator.mediaDevices.getDisplayMedia({video:true});
        const st = ss.getVideoTracks()[0];
        const ct = localStream.getVideoTracks()[0];
        localStream.removeTrack(ct);
        localStream.addTrack(st);
        
        Object.values(peer.connections).forEach(pcs => {
            pcs.forEach(pc => {
                if(pc.type === 'media') {
                    const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(snd) snd.replaceTrack(st);
                }
            });
        });
        document.getElementById('video-local').srcObject = localStream;
        screenActive = true;
        document.getElementById('screen-toggle').classList.add('active');
        st.onended = () => stopScreenShare();
        pushToast("SHARING", "Screen broadcasting active.");
    } catch(e){}
}

async function stopScreenShare() {
    const st = localStream.getVideoTracks()[0];
    const ncam = await navigator.mediaDevices.getUserMedia({video:true});
    const nt = ncam.getVideoTracks()[0];
    localStream.removeTrack(st); localStream.addTrack(nt); st.stop();
    Object.values(peer.connections).forEach(pcs => {
        pcs.forEach(pc => {
            if(pc.type === 'media') {
                const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if(snd) snd.replaceTrack(nt);
            }
        });
    });
    document.getElementById('video-local').srcObject = localStream;
    screenActive = false;
    document.getElementById('screen-toggle').classList.remove('active');
}

/** Board Components **/
function initCanvas() {
    canvas = document.getElementById('whiteboard');
    ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.onresize = resize;
    const getPos = e => ({ x: e.offsetX / canvas.width, y: e.offsetY / canvas.height });
    canvas.onmousedown = e => { if(!wbOn) return; painting = true; lastPos = getPos(e); };
    canvas.onmousemove = e => {
        if(!painting) return;
        const cur = getPos(e);
        const d = { type:'prv-draw', t:tool, f:lastPos, to:cur, c:color };
        renderDraw(d); dispatch(d); lastPos = cur;
    };
    canvas.onmouseup = () => painting = false;
}

function renderDraw(d) {
    ctx.strokeStyle = d.c; ctx.lineWidth = d.t==='eraser'? 45 : 4; ctx.lineCap = 'round';
    ctx.globalCompositeOperation = d.t==='eraser' ? 'destination-out' : 'source-over';
    const w = canvas.width, h = canvas.height;
    ctx.beginPath(); ctx.moveTo(d.f.x * w, d.f.y * h); ctx.lineTo(d.to.x * w, d.to.y * h); ctx.stroke();
}

function toggleWB() {
    wbOn = !wbOn;
    document.getElementById('whiteboard').classList.toggle('active', wbOn);
    document.getElementById('wb-toolbar').style.display = wbOn ? 'flex' : 'none';
    document.getElementById('btn-wb').classList.toggle('active', wbOn);
}

function clearClassBoard() { ctx.clearRect(0,0,canvas.width, canvas.height); dispatch({type:'prv-clear'}); }

/** UI & Monitoring **/
function upsertNode(id, stream) {
    // PRIVACY: Students only see Host or Self
    if(role === 'student' && !id.includes('HOST')) return;

    if(document.getElementById(`node-${id}`)) return;
    const shelf = document.getElementById('monitor-shelf');
    const card = document.createElement('div');
    card.className = 'card-node'; card.id = `node-${id}`;
    card.onclick = () => { if(role === 'teacher') broadcastSpotlight(id); };
    card.innerHTML = `<video id="vid-${id}" autoplay playsinline></video>
                     <div class="tag">${id.includes('HOST')?'TEACHER':(pData[id]?.name || 'PARTICIPANT')}</div>
                     <div class="vol-indicator" id="met-${id}"></div>`;
    shelf.appendChild(card);
    document.getElementById(`vid-${id}`).srcObject = stream;
    initVolume(stream, `met-${id}`);
}

function updateRoster() {
    const v = document.getElementById('roster-view');
    v.innerHTML = "";
    Object.keys(conns).forEach(id => {
        // PRIVACY: Students only see Host
        if(role === 'student' && !id.includes('HOST')) return;

        const row = document.createElement('div');
        row.className = 'p-row';
        const btns = (role === 'teacher') ? 
            `<div class="p-actions">
                <button class="btn-action btn-focus" onclick="broadcastSpotlight('${id}')">Focus</button>
                <button class="btn-action btn-req" onclick="forceStudentScreen('${id}')">Get Screen</button>
            </div>` : "";
        row.innerHTML = `<div class="p-name">${pData[id]?.name || 'User'}</div>${btns}`;
        v.appendChild(row);
    });
}

function initVolume(s, bid) {
    try {
        if(!audioCtx) audioCtx = new AudioContext();
        const src = audioCtx.createMediaStreamSource(s);
        const alz = audioCtx.createAnalyser(); alz.fftSize = 256;
        src.connect(alz);
        const buf = new Uint8Array(alz.frequencyBinCount);
        const loop = () => {
            const el = document.getElementById(bid);
            if(!el) return;
            alz.getByteFrequencyData(buf);
            const a = buf.reduce((p,c)=>p+c)/buf.length;
            el.style.width = Math.min(100, a*2.5) + "%";
            requestAnimationFrame(loop);
        };
        loop();
    } catch(e){}
}

function pushToast(t, m) {
    const box = document.getElementById('toast-box');
    const el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = `<span style="color:var(--accent); font-weight:900;">[ ${t} ]</span><br>${m}`;
    box.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

function dispatch(data) {
    Object.values(conns).forEach(c => { if(c.open) c.send(data); });
}

function broadcastDirectory() {
    const list = Object.keys(pData).map(id => ({id, name:pData[id].name}));
    list.push({id:peer.id, name:myName});
    dispatch({type:'prv-dir', list});
}

function dispatchChat() {
    const i = document.getElementById('chat-in'); if(!i.value) return;
    renderChat(myName, i.value, true);
    dispatch({type:'prv-chat', name:myName, msg:i.value});
    i.value = "";
}

function renderChat(name, msg, own) {
    const win = document.getElementById('chat-window');
    const b = document.createElement('div');
    b.className = `chat-bubble ${own?'own':''}`;
    b.innerHTML = `<b>${name}</b>${msg}`;
    win.appendChild(b); win.scrollTop = win.scrollHeight;
}

function toggleMic() {
    micOn = !micOn; forceMic(micOn);
    document.getElementById('mic-toggle').classList.toggle('active', micOn);
}
function forceMic(v) {
    localStream.getAudioTracks().forEach(t => t.enabled = v);
    micOn = v;
}
function toggleCam() {
    camOn = !camOn; localStream.getVideoTracks().forEach(t => t.enabled = camOn);
    document.getElementById('cam-toggle').classList.toggle('active', camOn);
}

function tickClock() {
    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = d.toTimeString().split(' ')[0];
    }, 1000);
}

function setPane(p, b) {
    document.querySelectorAll('.pane').forEach(el => el.classList.add('hidden'));
    document.getElementById(`pane-${p}`).classList.remove('hidden');
    document.querySelectorAll('.tab-trigger').forEach(el => el.classList.remove('active'));
    b.classList.add('active');
}

function audioUnlock() { if(audioCtx) audioCtx.resume(); document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{})); }
function setTool(t, el) { tool = t; document.querySelectorAll('.tool-icon').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }
function setCol(c, el) { color = c; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }

function sendEmoji(emoji) {
    spawnEmoji(emoji); dispatch({type:'prv-emoji', emoji});
}
function spawnEmoji(e) {
    const r = document.getElementById('fx-layer');
    const el = document.createElement('div');
    el.innerText = e;
    el.style.position = 'absolute'; el.style.left = Math.random()*85+5+'vw'; el.style.bottom = '-100px';
    el.style.fontSize = '50px'; el.style.transition = '4s';
    r.appendChild(el);
    setTimeout(() => { el.style.transform = 'translateY(-120vh) rotate(720deg)'; el.style.opacity = '0'; }, 100);
    setTimeout(() => el.remove(), 4100);
}

function masterMic(v) { dispatch({type:'prv-mic-cmd', val:v}); forceMic(v); }

function toggleRec() {
    if(!recorder || recorder.state === 'inactive') {
        const s = document.getElementById('main-display').srcObject; if(!s) return;
        recorder = new MediaRecorder(s);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const b = new Blob(chunks, {type:'video/webm'});
            const u = URL.createObjectURL(b);
            const a = document.createElement('a'); a.href = u; a.download = `LECTURE-${Date.now()}.webm`; a.click();
        };
        recorder.start();
        document.getElementById('rec-status').classList.remove('hidden');
        document.getElementById('btn-rec').classList.add('active');
    } else { recorder.stop(); document.getElementById('rec-status').classList.add('hidden'); document.getElementById('btn-rec').classList.remove('active'); }
}

async function toggleScreenShare() {
    if(!screenActive) await handleScreenCommand();
    else await stopScreenShare();
}
</script>
