<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v30.0 (Grand Master)</title>
    
    <!-- 外部ライブラリの読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CSS Variables & Reset
           ========================================= */
        :root {
            --accent: #00fbff;
            --accent-soft: rgba(0, 251, 255, 0.1);
            --bg: #050505;
            --panel: #111111;
            --panel-light: #1c1c1c;
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #2a2a2a;
            --sidebar-w: 340px;
            --header-h: 65px;
            --radius: 16px;
        }

        * { box-sizing: border-box; outline: none; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           2. Setup Screen (バグ防止用)
           ========================================= */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }
        .setup-card {
            background: var(--panel);
            width: 420px;
            padding: 50px;
            border-radius: 30px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .setup-card h1 { color: var(--accent); margin: 0 0 10px 0; font-size: 28px; }
        .setup-card p { color: var(--text-dim); margin-bottom: 30px; font-size: 14px; }
        .setup-field { position: relative; margin-bottom: 20px; }
        .setup-field i { position: absolute; left: 15px; top: 18px; color: var(--accent); }
        .setup-card input, .setup-card select {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }
        .setup-card input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-soft); }

        /* =========================================
           3. Main UI Layout
           ========================================= */
        #main-ui { display: none; height: 100vh; flex-direction: column; }
        #main-ui.active { display: flex; }

        header {
            height: var(--header-h);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; align-items: center; gap: 20px; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            min-width: 0;
        }
        .broadcast-view {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #view-label {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.8); padding: 8px 18px;
            border-radius: 10px; border: 1px solid var(--accent);
            font-size: 12px; font-weight: bold; z-index: 100;
            letter-spacing: 0.5px; backdrop-filter: blur(10px);
        }
        #drawing-canvas { position: absolute; inset: 0; z-index: 50; pointer-events: none; }

        /* Monitor Grid (Teacher Only) */
        .monitor-grid {
            height: 200px;
            background: #080808;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            padding: 15px;
            overflow-x: auto;
            flex-shrink: 0;
            align-items: center;
        }
        .student-mode .monitor-grid { display: none !important; }

        /* =========================================
           4. Component Design
           ========================================= */
        .card {
            width: 200px; height: 160px; flex-shrink: 0;
            background: var(--panel); border-radius: var(--radius);
            position: relative; border: 1px solid var(--border);
            overflow: hidden; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card video { width: 100%; height: 110px; object-fit: cover; background: #000; }
        .card-info { padding: 8px; text-align: center; font-size: 11px; font-weight: 600; }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .side-panel {
            background: var(--panel-light);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--border);
        }
        .panel-title {
            font-size: 11px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Buttons */
        button {
            cursor: pointer; border: none; font-weight: 700;
            border-radius: 12px; padding: 12px; transition: 0.2s;
            font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-blue:hover { background: #00a8ff; box-shadow: 0 0 15px rgba(0, 168, 255, 0.4); }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #000; width: 100%; }
        .btn-mini { padding: 5px 10px; font-size: 10px; border-radius: 6px; }

        /* Chat & Lists */
        #chat-msgs {
            height: 250px; background: #000; border-radius: 12px;
            padding: 12px; overflow-y: auto; border: 1px solid var(--border);
            font-size: 13px; line-height: 1.5; margin-bottom: 10px;
        }
        .chat-row { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .chat-sys { color: var(--warning); font-style: italic; font-size: 11px; }

        .user-row {
            background: #1a1a1a; padding: 12px 15px; border-radius: 12px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; transition: 0.2s;
        }
        .user-row:hover { background: #252525; border-left: 4px solid var(--accent); }
        .user-row.nominee { border: 1px solid var(--accent); background: var(--accent-soft); }

        /* Animation & Overlay */
        .reaction-layer { position: absolute; inset: 0; pointer-events: none; z-index: 200; }
        .floating-emoji {
            position: absolute; bottom: 0; animation: floatUp 3s forwards ease-out;
            text-align: center; pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-400px) scale(1); opacity: 0; }
        }

        .vol-container { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .vol-bar { height: 100%; width: 0%; background: var(--success); transition: 0.1s; }

        .poll-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 200000;
        }
        .poll-card {
            background: var(--panel); padding: 40px; border-radius: 25px;
            border: 2px solid var(--accent); width: 360px; text-align: center;
        }

        .hand-notice {
            position: absolute; top: 10px; right: 10px; color: var(--warning);
            font-size: 24px; animation: pulse 1s infinite; display: none;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .hidden { display: none !important; }
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 900; margin-left: 8px; }

        /* Speech Captions */
        #caption-box {
            position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: center;
            pointer-events: none; z-index: 1000;
        }
        #caption-text {
            background: rgba(0,0,0,0.7); color: yellow; font-size: 20px; font-weight: bold;
            padding: 5px 20px; border-radius: 10px; display: none;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 280px; }
        }
    </style>
</head>

<div id="main-ui">

<!-- =========================================
     5. JavaScript Logic (大規模ロジック)
     ========================================= -->
<script>
    /* 
       Global State Management
    */
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let recorder, recordedChunks = [];
    let currentGlobalViewId = "";
    let isHandRaised = false;
    let wbActive = false, wbCtx, drawing = false;
    let audioContext, analyser, dataArray;
    let recognition; // 字幕用
    let pollVotes = {};

    /* 
       Media Handling
    */
    async function getStream(mode) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        try {
            // 音声取得（マイク）
            const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
            let video;
            
            if (mode === 'camera') {
                video = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } 
                });
            } else {
                // 画面共有取得
                video = await navigator.mediaDevices.getDisplayMedia({ video: true });
                // 共有停止時のイベント
                video.getVideoTracks()[0].onended = () => {
                    document.getElementById('mode-select').value = 'camera';
                    updateMedia();
                };
            }

            // ストリームの合成
            localStream = new MediaStream([
                ...video.getVideoTracks(),
                ...(audio ? audio.getAudioTracks() : [])
            ]);

            document.getElementById('my-preview').srcObject = localStream;
            startVolumeMeter(localStream, 'my-vol-bar');
            return localStream;
        } catch (e) {
            console.error(e);
            alert("メディアアクセスが拒否されました。設定を確認してください。");
            return null;
        }
    }

    /* 
       Session Management
    */
    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value.trim() || "ゲスト";
        roomID = document.getElementById('room-id').value.trim();
        
        if (!roomID) return alert("部屋IDを入力してください");
        if (roomID.length < 3) return alert("部屋IDは4桁を推奨します");

        // UI切り替え
        const stream = await getStream(document.getElementById('start-mode').value);
        if (!stream) return;

        // PeerJS初期化
        // 先生: 固定ID, 生徒: ランダムID
        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(peerID, {
            debug: 1,
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (id) => {
            console.log("Connected to Signaling Server. ID:", id);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-ui').classList.add('active');
            document.getElementById('role-label').innerText = role.toUpperCase();
            document.getElementById('room-display').innerText = "ROOM: " + roomID;
            document.getElementById('my-name-label').innerText = myName;

            if (role === 'teacher') {
                initTeacherUI();
            } else {
                initStudentUI();
            }

            initTimer();
            if ('webkitSpeechRecognition' in window) initSpeech();
        });

        // 通話の着信処理
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => {
                remoteStreams[call.peer] = s;
                handleIncomingStream(call.peer, s);
                // 先生から「これを映せ」と言われていた場合の即時適用
                if (currentGlobalViewId === call.peer) applyView(call.peer, true);
            });
        });

        // データ接続の着信処理
        peer.on('connection', conn => {
            setupDataConnection(conn);
        });

        peer.on('error', err => {
            console.error("Peer Error:", err);
            if (err.type === 'peer-unavailable' && myRole === 'student') {
                addChat("System", "先生が見つかりません。再入室を試みてください。");
            }
        });
    }

    function initTeacherUI() {
        document.getElementById('teacher-panel').classList.remove('hidden');
        new QRCode(document.getElementById("qrcode"), { 
            text: window.location.href.split('?')[0] + "?id=" + roomID, 
            width: 80, height: 80, colorDark: "#000", colorLight: "#fff"
        });
        setGlobalView('teacher');
        initWhiteboard();
    }

    function initStudentUI() {
        document.getElementById('student-panel').classList.remove('hidden');
        document.body.classList.add('student-mode');
        connectToHost();
    }

    function connectToHost() {
        const hostID = `T-ROOM-${roomID}`;
        const conn = peer.connect(hostID);
        setupDataConnection(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(hostID, localStream);
            addChat("System", "先生に接続しました。");
        });
    }

    /* 
       Data Channel & Communication
    */
    function setupDataConnection(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => handleIncomingData(conn.peer, data));
        conn.on('close', () => removePeer(conn.peer));
    }

    function handleIncomingData(id, data) {
        switch (data.type) {
            case 'join':
                students[id] = { name: data.name, hand: false, nominee: false };
                if (myRole === 'teacher') {
                    broadcastUserList();
                    // 新規参加者に現在のメイン画面を同期
                    connections[id].send({ type: 'sync_view', targetId: currentGlobalViewId });
                }
                addChat("入室", `${data.name}さんが参加しました`);
                updateUserListUI();
                break;

            case 'list':
                data.list.forEach(u => {
                    if (u.id !== peer.id && !connections[u.id]) {
                        students[u.id] = { name: u.name, hand: u.hand };
                        const c = peer.connect(u.id);
                        setupDataConnection(c);
                        c.on('open', () => {
                            c.send({ type: 'hello', name: myName, hand: isHandRaised });
                            peer.call(u.id, localStream);
                        });
                    }
                });
                updateUserListUI();
                break;

            case 'hello':
                students[id] = { name: data.name, hand: data.hand };
                updateUserListUI();
                break;

            case 'chat': 
                addChat(data.name, data.msg); 
                break;

            case 'reaction': 
                showReactionEffect(data.emoji, data.name); 
                break;

            case 'sync_view': 
                applyView(data.targetId, true); 
                break;

            case 'hand': 
                if (students[id]) students[id].hand = data.raised;
                updateUserListUI();
                if (data.raised && myRole === 'teacher') notifyHand(id);
                break;

            case 'poll':
                showPollPopup(data);
                break;

            case 'poll_vote':
                if (myRole === 'teacher') handlePollVote(id, data);
                break;

            case 'wb_draw': 
                drawOnCanvasRemote(data); 
                break;

            case 'wb_clear': 
                clearCanvas(true); 
                break;

            case 'EXIT_NOW': 
                removePeer(id); 
                break;
        }
    }

    /* 
       View Director (指名・切り替え)
    */
    function applyView(id, forceReset = false) {
        if (!id) return;
        currentGlobalViewId = id;
        const mv = document.getElementById('main-video');
        const label = document.getElementById('view-label');
        
        // ソースの特定
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        
        if (stream) {
            if (forceReset) mv.srcObject = null;
            setTimeout(() => {
                mv.srcObject = stream;
                const targetName = (id.startsWith("T-ROOM-")) ? "先生" : (students[id]?.name || "発表者");
                label.innerHTML = `<i class="fas fa-video"></i> ${targetName} の画面を表示中`;
                mv.play().catch(() => {
                    label.innerHTML = `<i class="fas fa-exclamation-triangle"></i> クリックして再生を開始してください`;
                });
            }, forceReset ? 300 : 0);
        } else {
            label.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 映像ストリームを待機中...`;
        }
    }

    function setGlobalView(targetId) {
        const id = (targetId === 'teacher') ? peer.id : targetId;
        currentGlobalViewId = id;
        // 全員に同期コマンドをブロードキャスト
        Object.values(connections).forEach(c => {
            if (c.open) c.send({ type: 'sync_view', targetId: id });
        });
        applyView(id, true);
    }

    function handleIncomingStream(id, stream) {
        const isTeacher = id.startsWith("T-ROOM-");

        // 先生側：全生徒のカードを表示
        if (myRole === 'teacher' && !isTeacher) {
            if (document.getElementById(`card-${id}`)) return;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${id}`;
            card.innerHTML = `
                <div class="hand-notice" id="hand-notice-${id}"><i class="fas fa-hand-paper"></i></div>
                <video id="vid-${id}" autoplay playsinline></video>
                <div class="card-info">
                    <div id="card-name-${id}">${students[id]?.name || '生徒'}</div>
                    <div class="vol-container"><div id="vol-${id}" class="vol-bar"></div></div>
                    <div style="display:flex; gap:3px; margin-top:5px;">
                        <button class="btn-mini btn-blue" onclick="setGlobalView('${id}')" style="flex:1;">指名共有</button>
                        <button class="btn-mini btn-warning" onclick="applyView('${id}', true)" title="自分だけ見る"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            startVolumeMeter(stream, `vol-${id}`);
        }

        // 生徒側：先生のストリームが来たら自動表示
        if (isTeacher && (currentGlobalViewId === "" || currentGlobalViewId === id)) {
            applyView(id);
        }
    }

    /* 
       Interactivity (Mic, Cam, Hand, Poll)
    */
    function toggleMic() {
        const track = localStream.getAudioTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            const btn = document.getElementById('mic-btn');
            btn.className = track.enabled ? "btn-green" : "btn-red";
            btn.innerHTML = track.enabled ? `<i class="fas fa-microphone"></i>` : `<i class="fas fa-microphone-slash"></i>`;
        }
    }

    function toggleCam() {
        const track = localStream.getVideoTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            const btn = document.getElementById('cam-btn');
            btn.className = track.enabled ? "btn-green" : "btn-red";
            btn.innerHTML = track.enabled ? `<i class="fas fa-video"></i>` : `<i class="fas fa-video-slash"></i>`;
        }
    }

    function updateMedia() {
        const mode = document.getElementById('mode-select').value;
        getStream(mode).then(newStream => {
            if (!newStream) return;
            // 全コネクションのトラックを差し替え
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => {
                    if (c.peerConnection) {
                        const senders = c.peerConnection.getSenders();
                        const vSender = senders.find(s => s.track && s.track.kind === 'video');
                        const aSender = senders.find(s => s.track && s.track.kind === 'audio');
                        if (vSender) vSender.replaceTrack(localStream.getVideoTracks()[0]);
                        if (aSender) aSender.replaceTrack(localStream.getAudioTracks()[0]);
                    }
                });
            });
            // 自分が配信ターゲット（先生など）なら全員の表示を強制更新
            if (currentGlobalViewId === peer.id || (myRole === 'teacher' && currentGlobalViewId.startsWith("T-ROOM-"))) {
                setGlobalView('teacher');
            }
        });
    }

    function applyFilter() {
        const filter = document.getElementById('filter-select').value;
        document.getElementById('my-preview').style.filter = filter;
        // 送信映像にも適用（Canvas処理が必要なため簡易プレビューのみ）
    }

    function toggleHand() {
        isHandRaised = !isHandRaised;
        const btn = document.getElementById('hand-btn');
        btn.innerHTML = isHandRaised ? `<i class="fas fa-times"></i> 手を下ろす` : `<i class="fas fa-hand-paper"></i> 挙手して先生に質問`;
        btn.classList.toggle('btn-red', isHandRaised);
        Object.values(connections).forEach(c => {
            if (c.open) c.send({ type: 'hand', raised: isHandRaised });
        });
    }

    function notifyHand(id) {
        const name = students[id]?.name || "生徒";
        addChat("挙手", `${name}さんが挙手しています ✋`);
        // サウンド通知
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    /* 
       Polling System
    */
    function createPoll() {
        const q = prompt("アンケートの質問を入力:");
        if (!q) return;
        const oInput = prompt("選択肢をカンマ区切りで入力 (例: はい, いいえ, どちらでもない):");
        if (!oInput) return;
        const options = oInput.split(',').map(s => s.trim());
        
        const pollData = { type: 'poll', q: q, options: options };
        pollVotes = {}; // リセット
        Object.values(connections).forEach(c => { if(c.open) c.send(pollData); });
        addChat("System", "アンケートを開始しました。");
    }

    function showPollPopup(data) {
        const overlay = document.getElementById('poll-overlay');
        document.getElementById('poll-question').innerText = data.q;
        const container = document.getElementById('poll-options');
        container.innerHTML = "";
        
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "poll-opt-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                Object.values(connections).forEach(c => {
                    if (c.open) c.send({ type: 'poll_vote', choice: opt, name: myName });
                });
                overlay.style.display = 'none';
                addChat("Poll", `「${opt}」と回答しました。`);
            };
            container.appendChild(btn);
        });
        overlay.style.display = 'flex';
    }

    function handlePollVote(id, data) {
        addChat("アンケート結果", `${data.name}さんが「${data.choice}」に投票しました。`);
    }

    /* 
       Whiteboard Logic
    */
    function initWhiteboard() {
        const canvas = document.getElementById('drawing-canvas');
        wbCtx = canvas.getContext('2d');
        const box = document.getElementById('broadcast-area');
        
        const resize = () => {
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        box.addEventListener('mousedown', startDraw);
        box.addEventListener('mousemove', drawingMove);
        box.addEventListener('mouseup', endDraw);
        box.addEventListener('touchstart', (e) => startDraw(e.touches[0]));
        box.addEventListener('touchmove', (e) => drawingMove(e.touches[0]));
        box.addEventListener('touchend', endDraw);
    }

    function toggleWhiteboard() {
        wbActive = !wbActive;
        const canvas = document.getElementById('drawing-canvas');
        canvas.style.pointerEvents = wbActive ? 'auto' : 'none';
        addChat("System", "板書モード: " + (wbActive ? "ON (画面上をドラッグして描画)" : "OFF"));
    }

    function startDraw(e) { if (!wbActive || myRole !== 'teacher') return; drawing = true; draw(e); }
    function drawingMove(e) { if (drawing) draw(e); }
    function endDraw() { drawing = false; wbCtx.beginPath(); }

    function draw(e) {
        const rect = document.getElementById('broadcast-area').getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        const drawData = { type: 'wb_draw', x, y };
        drawOnCanvasRemote(drawData);
        Object.values(connections).forEach(c => { if(c.open) c.send(drawData); });
    }

    function drawOnCanvasRemote(data) {
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const realX = data.x * canvas.width;
        const realY = data.y * canvas.height;

        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#ff4757'; // 先生のペンは赤
        
        ctx.lineTo(realX, realY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(realX, realY);
    }

    function clearCanvas(remote = false) {
        const canvas = document.getElementById('drawing-canvas');
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        if (!remote && myRole === 'teacher') {
            Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'wb_clear' }); });
        }
    }

    /* 
       User List & Private Talk (1対1)
    */
    function updateUserListUI() {
        const container = document.getElementById('user-list-items');
        container.innerHTML = "";
        
        // 先生をリストの先頭に追加
        const hostID = `T-ROOM-${roomID}`;
        if (myRole === 'student') {
            const row = document.createElement('div');
            row.className = 'user-row nominee';
            row.innerHTML = `<span><i class="fas fa-star" style="color:var(--warning)"></i> 先生</span> <i class="fas fa-chevron-right"></i>`;
            row.onclick = () => applyView(hostID, true);
            container.appendChild(row);
        }

        // 生徒たちのリスト
        Object.keys(students).forEach(id => {
            if (id === peer.id) return;
            const row = document.createElement('div');
            row.className = 'user-row';
            const hand = students[id].hand ? `<span style="color:var(--warning)">✋</span> ` : '';
            row.innerHTML = `<span>${hand}${students[id].name}</span> <i class="fas fa-comment-dots"></i>`;
            row.onclick = () => applyView(id, true); // 個人ビデオ会話
            container.appendChild(row);

            // 監視グリッドの通知更新
            const cardHand = document.getElementById(`hand-notice-${id}`);
            if (cardHand) cardHand.style.display = students[id].hand ? 'block' : 'none';
        });
    }

    function broadcastUserList() {
        const list = Object.keys(students).map(id => ({ 
            id, name: students[id].name, hand: students[id].hand 
        }));
        list.push({ id: peer.id, name: myName, hand: false });
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'list', list }); });
    }

    /* 
       Speech Recognition (字幕)
    */
    function initSpeech() {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ja-JP';

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            const cap = document.getElementById('caption-text');
            cap.innerText = transcript;
            cap.style.display = 'inline-block';
            setTimeout(() => { if(cap.innerText === transcript) cap.style.display = 'none'; }, 4000);
        };

        recognition.onerror = () => recognition.stop();
        recognition.onend = () => recognition.start();
        recognition.start();
    }

    /* 
       Chat & Reactions
    */
    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        if (!input.value.trim()) return;
        const msg = input.value;
        addChat("自分", msg);
        Object.values(connections).forEach(c => {
            if (c.open) c.send({ type: 'chat', name: myName, msg: msg });
        });
        input.value = "";
    }

    function addChat(name, msg) {
        const box = document.getElementById('chat-msgs');
        const div = document.createElement('div');
        div.className = 'chat-row';
        if (name === "System") div.className += " chat-sys";
        div.innerHTML = `<b style="color:var(--accent)">${name}:</b> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function sendReaction(emoji) {
        showReactionEffect(emoji, "自分");
        Object.values(connections).forEach(c => {
            if (c.open) c.send({ type: 'reaction', name: myName, emoji: emoji });
        });
    }

    function showReactionEffect(emoji, sender) {
        const layer = document.getElementById('reaction-layer');
        const div = document.createElement('div');
        div.className = 'floating-emoji';
        div.style.left = (Math.random() * 80 + 10) + "%";
        div.innerHTML = `<div style="font-size:40px;">${emoji}</div><div style="font-size:12px; background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:5px;">${sender}</div>`;
        layer.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    /* 
       Utilities (Volume, Timer, Recording)
    */
    function startVolumeMeter(stream, barId) {
        const at = stream.getAudioTracks()[0];
        if (!at) return;
        const ctx = new AudioContext();
        const src = ctx.createMediaStreamSource(new MediaStream([at]));
        const ans = ctx.createAnalyser();
        src.connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const update = () => {
            if (!document.getElementById(barId)) return ctx.close();
            ans.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById(barId).style.width = Math.min(100, avg * 4) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function initTimer() {
        let sec = 0;
        setInterval(() => {
            sec++;
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            document.getElementById('session-timer').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            const s = document.getElementById('main-video').srcObject;
            if (!s) return alert("録画対象の映像がありません。");
            recordedChunks = [];
            recorder = new MediaRecorder(s, { mimeType: 'video/webm;codecs=vp9' });
            recorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `EDU_REC_${Date.now()}.webm`; a.click();
            };
            recorder.start();
            document.getElementById('rec-btn').innerHTML = `<i class="fas fa-stop-circle"></i> 録画停止`;
            document.getElementById('rec-btn').classList.replace('btn-blue', 'btn-red');
        } else {
            recorder.stop();
            document.getElementById('rec-btn').innerHTML = `<i class="fas fa-record-vinyl"></i> 授業を録画`;
            document.getElementById('rec-btn').classList.replace('btn-red', 'btn-blue');
        }
    }

    function removePeer(id) {
        if (document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        if (currentGlobalViewId === id) {
            const hostID = `T-ROOM-${roomID}`;
            applyView(myRole === 'teacher' ? peer.id : hostID, true);
        }
        delete connections[id]; delete students[id]; delete remoteStreams[id];
        updateUserListUI();
        if (myRole === 'teacher') broadcastUserList();
    }

    function forcePlay() {
        document.querySelectorAll('video').forEach(v => v.play().catch(()=>{}));
    }

    /* 
       Lifecycle
    */
    window.addEventListener('beforeunload', () => {
        Object.values(connections).forEach(c => {
            if (c.open) c.send({ type: 'EXIT_NOW' });
        });
        if (peer) peer.destroy();
    });

    document.getElementById('chat-input').onkeydown = e => {
        if (e.key === 'Enter') sendChatMessage();
    };

</script>
