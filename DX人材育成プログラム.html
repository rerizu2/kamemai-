<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v27.0 - THE GOD EDITION</title>
    <!-- 外部ライブラリの読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #050505; --panel: #121212; --danger: #ff4757; 
            --success: #2ecc71; --warning: #f1c40f; --text: #f0f0f0; --border: #2a2a2a;
        }
        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; height: 100vh; 
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- ログイン・セットアップ --- */
        #setup-screen { 
            position: fixed; inset: 0; background: radial-gradient(circle at center, #222 0%, #000 100%); 
            display: flex; justify-content: center; align-items: center; z-index: 100000; 
        }
        .setup-box { 
            background: var(--panel); padding: 40px; border-radius: 30px; text-align: center; 
            width: 400px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        input, select { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); 
            background: #000; color: white; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 251, 255, 0.3); }

        /* --- メインUIレイアウト --- */
        #main-ui { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        #main-ui.active { display: flex; }

        header { 
            height: 65px; background: #0a0a0a; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; padding: 0 25px;
        }
        .badge { font-size: 11px; padding: 5px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* --- コンテンツエリア --- */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .stage-container { 
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center; 
            background: #000; overflow: hidden; border-bottom: 1px solid var(--border);
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #view-label { 
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); 
            padding: 8px 16px; border-radius: 10px; border: 1px solid var(--accent); 
            font-size: 13px; z-index: 30; backdrop-filter: blur(10px);
        }
        #drawing-canvas { position: absolute; inset: 0; z-index: 20; pointer-events: none; cursor: crosshair; }
        .reaction-layer { position: absolute; inset: 0; pointer-events: none; z-index: 40; }

        /* --- モニターグリッド --- */
        .monitor-grid { 
            height: 180px; display: flex; gap: 15px; padding: 15px; overflow-x: auto; 
            background: #080808; border-top: 1px solid var(--border); align-items: center;
        }
        .card { 
            width: 170px; flex-shrink: 0; background: var(--panel); border-radius: 15px; 
            overflow: hidden; position: relative; border: 1px solid var(--border); transition: 0.3s;
        }
        .card video { width: 100%; height: 95px; object-fit: cover; background: #000; }
        .card-name { font-size: 10px; padding: 5px; text-align: center; white-space: nowrap; overflow: hidden; }

        /* --- サイドバー --- */
        .sidebar { 
            width: 320px; background: #0d0d0d; border-left: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto;
        }
        .side-panel { background: var(--panel); border-radius: 20px; padding: 15px; border: 1px solid var(--border); }
        .panel-title { font-size: 11px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }

        /* --- ボタンデザイン --- */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 12px; padding: 12px; transition: 0.2s; font-size: 13px; }
        button:active { transform: scale(0.95); }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: black; width: 100%; }
        .btn-mini { padding: 5px 10px; font-size: 10px; border-radius: 8px; }

        /* --- リスト・チャット --- */
        .user-row { 
            background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
        #chat-msgs { flex: 1; background: #000; border-radius: 15px; padding: 12px; font-size: 13px; overflow-y: auto; min-height: 150px; border: 1px solid var(--border); }
        .vol-bar-container { height: 4px; background: #333; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .vol-bar { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }
        
        .poll-overlay { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--panel); padding: 30px; border-radius: 25px; border: 2px solid var(--accent); 
            z-index: 200000; display: none; width: 320px; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }
        #status-notice { 
            background: var(--danger); color: white; font-size: 11px; padding: 6px; 
            border-radius: 8px; margin-top: 10px; display: none; text-align: center; font-weight: bold;
        }

        .hand-pulse { animation: hand-blink 0.8s infinite; border: 2px solid var(--warning) !important; }
        @keyframes hand-blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .floating-emoji {
            position: absolute; bottom: 0; font-size: 40px; animation: floatUp 3s forwards; pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-400px) rotate(20deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<!-- 1. ログイン画面 -->
<div id="setup-screen">
    <div class="setup-box">
        <h1 style="margin:0; font-size:24px; color:var(--accent);">EDU-ULTIMATE</h1>
        <p style="font-size:11px; color:#777; margin-bottom:25px;">Version 27.0 - The God Edition</p>
        <input type="text" id="user-name" placeholder="あなたのお名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-mode">
            <option value="camera">📷 カメラモードで開始</option>
            <option value="screen">💻 画面共有モードで開始</option>
        </select>
        <button class="btn-blue" style="margin-bottom:12px;" onclick="startSession('teacher')">先生（ホスト）として開始</button>
        <button class="btn-green" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<!-- 2. アンケート画面 -->
<div id="poll-box" class="poll-overlay">
    <h3 id="poll-q">質問</h3>
    <div id="poll-opts" style="display:grid; gap:12px;"></div>
</div>

<!-- 3. メインUI -->
<div id="main-ui">
    <header>
        <div style="display:flex; gap:15px; align-items:center;">
            <span id="role-tag" class="badge" style="background:var(--accent); color:black;">ROLE</span>
            <span id="timer" style="font-family:monospace; font-size:16px; color:var(--accent);">00:00:00</span>
        </div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div id="room-display" style="font-size:16px; font-weight:bold;">ROOM: ----</div>
            <button class="btn-red" style="padding:6px 18px; font-size:12px;" onclick="location.reload()">退室</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="content-area">
            <!-- メインステージ -->
            <div class="stage-container" id="stage" onclick="forcePlay()">
                <div id="view-label">映像待機中...</div>
                <div id="reaction-layer" class="reaction-layer"></div>
                <canvas id="drawing-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>
            </div>
            
            <!-- 監視グリッド（教員のみ表示推奨だが、生徒も全員分見れるように配置） -->
            <div id="monitor-grid" class="monitor-grid"></div>
        </div>

        <div class="sidebar">
            <!-- 教員用コントロールパネル -->
            <div id="teacher-panel" class="side-panel hidden">
                <div class="panel-title">DIRECTOR COMMAND</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
                    <button class="btn-green" style="font-size:10px;" onclick="cmdAllMic(true)">🎤 全員通話</button>
                    <button class="btn-red" style="font-size:10px;" onclick="cmdAllMic(false)">🔇 全員ミュート</button>
                </div>
                <button class="btn-warning" style="margin-bottom:10px;" onclick="toggleMediaMode()">💻 画面共有/カメラ切替</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
                    <button class="btn-blue" onclick="toggleWB()">🎨 板書モード</button>
                    <button class="btn-blue" onclick="createPoll()">📊 アンケート</button>
                </div>
                <button class="btn-red" id="rec-btn" onclick="handleRecord()">🔴 授業を録画</button>
                <div id="qrcode" style="background:white; padding:10px; border-radius:12px; margin-top:15px; display:flex; justify-content:center;"></div>
            </div>

            <!-- 生徒用パネル -->
            <div id="student-panel" class="side-panel hidden">
                <button id="hand-btn" class="btn-warning" onclick="toggleHand()">✋ 先生に挙手・質問する</button>
            </div>

            <!-- 自分のプレビュー・設定 -->
            <div class="side-panel">
                <div style="display:flex; gap:15px; align-items:center;">
                    <div style="width:100px; position:relative;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:75px; object-fit:cover; border-radius:12px; background:#000; border:1px solid #333;"></video>
                        <div class="vol-bar-container"><div class="vol-bar" id="my-vol-bar"></div></div>
                    </div>
                    <div style="flex:1;">
                        <div id="my-name-label" style="font-size:14px; font-weight:bold; margin-bottom:8px;">Name</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                            <button id="mic-btn" class="btn-red" onclick="toggleMic()" style="padding:8px; font-size:11px;">Mic OFF</button>
                            <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="padding:8px; font-size:11px;">Cam ON</button>
                        </div>
                    </div>
                </div>
                <div id="status-notice">個別通話中（周囲を減音）</div>
            </div>

            <!-- 参加者リスト -->
            <div class="side-panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-title">PARTICIPANTS</div>
                <div id="user-list-items" style="flex:1; overflow-y:auto;"></div>
            </div>

            <!-- チャット・リアクション -->
            <div class="side-panel" style="flex:1.2; display:flex; flex-direction:column; overflow:hidden;">
                <div id="chat-msgs"></div>
                <div style="display:flex; gap:8px; margin:10px 0;">
                    <input type="text" id="chat-input" placeholder="メッセージ..." style="margin:0;">
                    <button class="btn-blue" onclick="sendChat()" style="padding:0 20px;">Go</button>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:24px;">
                    <span style="cursor:pointer;" onclick="sendReact('👍')">👍</span>
                    <span style="cursor:pointer;" onclick="sendReact('👏')">👏</span>
                    <span style="cursor:pointer;" onclick="sendReact('❤️')">❤️</span>
                    <span style="cursor:pointer;" onclick="sendReact('🔥')">🔥</span>
                    <span style="cursor:pointer;" onclick="sendReact('😮')">😮</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- グローバル変数 ---
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let wbActive = false, wbCtx, drawing = false;
    let recorder, recordedChunks = [];
    let currentGlobalViewId = "", isHandRaised = false;
    let privateTalkPartner = null;
    let mediaMode = "camera"; // or "screen"

    // --- メディア管理 ---
    async function initMedia(mode) {
        mediaMode = mode;
        try {
            const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
            let video;
            if (mode === 'screen') {
                video = await navigator.mediaDevices.getDisplayMedia({ video: true });
            } else {
                video = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            }
            
            // ストリームの結合
            localStream = new MediaStream([
                ...video.getVideoTracks(),
                ...(audio ? audio.getAudioTracks() : [])
            ]);

            // 初期状態ではマイクはOFFにする（ハウリング防止）
            localStream.getAudioTracks().forEach(t => t.enabled = false);
            
            document.getElementById('my-preview').srcObject = localStream;
            setupVolumeMeter(localStream, 'my-vol-bar');
            return localStream;
        } catch (e) {
            console.error(e);
            alert("カメラ・マイクの権限を許可してください");
            return null;
        }
    }

    // --- セッション開始 ---
    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || (role === 'teacher' ? "先生" : "生徒");
        roomID = document.getElementById('room-id').value;
        if (!roomID || roomID.length < 4) return alert("4桁以上の部屋IDを入力してください");

        const stream = await initMedia(document.getElementById('start-mode').value);
        if (!stream) return;

        const teacherPeerID = `T-ROOM-${roomID}`;
        const myPeerID = (role === 'teacher') ? teacherPeerID : `S-${Math.random().toString(36).substr(2, 8)}`;
        
        peer = new Peer(myPeerID, { debug: 1 });

        peer.on('open', (id) => {
            console.log("Peer Open:", id);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-ui').classList.add('active');
            document.getElementById('role-tag').innerText = role;
            document.getElementById('my-name-label').innerText = myName;
            document.getElementById('room-display').innerText = "ROOM: " + roomID;

            if (role === 'teacher') {
                document.getElementById('teacher-panel').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 90, height: 90 });
                initWhiteboard();
                startTimer();
                updateMainStage(peer.id); // 先生をメインにする
            } else {
                document.getElementById('student-panel').classList.remove('hidden');
                connectToTeacher(teacherPeerID);
            }
        });

        // 通話の着信処理
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', stream => {
                remoteStreams[call.peer] = stream;
                addRemoteUI(call.peer, stream);
                
                // 初めて先生の映像が来たらメインに設定
                if (call.peer.startsWith('T-ROOM')) {
                    updateMainStage(call.peer);
                }
            });
        });

        // データ通信の着信処理
        peer.on('connection', conn => setupDataConnection(conn));
    }

    // 生徒用：先生に接続
    function connectToTeacher(tID) {
        const conn = peer.connect(tID);
        setupDataConnection(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(tID, localStream);
        });
    }

    // --- データ通信ハンドリング ---
    function setupDataConnection(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            switch(data.type) {
                case 'join':
                    students[conn.peer] = { name: data.name, hand: false };
                    if (myRole === 'teacher') {
                        broadcastUserList();
                        conn.send({ type: 'sync-view', targetId: currentGlobalViewId || peer.id });
                        peer.call(conn.peer, localStream);
                    }
                    addChatMessage("System", data.name + "さんが参加しました");
                    updateListUI();
                    break;
                
                case 'list':
                    data.list.forEach(u => {
                        if (u.id !== peer.id && !connections[u.id]) {
                            students[u.id] = { name: u.name, hand: u.hand };
                            const c = peer.connect(u.id);
                            setupDataConnection(c);
                            c.on('open', () => {
                                c.send({ type: 'hello', name: myName });
                                peer.call(u.id, localStream);
                            });
                        }
                    });
                    updateListUI();
                    break;

                case 'hello':
                    students[conn.peer] = { name: data.name, hand: false };
                    updateListUI();
                    break;

                case 'sync-view':
                    updateMainStage(data.targetId);
                    break;

                case 'draw':
                    drawOnCanvas(data.x, data.y, data.isNew, data.color);
                    break;

                case 'hand':
                    if(students[conn.peer]) students[conn.peer].hand = data.raised;
                    updateListUI();
                    if (data.raised && myRole === 'teacher') {
                        addChatMessage("Notification", students[conn.peer].name + "さんが挙手しました");
                    }
                    break;

                case 'mic-cmd':
                    setMic(data.value);
                    addChatMessage("System", "先生が全員のマイクを" + (data.value ? "ON" : "OFF") + "にしました");
                    break;

                case 'chat':
                    addChatMessage(data.name, data.msg);
                    break;

                case 'react':
                    showFloatingEmoji(data.emoji);
                    break;

                case 'poll':
                    displayPoll(data);
                    break;
            }
        });

        conn.on('close', () => {
            delete connections[conn.peer];
            delete students[conn.peer];
            const card = document.getElementById(`card-${conn.peer}`);
            if (card) card.remove();
            updateListUI();
        });
    }

    // --- メイン映像・画面同期 ---
    function updateMainStage(id) {
        currentGlobalViewId = id;
        const mv = document.getElementById('main-video');
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        
        if (stream) {
            mv.srcObject = stream;
            mv.muted = (id === peer.id); // 自分の声はミュート
            const isTeacher = id.startsWith('T-ROOM');
            const displayName = isTeacher ? "先生" : (students[id]?.name || "参加者");
            document.getElementById('view-label').innerText = `${displayName} の画面を表示中`;
            mv.play().catch(()=>{});
        }

        // 先生の場合、全員に同期命令を送る
        if (myRole === 'teacher') {
            Object.values(connections).forEach(c => {
                if(c.open) c.send({ type: 'sync-view', targetId: id });
            });
        }
    }

    // リストにリモート映像カードを追加
    function addRemoteUI(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${id}`;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline></video>
            <div class="card-name">${students[id]?.name || '参加者'}</div>
            <div class="vol-bar-container" style="margin:0 5px 5px;"><div class="vol-bar" id="vol-${id}"></div></div>
        `;
        
        // カードをクリックしてメインに指名（先生のみ）
        card.onclick = () => {
            if (myRole === 'teacher') updateMainStage(id);
        };
        
        grid.appendChild(card);
        const vid = document.getElementById(`v-${id}`);
        vid.srcObject = stream;
        setupVolumeMeter(stream, `vol-${id}`);
    }

    // --- ホワイトボード同期 ---
    function initWhiteboard() {
        const canvas = document.getElementById('drawing-canvas');
        wbCtx = canvas.getContext('2d');
        const container = document.getElementById('stage');
        
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        container.onmousedown = (e) => {
            if (!wbActive) return;
            drawing = true;
            broadcastDrawing(e.offsetX, e.offsetY, true);
        };
        container.onmousemove = (e) => {
            if (!drawing || !wbActive) return;
            broadcastDrawing(e.offsetX, e.offsetY, false);
        };
        container.onmouseup = () => drawing = false;
        
        window.addEventListener('resize', () => {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        });
    }

    function toggleWB() {
        wbActive = !wbActive;
        document.getElementById('drawing-canvas').style.pointerEvents = wbActive ? 'auto' : 'none';
        addChatMessage("System", "ホワイトボードモード: " + (wbActive ? "ON" : "OFF"));
    }

    function broadcastDrawing(x, y, isNew) {
        drawOnCanvas(x, y, isNew, "#ff4757");
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'draw', x, y, isNew, color: "#ff4757" });
        });
    }

    function drawOnCanvas(x, y, isNew, color) {
        wbCtx.strokeStyle = color;
        wbCtx.lineWidth = 4;
        wbCtx.lineCap = "round";
        if (isNew) {
            wbCtx.beginPath();
            wbCtx.moveTo(x, y);
        } else {
            wbCtx.lineTo(x, y);
            wbCtx.stroke();
        }
    }

    // --- 会話管理（一括・個別） ---
    function cmdAllMic(val) {
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'mic-cmd', value: val });
        });
        setMic(val);
    }

    function togglePrivateTalk(id) {
        const notice = document.getElementById('status-notice');
        if (privateTalkPartner === id) {
            // 解除
            privateTalkPartner = null;
            notice.style.display = 'none';
            setAllRemoteVolume(1.0);
        } else {
            // 開始
            privateTalkPartner = id;
            notice.style.display = 'block';
            notice.innerText = `${students[id]?.name}と個別会話中`;
            setMic(true);
            setAllRemoteVolume(0.15, id); // 他を85%減音
            addChatMessage("System", students[id].name + "さんと個別会話モードを開始しました");
        }
    }

    function setAllRemoteVolume(vol, exceptId) {
        // メインビデオ
        const mv = document.getElementById('main-video');
        if (currentGlobalViewId !== peer.id && currentGlobalViewId !== exceptId) mv.volume = vol;
        else mv.volume = 1.0;

        // グリッド内のビデオ
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if (v) v.volume = (id === exceptId) ? 1.0 : vol;
        });
    }

    // --- メディア操作 ---
    function setMic(val) {
        const t = localStream.getAudioTracks()[0];
        if (t) {
            t.enabled = val;
            const btn = document.getElementById('mic-btn');
            btn.innerText = val ? "Mic ON" : "Mic OFF";
            btn.className = val ? "btn-green" : "btn-red";
        }
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if (t) setMic(!t.enabled);
    }

    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) {
            t.enabled = !t.enabled;
            const btn = document.getElementById('cam-btn');
            btn.innerText = t.enabled ? "Cam ON" : "Cam OFF";
            btn.className = t.enabled ? "btn-green" : "btn-red";
        }
    }

    async function toggleMediaMode() {
        let newStream;
        try {
            if (mediaMode === 'camera') {
                newStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                mediaMode = 'screen';
            } else {
                newStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                mediaMode = 'camera';
            }
            
            const newVideoTrack = newStream.getVideoTracks()[0];
            const oldVideoTrack = localStream.getVideoTracks()[0];
            
            // トラック差し替え
            localStream.removeTrack(oldVideoTrack);
            localStream.addTrack(newVideoTrack);
            
            // 既存のWebRTC接続をすべて更新
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => {
                    const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(newVideoTrack);
                });
            });

            document.getElementById('my-preview').srcObject = localStream;
            if (currentGlobalViewId === peer.id) updateMainStage(peer.id);
            
            newVideoTrack.onended = () => { if(mediaMode === 'screen') toggleMediaMode(); };

        } catch (e) {
            console.error(e);
        }
    }

    // --- UI更新・補助機能 ---
    function updateListUI() {
        const container = document.getElementById('user-list-items');
        container.innerHTML = "";
        
        Object.keys(students).forEach(id => {
            const row = document.createElement('div');
            row.className = 'user-row';
            if (students[id].hand) row.classList.add('hand-pulse');
            
            row.innerHTML = `
                <span>${students[id].hand ? '✋ ' : ''}${students[id].name}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-mini btn-blue" onclick="updateMainStage('${id}')">注目</button>
                    <button class="btn-mini btn-warning" onclick="togglePrivateTalk('${id}')">対話</button>
                </div>
            `;
            container.appendChild(row);
            
            // グリッド側のカードも点滅
            const card = document.getElementById(`card-${id}`);
            if (card) card.classList.toggle('hand-pulse', students[id].hand);
        });
    }

    function toggleHand() {
        isHandRaised = !isHandRaised;
        document.getElementById('hand-btn').className = isHandRaised ? "btn-red" : "btn-warning";
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'hand', raised: isHandRaised });
        });
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        if (!input.value) return;
        addChatMessage("自分", input.value);
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'chat', name: myName, msg: input.value });
        });
        input.value = "";
    }

    function addChatMessage(name, msg) {
        const box = document.getElementById('chat-msgs');
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.innerHTML = `<b style="color:var(--accent)">${name}:</b> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function sendReact(emoji) {
        showFloatingEmoji(emoji);
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'react', emoji });
        });
    }

    function showFloatingEmoji(emoji) {
        const layer = document.getElementById('reaction-layer');
        const el = document.createElement('div');
        el.className = 'floating-emoji';
        el.innerText = emoji;
        el.style.left = (Math.random() * 80 + 10) + "%";
        layer.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    // --- アンケート機能 ---
    function createPoll() {
        const q = prompt("質問を入力してください:");
        if (!q) return;
        const opts = prompt("選択肢をカンマ区切りで入力 (例: はい,いいえ,わからない):");
        if (!opts) return;
        
        const data = { type: 'poll', q: q, options: opts.split(',') };
        Object.values(connections).forEach(c => {
            if(c.open) c.send(data);
        });
        displayPoll(data);
    }

    function displayPoll(data) {
        const box = document.getElementById('poll-box');
        document.getElementById('poll-q').innerText = data.q;
        const optsDiv = document.getElementById('poll-opts');
        optsDiv.innerHTML = "";
        
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "btn-blue";
            btn.innerText = opt;
            btn.onclick = () => {
                box.style.display = 'none';
                sendChat(); // 回答をチャットに流す
                addChatMessage("Poll", `回答しました: ${opt}`);
            };
            optsDiv.appendChild(btn);
        });
        box.style.display = 'block';
    }

    // --- 録画機能 ---
    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            recordedChunks = [];
            const stream = document.getElementById('main-video').srcObject;
            if (!stream) return alert("録画する映像がありません");
            
            recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            recorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'lesson-record.webm'; a.click();
            };
            recorder.start();
            document.getElementById('rec-btn').innerText = "⏹ 録画を停止";
        } else {
            recorder.stop();
            document.getElementById('rec-btn').innerText = "🔴 授業を録画";
        }
    }

    // --- ユーティリティ ---
    function setupVolumeMeter(stream, barId) {
        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) return;
        try {
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(new MediaStream([audioTrack]));
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const update = () => {
                if (!document.getElementById(barId)) return; // 要素が消えたら停止
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<bufferLength; i++) sum += dataArray[i];
                const avg = sum / bufferLength;
                document.getElementById(barId).style.width = Math.min(100, avg * 3) + "%";
                requestAnimationFrame(update);
            };
            update();
        } catch(e) {}
    }

    function broadcastUserList() {
        const list = Object.keys(students).map(id => ({
            id: id, name: students[id].name, hand: students[id].hand
        }));
        list.push({ id: peer.id, name: myName, hand: false });
        Object.values(connections).forEach(c => {
            if(c.open) c.send({ type: 'list', list: list });
        });
    }

    function startTimer() {
        let sec = 0;
        setInterval(() => {
            sec++;
            const h = Math.floor(sec/3600).toString().padStart(2,'0');
            const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
            const s = (sec%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    function forcePlay() {
        document.querySelectorAll('video').forEach(v => v.play().catch(()=>{}));
    }

    window.onbeforeunload = () => {
        if(peer) peer.destroy();
    };

</script>
</body></html>
