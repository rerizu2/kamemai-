<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v3.6 (Spotlight Share)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --monitor-height: 35vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- セットアップ画面 --- */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 360px; border: 1px solid #444; box-shadow: 0 0 30px rgba(0,251,255,0.2); }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 100; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; }
        
        .panel { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        .btn-primary { background: #0097e6; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-success { background: var(--success); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-mini { padding: 4px 8px; font-size: 10px; width: auto; }

        .monitor-grid { height: var(--monitor-height); background: #111; border-top: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; }
        .student-card video { width: 100%; background: #000; border-radius: 4px; }
        
        .on-air-label { background: red; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; position: absolute; top: 10px; left: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin:0 0 10px;">EDU-ULTIMATE</h2>
        <input type="text" id="user-name" placeholder="名前を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-media-type"><option value="camera">📷 カメラ</option><option value="screen">💻 画面共有</option></select>
        <select id="camera-select"></select>
        <button class="btn-primary" style="margin-top:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <span id="spotlight-msg" style="color:yellow; font-size:12px; font-weight:bold;"></span>
    </div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">自分のプレビュー</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            <button id="mic-btn" class="btn-success" style="margin-top:8px; font-size:11px;" onclick="toggleMic()">🎤 マイク: ON</button>
            <button id="return-btn" class="btn-danger hidden" style="margin-top:8px; font-size:11px;" onclick="resetSpotlight()">🔄 先生の画面に戻す</button>
        </div>
        <div id="teacher-tools" class="hidden">
            <div class="panel">
                <div class="panel-title">招待QR</div>
                <div id="qrcode" style="background:white; padding:5px; border-radius:5px; text-align:center;"></div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container">
            <div id="on-air-status" class="hidden"><span class="on-air-label">● LIVE BROADCAST</span></div>
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "";
    let activeSpotlightId = null;

    // デバイス取得
    navigator.mediaDevices.enumerateDevices().then(devices => {
        const sel = document.getElementById('camera-select');
        devices.filter(d => d.kind === 'videoinput').forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Camera'; sel.appendChild(opt);
        });
    });

    async function start(role) {
        myRole = role;
        currentRid = document.getElementById('room-id').value;
        const type = document.getElementById('start-media-type').value;
        const deviceId = document.getElementById('camera-select').value;

        try {
            await updateStream(type, deviceId);
            document.getElementById('setup-screen').classList.add('hidden');
            
            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });
            
            peer.on('connection', conn => {
                conn.on('data', data => {
                    if (data.type === 'INFO') {
                        const card = document.getElementById('card-' + conn.peer);
                        if (card) card.querySelector('.name').innerText = data.name;
                    }
                });
            });
        } catch (e) { alert("メディアエラー: " + e.message); }
    }

    async function updateStream(type, deviceId) {
        let stream;
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (type === 'camera') {
            stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: deviceId ? { exact: deviceId } : undefined } });
            document.getElementById('my-video').style.transform = "scaleX(-1)";
        } else {
            stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('my-video').style.transform = "none";
        }
        localStream = new MediaStream([...stream.getVideoTracks(), ...mic.getAudioTracks()]);
        document.getElementById('my-video').srcObject = localStream;
        if (myRole === 'teacher' && !activeSpotlightId) {
            document.getElementById('main-broadcast-video').srcObject = localStream;
        }
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-area').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('on-air-status').classList.remove('hidden');
        new QRCode(document.getElementById("qrcode"), { text: location.href.split('?')[0] + "?room=" + currentRid, width: 100, height: 100 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({ type: 'INFO', name: document.getElementById('user-name').value }));
        const call = peer.call(tid, localStream);
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
            document.getElementById('on-air-status').classList.remove('hidden');
        });
    }

    function addStudentToGrid(id, stream) {
        if (document.getElementById('card-' + id)) return;
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = 'card-' + id;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline></video>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                <span class="name" style="font-size:12px;">生徒</span>
                <button class="btn-primary btn-mini" onclick="spotlightStudent('${id}')">クラスに共有</button>
            </div>
        `;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-' + id).srcObject = stream;
    }

    // ★生徒の映像を全員に共有する機能
    function spotlightStudent(studentId) {
        const studentVideo = document.getElementById('v-' + studentId);
        if (!studentVideo || !studentVideo.srcObject) return;

        activeSpotlightId = studentId;
        const studentStream = studentVideo.srcObject;
        
        // 教員のメインモニターをその生徒の映像に切り替え
        document.getElementById('main-broadcast-video').srcObject = studentStream;
        document.getElementById('spotlight-msg').innerText = "💡 現在、生徒の画面を共有中";
        document.getElementById('return-btn').classList.remove('hidden');

        // 全生徒に送信しているトラックを、生徒のものに差し替える
        replaceTracks(studentStream);
    }

    // ★教員の映像に戻す機能
    function resetSpotlight() {
        activeSpotlightId = null;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('spotlight-msg').innerText = "";
        document.getElementById('return-btn').classList.add('hidden');
        
        // 全生徒に送信しているトラックを、教員のものに戻す
        replaceTracks(localStream);
    }

    // トラック差し替えの共通処理
    function replaceTracks(stream) {
        const newVideoTrack = stream.getVideoTracks()[0];
        const newAudioTrack = stream.getAudioTracks()[0];

        Object.values(peer.connections).forEach(connList => {
            connList.forEach(conn => {
                if (conn.peerConnection) {
                    const senders = conn.peerConnection.getSenders();
                    const vSender = senders.find(s => s.track && s.track.kind === 'video');
                    const aSender = senders.find(s => s.track && s.track.kind === 'audio');
                    if (vSender && newVideoTrack) vSender.replaceTrack(newVideoTrack);
                    if (aSender && newAudioTrack) aSender.replaceTrack(newAudioTrack);
                }
            });
        });
    }

    function toggleMic() {
        const track = localStream.getAudioTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            const btn = document.getElementById('mic-btn');
            btn.innerText = track.enabled ? "🎤 マイク: ON" : "🔇 マイク: OFF";
            btn.className = track.enabled ? "btn-success" : "btn-danger";
        }
    }
</script>
</body>
</html>
