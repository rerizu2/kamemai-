<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v35.0 ARCHITECT-REBORN</title>
    
    <!-- External Resources -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --danger: #ff3366;
            --success: #00ff88;
            --bg-base: #020305;
            --bg-panel: rgba(10, 15, 25, 0.96);
            --border: rgba(255, 255, 255, 0.08);
            --glass: blur(30px) saturate(180%);
            --sidebar-w: 400px;
            --header-h: 80px;
            --font-main: 'Outfit', sans-serif;
        }

        /* Global Reset */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-base); color: #e0e6ed; 
            font-family: var(--font-main); overflow: hidden; 
        }

        /* --- Initialization Overlay --- */
        #init-layer {
            position: fixed; inset: 0; z-index: 100000;
            background: radial-gradient(circle at center, #1a2030 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .init-card {
            background: var(--bg-panel); backdrop-filter: var(--glass);
            padding: 60px; border-radius: 40px; border: 1px solid var(--border);
            width: 520px; text-align: center; box-shadow: 0 50px 120px rgba(0,0,0,0.9);
        }
        .init-card h1 { font-size: 48px; font-weight: 900; color: var(--accent); margin: 0 0 10px; letter-spacing: -2px; }
        .init-card p { color: #8090a0; margin-bottom: 45px; font-size: 16px; font-weight: 400; }
        .field-group { margin-bottom: 25px; text-align: left; }
        .field-group label { font-size: 12px; font-weight: 800; color: var(--accent); display: block; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input {
            width: 100%; padding: 18px; border-radius: 15px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.4); color: #fff; font-size: 17px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 25px var(--accent-glow); }
        .btn-launch {
            width: 100%; padding: 22px; border-radius: 16px; border: none; font-weight: 900; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-size: 18px; margin-top: 15px; text-transform: uppercase;
        }
        .btn-host { background: var(--accent); color: #000; }
        .btn-join { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-launch:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        /* --- Primary Application UI --- */
        #app-root { display: none; width: 100%; height: 100%; flex-direction: column; }
        #app-root.active { display: flex; }

        header {
            height: var(--header-h); background: rgba(0,0,0,0.7); backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 0 40px; z-index: 5000;
        }
        .brand-zone { display: flex; align-items: center; gap: 18px; }
        .room-tag { background: var(--accent-glow); color: var(--accent); padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 900; border: 1px solid var(--accent); }

        .main-workspace { display: flex; flex: 1; overflow: hidden; }

        /* Central Stage Area */
        .stage-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .viewport { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #primary-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; transition: opacity 0.5s; }
        #collab-canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        #collab-canvas.active { pointer-events: auto; cursor: crosshair; }

        /* Stage HUD elements */
        .hud-element { position: absolute; z-index: 150; pointer-events: none; }
        .hud-top-l { top: 30px; left: 30px; }
        .hud-top-r { top: 30px; right: 30px; }
        .status-pill { background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border: 1px solid var(--border); padding: 14px 26px; border-radius: 20px; display: flex; align-items: center; gap: 15px; pointer-events: auto; }
        .live-indicator { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        /* Horizontal Video Shelf */
        .video-strip {
            height: 200px; background: rgba(0,0,0,0.6); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 30px; gap: 25px; overflow-x: auto;
            scrollbar-width: none;
        }
        .video-strip::-webkit-scrollbar { display: none; }
        .node-card {
            width: 220px; height: 160px; background: #0d111a; border-radius: 25px; flex-shrink: 0;
            overflow: hidden; border: 1px solid var(--border); position: relative; transition: 0.4s;
            cursor: pointer;
        }
        .node-card.focused { border: 3px solid var(--accent); box-shadow: 0 0 30px var(--accent-glow); transform: scale(1.05); }
        .node-card video { width: 100%; height: 125px; object-fit: cover; background: #000; }
        .node-card .meta-tag { font-size: 11px; font-weight: 800; text-align: center; padding: 7px; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        .audio-track-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.05); }
        .audio-track-fill { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }

        /* Vertical Sidebar Control */
        .control-sidebar { width: var(--sidebar-w); background: var(--bg-panel); backdrop-filter: var(--glass); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .nav-btn { flex: 1; padding: 25px; background: none; border: none; color: #506070; cursor: pointer; transition: 0.3s; font-size: 22px; }
        .nav-btn.active { color: var(--accent); border-bottom: 4px solid var(--accent); background: rgba(0,255,204,0.05); }

        .pane-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 30px; }
        .pane-label { font-size: 13px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 20px; opacity: 0.9; }

        /* Command Grid */
        .cmd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .cmd-btn {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: #fff;
            padding: 20px 5px; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 12px; font-size: 11px; font-weight: 700; transition: 0.3s;
        }
        .cmd-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent); }
        .cmd-btn.active { background: var(--accent); color: #000; font-weight: 800; border-color: var(--accent); }
        .cmd-btn.danger.active { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Directory List */
        .dir-row {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 18px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .dir-row:hover { border-color: var(--accent-glow); background: rgba(255,255,255,0.05); }
        .dir-name-wrap { display: flex; align-items: center; gap: 15px; }
        .dir-name { font-size: 15px; font-weight: 700; }
        .dir-btns { display: flex; gap: 10px; }
        .dir-btn { padding: 8px 15px; border-radius: 10px; border: none; font-size: 11px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-spotlight { background: var(--accent); color: #000; }
        .btn-capture { background: var(--success); color: #000; }

        /* Messaging UI */
        #msg-history { flex: 1; background: rgba(0,0,0,0.3); border-radius: 25px; padding: 25px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); }
        .msg-block { font-size: 15px; line-height: 1.6; border-radius: 20px; padding: 12px 18px; background: rgba(255,255,255,0.07); width: fit-content; max-width: 85%; position: relative; }
        .msg-block.own { align-self: flex-end; background: rgba(0, 255, 204, 0.1); border: 1px solid var(--accent-glow); }
        .msg-block .author { display: block; font-size: 10px; font-weight: 900; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }

        .msg-input-wrap { display: flex; gap: 15px; }
        .msg-input-wrap input { flex: 1; padding: 18px; border-radius: 15px; font-size: 16px; }

        /* Whiteboard Command Bar */
        #wb-commander {
            position: absolute; right: 30px; top: 130px; background: var(--bg-panel);
            border: 2px solid var(--accent); border-radius: 25px; padding: 20px;
            display: none; flex-direction: column; gap: 20px; z-index: 6000; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .tool-icon { width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; transition: 0.3s; }
        .tool-icon.selected { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent-glow); }
        .color-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); }

        /* Feedback Notifications */
        #toast-master { position: fixed; top: 110px; left: 40px; z-index: 10000; display: flex; flex-direction: column; gap: 15px; }
        .toast-msg { background: var(--bg-panel); border-left: 8px solid var(--accent); padding: 20px 35px; border-radius: 20px; font-size: 16px; font-weight: 700; animation: slideReveal 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); box-shadow: 0 30px 60px rgba(0,0,0,0.7); border-top: 1px solid var(--border); }
        @keyframes slideReveal { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Dynamic FX */
        .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999999; overflow: hidden; }
        .fx-particle { position: absolute; font-size: 60px; bottom: -120px; animation: ascend 4s linear forwards; }
        @keyframes ascend { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-130vh) rotate(1080deg); opacity: 0; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Init Screen -->
<div id="init-layer">
    <div class="init-card">
        <h1>EDU-ULTIMATE</h1>
        <p>Architect-Grade Telepresence Engine v35.0</p>
        
        <div class="field-group">
            <label>Operator Signature</label>
            <input type="text" id="user-name" placeholder="Ex: Principal Johnson">
        </div>
        <div class="field-group">
            <label>Nexus Channel ID</label>
            <input type="number" id="room-id" placeholder="Enter 4-digit ID">
        </div>

        <button class="btn-launch btn-host" onclick="startEngine('teacher')">Activate as Teacher</button>
        <button class="btn-launch btn-join" onclick="startEngine('student')">Connect as Student</button>
    </div>
</div>

<!-- Main App Root -->
<div id="app-root">
    <header>
        <div class="brand-zone">
            <i class="fas fa-project-diagram" style="color:var(--accent); font-size:32px;"></i>
            <span style="font-weight:900; letter-spacing:3px; font-size:24px; color:var(--accent)">ARCHITECT v35</span>
            <div class="room-tag" id="room-display">ID: ----</div>
        </div>
        <div style="display:flex; align-items:center; gap:40px;">
            <div id="rec-tag" class="hidden" style="color:var(--danger); font-weight:900; font-size:16px; display:flex; align-items:center; gap:10px;">
                <div class="live-indicator"></div> RECORDING SESSION
            </div>
            <div id="time-clock" style="font-family:'JetBrains Mono'; font-size:26px; font-weight:700; color:#fff;">00:00:00</div>
            <button class="btn-launch danger" style="padding:12px 30px; margin:0; width:auto; border-radius:12px; font-size:14px; background:var(--danger); color:#fff;" onclick="location.reload()">TERMINATE</button>
        </div>
    </header>

    <div class="main-workspace">
        <!-- Center Stage -->
        <div class="stage-area">
            <div class="viewport" id="viewport-root" onclick="emergencyUnlock()">
                <div class="hud-element hud-top-l">
                    <div class="status-pill">
                        <div class="live-indicator" style="background:var(--success); animation:none;"></div>
                        <span id="active-viewer-name" style="font-weight:900; font-size:14px; text-transform:uppercase; letter-spacing:1px;">Stream Status: Calibrating</span>
                    </div>
                </div>
                
                <canvas id="collab-canvas"></canvas>
                <video id="primary-video" autoplay playsinline></video>

                <div id="wb-commander">
                    <div class="tool-icon selected" onclick="switchTool('pen', this)"><i class="fas fa-pencil-alt"></i></div>
                    <div class="tool-icon" onclick="switchTool('rect', this)"><i class="fas fa-vector-square"></i></div>
                    <div class="tool-icon" onclick="switchTool('eraser', this)"><i class="fas fa-eraser"></i></div>
                    <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
                    <div class="color-dot selected" onclick="switchColor('#00ffcc', this)" style="background:#00ffcc"></div>
                    <div class="color-dot" onclick="switchColor('#ff3366', this)" style="background:#ff3366"></div>
                    <div class="color-dot" onclick="switchColor('#00ff88', this)" style="background:#00ff88"></div>
                    <div class="tool-icon" onclick="wipeNexusBoard()" style="color:var(--danger); margin-top:15px;"><i class="fas fa-trash-alt"></i></div>
                </div>
            </div>

            <div class="video-strip" id="node-grid">
                <!-- User Preview -->
                <div class="node-card" id="card-local">
                    <video id="preview-local" autoplay playsinline muted></video>
                    <div class="meta-tag">LOCAL OPERATOR</div>
                    <div class="audio-track-bg"><div class="audio-track-fill" id="vol-local"></div></div>
                </div>
            </div>
        </div>

        <!-- Right Side Panel -->
        <div class="control-sidebar">
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="switchPane('ctrl', this)"><i class="fas fa-terminal"></i></button>
                <button class="nav-btn" onclick="switchPane('chat', this)"><i class="fas fa-comments"></i></button>
                <button class="nav-btn" onclick="switchPane('users', this)"><i class="fas fa-network-wired"></i></button>
            </div>

            <div class="pane-content" id="pane-ctrl">
                <div id="host-controls" class="hidden">
                    <div class="pane-label">Orchestration Console</div>
                    <div class="cmd-grid">
                        <button class="cmd-btn" onclick="masterMicCommand(false)"><i class="fas fa-microphone-slash"></i><span>Silent All</span></button>
                        <button class="cmd-btn" onclick="masterMicCommand(true)"><i class="fas fa-microphone"></i><span>Enable All</span></button>
                        <button class="cmd-btn" id="btn-wb" onclick="toggleNexusBoard()"><i class="fas fa-palette"></i><span>Draw</span></button>
                        <button class="cmd-btn" id="btn-rec" onclick="toggleNexusRecording()"><i class="fas fa-video"></i><span>Record</span></button>
                        <button class="cmd-btn" onclick="forceGlobalFocus(peer.id)"><i class="fas fa-expand-arrows-alt"></i><span>Focus Me</span></button>
                        <button class="cmd-btn" onclick="emitNexusReaction('⭐')"><i class="fas fa-medal"></i><span>Reward</span></button>
                    </div>
                </div>

                <div class="pane-label">Device Hardware</div>
                <div class="cmd-grid">
                    <button class="cmd-btn" id="mic-toggle" onclick="toggleOwnAudio()"><i class="fas fa-microphone"></i><span>Mic</span></button>
                    <button class="cmd-btn" id="cam-toggle" onclick="toggleOwnVideo()"><i class="fas fa-video"></i><span>Camera</span></button>
                    <button class="cmd-btn" id="screen-toggle" onclick="toggleOwnScreen()"><i class="fas fa-desktop"></i><span>Share</span></button>
                </div>

                <div style="margin-top:25px; padding:25px; background:rgba(0,0,0,0.4); border-radius:30px; border:1px solid var(--border);">
                    <div class="pane-label" style="margin-bottom:15px;">Real-time Feedback</div>
                    <div style="display:flex; justify-content:space-between; font-size:35px;">
                        <span style="cursor:pointer;" onclick="emitNexusReaction('👏')">👏</span>
                        <span style="cursor:pointer;" onclick="emitNexusReaction('🔥')">🔥</span>
                        <span style="cursor:pointer;" onclick="emitNexusReaction('💡')">💡</span>
                        <span style="cursor:pointer;" onclick="emitNexusReaction('🚀')">🚀</span>
                    </div>
                </div>
            </div>

            <div class="pane-content hidden" id="pane-chat">
                <div id="msg-history"></div>
                <div class="msg-input-wrap">
                    <input type="text" id="msg-input" placeholder="Secure link active..." onkeypress="if(event.key==='Enter')dispatchNexusChat()">
                    <button class="cmd-btn" style="width:70px; background:var(--accent); color:#000;" onclick="dispatchNexusChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="pane-content hidden" id="pane-users">
                <div class="pane-label">Connected Nodes</div>
                <div id="user-directory"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-master"></div>
<div class="fx-layer" id="fx-root"></div>

<script>
/**
 * EDU-ULTIMATE v35.0 - Architect Engine
 */
let peer, localStream, role, operatorName, roomID;
let conns = {}, remoteStreams = {}, directoryData = {};
let audioActive = true, videoActive = true, boardActive = false, screenActive = false;
let canvas, ctx, isDrawing = false, activeTool = 'pen', activeColor = '#00ffcc', prevPos = {x:0, y:0};
let audioContext, sessionRecorder, sessionChunks = [];

async function startEngine(mode) {
    role = mode;
    operatorName = document.getElementById('user-name').value || (role==='teacher'?'Teacher':'Student');
    roomID = document.getElementById('room-id').value;
    if(!roomID || roomID.length < 4) return alert("System requires a 4-digit Nexus ID.");

    // 初期化: マイクとカメラを同時取得
    try {
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        // 最初はマイクをオンの状態にする（会話を確実にするため）
        applyAudioState(true);
    } catch(e) {
        alert("Fatal Error: Media peripherals missing.");
        return;
    }
    
    const nexusID = (role === 'teacher') ? `ARCHITECT-HOST-${roomID}` : `ARCHITECT-NODE-${roomID}-${Math.random().toString(36).substr(2,7)}`;
    peer = new Peer(nexusID);

    peer.on('open', id => {
        document.getElementById('init-layer').classList.add('hidden');
        document.getElementById('app-root').classList.add('active');
        document.getElementById('room-display').innerText = `ID: ${roomID}`;
        document.getElementById('preview-local').srcObject = localStream;

        initAudioSpectrum(localStream, 'vol-local');
        updateClock();

        if(role === 'teacher'){
            document.getElementById('host-controls').classList.remove('hidden');
            initNexusCanvas();
            forceGlobalFocus(peer.id);
        } else {
            connectToHostNexus();
        }
        triggerToast("NEXUS ONLINE", `Authenticated as ${operatorName}`);
    });

    peer.on('call', call => {
        // コールを受信した際、自身の全トラックを送信
        call.answer(localStream);
        call.on('stream', stream => {
            remoteStreams[call.peer] = stream;
            createRemoteNode(call.peer, stream);
            if(call.peer.includes('HOST')) forceGlobalFocus(call.peer);
        });
    });

    peer.on('connection', c => setupDataSync(c));
}

function connectToHostNexus() {
    const hostID = `ARCHITECT-HOST-${roomID}`;
    const c = peer.connect(hostID);
    setupDataSync(c);
    c.on('open', () => {
        c.send({type:'arc-join', name:operatorName});
        peer.call(hostID, localStream);
    });
}

function setupDataSync(c) {
    conns[c.peer] = c;
    c.on('data', data => {
        switch(data.type) {
            case 'arc-join':
                directoryData[c.peer] = {name:data.name};
                if(role === 'teacher') {
                    refreshBroadcastDirectory();
                    peer.call(c.peer, localStream);
                }
                updateDirectoryView();
                break;
            case 'arc-dir':
                data.list.forEach(u => {
                    if(u.id !== peer.id && !conns[u.id]){
                        directoryData[u.id] = {name:u.name};
                        const nc = peer.connect(u.id);
                        setupDataSync(nc);
                        nc.on('open', () => {
                            nc.send({type:'arc-hello', name:operatorName});
                            peer.call(u.id, localStream);
                        });
                    }
                });
                updateDirectoryView();
                break;
            case 'arc-hello':
                directoryData[c.peer] = {name:data.name};
                updateDirectoryView();
                break;
            case 'arc-chat': renderNexusChat(data.name, data.msg, false); break;
            case 'arc-draw': syncRemoteDrawing(data); break;
            case 'arc-clear': ctx.clearRect(0,0,canvas.width, canvas.height); break;
            case 'arc-mic-cmd': applyAudioState(data.val); break;
            case 'arc-focus': forceGlobalFocus(data.id); break;
            case 'arc-fx': runVisualFX(data.emoji); break;
            case 'arc-force-capture': executeForcedCapture(); break;
        }
    });
    c.on('close', () => {
        delete conns[c.peer];
        const node = document.getElementById(`node-${c.peer}`);
        if(node) node.remove();
        updateDirectoryView();
    });
}

/** 
 * Teacher Authority: Global Sync
 */
function forceGlobalFocus(pid) {
    if(role !== 'teacher') return;
    executeFocusUpdate(pid);
    dispatchNexusData({type:'arc-focus', id:pid});
    triggerToast("VIEW SYNCED", "All participants are now observing the focused node.");
}

function executeFocusUpdate(id) {
    const mainVideo = document.getElementById('primary-video');
    const stream = (id === peer.id) ? localStream : remoteStreams[id];
    if(stream) {
        mainVideo.srcObject = stream;
        // 自分自身ならミュート（ハウリング防止）、他人ならミュート解除（会話可能に）
        mainVideo.muted = (id === peer.id);
        const nameLabel = id.includes('HOST') ? "TEACHER" : (directoryData[id]?.name || "STUDENT");
        document.getElementById('active-viewer-name').innerText = `Observation Target: ${nameLabel}`;
        
        // 再生保証
        mainVideo.play().catch(() => {});
    }
    document.querySelectorAll('.node-card').forEach(c => c.classList.remove('focused'));
    const target = document.getElementById(id === peer.id ? 'card-local' : `card-${id}`);
    if(target) target.classList.add('focused');
}

/** 
 * Teacher Authority: Forced Screen Capture
 */
function triggerForcedCapture(targetID) {
    if(role !== 'teacher') return;
    const c = conns[targetID];
    if(c) {
        c.send({type:'arc-force-capture'});
        triggerToast("CAPTURE SIGNAL", "Remote screen request transmitted.");
    }
}

// 生徒側で強制実行（ハイブリッド音声維持）
async function executeForcedCapture() {
    try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({video:true});
        const screenTrack = screenStream.getVideoTracks()[0];
        const micTrack = localStream.getAudioTracks()[0]; // 既存のマイクを保持
        
        // 元のビデオトラックを停止
        const oldVideoTrack = localStream.getVideoTracks()[0];
        localStream.removeTrack(oldVideoTrack);
        localStream.addTrack(screenTrack);
        
        // 全コネクションのビデオトラックのみを差し替え
        Object.values(peer.connections).forEach(pcs => {
            pcs.forEach(pc => {
                if(pc.type === 'media') {
                    const sender = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(sender) sender.replaceTrack(screenTrack);
                }
            });
        });

        document.getElementById('preview-local').srcObject = localStream;
        screenActive = true;
        document.getElementById('screen-toggle').classList.add('active');

        screenTrack.onended = () => revertToCamera();
        triggerToast("SCREEN LIVE", "Your desktop is now broadcasting with audio.");
    } catch(e) {
        triggerToast("CANCELLED", "Screen capture declined by user.");
    }
}

async function revertToCamera() {
    const screenTrack = localStream.getVideoTracks()[0];
    const camStream = await navigator.mediaDevices.getUserMedia({video:true});
    const camTrack = camStream.getVideoTracks()[0];
    
    localStream.removeTrack(screenTrack);
    localStream.addTrack(camTrack);
    screenTrack.stop();

    Object.values(peer.connections).forEach(pcs => {
        pcs.forEach(pc => {
            if(pc.type === 'media') {
                const sender = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if(sender) sender.replaceTrack(camTrack);
            }
        });
    });

    document.getElementById('preview-local').srcObject = localStream;
    screenActive = false;
    document.getElementById('screen-toggle').classList.remove('active');
}

/** Audio Control System **/
function toggleOwnAudio() {
    audioActive = !audioActive;
    applyAudioState(audioActive);
    document.getElementById('mic-toggle').classList.toggle('active', audioActive);
}

function applyAudioState(v) {
    if(localStream){
        localStream.getAudioTracks().forEach(t => t.enabled = v);
    }
    audioActive = v;
}

/** Whiteboard Component **/
function initNexusCanvas() {
    canvas = document.getElementById('collab-canvas');
    ctx = canvas.getContext('2d');
    const resizeBoard = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resizeBoard(); window.onresize = resizeBoard;

    const getRelativePos = e => ({ x: e.offsetX / canvas.width, y: e.offsetY / canvas.height });

    canvas.onmousedown = e => { if(!boardActive) return; isDrawing = true; prevPos = getRelativePos(e); };
    canvas.onmousemove = e => {
        if(!isDrawing) return;
        const currentPos = getRelativePos(e);
        const drawData = { type:'arc-draw', tool:activeTool, from:prevPos, to:currentPos, col:activeColor };
        syncRemoteDrawing(drawData);
        dispatchNexusData(drawData);
        prevPos = currentPos;
    };
    canvas.onmouseup = () => isDrawing = false;
}

function syncRemoteDrawing(d) {
    ctx.strokeStyle = d.col; ctx.lineWidth = d.tool==='eraser'? 50 : 5; ctx.lineCap = 'round';
    ctx.globalCompositeOperation = d.tool==='eraser' ? 'destination-out' : 'source-over';
    
    const w = canvas.width, h = canvas.height;
    ctx.beginPath();
    ctx.moveTo(d.from.x * w, d.from.y * h);
    ctx.lineTo(d.to.x * w, d.to.y * h);
    ctx.stroke();
}

function toggleNexusBoard() {
    boardActive = !boardActive;
    document.getElementById('collab-canvas').classList.toggle('active', boardActive);
    document.getElementById('wb-commander').style.display = boardActive ? 'flex' : 'none';
    document.getElementById('btn-wb').classList.toggle('active', boardActive);
}

function wipeNexusBoard() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    dispatchNexusData({type:'arc-clear'});
}

/** UI Rendering Components **/
function createRemoteNode(id, stream) {
    if(document.getElementById(`node-${id}`)) return;
    const grid = document.getElementById('node-grid');
    const node = document.createElement('div');
    node.className = 'node-card'; node.id = `node-${id}`;
    node.onclick = () => { if(role === 'teacher') forceGlobalFocus(id); };
    node.innerHTML = `<video id="video-${id}" autoplay playsinline></video>
                     <div class="meta-tag">${directoryData[id]?.name || 'Participant'}</div>
                     <div class="audio-track-bg"><div class="audio-track-fill" id="spectrum-${id}"></div></div>`;
    grid.appendChild(node);
    
    const videoEl = document.getElementById(`video-${id}`);
    videoEl.srcObject = stream;
    // 重要: 他人のカードは常にミュート解除（音を聞くため）
    videoEl.muted = false;
    
    initAudioSpectrum(stream, `spectrum-${id}`);
}

function updateDirectoryView() {
    const list = document.getElementById('user-directory');
    list.innerHTML = "";
    Object.keys(conns).forEach(id => {
        const row = document.createElement('div');
        row.className = 'dir-row';
        const btns = (role === 'teacher') ? 
            `<div class="dir-btns">
                <button class="dir-btn btn-spotlight" onclick="forceGlobalFocus('${id}')">Spotlight</button>
                <button class="dir-btn btn-capture" onclick="triggerForcedCapture('${id}')">Capture</button>
            </div>` : "";
        row.innerHTML = `<div class="dir-name-wrap"><div class="live-indicator" style="background:var(--success); animation:none;"></div><span class="dir-name">${directoryData[id]?.name || 'User'}</span></div>${btns}`;
        list.appendChild(row);
    });
}

function initAudioSpectrum(s, bid) {
    try {
        if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioContext.createMediaStreamSource(s);
        const alz = audioContext.createAnalyser(); alz.fftSize = 256;
        src.connect(alz);
        const buffer = new Uint8Array(alz.frequencyBinCount);
        const drawLoop = () => {
            const el = document.getElementById(bid);
            if(!el) return;
            alz.getByteFrequencyData(buffer);
            const avg = buffer.reduce((a,b)=>a+b)/buffer.length;
            el.style.width = Math.min(100, avg*3) + "%";
            requestAnimationFrame(drawLoop);
        };
        drawLoop();
    } catch(e){}
}

function triggerToast(title, msg) {
    const root = document.getElementById('toast-master');
    const toast = document.createElement('div'); toast.className = 'toast-msg';
    toast.innerHTML = `<span style="color:var(--accent); text-transform:uppercase;">[ ${title} ]</span><br>${msg}`; root.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
}

function dispatchNexusData(data) {
    Object.values(conns).forEach(c => { if(c.open) c.send(data); });
}

function refreshBroadcastDirectory() {
    const list = Object.keys(directoryData).map(id => ({id, name:directoryData[id].name}));
    list.push({id:peer.id, name:operatorName});
    dispatchNexusData({type:'arc-dir', list});
}

function dispatchNexusChat() {
    const input = document.getElementById('msg-input'); if(!input.value) return;
    renderNexusChat(operatorName, input.value, true);
    dispatchNexusData({type:'arc-chat', name:operatorName, msg:input.value});
    input.value = "";
}

function renderNexusChat(name, msg, own) {
    const container = document.getElementById('msg-history');
    const el = document.createElement('div');
    el.className = `msg-block ${own?'own':''}`;
    el.innerHTML = `<span class="author">${name}</span>${msg}`;
    container.appendChild(el); container.scrollTop = container.scrollHeight;
}

function toggleOwnVideo() {
    videoActive = !videoActive;
    localStream.getVideoTracks().forEach(t => t.enabled = videoActive);
    document.getElementById('cam-toggle').classList.toggle('active', videoActive);
}

function updateClock() {
    setInterval(() => {
        const now = new Date();
        document.getElementById('time-clock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);
}

function switchPane(p, b) {
    document.querySelectorAll('.pane-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(`pane-${p}`).classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    b.classList.add('active');
}

function emergencyUnlock() { 
    if(audioContext) audioContext.resume(); 
    document.querySelectorAll('video').forEach(v => {
        v.muted = (v.id === 'preview-local'); // 自分以外はミュート解除
        v.play().catch(()=>{});
    }); 
}

function switchTool(t, el) { activeTool = t; document.querySelectorAll('.tool-icon').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }
function switchColor(c, el) { activeColor = c; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }

function emitNexusReaction(emoji) {
    runVisualFX(emoji);
    dispatchNexusData({type:'arc-fx', emoji});
}
function runVisualFX(e) {
    const root = document.getElementById('fx-root');
    const p = document.createElement('div');
    p.innerText = e; p.className = 'fx-particle';
    p.style.left = Math.random()*85+5+'vw';
    root.appendChild(p);
    setTimeout(() => p.remove(), 4000);
}

function masterMicCommand(v) { dispatchNexusData({type:'arc-mic-cmd', val:v}); applyAudioState(v); }

function toggleNexusRecording() {
    if(!sessionRecorder || sessionRecorder.state === 'inactive') {
        const stream = document.getElementById('primary-video').srcObject; if(!stream) return;
        sessionRecorder = new MediaRecorder(stream);
        sessionRecorder.ondataavailable = e => sessionChunks.push(e.data);
        sessionRecorder.onstop = () => {
            const blob = new Blob(sessionChunks, {type:'video/webm'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `ARCHITECT-RECORD-${Date.now()}.webm`; a.click();
        };
        sessionRecorder.start();
        document.getElementById('rec-tag').classList.remove('hidden');
        document.getElementById('btn-rec').classList.add('active');
    } else {
        sessionRecorder.stop();
        document.getElementById('rec-tag').classList.add('hidden');
        document.getElementById('btn-rec').classList.remove('active');
    }
}

async function toggleOwnScreen() {
    if(!screenActive) await executeForcedCapture();
    else await revertToCamera();
}
