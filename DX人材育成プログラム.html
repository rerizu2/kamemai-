<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v26.0 (Complete Edition)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #050505; --panel: #121212; --danger: #ff4757; 
            --success: #2ecc71; --warning: #f1c40f; --text: #e0e0e0;
        }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* ログイン画面 - 最前面に固定 */
        #setup-screen { 
            position: fixed; inset: 0; background: #000; display: flex; justify-content: center; 
            align-items: center; z-index: 99999; 
        }
        .modal-box { 
            background: var(--panel); padding: 40px; border-radius: 24px; text-align: center; 
            width: 380px; border: 1px solid #333; box-shadow: 0 0 40px rgba(0,251,255,0.1);
        }
        .modal-box h2 { color: var(--accent); margin-top: 0; }
        .modal-box input, .modal-box select { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; 
            background: #000; color: white; box-sizing: border-box; font-size: 16px;
        }

        /* メインUI - 初期状態は非表示 */
        #main-ui { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        #main-ui.active { display: flex; }

        header { 
            height: 50px; background: #111; border-bottom: 1px solid #222; 
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0;
        }
        .badge { font-size: 11px; padding: 3px 10px; border-radius: 5px; font-weight: bold; text-transform: uppercase; }

        .main-layout { display: flex; flex: 1; overflow: hidden; width: 100%; }
        
        /* 配信エリア */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .broadcast-container { 
            flex: 2; position: relative; display: flex; justify-content: center; align-items: center; 
            border-bottom: 2px solid #222; overflow: hidden;
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #view-label { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent); font-size: 11px; z-index: 10; }
        #drawing-canvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

        /* 監視エリア（先生のみ） */
        .monitor-grid { 
            height: 160px; display: flex; gap: 10px; padding: 10px; overflow-x: auto; 
            background: #080808; border-top: 1px solid #222; flex-shrink: 0;
        }
        .card { 
            width: 160px; flex-shrink: 0; background: var(--panel); border-radius: 12px; 
            overflow: hidden; position: relative; border: 1px solid #333;
        }
        .card video { width: 100%; height: 90px; object-fit: cover; background: #000; }

        /* サイドバー */
        .sidebar { 
            width: 300px; background: #111; border-left: 1px solid #222; 
            display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto; flex-shrink: 0;
        }
        .side-panel { background: var(--panel); border-radius: 15px; padding: 12px; border: 1px solid #222; }
        .panel-title { font-size: 10px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }

        /* ボタン */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 10px; padding: 10px; transition: 0.2s; font-size: 13px; }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: black; }
        .btn-mini { padding: 4px; font-size: 9px; width: 100%; border-radius: 0; }

        /* 1対1用リスト */
        .user-row { 
            background: #1a1a1a; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 12px; cursor: pointer;
        }
        .user-row:hover { background: #252525; border-left: 3px solid var(--accent); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
        .status-dot.active { background: var(--success); box-shadow: 0 0 5px var(--success); }

        #chat-msgs { flex: 1; background: #000; border-radius: 10px; padding: 10px; font-size: 12px; overflow-y: auto; min-height: 100px; border: 1px solid #222; }
        .vol-bar { height: 3px; background: var(--success); width: 0%; transition: 0.1s; border-radius: 2px; }
        .reaction-layer { position: absolute; inset: 0; pointer-events: none; z-index: 99; }
        .hidden { display: none !important; }
        .hand-raise { animation: pulse 1s infinite; border: 2px solid var(--warning) !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid #222; }
        }
    </style>
</head>
<body>

<!-- ログイン画面 -->
<div id="setup-screen">
    <div class="modal-box">
        <h2>EDU-ULTIMATE v26</h2>
        <input type="text" id="user-name" placeholder="お名前を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)" pattern="\d*">
        <select id="start-mode">
            <option value="camera">📷 カメラで参加</option>
            <option value="screen">💻 画面共有で開始</option>
        </select>
        <button class="btn-blue" style="margin-bottom:10px;" onclick="startSession('teacher')">先生として開始</button>
        <button class="btn-green" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<!-- メインUI（入室まで非表示） -->
<div id="main-ui">
    <header>
        <div style="display:flex; gap:10px; align-items:center;">
            <span id="role-tag" class="badge" style="background:var(--accent); color:black;">ROLE</span>
            <span id="timer" style="font-family:monospace; opacity:0.6; font-size:12px;">00:00</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div id="room-display" style="font-size:12px; font-weight:bold; color:var(--accent);">ID: ----</div>
            <button class="btn-red" style="padding:4px 10px; font-size:10px;" onclick="location.reload()">退室</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="content-area">
            <div class="broadcast-container" onclick="forcePlay()">
                <div id="view-label">映像待機中...</div>
                <div id="reaction-layer" class="reaction-layer"></div>
                <canvas id="drawing-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>
            </div>
            <div id="monitor-grid" class="monitor-grid"></div>
        </div>

        <div class="sidebar">
            <!-- 先生用ツール -->
            <div id="teacher-panel" class="side-panel hidden" style="border-color:#442222;">
                <div class="panel-title"><span>DIRECTOR TOOLS</span></div>
                <button class="btn-warning" style="margin-bottom:8px; font-size:11px;" onclick="setGlobalView('teacher')">🔄 全員を自分(先生)に戻す</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:8px;">
                    <button class="btn-blue" style="font-size:10px;" onclick="toggleWhiteboard()">🎨 黒板</button>
                    <button class="btn-blue" style="font-size:10px;" onclick="sendPoll()">📊 投票</button>
                </div>
                <button class="btn-blue" style="width:100%; margin-bottom:8px; font-size:11px;" onclick="handleRecord()" id="rec-btn">🔴 授業録画</button>
                <div id="qrcode" style="background:white; padding:5px; border-radius:8px; display:flex; justify-content:center;"></div>
            </div>

            <!-- 生徒用ツール -->
            <div id="student-panel" class="side-panel hidden">
                <button id="hand-btn" class="btn-warning" onclick="toggleHand()">✋ 先生に質問する（挙手）</button>
            </div>

            <!-- 自分 -->
            <div class="side-panel">
                <div style="display:flex; gap:10px; align-items:flex-start;">
                    <div style="width:80px; position:relative;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:60px; object-fit:cover; border-radius:8px; background:#000;"></video>
                        <div class="vol-bar" id="my-vol-bar"></div>
                    </div>
                    <div style="flex:1;">
                        <div id="my-name-label" style="font-size:12px; font-weight:bold; margin-bottom:5px;">User</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                            <button id="mic-btn" class="btn-green" onclick="toggleMic()" style="padding:5px; font-size:10px;">Mic</button>
                            <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="padding:5px; font-size:10px;">Cam</button>
                        </div>
                    </div>
                </div>
                <select id="mode-select" style="margin-top:8px; font-size:10px; background:#111; color:white; border:1px solid #333;" onchange="updateMedia()">
                    <option value="camera">📷 カメラモード</option>
                    <option value="screen">💻 画面共有モード</option>
                </select>
            </div>

            <!-- クラスメイト -->
            <div class="side-panel" style="flex:0.8; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-title"><span>CLASSMATES</span></div>
                <div id="user-list-items" style="flex:1; overflow-y:auto;"></div>
            </div>

            <!-- チャット -->
            <div class="side-panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-title"><span>CHAT / REACTIONS</span></div>
                <div id="chat-msgs"></div>
                <div style="display:flex; gap:5px; margin-top:8px;">
                    <input type="text" id="chat-input" placeholder="送信..." style="margin-bottom:0; padding:8px; font-size:12px;">
                    <button class="btn-blue" onclick="sendChatMessage()" style="padding:0 12px;">Go</button>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:18px;">
                    <span style="cursor:pointer;" onclick="sendReaction('👍')">👍</span>
                    <span style="cursor:pointer;" onclick="sendReaction('👏')">👏</span>
                    <span style="cursor:pointer;" onclick="sendReaction('😮')">😮</span>
                    <span style="cursor:pointer;" onclick="sendReaction('❤️')">❤️</span>
                    <span style="cursor:pointer;" onclick="sendReaction('😂')">😂</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let recorder, recordedChunks = [];
    let currentViewId = "", isHandRaised = false;
    let wbActive = false, wbCtx, drawing = false;

    // 1. ストリーム取得
    async function getStream(mode) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        try {
            const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
            let video;
            if (mode === 'camera') {
                video = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            } else {
                video = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.getVideoTracks()[0].onended = () => { document.getElementById('mode-select').value = 'camera'; updateMedia(); };
            }
            localStream = new MediaStream([...video.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
            document.getElementById('my-preview').srcObject = localStream;
            setupVol(localStream, 'my-vol-bar');
            return localStream;
        } catch (e) { alert("メディア取得失敗"); return null; }
    }

    // 2. セッション開始
    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || "ゲスト";
        roomID = document.getElementById('room-id').value;
        if (!roomID) return alert("部屋IDを入力してください");

        const stream = await getStream(document.getElementById('start-mode').value);
        if (!stream) return;

        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(peerID, { debug: 1 });

        peer.on('open', id => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-ui').classList.add('active');
            document.getElementById('role-tag').innerText = role;
            document.getElementById('room-display').innerText = "ROOM: " + roomID;
            document.getElementById('my-name-label').innerText = myName;
            
            if (role === 'teacher') {
                document.getElementById('teacher-panel').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 80, height: 80 });
                setGlobalView('teacher');
                initWB();
                startTimer();
            } else {
                document.getElementById('student-panel').classList.remove('hidden');
                document.body.classList.add('student-mode');
                joinRoom();
            }
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => {
                remoteStreams[call.peer] = s;
                addRemoteVideo(call.peer, s);
                if (currentViewId === call.peer) applyView(call.peer, true);
            });
        });

        peer.on('connection', conn => setupDataConn(conn));
    }

    function joinRoom() {
        const tID = `T-ROOM-${roomID}`;
        const conn = peer.connect(tID);
        setupDataConn(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(tID, localStream);
        });
    }

    function setupDataConn(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            if (data.type === 'join') {
                students[conn.peer] = { name: data.name, hand: false };
                if (myRole === 'teacher') {
                    broadcastList();
                    conn.send({ type: 'sync', targetId: currentViewId });
                }
                addChat("System", data.name + "さんが参加");
            }
            if (data.type === 'list') {
                data.list.forEach(u => {
                    if (u.id !== peer.id && !connections[u.id]) {
                        students[u.id] = { name: u.name, hand: u.hand };
                        const c = peer.connect(u.id);
                        setupDataConn(c);
                        c.on('open', () => {
                            c.send({ type: 'hello', name: myName, hand: isHandRaised });
                            peer.call(u.id, localStream);
                        });
                    }
                });
                updateListUI();
            }
            if (data.type === 'hello') { students[conn.peer] = { name: data.name, hand: data.hand }; updateListUI(); }
            if (data.type === 'chat') addChat(data.name, data.msg);
            if (data.type === 'react') showReaction(data.emoji, data.name);
            if (data.type === 'sync') applyView(data.targetId, true);
            if (data.type === 'hand') { if(students[conn.peer]) students[conn.peer].hand = data.raised; updateListUI(); }
            if (data.type === 'exit') removePeer(conn.peer);
        });
        conn.on('close', () => removePeer(conn.peer));
    }

    // 3. 映像表示・指名共有
    function applyView(id, forceReset = false) {
        if (!id) return;
        currentViewId = id;
        const mv = document.getElementById('main-video');
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        if (stream) {
            if (forceReset) mv.srcObject = null;
            setTimeout(() => {
                mv.srcObject = stream;
                const name = (id.startsWith("T-ROOM-")) ? "先生" : (students[id]?.name || "自分");
                document.getElementById('view-label').innerText = name + " の画面";
                mv.play().catch(()=>{});
            }, forceReset ? 300 : 0);
        }
    }

    function setGlobalView(targetId) {
        const id = (targetId === 'teacher') ? peer.id : targetId;
        currentViewId = id;
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'sync', targetId: id }); });
        applyView(id, true);
    }

    function addRemoteVideo(id, stream) {
        remoteStreams[id] = stream;
        const isT = id.startsWith("T-ROOM-");
        if (myRole === 'teacher' && !isT) {
            if (document.getElementById(`card-${id}`)) return;
            const card = document.createElement('div');
            card.className = 'card'; card.id = `card-${id}`;
            card.innerHTML = `
                <video id="vid-${id}" autoplay playsinline></video>
                <div style="font-size:10px; padding:3px; text-align:center;">${students[id]?.name || '生徒'}</div>
                <div class="vol-bar" id="vol-${id}"></div>
                <button class="btn-mini btn-blue" onclick="setGlobalView('${id}')">指名</button>
            `;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            setupVol(stream, `vol-${id}`);
        }
        if (isT && (currentViewId === "" || currentViewId === id)) applyView(id);
    }

    async function updateMedia() {
        const mode = document.getElementById('mode-select').value;
        const s = await getStream(mode);
        if(!s) return;
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(c => {
                if (c.peerConnection) {
                    const senders = c.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind === 'video');
                    const as = senders.find(s => s.track && s.track.kind === 'audio');
                    if (vs) vs.replaceTrack(localStream.getVideoTracks()[0]);
                    if (as) as.replaceTrack(localStream.getAudioTracks()[0]);
                }
            });
        });
        if (currentViewId === peer.id) applyView(peer.id, true);
    }

    // 4. UI更新・ツール
    function updateListUI() {
        const container = document.getElementById('user-list-items');
        container.innerHTML = "";
        Object.keys(students).forEach(id => {
            const row = document.createElement('div');
            row.className = 'user-row';
            if (students[id].hand) row.classList.add('hand-raise');
            row.innerHTML = `<span>${students[id].hand?'✋ ':''}${students[id].name}</span><div class="status-dot active"></div>`;
            row.onclick = () => applyView(id, true);
            container.appendChild(row);
            // 先生側のカードにも反映
            const card = document.getElementById(`card-${id}`);
            if (card) card.classList.toggle('hand-raise', students[id].hand);
        });
    }

    function toggleHand() {
        isHandRaised = !isHandRaised;
        document.getElementById('hand-btn').classList.toggle('btn-red', isHandRaised);
        Object.values(connections).forEach(c => c.send({ type: 'hand', raised: isHandRaised }));
    }

    function toggleWhiteboard() {
        wbActive = !wbActive;
        document.getElementById('drawing-canvas').style.pointerEvents = wbActive ? 'auto' : 'none';
        addChat("System", "ホワイトボード: " + (wbActive?"ON":"OFF"));
    }

    function initWB() {
        const canvas = document.getElementById('drawing-canvas');
        wbCtx = canvas.getContext('2d');
        const box = document.querySelector('.broadcast-container');
        canvas.width = box.clientWidth; canvas.height = box.clientHeight;
        box.onmousedown = () => { if(wbActive) drawing = true; };
        box.onmousemove = (e) => {
            if(!drawing) return;
            wbCtx.fillStyle = "red";
            wbCtx.fillRect(e.offsetX, e.offsetY, 5, 5);
        };
        box.onmouseup = () => drawing = false;
    }

    function setupVol(stream, barId) {
        const at = stream.getAudioTracks()[0]; if (!at) return;
        const ctx = new AudioContext(); const src = ctx.createMediaStreamSource(new MediaStream([at]));
        const ans = ctx.createAnalyser(); src.connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const update = () => {
            if (!document.getElementById(barId)) return ctx.close();
            ans.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById(barId).style.width = Math.min(100, avg * 3) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function addChat(name, msg) {
        const box = document.getElementById('chat-msgs');
        const div = document.createElement('div');
        div.innerHTML = `<b style="color:var(--accent)">${name}:</b> ${msg}`;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        if (!input.value) return;
        addChat("自分", input.value);
        Object.values(connections).forEach(c => c.send({ type: 'chat', name: myName, msg: input.value }));
        input.value = "";
    }

    function sendReaction(emoji) {
        showReaction(emoji, "自分");
        Object.values(connections).forEach(c => c.send({ type: 'react', name: myName, emoji }));
    }

    function showReaction(emoji, name) {
        const layer = document.getElementById('reaction-layer');
        const div = document.createElement('div');
        div.style.position = 'absolute';
        div.style.left = Math.random() * 80 + 10 + "%";
        div.style.bottom = "0px";
        div.style.fontSize = "30px";
        div.style.transition = "3s";
        div.innerHTML = `<div>${emoji}</div><div style="font-size:10px;">${name}</div>`;
        layer.appendChild(div);
        setTimeout(() => { div.style.transform = "translateY(-300px)"; div.style.opacity = "0"; }, 100);
        setTimeout(() => div.remove(), 3000);
    }

    function broadcastList() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name, hand: students[id].hand }));
        list.push({ id: peer.id, name: myName, hand: false });
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'list', list }); });
    }

    function removePeer(id) {
        if (document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        delete connections[id]; delete students[id]; delete remoteStreams[id];
        updateListUI();
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('mic-btn').classList.toggle('btn-red', !t.enabled); }
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('cam-btn').classList.toggle('btn-red', !t.enabled); }
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            const s = document.getElementById('main-video').srcObject; if (!s) return;
            recordedChunks = []; recorder = new MediaRecorder(s);
            recorder.ondataavailable = e => recordedChunks.push(e.data);
            recorder.onstop = () => {
                const b = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'lesson.webm'; a.click();
            };
            recorder.start(); document.getElementById('rec-btn').innerText = "⏹ 停止";
        } else { recorder.stop(); document.getElementById('rec-btn').innerText = "🔴 録画"; }
    }

    function startTimer() {
        let sec = 0;
        setInterval(() => {
            sec++;
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function forcePlay() { document.querySelectorAll('video').forEach(v => v.play().catch(()=>{})); }
    window.addEventListener('beforeunload', () => {
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'exit' }); });
        if(peer) peer.destroy();
    });
</script>
</body></html>
