<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v10.0 (Privacy Mode)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --danger: #ff4757; --success: #2ecc71; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ログイン */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #444; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .sidebar { width: 280px; background: #111; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }

        /* メインビデオ (先生の画面用) */
        .broadcast-box { flex: 1.5; background: #000; position: relative; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #333; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #view-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent); font-size: 12px; }

        /* 監視グリッド (先生だけに表示) */
        .monitor-grid { flex: 1; display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: #050505; }
        .student-only-view { display: none !important; } /* 生徒側では隠す */
        
        .card { width: 160px; flex-shrink: 0; background: #222; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #333; }
        .card video { width: 100%; height: 90px; object-fit: cover; background: #000; }
        
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; padding: 10px; }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; }
        .vol-bar { height: 4px; background: var(--success); width: 0%; transition: 0.1s; }
        #chat-msgs { flex: 1; background: #000; border-radius: 8px; padding: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent)">EDU-ULTIMATE v10</h2>
        <p style="font-size:12px; color:#aaa; margin-top:-10px;">生徒同士の映像は見えません</p>
        <input type="text" id="user-name" placeholder="お名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-mode">
            <option value="camera">📷 カメラで開始</option>
            <option value="screen">💻 画面共有で開始</option>
        </select>
        <button class="btn-blue" onclick="startSession('teacher')">先生として開始</button>
        <div style="height:10px;"></div>
        <button class="btn-green" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div id="role-label" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="content-area">
        <div class="broadcast-box">
            <div id="view-label">先生の入室待ち...</div>
            <video id="main-video" autoplay playsinline></video>
        </div>
        <!-- 教員のみが使用する監視エリア -->
        <div id="monitor-grid" class="monitor-grid"></div>
    </div>

    <div class="sidebar">
        <div style="background:#222; padding:10px; border-radius:12px; text-align:center;">
            <video id="my-preview" autoplay playsinline muted style="width:100%; height:100px; object-fit:cover; border-radius:6px; background:#000;"></video>
            <div id="my-name" style="font-size:12px; margin:5px 0;">Name</div>
            <div style="display:flex; gap:5px;">
                <button id="mic-btn" class="btn-green" onclick="toggleMic()" style="flex:1; font-size:11px;">🎤 ON</button>
                <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="flex:1; font-size:11px;">📷 ON</button>
            </div>
            <select id="mode-select" style="font-size:11px; margin-top:8px;" onchange="updateMedia()">
                <option value="camera">📷 カメラ</option>
                <option value="screen">💻 画面共有</option>
            </select>
        </div>

        <div id="teacher-tools" class="hidden">
            <button class="btn-blue" style="margin-bottom:5px; font-size:12px;" onclick="handleRecord()" id="rec-btn">🔴 録画開始</button>
            <div id="qrcode" style="background:white; padding:5px; border-radius:8px; display:flex; justify-content:center;"></div>
        </div>

        <div id="chat-msgs"></div>
        <input type="text" id="chat-input" placeholder="チャット...">
        <button class="btn-red" style="width:100%; padding:5px; font-size:11px;" onclick="location.reload()">退室・リセット</button>
    </div>
</div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {};
    let recorder, recordedChunks = [];

    async function getStream(mode) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
        let video;
        if (mode === 'camera') {
            video = await navigator.mediaDevices.getUserMedia({ video: true });
        } else {
            video = await navigator.mediaDevices.getDisplayMedia({ video: true });
        }
        localStream = new MediaStream([...video.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
        document.getElementById('my-preview').srcObject = localStream;
        return localStream;
    }

    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || "ゲスト";
        roomID = document.getElementById('room-id').value;
        if (!roomID) return alert("IDを入力してください");

        await getStream(document.getElementById('start-mode').value);

        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(peerID);

        peer.on('open', id => {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('role-label').innerText = role.toUpperCase();
            document.getElementById('room-display').innerText = "ROOM: " + roomID;
            document.getElementById('my-name').innerText = myName + " (自分)";
            
            if (role === 'teacher') {
                document.getElementById('teacher-tools').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 70, height: 70 });
                document.getElementById('main-video').srcObject = localStream;
                document.getElementById('view-label').innerText = "あなたの授業画面";
            } else {
                // 生徒の場合、監視グリッドを物理的に消す
                document.getElementById('monitor-grid').classList.add('student-only-view');
                joinRoom();
            }
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => addRemoteVideo(call.peer, s));
        });

        peer.on('connection', conn => handleData(conn));
    }

    function joinRoom() {
        const tID = `T-ROOM-${roomID}`;
        const conn = peer.connect(tID);
        handleData(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            const call = peer.call(tID, localStream);
            call.on('stream', s => addRemoteVideo(tID, s));
        });
    }

    function handleData(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            if (data.type === 'join') {
                students[conn.peer] = { name: data.name };
                if (myRole === 'teacher') broadcastList();
                addChat("システム", data.name + "さんが参加しました");
            }
            if (data.type === 'list') {
                data.list.forEach(u => {
                    if (u.id !== peer.id && !connections[u.id]) {
                        const c = peer.connect(u.id);
                        handleData(c);
                        c.on('open', () => {
                            c.send({ type: 'hello', name: myName });
                            peer.call(u.id, localStream);
                        });
                    }
                });
            }
            if (data.type === 'hello') students[conn.peer] = { name: data.name };
            if (data.type === 'chat') addChat(data.name, data.msg);
            if (data.type === 'exit') location.reload();
        });
    }

    function broadcastList() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name }));
        list.push({ id: peer.id, name: myName });
        Object.values(connections).forEach(c => c.send({ type: 'list', list }));
    }

    function addRemoteVideo(id, stream) {
        const isT = id.startsWith("T-ROOM-");

        // 【生徒の場合】先生以外の映像は処理しない
        if (myRole === 'student' && !isT) return;

        // 【先生または生徒(先生の映像のみ)】
        if (isT) {
            const mv = document.getElementById('main-video');
            mv.srcObject = stream;
            document.getElementById('view-label').innerText = "先生の画面";
            mv.play().catch(() => { document.getElementById('view-label').innerText = "クリックして再生"; });
        }

        // 【先生の場合のみ】全生徒のカードをグリッドに表示
        if (myRole === 'teacher' && !isT) {
            if (document.getElementById(`card-${id}`)) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${id}`;
            card.innerHTML = `
                <video id="vid-${id}" autoplay playsinline></video>
                <div style="font-size:10px; padding:3px; text-align:center;">${students[id]?.name || '生徒'}</div>
                <div class="vol-bar" id="vol-${id}"></div>
                <button style="width:100%; font-size:9px; padding:2px;" onclick="spotlight('${id}')">拡大</button>
            `;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            setupVol(stream, `vol-${id}`);
        }
    }

    function spotlight(id) {
        const v = document.getElementById(`vid-${id}`);
        if (v) {
            document.getElementById('main-video').srcObject = v.srcObject;
            document.getElementById('view-label').innerText = students[id]?.name + " の画面";
        }
    }

    async function updateMedia() {
        const mode = document.getElementById('mode-select').value;
        await getStream(mode);
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(c => {
                if (c.peerConnection) {
                    const senders = c.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind === 'video');
                    const as = senders.find(s => s.track && s.track.kind === 'audio');
                    if (vs) vs.replaceTrack(localStream.getVideoTracks()[0]);
                    if (as) as.replaceTrack(localStream.getAudioTracks()[0]);
                }
            });
        });
    }

    function setupVol(stream, barId) {
        const at = stream.getAudioTracks()[0];
        if (!at) return;
        const ctx = new AudioContext();
        const src = ctx.createMediaStreamSource(new MediaStream([at]));
        const ans = ctx.createAnalyser();
        src.connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const update = () => {
            if (!document.getElementById(barId)) return ctx.close();
            ans.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById(barId).style.width = Math.min(100, avg * 3) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function addChat(name, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${name}:</b> ${msg}`;
        const box = document.getElementById('chat-msgs');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if (e.key === 'Enter' && e.target.value) {
            const msg = e.target.value;
            addChat("自分", msg);
            Object.values(connections).forEach(c => c.send({ type: 'chat', name: myName, msg }));
            e.target.value = "";
        }
    };

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('mic-btn').classList.toggle('btn-red', !t.enabled); }
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('cam-btn').classList.toggle('btn-red', !t.enabled); }
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            const s = document.getElementById('main-video').srcObject;
            if (!s) return;
            recordedChunks = [];
            recorder = new MediaRecorder(s);
            recorder.ondataavailable = e => recordedChunks.push(e.data);
            recorder.onstop = () => {
                const b = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'record.webm'; a.click();
            };
            recorder.start();
            document.getElementById('rec-btn').innerText = "⏹ 録画停止";
        } else {
            recorder.stop();
            document.getElementById('rec-btn').innerText = "🔴 録画開始";
        }
    }

    window.onclick = () => {
        document.querySelectorAll('video').forEach(v => v.play());
    };
</script>
</body></html>
