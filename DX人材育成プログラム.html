<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v34.0 HYPER-COMMANDER</title>
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00fbff;
            --accent-glow: rgba(0, 251, 255, 0.4);
            --danger: #ff0055;
            --success: #00ff88;
            --bg-deep: #010204;
            --bg-card: rgba(15, 20, 30, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --glass: blur(25px) saturate(160%);
            --sidebar-w: 380px;
            --header-h: 75px;
        }

        /* Reset & Base */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-deep); color: #f8f9fa; 
            font-family: 'Outfit', sans-serif; overflow: hidden; 
        }

        /* --- Setup Screen --- */
        #setup-layer {
            position: fixed; inset: 0; z-index: 99999;
            background: radial-gradient(circle at 30% 30%, #1a2a44 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .setup-card {
            background: var(--bg-card); backdrop-filter: var(--glass);
            padding: 50px; border-radius: 40px; border: 1px solid var(--border);
            width: 500px; text-align: center; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            border: 1px solid var(--accent-glow);
        }
        .setup-card h1 { font-size: 45px; font-weight: 900; color: var(--accent); margin: 0 0 10px; letter-spacing: -2px; }
        .setup-card p { color: #8a99af; margin-bottom: 40px; font-size: 15px; }
        .input-box { margin-bottom: 25px; text-align: left; }
        .input-box label { font-size: 12px; font-weight: 800; color: var(--accent); display: block; margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%; padding: 18px; border-radius: 15px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-main {
            width: 100%; padding: 20px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer;
            transition: 0.3s; font-size: 16px; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-t { background: var(--accent); color: #000; }
        .btn-s { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

        /* --- Application Layout --- */
        #app-root { display: none; width: 100%; height: 100%; flex-direction: column; }
        #app-root.active { display: flex; }

        header {
            height: var(--header-h); background: rgba(0,0,0,0.7); backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 0 35px; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .room-badge { background: rgba(0, 251, 255, 0.1); color: var(--accent); padding: 7px 18px; border-radius: 50px; font-size: 12px; font-weight: 900; border: 1px solid var(--accent); }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Stage (Main Viewport) */
        .stage-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .stage-view { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 1; transition: 0.5s; }
        #board-canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        #board-canvas.active { pointer-events: auto; cursor: crosshair; }

        /* Indicators */
        .hud { position: absolute; z-index: 100; pointer-events: none; }
        .hud-tl { top: 25px; left: 25px; }
        .hud-tr { top: 25px; right: 25px; }
        .info-pill { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 12px 22px; border-radius: 18px; display: flex; align-items: center; gap: 12px; }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        /* Video Shelf */
        .video-shelf {
            height: 180px; background: rgba(0,0,0,0.5); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 25px; gap: 20px; overflow-x: auto;
            scrollbar-width: none;
        }
        .video-shelf::-webkit-scrollbar { display: none; }
        .u-card {
            width: 200px; height: 145px; background: #0a101a; border-radius: 20px; flex-shrink: 0;
            overflow: hidden; border: 1px solid var(--border); position: relative; transition: 0.3s;
            cursor: pointer;
        }
        .u-card.active-spot { border: 2px solid var(--accent); box-shadow: 0 0 25px var(--accent-glow); transform: scale(1.02); }
        .u-card video { width: 100%; height: 110px; object-fit: cover; }
        .u-card .meta { font-size: 11px; font-weight: 800; text-align: center; padding: 6px; background: rgba(0,0,0,0.6); color: #fff; }
        .v-bar-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.05); }
        .v-bar-fill { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }

        /* Sidebar System */
        .sidebar { width: var(--sidebar-w); background: var(--bg-card); backdrop-filter: var(--glass); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-link { flex: 1; padding: 22px; background: none; border: none; color: #5c6d84; cursor: pointer; transition: 0.3s; font-size: 20px; }
        .tab-link.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(0,251,255,0.05); }

        .pane { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 25px; }
        .label-text { font-size: 12px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 18px; opacity: 0.8; }

        /* Action Grid */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .action-btn {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: #fff;
            padding: 18px 5px; border-radius: 18px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 10px; font-size: 11px; font-weight: 600; transition: 0.2s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); color: var(--accent); }
        .action-btn.active { background: var(--accent); color: #000; font-weight: 800; border-color: var(--accent); }
        .action-btn.danger.active { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* User Item */
        .user-row {
            background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .user-row:hover { border-color: var(--accent-glow); background: rgba(255,255,255,0.05); }
        .u-name-box { display: flex; align-items: center; gap: 12px; }
        .u-name { font-size: 14px; font-weight: 700; color: #fff; }
        .row-btns { display: flex; gap: 8px; }
        .row-btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 10px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-focus { background: var(--accent); color: #000; }
        .btn-screen { background: var(--success); color: #000; }

        /* Chat UI */
        #chat-view { flex: 1; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border); }
        .chat-bubble { font-size: 14px; line-height: 1.5; border-radius: 15px; padding: 10px 16px; background: rgba(255,255,255,0.06); width: fit-content; max-width: 85%; position: relative; }
        .chat-bubble.me { align-self: flex-end; background: rgba(0, 251, 255, 0.1); border: 1px solid var(--accent-glow); }
        .chat-bubble .sender { display: block; font-size: 10px; font-weight: 900; color: var(--accent); margin-bottom: 5px; text-transform: uppercase; }

        .chat-control { display: flex; gap: 12px; }
        .chat-control input { flex: 1; padding: 15px; border-radius: 12px; font-size: 15px; }

        /* Drawing Toolbar */
        #wb-toolbar {
            position: absolute; right: 25px; top: 120px; background: var(--bg-card);
            border: 2px solid var(--accent); border-radius: 20px; padding: 15px;
            display: none; flex-direction: column; gap: 18px; z-index: 1100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tool-btn { width: 35px; height: 35px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; transition: 0.2s; }
        .tool-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        .col-pick { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .col-pick.active { border-color: #fff; transform: scale(1.1); }

        /* Notification Toast */
        #toast-zone { position: fixed; top: 100px; left: 35px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--bg-card); border-left: 6px solid var(--accent); padding: 18px 30px; border-radius: 15px; font-size: 15px; font-weight: 600; animation: slideIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Effects */
        .fx-container { position: fixed; inset: 0; pointer-events: none; z-index: 99999; overflow: hidden; }
        .fx-item { position: absolute; font-size: 50px; bottom: -100px; animation: fly 3.5s linear forwards; }
        @keyframes fly { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 1. Setup Layer -->
<div id="setup-layer">
    <div class="setup-card">
        <h1>EDU-ULTIMATE</h1>
        <p>Quantum-Grade Collaborative Classroom</p>
        
        <div class="input-box">
            <label>Identification Name</label>
            <input type="text" id="in-name" placeholder="Ex: Professor Smith">
        </div>
        <div class="input-box">
            <label>Nexus Room ID</label>
            <input type="number" id="in-room" placeholder="Enter 4-digit ID">
        </div>

        <button class="btn-main btn-t" onclick="startNexus('teacher')">Initialize as Teacher</button>
        <button class="btn-main btn-s" onclick="startNexus('student')">Connect as Student</button>
    </div>
</div>

<!-- 2. Application UI -->
<div id="app-root">
    <header>
        <div class="logo-area">
            <i class="fas fa-atom" style="color:var(--accent); font-size:28px;"></i>
            <span style="font-weight:900; letter-spacing:2px; font-size:22px; color:var(--accent)">ULTIMATE v34</span>
            <div class="room-badge" id="display-room">ROOM: ----</div>
        </div>
        <div style="display:flex; align-items:center; gap:30px;">
            <div id="rec-status" class="hidden" style="color:var(--danger); font-weight:900; font-size:14px; display:flex; align-items:center; gap:8px;">
                <div class="live-dot"></div> RECORDING
            </div>
            <div id="digital-clock" style="font-family:'JetBrains Mono'; font-size:24px; font-weight:700; color:#fff;">00:00:00</div>
            <button class="action-btn danger" style="padding:10px 25px; border:none; border-radius:12px; font-size:13px;" onclick="location.reload()">TERMINATE</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Main Stage -->
        <div class="stage-area">
            <div class="stage-view" id="stage-wrapper" onclick="forceUnlock()">
                <div class="hud hud-tl">
                    <div class="info-pill">
                        <div class="live-dot" style="background:var(--success); animation:none;"></div>
                        <span id="target-view-name" style="font-weight:900; font-size:13px; text-transform:uppercase;">Broadcasting: Standby</span>
                    </div>
                </div>
                
                <canvas id="board-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>

                <div id="wb-toolbar">
                    <div class="tool-btn active" onclick="updateTool('pen', this)"><i class="fas fa-pencil-alt"></i></div>
                    <div class="tool-btn" onclick="updateTool('rect', this)"><i class="fas fa-vector-square"></i></div>
                    <div class="tool-btn" onclick="updateTool('eraser', this)"><i class="fas fa-eraser"></i></div>
                    <hr style="border:none; border-top:1px solid var(--border); margin:5px 0;">
                    <div class="col-pick active" onclick="updateCol('#00fbff', this)" style="background:#00fbff"></div>
                    <div class="col-pick" onclick="updateCol('#ff0055', this)" style="background:#ff0055"></div>
                    <div class="col-pick" onclick="updateCol('#00ff88', this)" style="background:#00ff88"></div>
                    <div class="tool-btn" onclick="wipeBoard()" style="color:var(--danger); margin-top:10px;"><i class="fas fa-trash-alt"></i></div>
                </div>
            </div>

            <div class="video-shelf" id="monitor-grid">
                <!-- Self Monitor -->
                <div class="u-card" id="card-self">
                    <video id="preview-self" autoplay playsinline muted></video>
                    <div class="meta">LOCAL (YOU)</div>
                    <div class="v-bar-bg"><div class="v-bar-fill" id="meter-self"></div></div>
                </div>
            </div>
        </div>

        <!-- Right Side Panel -->
        <div class="sidebar">
            <div class="nav-tabs">
                <button class="tab-link active" onclick="switchPane('ctrl', this)"><i class="fas fa-gamepad"></i></button>
                <button class="tab-link" onclick="switchPane('chat', this)"><i class="fas fa-comment-alt"></i></button>
                <button class="tab-link" onclick="switchPane('users', this)"><i class="fas fa-user-friends"></i></button>
            </div>

            <div class="pane" id="pane-ctrl">
                <div id="host-exclusive" class="hidden">
                    <div class="label-text">Nexus Commander</div>
                    <div class="grid-3">
                        <button class="action-btn" onclick="broadcastMic(false)"><i class="fas fa-microphone-slash"></i><span>Mute All</span></button>
                        <button class="action-btn" onclick="broadcastMic(true)"><i class="fas fa-microphone"></i><span>Open All</span></button>
                        <button class="action-btn" id="wb-toggle" onclick="toggleNexusBoard()"><i class="fas fa-chalkboard"></i><span>Board</span></button>
                        <button class="action-btn" id="rec-btn" onclick="toggleNexusRec()"><i class="fas fa-circle"></i><span>Record</span></button>
                        <button class="action-btn" onclick="globalSpotlight(peer.id)"><i class="fas fa-user-shield"></i><span>Focus Me</span></button>
                        <button class="action-btn" onclick="fireNexusFX('⭐')"><i class="fas fa-award"></i><span>Reward</span></button>
                    </div>
                </div>

                <div class="label-text">User Terminal</div>
                <div class="grid-3">
                    <button class="action-btn" id="mic-btn" onclick="toggleMyMic()"><i class="fas fa-microphone"></i><span>Mic</span></button>
                    <button class="action-btn" id="cam-btn" onclick="toggleMyCam()"><i class="fas fa-video"></i><span>Cam</span></button>
                    <button class="action-btn" id="screen-btn" onclick="swapMyScreen()"><i class="fas fa-desktop"></i><span>Desktop</span></button>
                </div>

                <div style="margin-top:20px; padding:20px; background:rgba(0,0,0,0.3); border-radius:20px; border:1px solid var(--border);">
                    <div class="label-text" style="margin-bottom:10px;">Quantum Reaction</div>
                    <div style="display:flex; justify-content:space-between; font-size:30px;">
                        <span style="cursor:pointer;" onclick="fireNexusFX('👏')">👏</span>
                        <span style="cursor:pointer;" onclick="fireNexusFX('🔥')">🔥</span>
                        <span style="cursor:pointer;" onclick="fireNexusFX('👍')">👍</span>
                        <span style="cursor:pointer;" onclick="fireNexusFX('💯')">💯</span>
                    </div>
                </div>
            </div>

            <div class="pane hidden" id="pane-chat">
                <div id="chat-view"></div>
                <div class="chat-control">
                    <input type="text" id="chat-input" placeholder="Secure transmission..." onkeypress="if(event.key==='Enter')dispatchChat()">
                    <button class="action-btn" style="width:60px; background:var(--accent); color:#000;" onclick="dispatchChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="pane hidden" id="pane-users">
                <div class="label-text">Participant Directory</div>
                <div id="user-roster"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-zone"></div>
<div class="fx-container" id="fx-root"></div>

<script>
/**
 * EDU-ULTIMATE v34.0 - Hyper-Commander Logic Engine
 */
let peer, localStream, role, myName, roomID;
let conns = {}, remoteStreams = {}, metaData = {};
let micOn = false, camOn = true, wbOn = false, screenOn = false;
let canvas, ctx, painting = false, tool = 'pen', color = '#00fbff', lastPos = {x:0, y:0};
let audioCtx, recorder, chunks = [];

async function startNexus(r) {
    role = r;
    myName = document.getElementById('in-name').value || (role==='teacher'?'Teacher':'Student');
    roomID = document.getElementById('in-room').value;
    if(!roomID || roomID.length < 4) return alert("Room ID must be 4 digits.");

    // 初期ストリーム取得
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    localStream.getAudioTracks().forEach(t => t.enabled = false);
    
    const pid = (role === 'teacher') ? `NEXUS-HOST-${roomID}` : `NEXUS-STUDENT-${roomID}-${Math.random().toString(36).substr(2,7)}`;
    peer = new Peer(pid);

    peer.on('open', id => {
        document.getElementById('setup-layer').classList.add('hidden');
        document.getElementById('app-root').classList.add('active');
        document.getElementById('display-room').innerText = `ID: ${roomID}`;
        document.getElementById('preview-self').srcObject = localStream;

        initVolumeMeter(localStream, 'meter-self');
        runClock();

        if(role === 'teacher'){
            document.getElementById('host-exclusive').classList.remove('hidden');
            initNexusCanvas();
            updateGlobalView(peer.id);
        } else {
            connectToNexusHost();
        }
        notifyToast("NEXUS LINKED", `Identity verified: ${myName}`);
    });

    peer.on('call', call => {
        call.answer(localStream);
        call.on('stream', stream => {
            remoteStreams[call.peer] = stream;
            createMonitorCard(call.peer, stream);
            if(call.peer.includes('HOST')) updateGlobalView(call.peer);
        });
    });

    peer.on('connection', c => setupDataChannel(c));
}

function connectToNexusHost() {
    const hostID = `NEXUS-HOST-${roomID}`;
    const c = peer.connect(hostID);
    setupDataChannel(c);
    c.on('open', () => {
        c.send({type:'nexus-join', name:myName});
        peer.call(hostID, localStream);
    });
}

function setupDataChannel(c) {
    conns[c.peer] = c;
    c.on('data', data => {
        switch(data.type) {
            case 'nexus-join':
                metaData[c.peer] = {name:data.name};
                if(role === 'teacher') {
                    broadcastDirectory();
                    peer.call(c.peer, localStream);
                }
                refreshRoster();
                break;
            case 'nexus-dir':
                data.list.forEach(u => {
                    if(u.id !== peer.id && !conns[u.id]){
                        metaData[u.id] = {name:u.name};
                        const nc = peer.connect(u.id);
                        setupDataChannel(nc);
                        nc.on('open', () => {
                            nc.send({type:'nexus-hello', name:myName});
                            peer.call(u.id, localStream);
                        });
                    }
                });
                refreshRoster();
                break;
            case 'nexus-hello':
                metaData[c.peer] = {name:data.name};
                refreshRoster();
                break;
            case 'nexus-chat': renderChat(data.name, data.msg, false); break;
            case 'nexus-draw': remoteDrawBoard(data); break;
            case 'nexus-clear': ctx.clearRect(0,0,canvas.width, canvas.height); break;
            case 'nexus-mic-cmd': forceMic(data.val); break;
            case 'nexus-focus': updateGlobalView(data.id); break;
            case 'nexus-fx': runEmojiFX(data.emoji); break;
            // 生徒側の画面共有を「強制」で起動するコマンド
            case 'nexus-force-screen': beginForcedScreenShare(); break;
        }
    });
    c.on('close', () => {
        delete conns[c.peer];
        const card = document.getElementById(`card-${c.peer}`);
        if(card) card.remove();
        refreshRoster();
    });
}

/** 
 * Teacher Control: Global Focus
 */
function globalSpotlight(pid) {
    if(role !== 'teacher') return;
    updateGlobalView(pid);
    transmit({type:'nexus-focus', id:pid});
    notifyToast("QUANTUM FOCUS", "全生徒の視点を同期しました");
}

function updateGlobalView(id) {
    const mainVid = document.getElementById('main-video');
    const stream = (id === peer.id) ? localStream : remoteStreams[id];
    if(stream) {
        mainVid.srcObject = stream;
        mainVid.muted = (id === peer.id);
        const nameLabel = id.includes('HOST') ? "PROFESSOR" : (metaData[id]?.name || "PARTICIPANT");
        document.getElementById('target-view-name').innerText = `Link Active: ${nameLabel}`;
    }
    document.querySelectorAll('.u-card').forEach(c => c.classList.remove('active-spot'));
    const target = document.getElementById(id === peer.id ? 'card-self' : `card-${id}`);
    if(target) target.classList.add('active-spot');
}

/** 
 * Teacher Control: Force Student Screen Share
 */
function forceStudentShare(targetID) {
    if(role !== 'teacher') return;
    const c = conns[targetID];
    if(c) {
        c.send({type:'nexus-force-screen'});
        notifyToast("SCREEN COMMAND", "生徒の端末に共有コマンドを送信しました");
    }
}

// 生徒側で呼ばれる強制実行関数
async function beginForcedScreenShare() {
    try {
        // ブラウザの仕様上、ここでのみ「ソース選択」ダイアログが出ますが、
        // アプリケーション独自の「共有しますか？」という確認はスキップされます。
        const ss = await navigator.mediaDevices.getDisplayMedia({video:true});
        const st = ss.getVideoTracks()[0];
        const ct = localStream.getVideoTracks()[0];
        
        localStream.removeTrack(ct);
        localStream.addTrack(st);
        
        Object.values(peer.connections).forEach(pcs => {
            pcs.forEach(pc => {
                if(pc.type === 'media') {
                    const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(snd) snd.replaceTrack(st);
                }
            });
        });

        document.getElementById('preview-self').srcObject = localStream;
        screenOn = true;
        document.getElementById('screen-btn').classList.add('active');

        st.onended = () => terminateScreenShare();
        notifyToast("NEXUS SHARED", "デスクトップの共有を開始しました");
    } catch(e) {
        notifyToast("ERROR", "共有がキャンセルまたは拒否されました");
    }
}

async function terminateScreenShare() {
    const st = localStream.getVideoTracks()[0];
    const ncam = await navigator.mediaDevices.getUserMedia({video:true});
    const nt = ncam.getVideoTracks()[0];
    
    localStream.removeTrack(st);
    localStream.addTrack(nt);
    st.stop();

    Object.values(peer.connections).forEach(pcs => {
        pcs.forEach(pc => {
            if(pc.type === 'media') {
                const snd = pc.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if(snd) snd.replaceTrack(nt);
            }
        });
    });

    document.getElementById('preview-self').srcObject = localStream;
    screenOn = false;
    document.getElementById('screen-btn').classList.remove('active');
}

/** Whiteboard Nexus **/
function initNexusCanvas() {
    canvas = document.getElementById('board-canvas');
    ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.onresize = resize;

    const fetchPos = e => ({ x: e.offsetX / canvas.width, y: e.offsetY / canvas.height });

    canvas.onmousedown = e => { if(!wbOn) return; painting = true; lastPos = fetchPos(e); };
    canvas.onmousemove = e => {
        if(!painting) return;
        const cur = fetchPos(e);
        const d = { type:'nexus-draw', t:tool, f:lastPos, to:cur, c:color };
        remoteDrawBoard(d);
        transmit(d);
        lastPos = cur;
    };
    canvas.onmouseup = () => painting = false;
}

function remoteDrawBoard(d) {
    ctx.strokeStyle = d.c; ctx.lineWidth = d.t==='eraser'? 45 : 4; ctx.lineCap = 'round';
    ctx.globalCompositeOperation = d.t==='eraser' ? 'destination-out' : 'source-over';
    
    const w = canvas.width, h = canvas.height;
    if(d.t === 'pen' || d.t === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(d.f.x * w, d.f.y * h);
        ctx.lineTo(d.to.x * w, d.to.y * h);
        ctx.stroke();
    } else if(d.t === 'rect') {
        ctx.strokeRect(d.f.x * w, d.f.y * h, (d.to.x - d.f.x) * w, (d.to.y - d.f.y) * h);
    }
}

function toggleNexusBoard() {
    wbOn = !wbOn;
    document.getElementById('board-canvas').classList.toggle('active', wbOn);
    document.getElementById('wb-toolbar').style.display = wbOn ? 'flex' : 'none';
    document.getElementById('wb-toggle').classList.toggle('active', wbOn);
}

function wipeBoard() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    transmit({type:'nexus-clear'});
}

/** Core UI & Logic **/
function createMonitorCard(id, stream) {
    if(document.getElementById(`card-${id}`)) return;
    const grid = document.getElementById('monitor-grid');
    const card = document.createElement('div');
    card.className = 'u-card'; card.id = `card-${id}`;
    card.onclick = () => { if(role === 'teacher') globalSpotlight(id); };
    card.innerHTML = `<video id="vid-${id}" autoplay playsinline></video>
                     <div class="meta">${metaData[id]?.name || 'Nexus Node'}</div>
                     <div class="v-bar-bg"><div class="v-bar-fill" id="met-${id}"></div></div>`;
    grid.appendChild(card);
    document.getElementById(`vid-${id}`).srcObject = stream;
    initVolumeMeter(stream, `met-${id}`);
}

function refreshRoster() {
    const r = document.getElementById('user-roster');
    r.innerHTML = "";
    Object.keys(conns).forEach(id => {
        const item = document.createElement('div');
        item.className = 'user-row';
        const btns = (role === 'teacher') ? 
            `<div class="row-btns">
                <button class="row-btn btn-focus" onclick="globalSpotlight('${id}')">Focus</button>
                <button class="row-btn btn-screen" onclick="forceStudentShare('${id}')">Get Screen</button>
            </div>` : "";
        item.innerHTML = `<div class="u-name-box"><div class="live-dot" style="background:var(--success); animation:none;"></div><span class="u-name">${metaData[id]?.name || 'User'}</span></div>${btns}`;
        r.appendChild(item);
    });
}

function initVolumeMeter(s, bid) {
    try {
        if(!audioCtx) audioCtx = new AudioContext();
        const src = audioCtx.createMediaStreamSource(s);
        const alz = audioCtx.createAnalyser(); alz.fftSize = 256;
        src.connect(alz);
        const d = new Uint8Array(alz.frequencyBinCount);
        const l = () => {
            const el = document.getElementById(bid);
            if(!el) return;
            alz.getByteFrequencyData(d);
            const a = d.reduce((p,c)=>p+c)/d.length;
            el.style.width = Math.min(100, a*2.5) + "%";
            requestAnimationFrame(l);
        };
        l();
    } catch(e){}
}

function notifyToast(t, m) {
    const z = document.getElementById('toast-zone');
    const el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = `<span style="color:var(--accent); font-weight:900;">[ ${t} ]</span><br>${m}`; z.appendChild(el);
    setTimeout(() => el.remove(), 4500);
}

function transmit(data) {
    Object.values(conns).forEach(c => { if(c.open) c.send(data); });
}

function broadcastDirectory() {
    const list = Object.keys(metaData).map(id => ({id, name:metaData[id].name}));
    list.push({id:peer.id, name:myName});
    transmit({type:'nexus-dir', list});
}

function dispatchChat() {
    const i = document.getElementById('chat-input'); if(!i.value) return;
    renderChat(myName, i.value, true);
    transmit({type:'nexus-chat', name:myName, msg:i.value});
    i.value = "";
}

function renderChat(name, msg, isMe) {
    const v = document.getElementById('chat-view');
    const d = document.createElement('div');
    d.className = `chat-bubble ${isMe?'me':''}`;
    d.innerHTML = `<span class="sender">${name}</span>${msg}`;
    v.appendChild(d); v.scrollTop = v.scrollHeight;
}

function toggleMyMic() {
    micOn = !micOn; forceMic(micOn);
    document.getElementById('mic-btn').classList.toggle('active', micOn);
}
function forceMic(v) {
    localStream.getAudioTracks().forEach(t => t.enabled = v);
    micOn = v;
}
function toggleMyCam() {
    camOn = !camOn; localStream.getVideoTracks().forEach(t => t.enabled = camOn);
    document.getElementById('cam-btn').classList.toggle('active', camOn);
}

function runClock() {
    setInterval(() => {
        const d = new Date();
        document.getElementById('digital-clock').innerText = d.toTimeString().split(' ')[0];
    }, 1000);
}

function switchPane(p, b) {
    document.querySelectorAll('.pane').forEach(el => el.classList.add('hidden'));
    document.getElementById(`pane-${p}`).classList.remove('hidden');
    document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
    b.classList.add('active');
}

function forceUnlock() { if(audioCtx) audioCtx.resume(); document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{})); }
function updateTool(t, el) { tool = t; document.querySelectorAll('.tool-btn').forEach(d=>d.classList.remove('active')); el.classList.add('active'); }
function updateCol(c, el) { color = c; document.querySelectorAll('.col-pick').forEach(d=>d.classList.remove('active')); el.classList.add('active'); }

function fireNexusFX(emoji) {
    runEmojiFX(emoji);
    transmit({type:'nexus-fx', emoji});
}
function runEmojiFX(e) {
    const r = document.getElementById('fx-root');
    const el = document.createElement('div');
    el.innerText = e; el.className = 'fx-item';
    el.style.left = Math.random()*85+5+'vw';
    r.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

/** Broadcast controls */
function broadcastMic(v) { transmit({type:'nexus-mic-cmd', val:v}); forceMic(v); }

/** Recorder Management */
function toggleNexusRec() {
    if(!recorder || recorder.state === 'inactive') {
        const s = document.getElementById('main-video').srcObject; if(!s) return;
        recorder = new MediaRecorder(s);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const b = new Blob(chunks, {type:'video/webm'});
            const u = URL.createObjectURL(b);
            const a = document.createElement('a'); a.href = u; a.download = `NEXUS-LECTURE-${Date.now()}.webm`; a.click();
        };
        recorder.start();
        document.getElementById('rec-status').classList.remove('hidden');
        document.getElementById('rec-btn').classList.add('active');
    } else {
        recorder.stop();
        document.getElementById('rec-status').classList.add('hidden');
        document.getElementById('rec-btn').classList.remove('active');
    }
}

async function swapMyScreen() {
    if(!screenOn) await beginForcedScreenShare();
    else await terminateScreenShare();
}
