<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v4.2 Spotlight Share (Kick Function Enhanced)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --private: #9b59b6; --monitor-height: 30vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 360px; border: 1px solid #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        .panel { background: #222; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        .btn-primary { background: #0097e6; color: white; padding: 10px; width: 100%; }
        .btn-success { background: var(--success); color: white; padding: 10px; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 10px; width: 100%; }
        .btn-warning { background: var(--warning); color: black; padding: 10px; width: 100%; }
        .btn-mini { padding: 4px 8px; font-size: 10px; margin: 2px; }

        .monitor-grid { height: var(--monitor-height); background: #111; border-top: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; position: relative; }
        .student-card video { width: 100%; background: #000; border-radius: 4px; }
        
        .hidden { display: none !important; }
        .status-tag { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:15px;">EDU-ULTIMATE v4.2</h2>
        <input type="text" id="user-name" placeholder="名前を入力">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-media-type"><option value="camera">📷 カメラで開始</option><option value="screen">💻 画面共有で開始</option></select>
        <button class="btn-primary" style="margin-top:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <span id="broadcast-status" class="status-tag" style="background:#444;">配信: 待機中</span>
    </div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">自分</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            <div style="margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button id="mic-btn" class="btn-success" onclick="toggleMic()" style="font-size:11px;">🎤 ON</button>
                <button id="cam-btn" class="btn-success" onclick="toggleCam()" style="font-size:11px;">📷 ON</button>
            </div>
            <select id="switch-media" onchange="changeMyMedia()" style="width:100%; margin-top:8px; background:#000; color:white; border:1px solid #444; font-size:11px; padding:5px;">
                <option value="camera">📷 カメラに切替</option>
                <option value="screen">💻 画面共有に切替</option>
            </select>
            <button id="reset-broadcast-btn" class="btn-warning hidden" style="margin-top:8px; font-size:11px;" onclick="resetToTeacherStream()">🔄 自分の配信に戻す</button>
        </div>

        <!-- 先生専用ツール -->
        <div id="teacher-tools" class="hidden">
            <div class="panel">
                <div class="panel-title">管理者コマンド</div>
                <button class="btn-danger" style="font-size:11px; margin-bottom:10px;" onclick="forceExitAll()">⚠️ 全生徒を強制退出</button>
                <div id="qrcode" style="background:white; padding:5px; border-radius:5px; text-align:center; margin-top:10px;"></div>
            </div>
        </div>

        <div class="panel" style="flex:1; display:flex; flex-direction:column;">
            <div class="panel-title">チャット</div>
            <div id="chat-messages" style="flex:1; overflow-y:auto; font-size:11px; background:#111; padding:5px; margin-bottom:5px;"></div>
            <input type="text" id="chat-input" placeholder="メッセージ..." style="width:100%; background:#000; color:white; border:1px solid #444; font-size:11px; padding:5px; box-sizing:border-box;">
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container">
            <div style="position:absolute; top:10px; left:10px; z-index:10;"><span style="background:red; color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">● LIVE</span></div>
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let connections = {};
    let students = {};
    let isSpotlighting = false;
    let audioCtx;

    async function start(role) {
        myName = document.getElementById('user-name').value || "ゲスト";
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("部屋IDを入力してください");
        myRole = role;

        try {
            await getMedia(document.getElementById('start-media-type').value);
            document.getElementById('setup-screen').classList.add('hidden');

            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });

            peer.on('connection', conn => {
                connections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => {
                    const card = document.getElementById('card-'+conn.peer);
                    if(card) card.remove();
                    delete students[conn.peer];
                    delete connections[conn.peer];
                });
            });
        } catch(e) { alert("メディア取得失敗"); }
    }

    async function getMedia(type) {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        const micStream = await navigator.mediaDevices.getUserMedia({audio:true});
        let videoStream;
        let finalStream;

        if(type === 'camera') {
            videoStream = await navigator.mediaDevices.getUserMedia({video:true});
            document.getElementById('my-video').style.transform = "scaleX(-1)";
            finalStream = new MediaStream([...videoStream.getVideoTracks(), ...micStream.getAudioTracks()]);
        } else {
            videoStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
            document.getElementById('my-video').style.transform = "none";
            const systemAudioTracks = videoStream.getAudioTracks();
            if (systemAudioTracks.length > 0) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();
                audioCtx.createMediaStreamSource(micStream).connect(dest);
                audioCtx.createMediaStreamSource(new MediaStream([systemAudioTracks[0]])).connect(dest);
                finalStream = new MediaStream([videoStream.getVideoTracks()[0], dest.stream.getAudioTracks()[0]]);
            } else {
                finalStream = new MediaStream([videoStream.getVideoTracks()[0], micStream.getAudioTracks()[0]]);
            }
        }
        localStream = finalStream;
        document.getElementById('my-video').srcObject = localStream;
        if(myRole === 'teacher' && !isSpotlighting) {
            document.getElementById('main-broadcast-video').srcObject = localStream;
        }
    }

    async function changeMyMedia() {
        const type = document.getElementById('switch-media').value;
        await getMedia(type);
        if(!isSpotlighting) replaceAllTracks(localStream);
    }

    function replaceAllTracks(stream) {
        const vt = stream.getVideoTracks()[0];
        const at = stream.getAudioTracks()[0];
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(call => {
                if(call.peerConnection) {
                    const senders = call.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind==='video');
                    const as = senders.find(s => s.track && s.track.kind==='audio');
                    if(vs && vt) vs.replaceTrack(vt);
                    if(as && at) as.replaceTrack(at);
                }
            });
        });
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-area').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('broadcast-status').innerText = "配信: 先生の画面";
        new QRCode(document.getElementById("qrcode"), { text: location.href.split('?')[0] + "?id=" + currentRid, width: 80, height: 80 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => conn.send({type:'JOIN', name:myName}));
        // 先生からのコマンドを受け取れるようにする
        conn.on('data', data => handleData(tid, data));
        const call = peer.call(tid, localStream);
        call.on('stream', s => { document.getElementById('main-broadcast-video').srcObject = s; });
    }

    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline></video>
            <div id="name-label-${id}" style="font-size:10px; margin:5px 0; font-weight:bold; color:var(--accent);">
                ${students[id]?.name || '接続中...'}
            </div>
            <div style="display:flex; gap:2px;">
                <button class="btn-mini btn-warning" onclick="spotlightStudent('${id}')">クラスに共有</button>
                <button class="btn-mini btn-danger" onclick="kickStudent('${id}')">追放</button>
            </div>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
    }

    function spotlightStudent(id) {
        const studentVideo = document.getElementById('v-'+id);
        if(!studentVideo) return;
        isSpotlighting = true;
        const studentStream = studentVideo.srcObject;
        document.getElementById('main-broadcast-video').srcObject = studentStream;
        document.getElementById('reset-broadcast-btn').classList.remove('hidden');
        document.getElementById('broadcast-status').innerText = "配信: 生徒の画面共有中";
        document.getElementById('broadcast-status').style.background = "var(--warning)";
        document.getElementById('broadcast-status').style.color = "black";
        replaceAllTracks(studentStream);
    }

    function resetToTeacherStream() {
        isSpotlighting = false;
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('reset-broadcast-btn').classList.add('hidden');
        document.getElementById('broadcast-status').innerText = "配信: 先生の画面";
        document.getElementById('broadcast-status').style.background = "#444";
        document.getElementById('broadcast-status').style.color = "white";
        replaceAllTracks(localStream);
    }

    // ★重要: データ受信処理
    function handleData(id, data) {
        if(data.type === 'JOIN') {
            students[id] = {name: data.name};
            const label = document.getElementById('name-label-' + id);
            if(label) label.innerText = data.name;
        }
        if(data.type === 'CHAT') addChat(data.name, data.msg);
        
        // ★追放コマンドを受けた時の処理
        if(data.type === 'EXIT') {
            alert("管理者によって退出させられました。");
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            if(peer) peer.destroy();
            location.reload(); // 強制リロードして初期画面に戻す
        }
    }

    // ★特定の生徒を追放
    function kickStudent(id) {
        if(confirm("この生徒を退出させますか？")) {
            if(connections[id]) {
                connections[id].send({type:'EXIT'});
                // 数秒後に画面から消す（生徒側がリロードするまでの予備）
                setTimeout(() => {
                    const card = document.getElementById('card-'+id);
                    if(card) card.remove();
                }, 500);
            }
        }
    }

    // ★全員を強制退出
    function forceExitAll() {
        if(confirm("全生徒を強制的に退出させますか？")) {
            Object.values(connections).forEach(c => {
                c.send({type:'EXIT'});
            });
        }
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('mic-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
            document.getElementById('mic-btn').innerText = t.enabled ? '🎤 ON' : '🔇 OFF';
        }
    }

    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('cam-btn').className = t.enabled ? 'btn-success' : 'btn-danger';
            document.getElementById('cam-btn').innerText = t.enabled ? '📷 ON' : '📷 OFF';
        }
    }

    function addChat(name, msg) {
        const div = document.createElement('div'); div.innerHTML = `<b>${name}:</b> ${msg}`;
        const box = document.getElementById('chat-messages');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if(e.key === 'Enter' && e.target.value) {
            const msg = e.target.value;
            addChat("自分", msg);
            Object.values(connections).forEach(c => c.send({type:'CHAT', name:myName, msg:msg}));
            e.target.value = "";
        }
    }
</script>
</body>
</html>
