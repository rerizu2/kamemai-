<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v31.0 FINAL ROLE-FIXED</title>
    
    <!-- 外部ライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent: #00fbff;
            --bg: #030508;
            --panel: rgba(15, 20, 30, 0.9);
            --panel-dark: rgba(5, 8, 12, 0.98);
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --text: #f8f9fa;
            --text-dim: #a0aec0;
            --border: rgba(255, 255, 255, 0.1);
            --sidebar-width: 350px;
            --header-height: 70px;
            --glass: blur(20px);
        }

        * { box-sizing: border-box; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* セットアップ画面 */
        #setup-screen { position: fixed; inset: 0; z-index: 1000000; background: radial-gradient(circle, #112233 0%, #000 100%); display: flex; justify-content: center; align-items: center; }
        .setup-card { background: var(--panel-dark); padding: 40px; border-radius: 30px; width: 450px; border: 1px solid var(--border); text-align: center; }
        .setup-card h1 { font-size: 32px; color: var(--accent); margin-bottom: 30px; }
        input, select { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; margin-bottom: 20px; font-size: 16px; }
        .btn-start { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-teacher { background: var(--accent); color: #000; margin-bottom: 15px; }
        .btn-student { background: transparent; color: var(--accent); border: 2px solid var(--accent); }

        /* メインUI */
        #main-app { display: none; width: 100%; height: 100%; flex-direction: column; }
        #main-app.active { display: flex; }
        header { height: var(--header-height); background: rgba(0,0,0,0.5); backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .room-badge { border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 12px; color: var(--accent); font-weight: bold; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .stage-wrapper { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .stage { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #main-video { width: 100%; height: 100%; object-fit: contain; z-index: 10; }
        .stage-overlay { position: absolute; top: 20px; left: 20px; z-index: 500; }
        .view-indicator { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 15px; border: 1px solid var(--accent); font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .live-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #wb-canvas { position: absolute; inset: 0; z-index: 200; pointer-events: none; }
        #wb-canvas.active { pointer-events: auto; cursor: crosshair; }

        .monitor-shelf { height: 180px; background: #05070a; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 15px; overflow-x: auto; }
        .user-card { width: 180px; height: 140px; background: var(--panel); border-radius: 20px; flex-shrink: 0; border: 1px solid var(--border); overflow: hidden; }
        .user-card video { width: 100%; height: 100px; object-fit: cover; }
        .user-card .info { padding: 5px; font-size: 11px; text-align: center; font-weight: bold; }

        /* サイドバー */
        .sidebar { width: var(--sidebar-width); background: var(--panel-dark); backdrop-filter: var(--glass); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; }
        .panel { background: rgba(255,255,255,0.03); border-radius: 25px; padding: 20px; border: 1px solid var(--border); }
        .panel-header { margin-bottom: 15px; font-size: 11px; color: var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; font-weight: bold; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .icon-btn.active { background: var(--accent); color: black; }
        .icon-btn.danger { color: var(--danger); }
        .icon-btn.danger.active { background: var(--danger); color: white; }

        /* リストとチャット */
        #peer-list { display: flex; flex-direction: column; gap: 8px; }
        .peer-item { background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        
        #chat-window { flex: 1; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; min-height: 200px; }
        .msg b { color: var(--accent); }
        .chat-input-wrapper { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-wrapper input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #000; color: white; }

        /* 特殊要素 */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--panel-dark); border-left: 4px solid var(--accent); padding: 15px 25px; border-radius: 12px; color: white; transform: translateX(120%); transition: 0.5s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { transform: translateX(0); }

        #wb-toolbar { position: absolute; top: 20px; right: 20px; background: var(--panel-dark); padding: 10px; border-radius: 15px; display: none; flex-direction: column; gap: 15px; border: 1px solid var(--accent); z-index: 700; }
        .wb-tool { cursor: pointer; color: var(--text-dim); text-align: center; font-size: 18px; }
        .wb-tool.active { color: var(--accent); }

        .vol-meter { height: 4px; background: #222; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .vol-bar { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }

        #rec-indicator { position: absolute; top: 20px; right: 20px; background: rgba(255, 71, 87, 0.2); border: 1px solid var(--danger); color: var(--danger); padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; display: none; align-items: center; gap: 5px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 1. セットアップ -->
<div id="setup-screen">
    <div class="setup-card">
        <h1>EDU-ULTIMATE</h1>
        <input type="text" id="join-name" placeholder="名前を入力">
        <input type="number" id="join-room" placeholder="ルームID (4桁)">
        <select id="join-mode">
            <option value="camera">カメラで開始</option>
            <option value="screen">画面共有で開始 (教師用)</option>
        </select>
        <button class="btn-start btn-teacher" onclick="launch('teacher')">先生として入室</button>
        <button class="btn-start btn-student" onclick="launch('student')">生徒として参加</button>
    </div>
</div>

<!-- 2. UI -->
<div id="main-app">
    <header>
        <div class="logo-area">
            <div style="width:40px; height:40px; background:var(--accent); border-radius:10px; display:flex; justify-content:center; align-items:center; color:#000;"><i class="fas fa-graduation-cap"></i></div>
            <div class="room-badge" id="display-room-id">ROOM: ----</div>
            <div id="timer-display" style="font-family:monospace; font-size:18px;">00:00:00</div>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div id="rec-indicator"><i class="fas fa-circle"></i> REC <span id="rec-time">00:00</span></div>
            <button class="icon-btn" style="padding:8px 20px; background:var(--danger); border:none;" onclick="location.reload()">退室</button>
        </div>
    </header>

    <div class="main-container">
        <div class="stage-wrapper">
            <div class="stage" id="stage" onclick="forcePlay()">
                <div class="stage-overlay">
                    <div class="view-indicator"><div class="live-dot"></div><span id="view-name">配信待機中</span></div>
                </div>
                <canvas id="wb-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>

                <!-- 板書ツール (教師のみ) -->
                <div id="wb-toolbar">
                    <div class="wb-tool active" onclick="setTool('pen', this)"><i class="fas fa-pen"></i></div>
                    <div class="wb-tool" onclick="setTool('eraser', this)"><i class="fas fa-eraser"></i></div>
                    <div style="height:1px; background:var(--border);"></div>
                    <div style="width:20px; height:20px; background:#ff4757; border-radius:50%; cursor:pointer;" onclick="setColor('#ff4757')"></div>
                    <div style="width:20px; height:20px; background:#00fbff; border-radius:50%; cursor:pointer;" onclick="setColor('#00fbff')"></div>
                    <div class="wb-tool" onclick="clearWB()"><i class="fas fa-trash"></i></div>
                </div>
            </div>
            <div class="monitor-shelf" id="monitor-grid"></div>
        </div>

        <div class="sidebar">
            <!-- 教師用パネル -->
            <div id="teacher-panel" class="panel hidden">
                <div class="panel-header">Director Tools</div>
                <div class="control-grid">
                    <button class="icon-btn" onclick="cmdMic(false)"><i class="fas fa-microphone-slash"></i><span>全員消音</span></button>
                    <button class="icon-btn" onclick="cmdMic(true)"><i class="fas fa-microphone"></i><span>全員発言</span></button>
                    <button class="icon-btn" onclick="toggleWB()"><i class="fas fa-chalkboard"></i><span>板書同期</span></button>
                    <button class="icon-btn" onclick="createPoll()"><i class="fas fa-poll"></i><span>投票作成</span></button>
                    <button class="icon-btn danger" id="btn-record" onclick="toggleRecord()"><i class="fas fa-record-vinyl"></i><span>録画</span></button>
                    <button class="icon-btn" onclick="syncView(peer.id)"><i class="fas fa-sync"></i><span>画面同期</span></button>
                </div>
            </div>

            <!-- ステータス (共通) -->
            <div class="panel">
                <div class="panel-header">My Device</div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <div style="width:100px; height:70px; background:#000; border-radius:12px; position:relative; overflow:hidden;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
                        <div class="vol-meter"><div class="vol-bar" id="my-vol-bar"></div></div>
                    </div>
                    <div style="flex:1;">
                        <div id="display-my-name" style="font-weight:bold; font-size:14px; margin-bottom:10px;">Name</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                            <button class="icon-btn" onclick="toggleMic()" id="btn-mic"><i class="fas fa-microphone"></i></button>
                            <button class="icon-btn" onclick="toggleCam()" id="btn-cam"><i class="fas fa-video"></i></button>
                            <!-- 画面共有ボタン: 教師にのみ表示 -->
                            <button class="icon-btn hidden" style="grid-column: span 2;" onclick="toggleScreen()" id="btn-screen"><i class="fas fa-desktop"></i> 画面共有</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- リスト -->
            <div class="panel" style="flex:1; display:flex; flex-direction:column;">
                <div class="panel-header">Classmates</div>
                <div id="peer-list"></div>
            </div>

            <!-- チャット -->
            <div class="panel" style="flex:1.5; display:flex; flex-direction:column;">
                <div id="chat-window"></div>
                <div class="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="メッセージ...">
                    <button class="icon-btn" style="background:var(--accent); color:#000;" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let micOn = false, camOn = true, screenOn = false;
    let wbActive = false, wbCtx, drawing = false, wbColor = "#ff4757", wbTool = 'pen';
    let mediaRecorder, recordedChunks = [], recInterval;

    async function launch(role) {
        myRole = role;
        myName = document.getElementById('join-name').value || (role==='teacher'?"先生":"生徒");
        roomID = document.getElementById('join-room').value;
        const mode = document.getElementById('join-mode').value;

        if(!roomID) return alert("部屋IDを入力してください");

        localStream = await getStream(mode);
        if(!localStream) return;

        const myID = role==='teacher' ? `EDU-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2,8)}`;
        peer = new Peer(myID);

        peer.on('open', id => {
            document.getElementById('setup-screen').style.display='none';
            document.getElementById('main-app').classList.add('active');
            document.getElementById('display-room-id').innerText = `ROOM: ${roomID}`;
            document.getElementById('display-my-name').innerText = myName;

            if(role==='teacher'){
                document.getElementById('teacher-panel').classList.remove('hidden');
                document.getElementById('btn-screen').classList.remove('hidden');
                initWB(); startTimer(); syncView(peer.id);
            } else {
                connectTeacher(`EDU-ROOM-${roomID}`);
            }
            showToast("Success", "入室に成功しました");
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => {
                remoteStreams[call.peer] = s;
                addGrid(call.peer, s);
                if(call.peer.startsWith('EDU-ROOM')) syncView(call.peer);
            });
        });

        peer.on('connection', conn => handleSignal(conn));
    }

    async function getStream(mode) {
        try {
            let s;
            if(mode === 'screen') s = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
            else s = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            
            s.getAudioTracks().forEach(t => t.enabled = false);
            document.getElementById('my-preview').srcObject = s;
            setupVol(s, 'my-vol-bar');
            return s;
        } catch(e){ alert("メディアエラー"); return null; }
    }

    function connectTeacher(tID) {
        const conn = peer.connect(tID);
        handleSignal(conn);
        conn.on('open', () => {
            conn.send({type:'join', name:myName});
            peer.call(tID, localStream);
        });
    }

    function handleSignal(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            if(data.type==='join'){
                students[conn.peer] = {name:data.name};
                if(myRole==='teacher'){
                    syncList(); syncView(peer.id);
                    peer.call(conn.peer, localStream);
                }
                updateList();
            }
            if(data.type==='list'){
                data.list.forEach(u => {
                    if(u.id !== peer.id && !connections[u.id]){
                        students[u.id] = {name:u.name};
                        const c = peer.connect(u.id);
                        handleSignal(c);
                        c.on('open', () => { c.send({type:'hello', name:myName}); peer.call(u.id, localStream); });
                    }
                });
                updateList();
            }
            if(data.type==='hello'){ students[conn.peer]={name:data.name}; updateList(); }
            if(data.type==='sync-view') syncView(data.id);
            if(data.type==='chat') addChat(data.name, data.msg);
            if(data.type==='wb-draw') drawWB(data);
            if(data.type==='wb-clear') wbCtx.clearRect(0,0,wbCtx.canvas.width, wbCtx.canvas.height);
            if(data.type==='mic-cmd') applyMic(data.val);
            if(data.type==='poll') showPoll(data);
        });
        conn.on('close', () => {
            delete connections[conn.peer]; delete students[conn.peer];
            if(document.getElementById(`card-${conn.peer}`)) document.getElementById(`card-${conn.peer}`).remove();
            updateList();
        });
    }

    function syncView(id) {
        const mv = document.getElementById('main-video');
        const s = (id === peer.id) ? localStream : remoteStreams[id];
        if(s){
            mv.srcObject = s; mv.muted = (id===peer.id);
            const name = id.startsWith('EDU-ROOM') ? "先生" : (students[id]?.name || "配信中");
            document.getElementById('view-name').innerText = name + " を表示中";
            mv.play().catch(()=>{});
        }
        if(myRole==='teacher') broadcast({type:'sync-view', id:id});
    }

    function toggleMic() { micOn = !micOn; applyMic(micOn); }
    function applyMic(val) {
        const t = localStream.getAudioTracks()[0];
        if(t) t.enabled = val; micOn = val;
        document.getElementById('btn-mic').classList.toggle('active', val);
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if(t){ camOn = !camOn; t.enabled = camOn; document.getElementById('btn-cam').classList.toggle('danger', !camOn); }
    }

    // 教師専用: 画面共有切り替え
    async function toggleScreen() {
        if(myRole !== 'teacher') return;
        const oldTrack = localStream.getVideoTracks()[0];
        let news;
        try {
            if(!screenOn) news = await navigator.mediaDevices.getDisplayMedia({video:true});
            else news = await navigator.mediaDevices.getUserMedia({video:true});
            
            const nt = news.getVideoTracks()[0];
            localStream.removeTrack(oldTrack);
            localStream.addTrack(nt);
            oldTrack.stop();
            screenOn = !screenOn;

            Object.values(peer.connections).forEach(conns => conns.forEach(c => {
                const sender = c.peerConnection.getSenders().find(s => s.track.kind==='video');
                if(sender) sender.replaceTrack(nt);
            }));
            document.getElementById('my-preview').srcObject = localStream;
            document.getElementById('btn-screen').classList.toggle('active', screenOn);
            syncView(peer.id);
        } catch(e){}
    }

    function initWB() {
        const canvas = document.getElementById('wb-canvas');
        wbCtx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const resize = () => { canvas.width = stage.clientWidth; canvas.height = stage.clientHeight; };
        resize(); window.addEventListener('resize', resize);

        stage.onmousedown = (e) => { if(!wbActive) return; drawing=true; transmitWB(e.offsetX, e.offsetY, true); };
        stage.onmousemove = (e) => { if(!drawing || !wbActive) return; transmitWB(e.offsetX, e.offsetY, false); };
        stage.onmouseup = () => drawing=false;
    }
    function transmitWB(x,y,n){
        const d = {type:'wb-draw', x, y, n, c:wbTool==='eraser'?'transparent':wbColor, s:wbTool==='eraser'?30:5};
        drawWB(d); broadcast(d);
    }
    function drawWB(d) {
        wbCtx.globalCompositeOperation = d.c==='transparent' ? 'destination-out' : 'source-over';
        wbCtx.strokeStyle = d.c; wbCtx.lineWidth = d.s; wbCtx.lineCap='round';
        if(d.n){ wbCtx.beginPath(); wbCtx.moveTo(d.x, d.y); } else { wbCtx.lineTo(d.x, d.y); wbCtx.stroke(); }
    }
    function toggleWB() { wbActive=!wbActive; document.getElementById('wb-toolbar').style.display = wbActive?'flex':'none'; document.getElementById('wb-canvas').classList.toggle('active', wbActive); }
    function setColor(c){ wbColor=c; wbTool='pen'; }
    function setTool(t, el){ wbTool=t; document.querySelectorAll('.wb-tool').forEach(x=>x.classList.remove('active')); el.classList.add('active'); }
    function clearWB(){ wbCtx.clearRect(0,0,wbCtx.canvas.width, wbCtx.canvas.height); broadcast({type:'wb-clear'}); }

    function updateList() {
        const list = document.getElementById('peer-list');
        list.innerHTML = "";
        Object.keys(students).forEach(id => {
            const item = document.createElement('div');
            item.className = 'peer-item';
            // 生徒側は名前のみ、教師側は操作ボタンあり
            let actions = "";
            if(myRole==='teacher'){
                actions = `<div>
                    <button class="btn-mini btn-mini-blue" onclick="syncView('${id}')">指名</button>
                    <button class="btn-mini btn-mini-red" onclick="privateTalk('${id}')">対話</button>
                </div>`;
            }
            item.innerHTML = `<span>${students[id].name}</span>${actions}`;
            list.appendChild(item);
        });
    }

    let privateId = null;
    function privateTalk(id) {
        if(privateId === id){
            privateId = null; resetVol(); showToast("Mode", "通常に戻りました");
        } else {
            privateId = id; applyFilter(id); applyMic(true); showToast("Mode", "個別対話中");
        }
    }
    function applyFilter(pid) {
        const mv = document.getElementById('main-video');
        if(mv) mv.volume = (pid === peer.id) ? 1.0 : 0.1;
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if(v) v.volume = (id === pid) ? 1.0 : 0.1;
        });
    }
    function resetVol() {
        const mv = document.getElementById('main-video');
        if(mv) mv.volume = 1.0;
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if(v) v.volume = 1.0;
        });
    }

    function addGrid(id, s) {
        if(document.getElementById(`card-${id}`)) return;
        const grid = document.getElementById('monitor-grid');
        const card = document.createElement('div');
        card.className = 'user-card'; card.id = `card-${id}`;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline></video><div class="info">${students[id]?.name || '参加者'}</div><div class="vol-meter"><div class="vol-bar" id="vol-${id}"></div></div>`;
        grid.appendChild(card);
        const v = document.getElementById(`v-${id}`); v.srcObject = s;
        setupVol(s, `vol-${id}`);
    }

    function setupVol(s, bid) {
        const t = s.getAudioTracks()[0]; if(!t) return;
        try {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(new MediaStream([t]));
            const ans = ctx.createAnalyser(); src.connect(ans);
            const data = new Uint8Array(ans.frequencyBinCount);
            const update = () => {
                if(!document.getElementById(bid)) return;
                ans.getByteFrequencyData(data);
                const avg = data.reduce((a,b)=>a+b)/data.length;
                document.getElementById(bid).style.width = Math.min(100, avg*3.5) + "%";
                requestAnimationFrame(update);
            };
            update();
        } catch(e){}
    }

    function showToast(t, m) {
        const c = document.getElementById('toast-container');
        const el = document.createElement('div'); el.className = 'toast';
        el.innerHTML = `<b>${t}</b><br>${m}`; c.appendChild(el);
        setTimeout(()=>el.classList.add('show'), 100);
        setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 500); }, 4000);
    }

    function addChat(n, m) {
        const w = document.getElementById('chat-window');
        const d = document.createElement('div'); d.innerHTML = `<b>${n}:</b> ${m}`;
        w.appendChild(d); w.scrollTop = w.scrollHeight;
    }
    function sendChat() {
        const i = document.getElementById('chat-input'); if(!i.value) return;
        addChat("自分", i.value); broadcast({type:'chat', name:myName, msg:i.value}); i.value="";
    }

    function createPoll() {
        const q = prompt("質問:"); if(!q) return;
        const o = prompt("選択肢(カンマ区切り):").split(",");
        broadcast({type:'poll', q, o}); showPoll({q, o});
    }
    function showPoll(d) {
        const w = document.getElementById('chat-window');
        const el = document.createElement('div');
        el.style.background = 'var(--accent)'; el.style.color = '#000'; el.style.padding = '10px'; el.style.borderRadius = '10px';
        el.innerHTML = `<b>📊 ${d.q}</b><div style="margin-top:5px; display:grid; gap:5px;">${d.o.map(x=>`<button style="padding:5px; border-radius:5px; border:none; cursor:pointer;" onclick="this.parentElement.innerHTML='回答済み'; sendChat('回答: ${x}')">${x}</button>`).join('')}</div>`;
        w.appendChild(el); w.scrollTop = w.scrollHeight;
    }

    function toggleRecord() {
        if(!mediaRecorder || mediaRecorder.state === 'inactive'){
            const s = document.getElementById('main-video').srcObject; if(!s) return;
            mediaRecorder = new MediaRecorder(s);
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const b = new Blob(recordedChunks, {type:'video/webm'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download=`REC-${Date.now()}.webm`; a.click();
            };
            mediaRecorder.start();
            document.getElementById('rec-indicator').style.display='flex';
            document.getElementById('btn-record').classList.add('active');
        } else {
            mediaRecorder.stop();
            document.getElementById('rec-indicator').style.display='none';
            document.getElementById('btn-record').classList.remove('active');
        }
    }

    function broadcast(d) { Object.values(connections).forEach(c => { if(c.open) c.send(d); }); }
    function syncList() {
        const list = Object.keys(students).map(id => ({id, name:students[id].name}));
        list.push({id:peer.id, name:myName});
        broadcast({type:'list', list});
    }
    function startTimer() {
        let s = 0; setInterval(() => {
            s++; const h = Math.floor(s/3600).toString().padStart(2,'0'), m = Math.floor((s%3600)/60).toString().padStart(2,'0'), v = (s%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${h}:${m}:${v}`;
        }, 1000);
    }
    function cmdMic(v) { broadcast({type:'mic-cmd', val:v}); applyMic(v); }
    function forcePlay() { document.querySelectorAll('video').forEach(v => v.play().catch(()=>{})); }
</script>
</body>
</html>
