<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v3.7 (All-in-One)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --monitor-height: 30vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- セットアップ画面 --- */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 360px; border: 1px solid #444; box-shadow: 0 0 30px rgba(0,251,255,0.2); }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 100; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        /* パネル */
        .panel { background: #222; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 映像エリア */
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        /* ボタン共通 */
        button { cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-primary { background: #0097e6; color: white; padding: 10px; border-radius: 5px; width: 100%; }
        .btn-success { background: var(--success); color: white; padding: 10px; border-radius: 5px; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 10px; border-radius: 5px; width: 100%; }
        .btn-warning { background: var(--warning); color: #000; padding: 10px; border-radius: 5px; width: 100%; }
        
        /* チャット */
        #chat-box { flex: 1; min-height: 150px; background: #111; border-radius: 5px; display: flex; flex-direction: column; font-size: 12px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 5px; }
        .chat-msg { margin-bottom: 5px; line-height: 1.4; }
        .chat-name { font-weight: bold; color: var(--accent); margin-right: 5px; }

        /* リアクション */
        .reaction-bar { display: flex; justify-content: space-around; margin-top: 10px; }
        .reaction-btn { background: #333; font-size: 20px; padding: 5px; border-radius: 5px; }
        .floating-reaction { position: absolute; bottom: 50px; font-size: 40px; pointer-events: none; z-index: 1000; animation: floatUp 3s forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-400px); opacity: 0; } }

        /* 監視グリッド */
        .monitor-grid { height: var(--monitor-height); background: #111; border-top: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; padding: 8px; border-radius: 8px; border: 2px solid transparent; position: relative; }
        .student-card.hand-up { border-color: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .student-card video { width: 100%; background: #000; border-radius: 4px; }
        
        .hidden { display: none !important; }
        #timer-display { font-family: monospace; font-size: 24px; color: var(--accent); }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin:0 0 10px;">EDU-ULTIMATE</h2>
        <input type="text" id="user-name" placeholder="あなたの名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-media-type"><option value="camera">📷 カメラ開始</option><option value="screen">💻 画面共有開始</option></select>
        <select id="camera-select"></select>
        <button class="btn-primary" style="margin-top:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <div id="timer-display">00:00</div>
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="spotlight-msg" style="color:yellow; font-size:12px;"></span>
        <div id="room-display">ID: ----</div>
    </div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <!-- 自分の操作 -->
        <div class="panel">
            <div class="panel-title">自分</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:8px;">
                <button id="mic-btn" class="btn-success" onclick="toggleMic()" style="font-size:11px;">🎤 ON</button>
                <button id="hand-btn" class="btn-warning hidden" onclick="toggleHand()" style="font-size:11px;">✋ 挙手</button>
            </div>
            <button id="return-btn" class="btn-danger hidden" style="margin-top:5px; font-size:11px;" onclick="resetSpotlight()">🔄 先生に戻す</button>
        </div>

        <!-- 教員ツール -->
        <div id="teacher-tools" class="hidden">
            <div class="panel">
                <div class="panel-title">クラス管理</div>
                <button class="btn-danger" style="font-size:11px; margin-bottom:5px;" onclick="muteAllStudents()">🔇 全員一括ミュート</button>
                <button class="btn-primary" style="font-size:11px; margin-bottom:5px;" onclick="pickRandom()">🎲 ランダム指名</button>
                <div style="display:flex; gap:5px; align-items:center;">
                    <input type="number" id="timer-input" value="3" style="width:50px; margin:0; padding:5px;">
                    <button class="btn-success" style="padding:5px; font-size:11px;" onclick="startTimerBroad()">⏱ タイマー</button>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title">出席確認 (接続数: <span id="conn-count">0</span>)</div>
                <div id="roster" style="font-size:11px; max-height:60px; overflow-y:auto; color:#ccc;"></div>
            </div>
        </div>

        <!-- チャット・リアクション -->
        <div class="panel" style="flex:1; display:flex; flex-direction:column;">
            <div class="panel-title">チャット & リアクション</div>
            <div id="chat-box">
                <div id="chat-messages"></div>
                <div style="display:flex; gap:2px; padding:5px;">
                    <input type="text" id="chat-input" placeholder="メッセージ..." style="flex:1; font-size:11px; background:#222; border:1px solid #444; color:white; border-radius:3px;">
                    <button onclick="sendChat()" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:3px; font-size:11px;">送信</button>
                </div>
            </div>
            <div class="reaction-bar">
                <button class="reaction-btn" onclick="sendReaction('👏')">👏</button>
                <button class="reaction-btn" onclick="sendReaction('❓')">❓</button>
                <button class="reaction-btn" onclick="sendReaction('💡')">💡</button>
                <button class="reaction-btn" onclick="sendReaction('⭐')">⭐</button>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container" id="broadcast-root">
            <div id="on-air-status" class="hidden"><span style="background:red; color:white; padding:2px 6px; border-radius:4px; font-size:10px; position:absolute; top:10px; left:10px;">● LIVE</span></div>
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let connections = {}; // data connections
    let students = {}; // student info

    // カメラ初期化
    navigator.mediaDevices.enumerateDevices().then(devices => {
        const sel = document.getElementById('camera-select');
        devices.filter(d => d.kind === 'videoinput').forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Camera'; sel.appendChild(opt);
        });
    });

    async function start(role) {
        myName = document.getElementById('user-name').value || "ゲスト";
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("部屋IDを入れてください");

        myRole = role;
        const type = document.getElementById('start-media-type').value;
        const devId = document.getElementById('camera-select').value;

        try {
            await setupMedia(type, devId);
            document.getElementById('setup-screen').classList.add('hidden');
            if(role === 'student') document.getElementById('hand-btn').classList.remove('hidden');

            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });

            peer.on('connection', conn => {
                setupDataConn(conn);
            });
        } catch(e) { alert("メディアエラー: " + e.message); }
    }

    async function setupMedia(type, devId) {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        let vStream;
        if(type === 'camera') {
            vStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: devId ? {exact:devId} : undefined } });
            document.getElementById('my-video').style.transform = "scaleX(-1)";
        } else {
            vStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('my-video').style.transform = "none";
        }
        localStream = new MediaStream([...vStream.getVideoTracks(), ...mic.getAudioTracks()]);
        document.getElementById('my-video').srcObject = localStream;
    }

    function setupDataConn(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            switch(data.type) {
                case 'JOIN': 
                    students[conn.peer] = { name: data.name }; 
                    updateRoster(); 
                    break;
                case 'CHAT': 
                    addChatMessage(data.name, data.msg); 
                    if(myRole === 'teacher') broadcast({type:'CHAT', name:data.name, msg:data.msg}); // 先生が仲介して全員へ
                    break;
                case 'REACTION': 
                    showReaction(data.emoji); 
                    if(myRole === 'teacher') broadcast({type:'REACTION', emoji:data.emoji});
                    break;
                case 'HAND': 
                    const card = document.getElementById('card-'+conn.peer);
                    if(card) card.classList.toggle('hand-up', data.isUp);
                    break;
                case 'TIMER': 
                    startLocalTimer(data.sec); 
                    break;
                case 'MUTE': 
                    if(localStream.getAudioTracks()[0]) {
                        localStream.getAudioTracks()[0].enabled = false;
                        document.getElementById('mic-btn').innerText = "🔇 OFF";
                        document.getElementById('mic-btn').className = "btn-danger";
                    }
                    break;
            }
        });
        conn.on('close', () => { delete connections[conn.peer]; updateRoster(); });
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => { if(c.open) c.send(data); });
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-area').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('on-air-status').classList.remove('hidden');
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => {
            setupDataConn(conn);
            conn.send({ type: 'JOIN', name: myName });
        });
        const call = peer.call(tid, localStream);
        call.on('stream', s => {
            document.getElementById('main-broadcast-video').srcObject = s;
            document.getElementById('on-air-status').classList.remove('hidden');
        });
    }

    // --- 各機能ロジック ---

    function sendChat() {
        const input = document.getElementById('chat-input');
        const msg = input.value; if(!msg) return;
        addChatMessage(myName, msg);
        const data = { type: 'CHAT', name: myName, msg: msg };
        if(myRole === 'teacher') broadcast(data);
        else connections["T-ROOM-"+currentRid]?.send(data);
        input.value = "";
    }

    function addChatMessage(name, msg) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div'); div.className = 'chat-msg';
        div.innerHTML = `<span class="chat-name">${name}:</span> ${msg}`;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function sendReaction(emoji) {
        showReaction(emoji);
        const data = { type: 'REACTION', emoji: emoji };
        if(myRole === 'teacher') broadcast(data);
        else connections["T-ROOM-"+currentRid]?.send(data);
    }

    function showReaction(emoji) {
        const root = document.getElementById('broadcast-root');
        const el = document.createElement('div'); el.className = 'floating-reaction';
        el.innerText = emoji; el.style.left = Math.random() * 80 + 10 + "%";
        root.appendChild(el); setTimeout(() => el.remove(), 3000);
    }

    let handIsUp = false;
    function toggleHand() {
        handIsUp = !handIsUp;
        document.getElementById('hand-btn').innerText = handIsUp ? "✋ 下ろす" : "✋ 挙手";
        connections["T-ROOM-"+currentRid]?.send({ type: 'HAND', isUp: handIsUp });
    }

    function startTimerBroad() {
        const sec = parseInt(document.getElementById('timer-input').value) * 60;
        broadcast({ type: 'TIMER', sec: sec });
        startLocalTimer(sec);
    }

    function startLocalTimer(sec) {
        clearInterval(window.timerInt);
        window.timerInt = setInterval(() => {
            if(sec <= 0) { clearInterval(window.timerInt); return; }
            sec--;
            const m = Math.floor(sec/60); const s = sec%60;
            document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function muteAllStudents() {
        if(confirm("全生徒のマイクを強制停止しますか？")) broadcast({ type: 'MUTE' });
    }

    function pickRandom() {
        const keys = Object.keys(students);
        if(keys.length === 0) return alert("生徒がいません");
        const target = students[keys[Math.floor(Math.random()*keys.length)]];
        broadcast({ type: 'CHAT', name: '📢 システム', msg: `🎲 指名: ${target.name} さん！` });
        addChatMessage('📢 システム', `🎲 指名: ${target.name} さん！`);
    }

    function updateRoster() {
        const list = Object.values(students).map(s => s.name);
        document.getElementById('roster').innerText = list.join(', ');
        document.getElementById('conn-count').innerText = list.length;
    }

    // --- 既存のスポットライト機能 ---
    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        card.innerHTML = `<video id="v-${id}" autoplay playsinline></video>
            <div style="display:flex; justify-content:space-between; margin-top:5px;">
                <span style="font-size:10px;">${students[id]?.name || '生徒'}</span>
                <button class="btn-primary" style="font-size:8px; width:auto; padding:2px 5px;" onclick="spotlight('${id}')">共有</button>
            </div>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
    }

    function spotlight(sid) {
        const stream = document.getElementById('v-'+sid).srcObject;
        document.getElementById('main-broadcast-video').srcObject = stream;
        document.getElementById('return-btn').classList.remove('hidden');
        replaceTracks(stream);
    }

    function resetSpotlight() {
        document.getElementById('main-broadcast-video').srcObject = localStream;
        document.getElementById('return-btn').classList.add('hidden');
        replaceTracks(localStream);
    }

    function replaceTracks(stream) {
        const vt = stream.getVideoTracks()[0];
        const at = stream.getAudioTracks()[0];
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(c => {
                if(c.peerConnection) {
                    const senders = c.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind==='video');
                    const as = senders.find(s => s.track && s.track.kind==='audio');
                    if(vs && vt) vs.replaceTrack(vt);
                    if(as && at) as.replaceTrack(at);
                }
            });
        });
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            const btn = document.getElementById('mic-btn');
            btn.innerText = t.enabled ? "🎤 ON" : "🔇 OFF";
            btn.className = t.enabled ? "btn-success" : "btn-danger";
        }
    }
</script>
</body>
</html>
