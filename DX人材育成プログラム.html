<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v8.0 (Stable Fix)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --danger: #ff4757; --success: #2ecc71; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ログイン */
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 300px; border: 1px solid #444; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        /* レイアウト */
        header { background: #111; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .view-area { flex: 1; display: flex; flex-direction: column; background: #000; }
        .sidebar { width: 280px; background: #111; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 10px; }

        /* ビデオ */
        #main-display { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #monitor-grid { height: 150px; background: #050505; display: flex; gap: 10px; padding: 10px; overflow-x: auto; border-top: 1px solid #333; }
        .mini-card { flex-shrink: 0; width: 180px; background: #222; border-radius: 8px; position: relative; overflow: hidden; text-align: center; }
        .mini-card video { width: 100%; height: 100px; object-fit: cover; background: #000; }
        
        .label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        
        /* チャット・操作 */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; padding: 10px; transition: 0.2s; }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; width: 100%; }
        #chat-area { flex: 1; background: #000; margin: 10px 0; border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 13px; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="setup-box">
        <h2 style="color:var(--accent)">EDU-FIX v8</h2>
        <input type="text" id="user-name" placeholder="お名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="media-mode">
            <option value="camera">📷 カメラで開始</option>
            <option value="screen">💻 画面共有で開始</option>
        </select>
        <button class="btn-blue" onclick="start('teacher')">先生として開始</button>
        <div style="height:10px;"></div>
        <button class="btn-green" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div><span id="role-tag" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold;">READY</span></div>
    <div id="room-display">ROOM: ----</div>
</header>

<div class="main-container">
    <div class="view-area">
        <div id="main-display">
            <div class="label" id="main-label">メインビュー</div>
            <video id="main-video" autoplay playsinline></video>
        </div>
        <div id="monitor-grid"></div>
    </div>

    <div class="sidebar">
        <div style="text-align:center;">
            <video id="my-preview" autoplay playsinline muted style="width:100%; height:120px; background:#000; border-radius:8px; object-fit:cover;"></video>
            <div id="self-name" style="margin:5px 0;">Name</div>
            <div style="display:flex; gap:5px;">
                <button id="mic-btn" class="btn-green" onclick="toggleMic()" style="flex:1;">🎤 ON</button>
                <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="flex:1;">📷 ON</button>
            </div>
        </div>
        
        <div id="chat-area"></div>
        <input type="text" id="chat-input" placeholder="チャットを入力...">
        <button class="btn-red" style="margin-top:10px;" onclick="location.reload()">退室・リセット</button>
        <div id="qrcode-area" style="margin-top:10px; display:flex; justify-content:center; background:white; border-radius:8px; padding:5px;"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {};

    // 1. メディア取得 (マイク音声と映像を確実に合流させる)
    async function getLocalStream(mode) {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
        let videoStream;
        if(mode === 'camera') {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } else {
            videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        }

        // 合成
        const tracks = [...videoStream.getVideoTracks()];
        if(audioStream) tracks.push(...audioStream.getAudioTracks());
        
        localStream = new MediaStream(tracks);
        document.getElementById('my-preview').srcObject = localStream;
        return localStream;
    }

    // 2. セッション開始
    async function start(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || "ゲスト";
        roomID = document.getElementById('room-id').value;
        if(!roomID) return alert("部屋IDを入力してください");

        await getLocalStream(document.getElementById('media-mode').value);
        
        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 9)}`;
        peer = new Peer(peerID);

        peer.on('open', () => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('room-display').innerText = "ROOM ID: " + roomID;
            document.getElementById('role-tag').innerText = role.toUpperCase();
            document.getElementById('self-name').innerText = myName + " (自分)";
            
            if(role === 'teacher') {
                new QRCode(document.getElementById("qrcode-area"), { text: location.href, width: 80, height: 80 });
                // 先生はメインに自分を出す
                document.getElementById('main-video').srcObject = localStream;
            } else {
                connectToTeacher();
                document.getElementById('qrcode-area').style.display = 'none';
            }
        });

        // 着信：誰かが自分を呼んだら自分の映像を返す
        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', remoteStream => {
                addVideo(call.peer, remoteStream);
            });
        });

        // データ受信用
        peer.on('connection', conn => {
            connections[conn.peer] = conn;
            conn.on('data', data => handleData(data));
        });
    }

    // 3. 先生への接続 (生徒側のみ)
    function connectToTeacher() {
        const teacherID = `T-ROOM-${roomID}`;
        
        // 映像通話を開始
        const call = peer.call(teacherID, localStream);
        call.on('stream', remoteStream => {
            addVideo(teacherID, remoteStream);
        });

        // チャット用接続
        const conn = peer.connect(teacherID);
        conn.on('open', () => {
            connections[teacherID] = conn;
            conn.send({ type: 'join', name: myName });
        });
    }

    // 4. ビデオの追加処理
    function addVideo(id, stream) {
        const isTeacher = id.startsWith('T-ROOM-');
        
        // メイン画面の更新（教員の映像なら）
        if(isTeacher) {
            const mainV = document.getElementById('main-video');
            mainV.srcObject = stream;
            mainV.play().catch(e => console.log("Auto-play blocked, wait for click"));
            document.getElementById('main-label').innerText = "教員の画面";
        }

        // 下部グリッドへの追加
        if(!document.getElementById(`card-${id}`)) {
            const card = document.createElement('div');
            card.className = 'mini-card';
            card.id = `card-${id}`;
            card.innerHTML = `<div class="label">${isTeacher ? '先生' : '生徒'}</div><video id="vid-${id}" autoplay playsinline></video>`;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            
            // クリックでメインに表示
            card.onclick = () => {
                document.getElementById('main-video').srcObject = stream;
                document.getElementById('main-label').innerText = (isTeacher ? "先生" : "生徒") + " を表示中";
            };
        }
    }

    // 5. データ通信 (チャット等)
    function handleData(data) {
        if(data.type === 'join') addChat("入室", data.name + "さんが参加しました");
        if(data.type === 'chat') addChat(data.name, data.msg);
    }

    function addChat(name, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${name}:</b> ${msg}`;
        const area = document.getElementById('chat-area');
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if(e.key === 'Enter' && e.target.value) {
            const msg = e.target.value;
            addChat("自分", msg);
            Object.values(connections).forEach(c => c.send({ type: 'chat', name: myName, msg: msg }));
            e.target.value = "";
        }
    }

    // 6. 各種操作
    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('mic-btn').innerText = t.enabled ? "🎤 ON" : "🔇 OFF";
            document.getElementById('mic-btn').className = t.enabled ? "btn-green" : "btn-red";
        }
    }

    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if(t) {
            t.enabled = !t.enabled;
            document.getElementById('cam-btn').innerText = t.enabled ? "📷 ON" : "📷 OFF";
            document.getElementById('cam-btn').className = t.enabled ? "btn-green" : "btn-red";
        }
    }

    // 自動再生制限の解除用
    window.addEventListener('click', () => {
        const v = document.getElementById('main-video');
        if(v.srcObject) v.play();
    }, { once: true });

</script>
</body></html>
