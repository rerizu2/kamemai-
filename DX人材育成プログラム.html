<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-ULTIMATE v4.2 Fixed</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #0a0a0a; --panel: #1e1e1e; --danger: #ff4757;
            --success: #2ecc71; --warning: #f1c40f; --monitor-height: 30vh; 
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 360px; border: 1px solid #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        
        header { background: #111; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #333; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #111; border-right: 1px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        .panel { background: #222; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .panel-title { font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        
        .broadcast-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; }
        #main-broadcast-video { width: 100%; height: 100%; object-fit: contain; }
        
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        .btn-primary { background: #0097e6; color: white; padding: 10px; width: 100%; }
        .btn-success { background: var(--success); color: white; padding: 10px; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 10px; width: 100%; }
        .btn-mini { padding: 4px 8px; font-size: 10px; margin: 2px; }

        .monitor-grid { height: var(--monitor-height); background: #111; border-top: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; }
        .student-card { background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; }
        .student-card video { width: 100%; background: #000; border-radius: 4px; }
        
        .hidden { display: none !important; }
        select.sidebar-select { width: 100%; background: #000; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent); margin-bottom:15px;">EDU-ULTIMATE</h2>
        <input type="text" id="user-name" placeholder="名前">
        <input type="number" id="room-id" placeholder="部屋ID">
        <div style="font-size:11px; color:#888; text-align:left; margin-bottom:5px;">開始時の映像ソース:</div>
        <select id="start-media-type"><option value="camera">📷 カメラ</option><option value="screen">💻 画面共有</option></select>
        <button class="btn-primary" style="margin-top:10px;" onclick="start('teacher')">先生として開始</button>
        <button class="btn-success" style="margin-top:10px;" onclick="start('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="role-label" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</span>
        <span id="status-text" style="color:yellow; font-size:12px;"></span>
    </div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">映像/音声設定</div>
            <video id="my-video" autoplay playsinline muted style="width:100%; background:#000; border-radius:5px;"></video>
            
            <div style="margin-top:10px;">
                <select id="sidebar-media-type" class="sidebar-select" onchange="changeMedia()">
                    <option value="camera">📷 カメラに切替</option>
                    <option value="screen">💻 画面共有に切替</option>
                </select>
                <select id="sidebar-camera-select" class="sidebar-select" onchange="changeMedia()">
                    <!-- カメラリスト -->
                </select>
            </div>

            <div style="display:flex; gap:5px; margin-top:10px;">
                <button id="mic-btn" class="btn-success" onclick="toggleMic()" style="flex:1; font-size:11px;">🎤 ON</button>
                <button id="cam-btn" class="btn-success" onclick="toggleCam()" style="flex:1; font-size:11px;">📷 ON</button>
            </div>
        </div>

        <div id="teacher-tools" class="hidden">
            <div class="panel">
                <button class="btn-danger" style="font-size:11px;" onclick="forceExitAll()">全員退出</button>
                <div id="qrcode" style="background:white; padding:5px; border-radius:5px; text-align:center; margin-top:10px;"></div>
            </div>
        </div>
        
        <div class="panel" style="flex:1; display:flex; flex-direction:column;">
            <div id="chat-messages" style="flex:1; overflow-y:auto; font-size:11px; background:#111; padding:5px; margin-bottom:5px;"></div>
            <input type="text" id="chat-input" placeholder="チャット..." style="width:100%; background:#000; color:white; border:1px solid #444; padding:5px; box-sizing:border-box;">
        </div>
    </div>

    <div class="content-area">
        <div class="broadcast-container">
            <video id="main-broadcast-video" autoplay playsinline></video>
        </div>
        <div id="monitor-area" class="monitor-grid hidden"></div>
    </div>
</div>

<script>
    let peer, localStream, myRole = "", currentRid = "", myName = "";
    let connections = {};
    let students = {};

    // デバイス取得
    navigator.mediaDevices.enumerateDevices().then(devices => {
        const sel = document.getElementById('sidebar-camera-select');
        devices.filter(d => d.kind === 'videoinput').forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Camera ' + (sel.length + 1);
            sel.appendChild(opt);
        });
    });

    async function start(role) {
        myName = document.getElementById('user-name').value || "ゲスト";
        currentRid = document.getElementById('room-id').value;
        if(!currentRid) return alert("IDを入力してください");

        myRole = role;
        const type = document.getElementById('start-media-type').value;
        document.getElementById('sidebar-media-type').value = type;

        try {
            // ここでストリームを待機
            const success = await updateStream(type);
            if(!success) return; // 画面共有キャンセル時などは中断

            document.getElementById('setup-screen').classList.add('hidden');
            peer = new Peer(role === 'teacher' ? "T-ROOM-" + currentRid : undefined);
            
            peer.on('open', id => {
                document.getElementById('room-display').innerText = "ID: " + currentRid;
                document.getElementById('role-label').innerText = role.toUpperCase();
                if(role === 'teacher') initTeacher(); else initStudent();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => addStudentToGrid(call.peer, s));
            });

            peer.on('connection', conn => {
                connections[conn.peer] = conn;
                conn.on('data', data => handleData(conn.peer, data));
                conn.on('close', () => removeStudent(conn.peer));
            });
        } catch(e) {
            alert("メディアエラー: 画面共有またはカメラが許可されませんでした。");
        }
    }

    async function updateStream(type) {
        let vStream;
        try {
            // 音声(マイク)を常に取得
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            if (type === 'camera') {
                const deviceId = document.getElementById('sidebar-camera-select').value;
                vStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: deviceId ? { exact: deviceId } : undefined } 
                });
                document.getElementById('my-video').style.transform = "scaleX(-1)";
                document.getElementById('sidebar-camera-select').classList.remove('hidden');
            } else {
                // 【重要】画面共有の取得
                vStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('my-video').style.transform = "none";
                document.getElementById('sidebar-camera-select').classList.add('hidden');
                
                // 画面共有が停止ボタンで消された時の処理
                vStream.getVideoTracks()[0].onended = () => {
                    document.getElementById('sidebar-media-type').value = 'camera';
                    changeMedia();
                };
            }

            const newStream = new MediaStream([...vStream.getVideoTracks(), ...micStream.getAudioTracks()]);
            
            if (localStream) {
                replaceTrackInAllConnections(newStream.getVideoTracks()[0]);
                localStream.getTracks().forEach(t => t.stop());
            }

            localStream = newStream;
            document.getElementById('my-video').srcObject = localStream;
            if (myRole === 'teacher') document.getElementById('main-broadcast-video').srcObject = localStream;
            
            return true;
        } catch(e) {
            console.error(e);
            return false;
        }
    }

    async function changeMedia() {
        const type = document.getElementById('sidebar-media-type').value;
        const success = await updateStream(type);
        if(!success) {
            document.getElementById('sidebar-media-type').value = 'camera';
            await updateStream('camera');
        }
    }

    function replaceTrackInAllConnections(newTrack) {
        if (!peer) return;
        Object.values(peer.connections).forEach(connList => {
            connList.forEach(call => {
                if (call.peerConnection) {
                    const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(newTrack);
                }
            });
        });
    }

    function handleData(id, data) {
        switch(data.type) {
            case 'JOIN': students[id] = { name: data.name }; break;
            case 'CHAT': addChat(data.name, data.msg); if(myRole === 'teacher') broadcast(data); break;
            case 'REMOTE_CONTROL':
                if(data.action === 'MUTE') { localStream.getAudioTracks()[0].enabled = data.state; updateBtn('mic-btn', data.state, '🎤'); }
                else if(data.action === 'CAM') { localStream.getVideoTracks()[0].enabled = data.state; updateBtn('cam-btn', data.state, '📷'); }
                else if(data.action === 'EXIT') location.reload();
                break;
            case 'FORCE_EXIT_ALL': location.reload(); break;
        }
    }

    function initTeacher() {
        document.getElementById('teacher-tools').classList.remove('hidden');
        document.getElementById('monitor-area').classList.remove('hidden');
        document.getElementById('main-broadcast-video').srcObject = localStream;
        new QRCode(document.getElementById("qrcode"), { text: location.href.split('?')[0] + "?room=" + currentRid, width: 80, height: 80 });
    }

    function initStudent() {
        const tid = "T-ROOM-" + currentRid;
        const conn = peer.connect(tid);
        conn.on('open', () => { connections[tid] = conn; conn.send({ type: 'JOIN', name: myName }); });
        const call = peer.call(tid, localStream);
        call.on('stream', s => { document.getElementById('main-broadcast-video').srcObject = s; });
    }

    function addStudentToGrid(id, stream) {
        if(document.getElementById('card-'+id)) return;
        const card = document.createElement('div'); card.className = 'student-card'; card.id = 'card-'+id;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline></video>
            <div style="font-size:10px; margin:5px 0;">${students[id]?.name || '生徒'}</div>
            <div style="display:flex; flex-wrap:wrap; gap:2px;">
                <button class="btn-mini btn-primary" onclick="remoteToggle('${id}', 'MUTE')">🎤 遠隔Mute</button>
                <button class="btn-mini btn-danger" onclick="kickStudent('${id}')">追放</button>
            </div>`;
        document.getElementById('monitor-area').appendChild(card);
        document.getElementById('v-'+id).srcObject = stream;
    }

    function broadcast(data) { Object.values(connections).forEach(c => { if(c.open) c.send(data); }); }
    function forceExitAll() { if(confirm("全員退出？")) broadcast({ type: 'FORCE_EXIT_ALL' }); }
    function kickStudent(id) { if(confirm("追放？")) if(connections[id]) connections[id].send({ type: 'REMOTE_CONTROL', action: 'EXIT' }); }
    function removeStudent(id) { const c = document.getElementById('card-'+id); if(c) c.remove(); delete students[id]; delete connections[id]; }
    function toggleMic() { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; updateBtn('mic-btn', t.enabled, '🎤'); }
    function toggleCam() { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; updateBtn('cam-btn', t.enabled, '📷'); }
    function updateBtn(id, state, icon) { const b = document.getElementById(id); b.innerText = `${icon} ${state ? 'ON' : 'OFF'}`; b.className = state ? 'btn-success' : 'btn-danger'; }
    function addChat(n, m) { const d = document.createElement('div'); d.innerHTML = `<b>${n}:</b> ${m}`; const b = document.getElementById('chat-messages'); b.appendChild(d); b.scrollTop = b.scrollHeight; }
    document.getElementById('chat-input').onkeydown = e => { if(e.key === 'Enter' && e.target.value) { addChat("自分", e.target.value); broadcast({ type: 'CHAT', name: myName, msg: e.target.value }); e.target.value = ""; } };
</script>
</body>
</html>
