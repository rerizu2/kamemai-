<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v14.0 (View Sync Fixed)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #0a0a0a; --danger: #ff4757; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #setup-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #222; padding: 25px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid #444; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        header { background: #111; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .sidebar { width: 280px; background: #111; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .broadcast-box { flex: 1.5; background: #000; position: relative; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #333; overflow: hidden; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #view-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent); font-size: 11px; z-index: 10; }
        .monitor-grid { flex: 1; display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: #050505; }
        .student-mode .monitor-grid { display: none; }
        .card { width: 150px; flex-shrink: 0; background: #222; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #333; }
        .card video { width: 100%; height: 85px; object-fit: cover; background: #000; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; padding: 10px; transition: 0.2s; }
        .btn-blue { background: #0097e6; color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: black; }
        .btn-mini { padding: 4px; font-size: 10px; width: 100%; margin-top: 2px; }
        .vol-bar { height: 4px; background: var(--success); width: 0%; transition: 0.1s; }
        #chat-msgs { flex: 1; background: #000; border-radius: 8px; padding: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #333; min-height: 100px; }
        .hidden { display: none !important; }
        .teacher-panel { background: #331111; padding: 10px; border-radius: 12px; border: 1px solid #552222; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="modal-box">
        <h2 style="color:var(--accent)">EDU-ULTIMATE v14</h2>
        <input type="text" id="user-name" placeholder="お名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-mode">
            <option value="camera">📷 カメラで開始</option>
            <option value="screen">💻 画面共有で開始</option>
        </select>
        <button class="btn-blue" style="width:100%" onclick="startSession('teacher')">先生として開始</button>
        <div style="height:10px;"></div>
        <button class="btn-green" style="width:100%" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<header>
    <div id="role-label" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:12px;">READY</div>
    <div id="room-display">ID: ----</div>
</header>

<div class="main-layout">
    <div class="content-area">
        <div class="broadcast-box">
            <div id="view-label">待機中</div>
            <video id="main-video" autoplay playsinline></video>
        </div>
        <div id="monitor-grid" class="monitor-grid"></div>
    </div>

    <div class="sidebar">
        <div id="teacher-tools" class="hidden teacher-panel">
            <div style="font-size:11px; font-weight:bold; margin-bottom:8px; color:var(--warning);">📺 配信コントロール</div>
            <!-- このボタンで確実に先生の画面に戻るように修正 -->
            <button class="btn-warning" style="width:100%; font-size:11px; padding:8px; margin-bottom:8px;" onclick="setGlobalView('teacher')">🔄 全員の画面を先生に戻す</button>
            <button class="btn-blue" style="width:100%; margin-bottom:8px; font-size:11px;" onclick="handleRecord()" id="rec-btn">🔴 録画</button>
            <div id="qrcode" style="background:white; padding:5px; border-radius:8px; display:flex; justify-content:center;"></div>
        </div>

        <div style="background:#222; padding:10px; border-radius:12px; text-align:center;">
            <video id="my-preview" autoplay playsinline muted style="width:100%; height:90px; object-fit:cover; border-radius:6px; background:#000;"></video>
            <div id="my-name" style="font-size:11px; margin:5px 0;">Name</div>
            <div style="display:flex; gap:5px;">
                <button id="mic-btn" class="btn-green" onclick="toggleMic()" style="flex:1; font-size:10px;">🎤 Mic</button>
                <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="flex:1; font-size:10px;">📷 Cam</button>
            </div>
            <select id="mode-select" style="font-size:10px; margin-top:8px;" onchange="updateMedia()">
                <option value="camera">📷 カメラ</option>
                <option value="screen">💻 画面共有</option>
            </select>
        </div>

        <div id="chat-msgs"></div>
        <input type="text" id="chat-input" placeholder="チャット...">
        <button class="btn-red" style="width:100%; padding:5px; font-size:11px;" onclick="location.reload()">退室・リセット</button>
    </div>
</div>

<script>
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let recorder, recordedChunks = [];
    let currentGlobalViewId = "";

    async function getStream(mode) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
        let video;
        if (mode === 'camera') {
            video = await navigator.mediaDevices.getUserMedia({ video: true });
        } else {
            video = await navigator.mediaDevices.getDisplayMedia({ video: true });
        }
        localStream = new MediaStream([...video.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
        document.getElementById('my-preview').srcObject = localStream;
        return localStream;
    }

    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || "ゲスト";
        roomID = document.getElementById('room-id').value;
        if (!roomID) return alert("IDを入力してください");

        await getStream(document.getElementById('start-mode').value);
        const peerID = (role === 'teacher') ? `T-ROOM-${roomID}` : `S-${Math.random().toString(36).substr(2, 8)}`;
        peer = new Peer(peerID);

        peer.on('open', () => {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('role-label').innerText = role.toUpperCase();
            document.getElementById('room-display').innerText = "ROOM: " + roomID;
            document.getElementById('my-name').innerText = myName;
            
            if (role === 'teacher') {
                document.getElementById('teacher-tools').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 70, height: 70 });
                // 先生は最初、自分を映す
                currentGlobalViewId = peer.id;
                applyView(peer.id);
            } else {
                document.body.classList.add('student-mode');
                joinRoom();
            }
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => addRemoteStream(call.peer, s));
            call.on('close', () => removePeer(call.peer));
        });

        peer.on('connection', conn => setupDataConnection(conn));
    }

    function joinRoom() {
        const tID = `T-ROOM-${roomID}`;
        const conn = peer.connect(tID);
        setupDataConnection(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(tID, localStream);
        });
    }

    function setupDataConnection(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => handleData(conn.peer, data));
        conn.on('close', () => removePeer(conn.peer));
    }

    function handleData(peerId, data) {
        if (data.type === 'join') {
            students[peerId] = { name: data.name };
            if (myRole === 'teacher') {
                broadcastList();
                // 今の配信ターゲット（自分か誰か）を入室した生徒に送る
                connections[peerId].send({ type: 'sync_view', targetId: currentGlobalViewId });
            }
            addChat("システム", data.name + "さんが参加");
        }
        if (data.type === 'list') {
            data.list.forEach(u => {
                if (u.id !== peer.id && !connections[u.id]) {
                    students[u.id] = { name: u.name };
                    const c = peer.connect(u.id);
                    setupDataConnection(c);
                    c.on('open', () => {
                        c.send({ type: 'hello', name: myName });
                        peer.call(u.id, localStream);
                    });
                }
            });
        }
        if (data.type === 'hello') students[peerId] = { name: data.name };
        if (data.type === 'chat') addChat(data.name, data.msg);
        
        // 配信画面の同期命令
        if (data.type === 'sync_view') {
            applyView(data.targetId);
        }
        if (data.type === 'EXIT_NOW') removePeer(peerId);
    }

    function removePeer(id) {
        if (document.getElementById(`card-${id}`)) document.getElementById(`card-${id}`).remove();
        if (currentGlobalViewId === id) {
            // 映していた生徒が消えたら先生（T-ROOMで始まるID）を探して戻す
            const teacherId = Object.keys(connections).find(k => k.startsWith("T-ROOM-")) || "";
            if (teacherId) applyView(teacherId);
        }
        delete connections[id]; delete students[id]; delete remoteStreams[id];
    }

    function broadcastList() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name }));
        list.push({ id: peer.id, name: myName });
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'list', list }); });
    }

    function addRemoteStream(id, stream) {
        remoteStreams[id] = stream; // ここで保存
        const isT = id.startsWith("T-ROOM-");

        if (myRole === 'teacher' && !isT) {
            if (document.getElementById(`card-${id}`)) return;
            const card = document.createElement('div');
            card.className = 'card'; card.id = `card-${id}`;
            card.innerHTML = `
                <video id="vid-${id}" autoplay playsinline></video>
                <div style="font-size:10px; padding:2px; text-align:center;">${students[id]?.name || '生徒'}</div>
                <div class="vol-bar" id="vol-${id}"></div>
                <button class="btn-mini btn-blue" onclick="setGlobalView('${id}')">全員に共有</button>
            `;
            document.getElementById('monitor-grid').appendChild(card);
            document.getElementById(`vid-${id}`).srcObject = stream;
            setupVol(stream, `vol-${id}`);
        }
        
        // 初めて先生のストリームを受け取った時、または現在先生を映すべき時
        if (isT && (currentGlobalViewId === "" || currentGlobalViewId === id)) {
            applyView(id);
        }
    }

    // 先生が配信ターゲットを切り替える
    function setGlobalView(targetId) {
        // targetIdが 'teacher' なら自分のpeer.idを使う
        const id = (targetId === 'teacher') ? peer.id : targetId;
        currentGlobalViewId = id;
        
        // 全員に同期命令を出す
        const msg = { type: 'sync_view', targetId: id };
        Object.values(connections).forEach(c => { if(c.open) c.send(msg); });
        
        // 自分も切り替える
        applyView(id);
    }

    // 実際に画面（main-video）を切り替える関数
    function applyView(id) {
        if (!id) return;
        currentGlobalViewId = id;
        
        const mv = document.getElementById('main-video');
        // idが自分ならlocalStream、そうでなければremoteStreamsから探す
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        
        if (stream) {
            mv.srcObject = stream;
            const name = (id.startsWith("T-ROOM-")) ? "先生" : (students[id]?.name || "生徒");
            document.getElementById('view-label').innerText = name + " の画面を表示中";
            mv.play().catch(()=>{});
        } else {
            console.warn("Stream not found for ID:", id);
        }
    }

    async function updateMedia() {
        const mode = document.getElementById('mode-select').value;
        await getStream(mode);
        Object.values(peer.connections).forEach(conns => {
            conns.forEach(c => {
                if (c.peerConnection) {
                    const senders = c.peerConnection.getSenders();
                    const vs = senders.find(s => s.track && s.track.kind === 'video');
                    const as = senders.find(s => s.track && s.track.kind === 'audio');
                    if (vs) vs.replaceTrack(localStream.getVideoTracks()[0]);
                    if (as) as.replaceTrack(localStream.getAudioTracks()[0]);
                }
            });
        });
        // もし自分が配信対象なら、メインビデオも更新
        if (currentGlobalViewId === peer.id) applyView(peer.id);
    }

    function setupVol(stream, barId) {
        const at = stream.getAudioTracks()[0];
        if (!at) return;
        const ctx = new AudioContext();
        const src = ctx.createMediaStreamSource(new MediaStream([at]));
        const ans = ctx.createAnalyser(); src.connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const update = () => {
            if (!document.getElementById(barId)) return ctx.close();
            ans.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById(barId).style.width = Math.min(100, avg * 3) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function addChat(name, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${name}:</b> ${msg}`;
        const box = document.getElementById('chat-msgs');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').onkeydown = e => {
        if (e.key === 'Enter' && e.target.value) {
            const msg = e.target.value;
            addChat("自分", msg);
            Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'chat', name: myName, msg }); });
            e.target.value = "";
        }
    };

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('mic-btn').classList.toggle('btn-red', !t.enabled); }
    }
    function toggleCam() {
        const t = localStream.getVideoTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('cam-btn').classList.toggle('btn-red', !t.enabled); }
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            const s = document.getElementById('main-video').srcObject;
            if (!s) return;
            recordedChunks = []; recorder = new MediaRecorder(s);
            recorder.ondataavailable = e => recordedChunks.push(e.data);
            recorder.onstop = () => {
                const b = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'record.webm'; a.click();
            };
            recorder.start();
            document.getElementById('rec-btn').innerText = "⏹ 停止";
        } else {
            recorder.stop(); document.getElementById('rec-btn').innerText = "🔴 録画";
        }
    }

    window.addEventListener('beforeunload', () => {
        Object.values(connections).forEach(c => { if(c.open) c.send({ type: 'EXIT_NOW' }); });
        if(peer) peer.destroy();
    });

    window.onclick = () => { document.querySelectorAll('video').forEach(v => v.play()); };
</script>
</body></html>
