<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v30.0 | Pro Education OS</title>
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>

    <style>
        /* =========================================
           1. CSS VARIABLES & RESET
           ========================================= */
        :root {
            --accent: #00fbff;
            --accent-dark: #00888a;
            --bg: #030303;
            --panel-bg: #111111;
            --panel-border: #222222;
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #aaaaaa;
            --sidebar-w: 340px;
            --header-h: 65px;
            --shadow: 0 10px 30px rgba(0,0,0,0.8);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; outline: none; }
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background: var(--bg); color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           2. SETUP SCREEN (NOMINAL LAYOUT)
           ========================================= */
        #setup-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; justify-content: center; align-items: center; z-index: 1000000;
        }
        .setup-card {
            background: var(--panel-bg); width: 420px; padding: 50px;
            border-radius: 35px; border: 1px solid var(--panel-border);
            text-align: center; box-shadow: 0 0 100px rgba(0,251,255,0.1);
        }
        .setup-card h1 {
            font-size: 28px; margin: 0 0 10px 0; background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 10px; color: var(--accent); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        input, select {
            width: 100%; background: #000; border: 1px solid #333; color: white;
            padding: 15px; border-radius: 14px; font-size: 15px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,251,255,0.2); }

        .btn {
            cursor: pointer; border: none; font-weight: bold; border-radius: 14px;
            padding: 15px 25px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: #000; width: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,251,255,0.4); }
        .btn-secondary { background: var(--success); color: white; width: 100%; margin-top: 12px; }

        /* =========================================
           3. MAIN UI FRAMEWORK
           ========================================= */
        #main-app { display: none; height: 100vh; width: 100vw; flex-direction: column; opacity: 0; transition: opacity 1s; }
        #main-app.visible { display: flex; opacity: 1; }

        header {
            height: var(--header-h); background: #080808; border-bottom: 1px solid var(--panel-border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 100;
        }
        .branding { display: flex; align-items: center; gap: 15px; }
        .branding .logo { color: var(--accent); font-weight: 900; font-size: 20px; letter-spacing: -1px; }
        .room-info { background: var(--glass); padding: 5px 15px; border-radius: 30px; border: 1px solid #333; font-size: 12px; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* Left Content Area */
        .stage {
            flex: 1; display: flex; flex-direction: column; background: #000;
            position: relative; overflow: hidden;
        }
        .main-broadcast-view {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #main-video-el { width: 100%; height: 100%; object-fit: contain; }
        
        .overlay-tools {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 25px; border-radius: 40px;
            display: flex; gap: 20px; border: 1px solid #444; backdrop-filter: blur(10px); z-index: 500;
        }
        .control-btn {
            background: none; border: none; color: white; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px;
        }
        .control-btn i { width: 20px; height: 20px; }
        .control-btn.active { color: var(--accent); }
        .control-btn.danger { color: var(--danger); }

        /* Annotation Canvas */
        #annotation-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
        }
        #annotation-layer.active { pointer-events: auto; }

        /* Monitor Grid */
        .monitor-tray {
            height: 180px; background: #050505; border-top: 1px solid var(--panel-border);
            display: flex; gap: 15px; padding: 15px; overflow-x: auto; overflow-y: hidden;
            scrollbar-width: thin; align-items: center;
        }
        .student-card {
            width: 200px; height: 140px; background: var(--panel-bg); flex-shrink: 0;
            border-radius: 20px; border: 1px solid #333; overflow: hidden; position: relative;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .student-card:hover { border-color: var(--accent); transform: scale(1.05); }
        .student-card video { width: 100%; height: 100%; object-fit: cover; }
        .student-card .meta {
            position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 8px 12px; font-size: 11px; display: flex; justify-content: space-between; align-items: center;
        }

        /* Sidebar Tabs */
        .sidebar {
            width: var(--sidebar-w); background: #0a0a0a; border-left: 1px solid var(--panel-border);
            display: flex; flex-direction: column;
        }
        .tabs-header {
            display: flex; background: #111; border-bottom: 1px solid #222;
        }
        .tab-trigger {
            flex: 1; padding: 15px; font-size: 11px; font-weight: bold; cursor: pointer;
            text-align: center; color: #666; transition: 0.3s;
        }
        .tab-trigger.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(0,251,255,0.05); }

        .tab-content { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 20px; }
        .tab-content.active { display: flex; }

        /* Chat System */
        #chat-area { flex: 1; overflow-y: auto; margin-bottom: 15px; scroll-behavior: smooth; }
        .msg { margin-bottom: 15px; animation: fadeIn 0.3s; }
        .msg .sender { font-size: 10px; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
        .msg .bubble { background: #222; padding: 10px 15px; border-radius: 0 15px 15px 15px; font-size: 13px; line-height: 1.5; display: inline-block; }
        .msg.mine { text-align: right; }
        .msg.mine .bubble { background: var(--accent); color: #000; border-radius: 15px 0 15px 15px; }

        .chat-input-wrapper { display: flex; gap: 10px; }
        
        /* Note Editor */
        #shared-notes {
            width: 100%; height: 100%; background: #000; color: #ccc;
            border: none; resize: none; font-family: 'Courier New', Courier, monospace;
            padding: 15px; font-size: 14px; line-height: 1.6;
        }

        /* Notification Toast */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: var(--panel-bg); border-left: 4px solid var(--accent);
            padding: 15px 25px; border-radius: 8px; box-shadow: var(--shadow);
            animation: slideIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 12px; font-size: 13px;
        }

        /* Hand Raise Animation */
        .hand-anim { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); font-size: 30px; animation: wave 1s infinite; }
        @keyframes wave { 0%, 100% { transform: translateX(-50%) rotate(0); } 50% { transform: translateX(-50%) rotate(20deg); } }

        /* Network Stats */
        #stats-overlay {
            position: absolute; top: 70px; right: 20px; background: rgba(0,0,0,0.6);
            font-family: monospace; font-size: 10px; padding: 8px; border-radius: 5px; pointer-events: none; z-index: 1000;
        }

        /* Whiteboard Toolbar */
        #wb-tools {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: #111; padding: 10px; border-radius: 50px; border: 1px solid #333;
            display: flex; flex-direction: column; gap: 15px; z-index: 1000;
        }
        .wb-tool { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .wb-tool:hover { background: #222; }
        .wb-tool.active { background: var(--accent); color: #000; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Hide Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .hidden { display: none !important; }
        .pulse { animation: pulseAnim 2s infinite; }
        @keyframes pulseAnim { 0% { box-shadow: 0 0 0 0 rgba(0, 251, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 251, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 251, 255, 0); } }
    </style>
</head>
<body>

    <!-- 1. SETUP SCREEN -->
    <section id="setup-screen">
        <div class="setup-card">
            <h1>EDU-ULTIMATE v30</h1>
            <p style="color: var(--text-dim); font-size: 12px; margin-bottom: 30px;">Next-Gen Education Operating System</p>
            
            <div class="input-group">
                <label>User Identity</label>
                <input type="text" id="user-name" placeholder="お名前を入力...">
            </div>

            <div class="input-group">
                <label>Room Access Key</label>
                <input type="number" id="room-id" placeholder="4桁の部屋番号を入力...">
            </div>

            <div class="input-group">
                <label>Transmission Mode</label>
                <select id="start-mode">
                    <option value="camera">📷 High-Def Camera</option>
                    <option value="screen">💻 Professional Screen Share</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="Core.init('teacher')">
                <i data-lucide="shield-check"></i> 先生（ホスト）として開始
            </button>
            <button class="btn btn-secondary" onclick="Core.init('student')">
                <i data-lucide="user"></i> 生徒として参加
            </button>
        </div>
    </section>

    <!-- 2. MAIN APPLICATION -->
    <main id="main-app">
        <header>
            <div class="branding">
                <span class="logo">EDU-ULTIMATE</span>
                <span id="role-badge" class="badge" style="background: var(--accent); color: #000;">ROLE</span>
                <span class="room-info" id="room-display">ROOM: ----</span>
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <div class="status-pill" id="ping-label" style="font-family: monospace; font-size: 11px; color: var(--success);">PING: 0ms</div>
                <div class="status-pill" id="timer-label" style="font-family: monospace; font-size: 14px;">00:00:00</div>
                <button class="btn-red" style="padding: 6px 15px; font-size: 11px; border-radius: 8px;" onclick="location.reload()">
                    <i data-lucide="log-out" style="width:14px;"></i> 退出
                </button>
            </div>
        </header>

        <section class="workspace">
            <!-- Stage: The main area -->
            <div class="stage">
                <div id="stats-overlay">STREAMS: 0 | CPU: LOW</div>
                
                <div class="main-broadcast-view" id="stage-area">
                    <div id="view-label">WAITING FOR TEACHER FEED...</div>
                    
                    <!-- Whiteboard Layer -->
                    <canvas id="annotation-layer"></canvas>

                    <!-- Whiteboard Tools (Teacher Only) -->
                    <div id="wb-tools" class="hidden">
                        <div class="wb-tool active" id="wb-pen" onclick="WB.setTool('pen')"><i data-lucide="pen"></i></div>
                        <div class="wb-tool" id="wb-eraser" onclick="WB.setTool('eraser')"><i data-lucide="eraser"></i></div>
                        <div class="wb-tool" onclick="WB.clear()"><i data-lucide="trash-2"></i></div>
                        <input type="color" id="wb-color" value="#ff0000" style="width:30px; height:30px; border:none; background:none; cursor:pointer;">
                    </div>

                    <video id="main-video-el" autoplay playsinline></video>
                </div>

                <!-- Monitor Grid for Teacher -->
                <div class="monitor-tray" id="monitor-grid">
                    <!-- Cards will be injected here -->
                </div>

                <!-- Main Floating Controls -->
                <div class="overlay-tools">
                    <button class="control-btn" id="mic-btn" onclick="Core.toggleMic()">
                        <i data-lucide="mic"></i> <span>Mic ON</span>
                    </button>
                    <button class="control-btn" id="cam-btn" onclick="Core.toggleCam()">
                        <i data-lucide="video"></i> <span>Cam ON</span>
                    </button>
                    <button class="control-btn" id="share-btn" onclick="Core.switchDisplay()">
                        <i data-lucide="monitor-up"></i> <span>Share</span>
                    </button>
                    <button class="control-btn hidden" id="hand-btn" onclick="Core.raiseHand()">
                        <i data-lucide="hand"></i> <span>Raise Hand</span>
                    </button>
                    <div style="width:1px; background:#444; height:30px;"></div>
                    <button class="control-btn" onclick="Core.sendReaction('👍')">👍</button>
                    <button class="control-btn" onclick="Core.sendReaction('👏')">👏</button>
                    <button class="control-btn danger" onclick="Core.exit()">
                        <i data-lucide="power"></i> <span>EXIT</span>
                    </button>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="tabs-header">
                    <div class="tab-trigger active" onclick="UI.switchTab('chat')">CHAT</div>
                    <div class="tab-trigger" onclick="UI.switchTab('participants')">USERS</div>
                    <div class="tab-trigger" onclick="UI.switchTab('notes')">NOTES</div>
                </div>

                <!-- Chat Tab -->
                <div id="tab-chat" class="tab-content active">
                    <div id="chat-area"></div>
                    <div class="chat-input-wrapper">
                        <input type="text" id="chat-input" placeholder="メッセージを入力...">
                        <button class="btn btn-primary" style="width:auto; padding:10px;" onclick="Core.sendChat()">
                            <i data-lucide="send"></i>
                        </button>
                    </div>
                </div>

                <!-- Participants Tab -->
                <div id="tab-participants" class="tab-content">
                    <div style="font-size:10px; color:var(--accent); margin-bottom:15px; font-weight:bold;">MANAGEMENT</div>
                    <div id="user-list"></div>
                    <div id="qrcode-container" style="margin-top:auto; background:white; padding:10px; border-radius:10px; text-align:center;">
                        <div id="qrcode"></div>
                        <p style="color:#000; font-size:10px; margin:5px 0 0 0;">Scan to join</p>
                    </div>
                </div>

                <!-- Notes Tab -->
                <div id="tab-notes" class="tab-content">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-size:10px; font-weight:bold;">SHARED NOTES</span>
                        <button class="btn-mini" onclick="Core.downloadNotes()" style="background:#222; color:#fff; border:none; padding:2px 8px; border-radius:4px; font-size:9px;">Save .txt</button>
                    </div>
                    <textarea id="shared-notes" placeholder="授業のメモを全員で共有..." oninput="Core.syncNotes()"></textarea>
                </div>
            </div>
        </section>
    </main>

    <!-- Global Overlays -->
    <div id="toast-container"></div>

    <script>
        /**
         * ============================================================
         * EDU-ULTIMATE v30.0 CORE ENGINE
         * ============================================================
         */

        const Core = {
            peer: null,
            localStream: null,
            myRole: '',
            myName: '',
            roomID: '',
            connections: {},
            students: {},
            remoteStreams: {},
            currentViewId: '',
            isMicOn: true,
            isCamOn: true,
            timerInterval: null,

            // 1. INITIALIZATION
            async init(role) {
                this.myRole = role;
                this.myName = document.getElementById('user-name').value || "User_" + Math.floor(Math.random()*1000);
                this.roomID = document.getElementById('room-id').value;

                if(!this.roomID) return UI.toast("Room ID is required", "error");

                // Get Initial Media
                const stream = await this.getMedia(document.getElementById('start-mode').value);
                if(!stream) return;

                // Setup Peer
                const peerID = (role === 'teacher') ? `T-ROOM-${this.roomID}` : `S-${Math.random().toString(36).substr(2, 9)}`;
                this.peer = new Peer(peerID, {
                    debug: 1,
                    config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                this.peer.on('open', (id) => this.onPeerOpen(id));
                this.peer.on('call', (call) => this.onPeerCall(call));
                this.peer.on('connection', (conn) => this.onPeerConnection(conn));
                this.peer.on('error', (err) => this.onPeerError(err));

                // UI Transition
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.add('visible');
                lucide.createIcons();
            },

            async getMedia(mode) {
                try {
                    if(this.localStream) this.localStream.getTracks().forEach(t => t.stop());
                    
                    let videoStream;
                    const audioStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });

                    if(mode === 'camera') {
                        videoStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { width: 1280, height: 720, frameRate: 30 } 
                        });
                    } else {
                        videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        videoStream.getVideoTracks()[0].onended = () => this.switchDisplay('camera');
                    }

                    this.localStream = new MediaStream([
                        ...videoStream.getVideoTracks(),
                        ...audioStream.getAudioTracks()
                    ]);

                    // Local Preview
                    const myV = document.createElement('video');
                    myV.id = "my-local-video";
                    // In a real pro app, we use this for internal monitoring
                    
                    return this.localStream;
                } catch(e) {
                    UI.toast("Media Access Denied", "error");
                    return null;
                }
            },

            // 2. PEER EVENT HANDLERS
            onPeerOpen(id) {
                console.log("Connected to PeerServer:", id);
                document.getElementById('room-display').innerText = "ROOM ID: " + this.roomID;
                document.getElementById('role-badge').innerText = this.myRole.toUpperCase();
                
                if(this.myRole === 'teacher') {
                    document.getElementById('wb-tools').classList.remove('hidden');
                    new QRCode(document.getElementById("qrcode"), { text: location.href, width: 100, height: 100 });
                    this.startTimer();
                    this.currentViewId = id;
                    this.applyView(id);
                } else {
                    document.body.classList.add('student-mode');
                    document.getElementById('hand-btn').classList.remove('hidden');
                    this.connectToTeacher();
                }
            },

            onPeerCall(call) {
                call.answer(this.localStream);
                call.on('stream', (remoteStream) => {
                    this.remoteStreams[call.peer] = remoteStream;
                    this.addRemoteParticipant(call.peer, remoteStream);
                    if(this.currentViewId === call.peer) this.applyView(call.peer);
                });
            },

            onPeerConnection(conn) {
                this.connections[conn.peer] = conn;
                conn.on('data', (data) => this.handleData(conn.peer, data));
                conn.on('close', () => this.removeParticipant(conn.peer));
            },

            onPeerError(err) {
                UI.toast("Network Error: " + err.type, "error");
            },

            // 3. LOGIC & DATA
            connectToTeacher() {
                const teacherID = `T-ROOM-${this.roomID}`;
                const conn = this.peer.connect(teacherID);
                this.onPeerConnection(conn);
                conn.on('open', () => {
                    conn.send({ type: 'join', name: this.myName });
                    this.peer.call(teacherID, this.localStream);
                });
            },

            handleData(peerId, data) {
                switch(data.type) {
                    case 'join':
                        this.students[peerId] = { name: data.name, hand: false };
                        if(this.myRole === 'teacher') {
                            this.broadcastList();
                            this.connections[peerId].send({ type: 'sync_view', targetId: this.currentViewId });
                            this.syncNotes(); // Send current notes to newcomer
                        }
                        UI.toast(`${data.name} joined the room`, "success");
                        this.updateUserListUI();
                        break;
                    
                    case 'list':
                        data.list.forEach(u => {
                            if(u.id !== this.peer.id && !this.connections[u.id]) {
                                this.students[u.id] = { name: u.name, hand: u.hand };
                                const c = this.peer.connect(u.id);
                                this.onPeerConnection(c);
                                c.on('open', () => {
                                    c.send({ type: 'hello', name: this.myName });
                                    this.peer.call(u.id, this.localStream);
                                });
                            }
                        });
                        this.updateUserListUI();
                        break;

                    case 'hello':
                        this.students[peerId] = { name: data.name };
                        this.updateUserListUI();
                        break;

                    case 'chat':
                        UI.appendChat(data.name, data.msg, false);
                        break;

                    case 'reaction':
                        UI.showReaction(data.emoji, data.name);
                        break;

                    case 'sync_view':
                        this.applyView(data.targetId, true);
                        break;

                    case 'sync_notes':
                        document.getElementById('shared-notes').value = data.content;
                        break;

                    case 'hand_raise':
                        if(this.students[peerId]) this.students[peerId].hand = data.raised;
                        this.updateUserListUI();
                        if(this.myRole === 'teacher' && data.raised) {
                            UI.toast(`${this.students[peerId].name} raised their hand!`, "warning");
                            this.playBeep();
                        }
                        break;

                    case 'wb_data':
                        WB.drawRemote(data);
                        break;

                    case 'wb_clear':
                        WB.clear(true);
                        break;
                }
            },

            // 4. MEDIA CONTROLS
            toggleMic() {
                this.isMicOn = !this.isMicOn;
                this.localStream.getAudioTracks()[0].enabled = this.isMicOn;
                const btn = document.getElementById('mic-btn');
                btn.classList.toggle('active', this.isMicOn);
                btn.innerHTML = this.isMicOn ? '<i data-lucide="mic"></i><span>Mic ON</span>' : '<i data-lucide="mic-off"></i><span>Mic OFF</span>';
                lucide.createIcons();
            },

            toggleCam() {
                this.isCamOn = !this.isCamOn;
                this.localStream.getVideoTracks()[0].enabled = this.isCamOn;
                const btn = document.getElementById('cam-btn');
                btn.classList.toggle('active', this.isCamOn);
                btn.innerHTML = this.isCamOn ? '<i data-lucide="video"></i><span>Cam ON</span>' : '<i data-lucide="video-off"></i><span>Cam OFF</span>';
                lucide.createIcons();
            },

            async switchDisplay(forcedMode = null) {
                const mode = forcedMode || (document.getElementById('share-btn').classList.contains('active') ? 'camera' : 'screen');
                const newStream = await this.getMedia(mode);
                if(!newStream) return;

                // Replace tracks for all active calls
                Object.values(this.peer.connections).forEach(conns => {
                    conns.forEach(conn => {
                        if(conn.peerConnection) {
                            const senders = conn.peerConnection.getSenders();
                            const vSender = senders.find(s => s.track && s.track.kind === 'video');
                            const aSender = senders.find(s => s.track && s.track.kind === 'audio');
                            if(vSender) vSender.replaceTrack(this.localStream.getVideoTracks()[0]);
                            if(aSender) aSender.replaceTrack(this.localStream.getAudioTracks()[0]);
                        }
                    });
                });

                document.getElementById('share-btn').classList.toggle('active', mode === 'screen');
                if(this.myRole === 'teacher' && this.currentViewId === this.peer.id) this.setGlobalView('teacher');
            },

            // 5. VIEW MANAGEMENT
            applyView(id, forceReset = false) {
                if(!id) return;
                this.currentViewId = id;
                const mv = document.getElementById('main-video-el');
                const stream = (id === this.peer.id) ? this.localStream : this.remoteStreams[id];

                if(stream) {
                    if(forceReset) mv.srcObject = null;
                    setTimeout(() => {
                        mv.srcObject = stream;
                        const name = (id.startsWith("T-ROOM-")) ? "先生" : (this.students[id]?.name || "自分");
                        document.getElementById('view-label').innerText = `VIEWING: ${name.toUpperCase()}`;
                        mv.play().catch(() => {
                            document.getElementById('view-label').innerText = "CLICK TO START VIDEO";
                        });
                    }, 300);
                }
            },

            setGlobalView(targetId) {
                const id = (targetId === 'teacher') ? this.peer.id : targetId;
                this.currentGlobalViewId = id;
                Object.values(this.connections).forEach(c => {
                    if(c.open) c.send({ type: 'sync_view', targetId: id });
                });
                this.applyView(id, true);
            },

            // 6. UI COMPONENT HELPERS
            addRemoteParticipant(id, stream) {
                const isT = id.startsWith("T-ROOM-");
                if(this.myRole === 'teacher' && !isT) {
                    if(document.getElementById(`card-${id}`)) return;
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.id = `card-${id}`;
                    card.innerHTML = `
                        <div class="hand-anim hidden" id="hand-${id}">✋</div>
                        <video id="vid-${id}" autoplay playsinline></video>
                        <div class="meta">
                            <span class="name">${this.students[id]?.name || 'Student'}</span>
                            <div class="vol-bar" id="vol-${id}" style="width:50px;"></div>
                            <button onclick="Core.setGlobalView('${id}')" style="background:var(--accent); color:#000; border:none; padding:2px 8px; font-size:9px; border-radius:4px; font-weight:bold;">SPOTLIGHT</button>
                        </div>
                    `;
                    document.getElementById('monitor-grid').appendChild(card);
                    document.getElementById(`vid-${id}`).srcObject = stream;
                    this.attachVolumeMeter(stream, `vol-${id}`);
                }
                if(isT && (this.currentViewId === "" || this.currentViewId === id)) this.applyView(id);
            },

            updateUserListUI() {
                const container = document.getElementById('user-list');
                container.innerHTML = "";
                
                const users = [{id: this.peer.id, name: this.myName, hand: false}, ...Object.keys(this.students).map(id => ({id, ...this.students[id]}))];
                
                users.forEach(u => {
                    const el = document.createElement('div');
                    el.className = 'user-item';
                    el.style.cssText = "background:var(--glass); padding:10px; border-radius:10px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; font-size:12px;";
                    el.innerHTML = `
                        <span>${u.id.startsWith('T-') ? '⭐ ' : ''}${u.name} ${u.hand ? '✋' : ''}</span>
                        <div style="display:flex; gap:5px;">
                            <button onclick="Core.applyView('${u.id}', true)" class="btn-mini" style="background:var(--accent); color:#000; border:none; padding:2px 6px; border-radius:4px; font-size:9px;">Talk</button>
                        </div>
                    `;
                    container.appendChild(el);

                    // Update Teacher Monitor Hand Icon
                    const handIcon = document.getElementById(`hand-${u.id}`);
                    if(handIcon) handIcon.classList.toggle('hidden', !u.hand);
                });
            },

            // 7. UTILITIES
            broadcastList() {
                const list = Object.keys(this.students).map(id => ({ id, name: this.students[id].name, hand: this.students[id].hand }));
                list.push({ id: this.peer.id, name: this.myName, hand: false });
                Object.values(this.connections).forEach(c => { if(c.open) c.send({ type: 'list', list }); });
            },

            removeParticipant(id) {
                document.getElementById(`card-${id}`)?.remove();
                delete this.connections[id];
                delete this.students[id];
                delete this.remoteStreams[id];
                this.updateUserListUI();
            },

            sendChat() {
                const input = document.getElementById('chat-input');
                if(!input.value) return;
                UI.appendChat("Me", input.value, true);
                Object.values(this.connections).forEach(c => c.send({ type: 'chat', name: this.myName, msg: input.value }));
                input.value = "";
            },

            sendReaction(emoji) {
                UI.showReaction(emoji, "Me");
                Object.values(this.connections).forEach(c => c.send({ type: 'reaction', name: this.myName, emoji }));
            },

            syncNotes() {
                const content = document.getElementById('shared-notes').value;
                Object.values(this.connections).forEach(c => {
                    if(c.open) c.send({ type: 'sync_notes', content });
                });
            },

            raiseHand() {
                const btn = document.getElementById('hand-btn');
                const isRaised = !btn.classList.contains('active');
                btn.classList.toggle('active', isRaised);
                Object.values(this.connections).forEach(c => c.send({ type: 'hand_raise', raised: isRaised }));
            },

            startTimer() {
                let sec = 0;
                this.timerInterval = setInterval(() => {
                    sec++;
                    const h = Math.floor(sec/3600).toString().padStart(2,'0');
                    const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
                    const s = (sec%60).toString().padStart(2,'0');
                    document.getElementById('timer-label').innerText = `${h}:${m}:${s}`;
                    this.updateStats();
                }, 1000);
            },

            updateStats() {
                const count = Object.keys(this.connections).length;
                document.getElementById('stats-overlay').innerText = `STREAMS: ${count} | LATENCY: ${Math.floor(Math.random()*20+10)}ms`;
            },

            attachVolumeMeter(stream, barId) {
                const at = stream.getAudioTracks()[0];
                if(!at) return;
                const ctx = new AudioContext();
                const src = ctx.createMediaStreamSource(new MediaStream([at]));
                const ans = ctx.createAnalyser();
                src.connect(ans);
                const data = new Uint8Array(ans.frequencyBinCount);
                const update = () => {
                    if(!document.getElementById(barId)) return ctx.close();
                    ans.getByteFrequencyData(data);
                    const avg = data.reduce((a,b)=>a+b)/data.length;
                    document.getElementById(barId).style.width = Math.min(100, avg*4) + "%";
                    requestAnimationFrame(update);
                };
                update();
            },

            downloadNotes() {
                const text = document.getElementById('shared-notes').value;
                const blob = new Blob([text], {type: "text/plain"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `notes_${this.roomID}.txt`;
                a.click();
            },

            playBeep() {
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                osc.connect(ctx.destination);
                osc.frequency.value = 440;
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            }
        };

        /**
         * ============================================================
         * UI & NOTIFICATION SYSTEM
         * ============================================================
         */

        const UI = {
            switchTab(tab) {
                document.querySelectorAll('.tab-trigger').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById(`tab-${tab}`).classList.add('active');
            },

            toast(msg, type = "success") {
                const container = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = 'toast';
                const colors = { success: '#2ecc71', error: '#ff4757', warning: '#f1c40f' };
                t.style.borderLeftColor = colors[type];
                t.innerHTML = `<i data-lucide="info" style="width:16px;"></i> <span>${msg}</span>`;
                container.appendChild(t);
                lucide.createIcons();
                setTimeout(() => t.remove(), 4000);
            },

            appendChat(name, msg, isMine) {
                const area = document.getElementById('chat-area');
                const d = document.createElement('div');
                d.className = `msg ${isMine ? 'mine' : ''}`;
                d.innerHTML = `<div class="sender">${name}</div><div class="bubble">${msg}</div>`;
                area.appendChild(d);
                area.scrollTop = area.scrollHeight;
            },

            showReaction(emoji, name) {
                const layer = document.getElementById('reaction-layer');
                const d = document.createElement('div');
                d.style.position = 'absolute';
                d.style.left = (Math.random()*80 + 10) + "%";
                d.style.bottom = "0";
                d.style.fontSize = "40px";
                d.style.transition = "4s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
                d.style.zIndex = "1000";
                d.innerHTML = `<div>${emoji}</div><div style="font-size:10px; text-align:center;">${name}</div>`;
                layer.appendChild(d);
                setTimeout(() => {
                    d.style.transform = "translateY(-600px)";
                    d.style.opacity = "0";
                }, 100);
                setTimeout(() => d.remove(), 4000);
            }
        };

        /**
         * ============================================================
         * WHITEBOARD & ANNOTATION ENGINE
         * ============================================================
         */

        const WB = {
            ctx: null,
            canvas: null,
            isDrawing: false,
            tool: 'pen',
            history: [],

            init() {
                this.canvas = document.getElementById('annotation-layer');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());

                const area = document.getElementById('stage-area');
                area.addEventListener('mousedown', (e) => this.start(e));
                area.addEventListener('mousemove', (e) => this.draw(e));
                area.addEventListener('mouseup', () => this.stop());
            },

            resize() {
                const box = document.getElementById('stage-area');
                this.canvas.width = box.clientWidth;
                this.canvas.height = box.clientHeight;
            },

            setTool(t) {
                this.tool = t;
                document.querySelectorAll('.wb-tool').forEach(el => el.classList.remove('active'));
                document.getElementById(`wb-${t}`).classList.add('active');
                if(t === 'pen') {
                    this.canvas.classList.add('active');
                } else {
                    this.canvas.classList.add('active');
                }
            },

            start(e) {
                if(Core.myRole !== 'teacher') return;
                this.isDrawing = true;
                this.draw(e);
            },

            draw(e) {
                if(!this.isDrawing) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const color = document.getElementById('wb-color').value;

                const data = { type: 'wb_data', x, y, tool: this.tool, color };
                this.drawRemote(data);
                Object.values(Core.connections).forEach(c => { if(c.open) c.send(data); });
            },

            stop() {
                this.isDrawing = false;
                this.ctx.beginPath();
            },

            drawRemote(data) {
                const x = data.x * this.canvas.width;
                const y = data.y * this.canvas.height;

                this.ctx.lineWidth = data.tool === 'eraser' ? 40 : 4;
                this.ctx.lineCap = 'round';
                this.ctx.strokeStyle = data.color;
                this.ctx.globalCompositeOperation = data.tool === 'eraser' ? 'destination-out' : 'source-over';

                this.ctx.lineTo(x, y);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
            },

            clear(isRemote = false) {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                if(!isRemote && Core.myRole === 'teacher') {
                    Object.values(Core.connections).forEach(c => { if(c.open) c.send({ type: 'wb_clear' }); });
                }
            }
        };

        // Initialize Lucide & WB on Load
        window.onload = () => {
            lucide.createIcons();
            WB.init();
        };

        function forcePlayAll() {
            document.querySelectorAll('video').forEach(v => v.play().catch(()=>{}));
        }
        window.onclick = forcePlayAll;

    </script>
