<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDU-ULTIMATE v27.0 (The God Edition) - Fixed</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --accent: #00fbff; --bg: #050505; --panel: #151515; --danger: #ff4757; 
            --success: #2ecc71; --warning: #f1c40f; --text: #f0f0f0; --border: #2a2a2a;
        }
        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; height: 100vh; 
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* ログイン画面 */
        #setup-screen { 
            position: fixed; inset: 0; background: radial-gradient(circle, #222 0%, #000 100%); 
            display: flex; justify-content: center; align-items: center; z-index: 100000; 
        }
        .modal-box { 
            background: var(--panel); padding: 40px; border-radius: 30px; text-align: center; 
            width: 400px; border: 1px solid var(--border); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        input, select { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); 
            background: #000; color: white; box-sizing: border-box; font-size: 16px;
        }

        /* メインUI */
        #main-ui { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        #main-ui.active { display: flex; }

        header { 
            height: 60px; background: #111; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0;
        }
        .badge { font-size: 11px; padding: 4px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* 配信エリア */
        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .broadcast-container { 
            flex: 2; position: relative; display: flex; justify-content: center; align-items: center; 
            border-bottom: 2px solid var(--border); overflow: hidden; cursor: pointer;
        }
        #main-video { width: 100%; height: 100%; object-fit: contain; background: #000; transition: 0.3s; }
        #view-label { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 6px 15px; border-radius: 8px; border: 1px solid var(--accent); font-size: 12px; z-index: 30; backdrop-filter: blur(5px); }
        #drawing-canvas { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
        .reaction-layer { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }

        /* 監視グリッド */
        .monitor-grid { 
            height: 180px; display: flex; gap: 15px; padding: 10px 15px; overflow-x: auto; 
            background: #080808; border-top: 1px solid var(--border); flex-shrink: 0; align-items: center;
        }
        .card { 
            width: 170px; flex-shrink: 0; background: var(--panel); border-radius: 18px; 
            overflow: hidden; position: relative; border: 1px solid var(--border); transition: 0.2s;
        }
        .card video { width: 100%; height: 100px; object-fit: cover; background: #000; }

        /* サイドバー */
        .sidebar { 
            width: 320px; background: #111; border-left: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto; flex-shrink: 0;
        }
        .side-panel { background: var(--panel); border-radius: 20px; padding: 15px; border: 1px solid var(--border); }
        .panel-title { font-size: 11px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }

        /* ボタンデザイン */
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 12px; padding: 12px; transition: 0.2s; font-size: 13px; }
        button:active { transform: scale(0.95); }
        .btn-blue { background: #0097e6; color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; width: 100%; }
        .btn-red { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: black; width: 100%; }
        .btn-mini { padding: 5px 10px; font-size: 10px; border-radius: 8px; font-weight: bold; }

        /* リスト・チャット */
        .user-row { 
            background: #1a1a1a; padding: 10px 15px; border-radius: 12px; margin-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; border: 1px solid transparent;
        }
        #chat-msgs { flex: 1; background: #000; border-radius: 15px; padding: 12px; font-size: 13px; overflow-y: auto; min-height: 120px; border: 1px solid var(--border); }
        .vol-bar-container { height: 4px; background: #333; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .vol-bar { height: 100%; background: var(--success); width: 0%; transition: 0.1s; }
        
        /* 特殊エフェクト */
        .poll-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 20px; border: 2px solid var(--accent); z-index: 200000; display: none; width: 300px; text-align: center; }
        #status-notice { background: var(--danger); font-size: 11px; padding: 6px; border-radius: 8px; display: none; text-align: center; margin-top: 8px; font-weight: bold; }
        .hand-pulse { animation: hand-blink 0.8s infinite; border: 2px solid var(--warning) !important; }
        @keyframes hand-blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .floating-emoji {
            position: absolute; bottom: 0; font-size: 32px; animation: floatUp 3s ease-out forwards; pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-400px); opacity: 0; }
        }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<!-- 1. ログイン画面 -->
<div id="setup-screen">
    <div class="modal-box">
        <h2 style="margin-bottom:5px;">EDU-ULTIMATE v27</h2>
        <p style="font-size:11px; color:#888; margin-bottom:20px;">All-in-One Professional Education Tool</p>
        <input type="text" id="user-name" placeholder="あなたのお名前">
        <input type="number" id="room-id" placeholder="部屋ID (4桁)">
        <select id="start-mode">
            <option value="camera">📷 カメラモードで開始</option>
            <option value="screen">💻 画面共有モードで開始</option>
        </select>
        <button class="btn-blue" style="margin-bottom:10px;" onclick="startSession('teacher')">先生（ホスト）として開始</button>
        <button class="btn-green" onclick="startSession('student')">生徒として参加</button>
    </div>
</div>

<!-- 2. アンケート画面 -->
<div id="poll-box" class="poll-overlay">
    <h3 id="poll-q">アンケート</h3>
    <div id="poll-opts" style="display:flex; flex-direction:column; gap:10px;"></div>
</div>

<!-- 3. メインUI -->
<div id="main-ui">
    <header>
        <div style="display:flex; gap:12px; align-items:center;">
            <span id="role-tag" class="badge" style="background:var(--accent); color:black;">ROLE</span>
            <span id="timer" style="font-family:monospace; opacity:0.6;">00:00:00</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div id="room-display" style="font-size:14px; font-weight:bold; color:var(--accent);">ID: ----</div>
            <button class="btn-red" style="padding:5px 15px; font-size:11px;" onclick="location.reload()">退室</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="content-area">
            <div class="broadcast-container" onclick="forcePlay()">
                <div id="view-label">映像を待機中...</div>
                <div id="reaction-layer" class="reaction-layer"></div>
                <canvas id="drawing-canvas"></canvas>
                <video id="main-video" autoplay playsinline></video>
            </div>
            <div id="monitor-grid" class="monitor-grid"></div>
        </div>

        <div class="sidebar">
            <!-- 教員ツールパネル -->
            <div id="teacher-panel" class="side-panel hidden" style="border-color:#552222;">
                <div class="panel-title"><span>DIRECTOR TOOLS</span></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                    <button class="btn-green" style="font-size:10px;" onclick="cmdAllMic(true)">🎤 全員通話</button>
                    <button class="btn-red" style="font-size:10px;" onclick="cmdAllMic(false)">🔇 全員ミュ</button>
                </div>
                <button class="btn-warning" style="margin-bottom:10px;" onclick="toggleMediaMode()">💻 画面共有/カメラ切替</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                    <button class="btn-blue" style="font-size:10px;" onclick="toggleWB()">🎨 板書</button>
                    <button class="btn-blue" style="font-size:10px;" onclick="createPoll()">📊 投票</button>
                </div>
                <button class="btn-blue" style="width:100%; margin-bottom:10px;" onclick="handleRecord()" id="rec-btn">🔴 授業を録画</button>
                <div id="qrcode" style="background:white; padding:10px; border-radius:10px; display:flex; justify-content:center;"></div>
            </div>

            <!-- 生徒専用パネル -->
            <div id="student-panel" class="side-panel hidden">
                <button id="hand-btn" class="btn-warning" onclick="toggleHand()">✋ 先生に挙手・質問する</button>
            </div>

            <!-- 自己プレビュー -->
            <div class="side-panel">
                <div style="display:flex; gap:12px; align-items:flex-start;">
                    <div style="width:90px; position:relative;">
                        <video id="my-preview" autoplay playsinline muted style="width:100%; height:65px; object-fit:cover; border-radius:10px; background:#000; border:1px solid #333;"></video>
                        <div class="vol-bar-container"><div class="vol-bar" id="my-vol-bar"></div></div>
                    </div>
                    <div style="flex:1;">
                        <div id="my-name-label" style="font-size:13px; font-weight:bold; margin-bottom:5px;">User</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                            <button id="mic-btn" class="btn-red" onclick="toggleMic()" style="padding:6px; font-size:11px;">Mic OFF</button>
                            <button id="cam-btn" class="btn-green" onclick="toggleCam()" style="padding:6px; font-size:11px;">Cam</button>
                        </div>
                    </div>
                </div>
                <div id="status-notice">個別通話中（他は減音）</div>
            </div>

            <!-- クラスメイト(1対1会話) -->
            <div class="side-panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-title"><span>PARTICIPANTS</span></div>
                <div id="user-list-items" style="flex:1; overflow-y:auto;"></div>
            </div>

            <!-- チャット・リアクション -->
            <div class="side-panel" style="flex:1.2; display:flex; flex-direction:column; overflow:hidden;">
                <div id="chat-msgs"></div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="chat-input" placeholder="送信..." style="margin-bottom:0; padding:10px; font-size:12px;">
                    <button class="btn-blue" onclick="sendChat()" style="padding:0 15px;">Go</button>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:22px;">
                    <span style="cursor:pointer;" onclick="sendReact('👍')">👍</span>
                    <span style="cursor:pointer;" onclick="sendReact('👏')">👏</span>
                    <span style="cursor:pointer;" onclick="sendReact('❤️')">❤️</span>
                    <span style="cursor:pointer;" onclick="sendReact('😂')">😂</span>
                    <span style="cursor:pointer;" onclick="sendReact('😮')">😮</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- グローバル変数 ---
    let peer, localStream, myRole, myName, roomID;
    let connections = {}, students = {}, remoteStreams = {};
    let wbActive = false, wbCtx, drawing = false;
    let recorder, recordedChunks = [];
    let currentGlobalViewId = "", isHandRaised = false;
    let privateTalkPartnerId = null; // 個別通話相手のID
    let mediaMode = "camera";

    // --- 1. メディア管理 ---
    async function initMedia(mode) {
        mediaMode = mode;
        try {
            const audio = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
            let video;
            if (mode === 'screen') {
                video = await navigator.mediaDevices.getDisplayMedia({ video: true });
            } else {
                video = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            }
            localStream = new MediaStream([...video.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
            localStream.getAudioTracks().forEach(t => t.enabled = false); // 初期マイクOFF
            document.getElementById('my-preview').srcObject = localStream;
            setupVolMeter(localStream, 'my-vol-bar');
            return localStream;
        } catch (e) {
            alert("カメラ・マイクの使用を許可してください");
            return null;
        }
    }

    // --- 2. セッション開始 ---
    async function startSession(role) {
        myRole = role;
        myName = document.getElementById('user-name').value || (role === 'teacher' ? "先生" : "生徒");
        roomID = document.getElementById('room-id').value;
        if (!roomID) return alert("部屋IDを入力してください");

        const stream = await initMedia(document.getElementById('start-mode').value);
        if (!stream) return;

        const teacherID = `T-ROOM-${roomID}`;
        const myPeerID = (role === 'teacher') ? teacherID : `S-${Math.random().toString(36).substr(2, 8)}`;
        
        peer = new Peer(myPeerID, { debug: 1 });

        peer.on('open', id => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-ui').classList.add('active');
            document.getElementById('role-tag').innerText = role;
            document.getElementById('room-display').innerText = "ID: " + roomID;
            document.getElementById('my-name-label').innerText = myName;

            if (role === 'teacher') {
                document.getElementById('teacher-panel').classList.remove('hidden');
                new QRCode(document.getElementById("qrcode"), { text: location.href, width: 80, height: 80 });
                initWB();
                applyView(peer.id);
                startTimer();
            } else {
                document.getElementById('student-panel').classList.remove('hidden');
                joinRoom(teacherID);
            }
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => {
                remoteStreams[call.peer] = s;
                addRemoteUI(call.peer, s);
                if (call.peer.startsWith('T-ROOM') || currentGlobalViewId === call.peer) {
                    applyView(call.peer);
                }
            });
        });

        peer.on('connection', conn => setupDataConn(conn));
    }

    function joinRoom(tID) {
        const conn = peer.connect(tID);
        setupDataConn(conn);
        conn.on('open', () => {
            conn.send({ type: 'join', name: myName });
            peer.call(tID, localStream);
        });
    }

    function setupDataConn(conn) {
        connections[conn.peer] = conn;
        conn.on('data', data => {
            if (data.type === 'join') {
                students[conn.peer] = { name: data.name, hand: false };
                if (myRole === 'teacher') {
                    broadcastList();
                    conn.send({ type: 'sync-view', targetId: peer.id });
                    peer.call(conn.peer, localStream);
                }
                addChat("System", data.name + "さんが参加しました");
                updateListUI();
            }
            if (data.type === 'list') {
                data.list.forEach(u => {
                    if (u.id !== peer.id && !connections[u.id]) {
                        students[u.id] = { name: u.name, hand: u.hand };
                        const c = peer.connect(u.id);
                        setupDataConn(c);
                        c.on('open', () => {
                            c.send({ type: 'hello', name: myName });
                            peer.call(u.id, localStream);
                        });
                    }
                });
                updateListUI();
            }
            if (data.type === 'hello') { students[conn.peer] = { name: data.name }; updateListUI(); }
            if (data.type === 'chat') addChat(data.name, data.msg);
            if (data.type === 'sync-view') applyView(data.targetId);
            if (data.type === 'draw') drawRemote(data.x, data.y, data.isNew);
            if (data.type === 'hand') { students[conn.peer].hand = data.raised; updateListUI(); }
            if (data.type === 'mic-cmd') setMic(data.value);
            if (data.type === 'poll') showPoll(data);
            if (data.type === 'react') showFloatingEmoji(data.emoji);
        });
        conn.on('close', () => {
            delete connections[conn.peer]; delete students[conn.peer];
            if (document.getElementById(`card-${conn.peer}`)) document.getElementById(`card-${conn.peer}`).remove();
            updateListUI();
        });
    }

    // --- 3. ビデオ・音量制御 ---
    function applyView(id) {
        currentGlobalViewId = id;
        const mv = document.getElementById('main-video');
        const stream = (id === peer.id) ? localStream : remoteStreams[id];
        if (stream) {
            mv.srcObject = stream;
            mv.muted = (id === peer.id);
            const name = id.startsWith('T-ROOM') ? "先生" : (students[id]?.name || "参加者");
            document.getElementById('view-label').innerText = `${name} の映像を表示中`;
            mv.play().catch(()=>{});
        }
        if (myRole === 'teacher') {
            Object.values(connections).forEach(c => c.send({ type: 'sync-view', targetId: id }));
        }
    }

    function addRemoteUI(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div');
        card.className = 'card'; card.id = `card-${id}`;
        card.innerHTML = `
            <video id="v-${id}" autoplay playsinline></video>
            <div style="font-size:10px; padding:3px; text-align:center;">${students[id]?.name || 'User'}</div>
            <div class="vol-bar-container"><div class="vol-bar" id="vol-${id}"></div></div>
        `;
        card.onclick = () => { if(myRole === 'teacher') applyView(id); };
        document.getElementById('monitor-grid').appendChild(card);
        const vid = document.getElementById(`v-${id}`);
        vid.srcObject = stream;
        setupVolMeter(stream, `vol-${id}`);
    }

    function setAllVolume(vol, exceptId = null) {
        // メインビデオ
        const mv = document.getElementById('main-video');
        if (mv) {
            if (currentGlobalViewId !== peer.id && currentGlobalViewId !== exceptId) mv.volume = vol;
            else mv.volume = 1.0;
        }
        // 各生徒のカード内ビデオ
        Object.keys(remoteStreams).forEach(id => {
            const v = document.getElementById(`v-${id}`);
            if (v) {
                if (exceptId === null) v.volume = 1.0; // リセット
                else v.volume = (id === exceptId) ? 1.0 : vol;
            }
        });
    }

    // --- 4. 対話・会話ツール ---
    function togglePrivateTalk(id) {
        const notice = document.getElementById('status-notice');
        
        if (privateTalkPartnerId === id) {
            // 中断処理
            privateTalkPartnerId = null;
            notice.style.display = 'none';
            setAllVolume(1.0); // 音量を全員100%にリセット
            addChat("System", "個別会話を終了しました");
        } else {
            // 開始処理
            privateTalkPartnerId = id;
            notice.style.display = 'block';
            notice.innerText = `${students[id]?.name}と個別通話中`;
            setMic(true); // 自分のマイクをON
            setAllVolume(0.15, id); // 相手以外を減音
            addChat("System", students[id].name + "さんと個別会話を開始しました");
        }
        updateListUI(); // ボタンの「対話/中断」表示を更新
    }

    function setMic(val) {
        const t = localStream.getAudioTracks()[0];
        if (t) {
            t.enabled = val;
            const btn = document.getElementById('mic-btn');
            btn.innerText = val ? "Mic ON" : "Mic OFF";
            btn.className = val ? "btn-green" : "btn-red";
        }
    }
    function toggleMic() { const t = localStream.getAudioTracks()[0]; if(t) setMic(!t.enabled); }
    function toggleCam() { const t = localStream.getVideoTracks()[0]; if(t) { t.enabled = !t.enabled; document.getElementById('cam-btn').classList.toggle('btn-red', !t.enabled); } }
    function cmdAllMic(val) {
        Object.values(connections).forEach(c => c.send({ type: 'mic-cmd', value: val }));
        setMic(val);
    }

    // --- 5. ホワイトボード ---
    function initWB() {
        const canvas = document.getElementById('drawing-canvas');
        wbCtx = canvas.getContext('2d');
        const box = document.querySelector('.broadcast-container');
        canvas.width = box.clientWidth; canvas.height = box.clientHeight;
        box.onmousedown = (e) => { if(!wbActive) return; drawing = true; sendDraw(e.offsetX, e.offsetY, true); };
        box.onmousemove = (e) => { if(!drawing || !wbActive) return; sendDraw(e.offsetX, e.offsetY, false); };
        box.onmouseup = () => drawing = false;
        window.addEventListener('resize', () => { canvas.width = box.clientWidth; canvas.height = box.clientHeight; });
    }
    function toggleWB() {
        wbActive = !wbActive;
        document.getElementById('drawing-canvas').style.pointerEvents = wbActive ? 'auto' : 'none';
    }
    function sendDraw(x, y, isNew) {
        drawRemote(x, y, isNew);
        Object.values(connections).forEach(c => c.send({ type: 'draw', x, y, isNew }));
    }
    function drawRemote(x, y, isNew) {
        wbCtx.strokeStyle = "red"; wbCtx.lineWidth = 4; wbCtx.lineCap = "round";
        if (isNew) { wbCtx.beginPath(); wbCtx.moveTo(x, y); }
        else { wbCtx.lineTo(x, y); wbCtx.stroke(); }
    }

    // --- 6. 画面共有 ---
    async function toggleMediaMode() {
        let newStream;
        try {
            if (mediaMode === 'camera') {
                newStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                mediaMode = 'screen';
            } else {
                newStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                mediaMode = 'camera';
            }
            const newTrack = newStream.getVideoTracks()[0];
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => {
                    const sender = c.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(newTrack);
                });
            });
            const oldTrack = localStream.getVideoTracks()[0];
            localStream.removeTrack(oldTrack);
            localStream.addTrack(newTrack);
            document.getElementById('my-preview').srcObject = localStream;
            if (currentGlobalViewId === peer.id) applyView(peer.id);
        } catch(e) {}
    }

    // --- 7. その他機能 ---
    function updateListUI() {
        const container = document.getElementById('user-list-items');
        container.innerHTML = "";
        Object.keys(students).forEach(id => {
            const isTalking = (privateTalkPartnerId === id);
            const row = document.createElement('div');
            row.className = 'user-row ' + (students[id].hand ? 'hand-pulse' : '');
            row.innerHTML = `
                <span>${students[id].hand ? '✋ ' : ''}${students[id].name}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-mini btn-blue" onclick="applyView('${id}')">注目</button>
                    <button class="btn-mini ${isTalking ? 'btn-red' : 'btn-warning'}" onclick="togglePrivateTalk('${id}')">
                        ${isTalking ? '中断' : '対話'}
                    </button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function toggleHand() {
        isHandRaised = !isHandRaised;
        document.getElementById('hand-btn').className = isHandRaised ? "btn-red" : "btn-warning";
        Object.values(connections).forEach(c => c.send({ type: 'hand', raised: isHandRaised }));
    }

    function createPoll() {
        const q = prompt("質問:"); if(!q) return;
        const opts = prompt("選択肢(カンマ区切り):").split(",");
        const data = { type: 'poll', q, opts };
        Object.values(connections).forEach(c => c.send(data));
        showPoll(data);
    }
    function showPoll(data) {
        const box = document.getElementById('poll-box');
        document.getElementById('poll-q').innerText = data.q;
        const div = document.getElementById('poll-opts'); div.innerHTML = "";
        data.opts.forEach(o => {
            const b = document.createElement('button'); b.className = "btn-blue"; b.innerText = o;
            b.onclick = () => { box.style.display = 'none'; addChat("Poll", "回答: " + o); };
            div.appendChild(b);
        });
        box.style.display = 'block';
    }

    function handleRecord() {
        if (!recorder || recorder.state === 'inactive') {
            recordedChunks = [];
            recorder = new MediaRecorder(document.getElementById('main-video').srcObject);
            recorder.ondataavailable = e => recordedChunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lesson.webm'; a.click();
            };
            recorder.start();
            document.getElementById('rec-btn').innerText = "⏹ 停止";
        } else { recorder.stop(); document.getElementById('rec-btn').innerText = "🔴 録画"; }
    }

    function setupVolMeter(stream, barId) {
        const at = stream.getAudioTracks()[0]; if(!at) return;
        try {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(new MediaStream([at]));
            const ans = ctx.createAnalyser(); src.connect(ans);
            const data = new Uint8Array(ans.frequencyBinCount);
            const update = () => {
                if(!document.getElementById(barId)) return;
                ans.getByteFrequencyData(data);
                const avg = data.reduce((a,b)=>a+b)/data.length;
                document.getElementById(barId).style.width = Math.min(100, avg*3) + "%";
                requestAnimationFrame(update);
            };
            update();
        } catch(e){}
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        if(!input.value) return;
        addChat("自分", input.value);
        Object.values(connections).forEach(c => c.send({ type: 'chat', name: myName, msg: input.value }));
        input.value = "";
    }
    function addChat(n, m) {
        const d = document.createElement('div'); d.innerHTML = `<b style="color:var(--accent)">${n}:</b> ${m}`;
        const b = document.getElementById('chat-msgs'); b.appendChild(d); b.scrollTop = b.scrollHeight;
    }

    function sendReact(emoji) {
        showFloatingEmoji(emoji);
        Object.values(connections).forEach(c => c.send({ type: 'react', emoji }));
    }
    function showFloatingEmoji(emoji) {
        const layer = document.getElementById('reaction-layer');
        const el = document.createElement('div'); el.className = 'floating-emoji'; el.innerText = emoji;
        el.style.left = (Math.random()*80+10) + "%"; layer.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    function broadcastList() {
        const list = Object.keys(students).map(id => ({ id, name: students[id].name, hand: students[id].hand }));
        list.push({ id: peer.id, name: myName, hand: false });
        Object.values(connections).forEach(c => c.send({ type: 'list', list }));
    }

    function startTimer() {
        let s = 0; setInterval(() => {
            s++; const h = Math.floor(s/3600).toString().padStart(2,'0'), m = Math.floor((s%3600)/60).toString().padStart(2,'0'), v = (s%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${v}`;
        }, 1000);
    }

    function forcePlay() { document.querySelectorAll('video').forEach(v => v.play().catch(()=>{})); }
</script>
</body></html>
